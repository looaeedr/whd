name: Issue 127 R2 Latest Target Preflight
on:
  push:
    branches: [work/issue-127-ui-surfaces-scale-scroll-20260912-r2]
    paths:
      - .github/workflows/issue127-r2-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Lock latest production baseline
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync
          BASE=17741535032ed2158e524425af1ffacb89698c7b
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "$BASE"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "$BASE"
          git diff --quiet "$BASE" -- phase6_settings_panel.py fold_designer_bridge.py
      - name: Build evidence manifest
        run: |
          cat > /tmp/evidence.md <<'EOF'
          UI設計與去AI味
          執行開發任務
          phase6-gui-performance-integrity
          phase6-corner-3d-model-integrity
          Python測試實務
          性質導向測試
          diagnosing-bugs
          tdd
          驗證板件與DXF
          monitoring-remote-qa
          派工
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          EOF
      - name: Phase6 preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "#127 R2 latest-target replay：Dialog/Dropdown/Status/Scale/Scroll presentation-only；Status 只投影 authoritative cabinet/part/view；文字倍率 1.0/1.2/1.4；鍵盤/scroll/reachability；不得新增第二 state/cache，不改 geometry/projection/manufacturing/DXF/config/baseline；遵守 USER_VISIBLE_CHECKPOINT_GATE" \
            --changed-file docs/superpowers/verification/2026-09-12-issue127-r2-state.md \
            --changed-file tests/test_issue127_surfaces_scale_scroll.py \
            --changed-file .github/workflows/issue127-r2-preflight.yml \
            --evidence /tmp/evidence.md
