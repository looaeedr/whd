name: Issue 291 T3 Selector Reconciliation

on:
  push:
    branches:
      - refactor/issue291-gui-phase2-t3-selector-20260916

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile exact T3 selector/navigation LOC
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('gui.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text)
          host = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          methods = {
              n.name: n for n in host.body
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          # Exact T3 root responsibilities proven presentation/navigation-only.
          # Mixed state/geometry methods such as on_baseline_changed,
          # _apply_cabinet_family_for_current_model, setup_tab_* panels,
          # open_part_hole_editor and _open_unified_hole_editor are excluded.
          exact = (
              '_phase6_refresh_presence_ui',
              '_box_body_piece_label',
              '_box_body_piece_face_key',
              '_refresh_box_body_piece_tabs_2d',
              '_on_box_body_piece_2d_tab_changed',
              'on_box_body_piece_double_click',
          )

          exact_loc = 0
          delegate_loc = 0
          print(f'GUI_LINES={len(lines)}')
          print('=== exact T3 whole-method responsibility ===')
          for name in exact:
              node = methods[name]
              loc = node.end_lineno - node.lineno + 1
              exact_loc += loc
              # Compatibility-preserving root seam budget: decorator (when any),
              # def line, one return/delegate line. Static helpers get 4 lines max.
              seam = 4 if any(isinstance(d, ast.Name) and d.id == 'staticmethod' for d in node.decorator_list) else 3
              delegate_loc += seam
              print(f'{node.lineno:5d}-{node.end_lineno:<5d} LOC={loc:<4d} seam_budget={seam} {name}')

          setup = methods['setup_tab_z_ui']
          setup_src = ast.get_source_segment(text, setup) or ''
          block_start = setup_src.index('# 多件式箱身只占一個頂層「箱身」')
          block_end = setup_src.index('# 畫布 Frame', block_start)
          selector_block = setup_src[block_start:block_end]
          selector_block_loc = len(selector_block.rstrip().splitlines())
          # replacement is one call to the focused subtab builder.
          selector_seam = 1
          print(f'SETUP_TAB_Z_SELECTOR_BLOCK_LOC={selector_block_loc}')

          removable = exact_loc + selector_block_loc
          retained_seams = delegate_loc + selector_seam
          net_reduction = removable - retained_seams
          theoretical = len(lines) - net_reduction

          print(f'EXACT_T3_METHOD_LOC={exact_loc}')
          print(f'ROOT_DELEGATE_SEAM_BUDGET={delegate_loc}')
          print(f'EXACT_T3_SELECTOR_BLOCK_LOC={selector_block_loc}')
          print(f'NET_LEGAL_T3_REDUCTION={net_reduction}')
          print(f'THEORETICAL_T3_ROOT_LOC={theoretical}')

          # Fail closed: predecessor and responsibility accounting must stay exact.
          assert len(lines) == 8644, len(lines)
          assert theoretical > 7000, 'If this trips, the original 7000 gate became reachable and must be re-reviewed'
          PY
