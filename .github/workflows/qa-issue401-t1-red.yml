name: "QA #401 T1 scheduled-resume dispatcher RED"

on:
  push:
    branches:
      - continuity/issue401-scheduled-resume-dispatcher-20260920
    paths:
      - 'tests/process/test_issue401_scheduled_resume_dispatcher.py'
      - '.github/workflows/qa-issue401-t1-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD ee9aa71085cccbaa6fe241dd5f02066240197f0a)" = "ee9aa71085cccbaa6fe241dd5f02066240197f0a"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm intended T1 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue401_scheduled_resume_dispatcher.py --tb=short | tee /tmp/t1-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Eq "ImportError|ModuleNotFoundError" /tmp/t1-red.log
          echo "PASS EXPECTED_T1_RED=1"
