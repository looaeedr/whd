name: python-testing-practices-skill-qa-20260911

on:
  push:
    branches:
      - feat/add-python-testing-practices-zh-20260911
    paths:
      - '.agents/skills/engineering/Python測試實務/**'
      - '.agents/skills/engineering/README.md'
      - '.agents/skills/skill_registry.json'
      - 'tests/test_python_testing_practices_skill_contract.py'
      - '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'
      - 'release_required_artifacts.json'
      - '.github/workflows/python-testing-practices-skill-qa-20260911.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Snapshot config invariant
        run: sha256sum config.ini | tee /tmp/config.before

      - name: Knowledge Preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "寫技能：第三批新增中文 Python測試實務 Skill，更新 Registry、AI 規則、release policy，remote QA 驗證" \
            --changed-file '.agents/skills/engineering/Python測試實務/SKILL.md' \
            --changed-file '.agents/skills/engineering/README.md' \
            --changed-file '.agents/skills/skill_registry.json' \
            --changed-file 'tests/test_python_testing_practices_skill_contract.py' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' \
            --changed-file 'release_required_artifacts.json' \
            --changed-file '.github/workflows/python-testing-practices-skill-qa-20260911.yml' \
            --changed-file 'docs/superpowers/verification/2026-09-11-python-testing-practices-skill.md' \
            --evidence 'docs/superpowers/verification/2026-09-11-python-testing-practices-skill.md'

      - name: Third batch contracts and project guards
        run: |
          if [ -f tests/test_python_testing_practices_skill_contract.py ]; then
            pytest -q \
              tests/test_python_testing_practices_skill_contract.py \
              tests/test_chinese_skill_identity_contract.py \
              tests/test_writing_skill_contract.py \
              tests/test_writing_skill_preflight_route.py \
              tests/test_phase6_skill_preflight_gate.py \
              tests/test_phase6_release_packaging_policy.py \
              tests/test_release_integrity_gate.py
          else
            echo 'bootstrap: contract not created yet'
          fi

      - name: Verify config invariant and clean tree
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git diff --exit-code
