name: "QA #369 T5 2D corner view GREEN"

on:
  push:
    branches:
      - refactor/issue369-phase3-2d-corner-view-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_corner_data_view_adapter.py'
      - 'tests/test_issue369_t5_corner_data_view_owner.py'
      - '.github/workflows/qa-issue369-t5-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4137b62887c3dc20c6ee5bbd4d753f485dcaf23b HEAD
          echo "T5_BASELINE=4137b62887c3dc20c6ee5bbd4d753f485dcaf23b"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt

      - name: Compile T5 owners
        run: python -m py_compile phase6_corner_data_view_adapter.py fold_designer_bridge.py

      - name: Run T5 ownership contract
        run: python -m pytest -q tests/test_issue369_t5_corner_data_view_owner.py

      - name: Run headless 2D projection regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue95_corner_data_authoritative_parts.py             tests/test_issue96_corner_data_selection_lifecycle.py             tests/test_issue97_authoritative_unfold_view_adapter.py             tests/test_issue101_multidoor_corner_data_parity.py             tests/test_issue109_corner_data_boxbody_tree.py             tests/test_issue110_shared_info_projection.py             tests/test_canonical_unfolded_blank_info.py             tests/test_issue111_corner_data_grid_isolation.py

      - name: Run real-Tk 2D view regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_issue94_corner_data_navigation_mode.py             tests/test_issue119_corner_data_transition_ui.py             tests/test_issue162_unfold_viewport.py             tests/test_issue163_unfold_workspace_layout.py
