name: Receiving Spec RED Gate

on:
  push:
    branches:
      - red/20260906-receiving-door-baseplate-ui

permissions:
  contents: read

jobs:
  requirement-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib

      - name: Run requirement RED probes
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q tests/test_phase6_receiving_spec_red_20260906.py::test_red_rui1_medium_unlocked_settings_has_real_vertical_scroll_owner 2>&1 | tee requirement_red.log

      - name: Upload RED log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiving-spec-red-log
          path: requirement_red.log
