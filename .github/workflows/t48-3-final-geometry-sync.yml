name: T48-3 Divider Final Geometry Sync Probe

on:
  push:
    branches:
      - work/48-receiving-fw-divider-flush-relief-gate
    paths:
      - ".github/workflows/t48-3-final-geometry-sync.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Knowledge preflight
        shell: bash
        run: |
          mkdir -p logs
          cat > t48_3_preflight_evidence.txt <<'EOF'
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/07_Phase6尺寸語意與標準截角母規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          EOF
          python tools/phase6_skill_preflight.py             --task "Receiving Divider final geometry 2D 3D DXF save reload multi-piece regression remote QA"             --changed-file tests/test_issue48_final_geometry_sync.py             --changed-file fold_designer_bridge.py             --changed-file ae_engine/manufacturing_api.py             --evidence t48_3_preflight_evidence.txt             > logs/t48_3.preflight.txt
          cat logs/t48_3.preflight.txt
      - name: Compile
        run: python -m py_compile tests/test_issue48_final_geometry_sync.py
      - name: Targeted acceptance probe
        shell: bash
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_issue48_final_geometry_sync.py             tests/test_issue38_receiving_divider_baseline.py             tests/test_issue39_divider_relief.py             tests/test_phase6_t10_project_authority.py             | tee t48_3.log
          after="$(sha256sum config.ini | awk '{print $1}')"
          printf '{"config_before":"%s","config_after":"%s"}\n' "$before" "$after" > t48_3_state.json
          cat t48_3_state.json
          test "$before" = "$after"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t48-3-final-sync-${{ github.run_id }}
          path: |
            t48_3.log
            t48_3_state.json
            logs/t48_3.preflight.txt
