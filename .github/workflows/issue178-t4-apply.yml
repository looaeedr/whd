name: Issue178 T4 Apply Minimal Routing Fix

on:
  push:
    branches:
      - governance/issue178-domain-routing-20260913
    paths:
      - '.github/workflows/issue178-t4-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact T4 routing changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('.agents/skills/skill_registry.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          routes = data['routes']

          dimension_ref = '個人AI檔案庫/第二層_專案與SOP/07_Phase6尺寸語意與標準截角母規則.md'
          nav_rules = '個人AI檔案庫/第二層_專案與SOP/08_WHD截角資料與2D入口收斂規則.md'
          dm7_ref = '個人AI檔案庫/踩坑庫/dm7_part_navigation_pitfalls.md'

          by_id = {route['id']: route for route in routes}
          dim = by_id['dimension-semantics-analysis']
          if dimension_ref not in dim['required_references']:
              dim['required_references'].append(dimension_ref)

          if 'dm7-part-navigation' not in by_id:
              nav_route = {
                  'id': 'dm7-part-navigation',
                  'keywords': [
                      'DM7', 'Corner Data', '截角資料', '板件導覽',
                      'stale physical child', 'STALE_PHYSICAL_CHILD', 'RESTORE_CHILD_CONTEXT'
                  ],
                  'file_globs': ['.agents/skills/engineering/截角資料入口收斂/**'],
                  'required_skills': ['截角資料入口收斂'],
                  'required_references': [nav_rules, dm7_ref],
              }
              idx = next(i for i, route in enumerate(routes) if route['id'] == 'ui-design-de-ai')
              routes.insert(idx, nav_route)

          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          policy_path = Path('個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md')
          policy = policy_path.read_text(encoding='utf-8')
          marker = '## Domain route 必須包含 domain authority'
          if marker not in policy:
              policy += '''\n\n## Domain route 必須包含 domain authority\n\n- Phase6 Knowledge Preflight 的 domain route 必須在 `required_references` 直接列出該 domain 的 **current canonical authority**；全域踩坑庫或通用 Skill-authoring 規則只能補充，不能代替 domain Source of Truth。\n- dimension semantics route 至少必須載入 canonical `07_Phase6尺寸語意與標準截角母規則.md`。\n- DM7 / Corner Data / physical-part navigation route 必須載入 current navigation rule 與 `dm7_part_navigation_pitfalls.md`；stale child identity 不得靠 generic Skill policy 決定。\n- manufacturing / DXF acceptance route 必須載入 current `04_WHD鈑金展開幾何引擎規範.md`。\n- 缺少 domain authority evidence 時 Preflight 必須 fail closed；不能因 `08_WHD技能建立與修改規則.md` 或全域 06 已讀就 false GREEN。\n- 每個 domain route 都要有 regression，至少證明「缺 domain evidence → RED；補齊 → GREEN」，並保留既有 domain reference 不被後續 Registry 編輯移除。\n'''
              policy_path.write_text(policy, encoding='utf-8')
          PY
      - name: Commit exact changes
        shell: bash
        run: |
          git config user.name 'looaeedr'
          git config user.email '76246585+looaeedr@users.noreply.github.com'
          git add .agents/skills/skill_registry.json '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'governance: require canonical domain references in Preflight'
          git push origin HEAD:${GITHUB_REF_NAME}
