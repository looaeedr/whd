# trigger-after-valid-parent
name: Issue229 T3 Apply GREEN Docs

on:
  push:
    branches:
      - fix/issue229-t3-navigation-green-20260914
    paths:
      - '.github/workflows/issue229-t3-apply-green.yml'

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded documentation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          marker = 'EXECUTABLE_CONTINUITY_BRIDGE_V1'
          anchor = '### 0.1 知識載入優先級'
          assert marker not in text, 'bridge marker already present'
          assert text.count(anchor) == 1, 'AGENTS navigation anchor drifted'
          block = '''### 0.0.3.1 Executable Continuity finalization bridge

          <!-- EXECUTABLE_CONTINUITY_BRIDGE_V1 -->
          當任務具有 durable checkpoint、remote QA、runtime cut / resume，或準備宣告完成／關單時，`AGENTS.md` 只負責導向 `executable-continuity-controller`，不得在此複製第二套 controller state machine。Canonical executable 是 `tools/continuity_controller.py`；操作語意以 `.agents/skills/engineering/executable-continuity-controller/SKILL.md` 為準。

          正式 finalization 前必須對 authoritative checkpoint 實際執行 `python -m tools.continuity_controller assert-finalizable path/to/checkpoint.json`（`assert-finalizable`）。若 executable guard 尚未放行，就不得因文字進度、聊天結尾、部分 QA GREEN 或 runtime 視窗中斷而宣告完成；續工／remote polling 仍依 controller Skill 與對應領域 Skill 的既有權責執行。
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          text = text.replace(anchor, block + '\n\n' + anchor, 1)
          agents.write_text(text, encoding='utf-8')

          readme = Path('.agents/skills/engineering/README.md')
          nav = readme.read_text(encoding='utf-8')
          link = '[executable-continuity-controller](./executable-continuity-controller/SKILL.md)'
          nav_anchor = '- **[monitoring-remote-qa](./monitoring-remote-qa/SKILL.md)**\n'
          assert link not in nav, 'controller navigation already present'
          assert nav.count(nav_anchor) == 1, 'engineering README anchor drifted'
          nav_line = '- **[executable-continuity-controller](./executable-continuity-controller/SKILL.md)**: durable state / resume / finalization controller；本 README 只提供 navigation，權威語意仍由該 Skill 與 executable controller 擁有。\n'
          nav = nav.replace(nav_anchor, nav_anchor + nav_line, 1)
          readme.write_text(nav, encoding='utf-8')
          PY
      - name: Focused local GREEN before commit
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/knowledge/test_executable_continuity_routing_alignment.py -q
          git diff --check
      - name: Commit only the two production docs
        shell: bash
        run: |
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          python - <<'PY'
          import subprocess
          allowed = {'AGENTS.md', '.agents/skills/engineering/README.md'}
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          actual = {line[3:] for line in out.splitlines() if line.strip()}
          assert actual == allowed, f'unexpected changed files: {actual!r}'
          PY
          git config user.name 'looaeedr'
          git config user.email '76246585+looaeedr@users.noreply.github.com'
          git add -- AGENTS.md .agents/skills/engineering/README.md
          git commit -m 'docs(issue229): bridge executable continuity routing'
          git push origin HEAD:${GITHUB_REF_NAME}
