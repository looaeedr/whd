name: "QA #448 T6 Part Editor Owner Decision"

on:
  push:
    branches:
      - refactor/issue448-t6-part-editor-owner-20260921
    paths:
      - 'docs/superpowers/checkpoints/issue448-t6-preflight-evidence.txt'
      - 'docs/superpowers/checkpoints/issue448-t6-part-editor-census.md'
      - 'tests/test_issue448_part_editor_owner_decision.py'
      - '.github/workflows/qa-issue448-t6-part-editor-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 9ccd3f51dbda0a9096c2ec964aa69c803ee09238

jobs:
  t6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "派工 #448 T6 Part Editor owner decision remote QA：驗證 C_KEEP_BRIDGE_COMPATIBILITY、navigation/save outgoing/settings/shared-content/update-intent/profile persistence/physical-piece selection/render handoff 分權，以及 part identity、switch、profile reload、multipart physical child、render intent 零漂移。" \
            --changed-file docs/superpowers/checkpoints/issue448-t6-preflight-evidence.txt \
            --changed-file docs/superpowers/checkpoints/issue448-t6-part-editor-census.md \
            --changed-file tests/test_issue448_part_editor_owner_decision.py \
            --changed-file .github/workflows/qa-issue448-t6-part-editor-owner.yml \
            --evidence docs/superpowers/checkpoints/issue448-t6-preflight-evidence.txt

      - name: Exact lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/issue448-scope.txt
          python - <<'PY'
          from pathlib import Path
          paths=[x for x in Path('/tmp/issue448-scope.txt').read_text().splitlines() if x]
          allowed={
              'docs/superpowers/checkpoints/issue448-t6-preflight-evidence.txt',
              'docs/superpowers/checkpoints/issue448-t6-part-editor-census.md',
              'tests/test_issue448_part_editor_owner_decision.py',
              '.github/workflows/qa-issue448-t6-part-editor-owner.yml',
          }
          unexpected=sorted(set(paths)-allowed)
          assert not unexpected, f'ISSUE448_SCOPE_DRIFT={unexpected}'
          print('ISSUE448_SCOPE_DRIFT=0')
          print(f'ISSUE448_CHANGED_FILES={len(paths)}')
          PY

      - name: Compile T6 contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_issue448_part_editor_owner_decision.py

      - name: Headless owner and persistence contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue448_part_editor_owner_decision.py \
            tests/test_issue365_t1_workspace_navigation_controller.py \
            tests/test_dm7_part_navigation.py \
            tests/test_phase6_designer_workspace.py \
            tests/test_phase6_workspace_projection.py \
            tests/test_profile_layer_preservation.py \
            tests/test_phase6_project_file.py \
            --tb=short | tee /tmp/issue448-headless.log
          grep -Eq '[0-9]+ passed' /tmp/issue448-headless.log
          echo 'T6_OWNER_CONTRACT=GREEN'

      - name: Real Tk switch profile multipart and shared-slot regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_designer_workspace.py \
            tests/test_issue44_box_body_physical_piece_identity.py \
            tests/test_phase6_receiving_multipart_integration.py \
            tests/test_issue431_shared_content_host.py \
            tests/test_issue432_general_part_shared_host.py \
            tests/test_issue433_assembly_shared_host.py \
            tests/test_issue434_corner_data_shared_host.py \
            --tb=short | tee /tmp/issue448-xvfb.log
          grep -Eq '[0-9]+ passed' /tmp/issue448-xvfb.log
          echo 'PART_IDENTITY_DRIFT=0'
          echo 'PART_SWITCH_BEHAVIOR_DRIFT=0'
          echo 'PROFILE_SAVE_RELOAD_DRIFT=0'
          echo 'MULTIPART_PHYSICAL_CHILD_DRIFT=0'
          echo 'SHARED_CONTENT_MOUNT_DRIFT=0'

      - name: Update intent routing source guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          bridge=Path('fold_designer_bridge.py')
          source=bridge.read_text(encoding='utf-8')
          tree=ast.parse(source)
          fn=next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name=='_fix11_activate_part')
          attrs=[
              n.func.attr for n in ast.walk(fn)
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute)
          ]
          assert attrs.count('submit_update_intent') == 1
          assert '_phase6_execute_update_intents' not in (ast.get_source_segment(source, fn) or '')
          router=Path('gui_modules/application/command_router.py').read_text(encoding='utf-8')
          assert 'def submit_fold_designer_update_intent' in router
          assert 'class _Phase6UpdateScheduler' in router
          print('RENDER_INTENT_DRIFT=0')
          print('UPDATE_SCHEDULER_OWNER=command_router')
          PY

      - name: NO production owner mutation and protected invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -e phase6_part_editor_session.py
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            fold_designer_bridge.py \
            phase6_designer_workspace.py \
            phase6_workspace_navigation_controller.py \
            phase6_workspace_state.py \
            phase6_project_controller.py \
            phase6_project_file.py \
            gui_modules/application/command_router.py \
            gui_modules/application/fold_designer_adapter.py \
            ae_engine \
            config.ini \
            '*.dxf'
          echo 'DECISION=C_KEEP_BRIDGE_COMPATIBILITY'
          echo 'PRODUCTION_OWNER_DRIFT=0'
          echo 'PROJECT_PERSISTENCE_OWNERSHIP_DRIFT=0'
          echo 'GEOMETRY_OWNER_DRIFT=0'
          echo 'DXF_DRIFT=0'
          echo 'CONFIG_GIT_OBJECT_INVARIANT=1'

      - name: Bounded acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo "ISSUE=448"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "BASE_SHA=$BASE_SHA"
            echo "DECISION=C_KEEP_BRIDGE_COMPATIBILITY"
          } >> "$GITHUB_STEP_SUMMARY"
