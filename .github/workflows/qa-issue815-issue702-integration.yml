name: "WHD｜#815｜#702 A7 fresh-X integration acceptance"
run-name: "WHD｜#815｜#702 RED-STOP-16..24 + original governance Combined Acceptance"

on:
  push:
    branches:
      - integration/issue815-issue702-a7-20260927

permissions:
  contents: read

jobs:
  fault-matrix:
    name: "A7 fresh-X fault matrix and cross-entry Combined Acceptance"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout #815 integration branch"
        uses: actions/checkout@v4
      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install Combined Acceptance dependencies"
        run: python -m pip install pytest
      - name: "Run RED-STOP-16..24 and original governance regression"
        run: >-
          python -m pytest -q
          tests/process/test_issue687_stop_eligibility_machine_gate.py
          tests/process/test_issue688_ticket_closure_owner_contract.py
          tests/process/test_issue689_takeover_substantive_action_gate.py
          tests/process/test_issue690_closure_drift_classification.py
          tests/process/test_issue691_turn_exit_scheduler_end_parity.py
          tests/process/test_issue692_governance_parity_gate.py
          tests/process/test_issue696_startup_authorization_purpose.py
          tests/process/test_issue697_operation_transaction_core.py
          tests/process/test_issue698_remote_guard_durable_readback_parity.py
          tests/process/test_issue699_turn_exit_poweroff_issue_close_recovery.py
          tests/process/test_issue700_claim_activation_crash_reentry.py
          tests/process/test_issue701_scheduler_state_reconciliation.py
          tests/process/test_issue702_crash_fault_injection_matrix.py
