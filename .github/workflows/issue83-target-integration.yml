name: Issue83 Target Integration Acceptance
on:
  push:
    branches: [merge/issue83-on-latest-target]
    paths:
      - ae_engine/**
      - fold_designer_bridge.py
      - phase6_box_body_structure.py
      - phase6_fold_profiles.py
      - tests/test_dm1_divider_physical_contract.py
      - tests/test_dm3_divider_canonical_relief_contract.py
      - tests/test_dm4_divider_resolved_sinks.py
      - tests/test_issue39_divider_relief.py
      - tests/test_issue63_regression_red.py
      - tests/test_issue71_divider_relief_components.py
      - tests/test_issue74_divider_side_front_penetration.py
      - tests/test_issue83_divider_cross_registry.py
      - tests/test_receiving_side_panel_outside_defaults.py
      - .github/workflows/issue83-target-integration.yml

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Compile integrated production modules
        run: |
          python -m py_compile \
            ae_engine/sheetmetal_geometry.py \
            ae_engine/certified_relief_registry.py \
            ae_engine/divider_manufacturing.py \
            ae_engine/manufacturing_api.py \
            ae_engine/cabinet_types/receiving.py \
            ae_engine/box_body_structure.py \
            fold_designer_bridge.py \
            phase6_box_body_structure.py
      - name: Combined Issue83 plus target Issue84 guards
        run: |
          pytest -q -s \
            tests/test_dm1_divider_physical_contract.py \
            tests/test_dm3_divider_canonical_relief_contract.py \
            tests/test_dm4_divider_resolved_sinks.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue63_regression_red.py \
            tests/test_issue71_divider_relief_components.py \
            tests/test_issue74_divider_side_front_penetration.py \
            tests/test_issue83_divider_cross_registry.py \
            tests/test_receiving_side_panel_outside_defaults.py
      - name: Integrated authority scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receiving = Path("ae_engine/cabinet_types/receiving.py").read_text(encoding="utf-8")
          divider = Path("ae_engine/divider_manufacturing.py").read_text(encoding="utf-8")
          bridge = Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          data = json.loads(Path("基準檔/截角資料庫/certified_relief_rules.json").read_text(encoding="utf-8"))
          rule = next(r for r in data["rules"] if r["rule_id"] == "RECEIVING_DIVIDER_CROSS_STANDARD_V1")
          assert rule["corner_type"] == "CROSS"
          assert rule["cross_parameters"]["slot_end_selector"] == "OBJECT_MATING_FOLD_SIGN_NEGATIVE"
          assert "CERTIFIED_REGISTRY_CROSS_PARAMETERS" in divider
          assert "_divider_object_mating_fold_signs" in divider
          assert "zl1" in receiving and "-24.0" in receiving
          assert "side_rear_bend_dimension_space" in receiving
          assert "_phase6_is_side_back_editable_piece_key" in bridge
          print("ISSUE83_TARGET_INTEGRATION_AUTHORITY_SCAN=PASS")
          PY
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
