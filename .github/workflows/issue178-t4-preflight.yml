name: Issue178 T4 Preflight

on:
  push:
    branches:
      - governance/issue178-domain-routing-20260913
    paths:
      - '.github/workflows/issue178-t4-preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record protected invariants before
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run changed-file Knowledge Preflight
        shell: bash
        run: |
          cat > /tmp/issue178-evidence.txt <<'EOF'
          寫技能
          Python測試實務
          phase6-release-packaging
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task 'T4 Registry domain reference routing governance regression and remote QA' \
            --changed-file '.agents/skills/skill_registry.json' \
            --changed-file 'tests/knowledge/test_skill_registry_domain_reference_contract.py' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' \
            --changed-file '.github/workflows/issue178-t4-qa.yml' \
            --evidence /tmp/issue178-evidence.txt
      - name: Verify protected invariants
        if: always()
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baseline.before /tmp/baseline.after
