name: WHD Extended Memory Observation

on:
  pull_request:
    branches: [localX]
    paths:
      - '.github/workflows/whd-extended-memory-observation.yml'

permissions:
  contents: read

jobs:
  long-memory-observation:
    name: 30-cycle real Tk memory observation (one process per topology)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TZ: Asia/Taipei
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: TkAgg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt matplotlib psutil
      - name: Capture runner metadata
        shell: bash
        run: |
          mkdir -p work/perf/extended
          {
            echo "kind=LINUX_RUNNER_EXTENDED_MEMORY_NOT_WINDOWS_UAT"
            echo "head_sha=$(git rev-parse HEAD)"
            uname -a
            lscpu
            python -V
            python -m pip freeze
            sha256sum config.ini tools/whd_performance_baseline.py
          } > work/perf/extended/environment.txt
      - name: Run 30 complete GUI edit/preview cycles in each retained process
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            python tools/whd_performance_baseline.py --samples 1 --cycles 30 \
            --memory-interval-ms 50 --output work/perf/extended/memory.json
      - name: Print honest same-process RSS trend
        if: always()
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          p = Path('work/perf/extended/memory.json')
          if not p.exists():
              print('EXTENDED_MEMORY_MISSING')
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              print('HEAD:',d['metadata']['source_sha'])
              print('CYCLES:',d['metadata']['cycles'])
              print('ROWS:',len(d['rows']))
              print('FAILURES:',sum(r['status']!='ok' for r in d['rows']))
              for trend in d['memory_trends']:
                  bay,worker=trend['bays'],trend['worker_sample']
                  points=[r['rss_after'] for r in d['rows']
                          if r['bays']==bay and r['worker_sample']==worker
                          and r['operation']=='return_3d' and r['status']=='ok']
                  if not points: continue
                  warm=points[:10]
                  late=points[-10:]
                  print('BAYS:',bay,'CYCLES:',len(points),
                        'START_MIB:',round(points[0]/2**20,2),
                        'END_MIB:',round(points[-1]/2**20,2),
                        'EARLY10_MEDIAN_MIB:',round(statistics.median(warm)/2**20,2),
                        'LATE10_MEDIAN_MIB:',round(statistics.median(late)/2**20,2),
                        'DELTA_MIB:',round(trend['delta_bytes']/2**20,2),
                        'THIS_IS_AN_OBSERVATION_NOT_LEAK_PROOF')
          PY
      - name: Preserve raw operation trace and worker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whd-issue1816-extended-rss
          path: work/perf/extended/
          if-no-files-found: error
          retention-days: 14
