name: WHD Product Regression

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
      - localX
    paths:
      - 'ae_engine/**'
      - 'gui_modules/**'
      - 'phase6_*.py'
      - 'fold_designer_bridge.py'
      - 'tests/**'
      # Governance-only test changes must not trigger the product suite.
      - '!tests/knowledge/**'
      - '!tests/governance/**'
      - '!tests/process/test_change_lane_gate.py'
      - '!tests/process/test_localx_publish_gate.py'
      - '!tests/test_phase6_skill_preflight_gate.py'
      - 'tools/phase6_bridge_anti_regrowth_guard.py'
      - 'tools/product_ci_regression.py'
      - 'tools/product_ci_green_reuse.py'
      - 'docs/architecture/phase6_bridge_anti_regrowth_baseline.json'
      - 'docs/superpowers/checkpoints/issue532-c0-final-classification.json'
      - '.github/workflows/whd-product-regression.yml'

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  product-regression:
    name: Canonical Product Regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Revalidate prior GREEN after target drift
        id: green-reuse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/product_ci_green_reuse.py \
            --repo "${GITHUB_REPOSITORY}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: Record reused GREEN evidence
        if: steps.green-reuse.outputs.reuse == 'true'
        shell: bash
        run: |
          {
            echo "## Canonical Product Regression"
            echo
            echo "**GREEN_REUSED_NO_RETEST**"
            echo
            echo 'Prior exact candidate GREEN was revalidated against the new production X base.'
            echo 'Candidate patch identity is unchanged, target drift is path-disjoint, and no dependency/test-contract impact was detected.'
            echo
            echo 'Evidence:'
            echo '~~~json'
            echo '${{ steps.green-reuse.outputs.evidence }}'
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install product test dependencies
        if: steps.green-reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Run canonical root/CI product regression
        if: steps.green-reuse.outputs.reuse != 'true'
        shell: bash
        run: python tools/product_ci_regression.py
