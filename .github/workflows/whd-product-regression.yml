name: WHD Product Regression

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
      - localX
    paths:
      - 'ae_engine/**'
      - 'gui_modules/**'
      - 'phase6_*.py'
      - 'fold_designer_bridge.py'
      - 'tests/**'
      # Governance-only test changes must not trigger the product suite.
      - '!tests/knowledge/**'
      - '!tests/governance/**'
      - '!tests/process/test_change_lane_gate.py'
      - '!tests/process/test_localx_publish_gate.py'
      - '!tests/test_phase6_skill_preflight_gate.py'
      - 'tools/phase6_bridge_anti_regrowth_guard.py'
      - 'tools/product_ci_regression.py'
      - 'tools/product_ci_green_reuse.py'
      - 'tools/ci_bounded_install.py'
      - 'tools/whd_v15_acceptance_evidence.py'
      - 'docs/architecture/phase6_bridge_anti_regrowth_baseline.json'
      - 'docs/superpowers/checkpoints/issue532-c0-final-classification.json'
      - '.github/workflows/whd-product-regression.yml'

# Keep independent PRs parallel; superseded SHA runs of one PR are obsolete.
concurrency:
  group: whd-product-regression-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: Asia/Taipei

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read


jobs:
  prepare:
    name: Product Regression Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.green-reuse.outputs.reuse }}
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout trusted production timezone policy
        uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          path: trusted-timezone-policy
          persist-credentials: false
      - name: Load trusted production timezone guard for pre-publish candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s trusted-timezone-policy/tools/change_lane_gate.py
          test -s trusted-timezone-policy/tools/localx_publish_gate.py
          cp trusted-timezone-policy/tools/change_lane_gate.py tools/change_lane_gate.py
          cp trusted-timezone-policy/tools/localx_publish_gate.py tools/localx_publish_gate.py
      - name: Taiwan timezone hard gate for CI and changed Python sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.change_lane_gate import require_taipei_timezone, require_new_code_taipei
          print("TAIWAN_TIMEZONE_HARD_GATE_PASS " + require_taipei_timezone())
          print("new_python_lines_checked=" + str(require_new_code_taipei(
              Path("."),
              "${{ github.event.pull_request.base.sha }}",
              "${{ github.event.pull_request.head.sha }}",
          )))
          PY

      - name: Revalidate prior GREEN after target drift
        id: green-reuse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/product_ci_green_reuse.py \
            --repo "$GITHUB_REPOSITORY" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"

  test-shard:
    name: Product Shard (${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Preparation is independently bounded. The 30-minute job budget
      # remains available for product tests instead of a hung package mirror.
      - name: Refresh APT index (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_bounded_install.py --label apt-index --attempts 2 --timeout-seconds 120 -- \
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
      - name: Install Xvfb (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_bounded_install.py --label xvfb --attempts 2 --timeout-seconds 120 -- \
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq xvfb
      - name: Upgrade pip separately (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_bounded_install.py --label pip-upgrade --attempts 2 --timeout-seconds 90 -- \
            python -m pip install --retries 3 --timeout 20 --upgrade pip
      - name: Install Python product dependencies (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_bounded_install.py --label pip-product --attempts 2 --timeout-seconds 240 -- \
            python -m pip install --retries 3 --timeout 20 -r requirements.txt pytest matplotlib ezdxf
      - name: Verify exact test dependency imports
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import ezdxf, matplotlib, pytest, shapely, tkinter; print("CI_TEST_IMPORTS_PASS")'
      - name: Run exact canonical regression shard
        shell: bash
        run: |
          set -euo pipefail
          python tools/product_ci_regression.py \
            --shard-count 4 \
            --shard-index "${{ matrix.shard }}" \
            --junit-out "shard-${{ matrix.shard }}.xml"
      - name: Publish shard JUnit for mandatory full acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whd-ci-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  product-regression:
    name: Canonical Product Regression
    needs: [prepare, test-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail closed on missing preflight or shard GREEN
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.prepare.result }}
          REUSE: ${{ needs.prepare.outputs.reuse }}
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT_RESULT" = success
          if [ "$REUSE" = true ]; then
            test "$SHARDS_RESULT" = skipped
            echo 'GREEN_REUSED_NO_RETEST — target drift evidence validated'
          else
            test "$SHARDS_RESULT" = success
            echo 'ALL_FOUR_SHARDS_GREEN — verifying combined canonical CPR/AC'
          fi
      - name: Checkout exact PR candidate for acceptance verification
        if: needs.prepare.outputs.reuse != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python for CPR/AC verifier
        if: needs.prepare.outputs.reuse != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical collection dependencies (bounded retry)
        if: needs.prepare.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_bounded_install.py --label pip-canonical --attempts 2 --timeout-seconds 240 -- \
            python -m pip install --retries 3 --timeout 20 -r requirements.txt pytest matplotlib ezdxf
      - name: Verify canonical dependency imports
        if: needs.prepare.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import ezdxf, matplotlib, pytest, shapely; print("CI_CANONICAL_IMPORTS_PASS")'
      - name: Fetch every successful shard JUnit (isolated bounded retries)
        if: needs.prepare.outputs.reuse != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p junit
          # A combined actions/download-artifact request can lose one blob
          # even when each shard uploaded a valid JUnit. Download by explicit
          # artifact name from this exact run; never reuse another run's proof.
          for shard in 0 1 2 3; do
            ok=false
            for attempt in 1 2 3; do
              rm -f "junit/shard-${shard}.xml"
              echo "CI_JUNIT_DOWNLOAD_START shard=${shard} attempt=${attempt}/3 run=${GITHUB_RUN_ID}"
              if timeout 120s gh run download "${GITHUB_RUN_ID}" \
                   --repo "${GITHUB_REPOSITORY}" \
                   --name "whd-ci-shard-${shard}" --dir junit \
                   && test -s "junit/shard-${shard}.xml"; then
                ok=true
                echo "CI_JUNIT_DOWNLOAD_PASS shard=${shard} attempt=${attempt}"
                break
              fi
              echo "CI_JUNIT_DOWNLOAD_RETRY shard=${shard} attempt=${attempt}"
              sleep "${attempt}"
            done
            if [ "${ok}" != true ]; then
              echo "::error::CI_JUNIT_DOWNLOAD_FAILED shard=${shard} run=${GITHUB_RUN_ID}"
              exit 1
            fi
          done
          test -s junit/shard-0.xml
          test -s junit/shard-1.xml
          test -s junit/shard-2.xml
          test -s junit/shard-3.xml
      - name: Merge and verify every canonical case and all 52 CPR/AC rows
        if: needs.prepare.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/product_ci_regression.py \
            --shard-count 4 \
            --merge-junit junit/shard-0.xml \
            --merge-junit junit/shard-1.xml \
            --merge-junit junit/shard-2.xml \
            --merge-junit junit/shard-3.xml \
            --junit-out combined-canonical-regression.xml
      - name: Publish fully verified canonical JUnit
        if: needs.prepare.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whd-canonical-complete-junit
          path: combined-canonical-regression.xml
          if-no-files-found: error
          retention-days: 7
