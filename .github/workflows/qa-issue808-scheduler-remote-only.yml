name: QA Issue 808 Scheduler Remote Only

on:
  push:
    branches:
      - governance/issue808-scheduler-remote-only-20260927

jobs:
  scheduler-remote-only-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run scheduler simulation contract
        run: python -m pytest -q tests/process/test_scheduler_simulation_skill_contract.py
