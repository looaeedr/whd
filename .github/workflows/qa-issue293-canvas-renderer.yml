name: QA issue293 canvas renderer GREEN

on:
  push:
    branches:
      - refactor/issue293-canvas-renderer-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal GUI wiring
        run: python tools/qa_issue293_canvas_renderer_green.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Verify syntax and focused GREEN
        run: python -m py_compile gui.py gui_modules/editors/hole_editor_render.py && python -m pytest -q tests/test_issue293_t5_canvas_renderer_slice.py tests/test_issue293_t5_feature_factory_slice.py tests/test_issue293_t5_indicator_fit_validation_slice.py
      - name: Commit GREEN after verification
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add gui.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No GUI wiring changes to commit."
          else
            git commit -m "refactor(#293): extract canvas renderer"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
