name: WHD｜#621 A5｜Collision Owners 最終驗收
run-name: WHD｜#621 A5｜精確版本遠端驗收｜${{ github.sha }}

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - .github/workflows/qa-issue621-a5-final.yml

permissions:
  contents: read

concurrency:
  group: issue621-a5-final
  cancel-in-progress: false

jobs:
  acceptance:
    name: A5｜Collision、Divider、EndCap、Registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTED_SHA: 5f363ed246f2edf89e0cebad38f6d0d8ad24f33f
    steps:
      - name: 反讀固定 TESTED_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝驗收相依套件
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 鎖定 TESTED_SHA、ORCHESTRATION_SHA 與受保護輸入
        shell: bash
        run: |
          set -euo pipefail
          echo "ORCHESTRATION_SHA=${{ github.sha }}"
          echo "TESTED_SHA=${TESTED_SHA}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          sha256sum config.ini > /tmp/issue621-config-before.sha256
          find 基準檔 -type f -iname '*.dxf' -print0 | sort -z | xargs -0 -r sha256sum > /tmp/issue621-dxf-before.sha256
          test -s /tmp/issue621-dxf-before.sha256

      - name: 執行 P7-R-E 結構與 anti-regrowth 驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue621-structural.xml \
            tests/test_issue621_phase7_a5_collision_owners.py \
            tests/test_manufacturing_collision_dependency.py \
            tests/test_clean_break_layout.py \
            tests/process/test_issue533_c1_anti_regrowth.py

      - name: 執行 Generic collision／Divider relief 驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue621-divider.xml \
            tests/test_assembly_collision.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue63_regression_red.py \
            tests/test_issue71_divider_relief_components.py \
            tests/test_dm3_divider_canonical_relief_contract.py \
            tests/test_issue41_persistence_parity.py

      - name: 執行 EndCap world relief／Registry 驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue621-endcap.xml \
            tests/test_assembly_collision_integration.py \
            tests/test_certified_relief_registry.py \
            tests/test_certified_relief_runtime_contract.py \
            tests/test_phase6_assembly_intent_registry_matrix.py \
            tests/test_rebuild_t4_solver_graph_authority.py \
            tests/test_resolved_manufacturing_bridge.py

      - name: 驗證受保護輸入未被修改
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/issue621-config-after.sha256
          find 基準檔 -type f -iname '*.dxf' -print0 | sort -z | xargs -0 -r sha256sum > /tmp/issue621-dxf-after.sha256
          diff -u /tmp/issue621-config-before.sha256 /tmp/issue621-config-after.sha256
          diff -u /tmp/issue621-dxf-before.sha256 /tmp/issue621-dxf-after.sha256
          echo "ISSUE621_PROTECTED_INPUTS_GREEN=1"

      - name: 上傳 #621 A5 驗收證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue621-a5-final-${{ github.sha }}
          path: |
            issue621-structural.xml
            issue621-divider.xml
            issue621-endcap.xml
          if-no-files-found: warn
          retention-days: 14
