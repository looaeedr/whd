name: Chinese Skill Identity Check 2026-09-10

on:
  push:
    branches:
      - chore/normalize-chinese-skill-names-20260910
    paths:
      - .github/workflows/chinese-skill-identity-check-20260910.yml
      - tests/test_chinese_skill_identity_contract.py
      - tests/test_dxf_skill_scope_contract.py

permissions:
  contents: read

jobs:
  chinese-skill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "修改所有中文資料夾技能 name 為資料夾名稱並檢查修正內容；修改DXF不是本專案技能" \
            --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md" \
            --changed-file ".agents/skills/engineering/寫成規格書/SKILL.md" \
            --changed-file ".agents/skills/engineering/拆解任務工單/SKILL.md" \
            --changed-file ".agents/skills/engineering/拷問邊建立文件/SKILL.md" \
            --changed-file ".agents/skills/engineering/掃描深模組/SKILL.md" \
            --changed-file ".agents/skills/engineering/程式碼庫設計/SKILL.md" \
            --changed-file ".agents/skills/engineering/領域建模/SKILL.md" \
            --changed-file ".agents/skills/engineering/驗證板件與DXF/SKILL.md" \
            --changed-file ".agents/skills/productivity/深度質詢/SKILL.md" \
            --changed-file ".agents/skills/engineering/程式碼庫設計/DESIGN-IT-TWICE.md" \
            --changed-file ".agents/skills/engineering/README.md" \
            --changed-file ".agents/skills/productivity/README.md" \
            --changed-file ".agents/skills/engineering/ask-matt/SKILL.md" \
            --changed-file "個人AI檔案庫/第二層_專案與SOP/07_WHD技能發現與掃描深模組規則.md" \
            --changed-file "個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md" \
            --changed-file "release_required_artifacts.json" \
            --changed-file "tests/test_chinese_skill_identity_contract.py" \
            --changed-file "tests/test_dxf_skill_scope_contract.py" \
            --evidence "docs/superpowers/verification/2026-09-10-chinese-skill-identity-preflight.md"
      - name: Final skill regression matrix
        run: |
          python -m pytest -q \
            tests/test_chinese_skill_identity_contract.py \
            tests/test_dxf_skill_scope_contract.py \
            tests/test_writing_skill_contract.py \
            tests/test_writing_skill_preflight_route.py \
            tests/test_dispatching_skill_timeout_contract.py \
            .agents/skills/engineering/掃描深模組/tests/test_skill_sources_zh_tw.py \
            .agents/skills/engineering/掃描深模組/tests/test_check_zh_tw_report.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_phase6_release_packaging_policy.py \
            tests/test_release_integrity_gate.py
