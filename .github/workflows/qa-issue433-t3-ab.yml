name: "QA #433 T3 A-B qualification"

on:
  push:
    branches:
      - refactor/issue433-t3-assembly-shared-host-20260920
    paths:
      - '.github/workflows/qa-issue433-t3-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 0cafc232da774019f2b5f1ae818315095f0a56bf
  TESTED_SHA: 4bea390c5c9130abd07f58666a997605ce4da646

jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight orchestration
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #433 T3 Assembly list mounted into the same shared-content host. A/B qualification only; preserve the existing Phase 5 Assembly panel owner, visibility vars, collapse state, multipart hierarchy, Final Scene ports, and Structure Tree shared vars." \
            --changed-file tests/test_issue433_assembly_shared_host.py \
            --changed-file .github/workflows/qa-issue433-t3-ab.yml \
            --evidence docs/superpowers/checkpoints/issue433-t3-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require exact predecessor production blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA:fold_designer_bridge.py")" = "$(git rev-parse "$TESTED_SHA:fold_designer_bridge.py")"
          test "$(git rev-parse "$BASE_SHA:phase6_assembly_panel.py")" = "$(git rev-parse "$TESTED_SHA:phase6_assembly_panel.py")"
          echo "PRODUCTION_BRIDGE_EXACT_PREDECESSOR=1"
          echo "ASSEMBLY_PANEL_MODULE_EXACT_PREDECESSOR=1"
          echo "PRODUCTION_RUNTIME_EDIT=0"

  inherited-assembly-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Exact inherited Assembly behavior parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue433-ab
          TESTS=(
            tests/test_issue384_assembly_only_function_presentation.py
            tests/test_issue376_assembly_collapsible_data.py
          )
          run_one() {
            label="$1"
            ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            xvfb-run -a python -m pytest -q "${TESTS[@]}" --tb=short \
              --json-report --json-report-file="/tmp/issue433-ab/$label.json" \
              >"/tmp/issue433-ab/$label.log" 2>&1
          }
          run_one baseline "$BASE_SHA"
          run_one candidate "$TESTED_SHA"

          python - <<'PY'
          import json
          from pathlib import Path

          ALLOWED_SKIP = {
              "tests/test_issue376_assembly_collapsible_data.py::test_box_body_physical_piece_rows_are_also_collapsible_when_present"
          }

          def load(label):
              data=json.loads(Path(f"/tmp/issue433-ab/{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}

          b=load("baseline")
          c=load("candidate")
          print("BASELINE_COUNTS", {x:list(b.values()).count(x) for x in sorted(set(b.values()))})
          print("CANDIDATE_COUNTS", {x:list(c.values()).count(x) for x in sorted(set(c.values()))})
          assert b == c, "T3 candidate inherited Assembly outcomes differ from predecessor"
          assert len(b) == 6
          assert {n for n,o in b.items() if o=="failed"} == set()
          assert {n for n,o in b.items() if o=="skipped"} <= ALLOWED_SKIP
          print("ASSEMBLY_AB_EXACT_OUTCOME_PARITY=1")
          print("ASSEMBLY_CANDIDATE_ONLY_FAILURES=0")
          PY

      - name: Upload inherited Assembly A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue433-t3-inherited-assembly-ab
          path: /tmp/issue433-ab

  t3-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Re-run exact candidate T3 gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TESTED_SHA" >/dev/null
          xvfb-run -a python -m pytest -q tests/test_issue433_assembly_shared_host.py --tb=short
          echo "ASSEMBLY_PANEL_HOST_IS_SHARED_HOST=true"
          echo "SEPARATE_ASSEMBLY_REGION=0"
          echo "ASSEMBLY_WIDGET_TREE_COUNT_WHEN_ACTIVE=1"
          echo "ASSEMBLY_WIDGET_TREE_COUNT_WHEN_INACTIVE=0"
          echo "VISIBILITY_SEMANTIC_DRIFT=0"
          echo "COLLAPSE_SEMANTIC_DRIFT=0"
          echo "T3_ALREADY_GREEN_AFTER_T1=1"

  accepted:
    runs-on: ubuntu-latest
    needs: [source-guard, inherited-assembly-ab, t3-candidate]
    steps:
      - name: T3 A-B accepted
        run: |
          echo "T3_AB_QUALIFICATION_GREEN=1"
          echo "BASE_SHA=$BASE_SHA"
          echo "TESTED_SHA=$TESTED_SHA"
