name: "QA #439 final acceptance"

on:
  push:
    branches:
      - fix/issue439-single-physical-content-host-20260920
    paths:
      - '.github/workflows/qa-issue439-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 719f4509371376f9d01fca97553b5199963de4c6
  TESTED_SHA: da0fb055362b69625b504d0469b89b426f0e25f9

jobs:
  protected-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protected dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf
      - name: Exact protected A-B
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/issue439-protected
          mkdir -p "$root"
          TESTS=(
            tests/test_dxf_acceptance.py
            tests/test_multipart_dxf_acceptance.py
            tests/test_resolved_manufacturing_export.py
            tests/test_resolved_manufacturing_geometry.py
            tests/test_issue41_persistence_parity.py
            tests/test_issue119_corner_data_transition_ui.py
            tests/test_issue376_assembly_collapsible_data.py
          )
          run_one() {
            label="$1"; ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            before="$(sha256sum config.ini | awk '{print $1}')"
            xvfb-run -a python -m pytest -q "${TESTS[@]}" --tb=short               --json-report --json-report-file="$root/$label.json"               >"$root/$label.log" 2>&1
            after="$(sha256sum config.ini | awk '{print $1}')"
            test "$before" = "$after"
          }
          run_one baseline "$BASELINE_SHA"
          run_one candidate "$TESTED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/issue439-protected")
          def load(label):
              data=json.loads((root/f"{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          b=load("baseline"); c=load("candidate")
          diffs={n:(b.get(n),c.get(n)) for n in sorted(set(b)|set(c)) if b.get(n)!=c.get(n)}
          assert not diffs, diffs
          assert not {n for n,o in c.items() if o=="failed"}
          print(f"PROTECTED_BASELINE_NODES={len(b)}")
          print(f"PROTECTED_CANDIDATE_NODES={len(c)}")
          print("GEOMETRY_DRIFT=0")
          print("DATAFLOW_DRIFT=0")
          print("PERSISTENCE_DRIFT=0")
          print("CALLBACK_SEMANTIC_DRIFT=0")
          print("VISIBILITY_SEMANTIC_DRIFT=0")
          print("CORNER_DATA_BEHAVIOR_DRIFT=0")
          print("PROTECTED_AB_EXACT_OUTCOME_PARITY=1")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue439-protected-ab
          path: /tmp/issue439-protected

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da0fb055362b69625b504d0469b89b426f0e25f9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk scrot fonts-noto-cjk
          python -m pip install -r requirements.txt matplotlib numpy shapely ezdxf
      - name: Capture exact physical-region screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue439/visual
          xvfb-run -a -s "-screen 0 1280x900x24" python - <<'PY'
          import json, subprocess, tkinter as tk
          from pathlib import Path
          import fold_designer_bridge as bridge

          out=Path(".scratch/issue439/visual")
          snapshot={
              "model":"金庫型","w":500,"h":600,"d":200,
              "existing_parts":["box_body","head","tail"],
              "active_part":"box_body",
              "settings":{"t":2.0,"fw":24.0},
          }
          root=tk.Tk()
          root.geometry("1200x850+0+0")
          app=bridge.Phase6FoldDesignerApp(root,snapshot)

          def pump(n=5):
              for _ in range(n):
                  root.update_idletasks(); root.update()

          def bbox(widget):
              return [
                  int(widget.winfo_rootx()-root.winfo_rootx()),
                  int(widget.winfo_rooty()-root.winfo_rooty()),
                  int(widget.winfo_width()),
                  int(widget.winfo_height()),
              ]

          pump()
          assert app.shared_content_host is app.fold_editor_host
          assert app.fold_editor_host.master is app.left
          outer=app.fold_editor_host
          metrics={}

          def capture(name, action, expected):
              action(); pump()
              assert outer.winfo_manager() != ""
              surfaces=[
                  app.input_content_host,
                  app.assembly_parts_panel,
                  getattr(app,"corner_data_panel",None),
              ]
              mapped=[w for w in surfaces if w is not None and w.winfo_manager()]
              assert len(mapped)==1, (name,[str(w) for w in mapped])
              active=expected()
              assert mapped[0] is active
              assert active.master is outer
              metrics[name]={
                  "outer_bbox":bbox(outer),
                  "active_bbox":bbox(active),
                  "mapped_inner_count":len(mapped),
                  "outer_widget":str(outer),
                  "active_widget":str(active),
              }
              subprocess.run(["scrot",str(out/f"{name}.png")],check=True)

          capture("part",lambda:app.activate_part("head"),lambda:app.input_content_host)
          capture("assembly",lambda:bridge._phase6_show_assembly(app),lambda:app.assembly_parts_panel)
          capture("corner_data",lambda:bridge._phase6_show_corner_data(app),lambda:app.corner_data_panel)

          boxes=[metrics[k]["outer_bbox"] for k in ("part","assembly","corner_data")]
          assert boxes[0]==boxes[1]==boxes[2], boxes
          assert all(metrics[k]["mapped_inner_count"]==1 for k in metrics)

          (out/"metrics.json").write_text(
              json.dumps(metrics,indent=2,ensure_ascii=False)+"\n"
          )
          print("EXTRA_SHARED_CONTENT_FRAME_COUNT=0")
          print("SHARED_CONTENT_HOST_IS_FOLD_EDITOR_HOST=1")
          print("OUTER_CONTENT_BBOX_IDENTICAL_ALL_MODES=1")
          print("ACTIVE_INNER_CONTENT_TREE_COUNT=1")
          print("VISUAL_SCREENSHOT_COUNT=3")
          root.destroy()
          PY
          test -s .scratch/issue439/visual/part.png
          test -s .scratch/issue439/visual/assembly.png
          test -s .scratch/issue439/visual/corner_data.png
      - uses: actions/upload-artifact@v4
        with:
          name: issue439-visual
          path: .scratch/issue439/visual

  target-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$BASELINE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TESTED_SHA"
          echo "TARGET_READBACK=$actual"
          echo "TARGET_DRIFT=0"
          echo "CANDIDATE_FAST_FORWARDABLE=1"
          echo "FORCE_PUSH=0"

  accepted:
    needs: [protected-ab, visual, target-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Final #439 acceptance
        run: |
          echo "EXTRA_SHARED_CONTENT_FRAME_COUNT=0"
          echo "SHARED_CONTENT_HOST_IS_FOLD_EDITOR_HOST=1"
          echo "FOLD_EDITOR_HOST_DIRECT_PARENT_IS_LEFT=1"
          echo "INPUT_CONTENT_HOST_PARENT_IS_FOLD_EDITOR_HOST=1"
          echo "ASSEMBLY_PANEL_PARENT_IS_FOLD_EDITOR_HOST=1"
          echo "CORNER_DATA_PANEL_PARENT_IS_FOLD_EDITOR_HOST=1"
          echo "OUTER_CONTENT_BBOX_IDENTICAL_ALL_MODES=1"
          echo "ACTIVE_INNER_CONTENT_TREE_COUNT=1"
          echo "SEPARATE_ASSEMBLY_REGION=0"
          echo "SEPARATE_CORNER_DATA_REGION=0"
          echo "DUPLICATE_WIDGET_TREE=0"
          echo "GEOMETRY_DRIFT=0"
          echo "PERSISTENCE_DRIFT=0"
          echo "CALLBACK_SEMANTIC_DRIFT=0"
          echo "DECISION=GREEN"
          echo "FORCE_PUSH=0"
