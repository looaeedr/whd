name: Issue 291 T3 Structural

on:
  push:
    branches:
      - refactor/issue291-gui-phase2-t3-selector-20260916

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run T3 structural contract
        run: python -m pytest -q tests/test_issue291_gui_phase2_t3_selector.py
