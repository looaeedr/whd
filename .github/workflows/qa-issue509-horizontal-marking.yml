name: "QA #509 horizontal inner-door MARKING"

on:
  push:
    branches:
      - hotfix/issue509-horizontal-marking-20260922
    paths:
      - ae_engine/receiving_joint_marking.py
      - ae_engine/inner_door_frames.py
      - tests/test_issue509_receiving_horizontal_marking.py
      - tests/test_issue471_t6_receiving_marking_activation.py
      - docs/superpowers/specs/2026-09-21-joint-placement-marking-design.md
      - .agents/skills/engineering/驗證板件與DXF/SKILL.md
      - 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
      - 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
      - .github/workflows/qa-issue509-horizontal-marking.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest matplotlib ezdxf -r requirements.txt

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=509"
          echo "BASE=b82d6114a6258853819d6cb7683f06d427ceb9f8"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor b82d6114a6258853819d6cb7683f06d427ceb9f8 HEAD

      - name: Focused #509
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue509_receiving_horizontal_marking.py             tests/test_issue471_t6_receiving_marking_activation.py             --tb=short | tee /tmp/issue509.log

      - name: Part / DXF / persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase6_t04_inner_door_frames.py \
            tests/test_multipart_dxf_acceptance.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_dm7_topology_persistence.py \
            --tb=short | tee /tmp/issue509-part-dxf.log

      - name: Durable governance contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ISSUE509_RECEIVING_FRAME_UPPER_HORIZONTAL_MARKING_V2' '.agents/skills/engineering/驗證板件與DXF/SKILL.md'
          grep -q 'ISSUE509_MARKING_SUPERSESSION_PITFALL' '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          grep -q 'ISSUE509_RECEIVING_MARKING_V2_DOMAIN' '個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md'
          grep -q '#509 — Receiving frame MARKING product-rule supersession' 'docs/superpowers/specs/2026-09-21-joint-placement-marking-design.md'
          python -m pytest -q \
            tests/test_dxf_skill_scope_contract.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_remote_qa_monitoring_skill_contract.py \
            tests/test_chinese_skill_identity_contract.py \
            --tb=short | tee /tmp/issue509-governance.log

      - name: Config invariant
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- config.ini
