name: Issue292 T4 Box Body Slice

on:
  push:
    branches:
      - refactor/issue292-gui-phase2-t4-panels-20260916
    paths:
      - '.github/workflows/issue292-t4-box-body-slice.yml'
      - 'tests/test_issue292_t4_box_body_slice.py'
      - 'tests/test_issue292_gui_phase2_t4_part_panels.py'
      - 'tests/test_issue291_gui_phase2_t3_selector.py'
      - 'gui.py'
      - 'gui_modules/parts/panels/box_body.py'
      - 'gui_modules/parts/subtabs.py'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile extraction boundary
        run: python -m py_compile gui.py gui_modules/parts/panels/box_body.py
      - name: Run box-body slice and accepted T3 control
        run: >-
          python -m pytest -q
          tests/test_issue292_t4_box_body_slice.py
          tests/test_issue291_gui_phase2_t3_selector.py
      - name: Require only aggregate T4 residual gates to remain RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue292_gui_phase2_t4_part_panels.py > t4.log 2>&1
          rc=$?
          set -e
          cat t4.log
          test "$rc" -ne 0
          test "$(grep -c '^FAILED ' t4.log)" -eq 2
          grep -Fq 'test_moved_root_methods_are_absent_or_thin_delegates' t4.log
          grep -Fq 'test_gui_meets_reconciled_t4_root_gate' t4.log
          ! grep -Fq "'setup_tab_z_ui':" t4.log
