name: Issue304 Governance Metadata Repair

on:
  push:
    branches:
      - ci-sharding/issue304-t0-baseline-20260916
    paths:
      - '.github/workflows/issue304-governance-metadata-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ci-sharding/issue304-t0-baseline-20260916

      - name: Repair only non-MIRROR canonical metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expected = {
              'docs/superpowers/plans/2026-09-16-issue304-t0-baseline.md':
                  'whd_canonical: docs/superpowers/plans/2026-09-16-issue304-t0-baseline.md',
              'docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-design.md':
                  'whd_canonical: docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-design.md',
              'docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-revision-notes.md':
                  'whd_canonical: docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-revision-notes.md',
          }
          for rel, old in expected.items():
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'EXPECTED_METADATA_NOT_FOUND: {rel}')
              if text.count(old) != 1:
                  raise SystemExit(f'EXPECTED_METADATA_NOT_UNIQUE: {rel}')
              text = text.replace(old, 'whd_canonical: null', 1)
              path.write_text(text, encoding='utf-8')
              print(f'REPAIRED {rel}')
          PY

          git diff --check
          git diff -- \
            docs/superpowers/plans/2026-09-16-issue304-t0-baseline.md \
            docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-design.md \
            docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-revision-notes.md

      - name: Validate strict governance before commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/knowledge_governance.py strict --root .

      - name: Commit metadata-only repair
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git -c core.quotepath=false diff --name-only)
          expected=$(printf '%s\n' \
            docs/superpowers/plans/2026-09-16-issue304-t0-baseline.md \
            docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-design.md \
            docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-revision-notes.md)
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/superpowers/plans/2026-09-16-issue304-t0-baseline.md \
            docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-design.md \
            docs/superpowers/specs/2026-09-16-ci-test-sharding-parallelization-revision-notes.md
          git commit -m 'docs: fix ci sharding governance metadata'
          git push origin HEAD:ci-sharding/issue304-t0-baseline-20260916
