name: 工單544 B6-4 Replacement RED
run-name: "工單 #544 B6-4｜Facade Migration RED｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue544-b6-4-red.yml

permissions:
  contents: read

jobs:
  red:
    name: 驗證 zero-caller 與 direct-owner migration requirement 先紅
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: 新 requirement 必須先 RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue544_b6_4_facade_batch.py > /tmp/issue544-b6-4-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue544-b6-4-red.log
          test "$rc" -ne 0
          grep -E "B6-4 RED|toggle_advanced_settings|_phase6_corner_parameters_unlocked|test-only facade caller" /tmp/issue544-b6-4-red.log
          echo "ISSUE544_B6_4_REPLACEMENT_RED=GREEN"
      - uses: actions/upload-artifact@v4
        with:
          name: issue544-b6-4-replacement-red
          path: /tmp/issue544-b6-4-red.log
          if-no-files-found: error
          retention-days: 14
