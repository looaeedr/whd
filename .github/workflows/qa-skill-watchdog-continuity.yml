name: "QA watchdog continuity skill contract"

on:
  push:
    branches:
      - "fix/skill-watchdog-nonblocking-continuity-20260920"
    paths:
      - ".agents/skills/engineering/monitoring-remote-qa/SKILL.md"
      - ".agents/skills/engineering/executable-continuity-controller/SKILL.md"
      - "tests/process/test_watchdog_fallback_continuity_contract.py"
      - ".github/workflows/qa-skill-watchdog-continuity.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest
      - name: Run watchdog continuity contract
        run: python -m pytest -q tests/process/test_watchdog_fallback_continuity_contract.py --tb=short
