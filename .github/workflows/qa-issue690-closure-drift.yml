name: QA Issue690 T4 Closure Drift

on:
  push:
    branches:
      - work/issue690-closure-drift-classification-20260926
    paths:
      - 'tests/process/test_issue690_closure_drift_classification.py'
      - 'tools/continuity_controller.py'
      - '.github/workflows/qa-issue690-closure-drift.yml'
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - 'tests/process/test_issue690_closure_drift_classification.py'
      - 'tools/continuity_controller.py'
      - '.github/workflows/qa-issue690-closure-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run #690 focused closure drift contract
        run: python -m pytest tests/process/test_issue690_closure_drift_classification.py -q
      - name: Run protected closure regressions
        if: always()
        run: |
          python -m pytest \
            tests/process/test_continuity_controller.py \
            tests/process/test_issue641_closing_turn_exit_red.py \
            tests/process/test_issue691_turn_exit_scheduler_end_parity.py \
            -q
