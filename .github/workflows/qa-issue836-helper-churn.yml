name: WHD Issue 836 Helper Churn Gate QA

on:
  push:
    branches:
      - governance/issue836-stop-helper-churn-20260927

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Focused helper churn contract
        run: >-
          python -m pytest -q
          tests/process/test_issue836_helper_churn_gate.py
          tests/process/test_issue645_helper_reservation_race.py
          tests/process/test_issue641_helper_reservation_red.py
