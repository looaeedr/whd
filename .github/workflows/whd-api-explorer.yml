name: WHD API Explorer

# Regenerate from authoritative code on every localX source update.
# A PR preview runs the same generator and regression without publishing.
on:
  push:
    branches: [localX]
    paths:
      - 'ae_engine/**'
      - 'tools/build_api_explorer.py'
      - '.github/workflows/whd-api-explorer.yml'
  pull_request:
    branches: [localX]
    paths:
      - 'ae_engine/**'
      - 'tools/build_api_explorer.py'
      - 'tests/governance/test_api_explorer.py'
      - '.github/workflows/whd-api-explorer.yml'
      - 'API_INDEX.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whd-api-explorer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    name: Generate live public API browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout current source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate new API discovery and safe rendering
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/governance/test_api_explorer.py
      - name: Build complete API catalog from source
        run: |
          python tools/build_api_explorer.py
          test -s API_INDEX.md
          test -s docs/api/index.html
          python tools/build_api_explorer.py --check
          mkdir -p _site/api
          cp docs/api/index.html _site/api/index.html
          cp API_INDEX.md _site/API_INDEX.md
      - name: Preserve preview artifact for PRs and audit
        uses: actions/upload-artifact@v4
        with:
          name: whd-public-api-catalog
          path: _site/
          if-no-files-found: error
      - name: Detect whether GitHub Pages is enabled
        id: pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # Public read-only Pages endpoint; no admin rights or repository mutation.
          code="$(curl --fail-with-body --silent --show-error --output /tmp/whd-pages-status.json --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is disabled. API catalog artifact remains available. Enable Pages with GitHub Actions source: https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cannot confirm GitHub Pages readiness (HTTP ${code}); latest API catalog artifact is preserved."
          fi
      - name: Prepare GitHub Pages artifact on localX
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Publish latest API explorer
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish source-derived API browser
        id: deployment
        uses: actions/deploy-pages@v4
