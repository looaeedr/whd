name: QA Issue 444 T2 Focused
on:
  push:
    branches:
      - refactor/issue444-t2-bending-ui-owner-20260920

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Tk + focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest matplotlib
          .venv/bin/python - <<'PY'
          import tkinter
          print("TKINTER_IMPORT_OK", tkinter.TkVersion)
          PY
      - name: Focused R2 R3
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_issue444_bending_ui_owner.py \
            tests/test_phase6_ui_state_regressions.py::test_phase6_box_page_restores_symmetry_checkbox \
            tests/test_phase6_ui_state_regressions.py::test_box_symmetry_checkbox_lives_in_fold_editor_not_right_settings_page \
            --tb=short
