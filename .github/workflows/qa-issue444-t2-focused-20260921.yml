name: QA Issue 444 T2 Focused
on:
  push:
    branches:
      - refactor/issue444-t2-bending-ui-owner-20260920
  pull_request:
    branches:
      - refactor/issue443-t1-dead-glue-20260920

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused R2 R3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue444_bending_ui_owner.py \
            tests/test_phase6_ui_state_regressions.py::test_phase6_box_page_restores_symmetry_checkbox \
            tests/test_phase6_ui_state_regressions.py::test_box_symmetry_checkbox_lives_in_fold_editor_not_right_settings_page \
            --tb=short
