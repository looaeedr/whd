name: issue134-preflight
on:
  push:
    branches:
      - work/issue-134-remote-qa-state-bridge
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#134 remote QA polling state bridge integration coverage"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_remote_qa_state_bridge_contract.py"
          --evidence ".phase6_issue134_remote_state_bridge_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run #134 bridge contract when present
        shell: bash
        run: |
          if [ -f tests/process/test_remote_qa_state_bridge_contract.py ]; then
            python -m pytest tests/process/test_remote_qa_state_bridge_contract.py -q
          else
            echo "bridge contract not yet created; preflight-only pass"
          fi
