name: "QA #502 T5 Editor Settings RED"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue502-t5-red.yml'

permissions:
  contents: read

jobs:
  t5-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused harness
        run: python -m pip install pytest
      - name: Run expected R5 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue502_editor_settings_commit_seam.py --tb=short > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "RED R5|commit_editor_values|narrow_coordinator_delegate" /tmp/red.log
          echo "ISSUE502_R5_EXPECTED_RED=1"
          exit 0
