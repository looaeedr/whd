name: "QA #391 T2 RED pure Settings transitions"

on:
  push:
    branches:
      - "refactor/issue391-phase4-t2-settings-transitions-20260920"
    paths:
      - "tests/test_issue391_settings_transitions.py"
      - ".github/workflows/qa-issue391-t2-red.yml"

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=391"
          echo "PREDECESSOR=a1b20315d9c7efcac07ceaa994cb7b21b314292f"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor a1b20315d9c7efcac07ceaa994cb7b21b314292f HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest -r requirements.txt

      - name: Require intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue391_settings_transitions.py --tb=short | tee /tmp/issue391-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "PYTEST_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "Phase 4 T2 requires phase6_settings_transitions.py|No module named 'phase6_settings_transitions'|controller still owns T2 transition formulas" /tmp/issue391-red.log
          echo "ISSUE391_T2_EXPECTED_RED=1"
