name: WHD｜#532｜C0 刪除證據稽核
run-name: "WHD｜#532｜C0 刪除證據稽核｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue532-c0-deletion-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: C0 Repo-wide Bridge consumer / deletion audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 掃描 Bridge 外部 consumer 與動態存取
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue532-c0-deletion-audit.log
          import ast
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          BRIDGE = Path("fold_designer_bridge.py")
          source = BRIDGE.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(BRIDGE))
          loads = Counter(
              n.id for n in ast.walk(tree)
              if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)
          )

          import_candidates = []
          for node in tree.body:
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      bound = alias.asname or alias.name.split(".")[0]
                      if loads[bound] == 0:
                          import_candidates.append({
                              "name": bound,
                              "module": alias.name,
                              "line": node.lineno,
                              "special": False,
                          })
              elif isinstance(node, ast.ImportFrom):
                  module = node.module or ""
                  for alias in node.names:
                      if alias.name == "*":
                          continue
                      bound = alias.asname or alias.name
                      if loads[bound] == 0:
                          import_candidates.append({
                              "name": bound,
                              "module": module,
                              "imported_name": alias.name,
                              "line": node.lineno,
                              "special": module == "__future__",
                          })

          alias_candidates = []
          constant_candidates = []
          for node in tree.body:
              if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                  continue
              targets = node.targets if isinstance(node, ast.Assign) else [node.target]
              value = node.value
              for target in targets:
                  if not isinstance(target, ast.Name):
                      continue
                  name = target.id
                  if isinstance(value, (ast.Name, ast.Attribute)) and loads[name] == 0:
                      alias_candidates.append({
                          "name": name,
                          "target": ast.unparse(value),
                          "line": node.lineno,
                      })
                  if name.isupper() and isinstance(value, ast.Constant) and loads[name] == 0:
                      constant_candidates.append({
                          "name": name,
                          "value": repr(value.value),
                          "line": node.lineno,
                      })

          candidate_names = {
              row["name"] for row in import_candidates
          } | {
              row["name"] for row in alias_candidates
          } | {
              row["name"] for row in constant_candidates
          }

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True, encoding="utf-8"
          ).splitlines()

          refs = {name: [] for name in candidate_names}
          generic_dynamic = []
          parse_errors = []

          for raw_path in tracked:
              path = Path(raw_path)
              if path == BRIDGE:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
                  t = ast.parse(text, filename=raw_path)
              except Exception as exc:
                  parse_errors.append([raw_path, type(exc).__name__])
                  continue

              bridge_aliases = set()
              for node in ast.walk(t):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          if a.name == "fold_designer_bridge":
                              bridge_aliases.add(a.asname or "fold_designer_bridge")
                  elif isinstance(node, ast.ImportFrom) and node.module == "fold_designer_bridge":
                      for a in node.names:
                          if a.name in candidate_names:
                              refs[a.name].append({
                                  "path": raw_path,
                                  "line": node.lineno,
                                  "kind": "from_import",
                                  "category": "tests" if raw_path.startswith("tests/") else "production",
                              })

              for node in ast.walk(t):
                  if (
                      isinstance(node, ast.Attribute)
                      and isinstance(node.value, ast.Name)
                      and node.value.id in bridge_aliases
                      and node.attr in candidate_names
                  ):
                      refs[node.attr].append({
                          "path": raw_path,
                          "line": node.lineno,
                          "kind": "module_attribute",
                          "category": "tests" if raw_path.startswith("tests/") else "production",
                      })

                  if (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Name)
                      and node.func.id in {"getattr", "hasattr", "setattr"}
                      and len(node.args) >= 2
                      and isinstance(node.args[0], ast.Name)
                      and node.args[0].id in bridge_aliases
                  ):
                      attr = node.args[1]
                      if isinstance(attr, ast.Constant) and isinstance(attr.value, str):
                          if attr.value in candidate_names:
                              refs[attr.value].append({
                                  "path": raw_path,
                                  "line": node.lineno,
                                  "kind": "dynamic_exact",
                                  "category": "tests" if raw_path.startswith("tests/") else "production",
                              })
                      else:
                          generic_dynamic.append({
                              "path": raw_path,
                              "line": node.lineno,
                              "kind": node.func.id,
                          })

          def classify(row):
              name = row["name"]
              evidence = refs.get(name, [])
              prod = [r for r in evidence if r["category"] == "production"]
              tests = [r for r in evidence if r["category"] == "tests"]
              if row.get("special"):
                  decision = "PROTECTED_SPECIAL_IMPORT"
              elif prod:
                  decision = "RETAIN_EXTERNAL_PRODUCTION_CONSUMER"
              elif tests:
                  decision = "REVIEW_TEST_COMPAT_CONSUMER"
              elif generic_dynamic:
                  decision = "REVIEW_GENERIC_DYNAMIC_BRIDGE_ACCESS"
              else:
                  decision = "DELETE_PROVEN_NO_EXTERNAL_BRIDGE_CONSUMER"
              return {
                  **row,
                  "decision": decision,
                  "production_refs": prod,
                  "test_refs": tests,
              }

          import_rows = [classify(row) for row in import_candidates]
          alias_rows = [classify(row) for row in alias_candidates]
          constant_rows = [classify(row) for row in constant_candidates]

          safe = [
              ["import", row["name"], row["line"]]
              for row in import_rows
              if row["decision"] == "DELETE_PROVEN_NO_EXTERNAL_BRIDGE_CONSUMER"
          ] + [
              ["alias", row["name"], row["line"]]
              for row in alias_rows
              if row["decision"] == "DELETE_PROVEN_NO_EXTERNAL_BRIDGE_CONSUMER"
          ] + [
              ["constant", row["name"], row["line"]]
              for row in constant_rows
              if row["decision"] == "DELETE_PROVEN_NO_EXTERNAL_BRIDGE_CONSUMER"
          ]

          report = {
              "schema": "WHD_ISSUE532_C0_DELETION_AUDIT_V1",
              "issue": 532,
              "import_candidates": import_rows,
              "alias_candidates": alias_rows,
              "constant_candidates": constant_rows,
              "generic_dynamic_bridge_access": generic_dynamic,
              "parse_errors": parse_errors,
              "safe_deletions": safe,
          }
          Path("/tmp/issue532-c0-deletion-audit.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print("C0_IMPORT_CANDIDATES=" + str(len(import_rows)))
          print("C0_ALIAS_CANDIDATES=" + str(len(alias_rows)))
          print("C0_CONSTANT_CANDIDATES=" + str(len(constant_rows)))
          print("C0_GENERIC_DYNAMIC_BRIDGE_ACCESS=" + str(len(generic_dynamic)))
          print("C0_PARSE_ERRORS=" + str(len(parse_errors)))
          print("C0_SAFE_DELETION_COUNT=" + str(len(safe)))
          for item in safe:
              print("C0_SAFE_DELETE=" + json.dumps(item, ensure_ascii=False))
          for row in import_rows + alias_rows + constant_rows:
              if row["decision"] != "DELETE_PROVEN_NO_EXTERNAL_BRIDGE_CONSUMER":
                  print("C0_RETAIN_OR_REVIEW=" + json.dumps({
                      "name": row["name"],
                      "line": row["line"],
                      "decision": row["decision"],
                      "production_ref_count": len(row["production_refs"]),
                      "test_ref_count": len(row["test_refs"]),
                  }, ensure_ascii=False, sort_keys=True))
          print("ISSUE532_C0_DELETION_AUDIT=GREEN")
          PY

      - name: 上傳 C0 刪除稽核證據
        uses: actions/upload-artifact@v4
        with:
          name: issue532-c0-deletion-audit
          path: |
            /tmp/issue532-c0-deletion-audit.log
            /tmp/issue532-c0-deletion-audit.json
          if-no-files-found: error
          retention-days: 14
