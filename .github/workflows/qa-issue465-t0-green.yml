name: Issue 465 T0 GREEN

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue465-t0-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest -r requirements.txt
      - name: Run T0 contract and owner regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_issue465_t0_physical_mating_region.py \
            tests/test_phase6_t04_inner_door_frames.py \
            tests/test_phase6_t16_receiving_placement.py
