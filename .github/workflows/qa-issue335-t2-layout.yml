name: "QA #335 T2 UI v3 Layout"

on:
  push:
    branches:
      - ui/issue335-topbar-right-compact-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#335)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact v3 layout RED
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_issue335_ui_v3_topbar_right_compact.py::test_v3_red_top_file_output_one_row_and_right_titles_removed \
            tests/test_issue335_ui_v3_topbar_right_compact.py::test_output_authority_routes_are_unchanged \
            tests/test_issue335_ui_v3_topbar_right_compact.py::test_settings_and_renderer_authority_routes_are_unchanged \
            > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#335 EXPECTED RED" red.log
          grep -E "1 failed, 2 passed" red.log

  green-source:
    if: ${{ contains(github.event.head_commit.message, 'green(#335)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_issue335_ui_v3_topbar_right_compact.py -k "not real_tk and not text_scales"

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#335)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UI runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: v3 layout + stale-contract migration regressions
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue335_ui_v3_topbar_right_compact.py \
            tests/test_issue187_3d_output_migration.py \
            tests/test_phase6_latest_layout_contract.py \
            tests/test_issue186_sheetmetal_selector_visibility.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#335)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid protected authority drift
        shell: bash
        run: |
          git diff --name-only 4bdb0e0366b3accb983a25365cc7b29008a74544...HEAD | tee issue335-files.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("issue335-files.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          exact = {
              "config.ini",
              "phase6_designer_workspace.py",
              "phase6_workspace_controller.py",
              "phase6_project_file.py",
              "phase6_final_scene_view.py",
          }
          bad = sorted(p for p in changed if p in exact or p.startswith("基準檔/") or p.startswith("ae_engine/"))
          if bad:
              raise SystemExit(f"#335 protected drift: {bad}")
          print("#335 protected drift PASS", sorted(changed))
          PY
