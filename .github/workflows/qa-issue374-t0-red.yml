name: "QA #374 T0 layout characterization RED"

on:
  push:
    branches:
      - ui/issue374-layout-characterization-20260919
    paths:
      - 'tests/test_issue374_t0_red.py'
      - 'docs/superpowers/checkpoints/issue374-t0-characterization.md'
      - '.github/workflows/qa-issue374-t0-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t0-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 4137b62887c3dc20c6ee5bbd4d753f485dcaf23b HEAD)" = "4137b62887c3dc20c6ee5bbd4d753f485dcaf23b"
          echo "T0_BASELINE=4137b62887c3dc20c6ee5bbd4d753f485dcaf23b"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install focused harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install -r requirements.txt pytest

      - name: Require both intended RED signals
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue374_t0_red.py --tb=short | tee /tmp/issue374-t0-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "RED: #373 main selector does not yet contain assembly" /tmp/issue374-t0-red.log
          grep -q "RED: assembly MouseWheel still crashes on nonnumeric event.num" /tmp/issue374-t0-red.log
          echo "PASS EXPECTED_LAYOUT_RED=1"
          echo "PASS EXPECTED_MOUSEWHEEL_RED=1"

      - name: Prove T0 did not modify production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 4137b62887c3dc20c6ee5bbd4d753f485dcaf23b...HEAD -- fold_designer_bridge.py gui.py ae_engine gui_modules | wc -l)" -eq 0
          echo "PASS PRODUCTION_SOURCE_DRIFT=0"
