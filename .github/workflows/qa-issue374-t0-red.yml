name: "QA #374 T0 layout characterization RED"

on:
  push:
    branches:
      - ui/issue374-layout-characterization-20260919
    paths:
      - 'tests/test_issue374_t0_layout_contract.py'
      - 'docs/superpowers/checkpoints/issue374-t0-characterization.md'
      - '.github/workflows/qa-issue374-t0-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t0-characterization-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 4137b62887c3dc20c6ee5bbd4d753f485dcaf23b)" = "4137b62887c3dc20c6ee5bbd4d753f485dcaf23b"
          echo "T0_BASELINE=4137b62887c3dc20c6ee5bbd4d753f485dcaf23b"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install focused harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install -r requirements.txt pytest matplotlib

      - name: Confirm MouseWheel intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q             tests/test_issue374_t0_layout_contract.py::test_mousewheel_nonnumeric_event_num_is_safe_and_preserves_windows_delta_direction             --tb=short | tee /tmp/issue374-wheel-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "ValueError: invalid literal for int()" /tmp/issue374-wheel-red.log
          echo "PASS EXPECTED_MOUSEWHEEL_RED=1"

      - name: Confirm target-layout intended RED
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q             tests/test_issue374_t0_layout_contract.py::test_target_main_selector_owns_assembly_parts_and_corner_data_without_old_content_switch             --tb=short | tee /tmp/issue374-layout-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "RED: #373 main selector does not yet contain assembly + existing parts + corner data" /tmp/issue374-layout-red.log
          echo "PASS EXPECTED_TARGET_LAYOUT_RED=1"

      - name: T0 source drift boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 4137b62887c3dc20c6ee5bbd4d753f485dcaf23b...HEAD | tee /tmp/issue374-files.txt
          test "$(grep -Ec '^(fold_designer_bridge.py|gui.py|ae_engine/)' /tmp/issue374-files.txt || true)" -eq 0
          echo "PASS PRODUCTION_SOURCE_DRIFT=0"
