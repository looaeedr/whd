name: T3 Divider Relief QA

on:
  push:
    branches:
      - feat/39-divider-relief
    paths:
      - 'ae_engine/assembly_collision.py'
      - 'ae_engine/assembly_joint.py'
      - 'ae_engine/manufacturing_api.py'
      - 'fold_designer_bridge.py'
      - 'tests/test_issue39_divider_relief.py'
      - '.scratch/issue39_preflight_evidence.txt'
      - '.github/workflows/qa_issue39_divider_relief.yml'

jobs:
  t3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib numpy
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "bug fix collision 3D placement relief: Receiving Divider true-thickness backprojection" \
            --changed-file ae_engine/assembly_collision.py \
            --changed-file ae_engine/assembly_joint.py \
            --changed-file ae_engine/manufacturing_api.py \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue39_divider_relief.py \
            --evidence .scratch/issue39_preflight_evidence.txt
      - name: T3 targeted with config invariant
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          pytest -q -vv -s \
            tests/test_issue39_divider_relief.py \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_issue37_vault_baseplate_placement.py \
            tests/test_assembly_placement_divider.py \
            tests/test_joint_backprojection_and_topology.py \
            tests/test_resolved_manufacturing_export.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "config_before=$before"
          echo "config_after=$after"
          test "$before" = "$after"
