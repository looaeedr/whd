name: "QA #443 T1 Dead Glue"

on:
  push:
    branches:
      - refactor/issue443-t1-dead-glue-20260920
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue443_t1_dead_glue.py'
      - 'docs/superpowers/checkpoints/issue443-t1-preflight-evidence.txt'
      - '.github/workflows/qa-issue443-t1-dead-glue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RED dependency
        shell: bash
        run: python -m pip install pytest

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "派工 #443 T1：依 #442 T0 machine census 刪除 fold_designer_bridge.py 兩個 zero-caller historical builders，建立 focused ownership RED/GREEN 與 GitHub Actions remote QA；不改 Settings/BendingUI/geometry/dataflow/persistence semantics。" \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue443_t1_dead_glue.py \
            --changed-file docs/superpowers/checkpoints/issue443-t1-preflight-evidence.txt \
            --changed-file .github/workflows/qa-issue443-t1-dead-glue.yml \
            --evidence docs/superpowers/checkpoints/issue443-t1-preflight-evidence.txt

      - name: Protected diff gate
        shell: bash
        env:
          BASE_SHA: cf14e2e6b7ba9d28109d94cd1010867a29e8c157
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
          printf 'CHANGED=%s\n' "${changed[*]}"
          for p in "${changed[@]}"; do
            case "$p" in
              fold_designer_bridge.py|tests/test_issue443_t1_dead_glue.py|docs/superpowers/checkpoints/issue443-t1-preflight-evidence.txt|.github/workflows/qa-issue443-t1-dead-glue.yml) ;;
              *) echo "UNEXPECTED_DIFF=$p"; exit 1 ;;
            esac
          done
          git diff --exit-code "$BASE_SHA"...HEAD -- 'phase6_*.py' 'ae_engine/**' config.ini '*.dxf'

      - name: Detect RED or GREEN state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import ast
          from pathlib import Path
          targets={"_phase6_build_box_symmetry_settings","_phase6_build_assembly_settings"}
          tree=ast.parse(Path("fold_designer_bridge.py").read_text(encoding="utf-8"))
          names={getattr(n,"name","") for n in tree.body}
          print("T1_MODE=" + ("RED" if targets & names else "GREEN"))
          PY

      - name: Focused ownership RED/GREEN
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue443_t1_dead_glue.py --tb=short | tee /tmp/t1.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$T1_MODE" = "RED" ]; then
            test "$rc" -ne 0
            grep -Fq 'RED[T1_DEAD_GLUE]' /tmp/t1.log
            grep -Eq '1 failed, 2 passed' /tmp/t1.log
            echo 'PASS EXPECTED_T1_RED=1'
          else
            test "$rc" -eq 0
            grep -Eq '3 passed' /tmp/t1.log
            echo 'PASS T1_DEAD_GLUE_GREEN=1'
          fi

      - name: GREEN dependencies
        if: env.T1_MODE == 'GREEN'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -r requirements.txt matplotlib pytest

      - name: GREEN focused bridge regressions
        if: env.T1_MODE == 'GREEN'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_ui_state_regressions.py \
            tests/test_issue366_t2_settings_transaction_owner.py \
            tests/test_issue366_t2c_corner_external_controller.py \
            tests/test_phase6_t12_receiving_asymmetric_policy.py \
            --tb=short

      - name: GREEN manufacturing and DXF acceptance
        if: env.T1_MODE == 'GREEN'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dxf_acceptance.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_resolved_manufacturing_export.py \
            --tb=short

      - name: GREEN Git-object invariants
        if: env.T1_MODE == 'GREEN'
        shell: bash
        env:
          BASE_SHA: cf14e2e6b7ba9d28109d94cd1010867a29e8c157
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess
          BASE="cf14e2e6b7ba9d28109d94cd1010867a29e8c157"
          def tracked_dxf(ref):
              raw=subprocess.check_output(["git","ls-tree","-r","--name-only","-z",ref])
              return sorted(x.decode("utf-8","surrogateescape") for x in raw.split(b"\0") if x and x.lower().endswith(b".dxf"))
          def blob(ref,path):
              return subprocess.check_output(["git","show",f"{ref}:{path}"])
          base_paths=tracked_dxf(BASE)
          head_paths=tracked_dxf("HEAD")
          assert base_paths==head_paths
          for p in base_paths:
              assert blob(BASE,p)==blob("HEAD",p), p
          assert blob(BASE,"config.ini")==blob("HEAD","config.ini")
          print("DXF_GIT_OBJECT_INVARIANT=1")
          print("CONFIG_GIT_OBJECT_INVARIANT=1")
          PY
          git diff --exit-code "$BASE_SHA"...HEAD -- 'phase6_*.py' 'ae_engine/**' config.ini '*.dxf'
          echo 'PROTECTED_DRIFT=0'
