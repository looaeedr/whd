name: Sheet-metal Clean Integration Acceptance

on:
  push:
    branches:
      - qa/sheetmetal-clean-integration-v3-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-clean-integration.yml'

permissions:
  contents: write

jobs:
  clean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Checkout exact clean candidate
        run: |
          set -euo pipefail
          git fetch origin
          git checkout -B fix/sheetmetal-selector-clean-integration-20260917 origin/fix/sheetmetal-selector-clean-integration-20260917
          test "$(git rev-parse HEAD)" = "f574836772496f8ec669af92f8793b9c8bf5bee5"
          test "$(git rev-parse HEAD^)" = "ec0724c892dd0d44f1bb4e0b80e90a85820df209"
          if git ls-files '.github/workflows/qa-sheetmetal-*' | grep -q .; then
            echo 'temporary sheet-metal QA workflow leaked into clean candidate'
            exit 1
          fi
      - name: Durable UI skill and AI-library writeback
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          skill = Path('.agents/skills/engineering/UI設計與去AI味/SKILL.md')
          pitfall = Path('個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md')

          skill_marker = 'WHD_SHEETMETAL_DUAL_PROJECTION_RULE_20260917'
          skill_text = '''\n\n<!-- WHD_SHEETMETAL_DUAL_PROJECTION_RULE_20260917 -->\n## Modern 鈑金選單 / Structure Tree 共用 authority 規則\n\n- UI 物件存在不等於 UI 驗收通過；modern `Phase6PrimaryApplication` 必須實際證明控制項已 mapped/managed，且 callback 可由操作路徑觸發。legacy startup 綠燈不能替代 modern startup 可見性證據。\n- 「不要第二個 selector」的真正契約是：不得建立第二個 authoritative state owner / state machine；同一 authoritative workspace state 可以有多個 presentation projection。\n- Compact 鈑金選單與 Structure Tree 可以同時可見，但都必須讀寫同一個 `designer_workspace.active_part`，不得各自保存真實狀態。\n- 不同 projection 可以有不同粒度：Structure Tree 可指向 exact physical child；compact menu 可以只顯示 top-level parent label。禁止把 display `StringVar` 當成 physical-part authority 來做等值斷言。\n- 任一 selector 改變 authoritative part 後，必須 refresh 其他已顯示 projection，避免畫面殘留舊 selection。\n- 修復隱藏控制項時，優先恢復既有 widget/state/callback 的 layout 與 projection refresh；禁止為了讓 UI 出現而複製 state owner。\n'''

          pitfall_marker = 'WHD_PITFALL_SHEETMETAL_SELECTOR_PROJECTION_20260917'
          pitfall_text = '''\n\n<!-- WHD_PITFALL_SHEETMETAL_SELECTOR_PROJECTION_20260917 -->\n## 2026-09-17 — 鈑金選單「物件存在但操作員看不到」與雙投影同步\n\n**症狀**：compact 鈑金選單的 `Menubutton/Menu/StringVar` 都已建立，但沒有任何 geometry manager，因此 modern 3D UI 實際不可見；修回可見後，舊 Structure Tree contract 又把「只能有一個 visual selector」誤當成「只能有一個 authoritative owner」。\n\n**根因**：把 widget existence 當成 UI acceptance，以及把 presentation projection 與 authority owner 混為一談。另一次 RED 顯示 menu 已切到新 part，但 Structure Tree 還停在舊 physical child，證明 authority 更新後缺少 presentation refresh。\n\n**防錯規則**：modern UI acceptance 必須驗 `winfo_ismapped()` / geometry manager + live callback；compact menu 與 Structure Tree 必須共用 `designer_workspace.active_part`，允許不同顯示粒度；一邊改 authority 後必須 refresh 另一邊。測試只能驗證 production，不能反向建立第二套狀態來迎合舊 contract。\n'''

          for path, marker, block in ((skill, skill_marker, skill_text), (pitfall, pitfall_marker, pitfall_text)):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  path.write_text((text.rstrip() + block).rstrip() + '\n', encoding='utf-8')

          s = skill.read_text(encoding='utf-8')[:1200]
          p = pitfall.read_text(encoding='utf-8')[:1200]
          for needle in ('whd_doc_role: CURRENT', 'whd_contract: ui-design-de-ai', 'whd_schema: WHD_DOC_META_V1'):
              assert needle in s, needle
          for needle in ('whd_doc_role: REFERENCE', 'whd_contract: pitfall-ledger', 'whd_schema: WHD_DOC_META_V1'):
              assert needle in p, needle
          PY
      - name: Verify focused modern selector contracts and protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
          xvfb-run -a python -m pytest -q \
            tests/test_issue124_structure_tree.py \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_phase6_t22_settings_vertical_scroll.py
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          python - <<'PY'
          import subprocess
          allowed = {
              ' M .agents/skills/engineering/UI設計與去AI味/SKILL.md',
              ' M 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md',
          }
          out = subprocess.check_output(
              ['git', '-c', 'core.quotePath=false', 'status', '--porcelain', '--untracked-files=all'],
              text=True,
          )
          actual = {line for line in out.splitlines() if line}
          print('STATUS_SET=', sorted(actual))
          unexpected = actual - allowed
          missing = allowed - actual
          assert not unexpected, f'unexpected worktree drift: {sorted(unexpected)}'
          assert not missing, f'expected durable writeback missing: {sorted(missing)}'
          PY
      - name: Commit durable writeback and push clean candidate
        run: |
          set -euo pipefail
          git config user.name 'WHD QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '.agents/skills/engineering/UI設計與去AI味/SKILL.md' '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          git diff --cached --check
          git commit -m 'Document shared-authority sheet-metal selector projections'
          git push origin HEAD:fix/sheetmetal-selector-clean-integration-20260917
          echo "CLEAN_HEAD=$(git rev-parse HEAD)"
          echo '=== CHANGED FILES VS PRODUCTION ==='
          git diff --name-status ec0724c892dd0d44f1bb4e0b80e90a85820df209..HEAD
