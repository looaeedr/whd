name: 工單546 B6-6 Replacement RED
run-name: "工單 #546 B6-6｜Final Seven Facade Removal RED｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue546-b6-6-red.yml

permissions:
  contents: read

jobs:
  red:
    name: 驗證最後七個 facade removal requirement 先紅
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝聚焦依賴
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: 新 requirement 必須先 RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q             tests/test_issue546_b6_6_facade_batch.py             tests/test_phase6_bridge_domain_ownership.py             > /tmp/issue546-b6-6-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue546-b6-6-red.log
          test "$rc" -ne 0
          grep -E "B6-6 RED|stale class facade remains|failed|passed" /tmp/issue546-b6-6-red.log
          echo "ISSUE546_B6_6_REPLACEMENT_RED=GREEN"
      - name: 上傳 RED 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue546-b6-6-replacement-red
          path: /tmp/issue546-b6-6-red.log
          if-no-files-found: error
          retention-days: 14
