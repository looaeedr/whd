name: "QA #435 T5 lifecycle characterization"

on:
  push:
    branches:
      - refactor/issue435-t5-switch-lifecycle-guards-20260920
    paths:
      - 'tests/test_issue435_switch_lifecycle_guards.py'
      - '.github/workflows/qa-issue435-t5.yml'
      - 'docs/superpowers/checkpoints/issue435-t5-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 07a5fe36880d1548c9f42f2f6d071f46a9ac062f
  EXPECTED_PHASE: GREEN

jobs:
  ui-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: Re-run T5 changed-file Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #435 T5 Switch lifecycle, state preservation and duplicate-tree guards. Validate part assembly corner_data repeated switching, project load save reload, refresh, dynamic part add delete, BoxBody late piece row refresh, duplicate widget tree, duplicate event binding, callback multiplication, stale widget references, state preservation, and mousewheel safety. Preserve accepted #431-#434 ownership and semantics. GitHub Actions remote QA." \
            --changed-file fold_designer_bridge.py \
            --changed-file phase6_assembly_panel.py \
            --changed-file phase6_corner_data_view_adapter.py \
            --changed-file phase6_project_controller.py \
            --changed-file tests/test_issue435_switch_lifecycle_guards.py \
            --changed-file tests/test_issue378_assembly_mousewheel.py \
            --changed-file .github/workflows/qa-issue435-t5.yml \
            --changed-file docs/superpowers/checkpoints/issue435-t5-journal.md \
            --changed-file docs/superpowers/checkpoints/issue435-t5-checkpoint.json \
            --evidence docs/superpowers/checkpoints/issue435-t5-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require zero production delta
        shell: bash
        run: |
          set -euo pipefail
          for path in fold_designer_bridge.py phase6_assembly_panel.py phase6_corner_data_view_adapter.py phase6_project_controller.py; do
            test "$(git rev-parse "$BASE_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          echo "PRODUCTION_RUNTIME_EDIT=0"

      - name: Run T5 UI lifecycle characterization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue435-t5
          TESTS=(
            tests/test_issue435_switch_lifecycle_guards.py
            tests/test_issue430_single_host_red.py
            tests/test_issue432_general_part_shared_host.py
            tests/test_issue433_assembly_shared_host.py
            tests/test_issue434_corner_data_shared_host.py
            tests/test_issue376_assembly_collapsible_data.py
            tests/test_issue119_corner_data_transition_ui.py
            tests/test_issue378_assembly_mousewheel.py
          )
          set +e
          xvfb-run -a python -m pytest -q "${TESTS[@]}" --tb=short \
            --json-report --json-report-file=.scratch/issue435-t5/ui-report.json \
            > .scratch/issue435-t5/ui.log 2>&1
          rc=$?
          set -e
          cat .scratch/issue435-t5/ui.log

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data=json.loads(Path(".scratch/issue435-t5/ui-report.json").read_text(encoding="utf-8"))
          outcomes={row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          failed={n for n,o in outcomes.items() if o=="failed"}
          skipped={n for n,o in outcomes.items() if o=="skipped"}
          expected_red={
              "tests/test_issue378_assembly_mousewheel.py::test_windows_mousewheel_positive_delta_accepts_nonnumeric_num",
              "tests/test_issue378_assembly_mousewheel.py::test_windows_mousewheel_negative_delta_accepts_nonnumeric_num",
              "tests/test_issue378_assembly_mousewheel.py::test_button4_direction_is_unchanged",
              "tests/test_issue378_assembly_mousewheel.py::test_button5_direction_is_unchanged",
          }
          allowed_skip={
              "tests/test_issue376_assembly_collapsible_data.py::test_box_body_physical_piece_rows_are_also_collapsible_when_present"
          }
          print("UI_OUTCOMES", outcomes)
          print("UI_FAILED", sorted(failed))
          print("UI_SKIPPED", sorted(skipped))
          if os.environ["EXPECTED_PHASE"] == "RED":
              assert failed == expected_red, f"unexpected RED set: {failed}"
              assert skipped <= allowed_skip, f"unexpected skips: {skipped}"
              print("T5_INTENDED_RED=1")
              print("T5_RED_STALE_ISSUE378_COUNT=4")
              print("MOUSEWHEEL_RUNTIME_OWNER_PATH_GREEN=1")
          else:
              assert not failed, f"T5 GREEN failures: {failed}"
              assert skipped <= allowed_skip, f"unexpected skips: {skipped}"
              print("PERMANENT_HIDDEN_SECOND_HOST=0")
              print("DUPLICATE_WIDGET_TREE=0")
              print("DUPLICATE_EVENT_BINDING=0")
              print("CALLBACK_MULTIPLICATION=0")
              print("STALE_WIDGET_REFERENCE=0")
              print("STATE_PRESERVATION_PARITY=GREEN")
              print("MOUSEWHEEL_EXCEPTION=0")
              print(f"T5_GREEN_RESULT={sum(o == 'passed' for o in outcomes.values())}_PASS_0_FAIL_{len(skipped)}_SKIP")
          PY

          if [ "$EXPECTED_PHASE" = RED ]; then
            test "$rc" -ne 0
          else
            test "$rc" -eq 0
          fi

      - name: Upload UI lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue435-t5-ui
          path: .scratch/issue435-t5

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install persistence dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest matplotlib numpy shapely ezdxf -r requirements.txt
      - name: Run serialized project/state parity
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue41_persistence_parity.py --tb=short
          echo "PROJECT_LOAD_SAVE_RELOAD_PARITY=GREEN"
