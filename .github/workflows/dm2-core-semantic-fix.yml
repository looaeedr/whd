name: DM2 Core Semantic Fix
on:
  push:
    branches:
      - work/dm2-divider-physical-contract
    paths:
      - .github/workflows/dm2-core-semantic-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply semantic core fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fold_designer_bridge.py')
          text=p.read_text(encoding='utf-8')
          old='''    metadata = dict(getattr(getattr(part, "render_data", None), "metadata", {}) or {})\n    lengths = tuple(float(v) for v in tuple(metadata.get("material_lengths", ()) or ()))\n    core_segment_index = metadata.get("core_segment_index")\n    if core_segment_index is not None:\n        index = int(core_segment_index)\n        if 0 <= index < len(lengths):\n            return float(sum(lengths[:index]))\n    raise ValueError(f"Divider D_DIVIDER Fold topology unavailable: {part.part_key}")\n'''
          new='''    metadata = dict(getattr(getattr(part, "render_data", None), "metadata", {}) or {})\n    physical_contract = dict(metadata.get("physical_geometry_contract") or {})\n    core_segment = dict(physical_contract.get("core_physical_segment") or {})\n    core_flat_band = tuple(core_segment.get("flat_band") or ())\n    if len(core_flat_band) == 2:\n        return float(core_flat_band[0])\n    raise ValueError(f"Divider core physical segment unavailable: {part.part_key}")\n'''
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected one core fallback anchor, found {count}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: Verify DM2 semantic contract
        run: pytest -q tests/test_dm1_divider_physical_contract.py
      - name: Verify T48-1 face flush gate
        run: pytest -q tests/test_issue48_receiving_fw_flush_red.py
      - name: Verify assembly collision
        run: pytest -q tests/test_assembly_collision.py tests/test_assembly_collision_integration.py
      - name: Commit verified production fix
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add fold_designer_bridge.py
          git commit -m "fix(dm2): resolve Divider core start from physical semantics"
          git push origin HEAD:work/dm2-divider-physical-contract
