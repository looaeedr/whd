name: "#356 T2 manufacturing request adapter"

on:
  push:
    branches:
      - refactor/issue356-manufacturing-adapter-20260919
    paths:
      - 'tests/test_issue356_manufacturing_adapter.py'
      - 'phase6_manufacturing_adapter.py'
      - '.github/workflows/qa-issue356-t2-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run request-builder contracts
        run: python -m pytest -q tests/test_issue356_manufacturing_adapter.py
