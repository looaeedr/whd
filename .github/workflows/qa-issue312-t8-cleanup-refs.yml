name: Issue 312 T8 Guarded QA Ref Cleanup

on:
  push:
    branches:
      - ci-sharding/issue312-t8-final-qualification-20260917
    paths:
      - '.github/workflows/qa-issue312-t8-cleanup-refs.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  guarded-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify secured T8 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/superpowers/checkpoints/issue312-t8.json').read_text(encoding='utf-8'))
          assert p['issue'] == 312
          assert p['evidence_secured'] is True
          assert p['cleanup_authorized'] is True
          assert p['production_mutated'] is False
          assert p['accepted_predecessor_sha'] == 'db0b79cd767717e67bcb65c8bd1f0e8eed6b2b4f'
          print('T8 evidence gate: GREEN')
          PY

      - name: Refresh OPEN PR refs and delete only approved safe candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          candidates=(
            'qa/issue304-t0-closing-verification-20260916'
            'qa/issue304-t0-closing-verification-fix-20260916'
            'qa/issue305-t1-closing-verification-20260916'
            'qa/issue305-t1-closing-verification-fix-20260916'
            'qa/issue305-t1-focused-green-20260916'
            'qa/issue305-t1-live-manifest-20260916'
            'qa/issue305-t1-red-20260916'
            'qa/issue306-t2-aggregate-cli-red2-20260916'
            'qa/issue306-t2-aggregate-cli-red-20260916'
            'qa/issue306-t2-closing-verification-20260916'
            'qa/issue306-t2-focused-green2-20260916'
            'qa/issue306-t2-focused-green-20260916'
            'qa/issue306-t2-parallel-acceptance2-20260916'
            'qa/issue306-t2-parallel-acceptance-20260916'
            'qa/issue306-t2-red-20260916'
          )

          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/pulls?state=open&per_page=100" \
            > /tmp/open-prs.json

          python - <<'PY' > /tmp/open-pr-refs.txt
          import json
          prs = json.load(open('/tmp/open-prs.json', encoding='utf-8'))
          refs = set()
          for pr in prs:
              refs.add(pr['head']['ref'])
              refs.add(pr['base']['ref'])
          for ref in sorted(refs):
              print(ref)
          PY

          protected=()
          for ref in "${candidates[@]}"; do
            if grep -Fxq "$ref" /tmp/open-pr-refs.txt; then
              protected+=("$ref")
            fi
          done

          if (( ${#protected[@]} > 0 )); then
            printf 'FAIL: candidate refs are protected by OPEN PR head/base:\n' >&2
            printf ' - %s\n' "${protected[@]}" >&2
            exit 41
          fi

          deleted=()
          absent=()
          for ref in "${candidates[@]}"; do
            if git ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
              git push origin --delete "$ref"
              deleted+=("$ref")
            else
              absent+=("$ref")
            fi
          done

          remaining=()
          for ref in "${candidates[@]}"; do
            if git ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
              remaining+=("$ref")
            fi
          done

          if (( ${#remaining[@]} > 0 )); then
            printf 'FAIL: refs still present after cleanup:\n' >&2
            printf ' - %s\n' "${remaining[@]}" >&2
            exit 42
          fi

          git ls-remote --exit-code --heads origin 'cleanup/2d-3d-sync' >/dev/null
          git ls-remote --exit-code --heads origin 'ci-sharding/issue312-t8-final-qualification-20260917' >/dev/null

          {
            echo '## Issue 312 T8 guarded ref cleanup'
            echo
            echo "- OPEN PR refs refreshed before deletion: $(wc -l < /tmp/open-pr-refs.txt) refs"
            echo "- Approved candidates: ${#candidates[@]}"
            echo "- Deleted now: ${#deleted[@]}"
            echo "- Already absent: ${#absent[@]}"
            echo '- Remaining approved candidates: 0'
            echo '- Production branch preserved: yes'
            echo '- Active T8 branch preserved: yes'
            if (( ${#deleted[@]} > 0 )); then
              echo
              echo 'Deleted:'
              printf -- '- `%s`\n' "${deleted[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
