name: Finalization Owner Guard QA

on:
  push:
    branches:
      - fix/fail-closed-owning-checkpoint-guard-20260916
  workflow_dispatch:

# QA-only trigger: workflow already exists before this push.
jobs:
  focused-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run owning-checkpoint and guard-invocation contract
        run: python -m pytest -q tests/process/test_finalization_owner_guard.py
