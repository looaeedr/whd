name: Finalization Owner Guard QA

on:
  push:
    branches:
      - fix/fail-closed-owning-checkpoint-guard-20260916
  workflow_dispatch:

# Temporary QA-only workflow. Remove before accepted closing head.
jobs:
  process-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run all process contracts
        run: python -m pytest -q tests/process
      - name: Run all knowledge contracts
        run: python -m pytest -q tests/knowledge
      - name: Run issue-closure skill contract
        run: python -m pytest -q tests/test_issue_closure_completion_skill_contract.py
