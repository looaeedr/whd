name: Finalization Owner Guard QA

on:
  push:
    branches:
      - fix/fail-closed-owning-checkpoint-guard-20260916
  workflow_dispatch:

# Temporary QA-only workflow. Remove before accepted closing head.
jobs:
  process-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run finalization and continuity process regression
        run: |
          python -m pytest -q \
            tests/process/test_finalization_owner_guard.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_checkpoint_resume_contract.py \
            tests/process/test_continuous_execution_durable_contract.py \
            tests/process/test_issue256_execution_claim_guard.py \
            tests/process/test_issue286_turn_exit_bridge_contract.py
