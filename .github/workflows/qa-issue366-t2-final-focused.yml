name: "QA #366 T2 final focused acceptance"
# trigger after A-B classifier allowlist correction

on:
  push:
    branches:
      - refactor/issue366-phase3-settings-transactions-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_settings_transaction_controller.py'
      - 'tests/test_issue366_t2*.py'
      - '.github/workflows/qa-issue366-t2-final-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: bb8c3d0272756629654127fbd86e9d7013d797e4

jobs:
  final-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          echo "BASELINE=$BASELINE_SHA"
          echo "CANDIDATE=$(git rev-parse HEAD)"
          git diff --name-only "$BASELINE_SHA...HEAD" | sort | tee /tmp/issue366-scope.txt
          python - <<'PY'
          from pathlib import Path
          paths=[x for x in Path('/tmp/issue366-scope.txt').read_text().splitlines() if x]
          allowed_exact={
            'fold_designer_bridge.py',
            'phase6_settings_transaction_controller.py',
            'tools/issue366_t2_ab_compare.py',
          }
          prefixes=(
            'tests/test_issue366_',
            '.github/workflows/qa-issue366-',
            'docs/superpowers/checkpoints/issue366-',
          )
          unexpected=[p for p in paths if p not in allowed_exact and not p.startswith(prefixes)]
          assert not unexpected, f'ISSUE366_SCOPE_DRIFT={unexpected}'
          print('PASS ISSUE366_SCOPE_DRIFT=0')
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest pytest-json-report matplotlib numpy -r requirements.txt

      - name: Compile T2 owners
        run: python -m py_compile phase6_settings_transaction_controller.py fold_designer_bridge.py

      - name: Run all #366 ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue366_t2_settings_transaction_owner.py \
            tests/test_issue366_t2a_settings_stage_controller.py \
            tests/test_issue366_t2b_structure_endcap_controller.py \
            tests/test_issue366_t2c_corner_external_controller.py \
            tests/test_issue366_t2d_family_width_controller.py

      - name: Run pure T2 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase6_settings_service.py \
            tests/test_phase6_box_body_structure.py \
            tests/test_assembly_joint_contract.py \
            tests/test_assembly_joint_semantics.py

      - name: Run real-Tk T2 regressions excluding exact inherited nodes
        shell: bash
        run: |
          set -euo pipefail
          N1="tests/test_phase6_t02_endcap_edge_controls.py::test_head_settings_publish_four_edge_controls_directly_from_registry"
          N2="tests/test_receiving_cabinet_type.py::test_switching_3d_baseline_model_to_receiving_applies_receiving_family_policy"
          N3="tests/test_receiving_side_panel_outside_defaults.py::test_receiving_designer_controls_show_exact_outside_defaults_for_each_physical_side"
          N4="tests/test_phase6_receiving_edge_controls_gui.py::test_endcap_four_edge_controls_live_on_drawing_edges_even_when_parameters_locked"
          N5="tests/test_phase6_receiving_edge_controls_gui.py::test_base_plate_four_shrinks_live_on_drawing_edges_and_bend_stays_in_settings_panel"
          N6="tests/test_phase6_receiving_edge_controls_gui.py::test_base_plate_edge_shrink_commit_uses_canonical_settings_transaction_and_updates_dimensions"
          N7="tests/test_phase6_left_global_transaction.py::test_global_controls_and_reset_only_live_in_persistent_top_area"
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_corner_transaction.py \
            tests/test_phase6_live_canonical_sync.py \
            tests/test_phase6_sync_envelope.py \
            tests/test_phase6_settings_center_bridge.py \
            tests/test_phase6_t02_endcap_edge_controls.py \
            tests/test_issue124_structure_tree.py \
            tests/test_receiving_cabinet_type.py \
            tests/test_receiving_side_panel_outside_defaults.py \
            tests/test_phase6_receiving_edge_controls_gui.py \
            tests/test_phase6_left_global_transaction.py \
            --deselect "$N1" --deselect "$N2" --deselect "$N3" \
            --deselect "$N4" --deselect "$N5" --deselect "$N6" --deselect "$N7"

      - name: Require exact inherited node parity
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_SHA"
          N1="tests/test_phase6_t02_endcap_edge_controls.py::test_head_settings_publish_four_edge_controls_directly_from_registry"
          N2="tests/test_receiving_cabinet_type.py::test_switching_3d_baseline_model_to_receiving_applies_receiving_family_policy"
          N3="tests/test_receiving_side_panel_outside_defaults.py::test_receiving_designer_controls_show_exact_outside_defaults_for_each_physical_side"
          N4="tests/test_phase6_receiving_edge_controls_gui.py::test_endcap_four_edge_controls_live_on_drawing_edges_even_when_parameters_locked"
          N5="tests/test_phase6_receiving_edge_controls_gui.py::test_base_plate_four_shrinks_live_on_drawing_edges_and_bend_stays_in_settings_panel"
          N6="tests/test_phase6_receiving_edge_controls_gui.py::test_base_plate_edge_shrink_commit_uses_canonical_settings_transaction_and_updates_dimensions"
          N7="tests/test_phase6_left_global_transaction.py::test_global_controls_and_reset_only_live_in_persistent_top_area"
          mkdir -p /tmp/issue366-final-inherited
          run_one() {
            label="$1"; ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            set +e
            xvfb-run -a python -m pytest -q "$N1" "$N2" "$N3" "$N4" "$N5" "$N6" "$N7" --tb=short \
              --json-report --json-report-file="/tmp/issue366-final-inherited/$label.json" \
              >/tmp/issue366-final-inherited/$label.log 2>&1
            rc=$?
            set -e
            echo "$rc" > "/tmp/issue366-final-inherited/$label.rc"
            test -s "/tmp/issue366-final-inherited/$label.json"
          }
          run_one baseline "$BASELINE_SHA"
          run_one candidate "$CANDIDATE"
          python - <<'PY'
          import json
          from pathlib import Path
          def outcomes(label):
              data=json.loads(Path(f"/tmp/issue366-final-inherited/{label}.json").read_text())
              return {row["nodeid"]: row.get("outcome") for row in data.get("tests", [])}
          b=outcomes("baseline"); c=outcomes("candidate")
          assert b == c, (b,c)
          assert len(b) == 7, b
          assert set(b.values()) == {"failed"}, b
          print("PASS ISSUE366_INHERITED_RED_EXACT_PARITY=7")
          PY
