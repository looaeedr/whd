name: "QA #394 T5 RED pure Final Scene projection"

on:
  push:
    branches:
      - "refactor/issue394-phase4-t5-final-scene-projection-20260920"
    paths:
      - "tests/test_issue394_final_scene_projection.py"
      - ".github/workflows/qa-issue394-t5-red.yml"

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=394"
          echo "PREDECESSOR=40f09602dcf1be3d08f859ab88a9780cad075fc5"
          git merge-base --is-ancestor 40f09602dcf1be3d08f859ab88a9780cad075fc5 HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest

      - name: Require intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue394_final_scene_projection.py --tb=short | tee /tmp/issue394-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "PYTEST_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "T5 requires phase6_final_scene_projection.py|missing projection functions|projection formulas still duplicated|No module named 'phase6_final_scene_projection'" /tmp/issue394-red.log
          echo "ISSUE394_T5_EXPECTED_RED=1"
