name: "QA #385 T2 assembly parent-child RED"

on:
  push:
    branches:
      - ui/issue385-assembly-parent-child-groups-20260919
    paths:
      - 'tests/test_issue385_assembly_parent_child_groups.py'
      - '.github/workflows/qa-issue385-t2-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 92ef5a18f9f1fd095ee16f8e065c56311af88e81)" = "92ef5a18f9f1fd095ee16f8e065c56311af88e81"
      - name: Install GUI harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Confirm intended T2 RED
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue385_assembly_parent_child_groups.py --tb=short | tee /tmp/t2-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "3 failed" /tmp/t2-red.log
          grep -q "assembly presentation grouping helper is missing" /tmp/t2-red.log
          echo "PASS EXPECTED_T2_RED=3"
