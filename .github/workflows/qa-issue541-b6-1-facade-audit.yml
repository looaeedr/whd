name: 工單541 B6-1 Facade 消費者稽核
run-name: "工單 #541 B6-1｜Facade 12-key Consumer Audit｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue541-b6-1-facade-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: B6-1 逐項 facade caller / dynamic refs 稽核
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 逐項掃描 12 個 facade keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue541
          python - <<'PY' | tee /tmp/issue541/audit.log
          from __future__ import annotations
          import json,re,subprocess
          from pathlib import Path

          keys=[
              "__getattr__",
              "_phase6_last_cutting_mesh",
              "_phase6_last_cutting_material",
              "_phase6_cutting_mesh_error",
              "_phase6_zoom_scale",
              "_phase6_view_initialized",
              "_phase6_base_renderer_render",
              "_phase6_scroll_cid",
              "__init__",
              "_refresh_part_buttons",
              "_refresh_part_button_states",
              "_refresh_add_part_menu",
          ]
          a0=json.loads(
              Path("docs/superpowers/checkpoints/issue521-a0-residual-ownership-census.json")
              .read_text(encoding="utf-8")
          )
          inventory={row["name"]:row for row in a0["facade"]["inventory"]}
          if set(keys)-set(inventory):
              raise SystemExit("A0 facade inventory missing batch keys")

          tracked=subprocess.check_output(["git","ls-files","-z"]).split(b"\0")
          paths=[Path(x.decode("utf-8","surrogateescape")) for x in tracked if x]
          excluded={
              ".github/workflows/qa-issue541-b6-1-facade-audit.yml",
          }

          def category(path):
              p=path.as_posix()
              if p.startswith("tests/"): return "tests"
              if p.startswith("docs/") or p.startswith("logs/") or p.startswith(".dispatch/") or p.endswith(".md"):
                  return "docs_evidence"
              if p.startswith(".github/workflows/"): return "workflow"
              if p.endswith(".py"): return "production_py"
              return "other"

          decoded={}
          for path in paths:
              p=path.as_posix()
              if p in excluded: continue
              try: data=path.read_bytes()
              except OSError: continue
              if b"\x00" in data[:4096]: continue
              try: decoded[p]=data.decode("utf-8","surrogateescape").splitlines()
              except UnicodeDecodeError: continue

          rows={}
          for key in keys:
              attr=re.compile(rf"\.\s*{re.escape(key)}\b")
              exact_str=re.compile(rf"['\"]{re.escape(key)}['\"]")
              getattr_pat=re.compile(rf"\b(?:getattr|setattr|hasattr)\([^\n]*['\"]{re.escape(key)}['\"]")
              refs=[]
              for p,lines in decoded.items():
                  for lineno,line in enumerate(lines,1):
                      kinds=[]
                      if attr.search(line): kinds.append("attribute")
                      if exact_str.search(line): kinds.append("exact_string")
                      if getattr_pat.search(line): kinds.append("dynamic_attr")
                      if not kinds: continue
                      # Drop the facade map row itself; it is inventory, not a consumer.
                      if p=="fold_designer_bridge.py" and "install_fold_designer_bridge_facade" not in line and (
                          f'"{key}":' in line or f"'{key}':" in line
                      ):
                          continue
                      refs.append({
                          "path":p,
                          "line":lineno,
                          "category":category(Path(p)),
                          "kinds":kinds,
                          "snippet":line.strip()[:260],
                      })
              runtime=[r for r in refs if r["category"] in {"production_py","tests","other"}]
              prod=[r for r in refs if r["category"]=="production_py"]
              tests=[r for r in refs if r["category"]=="tests"]
              dynamic=[r for r in refs if "dynamic_attr" in r["kinds"]]
              inv=inventory[key]
              rows[key]={
                  "value_expression":inv["value_expression"],
                  "a0_class":inv["current_compatibility_class"],
                  "property_compat":bool(inv["property_compat"]),
                  "runtime_ref_count":len(runtime),
                  "production_ref_count":len(prod),
                  "test_ref_count":len(tests),
                  "dynamic_ref_count":len(dynamic),
                  "runtime_refs":runtime[:30],
              }
              print("FACADE_KEY="+key)
              print("  VALUE="+inv["value_expression"])
              print("  A0_CLASS="+inv["current_compatibility_class"])
              print("  PROPERTY_COMPAT="+str(bool(inv["property_compat"])).lower())
              print("  PROD_REFS="+str(len(prod))+" TEST_REFS="+str(len(tests))+" DYNAMIC_REFS="+str(len(dynamic)))
              for ref in runtime[:12]:
                  print("  REF="+ref["category"]+":"+ref["path"]+":"+str(ref["line"])+":"+(",".join(ref["kinds"]))+":"+ref["snippet"])

          # Conservative candidate classification: property mappings are property
          # compatibility; dunder hooks/constructor remain legacy required; all
          # others require evidence-based review from their actual runtime refs.
          candidate={}
          for key,row in rows.items():
              if row["property_compat"]:
                  candidate[key]="PROPERTY_COMPAT"
              elif key in {"__getattr__","__init__"}:
                  candidate[key]="LEGACY_REQUIRED"
              elif row["production_ref_count"] or row["dynamic_ref_count"]:
                  candidate[key]="LEGACY_REQUIRED"
              elif row["test_ref_count"]:
                  candidate[key]="LEGACY_REQUIRED"
              else:
                  candidate[key]="NO_CALLER"
          payload={
              "schema":"WHD_ISSUE541_B6_1_FACADE_AUDIT_V1",
              "head_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "keys":keys,
              "rows":rows,
              "candidate_classification":candidate,
              "accounted":len(rows),
              "unclassified":0,
          }
          Path("/tmp/issue541/facade-audit.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print("B6_1_ACCOUNTED="+str(len(rows)))
          print("B6_1_UNCLASSIFIED=0")
          print("B6_1_CANDIDATE_CLASSIFICATION="+json.dumps(candidate,ensure_ascii=False,sort_keys=True))
          print("ISSUE541_B6_1_AUDIT=GREEN")
          PY

      - name: 上傳 B6-1 稽核證據
        uses: actions/upload-artifact@v4
        with:
          name: issue541-b6-1-facade-audit
          path: /tmp/issue541/
          if-no-files-found: error
          retention-days: 14
