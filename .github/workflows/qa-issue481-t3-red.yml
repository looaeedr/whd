name: Issue 481 T3 Requirement RED

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue481-t3-red.yml'
      - 'tests/test_issue481_derived_apply_linked_endcap_owner.py'
      - 'tests/test_issue480_derived_part_projection_plan.py'
      - 'phase6_workspace_navigation_controller.py'
      - 'fold_designer_bridge.py'
      - 'docs/superpowers/checkpoints/issue481-t3-linked-endcap-decision.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirement-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T3 ownership RED contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue365_t1_workspace_navigation_controller.py
