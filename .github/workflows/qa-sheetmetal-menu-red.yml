name: Sheet-metal Menu RED Proof

on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-menu-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and focused dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Prove hidden production sheet-metal menu is RED
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -s \
            tests/test_issue186_sheetmetal_selector_visibility.py::test_issue186_sheetmetal_compact_menu_is_operator_visible_and_live
