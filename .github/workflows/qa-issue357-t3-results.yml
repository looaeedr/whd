name: "#357 T3 explicit manufacturing results"

on:
  push:
    branches:
      - refactor/issue357-manufacturing-explicit-results-20260919
    paths:
      - 'tests/test_issue357_manufacturing_result_contracts.py'
      - 'phase6_manufacturing_contracts.py'
      - 'phase6_manufacturing_adapter.py'
      - '.github/workflows/qa-issue357-t3-results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run explicit-result contracts
        run: python -m pytest -q tests/test_issue357_manufacturing_result_contracts.py
