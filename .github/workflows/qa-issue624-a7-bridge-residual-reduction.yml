name: "WHD｜工單 #624｜A7 Bridge 殘餘責任 RED/GREEN 驗收"
run-name: "WHD｜#624 A7｜P7-R-A Bridge 殘餘責任驗收"

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue624_phase7_a7_bridge_residual_reduction.py'
      - 'docs/superpowers/checkpoints/issue624-a7-bridge-residual-census.md'
      - '.github/workflows/qa-issue624-a7-bridge-residual-reduction.yml'

permissions:
  contents: read

jobs:
  focused:
    name: "A7｜P7-R-A 聚焦驗收"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "簽出 Phase 7 A7 工單主分支"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "確認 A7 lineage"
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99e389de4e82ad5e34f80cc91e2e83aab0dd0f7d HEAD
          echo "A7_PARENT=99e389de4e82ad5e34f80cc91e2e83aab0dd0f7d"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: "安裝聚焦測試相依"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: "執行 P7-R-A Bridge 殘餘責任測試"
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue624_phase7_a7_bridge_residual_reduction.py --tb=short
