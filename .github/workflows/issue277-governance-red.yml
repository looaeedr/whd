name: Issue 277 T2 Governance RED

on:
  push:
    branches:
      - test-cleanup/issue277-governance-20260915

permissions:
  contents: read

env:
  ISSUE: 277
  WORKER: chatgpt
  TASK_BRANCH: test-cleanup/issue277-governance-20260915
  CLAIM_REF: coord/claim-issue277-20260915
  BASE_SHA: a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6
  STALE_NODE: tests/test_phase6_semantic_doc_status.py::test_current_overlay_docs_point_to_v3_standard_plus_semantic_delta

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TASK_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'docs/superpowers/plans/2026-09-15-issue277-governance-test-cleanup.md',
            '.github/workflows/issue277-governance-red.yml',
          }
          changed={line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          assert not (changed-allowed), sorted(changed-allowed)
          print('T2_RED_SCOPE_LOCK=GREEN')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Read shared claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue277/red
          git fetch origin "$CLAIM_REF" --depth=1
          git show FETCH_HEAD:.coord/claims/issue277.json > .scratch/issue277/red/claim.json
      - name: Execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim .scratch/issue277/red/claim.json \
            --issue "$ISSUE" --worker "$WORKER" --branch "$TASK_BRANCH" \
            --action qa-dispatch --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"
      - name: Fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > .scratch/issue277/preflight-evidence.md <<'EOF'
          # Issue 277 preflight evidence
          - Read issue #277 scope / hard gates.
          - Read stale semantic-doc test.
          - Read tests/knowledge/test_issue233_strict_metadata_migration.py.
          - Read tools/knowledge_governance.py metadata parser authority.
          - Read AI_HANDOFF.md and CONTEXT.md structured metadata.
          - Read Canonical Authority Map phase6-dimension-semantics CURRENT row.
          EOF
          python tools/phase6_skill_preflight.py \
            --task '派工 governance TEST cleanup semantic metadata RED' \
            --changed-file docs/superpowers/plans/2026-09-15-issue277-governance-test-cleanup.md \
            --changed-file .github/workflows/issue277-governance-red.yml \
            --evidence .scratch/issue277/preflight-evidence.md
      - name: Prove stale free-text authority contract RED on exact parent
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue277/red
          git worktree add --detach /tmp/issue277-parent "$BASE_SHA"
          set +e
          (cd /tmp/issue277-parent && python -m pytest -q --tb=short "$STALE_NODE") > "$root/stale-red.txt" 2>&1
          rc=$?
          set -e
          git worktree remove --force /tmp/issue277-parent
          test "$rc" -ne 0
          grep -F "FAILED $STALE_NODE" "$root/stale-red.txt" >/dev/null
          grep -F 'AI_HANDOFF.md' "$root/stale-red.txt" >/dev/null
          grep -F 'assert "CURRENT" in current' "$root/stale-red.txt" >/dev/null
          echo 'STALE_FREE_TEXT_AUTHORITY_RED_PROVEN=1' | tee "$root/result.txt"
      - name: Prove structured metadata baseline is already GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/knowledge/test_issue233_strict_metadata_migration.py | tee .scratch/issue277/red/structured-baseline.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue277-t2-red
          path: .scratch/issue277/
          if-no-files-found: error
