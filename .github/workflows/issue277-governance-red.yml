name: Issue 277 T2 Governance QA

on:
  push:
    branches:
      - test-cleanup/issue277-governance-20260915

permissions:
  contents: read

env:
  ISSUE: 277
  WORKER: chatgpt
  TASK_BRANCH: test-cleanup/issue277-governance-20260915
  CLAIM_REF: coord/claim-issue277-20260915
  BASE_SHA: a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6
  STALE_NODE: tests/test_phase6_semantic_doc_status.py::test_current_overlay_docs_point_to_v3_standard_plus_semantic_delta

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock exact T2 lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue277/runtime
          test "$GITHUB_REF_NAME" = "$TASK_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git -c core.quotepath=false diff --name-only "$BASE_SHA" "$GITHUB_SHA" | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/issue277-governance-red.yml',
            'docs/superpowers/plans/2026-09-15-issue277-governance-test-cleanup.md',
            'docs/superpowers/verification/2026-09-15-issue275-test-inventory.md',
            'docs/superpowers/verification/2026-09-15-issue276-pytest-taxonomy-acceptance.md',
            'tests/test_phase6_semantic_doc_status.py',
            '個人AI檔案庫/第二層_專案與SOP/09_X第二主分支與獨立工單鏈治理規格.md',
          }
          changed={line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          extra=sorted(changed-allowed)
          assert not extra, f'out-of-scope T2 drift: {extra}'
          assert 'tests/test_phase6_semantic_doc_status.py' in changed, changed
          print('T2_SCOPE_LOCK=GREEN')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Read shared claim
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CLAIM_REF" --depth=1
          git show FETCH_HEAD:.coord/claims/issue277.json > .scratch/issue277/runtime/claim.json
      - name: Execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim .scratch/issue277/runtime/claim.json \
            --issue "$ISSUE" --worker "$WORKER" --branch "$TASK_BRANCH" \
            --action qa-dispatch --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"
      - name: Fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > .scratch/issue277/runtime/preflight-evidence.md <<'EOF'
          # Issue #277 / T2 preflight evidence
          MASTER_ID: #274
          TASK_ID: #277 / T2
          TARGET_X: cleanup/2d-3d-sync
          FROZEN_X_BASE_SHA: 269a2972f0f88ffc7085ee3f1483a57145d8b2e8
          EXPECTED_PARENT_SHA: a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6
          WORK_ORDER_BRANCH: work/test-cleanup-274-20260915
          TASK_BRANCH: test-cleanup/issue277-governance-20260915
          ROLE: T2 implementer

          READ_SKILL: Python測試實務
          READ_SKILL: 派工
          READ_SKILL: monitoring-remote-qa
          READ_SKILL: long-log-context-safe-execution
          READ_SKILL: executable-continuity-controller
          READ_SKILL: issue-closure-gate

          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/09_X第二主分支與獨立工單鏈治理規格.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md

          AUTHORITY_EVIDENCE:
          - AI_HANDOFF.md = REFERENCE / handoff-ledger.
          - CONTEXT.md = REFERENCE / project-reference.
          - global pitfall ledger = REFERENCE / pitfall-ledger.
          - Canonical Authority Map declares the unique CURRENT owner of phase6-dimension-semantics.
          - The owner is 個人AI檔案庫/第二層_專案與SOP/07_Phase6尺寸語意與標準截角母規則.md.
          BOUNDARY:
          - Tests consume authority; tests do not define runtime geometry/dimensions/DXF/identity.
          - No production behavior mutation is allowed in T2.
          EOF
          python tools/phase6_skill_preflight.py \
            --task '派工 governance TEST cleanup structured metadata acceptance' \
            --changed-file tests/test_phase6_semantic_doc_status.py \
            --changed-file docs/superpowers/plans/2026-09-15-issue277-governance-test-cleanup.md \
            --changed-file docs/superpowers/verification/2026-09-15-issue275-test-inventory.md \
            --changed-file docs/superpowers/verification/2026-09-15-issue276-pytest-taxonomy-acceptance.md \
            --changed-file 個人AI檔案庫/第二層_專案與SOP/09_X第二主分支與獨立工單鏈治理規格.md \
            --changed-file .github/workflows/issue277-governance-red.yml \
            --evidence .scratch/issue277/runtime/preflight-evidence.md
      - name: Capture protected manifests
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue277/runtime
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/before.sha256"
      - name: Reconfirm stale parent contract RED
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue277/runtime
          git worktree add --detach /tmp/issue277-parent "$BASE_SHA"
          set +e
          (cd /tmp/issue277-parent && python -m pytest -q --tb=short "$STALE_NODE") > "$root/stale-parent-red.txt" 2>&1
          rc=$?
          set -e
          git worktree remove --force /tmp/issue277-parent
          test "$rc" -ne 0
          grep -F "FAILED $STALE_NODE" "$root/stale-parent-red.txt" >/dev/null
          grep -F 'assert "CURRENT" in current' "$root/stale-parent-red.txt" >/dev/null
          echo 'STALE_PARENT_RED=PROVEN' | tee "$root/red-proof.txt"
      - name: GREEN migrated semantic governance contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_phase6_semantic_doc_status.py | tee .scratch/issue277/runtime/semantic-green.txt
      - name: GREEN strict metadata governance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/knowledge/test_issue233_strict_metadata_migration.py | tee .scratch/issue277/runtime/strict-metadata.txt
      - name: GREEN full governance lane
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short -m governance tests | tee .scratch/issue277/runtime/governance-lane.txt
      - name: Prove durable process contracts remain in governance lane
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue277/runtime
          python -m pytest --collect-only -q -m governance tests/process | tee "$root/process-collection.txt"
          grep -F 'tests/process/test_checkpoint_resume_contract.py' "$root/process-collection.txt" >/dev/null
          grep -F 'tests/process/test_continuous_execution_durable_contract.py' "$root/process-collection.txt" >/dev/null
          grep -F 'tests/process/test_no_fake_completion_contract.py' "$root/process-collection.txt" >/dev/null
          grep -F 'tests/process/test_monitoring_remote_qa_turn_boundary_contract.py' "$root/process-collection.txt" >/dev/null
          echo 'DURABLE_PROCESS_GOVERNANCE_COVERAGE=GREEN' | tee "$root/process-coverage.txt"
      - name: Verify no outcome-control weakening
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue277/runtime
          git diff "$BASE_SHA" "$GITHUB_SHA" -- tests/test_phase6_semantic_doc_status.py > "$root/semantic.diff"
          ! grep -E '^\+.*(@pytest\.mark\.(skip|skipif|xfail)|pytest\.(skip|xfail)\()' "$root/semantic.diff"
          echo 'OUTCOME_CONTROL_DRIFT=0' | tee "$root/outcome-control.txt"
      - name: Verify protected invariants and clean runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue277/runtime
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/after.sha256"
          diff -u "$root/before.sha256" "$root/after.sha256" | tee "$root/invariant-diff.txt"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Seal GREEN result
        shell: bash
        run: |
          set -euo pipefail
          echo 'ISSUE277_T2_GOVERNANCE_QA=GREEN' | tee .scratch/issue277/runtime/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue277-t2-governance
          path: .scratch/issue277/runtime/
          if-no-files-found: error
