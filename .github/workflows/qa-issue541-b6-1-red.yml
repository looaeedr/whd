name: 工單541 B6-1 Removal RED
run-name: "工單 #541 B6-1｜Zero-Caller Facade Removal RED｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue541-b6-1-red.yml

permissions:
  contents: read

jobs:
  red:
    name: 驗證 4 個 NO_CALLER facade 先紅
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 pytest
        run: python -m pip install pytest
      - name: 新 requirement 必須先 RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue541_b6_1_facade_batch.py > /tmp/issue541-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue541-red.log
          test "$rc" -ne 0
          grep -E "B6-1 RED|2 failed|failed" /tmp/issue541-red.log
          echo "ISSUE541_B6_1_REPLACEMENT_RED=GREEN"
      - name: 上傳 RED 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue541-b6-1-red
          path: /tmp/issue541-red.log
          if-no-files-found: error
          retention-days: 14
