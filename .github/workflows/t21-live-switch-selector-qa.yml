name: T21 Live Switch Selector QA

on:
  push:
    branches:
      - work/20260906-t3-live-switch-selector
    paths:
      - fold_designer_bridge.py
      - tests/test_phase6_t21_live_switch_selector.py

permissions:
  contents: read

jobs:
  t21:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Run T21 exact live-switch QA
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t21_live_switch_selector.py \
            tests/test_phase6_t19_receiving_baseplate_topology.py \
            2>&1 | tee t21.log
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-live-switch-selector-log
          path: t21.log
