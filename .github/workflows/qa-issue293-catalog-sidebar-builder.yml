name: QA issue293 catalog sidebar builder GREEN

on:
  push:
    branches:
      - refactor/issue293-catalog-sidebar-builder-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply catalog sidebar extraction
        run: python tools/qa_issue293_catalog_sidebar_builder_green.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Verify focused GREEN
        run: python -m py_compile gui.py gui_modules/editors/hole_editor_view.py && python -m pytest -q tests/test_issue293_t5_catalog_sidebar_builder_slice.py tests/test_issue293_t5_catalog_controls_slice.py tests/test_issue293_t5_form_row_builders_slice.py tests/test_issue293_t5_window_shell_slice.py tests/test_issue293_t5_indicator_panel_builder_slice.py
      - name: Verify diff and residual size
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('gui.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text)
          host=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='Phase6ApplicationHost')
          fn=next(n for n in host.body if isinstance(n,ast.FunctionDef) and n.name=='_open_unified_hole_editor')
          print(f'ROOT_SPAN={fn.end_lineno-fn.lineno+1}')
          print(f'GUI_LOC={len(text.splitlines())}')
          PY
      - name: Commit GREEN after verification
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add gui.py gui_modules/editors/hole_editor_view.py
          git diff --cached --check
          git commit -m "refactor(#293): extract catalog sidebar builder"
          git push origin HEAD:${GITHUB_REF_NAME}
