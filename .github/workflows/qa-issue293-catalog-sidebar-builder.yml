name: QA issue293 catalog sidebar builder slice

on:
  push:
    branches:
      - refactor/issue293-catalog-sidebar-builder-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run catalog sidebar builder RED
        run: python -m pytest -q tests/test_issue293_t5_catalog_sidebar_builder_slice.py
