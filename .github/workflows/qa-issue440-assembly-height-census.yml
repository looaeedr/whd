name: "QA #440 assembly height census"

on:
  push:
    branches:
      - fix/issue440-assembly-content-height-20260920
    paths:
      - 'tests/test_issue440_assembly_height_census.py'
      - '.github/workflows/qa-issue440-assembly-height-census.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 2b9aeccee2c91446ca02cbfe9fdcefee587ba29e

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove runtime unchanged from production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA:fold_designer_bridge.py")" = "$(git rev-parse HEAD:fold_designer_bridge.py)"
          test "$(git rev-parse "$BASE_SHA:phase6_assembly_panel.py")" = "$(git rev-parse HEAD:phase6_assembly_panel.py)"
          echo "PRODUCTION_RUNTIME_EDIT=0"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest matplotlib numpy shapely ezdxf
      - name: Measure exact production Assembly heights
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x900x24"             python -m pytest -q -s tests/test_issue440_assembly_height_census.py --tb=short             | tee issue440-assembly-height-census.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue440-assembly-height-census
          path: issue440-assembly-height-census.log
          if-no-files-found: error
