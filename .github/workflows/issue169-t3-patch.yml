name: Issue 169 T3 Navigation Caller Patch

on:
  push:
    branches:
      - refactor/dm7-t3-navigation-callers-20260913

permissions:
  contents: write

jobs:
  patch-navigation-callers:
    if: github.event.head_commit.message == 'ci: add issue169 T3 patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact T3 caller migration
        shell: python
        run: |
          from pathlib import Path

          path = Path('fold_designer_bridge.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    remembered = str(getattr(self, "_phase6_box_body_active_piece_key", "") or "")\n    if key == remembered:\n        return\n    self._phase6_box_body_active_piece_key = key\n    if str(getattr(_designer_workspace(self), "active_part", "") or "") != key:\n        self.activate_part(key)\n''',
                  '''    workspace = _designer_workspace(self)\n    if str(getattr(workspace, "active_part", "") or "") == key:\n        # Keep ephemeral navigation memory synchronized without re-activating an\n        # already-active manufacturing part.  Resolution remains the authority.\n        _phase6_resolve_operator_part_key(self, key)\n        return\n    _phase6_activate_operator_part(self, key)\n''',
                  'legacy BoxBody child-tab callback',
              ),
              (
                  '''    if requested == "box_body":\n        resolved = (\n            _phase6_resolve_operator_part_key(self, requested)\n            if _phase6_current_cabinet_family(self) == "受電箱"\n            else requested\n        )\n    elif _phase6_is_box_body_physical_piece_key(requested):\n        resolved = _phase6_resolve_operator_part_key(self, requested)\n    else:\n        resolved = requested\n''',
                  '''    # All stable identities use the same pure navigation projection.\n    # Corner Data remains view-only because resolution does not activate the\n    # manufacturing workspace.\n    resolved = _phase6_resolve_operator_part_key(self, requested)\n''',
                  'Corner Data stable-identity resolver',
              ),
              (
                  '''def _fix11_activate_selected_part(self):\n    key = getattr(self, "selected_part_key", None)\n    if key not in self.available_parts:\n        return False\n    self.activate_part(key)\n    return True\n''',
                  '''def _fix11_activate_selected_part(self):\n    key = getattr(self, "selected_part_key", None)\n    if key not in self.available_parts:\n        return False\n    _phase6_activate_operator_part(self, key)\n    return True\n''',
                  'selected-part activation caller',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source block, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Compile bridge
        run: python -m py_compile fold_designer_bridge.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fold_designer_bridge.py
          git diff --cached --check
          git commit -m "refactor: route DM7 navigation callers [t3-patch]"
          git push origin HEAD:refactor/dm7-t3-navigation-callers-20260913
