name: "QA #333 T0 UI v3 RED"

on:
  push:
    branches:
      - ui/issue333-v3-baseline-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue333_ui_v3_t0_red.py > issue333-red.log 2>&1
          rc=$?
          set -e
          cat issue333-red.log
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: characterization unexpectedly GREEN; T0 no longer proves the v3 gap"
            exit 1
          fi
          grep -F "#333 EXPECTED RED" issue333-red.log
          grep -E "1 failed, 4 passed" issue333-red.log
          if grep -E "[2-9][0-9]* failed|[2-9] failed|ERRORS| error" issue333-red.log; then
            echo "FAIL: RED set is broader than the single intended layout gap"
            exit 1
          fi

  no-production-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify T0 changes are characterization-only
        shell: bash
        run: |
          git diff --name-only d88bf904317fb16744bfc644bb89ff7b405c435e...HEAD | tee issue333-changed.txt
          python - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/qa-issue333-t0-red.yml",
              "docs/superpowers/checkpoints/issue333-ui-v3-t0-baseline.md",
              "tests/test_issue333_ui_v3_t0_red.py",
          }
          changed = {
              line.strip()
              for line in Path("issue333-changed.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          missing = sorted({
              "docs/superpowers/checkpoints/issue333-ui-v3-t0-baseline.md",
              "tests/test_issue333_ui_v3_t0_red.py",
          } - changed)
          if unexpected:
              raise SystemExit(f"production drift in T0: {unexpected}")
          if missing:
              raise SystemExit(f"missing T0 evidence: {missing}")
          print("T0 characterization-only diff PASS", sorted(changed))
          PY
