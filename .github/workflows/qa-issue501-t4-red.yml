name: "QA #501 T4 Baseline Reset RED"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue501-t4-red.yml'

permissions:
  contents: read

jobs:
  t4-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install focused harness
        run: |
          python -m pip install pytest
      - name: Run expected R3/R4 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue501_baseline_reset_coordinator.py --tb=short > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "RED R3|RED R4|apply_baseline_transition|reset_factory_settings" /tmp/red.log
          echo "ISSUE501_R3_R4_EXPECTED_RED=1"
          exit 0
