name: "WHD｜#684｜Real HA Combined Acceptance"

on:
  push:
    branches:
      - work/issue684-real-ha-integration-combined-20260927
    paths:
      - tests/process/test_issue680_planned_handoff_scheduler_receiver.py
      - tests/process/test_issue681_poweroff_gate.py
      - tests/process/test_issue682_outage_recovery.py
      - tests/process/test_issue683_ha_transport_projection.py
      - .agents/skills/engineering/排程模擬/SKILL.md
      - 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md
      - 個人AI檔案庫/第二層_專案與SOP/11_WHD_Scheduled_Resume_ChatGPT自動續跑規則.md
      - 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
      - docs/governance/whd_ha_poweroff_integration_usage.md
      - tests/process/test_issue684_real_ha_combined_acceptance.py
      - tools/whd_poweroff_end_to_end_acceptance.py
      - tools/workstation_poweroff_gate.py
      - tools/whd_poweroff_ha_bridge.py
      - .github/workflows/qa-issue684-real-ha-combined.yml

permissions:
  contents: read

concurrency:
  group: issue684-real-ha-combined
  cancel-in-progress: false

jobs:
  r11:
    name: "R11 end-to-end HA/Node-RED acceptance boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact #684 head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install pytest

      - name: Run #684 R11 behavioral acceptance
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q --tb=short
          tests/process/test_issue680_planned_handoff_scheduler_receiver.py
          tests/process/test_issue681_poweroff_gate.py
          tests/process/test_issue682_outage_recovery.py
          tests/process/test_issue683_ha_transport_projection.py
          tests/process/test_issue684_real_ha_combined_acceptance.py
