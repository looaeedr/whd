name: issue188-preflight-discovery-selfclean
on:
  push:
    branches:
      - feat/issue188-dark-engineering-theme-20260913
    paths:
      - .github/workflows/issue188-preflight-discovery-selfclean.yml
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-clean discovery harness
        shell: bash
        run: |
          git config user.name looaeedr
          git config user.email 76246585+looaeedr@users.noreply.github.com
          rm .github/workflows/issue188-preflight-discovery-selfclean.yml
          git add -A
          git commit -m 'chore(issue188): remove preflight discovery harness'
          git push origin HEAD:feat/issue188-dark-engineering-theme-20260913
          echo "ISSUE188_DISCOVERY_CLEAN_SHA=$(git rev-parse HEAD)"
      - name: Discover required Skills and references
        shell: bash
        run: |
          python - <<'PY'
          from tools.phase6_skill_preflight import required_skills_for, required_references_for
          task = '#188 T3 WHD dark engineering theme 3D readability Tk ttk Matplotlib UI text scale 1.0 1.2 1.4 Corner Data Output DXF persistence config invariant 派工'
          changed = [
              'gui.py', 'fold_designer_original.py', 'fold_designer_bridge.py',
              'phase6_settings_panel.py', 'phase6_final_scene_view.py', 'ui_text_scale.py',
              'tests/test_issue188_dark_theme_readability.py',
          ]
          print('ISSUE188_REQUIRED_SKILLS')
          for x in required_skills_for(task=task, changed_files=changed): print(x)
          print('ISSUE188_REQUIRED_REFERENCES')
          for x in required_references_for(task=task, changed_files=changed): print(x)
          PY
      - name: Source seam drift map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          probes = {
            'gui.py': ['COLOR_BG', 'COLOR_PANEL', 'COLOR_INPUT_BG', 'COLOR_TEXT', 'COLOR_TEXT_MUTED', 'COLOR_ACCENT', 'COLOR_CANVAS_BG', 'setup_styles'],
            'fold_designer_bridge.py': ['right_controls_host', 'top_command_row', 'output_export_vars', 'output_draw_stock_var', 'structure_tree'],
            'phase6_settings_panel.py': ['tk.Menu', 'Menubutton', 'ttk.Entry'],
            'phase6_final_scene_view.py': ['ax.clear', 'text2D', 'ax.text', 'set_facecolor'],
            'ui_text_scale.py': ['TextScaleController', 'persist'],
          }
          for file, needles in probes.items():
              text = Path(file).read_text(encoding='utf-8')
              print(f'-- {file} sha-content-len={len(text)}')
              for needle in needles:
                  hits = [i+1 for i,line in enumerate(text.splitlines()) if needle in line]
                  print(f'{needle}: {hits[:12]}')
          tests = sorted(p.name for p in Path('tests').glob('test_issue18*.py'))
          print('ISSUE18X_TEST_FILES=', tests)
          PY
