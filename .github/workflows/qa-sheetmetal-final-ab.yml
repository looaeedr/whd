name: Sheet-metal Menu Final A-B Acceptance

on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-final-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-headless-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec0724c892dd0d44f1bb4e0b80e90a85820df209
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind production base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ec0724c892dd0d44f1bb4e0b80e90a85820df209"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run full production headless and require exact inherited RED set
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q 2>&1 | tee /tmp/base-headless.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          python - <<'PY'
          import re
          from pathlib import Path
          expected = {
              'tests/knowledge/test_issue233_strict_metadata_migration.py::test_all_governed_markdown_has_valid_whd_doc_meta_v1',
              'tests/knowledge/test_issue233_strict_metadata_migration.py::test_strict_validator_accepts_the_repository_after_migration',
              'tests/knowledge/test_issue252_t6_strict_validation.py::test_exact_governed_set_matches_effective_authority_and_strict_validation',
              'tests/knowledge/test_issue255_t6_authority_completion.py::test_repository_effective_authority_is_total_and_unblocked',
          }
          text = Path('/tmp/base-headless.log').read_text(encoding='utf-8', errors='replace')
          actual = set(re.findall(r'^FAILED (\S+?::\S+)(?:\s+-|$)', text, re.M))
          print('BASE_FAILURES=', sorted(actual))
          assert actual == expected, (actual, expected)
          PY

  candidate-xvfb:
    needs: base-headless-ab
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact candidate HEAD
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -F 'self.part_choice_button.pack(fill=original.tk.X, pady=(0, 4))' fold_designer_bridge.py
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Capture protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Run full candidate Xvfb and require no new failures
        run: |
          set -euo pipefail
          set +e
          xvfb-run -a python -m pytest -q 2>&1 | tee /tmp/candidate-xvfb.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          python - <<'PY'
          import re
          from pathlib import Path
          expected = {
              'tests/knowledge/test_issue233_strict_metadata_migration.py::test_all_governed_markdown_has_valid_whd_doc_meta_v1',
              'tests/knowledge/test_issue233_strict_metadata_migration.py::test_strict_validator_accepts_the_repository_after_migration',
              'tests/knowledge/test_issue252_t6_strict_validation.py::test_exact_governed_set_matches_effective_authority_and_strict_validation',
              'tests/knowledge/test_issue255_t6_authority_completion.py::test_repository_effective_authority_is_total_and_unblocked',
          }
          text = Path('/tmp/candidate-xvfb.log').read_text(encoding='utf-8', errors='replace')
          actual = set(re.findall(r'^FAILED (\S+?::\S+)(?:\s+-|$)', text, re.M))
          print('CANDIDATE_XVFB_FAILURES=', sorted(actual))
          assert actual == expected, (actual, expected)
          PY
      - name: Verify protected invariants and clean tree
        if: always()
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          git diff --exit-code
