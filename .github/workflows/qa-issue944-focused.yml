name: WHD｜#944｜Parameter Panel Port Focused
run-name: "WHD｜#944｜Parameter-panel exact regression｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue944-restore-parameter-panel-port-20260928
    paths:
      - fold_designer_bridge.py
      - tests/test_issue624_phase7_a7_bridge_residual_reduction.py
      - docs/superpowers/checkpoints/issue624-a7-bridge-residual-census.md
      - .github/workflows/qa-issue944-focused.yml

permissions:
  contents: read

concurrency:
  group: issue944-parameter-panel-focused
  cancel-in-progress: false

jobs:
  focused:
    name: Xvfb compatibility port + anti-regrowth
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Run exact parameter-panel regression
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          xvfb-run -a python -m pytest -q             tests/test_issue624_phase7_a7_bridge_residual_reduction.py             tests/test_corner_parameter_lock.py             --junitxml=issue944-focused.xml             2>&1 | tee issue944-focused.log

      - name: Run permanent Bridge anti-regrowth guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_bridge_anti_regrowth_guard.py             --root .             --baseline docs/architecture/phase6_bridge_anti_regrowth_baseline.json             --c0-record docs/superpowers/checkpoints/issue532-c0-final-classification.json             --json-out issue944-anti-regrowth.json             2>&1 | tee issue944-anti-regrowth.log
          grep -F "PHASE6_BRIDGE_ANTI_REGROWTH_GREEN" issue944-anti-regrowth.log

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue944-focused-${{ github.sha }}
          path: |
            issue944-focused.xml
            issue944-focused.log
            issue944-anti-regrowth.json
            issue944-anti-regrowth.log
          if-no-files-found: warn
          retention-days: 14
