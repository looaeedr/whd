name: "QA #502 T5 Editor Settings GREEN"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue502-t5-green.yml'

permissions:
  contents: read

jobs:
  t5-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T5 focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue502_editor_settings_commit_seam.py             tests/test_issue498_settings_application_coordinator.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue366_t2b_structure_endcap_controller.py             tests/test_gui_fold_designer_transaction_contract.py             tests/test_phase6_linked_fold_chain_and_parts.py             --tb=short
      - name: Architecture ratchet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          bridge = Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree = ast.parse(bridge)
          funcs = {
              node.name: ast.get_source_segment(bridge, node) or ""
              for node in tree.body if isinstance(node, ast.FunctionDef)
          }
          store = funcs["_phase6_store_editor_values"]
          assert "_phase6_settings_coordinator(self).commit_editor_values" in store
          forbidden = (
              "normalize_ui_text_size(",
              "commit_box_fw(",
              "self._phase6_input_snapshot.update(",
              "self._settings_values[",
              "self._phase6_box_whd[",
              "_phase6_recalculate_part_dimensions(",
              "_phase6_refresh_linked_part_profiles(",
              "self._settings_change_callback(",
          )
          assert [token for token in forbidden if token in store] == []
          assert "def _fix11_save_current_part(" in bridge
          assert "def _fix11_activate_part(" in bridge
          assert "def _phase6_rebuild_linked_endcaps(" in bridge
          assert not Path("phase6_part_editor_session.py").exists()

          coordinator = Path(
              "gui_modules/application/fold_designer_settings_coordinator.py"
          ).read_text(encoding="utf-8")
          ctree = ast.parse(coordinator)
          imports = set()
          for node in ast.walk(ctree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          forbidden_imports = {
              name for name in imports
              if name == "fold_designer_bridge"
              or name == "tkinter"
              or name.startswith("tkinter.")
              or "manufacturing" in name
          }
          assert forbidden_imports == set(), forbidden_imports

          facade_call = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "install_fold_designer_bridge_facade"
          )
          assert isinstance(facade_call.args[1], ast.Dict)
          facade_count = len(facade_call.args[1].keys)
          assert facade_count <= 69, facade_count
          print(f"FACADE_BINDING_COUNT={facade_count}")
          print("ISSUE502_T5_ARCH_GREEN=1")
          PY
