name: DM6 T2 Acceptance QA

on:
  push:
    branches:
      - work/dm6-t2-layout-semantic-identity
    paths:
      - .github/workflows/dm6-t2-qa.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: T2 focused acceptance
        run: |
          python -m pytest -q tests/test_dm6_layout_semantic_identity.py tests/test_dm6_annotation_semantic_contract.py tests/test_drawing_annotations.py tests/test_annotation_collision_resolver.py
      - name: Compile changed production modules
        run: |
          python -m py_compile ae_engine/drawing_annotations.py ae_engine/drawing_annotation_layout.py ae_engine/sheetmetal_drawing.py
      - name: Source authority guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ae_engine/drawing_annotation_layout.py').read_text(encoding='utf-8')
          forbidden = [
              'if str(getattr(dim, "label", "")) == str(primitive.text)',
              'item[3] == str(primitive.text)',
              'Duplicate labels are resolved deterministically by distance',
          ]
          hits = [x for x in forbidden if x in text]
          if hits:
              raise SystemExit(f'forbidden label authority remains: {hits}')
          PY
