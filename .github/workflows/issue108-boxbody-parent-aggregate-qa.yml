name: Issue108 BoxBody Parent Aggregate QA
on:
  push:
    branches: [fix/issue108-boxbody-parent-aggregate-20260911]
    paths:
      - .github/workflows/issue108-boxbody-parent-aggregate-qa.yml
      - fold_designer_bridge.py
      - tests/test_issue96_corner_data_selection_lifecycle.py
      - tests/test_issue97_authoritative_unfold_view_adapter.py

permissions:
  contents: read

jobs:
  focused-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Phase6 changed-file preflight
        run: |
          cat > /tmp/issue108-preflight-evidence.txt <<'EOF'
          派工
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          驗證板件與DXF
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task '#108 BoxBody parent identity aggregate unfold projection regression QA；多件式 physical part 2D/3D sync；remote QA' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue96_corner_data_selection_lifecycle.py \
            --changed-file tests/test_issue97_authoritative_unfold_view_adapter.py \
            --evidence /tmp/issue108-preflight-evidence.txt
      - name: Focused parent identity and aggregate projection
        run: |
          pytest -q \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py
      - name: Nearby Corner Data headless regression
        run: |
          pytest -q \
            tests/test_issue94_corner_data_navigation_mode.py \
            tests/test_issue95_corner_data_authoritative_parts.py \
            tests/test_issue98_existing_2d_capability_migration.py \
            tests/test_issue99_dual_view_parity_persistence.py \
            tests/test_issue100_remove_legacy_2d_entry.py
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
