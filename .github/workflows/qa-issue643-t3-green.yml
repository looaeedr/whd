name: QA Issue 643 T3 GREEN

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - .github/workflows/qa-issue643-t3-green.yml
      - tests/process/test_issue643_guard_transaction_gate.py
      - tools/execution_claim_guard.py
      - tools/continuity_controller.py

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run T3 focused GREEN and T1/T2 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/process/test_issue643_guard_transaction_gate.py             tests/process/test_issue641_closing_turn_exit_red.py::test_red_close_02_turn_exit_api_has_machine_context_beyond_checkpoint_only             tests/process/test_issue641_closing_turn_exit_red.py::test_red_close_02_issue638_post_merge_gap_has_durable_state_evaluator             tests/process/test_continuity_controller.py             tests/process/test_issue256_execution_claim_guard.py             tests/process/test_issue642_active_claim_checkpoint_gate.py             | tee /tmp/issue643-green.log
          echo "ISSUE643_T3_CORE_GREEN=PASS" | tee -a /tmp/issue643-green.log
      - uses: actions/upload-artifact@v4
        with:
          name: issue643-t3-green-${{ github.run_id }}
          path: /tmp/issue643-green.log
          if-no-files-found: error
          retention-days: 30
