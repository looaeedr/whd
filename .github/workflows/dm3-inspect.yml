name: DM3 Divider Relief Regression
on:
  push:
    branches: [work/dm3-divider-canonical-relief]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install -q pytest shapely numpy matplotlib ezdxf
      - name: Discover authoritative Divider relief tests
        run: |
          echo '=== MATCHES ==='
          grep -RniE 'T48-2|t48_2|divider_assembly_relief|placement_evidence|final_material_is_one_source|front_fold_relief' tests --include='test_*.py' || true
          echo '=== FILES ==='
          grep -RlE 'T48-2|t48_2|divider_assembly_relief|placement_evidence|final_material_is_one_source|front_fold_relief' tests --include='test_*.py' | sort -u || true
      - name: Run discovered regression files
        run: |
          files=$(grep -RlE 'T48-2|t48_2|divider_assembly_relief|placement_evidence|final_material_is_one_source|front_fold_relief' tests --include='test_*.py' | sort -u)
          test -n "$files"
          python -m pytest -q $files
