name: DM3 Inspect Relief Seam
on:
  push:
    branches: [work/dm3-divider-canonical-relief]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge delegates to manufacturing domain
        run: |
          grep -n "resolve_divider_final_geometry" fold_designer_bridge.py
          if grep -n "build_divider_front_fold_relief_candidate(" fold_designer_bridge.py; then exit 1; fi
          if grep -n "_phase6_divider_fw_placement_evidence(" fold_designer_bridge.py; then exit 1; fi
