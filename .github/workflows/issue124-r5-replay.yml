name: Issue 124 R5 Production Replay
on:
  push:
    branches: [work/issue-124-replay-latest-20260912-r5]
    paths:
      - .github/workflows/issue124-r5-replay.yml
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact target and Phase6 gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync work/issue-124-final-20260912-r4
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "d493b2e0d7404233b6ed2c681caf7d28c73b30f6"
          python tools/phase6_skill_preflight.py \
            --task "#124 R5 latest-target Structure Tree replay; projection-only hierarchy/selection/visibility; preserve physical-part authority; no geometry/manufacturing/DXF authority changes" \
            --changed-file "fold_designer_bridge.py" \
            --changed-file "gui.py" \
            --changed-file "tests/test_issue124_structure_tree.py" \
            --changed-file ".agents/skills/engineering/phase6-gui-performance-integrity/SKILL.md" \
            --changed-file "個人AI檔案庫/踩坑庫/issue124_external_text_scale_echo_pitfall.md" \
            --changed-file "docs/superpowers/verification/2026-09-12-issue124-state.md" \
            --evidence ".phase6_issue124_r5_replay_evidence.txt"
      - name: Fail closed if replay-owned files moved since R4 baseline
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            fold_designer_bridge.py \
            gui.py \
            .agents/skills/engineering/phase6-gui-performance-integrity/SKILL.md \
            個人AI檔案庫/踩坑庫/issue124_external_text_scale_echo_pitfall.md
          do
            if ! git diff --quiet eede532b9fe61052cf4411ecf5063e0374165fe8 d493b2e0d7404233b6ed2c681caf7d28c73b30f6 -- "$path"; then
              echo "CONCURRENT_DRIFT: $path" >&2
              exit 1
            fi
          done
          echo REPLAY_CONCURRENCY_GATE=GREEN
      - name: Replay final accepted R4 files exactly
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/work/issue-124-final-20260912-r4 -- \
            fold_designer_bridge.py \
            gui.py \
            .agents/skills/engineering/phase6-gui-performance-integrity/SKILL.md \
            個人AI檔案庫/踩坑庫/issue124_external_text_scale_echo_pitfall.md
          git diff --check
          git status --short
      - name: Commit replay onto R5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py gui.py \
            .agents/skills/engineering/phase6-gui-performance-integrity/SKILL.md \
            個人AI檔案庫/踩坑庫/issue124_external_text_scale_echo_pitfall.md
          git commit -m 'feat(#124): replay accepted Structure Tree on latest target'
          git push origin HEAD:work/issue-124-replay-latest-20260912-r5
