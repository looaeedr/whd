name: Issue 290 T2 Apply Extraction

on:
  push:
    branches:
      - refactor/issue290-gui-phase2-t2-layout-20260916

permissions:
  contents: write

env:
  PREDECESSOR_SHA: "7504e628f7648bb18925151b5e44912c53a913c4"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Apply deterministic T2 extraction
        run: python tools/issue290_extract_t2.py
      - name: Verify T2 contract before commit
        run: python -m pytest -q tests/test_issue290_gui_phase2_t2_layout.py
      - name: Protected source drift gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${PREDECESSOR_SHA}" -- \
            config.ini '基準檔/**' ae_engine fold_designer_bridge.py phase6_fold_profiles.py phase6_project_file.py release_required_artifacts.json)"
          if [ -n "$changed" ]; then
            echo "Unexpected protected drift:"
            echo "$changed"
            exit 1
          fi
          echo T2_PROTECTED_SOURCE_DRIFT=0
      - name: Commit generated production extraction
        shell: bash
        run: |
          set -euo pipefail
          git add -A gui.py gui_modules/layout.py gui_modules/layout
          if git diff --cached --quiet; then
            echo ISSUE290_T2_NO_GENERATED_CHANGES
            exit 0
          fi
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git commit -m "refactor(#290): extract T2 layout regions"
          git push origin HEAD:refactor/issue290-gui-phase2-t2-layout-20260916
