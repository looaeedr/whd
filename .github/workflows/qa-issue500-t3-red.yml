name: "QA #500 T3 Settings profile RED"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue500-t3-red.yml'

permissions:
  contents: read

jobs:
  t3-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install focused harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Run expected R2 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue500_settings_profile_projection.py --tb=short > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "missing pure Settings-to-Profile projection owner|assert .*project_part_dimensions|assert .*build_settings_profile_projection" /tmp/red.log
          echo "ISSUE500_R2_EXPECTED_RED=1"
          exit 0
