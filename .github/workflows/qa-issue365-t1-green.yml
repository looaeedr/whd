name: "QA #365 T1 GREEN workspace navigation"
# canonical-deps trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=365"
          echo "BASELINE=0dd6561f3253d0a17714af316d5e9da90e24058f"
          echo "CANDIDATE=$(git rev-parse HEAD)"
          git merge-base --is-ancestor 0dd6561f3253d0a17714af316d5e9da90e24058f HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: Compile changed Python
        run: |
          python -m py_compile phase6_workspace_navigation_controller.py fold_designer_bridge.py

      - name: Run ownership contract
        run: python -m pytest -q tests/test_issue365_t1_workspace_navigation_controller.py

      - name: Run pure workspace/navigation regressions
        run: |
          python -m pytest -q \
            tests/test_phase6_designer_workspace.py \
            tests/test_dm7_part_navigation.py \
            tests/test_phase6_workspace_projection.py
