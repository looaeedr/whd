name: WHD｜#595｜invalid phase recovery QA
run-name: "WHD｜#595｜invalid phase recovery｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue595-invalid-phase-recovery-20260924

permissions:
  contents: read

jobs:
  focused:
    name: "Focused｜invalid phase claim recovery"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run focused governance regression
        run: |
          python -m pytest -q \
            tests/process/test_issue595_invalid_phase_claim_recovery.py \
            tests/process/test_issue581_interactive_stale_takeover.py \
            tests/process/test_issue573_sibling_scheduler_takeover.py \
            tests/process/test_issue578_scheduler_runtime_liveness.py \
            tests/process/test_issue558_post_commit_claim_head_reconcile.py
