name: "QA #397 T3+T7 runtime remediation"

on:
  push:
    branches:
      - "fix/issue397-t7-composition-runtime-20260920"

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: T3 service ownership regressions
        run: |
          python -m pytest -q tests/test_issue397_phase4_runtime_remediation.py --tb=short
      - name: T8 candidate-only headless remediation cohort
        run: |
          python -m pytest -q \
            tests/architecture/test_renderer_ownership.py::test_structure_existing_3d_deep_module_remains_the_only_new_3d_owner \
            tests/test_engineering_drawing_integration.py::test_shared_finished_dimension_provider_is_the_2d_3d_authority \
            tests/test_issue188_dark_theme_readability.py::test_3d_shell_settings_and_final_scene_consume_shared_theme_contract \
            tests/test_issue211_renderer_dependency_gate.py::test_structure_existing_3d_deep_module_remains_the_only_new_3d_owner \
            tests/test_issue338_contrast_readability.py::test_shared_theme_owns_secondary_warning_and_hidden_text_colors \
            tests/test_issue371_t7_update_runtime_behavior.py::test_issue371_settings_delta_preserves_push_apply_restore_order \
            tests/test_issue99_dual_view_parity_persistence.py::test_replayed_external_revision_is_noop_and_cannot_refresh_view \
            tests/test_issue99_dual_view_parity_persistence.py::test_repeated_authoritative_revisions_refresh_visible_view_once_per_commit \
            tests/test_phase6_3d_retain_and_baseline.py::test_true_mesh_renderer_uses_exact_final_scene_without_baseline_merge \
            tests/test_phase6_3d_single_source_renderer.py::test_3d_render_path_consumes_scene_callback_only \
            tests/test_phase6_ui_state_regressions.py::test_selecting_assembly_type_rebuilds_current_box_body_settings_page \
            tests/test_phase6_ui_state_regressions.py::test_selecting_assembly_type_keeps_current_box_page_alive_and_invalidates_only_endcaps \
            --tb=short

  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Composition identity and family transition
        run: |
          xvfb-run -a python -m pytest -q tests/test_issue397_phase4_runtime_remediation.py::test_real_designer_composition_keeps_settings_maps_and_family_transition_live --tb=short
      - name: Candidate-only Settings/Receiving cohort
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue101_baseline_piece_tab_guard.py::test_fold_designer_known_family_switch_keeps_target_defaults_through_delayed_piece_tab_event \
            tests/test_phase6_box_body_structure.py::test_real_global_w_edit_reconciles_two_piece_at_commit_without_weakening_resolver \
            tests/test_phase6_gui_3d_integrity_20260830.py::test_dynamic_switch_to_receiving_updates_visible_structure_and_family_state \
            tests/test_phase6_receiving_followup_20260830.py::test_live_switch_to_receiving_applies_whd_without_standalone_wrap_toggle \
            tests/test_phase6_receiving_projection_regression.py \
            tests/test_phase6_t05_multi_door_flow.py::test_receiving_assembly_resolved_parts_place_upper_and_lower_doors_separately \
            tests/test_phase6_t06_receiving_fresh_family.py::test_fold_designer_fresh_receiving_switch_materializes_wrap_overlay_graph \
            tests/test_phase6_t11_family_preset_switching.py::test_fold_designer_receiving_to_vault_restores_vault_structure_preset_even_when_opened_from_receiving \
            tests/test_phase6_t21_live_switch_selector.py \
            tests/test_phase6_t25_combined_receiving_acceptance.py::test_combined_receiving_operator_path_from_live_family_switch \
            --tb=short
