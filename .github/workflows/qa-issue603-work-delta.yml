name: WHD｜#603｜Merge work-delta reconciliation
run-name: "WHD｜#603｜work-delta focused｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue603-merge-work-delta-reconciliation-20260924

permissions:
  contents: read

jobs:
  focused:
    name: "Focused｜production-parent work delta"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout exact branch"
        uses: actions/checkout@v4
      - name: "安裝 pytest"
        run: python -m pip install pytest
      - name: "執行 merge work-delta focused tests"
        run: python -m pytest -q tests/process/test_issue570_merge_head_claim_reconciliation.py
