name: "WHD｜#780｜Landing Acceptance"
run-name: "WHD｜#780｜production-root landing acceptance"

on:
  push:
    branches:
      - landing/issue780-current-production-20260927
    paths:
      - '.github/workflows/qa-issue780-landing.yml'

permissions:
  contents: read

concurrency:
  group: issue780-landing-acceptance
  cancel-in-progress: false

jobs:
  landing:
    name: "Landing｜#780 current-production acceptance"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_HEAD: ${{ github.sha }}
      LANDING_MERGE: f497dd2f3415620f54a10394e637813b8ee3d573
      PROD_HEAD: 98a11b89f2a1aa75ea157ca75a9e2a63a0c17abf
      CLOSING_HEAD: 6ac40676bb4e2911d8b8227ec73875d6cc478e77
    steps:
      - name: "Checkout exact landing QA head"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_HEAD }}
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Install focused acceptance dependencies"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: "Validate exact landing ancestry and BOM-only first-parent diff"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QA_HEAD}"
          git merge-base --is-ancestor "${LANDING_MERGE}" HEAD
          test "$(git show -s --format=%P "${LANDING_MERGE}")" = "${PROD_HEAD} ${CLOSING_HEAD}"
          qa_only="$(git diff --name-only "${LANDING_MERGE}..HEAD" | LC_ALL=C sort)"
          test "${qa_only}" = ".github/workflows/qa-issue780-landing.yml"
          actual="$(git diff --name-only "${PROD_HEAD}..${LANDING_MERGE}" | LC_ALL=C sort)"
          expected="$(printf '%s\n' 'tests/process/test_issue681_poweroff_gate.py' 'tests/process/test_scheduler_no_work_census_contract.py' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          prod = os.environ["PROD_HEAD"]
          landing = os.environ["LANDING_MERGE"]
          bom = bytes.fromhex("efbbbf")
          paths = (
              "tests/process/test_issue681_poweroff_gate.py",
              "tests/process/test_scheduler_no_work_census_contract.py",
          )
          for path in paths:
              before = subprocess.check_output(["git", "show", f"{prod}:{path}"])
              after = subprocess.check_output(["git", "show", f"{landing}:{path}"])
              assert before.startswith(bom), path
              assert after == before[len(bom):], path
          print("ISSUE780_LANDING_BOM_ONLY_GREEN=1")
          PY

      - name: "Validate governance mirror and authority markers"
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/governance_parity_gate.py
          test -f docs/governance/governance_mirror_manifest.json
          test -f .github/workflows/whd-governance-mirror-gate.yml
          test -f tests/process/test_issue816_bidirectional_governance_mirror.py
          f='個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md'
          grep -q 'ISSUE693_COMBINED_ACCEPTANCE_WRITEBACK_V1' "$f"
          grep -q 'WHD_PHASE7_OWNERSHIP_WRITEBACK_V1' "$f"
          echo "ISSUE780_GOVERNANCE_SURFACE_GREEN=1"

      - name: "Census remaining Python UTF-8 BOM files"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bom = bytes.fromhex("efbbbf")
          remaining = sorted(
              str(path)
              for path in Path(".").rglob("*.py")
              if path.is_file() and path.read_bytes().startswith(bom)
          )
          print("ISSUE780_LANDING_BOM_CENSUS=" + ",".join(remaining))
          if remaining:
              raise SystemExit("remaining Python UTF-8 BOM files detected")
          print("ISSUE780_LANDING_BOM_CENSUS_GREEN=1")
          PY

      - name: "Run focused landing regression"
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --tb=short --junitxml=i780-landing.xml \
            tests/process/test_issue816_bidirectional_governance_mirror.py \
            tests/process/test_scheduler_no_work_census_contract.py \
            tests/test_clean_break_layout.py \
            tests/test_issue626_phase7_combined_acceptance.py

      - name: "Validate protected production inputs unchanged"
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "${PROD_HEAD}" "${LANDING_MERGE}" -- config.ini
          test -z "$(git diff --name-only "${PROD_HEAD}" "${LANDING_MERGE}" -- 基準檔)"
          git diff --check "${PROD_HEAD}..${LANDING_MERGE}"
          echo "ISSUE780_PROTECTED_INPUTS_GREEN=1"

      - name: "Upload landing acceptance evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue780-landing-${{ github.sha }}
          path: |
            i780-landing.xml
          if-no-files-found: warn
