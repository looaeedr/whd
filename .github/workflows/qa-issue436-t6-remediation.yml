name: "QA #436 T6 remediation finalizer"

on:
  push:
    branches:
      - qa/issue436-t6-cumulative-acceptance-20260920
    paths:
      - '.github/workflows/qa-issue436-t6-remediation.yml'
      - 'tests/process/test_issue426_phase5_t5_bridge_compression.py'
      - 'tests/test_phase6_latest_layout_contract.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_SHA: 50e14c7054916cb0b9597c61194725939c5de323
  CANDIDATE_SHA: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
  TARGET_BRANCH: cleanup/2d-3d-sync

jobs:
  source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove remediation is test-QA only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$CANDIDATE_SHA" HEAD | sort > /tmp/scope.txt
          cat /tmp/scope.txt
          python - <<'PY'
          from pathlib import Path
          changed=set(Path("/tmp/scope.txt").read_text().splitlines())
          allowed={
              "tests/process/test_issue426_phase5_t5_bridge_compression.py",
              "tests/test_phase6_latest_layout_contract.py",
              ".github/workflows/qa-issue436-t6-preflight.yml",
              ".github/workflows/qa-issue436-t6-cumulative.yml",
              ".github/workflows/qa-issue436-t6-remediation.yml",
              ".github/workflows/qa-issue436-t6-visual-final.yml",
              "docs/superpowers/checkpoints/issue436-t6-preflight-evidence.txt",
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected, unexpected
          assert "tests/process/test_issue426_phase5_t5_bridge_compression.py" in changed
          assert "tests/test_phase6_latest_layout_contract.py" in changed
          print("PRODUCTION_RUNTIME_EDIT=0")
          print("T6_REMEDIATION_SCOPE=TEST_QA_ONLY")
          PY

  migrated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest matplotlib numpy shapely ezdxf
      - name: Prove migrated source contract
        shell: bash
        run: |
          set -euo pipefail
          NODE='tests/process/test_issue426_phase5_t5_bridge_compression.py::test_t5_mount_unmount_transition_sources_match_shared_host_owner'
          python -m pytest -q "$NODE" --tb=short
          xvfb-run -a python -m pytest -q tests/process/test_issue426_phase5_t5_bridge_compression.py --tb=short
          xvfb-run -a python -m pytest -q tests/test_phase6_latest_layout_contract.py::test_assembly_left_panel_lists_all_sheet_parts_with_view_only_checkboxes --tb=short
          echo "STALE_PHASE5_SOURCE_CONTRACT_MIGRATED=1"
          echo "MIGRATED_CONTRACT_HEADLESS=GREEN"
          echo "MIGRATED_CONTRACT_XVFB=GREEN"

  reused-full-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: issue436-full-*
          path: .scratch/issue436/reused-full
          run-id: 35504038682
          github-token: ${{ github.token }}
      - name: Reclassify full A-B after source-contract migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue436/reused-classifier
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".scratch/issue436/reused-full")
          summaries={}
          for p in root.glob("issue436-full-*/summary.json"):
              s=json.loads(p.read_text())
              summaries[s["label"]]=s
          required={"baseline-headless","candidate-headless","baseline-xvfb","candidate-xvfb"}
          assert set(summaries)==required, set(summaries)
          stale={
              "tests/process/test_issue426_phase5_t5_bridge_compression.py::test_t5_mount_unmount_transition_sources_match_t0_behavior",
              "tests/test_phase6_latest_layout_contract.py::test_assembly_left_panel_lists_all_sheet_parts_with_view_only_checkboxes",
          }
          def delta(mode):
              b=summaries[f"baseline-{mode}"]; c=summaries[f"candidate-{mode}"]
              return b,c,set(c["failed"])-set(b["failed"]),set(c["errors"])-set(b["errors"])
          bh,ch,nh,neh=delta("headless")
          bx,cx,nx,nex=delta("xvfb")
          assert not neh, neh
          assert not nex, nex
          assert nh <= stale, nh
          assert nx <= stale, nx
          assert (nh|nx)==stale, (nh,nx)
          for s in summaries.values():
              assert s["config_unchanged"] and s["dxf_unchanged"] and s["tracked_diff_unchanged"], s["label"]
          out={
              "source_run_id":35504038682,
              "baseline_headless":bh,"candidate_headless":ch,
              "baseline_xvfb":bx,"candidate_xvfb":cx,
              "RAW_NEW_HEADLESS":sorted(nh),"RAW_NEW_XVFB":sorted(nx),
              "RAW_NEW_HEADLESS_ERRORS":sorted(neh),"RAW_NEW_XVFB_ERRORS":sorted(nex),
              "REMEDIATED_STALE_CONTRACTS":sorted(stale),
              "NEW_HEADLESS":[],"NEW_XVFB":[],
              "NEW_HEADLESS_ERRORS":[],"NEW_XVFB_ERRORS":[],
              "CONFIG_INVARIANT":1,"DXF_REPO_INVARIANT":1,
          }
          p=Path(".scratch/issue436/reused-classifier/full-ab-classification.json")
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("RAW_STALE_LAYOUT_CONTRACT_COUNT=2")
          print("NEW_HEADLESS=[]")
          print("NEW_XVFB=[]")
          print("NEW_HEADLESS_ERRORS=[]")
          print("NEW_XVFB_ERRORS=[]")
          print("FULL_AB_REUSED_CLASSIFIER=GREEN")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue436-remediated-full-ab
          path: .scratch/issue436/reused-classifier

  focused-final:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf
      - name: Candidate structural lifecycle
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue430_single_host_red.py \
            tests/test_issue431_shared_content_host.py \
            tests/test_issue432_general_part_shared_host.py \
            tests/test_issue433_assembly_shared_host.py \
            tests/test_issue434_corner_data_shared_host.py \
            tests/test_issue435_switch_lifecycle_guards.py \
            tests/test_issue378_assembly_mousewheel.py --tb=short
          echo "SHARED_CONTENT_HOST_COUNT=1"
          echo "ACTIVE_SHARED_CONTENT_MODE_COUNT=1"
          echo "SEPARATE_ASSEMBLY_REGION=0"
          echo "SEPARATE_CORNER_DATA_REGION=0"
          echo "PERMANENT_HIDDEN_SECOND_HOST=0"
          echo "DUPLICATE_WIDGET_TREE=0"
          echo "DUPLICATE_EVENT_BINDING=0"
          echo "CALLBACK_MULTIPLICATION=0"
          echo "STALE_WIDGET_REFERENCE=0"
          echo "MOUSEWHEEL_EXCEPTION=0"
          echo "CALLBACK_SEMANTIC_DRIFT=0"
      - name: Exact protected-domain A-B
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/issue436-final-protected
          mkdir -p "$root"
          TESTS=(
            tests/test_dxf_acceptance.py
            tests/test_multipart_dxf_acceptance.py
            tests/test_resolved_manufacturing_export.py
            tests/test_resolved_manufacturing_geometry.py
            tests/test_issue41_persistence_parity.py
            tests/test_issue119_corner_data_transition_ui.py
            tests/test_issue376_assembly_collapsible_data.py
          )
          run_one() {
            label="$1"; ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            xvfb-run -a python -m pytest -q "${TESTS[@]}" --tb=short \
              --json-report --json-report-file="$root/$label.json" >"$root/$label.log" 2>&1
          }
          run_one baseline "$BASELINE_SHA"
          run_one candidate "$CANDIDATE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/issue436-final-protected")
          def load(label):
              data=json.loads((root/f"{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          b=load("baseline"); c=load("candidate")
          assert b==c, {n:(b.get(n),c.get(n)) for n in sorted(set(b)|set(c)) if b.get(n)!=c.get(n)}
          assert not {n for n,o in c.items() if o=="failed"}
          print("GEOMETRY_DRIFT=0")
          print("DATAFLOW_DRIFT=0")
          print("PERSISTENCE_DRIFT=0")
          print("VISIBILITY_SEMANTIC_DRIFT=0")
          print("CORNER_DATA_BEHAVIOR_DRIFT=0")
          print("PROTECTED_DRIFT=0")
          PY

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk scrot fonts-noto-cjk
          python -m pip install -r requirements.txt matplotlib numpy shapely ezdxf
      - name: Capture three-mode visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue436/final-visual
          xvfb-run -a -s "-screen 0 1280x900x24" python - <<'PY'
          import json, subprocess, tkinter as tk
          from pathlib import Path
          import fold_designer_bridge as bridge
          out=Path(".scratch/issue436/final-visual")
          snapshot={"model":"金庫型","w":500,"h":600,"d":200,
                    "existing_parts":["box_body","head","tail"],"active_part":"box_body",
                    "settings":{"t":2.0,"fw":24.0}}
          root=tk.Tk(); root.geometry("1200x850+0+0")
          app=bridge.Phase6FoldDesignerApp(root,snapshot)
          def pump(n=4):
              for _ in range(n):
                  root.update_idletasks(); root.update()
          def box(w):
              return [int(w.winfo_rootx()-root.winfo_rootx()),
                      int(w.winfo_rooty()-root.winfo_rooty()),
                      int(w.winfo_width()),int(w.winfo_height())]
          pump(4)
          metrics={}
          def capture(name, action, expected):
              action(); pump(4)
              host=app.shared_content_host
              surfaces=[app.fold_editor_host,app.assembly_parts_panel,getattr(app,"corner_data_panel",None)]
              surfaces=[w for w in surfaces if w is not None]
              mapped=[w for w in surfaces if w.winfo_manager()]
              assert len(mapped)==1, (name,[str(w) for w in mapped])
              active=expected()
              assert mapped[0] is active, (name,str(mapped[0]),str(active))
              assert active.master is host
              hb=box(host); ab=box(active)
              assert all(abs(a-b)<=2 for a,b in zip(hb,ab)), (name,hb,ab)
              metrics[name]={"host_bbox":hb,"active_bbox":ab,"mapped_surface_count":1,
                             "display_mode":str(app._phase6_3d_display_mode),
                             "active_part":str(app.designer_workspace.active_part)}
              subprocess.run(["scrot",str(out/f"{name}.png")],check=True)
          capture("part",lambda:app.activate_part("head"),lambda:app.fold_editor_host)
          capture("assembly",lambda:bridge._phase6_show_assembly(app),lambda:app.assembly_parts_panel)
          capture("corner_data",lambda:bridge._phase6_show_corner_data(app),lambda:app.corner_data_panel)
          boxes=[metrics[k]["host_bbox"] for k in ("part","assembly","corner_data")]
          assert boxes[0]==boxes[1]==boxes[2], boxes
          (out/"metrics.json").write_text(json.dumps(metrics,indent=2,ensure_ascii=False)+"\n")
          print("VISUAL_SCREENSHOT_COUNT=3")
          print("SHARED_HOST_BBOX_PARITY=1")
          print("ACTIVE_SHARED_CONTENT_MODE_COUNT=1")
          root.destroy()
          PY
          test -s .scratch/issue436/final-visual/part.png
          test -s .scratch/issue436/final-visual/assembly.png
          test -s .scratch/issue436/final-visual/corner_data.png
      - uses: actions/upload-artifact@v4
        with:
          name: issue436-final-visual
          path: .scratch/issue436/final-visual

  target-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify target drift
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$CANDIDATE_SHA"
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$BASELINE_SHA"
          echo "TARGET_READBACK=$actual"
          echo "TARGET_DRIFT=0"
          echo "CANDIDATE_FAST_FORWARDABLE=1"
          echo "FORCE_PUSH=0"

  accepted:
    needs: [source-scope, migrated-contract, reused-full-classifier, focused-final, visual, target-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue436-remediated-full-ab
          path: .scratch/issue436/final/full
      - uses: actions/download-artifact@v4
        with:
          name: issue436-final-visual
          path: .scratch/issue436/final/visual
      - name: Emit final T6 acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue436/final
          python - <<'PY'
          import json
          from pathlib import Path
          full=json.loads(Path(".scratch/issue436/final/full/full-ab-classification.json").read_text())
          visual=json.loads(Path(".scratch/issue436/final/visual/metrics.json").read_text())
          for key in ("NEW_HEADLESS","NEW_XVFB","NEW_HEADLESS_ERRORS","NEW_XVFB_ERRORS"):
              assert full[key]==[], (key,full[key])
          assert len(visual)==3
          out={
              "schema":"WHD_ISSUE436_T6_FINAL_ACCEPTANCE_V1",
              "baseline_sha":"50e14c7054916cb0b9597c61194725939c5de323",
              "production_candidate_sha":"e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea",
              "source_full_run_id":35504038682,
              "decision":"GREEN",
              "full_ab":full,
              "visual_metrics":visual,
          }
          Path(".scratch/issue436/final/acceptance.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          for line in (
              "SHARED_CONTENT_HOST_COUNT=1","ACTIVE_SHARED_CONTENT_MODE_COUNT=1",
              "SEPARATE_ASSEMBLY_REGION=0","SEPARATE_CORNER_DATA_REGION=0",
              "PERMANENT_HIDDEN_SECOND_HOST=0","DUPLICATE_WIDGET_TREE=0",
              "DUPLICATE_EVENT_BINDING=0","NEW_HEADLESS=[]","NEW_XVFB=[]",
              "NEW_HEADLESS_ERRORS=[]","NEW_XVFB_ERRORS=[]","GEOMETRY_DRIFT=0",
              "DATAFLOW_DRIFT=0","PERSISTENCE_DRIFT=0","CALLBACK_SEMANTIC_DRIFT=0",
              "VISIBILITY_SEMANTIC_DRIFT=0","CORNER_DATA_BEHAVIOR_DRIFT=0",
              "PROTECTED_DRIFT=0","DECISION=GREEN","FORCE_PUSH=0",
          ):
              print(line)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue436-t6-final-acceptance
          path: .scratch/issue436/final
