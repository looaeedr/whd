name: 工單544 B6-4 Xvfb A-B 分類
run-name: "工單 #544 B6-4｜Xvfb A-B｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue544-b6-4-xvfb-ab.yml

permissions:
  contents: read

jobs:
  compare:
    name: 比較 baseline 與 candidate corner Xvfb 差集
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相同依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 建立 immutable A/B worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue544-baseline 476678276f19b465103a05b7a2267bb7653f91ac
          git worktree add --detach /tmp/issue544-candidate 8a5411f03d4f6e4f2a826be09df7c6f4e5bd6bed

      - name: 跑相同 Xvfb tests 並分類 candidate-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue544-ab

          run_suite () {
            label="$1"
            dir="$2"
            set +e
            (
              cd "$dir"
              xvfb-run -a python -m pytest -q                 tests/test_corner_parameter_lock.py                 tests/test_corner_type_phase6_integration.py
            ) > "/tmp/issue544-ab/${label}.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "/tmp/issue544-ab/${label}.rc"
            grep '^FAILED ' "/tmp/issue544-ab/${label}.log"               | sed -E 's/^FAILED ([^ ]+).*/\1/'               | sort -u > "/tmp/issue544-ab/${label}.failed" || true
            tail -n 8 "/tmp/issue544-ab/${label}.log"
          }

          run_suite baseline /tmp/issue544-baseline
          run_suite candidate /tmp/issue544-candidate

          comm -13             /tmp/issue544-ab/baseline.failed             /tmp/issue544-ab/candidate.failed             > /tmp/issue544-ab/candidate-only.failed

          echo "BASELINE_RC=$(cat /tmp/issue544-ab/baseline.rc)"
          echo "CANDIDATE_RC=$(cat /tmp/issue544-ab/candidate.rc)"
          echo "BASELINE_FAIL_COUNT=$(wc -l < /tmp/issue544-ab/baseline.failed)"
          echo "CANDIDATE_FAIL_COUNT=$(wc -l < /tmp/issue544-ab/candidate.failed)"
          echo "CANDIDATE_ONLY_FAIL_COUNT=$(wc -l < /tmp/issue544-ab/candidate-only.failed)"
          echo "CANDIDATE_ONLY_FAILS_BEGIN"
          cat /tmp/issue544-ab/candidate-only.failed
          echo "CANDIDATE_ONLY_FAILS_END"

          test ! -s /tmp/issue544-ab/candidate-only.failed
          echo "ISSUE544_B6_4_XVFB_AB=CANDIDATE_ONLY_ZERO"

      - name: 上傳 A-B 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue544-b6-4-xvfb-ab
          path: /tmp/issue544-ab/
          if-no-files-found: error
          retention-days: 14
