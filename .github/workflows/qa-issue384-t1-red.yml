name: "QA #384 T1 conditional 板件功能 RED"

on:
  push:
    branches:
      - ui/issue384-assembly-only-function-presentation-20260919
    paths:
      - 'tests/test_issue384_assembly_only_function_presentation.py'
      - '.github/workflows/qa-issue384-t1-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD dda04112bd5166ef3c8b84106e4caef0a941e4b6)" = "dda04112bd5166ef3c8b84106e4caef0a941e4b6"
      - name: Install GUI harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Confirm intended T1 RED
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue384_assembly_only_function_presentation.py --tb=short | tee /tmp/t1-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "2 failed, 1 passed" /tmp/t1-red.log
          grep -q "old 板件/功能 host is still mapped" /tmp/t1-red.log
          grep -q "second 板件/功能 Structure Tree is still visible" /tmp/t1-red.log
          echo "PASS EXPECTED_T1_RED=2"
