name: "QA #366 T2 RED settings transactions"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t2-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=366"
          echo "BASELINE=bb8c3d0272756629654127fbd86e9d7013d797e4"
          echo "CANDIDATE=$(git rev-parse HEAD)"
          git merge-base --is-ancestor bb8c3d0272756629654127fbd86e9d7013d797e4 HEAD

      - name: Install RED harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest

      - name: Run intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue366_t2_settings_transaction_owner.py --tb=short | tee /tmp/issue366-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "PYTEST_RC=$rc"
          test "$rc" -ne 0
          grep -q "Phase 3 T2 requires an application-level settings transaction" /tmp/issue366-red.log
          grep -q "bridge still owns T2 settings/corner/structure transaction state" /tmp/issue366-red.log
          grep -q "1 passed" /tmp/issue366-red.log
          echo "PASS EXPECTED_RED=1"
