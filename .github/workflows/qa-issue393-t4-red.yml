name: "QA #393 T4 RED typed Final Scene contracts"

on:
  push:
    branches:
      - "refactor/issue393-phase4-t4-final-scene-contracts-20260920"
    paths:
      - "tests/test_issue393_final_scene_contracts.py"
      - ".github/workflows/qa-issue393-t4-red.yml"

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=393"
          echo "PREDECESSOR=70c4a0a470647322e7aa4a685b74b27520019652"
          git merge-base --is-ancestor 70c4a0a470647322e7aa4a685b74b27520019652 HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest

      - name: Require intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue393_final_scene_contracts.py --tb=short | tee /tmp/issue393-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "PYTEST_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "T4 requires phase6_final_scene_contracts.py|generic service bag|string dispatch|services=|No module named 'phase6_final_scene_contracts'|FinalSceneDependencies" /tmp/issue393-red.log
          echo "ISSUE393_T4_EXPECTED_RED=1"
