name: Issue 169 T3 Closing QA

on:
  push:
    branches:
      - refactor/dm7-t3-navigation-callers-20260913

permissions:
  contents: read

jobs:
  t3-closing-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib -r requirements.txt
      - name: Compile navigation bridge
        run: python -m py_compile fold_designer_bridge.py phase6_part_navigation.py
      - name: Run T3 and dispatch durable contracts
        run: >-
          python -m pytest -q
          tests/test_dispatching_skill_timeout_contract.py
          tests/test_dm7_navigation_callers.py
          tests/test_dm7_part_navigation.py
          tests/test_issue96_corner_data_selection_lifecycle.py
          tests/test_issue97_authoritative_unfold_view_adapter.py
          tests/test_issue163_unfold_workspace_layout.py
      - name: Source ownership scan
        shell: python
        run: |
          import inspect
          import fold_designer_bridge as bridge
          tab = inspect.getsource(bridge._phase6_on_box_body_piece_tab_changed)
          corner = inspect.getsource(bridge._phase6_select_corner_data_part)
          selected = inspect.getsource(bridge._fix11_activate_selected_part)
          assert '_phase6_activate_operator_part' in tab
          assert 'self.activate_part(key)' not in tab
          assert '_phase6_resolve_operator_part_key' in corner
          assert 'resolved = requested' not in corner
          assert '_phase6_activate_operator_part' in selected
          print('SOURCE_OWNERSHIP_PASS')
      - name: Config and protected baseline invariants
        run: |
          git diff --exit-code 003484bcf1b54372a96f6a5f9956cd6f33352d3b -- config.ini '基準檔/**'
          echo INVARIANTS_PASS
