name: Generic Part DXF Skill QA

on:
  push:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - .github/workflows/generic-part-dxf-skill-qa.yml
      - .scratch/generic-part-dxf-skill/preflight.evidence.md
  workflow_dispatch:

jobs:
  skill-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Preflight generic part commands
        shell: bash
        run: |
          set -e
          evidence=".scratch/generic-part-dxf-skill/preflight.evidence.md"
          for task in             "驗目前板件 DXF反驗證 remote QA"             "驗箱身 DXF反驗證 remote QA"             "驗中隔 DXF反驗證 remote QA"             "驗全部板件 Save Reload 驗收 remote QA"
          do
            echo "=== $task ==="
            python tools/phase6_skill_preflight.py               --task "$task"               --changed-file .agents/skills/engineering/驗證板件與DXF/SKILL.md               --changed-file .agents/skills/skill_registry.json               --evidence "$evidence"
          done

      - name: Skill contract tests
        run: |
          python -m pytest -q             tests/test_phase6_skill_preflight_gate.py             tests/test_phase6_corner_3d_model_integrity_skill.py             tests/test_remote_qa_monitoring_skill_contract.py

      - name: Registry and docs assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path(".agents/skills/skill_registry.json").read_text(encoding="utf-8"))
          route = next(row for row in registry["routes"] if row["id"] == "part-dxf-acceptance")
          assert "驗證板件與DXF" in route["required_skills"]
          for keyword in ["驗箱身", "驗中隔", "驗全部板件", "DXF反驗證"]:
              assert keyword in route["keywords"]

          assert Path(".agents/skills/engineering/驗證板件與DXF/SKILL.md").exists()
          assert not Path(".agents/skills/engineering/驗證中隔與DXF/SKILL.md").exists()

          manual = Path("使用說明書.md").read_text(encoding="utf-8")
          for phrase in ["驗箱身", "驗中隔", "驗全部板件", "驗全部 DXF"]:
              assert phrase in manual
          PY
