name: Issue 172 AI Library Writeback

on:
  push:
    branches:
      - docs/issue172-multi-ai-claim-progress-20260913
    paths:
      - '.github/workflows/issue172-ai-library-writeback.yml'

permissions:
  contents: write

jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/issue172-multi-ai-claim-progress-20260913
      - name: Fast-forward to latest branch tip
        shell: bash
        run: |
          git pull --ff-only origin docs/issue172-multi-ai-claim-progress-20260913
      - name: Append durable rules once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = [
              (
                  Path('個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'),
                  'ISSUE172_MULTI_AI_CLAIM_PROGRESS',
                  [
                      '',
                      '## 2026-09-13 — 多 AI 派工：一票一個 execution claim owner + 進度共享',
                      '',
                      '<!-- ISSUE172_MULTI_AI_CLAIM_PROGRESS -->',
                      '',
                      '當兩個以上 AI / Worker 共用同一 GitHub tracker 時，`GitHub owning Issue` 只證明「這張票存在」，不等於已分配唯一施工權。正式施工前必須另有 execution claim coordination。',
                      '',
                      '- **NO WORK WITHOUT CLAIM**：一張 GitHub owning Issue 同時間只能有一個 execution claim owner。任何 `production / test / Skill / AI Library` 第一筆 write 前，Worker 必須先成功取得 claim。',
                      '- **互斥 authority 必須 shared + atomic**：claim 必須位於所有 Worker 共用的 coordination namespace/ref，並以 atomic create、compare-and-swap 或等價互斥 primitive 取得。不同 implementation branch 各自建立同名 lock 屬 branch-local lock，不能作為全域 claim authority。',
                      '- **Comment / label 只作 mirror**：Issue comment、label、聊天宣告、branch 名稱、checkpoint 可供人閱讀，但不是 execution claim authority。',
                      '- **claim fail closed**：shared authority 已有其他 owner、CAS 衝突或環境沒有 shared+atomic claim 能力時，禁止施工該 Issue；若另有未認領工單則依 `NON_TERMINAL_CONTINUE` 繼續下一張。',
                      '',
                      '### CLAIM_PROGRESS_STATE',
                      '',
                      'claim 同時是跨 AI durable progress state，至少保存 `phase/state`、`last_update`、work `branch`、current `HEAD`、`remote QA run/status`、`next_action`、`blocker` 與必要 checkpoint/journal pointer。RED、重要 write、GREEN、remote QA、cleanup、drift audit、AI Library writeback、Issue closing/release 等重大 transition 都要即時更新。',
                      '',
                      '列未完成工單固定分成 `我持有`、`其他 AI 已鎖定`、`尚未認領`；前兩類必須顯示 phase、最後更新、branch/HEAD、QA、next_action、blocker，不能只列 owner。',
                      '',
                      '### STALE_CLAIM_RECOVERY',
                      '',
                      'claim 久未更新不能直接搶。接管前先核對 owning branch、HEAD、checkpoint/journal、`last_update`、remote QA、Issue 最新活動；只在舊 revision/owner 仍未改變時以 compare-and-swap 原子轉移，並留下 recovery evidence。無法證明 stale 或無安全 CAS 時保持 blocked。',
                      '',
                      '只有 Issue terminal evidence、必要 workflow cleanup、durable writeback、tested-head→closing-head drift audit 都完成後才能 release claim。',
                  ],
              ),
              (
                  Path('個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'),
                  'ISSUE172_PITFALL_MULTI_AI_CLAIM',
                  [
                      '',
                      '### 2026-09-13 — branch-local AI lock 不能阻止多 AI 重覆施工；claim 還必須帶工單進度',
                      '',
                      '<!-- ISSUE172_PITFALL_MULTI_AI_CLAIM -->',
                      '',
                      '- **錯誤模式**：多個 AI 各自在自己的 branch 建同名 lock 或只寫 comment/label，仍可能同時施工；即使知道 owner，若沒有 durable progress，也看不到 RED / GREEN / QA / cleanup 做到哪裡。',
                      '- **永久防線**：一張 owning Issue 同時間只准一個 execution claim owner；第一筆 production/test/Skill/AI Library write 前，對同一 shared coordination namespace/ref 做 atomic create / compare-and-swap。branch-local lock、Issue comment、label、聊天文字只可作 mirror。',
                      '- **進度契約**：同一 claim state 維護 `phase/state`、`last_update`、branch、HEAD、remote QA run/status、`next_action`、`blocker`；列工單分 `我持有 / 其他 AI 已鎖定 / 尚未認領`。',
                      '- **stale recovery**：不得直接搶鎖；先核對 branch/HEAD、checkpoint/journal、last_update、remote QA、Issue 活動，再以 CAS 接管並留下 recovery evidence。',
                      '- **釋放條件**：Issue terminal + workflow cleanup + durable writeback + tested-head→closing-head drift audit 完成才 release claim；票被別人持有不代表整體派工可停。',
                  ],
              ),
          ]

          for path, marker, lines in updates:
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              block = '\n'.join(lines) + '\n'
              path.write_text(text.rstrip() + '\n' + block, encoding='utf-8')
          PY
      - name: Verify and commit durable writeback
        shell: bash
        run: |
          grep -F 'ISSUE172_MULTI_AI_CLAIM_PROGRESS' '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'
          grep -F 'ISSUE172_PITFALL_MULTI_AI_CLAIM' '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          if git diff --cached --quiet; then
            echo 'No writeback change needed.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'docs: record multi-ai claim progress contract'
          git pull --rebase origin docs/issue172-multi-ai-claim-progress-20260913
          git push origin HEAD:docs/issue172-multi-ai-claim-progress-20260913
