name: 工單541 B6-1 GREEN 驗收
run-name: "工單 #541 B6-1｜Facade 12-key GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue541-b6-1-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B6-1 Facade 收斂驗收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 跑 B6-1 與 compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue541_b6_1_facade_batch.py             tests/test_issue524_a3_facade_ratchet.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_phase6_3d_cutting_mesh.py             | tee /tmp/issue541-b6-1-green.log
          grep -E '[0-9]+ passed' /tmp/issue541-b6-1-green.log | tail -1

      - name: 驗證 12-key final classification 與 facade count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue541-b6-1-architecture.log
          import ast
          from pathlib import Path

          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          call=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          )
          mapping=next(arg for arg in call.args if isinstance(arg,ast.Dict))
          bindings={
              k.value:ast.unparse(v)
              for k,v in zip(mapping.keys,mapping.values)
              if isinstance(k,ast.Constant) and isinstance(k.value,str)
          }
          no_caller={
              "_phase6_cutting_mesh_error",
              "_phase6_view_initialized",
              "_phase6_base_renderer_render",
              "_phase6_scroll_cid",
          }
          retained={
              "__getattr__",
              "_phase6_last_cutting_mesh",
              "_phase6_last_cutting_material",
              "_phase6_zoom_scale",
              "__init__",
              "_refresh_part_buttons",
              "_refresh_part_button_states",
              "_refresh_add_part_menu",
          }
          assert no_caller.isdisjoint(bindings)
          assert retained <= set(bindings)
          assert len(bindings)==65, len(bindings)
          assert bindings["__getattr__"]=="_phase6_legacy_getattr"
          assert bindings["__init__"]=="_fix11_init"
          print("B6_1_ACCOUNTED=12")
          print("B6_1_UNCLASSIFIED=0")
          print("B6_1_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_1_REMOVED=4")
          print("FACADE_COUNT=65")
          print("ISSUE541_B6_1_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue541-b6-1-green
          path: |
            /tmp/issue541-b6-1-green.log
            /tmp/issue541-b6-1-architecture.log
          if-no-files-found: error
          retention-days: 14
