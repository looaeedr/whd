name: QA Issue 822 Governance Required Check

on:
  push:
    branches:
      - governance/issue822-governance-required-check-x-20260927

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused Issue 822 regression
        run: python -m pytest -q tests/process/test_issue822_governance_required_check.py
