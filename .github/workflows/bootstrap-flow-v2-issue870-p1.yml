name: Bootstrap Flow v2 Issue 870 P1

on:
  push:
    branches:
      - flow-v2/issue870-execution-record-v2-r2

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow-v2/issue870-execution-record-v2-r2
          fetch-depth: 0
      - name: Materialize validated P1 files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .flow-v2/issue870-p1.b64 > /tmp/issue870-p1.zip
          unzip -o /tmp/issue870-p1.zip
          rm -rf .flow-v2
          rm -f .github/workflows/bootstrap-flow-v2-issue870-p1.yml
      - name: Install focused test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
      - name: Validate focused P1
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/process/test_issue870_execution_record_v2.py \
            tests/process/test_issue870_execution_record_store.py
      - name: Commit exact validated P1 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(#870): land Execution Record V2 P1"
          git push origin HEAD:flow-v2/issue870-execution-record-v2-r2
