name: Monitoring Skill Active Polling QA

on:
  push:
    branches:
      - fix/monitoring-remote-qa-active-polling-20260907
    paths:
      - ".agents/skills/engineering/monitoring-remote-qa/SKILL.md"
      - ".github/workflows/qa_monitoring_skill_active_polling.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preflight evidence
        run: |
          cat > /tmp/evidence.md <<'EOF'
          READ_SKILL: phase6-release-packaging
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py             --task "補強 monitoring-remote-qa Skill：監控必須主動輪詢，不得依賴事件通知"             --changed-file ".agents/skills/engineering/monitoring-remote-qa/SKILL.md"             --evidence /tmp/evidence.md
      - name: Static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".agents/skills/engineering/monitoring-remote-qa/SKILL.md")
          s=p.read_text(encoding="utf-8")
          assert "name: monitoring-remote-qa" in s
          assert len(s.splitlines()) < 500
          assert "## Active polling is mandatory" in s
          assert "not event notification" in s
          assert "run → jobs → active/pending/failed steps" in s
          assert "approximately every **30 seconds**" in s
          assert "Never create duplicate remote runs" in s
          assert "Do not wait for event notifications/webhooks" in s
          print("monitoring active polling contract: PASS")
          PY
