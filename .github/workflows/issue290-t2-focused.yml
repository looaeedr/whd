name: Issue 290 T2 Focused

on:
  push:
    branches:
      - refactor/issue290-gui-phase2-t2-layout-20260916

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PREDECESSOR_SHA: "7504e628f7648bb18925151b5e44912c53a913c4"

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Import and ownership smoke
        run: |
          python - <<'PY'
          import gui
          import gui_modules.layout as layout
          from pathlib import Path
          assert callable(layout._project_toolbar_presentation)
          assert callable(layout.build_main_layout)
          assert callable(layout.configure_styles)
          lines = len(Path('gui.py').read_text(encoding='utf-8').splitlines())
          print(f'GUI_LINES={lines}')
          assert lines <= 8650
          print('T2_IMPORT_OWNERSHIP_SMOKE=PASS')
          PY
      - name: Run T2 and related headless contracts
        run: |
          python -m pytest -q \
            tests/test_issue290_gui_phase2_t2_layout.py \
            tests/test_phase6_settings_center_gui_contract.py \
            tests/test_phase6_t22_settings_vertical_scroll.py \
            tests/test_phase6_t23_bottom_edge_visibility.py \
            tests/test_phase6_t24_edge_selector_width.py
      - name: Protected source drift gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${PREDECESSOR_SHA}"...HEAD -- \
            config.ini '基準檔/**' ae_engine fold_designer_bridge.py phase6_fold_profiles.py phase6_project_file.py release_required_artifacts.json)"
          if [ -n "$changed" ]; then
            echo "Unexpected protected drift:"
            echo "$changed"
            exit 1
          fi
          echo T2_PROTECTED_SOURCE_DRIFT=0

  xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Install Xvfb when absent
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Real Tk T2 layout parity smoke
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          import tkinter as tk
          import gui

          root = tk.Tk()
          try:
              root.geometry('800x600+0+0')
              app = gui.BoxCalculatorGUI(root)
              root.update_idletasks()
              root.update()

              assert app.project_open_button.cget('text') == '開啟專案'
              assert app.project_save_button.cget('text') == '儲存專案'
              assert app.project_save_as_button.cget('text') == '另存新檔'
              assert str(app.ui_text_size_combo.cget('state')) == 'readonly'
              assert int(app.ui_text_size_combo.cget('width')) == 4
              assert app.main_paned.winfo_exists()
              assert app.left_container.winfo_exists()

              canvases = [w for w in app.left_container.winfo_children()[0].winfo_children() if isinstance(w, tk.Canvas)]
              scrollbars = [w for w in app.left_container.winfo_children()[0].winfo_children() if isinstance(w, tk.Scrollbar)]
              assert canvases, 'left layout requires a Canvas scroll viewport'
              assert scrollbars, 'left layout requires a vertical Scrollbar'
              canvas = canvases[0]
              scrollbar = scrollbars[0]
              assert str(scrollbar.cget('orient')) == 'vertical'
              assert canvas.cget('scrollregion') not in ('', None)

              for label in ('小', '中', '大'):
                  key = app._apply_ui_text_size_preference(label, persist=False, notify_designer=False)
                  root.update_idletasks()
                  root.update()
                  assert key in ('small', 'medium', 'large')
                  assert app.project_toolbar_shell.winfo_exists()
                  assert app.main_paned.winfo_exists()
                  assert app.left_container.winfo_width() > 0
                  assert canvas.bbox('all') is not None

              canvas.yview_moveto(1.0)
              root.update_idletasks()
              root.update()
              lo, hi = canvas.yview()
              assert hi > lo
              print('T2_REAL_TK_LAYOUT_PARITY=PASS')
          finally:
              try:
                  root.destroy()
              except Exception:
                  pass
          PY
      - name: Existing Xvfb layout regressions excluding exact inherited baseline reds
        shell: bash
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t22_settings_vertical_scroll.py \
            tests/test_phase6_t23_bottom_edge_visibility.py \
            tests/test_phase6_t24_edge_selector_width.py \
            --deselect 'tests/test_phase6_t22_settings_vertical_scroll.py::test_medium_unlocked_settings_uses_real_vertical_scroll_owner_and_scrollable_viewport' \
            --deselect 'tests/test_phase6_t23_bottom_edge_visibility.py::test_medium_unlocked_endcap_edge_hosts_are_fully_inside_canvas[head]' \
            --deselect 'tests/test_phase6_t23_bottom_edge_visibility.py::test_medium_unlocked_endcap_edge_hosts_are_fully_inside_canvas[tail]' \
            --deselect 'tests/test_phase6_t24_edge_selector_width.py::test_endcap_four_direction_selectors_are_width_5_or_less_and_semantics_still_apply[head]' \
            --deselect 'tests/test_phase6_t24_edge_selector_width.py::test_endcap_four_direction_selectors_are_width_5_or_less_and_semantics_still_apply[tail]'
