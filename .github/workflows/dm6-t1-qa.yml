name: DM6 T1 Acceptance QA

on:
  push:
    branches:
      - work/dm6-t1-annotation-semantic-contract
    paths:
      - .github/workflows/dm6-t1-qa.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Focused acceptance
        run: |
          python -m pytest -q tests/test_dm6_annotation_semantic_contract.py tests/test_drawing_annotations.py tests/test_annotation_collision_resolver.py
      - name: Compile production module
        run: python -m py_compile ae_engine/drawing_annotations.py
