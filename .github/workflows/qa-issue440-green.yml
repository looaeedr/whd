name: "QA #440 no-wrapper GREEN"

on:
  push:
    branches:
      - fix/issue440-dark-canvas-background-20260920
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_assembly_panel.py'
      - 'tests/test_issue440_no_wrapper_shell.py'
      - 'tests/test_issue439_single_physical_content_host.py'
      - 'tests/test_issue431_shared_content_host.py'
      - 'tests/test_issue432_general_part_shared_host.py'
      - 'tests/test_issue433_assembly_shared_host.py'
      - 'tests/test_issue434_corner_data_shared_host.py'
      - 'tests/test_issue435_switch_lifecycle_guards.py'
      - 'tests/test_phase6_latest_layout_contract.py'
      - '.github/workflows/qa-issue440-green.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 3be16a4d6e9bde6ad4ad74365f718f2b0385db36

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf pillow
      - name: Source structure gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("fold_designer_bridge.py").read_text()
          assert "_phase6_sync_physical_content_host_extent" not in s
          assert 'self.shared_content_host = self.left' in s
          assert 'self.fold_editor_host = self.input_content_host' in s
          print("EXTRA_CONTENT_WRAPPER_FRAME_COUNT=0")
          print("FIXED_OUTER_CONTENT_EXTENT=0")
          print("PACK_PROPAGATE_FALSE_CONTENT_SHELL=0")
          PY
      - name: Run no-wrapper UI regression set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue440
          xvfb-run -a -s "-screen 0 1280x900x24"             python -m pytest -q             tests/test_issue440_no_wrapper_shell.py             tests/test_issue439_single_physical_content_host.py             tests/test_issue431_shared_content_host.py             tests/test_issue432_general_part_shared_host.py             tests/test_issue433_assembly_shared_host.py             tests/test_issue434_corner_data_shared_host.py             tests/test_issue435_switch_lifecycle_guards.py             tests/test_phase6_latest_layout_contract.py             --tb=short --json-report --json-report-file=.scratch/issue440/report.json             | tee .scratch/issue440/pytest.log
      - name: Machine classifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".scratch/issue440/report.json").read_text())
          tests=data.get("tests",[])
          failed=[r["nodeid"] for r in tests if r.get("outcome")=="failed"]
          errors=[r["nodeid"] for r in tests if r.get("outcome")=="error"]
          skipped=[r["nodeid"] for r in tests if r.get("outcome")=="skipped"]
          assert not failed, failed
          assert not errors, errors
          assert not skipped, skipped
          print(f"FOCUSED_PASS={sum(r.get('outcome')=='passed' for r in tests)}")
          print("FOCUSED_FAIL=0")
          print("FOCUSED_ERROR=0")
          print("FOCUSED_SKIP=0")
          print("MODE_SURFACES_DIRECT_PARENT_IS_LEFT=1")
          print("ACTIVE_MODE_SURFACE_COUNT=1")
          print("SAME_LAYOUT_SLOT=1")
          print("LEFT_SCROLL_CANVAS_THEME_BG=1")
          print("ASSEMBLY_CANVAS_THEME_BG=1")
          print("DEFAULT_TK_CANVAS_BG_LEAK=0")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue440-focused-green
          path: .scratch/issue440
          if-no-files-found: error
