name: Issue71 Divider Relief Topology Acceptance
on:
  push:
    branches: [fix/issue71-divider-relief-components]
    paths:
      - ae_engine/assembly_collision.py
      - ae_engine/divider_manufacturing.py
      - fold_designer_bridge.py
      - tests/test_issue71_divider_relief_components.py
      - tests/test_issue63_regression_red.py
      - tests/test_issue39_divider_relief.py
      - .github/workflows/issue71-acceptance.yml
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Compile Divider production boundary
        run: |
          python -m py_compile             ae_engine/assembly_collision.py             ae_engine/divider_manufacturing.py             fold_designer_bridge.py
      - name: Run Issue71 RED/GREEN seam
        shell: bash
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          python -m pytest -q             tests/test_issue71_divider_relief_components.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "CONFIG_BEFORE=$before"
          echo "CONFIG_AFTER=$after"
          test "$before" = "$after"
      - name: Run Divider regression guards
        shell: bash
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_issue63_regression_red.py             tests/test_issue39_divider_relief.py             tests/test_dm3_divider_canonical_relief_contract.py             tests/test_dm4_divider_resolved_sinks.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "CONFIG_BEFORE=$before"
          echo "CONFIG_AFTER=$after"
          test "$before" = "$after"
