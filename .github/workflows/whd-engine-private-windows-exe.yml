name: WHD-Engine Private Windows EXE (W-05)

# Private engine packaging proof, not a manufacturing release.
on:
  pull_request:
    branches: [localX]
    paths:
      - integration_cli/**
      - tests/test_issue2381_engine_packaged_identity.py
      - tests/test_issue2380_windows_path_aliases.py
      - tests/test_issue2380_worker_key_custody.py
      - tests/test_issue2380_trusted_prepare_custody.py
      - tests/test_issue2380_worker_cancel_safe_points.py
      - tests/test_issue2380_worker_progress_projection.py
      - tests/test_issue2380_private_worker_dispatch.py
      - tests/test_issue2380_private_exe_installation.py
      - .github/workflows/whd-engine-private-windows-exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-engine-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ENGINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_SHA }}
          persist-credentials: false
      - name: Prepare Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify SHA and focused manifest/CLI tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:ENGINE_SHA) { throw 'W05_EXACT_SHA_MISMATCH' }
          python -m pip install --disable-pip-version-check -r requirements.txt 'pyinstaller==6.16.0' pytest matplotlib pillow
          if ($LASTEXITCODE -ne 0) { throw 'W05_DEPENDENCIES_FAILED' }
          python -m pytest -q tests/test_issue2381_engine_packaged_identity.py tests/test_issue2377_cadsplit_headless_cli.py tests/test_issue2380_windows_path_aliases.py tests/test_issue2380_worker_key_custody.py tests/test_issue2380_trusted_prepare_custody.py tests/test_issue2380_worker_cancel_safe_points.py tests/test_issue2380_worker_progress_projection.py tests/test_issue2380_private_worker_dispatch.py tests/test_issue2380_private_exe_installation.py
          if ($LASTEXITCODE -ne 0) { throw 'W05_FOCUSED_TESTS_FAILED' }
      - name: Build private WHD-Engine.exe with bundled schemas and genuine resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onedir --console --contents-directory . --name WHD-Engine --paths . --collect-submodules ae_engine --collect-submodules integration_cli --add-data 'integration_cli/schemas;integration_cli/schemas' --add-data '基準檔;基準檔' --add-data 'config.ini;.' --add-data 'config;config' integration_cli/cadsplit_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'W05_PYINSTALLER_FAILED' }
          if (!(Test-Path 'dist/WHD-Engine/WHD-Engine.exe')) { throw 'W05_EXE_NOT_BUILT' }
          python -m integration_cli.packaged_identity --root 'dist/WHD-Engine' --sha "$env:ENGINE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'W05_MANIFEST_FAILED' }
      - name: Real packaged Engine private installed DPAPI prepare and restart
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WHD_TEST_ENGINE_EXE = (Resolve-Path 'dist/WHD-Engine/WHD-Engine.exe').Path
          python -m pytest -q tests/test_issue2380_private_exe_installation.py::test_actual_packaged_engine_private_prepare_and_restart tests/test_issue2380_private_exe_installation.py::test_actual_packaged_engine_prepares_and_exports_real_source_dxf tests/test_issue2380_private_exe_installation.py::test_actual_packaged_engine_twenty_attested_door_dxfs_replay_and_source_stale
          if ($LASTEXITCODE -ne 0) { throw 'W06_REAL_PRIVATE_EXE_PREPARE_FAILED' }
      - name: Native EXE smoke in Chinese installation / different working directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'WHD Engine 中文 安裝'
          $work = Join-Path $env:RUNNER_TEMP 'CADSplit 來源 工單'
          New-Item -ItemType Directory -Force $install, $work | Out-Null
          Copy-Item -LiteralPath 'dist/WHD-Engine' -Destination (Join-Path $install 'WHD-Engine') -Recurse
          $exe = Join-Path $install 'WHD-Engine/WHD-Engine.exe'
          if (!(Test-Path $exe)) { throw 'W05_CHINESE_INSTALL_FAILED' }
          $env:WHD_ENGINE_WORK_DIR = $work
          @'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tests").resolve()))
          from test_issue2377_cadsplit_headless_cli import _prepare
          from test_issue2376_cadsplit_worker_contract import export
          work = Path(os.environ["WHD_ENGINE_WORK_DIR"])
          (work / "20片 門板.json").write_text(json.dumps(_prepare(20), ensure_ascii=False), encoding="utf-8")
          (work / "原始 出圖.json").write_text(json.dumps(export(), ensure_ascii=False), encoding="utf-8")
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'W05_REQUEST_FIXTURES_FAILED' }
          Push-Location $work
          try {
            & $exe capabilities --response '能力 結果.json'
            if ($LASTEXITCODE -ne 0) { throw "W05_CAPABILITIES_EXIT_$LASTEXITCODE" }
            $cap = Get-Content '能力 結果.json' -Raw -Encoding utf8 | ConvertFrom-Json
            if ($cap.engine_commit -ne $env:ENGINE_SHA -or
                $cap.engine_version -ne 'w05-private-onedir' -or
                !$cap.engine_sha256 -or !$cap.registry_sha256 -or
                !$cap.baseline_manifest_sha256 -or !$cap.policy_sha256 -or
                !$cap.resource_revision) { throw 'W05_PACKAGED_PROVENANCE_MISSING' }
            if ($cap.resource_health.registry -ne 'ready' -or
                $cap.resource_health.baseline -ne 'ready' -or
                $cap.resource_health.policy -ne 'ready') { throw 'W05_RESOURCE_HEALTH_BAD' }
            if ($cap.supported_part_kinds.Count -gt 0 -or
                @($cap.capability_flags.PSObject.Properties | Where-Object { $_.Value -eq $true }).Count -gt 0) {
              throw 'W05_FALSE_PUBLIC_MANUFACTURING_CLAIM'
            }
            & $exe prepare --request '20片 門板.json' --response '準備 結果.json'
            if ($LASTEXITCODE -ne 3) { throw 'W05_PREPARE_SHOULD_BE_DISABLED' }
            $prepared = Get-Content '準備 結果.json' -Raw -Encoding utf8 | ConvertFrom-Json
            if ($prepared.diagnostics[0].code -ne 'WHD_OPERATION_NOT_IMPLEMENTED' -or $prepared.manufacturing_verified) {
              throw 'W05_PREPARE_FALSE_SUCCESS'
            }
            & $exe export --request '原始 出圖.json' --response '出圖 結果.json'
            if ($LASTEXITCODE -ne 3) { throw 'W05_EXPORT_SHOULD_BE_DISABLED' }
            $exported = Get-Content '出圖 結果.json' -Raw -Encoding utf8 | ConvertFrom-Json
            if ($exported.diagnostics[0].code -ne 'WHD_OPERATION_NOT_IMPLEMENTED' -or $exported.manufacturing_verified) {
              throw 'W05_EXPORT_FALSE_SUCCESS'
            }
          } finally {
            Pop-Location
          }
          if (@(Get-ChildItem $work -Filter '*.dxf').Count -ne 0) { throw 'W05_CREATED_UNAPPROVED_DXF' }
          $registry = Join-Path $install 'WHD-Engine/基準檔/截角資料庫/certified_relief_rules.json'
          [System.IO.File]::AppendAllText($registry, 'tamper')
          & $exe capabilities --response (Join-Path $work '壞資源.json')
          if ($LASTEXITCODE -ne 4 -or (Test-Path (Join-Path $work '壞資源.json'))) {
            throw 'W05_RESOURCE_TAMPER_MUST_FAIL_CLOSED'
          }
          Write-Host "W05_PRIVATE_ENGINE_WINDOWS_EXE_PASS exact_sha=$env:ENGINE_SHA"
          # A negative tamper case intentionally left $LASTEXITCODE=4; GitHub's
          # pwsh wrapper would otherwise treat that expected refusal as failure.
          exit 0
      - name: Build matching WHD GUI.exe from the SAME exact HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:ENGINE_SHA) { throw 'W05_GUI_SOURCE_DRIFT' }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --contents-directory . --name WHD --collect-submodules ae_engine --collect-submodules gui_modules --add-data '基準檔;基準檔' --add-data 'config.ini;.' --add-data 'config;config' gui.py
          if ($LASTEXITCODE -ne 0) { throw 'W05_GUI_PYINSTALLER_FAILED' }
          $guiExe = 'dist/WHD/WHD.exe'
          $engineExe = 'dist/WHD-Engine/WHD-Engine.exe'
          if (!(Test-Path $guiExe) -or !(Test-Path $engineExe)) {
            throw 'W05_GUI_ENGINE_PAIR_MISSING'
          }
          if (!(Test-Path 'dist/WHD/config.ini') -or !(Test-Path 'dist/WHD/基準檔')) {
            throw 'W05_GUI_RESOURCES_MISSING'
          }
          $private = Get-Content 'dist/WHD-Engine/WHD_ENGINE_BUILD.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $engineHash = (Get-FileHash $engineExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $guiHash = (Get-FileHash $guiExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($private.engine_commit -ne $env:ENGINE_SHA -or $private.engine_sha256 -ne $engineHash) {
            throw 'W05_GUI_ENGINE_BUILD_SOURCE_MISMATCH'
          }
          @{
            schema = 'whd-private-gui-engine-pair-v1'
            engine_commit = $env:ENGINE_SHA
            engine_sha256 = $engineHash
            gui_sha256 = $guiHash
            registry_sha256 = $private.registry_sha256
            baseline_manifest_sha256 = $private.baseline_manifest_sha256
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'dist/WHD/SAME_SOURCE_ENGINE_GUI.json' -Encoding utf8
          Write-Host "W05_GUI_ENGINE_SAME_SHA_PROVEN sha=$env:ENGINE_SHA engine=$engineHash gui=$guiHash"
      - name: Smoke-test actual GUI WHD.exe without replacing customer files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guiFolder = (Resolve-Path 'dist/WHD').Path
          $exe = Join-Path $guiFolder 'WHD.exe'
          $app = Start-Process -FilePath $exe -WorkingDirectory $guiFolder -PassThru
          try {
            Start-Sleep -Seconds 12
            $app.Refresh()
            if ($app.HasExited) { throw "W05_GUI_STARTUP_FAILED_$($app.ExitCode)" }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          # Both binaries came from the same exact checkout, not adjacent PRs.
          $pair = Get-Content 'dist/WHD/SAME_SOURCE_ENGINE_GUI.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ($pair.engine_commit -ne $env:ENGINE_SHA -or
              $pair.engine_sha256 -ne (Get-FileHash 'dist/WHD-Engine/WHD-Engine.exe' -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $pair.gui_sha256 -ne (Get-FileHash 'dist/WHD/WHD.exe' -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'W05_GUI_ENGINE_PAIR_READBACK_FAILED'
          }
          Write-Host "W05_SAME_SHA_GUI_STARTUP_AND_PRIVATE_ENGINE_PASS $env:ENGINE_SHA"
      - name: Upload only private Engine candidate
        uses: actions/upload-artifact@v4
        with:
          name: WHD-Engine-private-W05
          path: dist/WHD-Engine/
          if-no-files-found: error
          retention-days: 14
      - name: Upload same-source WHD GUI candidate (NOT X release)
        uses: actions/upload-artifact@v4
        with:
          name: WHD-GUI-same-source-W05
          path: dist/WHD/
          if-no-files-found: error
          retention-days: 14
