name: "QA #414 Phase 5 T0 bridge census"

on:
  push:
    branches:
      - refactor/issue414-phase5-t0-bridge-census-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run canonical bridge census
        run: |
          python tools/phase5_bridge_census.py             --json .scratch/phase5-t0-bridge-census.json             --markdown docs/superpowers/checkpoints/phase5-t0-bridge-census.md
      - name: Show summary
        run: |
          cat docs/superpowers/checkpoints/phase5-t0-bridge-census.md
      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-t0-bridge-census
          path: |
            .scratch/phase5-t0-bridge-census.json
            docs/superpowers/checkpoints/phase5-t0-bridge-census.md
