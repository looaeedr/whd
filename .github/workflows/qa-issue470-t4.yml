name: Issue 470 T4 Gate A

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue470-t4.yml'
      - 'phase6_manufacturing_service.py'
      - 'phase6_manufacturing_contracts.py'
      - 'ae_engine/contracts.py'
      - 'ae_engine/joint_marking_policy.py'
      - 'tests/test_issue470_t4_dormant_gate_a.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest matplotlib -r requirements.txt
      - name: Run Issue470 T4 Gate A contract
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_issue470_t4_dormant_gate_a.py
