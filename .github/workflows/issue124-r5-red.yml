name: Issue 124 R5 Latest-Target RED
on:
  push:
    branches: [work/issue-124-replay-latest-20260912-r5]
    paths:
      - tests/test_issue124_structure_tree.py
      - .github/workflows/issue124-r5-red.yml
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify exact latest production ancestry
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "d493b2e0d7404233b6ed2c681caf7d28c73b30f6"
          git diff --name-only d493b2e0d7404233b6ed2c681caf7d28c73b30f6...HEAD
      - name: Install runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Snapshot config
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Headless RED contract
        continue-on-error: true
        id: headless
        run: python -m pytest -q tests/test_issue124_structure_tree.py
      - name: Xvfb RED contract
        continue-on-error: true
        id: xvfb
        shell: bash
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python -m pytest -q tests/test_issue124_structure_tree.py
      - name: Require genuine RED and invariant preservation
        shell: bash
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          echo "HEADLESS_OUTCOME=${{ steps.headless.outcome }}"
          echo "XVFB_OUTCOME=${{ steps.xvfb.outcome }}"
          if [ "${{ steps.headless.outcome }}" = success ] && [ "${{ steps.xvfb.outcome }}" = success ]; then
            echo 'Latest target is already GREEN; do not replay obsolete production patch.' >&2
            exit 1
          fi
          echo 'R5_RED_CONFIRMED=1'
