name: Issue452 Skill Registry QA

on:
  push:
    branches:
      - chore/issue452-register-skills-scheduled-dispatch-20260921
    paths:
      - '.github/workflows/qa-issue452-skill-registry.yml'
      - '.agents/skills/skill_registry.json'
      - 'tests/knowledge/test_skill_registry_coverage_contract.py'
      - 'docs/superpowers/checkpoints/issue452-skill-registration-preflight-evidence.md'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owning branch
        uses: actions/checkout@v4
        with:
          ref: chore/issue452-register-skills-scheduled-dispatch-20260921
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest

      - name: Skill preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "修改技能註冊表與 canonical skill registry coverage contract" \
            --changed-file ".agents/skills/skill_registry.json" \
            --changed-file "tests/knowledge/test_skill_registry_coverage_contract.py" \
            --evidence "docs/superpowers/checkpoints/issue452-skill-registration-preflight-evidence.md"

      - name: Canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/skill_catalog.py

      - name: Focused registry contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/knowledge/test_skill_registry_coverage_contract.py \
            tests/knowledge/test_skill_catalog_classification_contract.py \
            tests/knowledge/test_active_skill_runtime_contract.py \
            tests/test_phase6_skill_preflight_gate.py
