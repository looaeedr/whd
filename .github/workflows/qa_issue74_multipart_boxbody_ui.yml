name: Issue 74 Multipart BoxBody UI QA

on:
  push:
    branches:
      - fix/multipart-boxbody-ui-boundaries

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run Issue 74 acceptance
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"

          python tools/phase6_skill_preflight.py \
            --task "修正 3D 多件式箱身 assembly visibility bug" \
            --changed-file fold_designer_bridge.py \
            --changed-file phase6_final_scene_view.py \
            --changed-file .agents/skills/engineering/phase6-assembly-view-boundaries/SKILL.md \
            --evidence .scratch/issue74_preflight_evidence.txt

          pytest -q \
            tests/test_phase6_assembly_3d_view.py \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_phase6_assembly_view_skill_contract.py

          xvfb-run -a pytest -q tests/test_phase6_receiving_multipart_integration.py

          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "config.ini before=$before"
          echo "config.ini after=$after"
          test "$before" = "$after"
