name: "QA #366 T2C corner external GREEN"
# explicit trigger after selector-constant restoration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t2c-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=366 T2C"
          echo "BASELINE=bb8c3d0272756629654127fbd86e9d7013d797e4"
          echo "CANDIDATE=$(git rev-parse HEAD)"
          git merge-base --is-ancestor bb8c3d0272756629654127fbd86e9d7013d797e4 HEAD

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: Compile T2C owners
        run: python -m py_compile phase6_settings_transaction_controller.py fold_designer_bridge.py

      - name: Run T2C ownership contracts
        run: python -m pytest -q tests/test_issue366_t2c_corner_external_controller.py

      - name: Run pure assembly transaction regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_assembly_joint_contract.py \
            tests/test_assembly_joint_semantics.py \
            tests/test_phase6_sync_envelope.py::test_stale_external_revision_cannot_overwrite_newer_state

      - name: Run real-Tk corner and live-sync regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_corner_transaction.py \
            tests/test_phase6_live_canonical_sync.py \
            tests/test_phase6_sync_envelope.py \
            tests/test_phase6_settings_center_bridge.py
