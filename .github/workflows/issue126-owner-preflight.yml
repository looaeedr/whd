name: Issue 126 Workspace Owner Preflight
on:
  push:
    branches: [work/issue-126-workspace-layout-20260912-r1]
    paths:
      - .github/workflows/issue126-owner-preflight.yml
      - tests/test_issue126_workspace_layout.py
      - fold_designer_bridge.py
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build evidence manifest
        run: |
          cat > /tmp/evidence.md <<'EOF'
          UI設計與去AI味
          phase6-gui-performance-integrity
          phase6-corner-3d-model-integrity
          Python測試實務
          性質導向測試
          diagnosing-bugs
          tdd
          驗證板件與DXF
          monitoring-remote-qa
          派工
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          EOF
      - name: Phase6 changed-file preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "#126 只重整 Fold Designer 2D/3D/截角中央 workspace 的 presentation layout/resize priority/minimum sidebar width/chrome；不得新增 authoritative state/cache，不得在 resize/redraw 修改 geometry/domain，不改 projection/unfold/placement/manufacturing/DXF authority；須保留 view switch/selection/visibility/zoom/fit 與小中大文字尺度" \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue126_workspace_layout.py \
            --changed-file .github/workflows/issue126-owner-preflight.yml \
            --evidence /tmp/evidence.md
      - name: Lock production ancestry
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "f85e0ba0047bcf3d9d447ecf7d365484267c29d0"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "f85e0ba0047bcf3d9d447ecf7d365484267c29d0"
      - name: Apply minimal workspace layout change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fold_designer_bridge.py')
          s = p.read_text(encoding='utf-8')
          old = '''    self.left.pack(side=original.tk.LEFT, fill=original.tk.Y)\n    self.right.pack(side=original.tk.RIGHT, fill=original.tk.BOTH, expand=True)\n'''
          new = '''    # #126: the left side is an engineering inspector, not a competing canvas.\n    # Keep its width bounded and let the central drawing workspace absorb resize growth.\n    # This is presentation-only: no workspace/domain state is created or mutated here.\n    self.left.configure(width=360)\n    self.left.pack_propagate(False)\n    self.left.pack(side=original.tk.LEFT, fill=original.tk.Y)\n    self.right.pack(side=original.tk.RIGHT, fill=original.tk.BOTH, expand=True)\n'''
          if new in s:
              print('layout patch already present')
          else:
              if old not in s:
                  raise SystemExit('layout seam not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('layout patch applied')
          PY
      - name: Install GUI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Issue 126 workspace focused contract
        run: xvfb-run -a -s '-screen 0 2000x1200x24' pytest -q tests/test_issue126_workspace_layout.py
      - name: Commit tested production change
        shell: bash
        run: |
          if git diff --quiet -- fold_designer_bridge.py; then
            echo 'no production diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py
          git commit -m 'fix(#126): prioritize central drawing workspace'
          git push origin HEAD:work/issue-126-workspace-layout-20260912-r1
