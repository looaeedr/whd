name: Issue 126 Workspace Owner Preflight
on:
  push:
    branches: [work/issue-126-workspace-layout-20260912-r1]
    paths: [.github/workflows/issue126-owner-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build evidence manifest
        run: |
          cat > /tmp/evidence.md <<'EOF'
          UI設計與去AI味
          phase6-gui-performance-integrity
          phase6-corner-3d-model-integrity
          Python測試實務
          性質導向測試
          diagnosing-bugs
          tdd
          驗證板件與DXF
          monitoring-remote-qa
          派工
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          EOF
      - name: Phase6 changed-file preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "#126 只重整 Fold Designer 2D/3D/截角中央 workspace 的 presentation layout/resize priority/minimum sidebar width/chrome；不得新增 authoritative state/cache，不得在 resize/redraw 修改 geometry/domain，不改 projection/unfold/placement/manufacturing/DXF authority；須保留 view switch/selection/visibility/zoom/fit 與小中大文字尺度" \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue126_workspace_layout.py \
            --changed-file .github/workflows/issue126-owner-preflight.yml \
            --evidence /tmp/evidence.md
      - name: Lock production ancestry
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "f85e0ba0047bcf3d9d447ecf7d365484267c29d0"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "f85e0ba0047bcf3d9d447ecf7d365484267c29d0"
      - name: Install GUI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Runtime workspace owner map
        run: |
          xvfb-run -a -s '-screen 0 1800x1100x24' python - <<'PY'
          import tkinter as tk
          import gui
          root=tk.Tk(); root.geometry('1500x900+0+0'); root.update()
          app=gui.BoxCalculatorGUI(root)
          d=app.open_original_fold_designer(); root.update_idletasks(); root.update()
          print('DESIGNER_CLASS', type(d).__name__)
          print('WORKSPACE_CONTROLLER_ID', id(getattr(d,'workspace_controller',None)))
          for name,value in sorted(vars(d).items()):
              if hasattr(value,'winfo_class'):
                  low=name.lower()
                  if any(k in low for k in ('frame','panel','canvas','view','workspace','tree','setting','left','right','center','main','drawing','figure','toolbar')):
                      try:
                          print('ATTR',name,value.winfo_class(),value.winfo_manager(),value.winfo_width(),value.winfo_height(),str(value))
                      except Exception as e: print('ATTRERR',name,type(e).__name__)
          print('TOP_CHILDREN')
          def walk(w,depth=0):
              if depth>3: return
              for c in w.winfo_children():
                  try:
                      print('NODE',depth,c.winfo_class(),c.winfo_manager(),c.winfo_width(),c.winfo_height(),str(c))
                  except Exception: pass
                  walk(c,depth+1)
          walk(d.root if hasattr(d,'root') else root)
          try: d.root.destroy()
          except Exception: pass
          root.destroy()
          PY
