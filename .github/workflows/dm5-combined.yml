name: DM5 Divider Deep Module Combined Acceptance

on:
  push:
    branches:
      - work/dm5-divider-deep-module-integration
    paths:
      - ".github/workflows/dm5-combined.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt

      - name: Phase6 knowledge and skill preflight
        shell: bash
        run: |
          mkdir -p logs
          cat > dm5_preflight_evidence.txt <<'EOF'
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          dispatching
          implement
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_CONTEXT: CONTEXT.md
          EOF
          python tools/phase6_skill_preflight.py             --task "DM5 Combined Acceptance Divider Physical Geometry Contract FW physical face placement relief final material 2D 3D Assembly DXF Save Reload multipart family guards AI Library skill writeback integration"             --changed-file ae_engine/cabinet_types/receiving.py             --changed-file ae_engine/cabinet_types/policy.py             --changed-file ae_engine/door_dividers.py             --changed-file ae_engine/divider_manufacturing.py             --changed-file ae_engine/manufacturing_api.py             --changed-file fold_designer_bridge.py             --changed-file phase6_project_file.py             --changed-file .agents/skills/engineering/掃描深模組/SKILL.md             --changed-file .agents/skills/engineering/拆解任務工單/SKILL.md             --changed-file .agents/skills/engineering/派工/SKILL.md             --evidence dm5_preflight_evidence.txt             > logs/dm5.preflight.txt
          cat logs/dm5.preflight.txt
          python .agents/skills/engineering/掃描深模組/check_zh_tw_report.py --skill-sources

      - name: Compile deep-module production boundary
        run: |
          python -m py_compile             ae_engine/assembly_geometry.py             ae_engine/assembly_placement.py             ae_engine/cabinet_types/receiving.py             ae_engine/cabinet_types/policy.py             ae_engine/door_dividers.py             ae_engine/divider_manufacturing.py             ae_engine/manufacturing_api.py             fold_designer_bridge.py             phase6_project_file.py             phase6_final_scene_view.py

      - name: Combined acceptance
        shell: bash
        run: |
          set +e
          before="$(sha256sum config.ini | awk '{print $1}')"

          mkdir -p logs
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > logs/xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          cleanup() {
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.2
          done

          python -m pytest -q             tests/test_issue38_receiving_divider_baseline.py             tests/test_issue39_divider_relief.py             tests/test_issue40_divider_6p4_shared_datum.py             tests/test_issue43_receiving_divider_t1.py             tests/test_issue45_dynamic_parts_2d_roundtrip.py             tests/test_issue48_receiving_fw_flush_red.py             tests/test_assembly_collision.py             tests/test_assembly_collision_integration.py             tests/test_assembly_placement_divider.py             tests/test_phase6_t05_box_body_dividers.py             tests/test_phase6_t06_receiving_fresh_family.py             tests/test_phase6_t12_receiving_asymmetric_policy.py             tests/test_phase6_t16_receiving_placement.py             tests/test_phase6_receiving_multipart_integration.py             tests/test_phase6_receiving_projection_regression.py             tests/test_receiving_door_frame_width_semantics.py             tests/test_receiving_door_dimension_projection_semantics.py             tests/test_phase6_t25_combined_receiving_acceptance.py             tests/test_phase6_t10_project_authority.py             tests/test_phase6_project_file.py             tests/test_resolved_manufacturing_bridge.py             tests/test_resolved_manufacturing_export.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_canonical_unfolded_blank_info.py             tests/test_dm1_divider_physical_contract.py             tests/test_dm3_divider_canonical_relief_contract.py             tests/test_dm4_divider_resolved_sinks.py             tests/test_dm5_deep_module_writeback_contract.py             tests/test_phase6_cabinet_family_policy.py             tests/test_phase6_t11_family_preset_switching.py             > dm5_combined.log 2>&1
          rc=$?

          after="$(sha256sum config.ini | awk '{print $1}')"
          cat dm5_combined.log
          printf '{"pytest_rc":%s,"config_before":"%s","config_after":"%s"}\n' "$rc" "$before" "$after" > dm5_state.json
          cat dm5_state.json
          if [ "$before" != "$after" ]; then
            echo "config.ini mutated" >&2
            exit 97
          fi
          exit "$rc"

      - name: Divider deep-module source ownership scan
        run: |
          python - <<'PY'
          from pathlib import Path

          sink_files = {
              "final_scene_view": Path("phase6_final_scene_view.py").read_text(encoding="utf-8"),
              "bridge": Path("fold_designer_bridge.py").read_text(encoding="utf-8"),
          }
          for name, source in sink_files.items():
              assert "frame_width_segment_index" not in source, (name, "raw FW index leaked to sink")
              assert "build_divider_front_fold_relief_candidate(" not in source, (name, "relief oracle leaked to sink")
              assert "verify_divider_front_fold_relief(" not in source, (name, "relief verifier leaked to sink")

          view = sink_files["final_scene_view"]
          for forbidden in ("derive_box_body_dividers", "resolve_divider_final_geometry", "FW=29", "174", "47/26"):
              assert forbidden not in view, ("final_scene_view", forbidden)

          bridge = sink_files["bridge"]
          assert 'key.startswith("box_body:divider:")' in bridge
          assert "resolved.part(key).render_data" in bridge
          assert "resolve_divider_final_geometry(" in bridge
          assert "_phase6_divider_fw_placement_evidence(" not in bridge

          manufacturing = Path("ae_engine/manufacturing_api.py").read_text(encoding="utf-8")
          marker = manufacturing.index("def save_resolved_manufacturing_geometry_dxf(")
          end = manufacturing.find("\ndef ", marker + 10)
          sink = manufacturing[marker:] if end < 0 else manufacturing[marker:end]
          assert "build_box_body_divider_render_data" not in sink
          assert "derive_box_body_dividers" not in sink
          assert "frame_width_segment_index" not in sink

          project = Path("phase6_project_file.py").read_text(encoding="utf-8")
          assert 'materialized["final_geometry"] = {}' in project
          assert 'decoded["final_geometry"] = {}' in project

          context = Path("CONTEXT.md").read_text(encoding="utf-8")
          assert "Divider Physical Geometry Contract" in context
          assert "FW physical face" in context
          assert "resolved geometry sinks" in context
          assert "中隔.dxf" in context

          scan_skill = Path(".agents/skills/engineering/掃描深模組/SKILL.md").read_text(encoding="utf-8")
          ticket_skill = Path(".agents/skills/engineering/拆解任務工單/SKILL.md").read_text(encoding="utf-8")
          dispatch_skill = Path(".agents/skills/engineering/派工/SKILL.md").read_text(encoding="utf-8")
          for source in (scan_skill, ticket_skill, dispatch_skill):
              assert "GitHub owning Issue" in source
              assert "AI Library Writeback owner" in source
              assert "Combined Acceptance owner" in source
          PY

      - name: Upload durable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm5-combined-${{ github.run_id }}
          path: |
            dm5_combined.log
            dm5_state.json
            logs/dm5.preflight.txt
            logs/xvfb.log
