name: WHD Official GitHub Release

# No release is created on a product PR, CI green or X merge alone.
# Only a post-publish GitHub localX back-sync, matching exact X merge SHA,
# can advance this workflow to its release step.
on:
  push:
    branches:
      - localX
  pull_request:
    branches:
      - localX
    paths:
      - AGENTS.md
      - tools/localx_publish_gate.py
      - tests/process/test_localx_publish_gate.py
      - .github/workflows/whd-official-release.yml

env:
  TZ: Asia/Taipei

permissions:
  contents: read

jobs:
  release-contract-tests:
    name: Official Release Contract Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact user /推推, Taiwan tag and rejection regression
        run: python -m unittest discover -s tests/process -p 'test_localx_publish_gate.py' -v

  authorize-release:
    name: Authorize exact X merge and owner /推推
    if: github.event_name == 'push' && github.ref == 'refs/heads/localX' && github.repository == 'looaeedr/whd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: whd-official-release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      issues: read
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      tag: ${{ steps.verify.outputs.tag }}
      pr: ${{ steps.verify.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact published X merge, owner /推推 acceptance and authorization
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from tools.localx_publish_gate import require_official_release_proof

          repo = os.environ["RELEASE_REPO"]
          sha = os.environ["RELEASE_SHA"]

          def gh_json(endpoint, *, pages=False):
              cmd = ["gh", "api"]
              if pages:
                  cmd += ["--paginate", "--slurp"]
              cmd.append(endpoint)
              return json.loads(subprocess.check_output(cmd, text=True))

          # Unlike a simple X merge, this requires post-publish GitHub localX
          # back-sync. Ordinary localX work cannot accidentally create a tag.
          x = gh_json(f"repos/{repo}/git/ref/heads/cleanup/2d-3d-sync")
          x_sha = x["object"]["sha"]
          output = os.environ["GITHUB_OUTPUT"]
          if sha != x_sha:
              with open(output, "a", encoding="utf-8") as f:
                  f.write("eligible=false\n")
              print("Not a completed /推推: GitHub localX != X. No release.")
              raise SystemExit(0)

          related = gh_json(f"repos/{repo}/commits/{sha}/pulls")
          candidates = [
              pr for pr in related
              if pr.get("merged_at")
              and pr.get("merge_commit_sha") == sha
              and (pr.get("head") or {}).get("ref") == "localX"
              and (pr.get("base") or {}).get("ref") == "cleanup/2d-3d-sync"
          ]
          if not candidates:
              with open(output, "a", encoding="utf-8") as f:
                  f.write("eligible=false\n")
              print("X equals localX, but not an approved /推推 merge. No release.")
              raise SystemExit(0)
          if len(candidates) != 1:
              raise RuntimeError("OFFICIAL_RELEASE_AMBIGUOUS_PUBLISH_PR")

          pr = gh_json(f"repos/{repo}/pulls/{candidates[0]['number']}")
          commit = gh_json(f"repos/{repo}/commits/{sha}")
          parents = [p["sha"] for p in commit["parents"]]
          comment_pages = gh_json(
              f"repos/{repo}/issues/{pr['number']}/comments?per_page=100",
              pages=True,
          )
          comments = [comment for page in comment_pages for comment in page]
          tag = require_official_release_proof(
              repo=repo, pushed_sha=sha, production_sha=x_sha,
              pr=pr, merge_parents=parents, comments=comments,
          )
          with open(output, "a", encoding="utf-8") as f:
              f.write(f"eligible=true\ntag={tag}\npr={pr['number']}\n")
          print(f"Exact owner /推推 accepted and verified; release {tag}, PR #{pr['number']}")
          PY

  windows-package:
    name: Build exact X Windows EXE and Traditional Chinese documents
    needs: authorize-release
    if: needs.authorize-release.outputs.eligible == 'true'
    uses: ./.github/workflows/whd-windows-exe.yml
    with:
      release_sha: ${{ github.sha }}
      release_tag: ${{ needs.authorize-release.outputs.tag }}
    permissions:
      contents: read

  official-release:
    name: Publish complete WHD Release after verified Windows artifacts
    needs: [authorize-release, windows-package]
    if: needs.authorize-release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: whd-official-release-final-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download verified Windows x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: WHD-Windows-x64
          path: windows-package
      - name: Check EXE, SHA-256, and Traditional Chinese notes before publishing
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.authorize-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd windows-package
          archive="WHD_Windows_x64_$RELEASE_TAG.zip"
          for file in "$archive" SHA256.txt WHD_Release_Notes_zh-TW.md WHD_Windows_Guide_zh-TW.md; do
            test -s "$file" || { echo "::error::RELEASE_DELIVERY_MISSING: $file"; exit 1; }
          done
          sha256sum --check SHA256.txt
          unzip -Z1 "$archive" | grep -Fx 'WHD/WHD.exe'
          unzip -Z1 "$archive" | grep -Fx 'WHD/本次更新.md'
          unzip -Z1 "$archive" | grep -Fx 'WHD/使用說明.md'
          grep -q '本次主要更新' WHD_Release_Notes_zh-TW.md
          grep -Fq "$RELEASE_SHA" WHD_Release_Notes_zh-TW.md
          grep -Fq "$RELEASE_TAG" WHD_Release_Notes_zh-TW.md
          grep -q '如何下載' WHD_Windows_Guide_zh-TW.md

      - name: Publish X-tagged GitHub Release only after complete delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.authorize-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd windows-package
          archive="WHD_Windows_x64_$RELEASE_TAG.zip"
          # A retry may reuse a tag, but must never retarget it.
          if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$RELEASE_SHA" || {
              echo "::error::OFFICIAL_RELEASE_TAG_POINTS_TO_OTHER_SHA"; exit 1;
            }
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            test "$actual" = "$RELEASE_SHA" || {
              echo "::error::OFFICIAL_RELEASE_SOURCE_MISMATCH"; exit 1;
            }
          else
            # Draft prevents exposing a half-published release while artifacts upload.
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" --title "WHD $RELEASE_TAG" \
              --notes-file WHD_Release_Notes_zh-TW.md --draft
          fi
          gh release upload "$RELEASE_TAG" "$archive" SHA256.txt \
            WHD_Release_Notes_zh-TW.md WHD_Windows_Guide_zh-TW.md \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,assets,body \
            | jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg archive "$archive" '
                .tagName == $tag and .targetCommitish == $sha
                and ([.assets[] | select(.name == $archive and .size > 0)] | length) == 1
                and ([.assets[] | select(.name == "SHA256.txt" and .size > 0)] | length) == 1
                and ([.assets[] | select(.name == "WHD_Release_Notes_zh-TW.md" and .size > 0)] | length) == 1
                and ([.assets[] | select(.name == "WHD_Windows_Guide_zh-TW.md" and .size > 0)] | length) == 1
                and (.body | contains("本次主要更新"))
              ' > /dev/null || {
                # For older existing releases the body may be English; replace it
                # only after verifying exact tagged identity and all four assets.
                gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                  --notes-file WHD_Release_Notes_zh-TW.md
              }
          # Publish the draft only after the ZIP and Chinese notes are proven.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file WHD_Release_Notes_zh-TW.md --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets,body \
            | jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg archive "$archive" '
                .tagName == $tag and .targetCommitish == $sha
                and .isDraft == false and .isPrerelease == false
                and ([.assets[] | select(.name == $archive and .size > 0)] | length) == 1
                and ([.assets[] | select(.name == "SHA256.txt" and .size > 0)] | length) == 1
                and ([.assets[] | select(.name == "WHD_Release_Notes_zh-TW.md" and .size > 0)] | length) == 1
                and ([.assets[] | select(.name == "WHD_Windows_Guide_zh-TW.md" and .size > 0)] | length) == 1
                and (.body | contains("本次主要更新"))
              ' >/dev/null
          echo "OFFICIAL_WINDOWS_EXE_RELEASED https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          echo "### 正式 WHD Windows 交付" >> "$GITHUB_STEP_SUMMARY"
          echo "同版 Windows EXE、SHA-256、繁體中文更新說明與使用指南均已發布：$RELEASE_TAG / $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
