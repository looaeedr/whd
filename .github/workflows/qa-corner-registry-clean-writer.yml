name: Corner Registry Chinese Clean Writer

on:
  push:
    branches:
      - fix/corner-db-chinese-only-20260917
    paths:
      - '.github/workflows/qa-corner-registry-clean-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-clean-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Build exact clean candidate
        env:
          BASE: 14ac21e40be1e97bad762ef11ce39e4a88576ea1
          WORK: fix/corner-db-chinese-only-20260917
          CLEAN: fix/corner-db-chinese-clean-20260917
        run: |
          set -euo pipefail
          git fetch origin
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "$BASE"
          test "$(git rev-parse origin/$CLEAN)" = "$BASE"
          git switch -C "$CLEAN" "origin/$CLEAN"
          git diff --binary "$BASE" "origin/$WORK" -- \
            fold_designer_bridge.py \
            tests/test_corner_registry_chinese_presentation.py > /tmp/accepted.patch
          test -s /tmp/accepted.patch
          git apply --index /tmp/accepted.patch
          python - <<'PY'
          from pathlib import Path

          skill = Path('.agents/skills/engineering/UI設計與去AI味/SKILL.md')
          pitfall = Path('個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md')

          skill_marker = 'WHD_CORNER_REGISTRY_CHINESE_PRESENTATION_RULE_20260917'
          if skill_marker not in skill.read_text(encoding='utf-8'):
              with skill.open('a', encoding='utf-8', newline='\n') as f:
                  f.write(f'''\n\n### 截角資料庫中文展示邊界（{skill_marker}）\n\n- 截角資料庫中所有使用者可見文字都必須以繁體中文呈現；內部 raw ID、enum、schema、規則 ID 可維持既有英文值，但不得直接漏到畫面。\n- 中文化只能發生在 presentation adapter；不得為了 UI 驗收改寫 registry 原始資料、幾何 authority 或持久化契約。\n- 公式、前置條件、來源備註、選單值、Treeview、Canvas 文字與視窗標題都屬 presentation boundary。\n- 驗收必須逐筆選取資料庫中的全部規則並掃描實際 rendered text；只驗初始畫面或第一筆規則不算通過。\n''')

          pitfall_marker = 'WHD_PITFALL_CORNER_REGISTRY_RAW_ID_LEAK_20260917'
          if pitfall_marker not in pitfall.read_text(encoding='utf-8'):
              with pitfall.open('a', encoding='utf-8', newline='\n') as f:
                  f.write(f'''\n\n### 截角資料庫 raw token 洩漏到 UI（{pitfall_marker}）\n\n- 現象：規則名稱已中文化，但來源備註、前置條件或 choice value 仍直接顯示 raw token，造成畫面混入英文。\n- 根因：只替固定 Label 做翻譯，沒有把動態 StringVar、Menubutton、Treeview 與資料列選取後的投影一起納入 presentation adapter。\n- 防錯：raw authority 原值不動；以可逆 display/raw adapter 投影；回歸測試必須逐筆掃完整 registry，而不是看 widget 是否存在。\n- 禁止：為了讓 UI 測試變綠而改 registry ID、enum、schema 或幾何計算來源。\n''')
          PY
          git add .agents/skills/engineering/UI設計與去AI味/SKILL.md \
            '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          git diff --cached --check
          printf '%s\n' \
            '.agents/skills/engineering/UI設計與去AI味/SKILL.md' \
            'fold_designer_bridge.py' \
            'tests/test_corner_registry_chinese_presentation.py' \
            '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' \
            | sort > /tmp/expected-files
          git -c core.quotePath=false diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Capture protected hashes
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Run clean focused acceptance
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -s tests/test_corner_registry_chinese_presentation.py
      - name: Verify protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          git diff --check
      - name: Commit and push clean candidate
        env:
          CLEAN: fix/corner-db-chinese-clean-20260917
        run: |
          set -euo pipefail
          git config user.name 'WHD QA'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: enforce Chinese-only corner registry presentation'
          git push origin HEAD:"$CLEAN"
