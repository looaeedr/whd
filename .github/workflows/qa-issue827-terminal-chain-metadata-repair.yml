name: "WHD｜#827｜Terminal chain-metadata repair QA"
run-name: "WHD｜#827｜RED/GREEN terminal chain-metadata repair"

on:
  push:
    branches:
      - governance/issue827-terminal-chain-metadata-repair-main-20260927

permissions:
  contents: read

jobs:
  focused:
    name: "Focused terminal chain-metadata repair regression"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout #827 branch"
        uses: actions/checkout@v4
      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pytest"
        run: python -m pip install pytest
      - name: "Run focused #827 regression without repository GUI conftest"
        run: >-
          python -m pytest -q
          --confcutdir=tests/process
          tests/process/test_issue827_terminal_chain_metadata_repair.py
