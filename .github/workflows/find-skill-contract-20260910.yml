name: Find Skill Contract 2026-09-10

on:
  push:
    branches:
      - feat/add-find-skill-20260910

permissions:
  contents: read

jobs:
  find-skill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "新增找技能 Skill；依使用者提供來源建立可搜尋、評估、推薦與經同意後安裝外部技能的 capability-adaptive workflow" \
            --changed-file ".agents/skills/productivity/找技能/SKILL.md" \
            --changed-file ".agents/skills/productivity/README.md" \
            --changed-file ".agents/skills/skill_registry.json" \
            --changed-file "個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md" \
            --changed-file "release_required_artifacts.json" \
            --changed-file "tests/test_find_skill_contract.py" \
            --evidence "docs/superpowers/verification/2026-09-10-find-skill-preflight.md"
      - name: Find skill contract
        run: python -m pytest -q tests/test_find_skill_contract.py
