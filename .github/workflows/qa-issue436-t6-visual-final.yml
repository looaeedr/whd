name: "QA #436 T6 visual final"

on:
  push:
    branches:
      - qa/issue436-t6-cumulative-acceptance-20260920
    paths:
      - '.github/workflows/qa-issue436-t6-visual-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_SHA: 50e14c7054916cb0b9597c61194725939c5de323
  CANDIDATE_SHA: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
  PRIOR_FINALIZER_RUN: 35505517389
  TARGET_BRANCH: cleanup/2d-3d-sync

jobs:
  prior-gates:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify prior non-visual finalizer gates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_FINALIZER_RUN/jobs?per_page=100" \
            > /tmp/jobs.json
          python - <<'PY'
          import json
          jobs=json.load(open("/tmp/jobs.json"))["jobs"]
          status={j["name"]:(j["status"],j["conclusion"]) for j in jobs}
          required={"source-scope","focused-final","reused-full-classifier","migrated-contract","target-drift"}
          missing=required-set(status)
          assert not missing, missing
          bad={k:status[k] for k in required if status[k] != ("completed","success")}
          assert not bad, bad
          print("PRIOR_NON_VISUAL_GATES=GREEN")
          PY

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk scrot fonts-noto-cjk
          python -m pip install -r requirements.txt matplotlib numpy shapely ezdxf
      - name: Capture final three-mode visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue436/final-visual
          xvfb-run -a -s "-screen 0 1280x900x24" python - <<'PY'
          import json, subprocess, tkinter as tk
          from pathlib import Path
          import fold_designer_bridge as bridge

          out=Path(".scratch/issue436/final-visual")
          snapshot={"model":"金庫型","w":500,"h":600,"d":200,
                    "existing_parts":["box_body","head","tail"],"active_part":"box_body",
                    "settings":{"t":2.0,"fw":24.0}}
          root=tk.Tk()
          root.geometry("1200x850+0+0")
          app=bridge.Phase6FoldDesignerApp(root,snapshot)

          def pump(n=4):
              for _ in range(n):
                  root.update_idletasks()
                  root.update()

          def box(w):
              return [
                  int(w.winfo_rootx()-root.winfo_rootx()),
                  int(w.winfo_rooty()-root.winfo_rooty()),
                  int(w.winfo_width()),
                  int(w.winfo_height()),
              ]

          pump(4)
          metrics={}

          def capture(name, action, expected):
              action()
              pump(4)
              host=app.shared_content_host
              surfaces=[
                  app.fold_editor_host,
                  app.assembly_parts_panel,
                  getattr(app,"corner_data_panel",None),
              ]
              mapped=[w for w in surfaces if w is not None and w.winfo_manager()]
              assert len(mapped)==1, (name,[str(w) for w in mapped])
              active=expected()
              assert active is not None
              assert mapped[0] is active, (name,str(mapped[0]),str(active))
              assert active.master is host
              hb=box(host)
              ab=box(active)
              assert all(abs(a-b)<=2 for a,b in zip(hb,ab)), (name,hb,ab)
              metrics[name]={
                  "host_bbox":hb,
                  "active_bbox":ab,
                  "mapped_surface_count":1,
                  "display_mode":str(app._phase6_3d_display_mode),
                  "active_part":str(app.designer_workspace.active_part),
              }
              subprocess.run(["scrot",str(out/f"{name}.png")],check=True)

          capture("part",lambda:app.activate_part("head"),lambda:app.fold_editor_host)
          capture("assembly",lambda:bridge._phase6_show_assembly(app),lambda:app.assembly_parts_panel)
          capture(
              "corner_data",
              lambda:bridge._phase6_show_corner_data(app),
              lambda:getattr(app,"corner_data_panel",None),
          )

          boxes=[metrics[k]["host_bbox"] for k in ("part","assembly","corner_data")]
          assert boxes[0]==boxes[1]==boxes[2], boxes
          (out/"metrics.json").write_text(
              json.dumps(metrics,indent=2,ensure_ascii=False)+"\n"
          )
          print("VISUAL_SCREENSHOT_COUNT=3")
          print("SHARED_HOST_BBOX_PARITY=1")
          print("ACTIVE_SHARED_CONTENT_MODE_COUNT=1")
          root.destroy()
          PY
          test -s .scratch/issue436/final-visual/part.png
          test -s .scratch/issue436/final-visual/assembly.png
          test -s .scratch/issue436/final-visual/corner_data.png
      - uses: actions/upload-artifact@v4
        with:
          name: issue436-final-visual
          path: .scratch/issue436/final-visual
          if-no-files-found: error

  target-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-read production target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$CANDIDATE_SHA"
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$BASELINE_SHA"
          echo "TARGET_READBACK=$actual"
          echo "TARGET_DRIFT=0"
          echo "CANDIDATE_FAST_FORWARDABLE=1"
          echo "FORCE_PUSH=0"

  accepted:
    needs: [prior-gates, visual, target-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue436-remediated-full-ab
          path: .scratch/issue436/final/full
          run-id: 35505517389
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: issue436-final-visual
          path: .scratch/issue436/final/visual
      - name: Emit final T6 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          full=json.loads(Path(".scratch/issue436/final/full/full-ab-classification.json").read_text())
          visual=json.loads(Path(".scratch/issue436/final/visual/metrics.json").read_text())
          for key in ("NEW_HEADLESS","NEW_XVFB","NEW_HEADLESS_ERRORS","NEW_XVFB_ERRORS"):
              assert full[key]==[], (key,full[key])
          assert len(visual)==3
          out={
              "schema":"WHD_ISSUE436_T6_FINAL_ACCEPTANCE_V1",
              "baseline_sha":"50e14c7054916cb0b9597c61194725939c5de323",
              "production_candidate_sha":"e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea",
              "source_full_run_id":35504038682,
              "remediation_run_id":35505517389,
              "decision":"GREEN",
              "full_ab":full,
              "visual_metrics":visual,
          }
          p=Path(".scratch/issue436/final")
          (p/"acceptance.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          for line in (
              "SHARED_CONTENT_HOST_COUNT=1",
              "ACTIVE_SHARED_CONTENT_MODE_COUNT=1",
              "SEPARATE_ASSEMBLY_REGION=0",
              "SEPARATE_CORNER_DATA_REGION=0",
              "PERMANENT_HIDDEN_SECOND_HOST=0",
              "DUPLICATE_WIDGET_TREE=0",
              "DUPLICATE_EVENT_BINDING=0",
              "NEW_HEADLESS=[]",
              "NEW_XVFB=[]",
              "NEW_HEADLESS_ERRORS=[]",
              "NEW_XVFB_ERRORS=[]",
              "GEOMETRY_DRIFT=0",
              "DATAFLOW_DRIFT=0",
              "PERSISTENCE_DRIFT=0",
              "CALLBACK_SEMANTIC_DRIFT=0",
              "VISIBILITY_SEMANTIC_DRIFT=0",
              "CORNER_DATA_BEHAVIOR_DRIFT=0",
              "PROTECTED_DRIFT=0",
              "DECISION=GREEN",
              "FORCE_PUSH=0",
          ):
              print(line)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue436-t6-final-acceptance
          path: .scratch/issue436/final
          if-no-files-found: error
