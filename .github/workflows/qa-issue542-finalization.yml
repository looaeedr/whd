name: 工單542 可執行收尾驗證
run-name: "工單 #542 B6-2｜可執行收尾證明｜${{ github.sha }}"

on:
  push:
    branches:
      - qa/issue542-finalization-20260923
    paths:
      - .github/workflows/qa-issue542-finalization.yml

permissions:
  contents: read

jobs:
  finalization:
    name: 驗證 #542 canonical checkpoint 與收尾證明
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出收尾分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取得 coordination checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
          git show origin/coord/dispatch-claims:.dispatch/checkpoints/issue-542.json > /tmp/issue-542.json

      - name: 授權可執行收尾
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller authorize-finalization             /tmp/issue-542.json             --issue 542             --branch work/issue520-phase6-bridge-residual-reduction-20260923             --head-sha 90bce030feed775fc852d9bd8f8ef21482471a4a             --proof-out /tmp/issue-542.finalization-proof.json

      - name: 驗證收尾證明
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller verify-finalization-proof             /tmp/issue-542.json             /tmp/issue-542.finalization-proof.json             --issue 542             --branch work/issue520-phase6-bridge-residual-reduction-20260923             --head-sha 90bce030feed775fc852d9bd8f8ef21482471a4a
          sha256sum /tmp/issue-542.finalization-proof.json
          cp /tmp/issue-542.finalization-proof.json issue-542.finalization-proof.json

      - name: 上傳收尾證明
        uses: actions/upload-artifact@v4
        with:
          name: issue542-finalization-proof
          path: issue-542.finalization-proof.json
          if-no-files-found: error
          retention-days: 14

# replacement after checkpoint schema fix
