name: Issue162 viewport RED
on:
  push:
    branches:
      - fix/issue162-unfold-viewport-20260912
    paths:
      - tests/test_issue162_unfold_viewport.py
      - .github/workflows/issue162-red-20260912.yml
      - fold_designer_bridge.py
      - gui.py
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Run #162 RED
        run: xvfb-run -a pytest -q -s tests/test_issue162_unfold_viewport.py
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
