# diagnostic-revision: 2
name: Issue 467 T1 Review GREEN

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue467-t1-review-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest -r requirements.txt
      - name: Run T1 review-gap acceptance
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_issue467_t1_legal_contact.py \
            tests/test_issue465_t0_physical_mating_region.py \
            tests/test_phase6_t05_box_body_dividers.py \
            tests/test_phase6_t16_receiving_placement.py \
            tests/test_joint_local_collision_classifier.py
