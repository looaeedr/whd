name: Issue63 Exact Regression RED
on:
  push:
    branches: [fix/receiving-multipart-divider-geometry]
    paths:
      - fold_designer_bridge.py
      - ae_engine/box_body_structure.py
      - phase6_box_body_structure.py
      - ae_engine/manufacturing_api.py
      - ae_engine/assembly_collision.py
      - ae_engine/divider_manufacturing.py
      - tests/test_issue63_regression_red.py
      - .github/workflows/issue63-red.yml
  workflow_dispatch:
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Run exact issue63 RED
        shell: bash
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          set +e
          xvfb-run -a python -m pytest -q -s tests/test_issue63_regression_red.py
          rc=$?
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "CONFIG_BEFORE=$before"
          echo "CONFIG_AFTER=$after"
          test "$before" = "$after" || exit 97
          exit "$rc"
