name: "QA #440 assembly height final acceptance"

on:
  push:
    branches:
      - fix/issue440-assembly-content-height-20260920
    paths:
      - '.github/workflows/qa-issue440-assembly-height-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 2b9aeccee2c91446ca02cbfe9fdcefee587ba29e
  TESTED_SHA: 4b54df93444ac87f0dff663655fd4dc9cd422a65

jobs:
  protected:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b54df93444ac87f0dff663655fd4dc9cd422a65
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest matplotlib numpy shapely ezdxf
      - name: Protected regression set
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py             tests/test_resolved_manufacturing_export.py             tests/test_resolved_manufacturing_geometry.py             tests/test_issue41_persistence_parity.py             tests/test_issue119_corner_data_transition_ui.py             tests/test_issue376_assembly_collapsible_data.py             --tb=short
          after="$(sha256sum config.ini | awk '{print $1}')"
          test "$before" = "$after"
          echo "GEOMETRY_DRIFT=0"
          echo "DATAFLOW_DRIFT=0"
          echo "PERSISTENCE_DRIFT=0"
          echo "CALLBACK_SEMANTIC_DRIFT=0"
          echo "CONFIG_INVARIANT=1"

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b54df93444ac87f0dff663655fd4dc9cd422a65
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk scrot fonts-noto-cjk
          python -m pip install -r requirements.txt matplotlib numpy shapely ezdxf
      - name: Capture Assembly-height screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue440-height/visual
          xvfb-run -a -s '-screen 0 1280x900x24' python - <<'PY'
          import json, subprocess, tkinter as tk
          from pathlib import Path
          import fold_designer_bridge as bridge
          out=Path(".scratch/issue440-height/visual")
          snapshot={
              "model":"金庫型","w":500,"h":600,"d":200,
              "existing_parts":["box_body","head","tail","door","base_plate"],
              "active_part":"box_body","settings":{"t":2.0,"fw":24.0},
          }
          root=tk.Tk(); root.geometry("1200x850+0+0")
          app=bridge.Phase6FoldDesignerApp(root,snapshot)
          def pump(n=6):
              for _ in range(n): root.update_idletasks(); root.update()
          def bbox(widget):
              return [int(widget.winfo_rootx()-root.winfo_rootx()),int(widget.winfo_rooty()-root.winfo_rooty()),int(widget.winfo_width()),int(widget.winfo_height())]
          pump()
          assert app.shared_content_host is app.left
          assert app.fold_editor_host is app.input_content_host
          assert not hasattr(app,"_phase6_physical_content_height")
          metrics={}
          def capture(name, action, expected):
              action(); pump()
              surfaces=[app.input_content_host,app.assembly_parts_panel,getattr(app,"corner_data_panel",None)]
              mapped=[w for w in surfaces if w is not None and w.winfo_manager()]
              active=expected()
              assert mapped == [active], (name,[str(w) for w in mapped])
              metrics[name]={"active_bbox":bbox(active),"mapped_surface_count":len(mapped)}
              subprocess.run(["scrot",str(out/(name+".png"))],check=True)
          capture("part",lambda:app.activate_part("head"),lambda:app.input_content_host)
          capture("assembly",lambda:bridge._phase6_show_assembly(app),lambda:app.assembly_parts_panel)
          owner=app._phase6_assembly_panel_owner
          content_req=int(owner.content.winfo_reqheight())
          canvas_req=int(owner.canvas.winfo_reqheight())
          host_h=int(owner.host.winfo_height())
          host_req=int(owner.host.winfo_reqheight())
          assert content_req >= 100, content_req
          assert canvas_req == content_req, (canvas_req,content_req)
          assert host_h >= content_req, (host_h,content_req)
          assert host_req >= content_req, (host_req,content_req)
          assert host_h > 44, host_h
          capture("corner_data",lambda:bridge._phase6_show_corner_data(app),lambda:app.corner_data_panel)
          boxes=[metrics[k]["active_bbox"] for k in ("part","assembly","corner_data")]
          anchors=[(b[0],b[1],b[2]) for b in boxes]
          assert anchors[0] == anchors[1] == anchors[2], boxes
          metrics["assembly_content_reqheight"]=content_req
          metrics["assembly_canvas_reqheight"]=canvas_req
          metrics["assembly_host_height"]=host_h
          metrics["assembly_host_reqheight"]=host_req
          (out/"metrics.json").write_text(json.dumps(metrics,indent=2,ensure_ascii=False)+"\n")
          print("MODE_BBOXES="+repr(boxes))
          print(f"ASSEMBLY_CONTENT_REQHEIGHT={content_req}")
          print(f"ASSEMBLY_CANVAS_REQHEIGHT={canvas_req}")
          print(f"ASSEMBLY_SURFACE_HEIGHT={host_h}")
          print("ASSEMBLY_SURFACE_COLLAPSED_44=0")
          print("ASSEMBLY_SURFACE_FOLLOWS_CONTENT_HEIGHT=1")
          print("EXTRA_CONTENT_WRAPPER_FRAME_COUNT=0")
          print("FIXED_OUTER_CONTENT_EXTENT=0")
          print("ACTIVE_MODE_SURFACE_COUNT=1")
          print("SAME_SLOT_ANCHOR_WIDTH_PARITY=1")
          print("VISUAL_SCREENSHOT_COUNT=3")
          root.destroy()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue440-assembly-height-visual
          path: .scratch/issue440-height/visual

  target-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$BASELINE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TESTED_SHA"
          echo "TARGET_DRIFT=0"
          echo "CANDIDATE_FAST_FORWARDABLE=1"
          echo "FORCE_PUSH=0"

  accepted:
    needs: [protected, visual, target-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Final acceptance
        run: |
          echo "ASSEMBLY_SURFACE_COLLAPSED_44=0"
          echo "ASSEMBLY_SURFACE_FOLLOWS_CONTENT_HEIGHT=1"
          echo "EXTRA_CONTENT_WRAPPER_FRAME_COUNT=0"
          echo "FIXED_OUTER_CONTENT_EXTENT=0"
          echo "ACTIVE_MODE_SURFACE_COUNT=1"
          echo "SAME_LAYOUT_SLOT=1"
          echo "GEOMETRY_DRIFT=0"
          echo "PERSISTENCE_DRIFT=0"
          echo "CALLBACK_SEMANTIC_DRIFT=0"
          echo "DECISION=GREEN"
          echo "FORCE_PUSH=0"
