name: WHD｜#591｜#578 聊天室接手實證
run-name: "WHD｜#591｜#578 takeover proof｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue591-live-issue578-takeover-proof-20260924

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  proof:
    name: "#578｜stale chat→chat machine proof"
    runs-on: ubuntu-latest
    steps:
      - name: 取出 #591 proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh-read #578 durable authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin coord/dispatch-claims
          COORD_SHA="$(git rev-parse FETCH_HEAD)"
          CLAIM_PATH=".dispatch/claims/issue-578.json"
          CLAIM_BLOB="$(git rev-parse "${COORD_SHA}:${CLAIM_PATH}")"
          git show "${COORD_SHA}:${CLAIM_PATH}" > /tmp/claim578.json

          git fetch --no-tags origin governance/issue578-scheduler-runtime-liveness-20260924
          LIVE_HEAD="$(git rev-parse FETCH_HEAD)"
          test "$LIVE_HEAD" = "b8766048aaed79405f7e54e28bcf0eb736aa4012"
          LIVE_COMMIT_AT="$(git show -s --format=%cI FETCH_HEAD)"

          gh api "/repos/${REPO}/issues/comments/5807907761" > /tmp/user-authority.json
          gh api "/repos/${REPO}/actions/runs/35951451111" > /tmp/run-full.json
          python - <<'PY'
          import json
          src=json.load(open('/tmp/run-full.json', encoding='utf-8'))
          out={
              'found': True,
              'run_id': src['id'],
              'head_sha': src['head_sha'],
              'status': src['status'],
              'conclusion': src['conclusion'],
              'updated_at': src['updated_at'],
          }
          json.dump(out, open('/tmp/remote-run.json','w',encoding='utf-8'), indent=2, sort_keys=True)
          PY

          printf '%s' "$CLAIM_BLOB" > /tmp/claim-blob.txt
          printf '%s' "$LIVE_HEAD" > /tmp/live-head.txt
          printf '%s' "$LIVE_COMMIT_AT" > /tmp/live-commit-at.txt

      - name: Run canonical stale evaluator
        shell: bash
        run: |
          set -euo pipefail
          python tools/stale_claim_takeover.py \
            --claim /tmp/claim578.json \
            --live-head-sha "$(cat /tmp/live-head.txt)" \
            --live-head-committed-at "$(cat /tmp/live-commit-at.txt)" \
            --remote-run-json /tmp/remote-run.json \
            --claim-blob-sha "$(cat /tmp/claim-blob.txt)" \
            --requesting-worker chatgpt.sol260924.issue578.recovery \
            --requesting-executor-source chat \
            --user-authority-json /tmp/user-authority.json \
            --stale-after-seconds 600 \
            --require-actionable \
            --decision-out /tmp/takeover-decision.json

      - name: Run canonical execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim /tmp/claim578.json \
            --issue 578 \
            --worker chatgpt.sol260924.issue578 \
            --branch governance/issue578-scheduler-runtime-liveness-20260924 \
            --action claim-takeover \
            --base-sha 4e24cd4ab36ccf32c12df3c8d20ea27b9e68f2a0 \
            --head-sha "$(cat /tmp/live-head.txt)" \
            --takeover-evidence /tmp/takeover-decision.json \
            --user-authority-evidence /tmp/user-authority.json

      - name: Emit proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          PROOF_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          decision=json.load(open('/tmp/takeover-decision.json', encoding='utf-8'))
          authority=json.load(open('/tmp/user-authority.json', encoding='utf-8'))
          manifest={
              'schema':'WHD_USER_DIRECTED_LIVE_TAKEOVER_PROOF_V1',
              'issue':578,
              'previous_worker':'chatgpt.sol260924.issue578',
              'requesting_worker':'chatgpt.sol260924.issue578.recovery',
              'claim_blob_sha':open('/tmp/claim-blob.txt').read().strip(),
              'observed_live_head_sha':open('/tmp/live-head.txt').read().strip(),
              'authority_comment_id':authority['id'],
              'classification':decision['classification'],
              'actionable':decision['actionable'],
              'stale_seconds':decision['stale_seconds'],
              'exact_remote_run_id':35951451111,
              'proof_run_id':int(os.environ['RUN_ID']),
              'proof_head_sha':os.environ['PROOF_HEAD'],
              'claim_guard_result':'EXECUTION_CLAIM_GUARD_GREEN',
          }
          json.dump(manifest,open('/tmp/proof-manifest.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          print('WHD_USER_DIRECTED_LIVE_TAKEOVER_PROOF_GREEN')
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Upload exact proof
        uses: actions/upload-artifact@v4
        with:
          name: issue591-live-issue578-takeover-proof-${{ github.run_id }}
          path: |
            /tmp/claim578.json
            /tmp/claim-blob.txt
            /tmp/live-head.txt
            /tmp/live-commit-at.txt
            /tmp/user-authority.json
            /tmp/remote-run.json
            /tmp/takeover-decision.json
            /tmp/proof-manifest.json
          if-no-files-found: error
          retention-days: 30
