name: 工單544 B6-4 GREEN 驗收
run-name: "工單 #544 B6-4｜Facade 12-key GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue544-b6-4-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B6-4 Facade migration 驗收
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Headless facade / Settings / manufacturing contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue544_b6_4_facade_batch.py             tests/test_issue524_a3_facade_ratchet.py             tests/test_phase6_settings_panel_ownership.py             tests/test_issue445_settings_presentation_owner.py             tests/test_issue498_settings_application_coordinator.py             tests/test_phase6_diagnostics_ownership.py             | tee /tmp/issue544-b6-4-headless.log
          grep -E '[0-9]+ passed' /tmp/issue544-b6-4-headless.log | tail -1

      - name: Xvfb corner parameter direct-owner compatibility
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_corner_parameter_lock.py             tests/test_corner_type_phase6_integration.py             | tee /tmp/issue544-b6-4-xvfb.log
          grep -E '[0-9]+ passed' /tmp/issue544-b6-4-xvfb.log | tail -1

      - name: Architecture / facade count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue544-b6-4-architecture.log
          import ast
          from pathlib import Path

          bridge = Path("fold_designer_bridge.py")
          source = bridge.read_text(encoding="utf-8")
          tree = ast.parse(source)
          call = next(
              n for n in ast.walk(tree)
              if isinstance(n, ast.Call)
              and isinstance(n.func, ast.Name)
              and n.func.id == "install_fold_designer_bridge_facade"
          )
          mapping = next(arg for arg in call.args if isinstance(arg, ast.Dict))
          bindings = {
              k.value: ast.unparse(v)
              for k, v in zip(mapping.keys, mapping.values)
              if isinstance(k, ast.Constant) and isinstance(k.value, str)
          }

          removed = {
              "toggle_advanced_settings",
              "_phase6_corner_parameters_unlocked",
          }
          retained = {
              "save_current_settings_as_defaults",
              "flush_pending_settings",
              "_phase6_publish_live_state",
              "_phase6_resolve_manufacturing_geometry",
              "apply_external_settings",
              "apply_external_model",
              "apply_external_sync",
              "_phase6_refresh_corner_data_unfold_view",
              "on_ui_text_size_changed",
              "apply_external_corner_state",
          }
          assert removed.isdisjoint(bindings)
          assert retained <= set(bindings)
          assert len(bindings) == 60, len(bindings)

          test_source = Path("tests/test_corner_parameter_lock.py").read_text(encoding="utf-8")
          assert 'designer._phase6_corner_parameters_unlocked(' not in test_source
          assert 'loaded._phase6_corner_parameters_unlocked(' not in test_source
          assert 'bridge._phase6_corner_parameters_unlocked(' in test_source

          definitions = {
              n.name for n in tree.body if isinstance(n, ast.FunctionDef)
          }
          assert "_phase6_corner_parameters_unlocked" in definitions
          assert "_phase6_settings_panel_toggle_advanced" in definitions

          print("B6_4_ACCOUNTED=12")
          print("B6_4_UNCLASSIFIED=0")
          print("B6_4_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_4_REMOVED=2")
          print("B6_4_DIRECT_OWNER_MIGRATED=1")
          print("FACADE_COUNT=60")
          print("ISSUE544_B6_4_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue544-b6-4-green
          path: |
            /tmp/issue544-b6-4-headless.log
            /tmp/issue544-b6-4-xvfb.log
            /tmp/issue544-b6-4-architecture.log
          if-no-files-found: error
          retention-days: 14
