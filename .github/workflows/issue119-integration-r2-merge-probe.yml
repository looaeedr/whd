name: Issue119 R2 Merge Probe

on:
  push:
    branches:
      - fix/issue119-integration-latest-20260912-r2
    paths:
      - .github/workflows/issue119-integration-r2-merge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe merge conflicts without writing
        shell: bash
        run: |
          set -u
          git fetch origin fix/issue119-replay-latest-20260912-r1 cleanup/2d-3d-sync
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PROD=$(git rev-parse origin/cleanup/2d-3d-sync)"
          test "$(git rev-parse HEAD^)" = "40620c516ad099911ebd22c928237f81641759f2" || true
          set +e
          git merge --no-commit --no-ff origin/fix/issue119-replay-latest-20260912-r1
          rc=$?
          set -e
          echo "merge_rc=$rc"
          echo '=== unresolved ==='
          git diff --name-only --diff-filter=U || true
          echo '=== status ==='
          git status --short
          echo '=== conflict markers ==='
          for f in $(git diff --name-only --diff-filter=U); do
            echo "--- $f ---"
            grep -n -C 12 -E '^(<<<<<<<|=======|>>>>>>>)' "$f" || true
          done
          git merge --abort || true
          exit 0
