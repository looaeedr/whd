name: "QA #501 T4 Baseline Reset GREEN"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue501-t4-green.yml'

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T4 ownership and transition contracts
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue501_baseline_reset_coordinator.py             tests/test_issue498_settings_application_coordinator.py             tests/test_issue500_settings_profile_projection.py             tests/test_issue366_t2d_family_width_controller.py             tests/test_issue391_settings_transitions.py             tests/test_phase6_baseline_operation_alignment.py             --tb=short

  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T4 factory/baseline parity
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_factory_reset.py             tests/test_phase6_t11_family_preset_switching.py             tests/test_phase6_t06_receiving_fresh_family.py             --tb=short
