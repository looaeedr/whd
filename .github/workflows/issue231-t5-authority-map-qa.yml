name: Issue231 T5 Authority Map QA

on:
  push:
    branches:
      - fix/issue231-t5-authority-map-normalization-20260914
    paths:
      - 'tests/knowledge/test_issue231_authority_map_normalization.py'
      - 'tests/knowledge/test_combined_authority_acceptance_contract.py'
      - 'tests/knowledge/test_current_history_authority_contract.py'
      - '個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md'
      - 'docs/superpowers/verification/combined_authority_guard_matrix_v1.json'
      - 'docs/superpowers/checkpoints/issue231-t5-preflight-evidence.txt'
      - '.github/workflows/issue231-t5-authority-map-qa.yml'

jobs:
  t5-authority-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover changed-file preflight requirements
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T5 normalize canonical authority map permanent process contracts unique current owner" \
            --changed-file tests/knowledge/test_issue231_authority_map_normalization.py \
            --changed-file tests/knowledge/test_combined_authority_acceptance_contract.py \
            --changed-file tests/knowledge/test_current_history_authority_contract.py \
            --changed-file 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md \
            --changed-file docs/superpowers/verification/combined_authority_guard_matrix_v1.json \
            --evidence docs/superpowers/checkpoints/issue231-t5-preflight-evidence.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run T5 normalization and provenance contracts
        run: >-
          python -m pytest
          tests/knowledge/test_issue231_authority_map_normalization.py
          tests/knowledge/test_combined_authority_acceptance_contract.py
          tests/knowledge/test_current_history_authority_contract.py
          -q
      - name: Keep existing authority contract GREEN
        run: python -m pytest tests/knowledge/test_knowledge_authority_contract.py -q
      - name: Keep T0 bootstrap governance GREEN
        run: python -m pytest tests/knowledge/test_knowledge_governance_bootstrap.py -q
      - name: Run complete knowledge contract suite
        run: python -m pytest tests/knowledge -q
