name: DM3 Divider Canonical Relief RED
on:
  push:
    branches:
      - work/dm3-divider-canonical-relief
  workflow_dispatch:
jobs:
  dm3-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -q pytest shapely numpy matplotlib ezdxf
      - name: Run DM3 RED contract
        run: python -m pytest -q tests/test_dm3_divider_canonical_relief_contract.py
