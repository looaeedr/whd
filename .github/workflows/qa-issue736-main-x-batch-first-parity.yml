name: WHD Issue 736 Main X Batch First Parity QA

on:
  push:
    branches:
      - governance/issue736-main-x-batch-first-20260926

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Focused batch-first parity contract
        run: >-
          python -m pytest -q
          tests/process/test_issue736_main_x_batch_first_parity.py
          tests/process/test_issue643_guard_transaction_gate.py
