name: WHD Control Plane Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-default-tombstone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate minimal fail-closed main tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = "MAIN_DEFAULT_BRANCH_FAIL_CLOSED_V2"
          allowed = {
              "README.md",
              "AGENTS.md",
              ".agents/skills/engineering/flow-v2-execution/SKILL.md",
              ".agents/skills/skill_registry.json",
              "個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md",
              "tools/phase6_skill_preflight.py",
              ".github/workflows/whd-control-plane-regression.yml",
              ".github/workflows/whd-governance-mirror-gate.yml",
          }
          actual = {p.as_posix() for p in Path(".").rglob("*") if p.is_file() and ".git" not in p.parts}
          if actual != allowed:
              raise SystemExit(f"MAIN_TOMBSTONE_TREE_MISMATCH missing={sorted(allowed-actual)} extra={sorted(actual-allowed)}")
          for rel in ("README.md","AGENTS.md",".agents/skills/engineering/flow-v2-execution/SKILL.md","個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md"):
              if marker not in Path(rel).read_text(encoding="utf-8"):
                  raise SystemExit(f"MAIN_TOMBSTONE_MARKER_MISSING:{rel}")
          registry = Path(".agents/skills/skill_registry.json").read_text(encoding="utf-8")
          if '"routes": []' not in registry:
              raise SystemExit("MAIN_REGISTRY_NOT_EMPTY")
          PY
