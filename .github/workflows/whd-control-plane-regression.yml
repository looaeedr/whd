      - 'tests/process/test_issue886_flow_v2_entrypoint_cutover.py'

permissions:
  contents: read

jobs:
  focused-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed tree
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run canonical root/CI control-plane regression
        run: python tools/control_plane_regression.py
