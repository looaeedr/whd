name: issue286-turn-exit-gate

on:
  push:
    branches:
      - fix/issue286-closing-turn-exit-gate-20260915

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Changed-files knowledge preflight
        shell: bash
        run: |
          set -o pipefail
          python tools/phase6_skill_preflight.py \
            --task "fix regression continuous execution non-terminal turn exit after remote QA terminal cleanup drift close issue finalization gate Skill update pytest GitHub Actions" \
            --changed-file "tools/continuity_controller.py" \
            --changed-file "tests/process/test_continuity_controller.py" \
            --changed-file "tests/process/test_issue286_turn_exit_bridge_contract.py" \
            --changed-file ".agents/skills/engineering/executable-continuity-controller/SKILL.md" \
            --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md" \
            --changed-file ".agents/skills/engineering/派工/SKILL.md" \
            --changed-file ".agents/skills/engineering/monitoring-remote-qa/SKILL.md" \
            --changed-file ".agents/skills/engineering/issue-closure-gate/SKILL.md" \
            --changed-file "個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md" \
            --changed-file "個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md" \
            --evidence docs/superpowers/checkpoints/issue286-preflight-evidence.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply durable turn-exit bridges
        if: contains(github.event.head_commit.message, '[apply-turn-exit-bridges]')
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def append_once(path_str: str, marker: str, section: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  return
              path.write_text(text.rstrip() + "\n\n" + section.strip() + "\n", encoding="utf-8")

          append_once(
              ".agents/skills/engineering/executable-continuity-controller/SKILL.md",
              "ASSISTANT_TURN_EXIT_GATE_V1",
              r'''
          ## ASSISTANT_TURN_EXIT_GATE_V1

          Workflow finalization 與 assistant turn exit 是兩個不同 machine gate。Canonical executable authority 仍是 `tools/continuity_controller.py`：

          ```python
          from tools.continuity_controller import load_checkpoint, assert_turn_exitable

          checkpoint = load_checkpoint(path)
          assert_turn_exitable(checkpoint)
          ```

          CLI：

          ```bash
          python -m tools.continuity_controller assert-turn-exitable path/to/checkpoint.json
          ```

          Turn-exit state contract：

          - `RUNNING`：**拒絕 turn exit**；立即執行 `next_action`。
          - `WAITING_REMOTE`：**拒絕 turn exit**；維持 exact run/head lock 並 poll。
          - `RECOVERING`：**拒絕 turn exit**；沿 evidence → root cause → fix → retry。
          - `BLOCKED`：允許結束目前 turn，因為它代表真正需要外部 authority/capability；但它仍是 non-terminal，`assert_finalizable` 必須失敗。
          - `TERMINAL_SUCCESS / TERMINAL_FAILURE`：允許 turn exit；是否可宣告 workflow 完成仍由 `assert_finalizable` 與 owning closure gate 判定。

          `assert_turn_exitable` 與 `assert_finalizable` 不得互相取代。前者回答「目前 assistant response 能不能停」，後者回答「workflow/issue 能不能被宣告 terminal」。

          ### Remote-terminal → closing handoff

          Remote run terminal 只解除 `REMOTE_QA_ACTIVE_LOCK`。只要 counts、invariant、cleanup、tested→closing drift、AI writeback 或 issue/Master closure 尚有工作，checkpoint 必須轉成 `RUNNING(next_acceptance_action)`；此時 `ASSISTANT_TURN_EXIT_GATE_V1` 立即接手，禁止在「QA PASS／code integrated／process incomplete」等進度回報後結束 turn。

          `tests/process/test_continuity_controller.py` 是 turn-exit machine behavior authority；它必須保留 `WAITING_REMOTE → RUNNING(cleanup)` 後 turn exit 被拒絕的 regression。`tests/process/test_issue286_turn_exit_bridge_contract.py` 只保護各入口 Skill/踩坑 bridge 不漂移，不能取代 behavior test。
          ''',
          )

          append_once(
              ".agents/skills/engineering/執行開發任務/SKILL.md",
              "GLOBAL_TURN_EXIT_GATE_BRIDGE",
              r'''
          ## GLOBAL_TURN_EXIT_GATE_BRIDGE

          所有長流程的 user-visible response boundary 必須 bridge 到 `executable-continuity-controller::ASSISTANT_TURN_EXIT_GATE_V1`。在準備結束 assistant turn 前，先載入 owning durable checkpoint 並執行 `assert_turn_exitable`／`assert-turn-exitable`。

          - `RUNNING / WAITING_REMOTE / RECOVERING` 被 machine guard 拒絕時，輸出只能是 observation，下一個動作必須立刻執行 checkpoint 的 `next_action`；不得把使用者當 scheduler。
          - `BLOCKED` 才能因真正外部 authority/capability wait 把控制權交回使用者；但它仍不能通過 `assert_finalizable`。
          - Remote QA terminal 後若轉成 `RUNNING(cleanup / invariant / drift / closure)`，remote lock 雖解除，global turn-exit lock 立即接手；PASS 回報不是停工點。
          - `USER_VISIBLE_CHECKPOINT_GATE` 只負責呈現/恢復面，不取代 executable turn-exit gate。
          ''',
          )

          append_once(
              ".agents/skills/engineering/派工/SKILL.md",
              "GLOBAL_TURN_EXIT_GATE_BRIDGE",
              r'''
          ## GLOBAL_TURN_EXIT_GATE_BRIDGE

          `NON_TERMINAL_CONTINUE` 的 machine enforcement 一律委派 `executable-continuity-controller::ASSISTANT_TURN_EXIT_GATE_V1`。任何 progress/CHECKPOINT/QA PASS/code integrated 回報後，只要 owning checkpoint 仍為 `RUNNING / WAITING_REMOTE / RECOVERING`，結束 assistant turn 前必須呼叫 `assert_turn_exitable`；被拒絕就立即執行 `next_action`，不得等待使用者再輸入「繼續／輪／GO」。

          `BLOCKED` 只有既有 `BLOCKED_ALLOWED_REASONS` 類真正外部 authority/capability wait 才能合法 turn-exit；`BLOCKED` 仍不得冒充 workflow COMPLETE。
          ''',
          )

          append_once(
              ".agents/skills/engineering/monitoring-remote-qa/SKILL.md",
              "GLOBAL_TURN_EXIT_AFTER_REMOTE_BRIDGE",
              r'''
          ## GLOBAL_TURN_EXIT_AFTER_REMOTE_BRIDGE

          `REMOTE_QA_ACTIVE_LOCK` 只擁有 remote run 非終態期間的 polling lock；它在 run terminal 時解除，**不代表 assistant turn 因此可結束**。Terminal success 若還有 counts/invariants/cleanup/drift/writeback/closure，先把 durable checkpoint 轉成 `RUNNING(next_acceptance_action)`，再由 `executable-continuity-controller::ASSISTANT_TURN_EXIT_GATE_V1` 接手。

          因此 `remote success → RUNNING(cleanup)` 必須讓 `assert_turn_exitable` fail closed；任何「RUN PASS」進度回報之後直接停止，都屬 closing-lock-gap regression。
          ''',
          )

          append_once(
              ".agents/skills/engineering/issue-closure-gate/SKILL.md",
              "CLOSING_TURN_EXIT_BRIDGE",
              r'''
          ## CLOSING_TURN_EXIT_BRIDGE

          `code integrated, process incomplete` 是精確 observation，不是合法停工點。只要 owning checkpoint 仍是 `RUNNING` 且 `next_action` 為 workflow cleanup、tested→closing drift、close/readback leaf、closing ticket 或 Master，本 Skill 在任何 user-visible response boundary 都必須呼叫 `assert_turn_exitable`；machine guard 拒絕時立即續做 next action。

          只有 genuine `BLOCKED`（需要外部 authority/capability）或 terminal checkpoint 才能合法結束 turn。Workflow 是否真的完成仍另外要求 `assert_finalizable` + 全 issue chain readback；兩個 gate 不得合併。
          ''',
          )

          append_once(
              "個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md",
              "REMOTE_TERMINAL_CLOSING_LOCK_GAP",
              r'''
          ## REMOTE_TERMINAL_CLOSING_LOCK_GAP

          ### 事故模式

          Remote QA 在 `queued / in_progress` 時有 `REMOTE_QA_ACTIVE_LOCK`，所以 30 秒回報後仍會繼續 poll；但 run 一 terminal，remote lock 解除，工作其實通常才進入 counts → invariant → cleanup → tested→closing drift → AI writeback → issue/Master closure。舊流程只有 `assert_finalizable`，沒有 machine-level assistant turn-exit gate，因此最容易在「QA PASS」「code integrated」「process incomplete」回報後結束回合。

          ### 根因與永久修正

          - 根因不是缺少 `NON_TERMINAL_CONTINUE` 文字，而是 enforcement scope 只覆蓋 workflow finalization，沒有覆蓋 assistant turn boundary。
          - Canonical fix 是 `tools/continuity_controller.py::assert_turn_exitable` / CLI `assert-turn-exitable`。
          - `RUNNING / WAITING_REMOTE / RECOVERING` 必須拒絕 turn exit並回傳 exact `next_action`；`BLOCKED` 可 turn-exit 但不可 finalizable；terminal states 可 turn-exit。
          - Remote terminal 後若還有收尾，必須 `WAITING_REMOTE → RUNNING(next_acceptance_action)`，由 global turn-exit gate 無縫接手 remote lock。
          - progress / CHECKPOINT / PASS / integrated / process-incomplete 都只是 observation；只要 machine checkpoint 還有可自主 next action，使用者就不是續跑 scheduler。
          - Behavior authority：`tests/process/test_continuity_controller.py` 的 remote-success → closing-RUNNING regression。入口文字 marker 只作 routing compatibility guard。
          ''',
          )

          append_once(
              "個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md",
              "TURN_EXIT_ENFORCEMENT_V2",
              r'''
          ## TURN_EXIT_ENFORCEMENT_V2

          `assert_finalizable` 只能拒絕「把 non-terminal workflow 宣告完成」，不能單獨拒絕「assistant 在 non-terminal progress 回報後結束目前 turn」。這兩個 boundary 必須分離：

          - workflow/issue completion → `assert_finalizable`；
          - assistant response/turn boundary → `assert_turn_exitable`。

          `RUNNING / WAITING_REMOTE / RECOVERING` 有可自主 next action，因此 turn exit fail closed；`BLOCKED` 代表真正外部 wait，可結束 turn但仍不可 finalizable；terminal states 可通過兩者。特別是 remote run terminal 後，只要 cleanup/drift/closure 未完，必須回 `RUNNING(next_acceptance_action)` 並由 turn-exit guard 接手，不能因 remote lock 解除就回報後停止。

          對應 machine guard：`tools/continuity_controller.py` + `tests/process/test_continuity_controller.py`。Skill/AI marker tests 只保護 bridge 存在，不得再次被誤稱為 runtime enforcement。
          ''',
          )

          contract = Path("tests/process/test_issue286_turn_exit_bridge_contract.py")
          contract.write_text(
              '''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\n\n\ndef _read(path: str) -> str:\n    return (ROOT / path).read_text(encoding="utf-8")\n\n\ndef test_canonical_controller_skill_owns_assistant_turn_exit_gate():\n    text = _read(".agents/skills/engineering/executable-continuity-controller/SKILL.md")\n    assert "ASSISTANT_TURN_EXIT_GATE_V1" in text\n    assert "assert_turn_exitable" in text\n    assert "assert-turn-exitable" in text\n    assert "WAITING_REMOTE → RUNNING(cleanup)" in text\n\n\ndef test_all_long_flow_entry_skills_bridge_to_global_turn_exit_gate():\n    cases = {\n        ".agents/skills/engineering/執行開發任務/SKILL.md": "GLOBAL_TURN_EXIT_GATE_BRIDGE",\n        ".agents/skills/engineering/派工/SKILL.md": "GLOBAL_TURN_EXIT_GATE_BRIDGE",\n        ".agents/skills/engineering/monitoring-remote-qa/SKILL.md": "GLOBAL_TURN_EXIT_AFTER_REMOTE_BRIDGE",\n        ".agents/skills/engineering/issue-closure-gate/SKILL.md": "CLOSING_TURN_EXIT_BRIDGE",\n    }\n    for path, marker in cases.items():\n        text = _read(path)\n        assert marker in text, path\n        assert "assert_turn_exitable" in text, path\n\n\ndef test_closing_lock_gap_is_durable_in_both_continuity_pitfalls():\n    continuous = _read("個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md")\n    controller = _read("個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md")\n    assert "REMOTE_TERMINAL_CLOSING_LOCK_GAP" in continuous\n    assert "assert_turn_exitable" in continuous\n    assert "TURN_EXIT_ENFORCEMENT_V2" in controller\n    assert "assert_turn_exitable" in controller\n''',
              encoding="utf-8",
          )
          PY
      - name: Commit durable turn-exit bridges
        if: contains(github.event.head_commit.message, '[apply-turn-exit-bridges]')
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add \
            .agents/skills/engineering/executable-continuity-controller/SKILL.md \
            .agents/skills/engineering/執行開發任務/SKILL.md \
            .agents/skills/engineering/派工/SKILL.md \
            .agents/skills/engineering/monitoring-remote-qa/SKILL.md \
            .agents/skills/engineering/issue-closure-gate/SKILL.md \
            個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md \
            個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md \
            tests/process/test_issue286_turn_exit_bridge_contract.py
          git commit -m "docs(#286): wire global turn-exit gate through closing flow"
          git push origin HEAD:fix/issue286-closing-turn-exit-gate-20260915
      - name: Run turn-exit regression and bridge contract
        run: |
          python -m pytest -q \
            tests/process/test_continuity_controller.py \
            tests/process/test_issue286_turn_exit_bridge_contract.py
