name: Issue 465 T0 Knowledge Preflight

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue465-t0-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce T0 changed-file Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/issue465-preflight-evidence.txt <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          long-log-context-safe-execution
          executable-continuity-controller
          派工
          執行開發任務
          拆解任務工單
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/09_X第二主分支與獨立工單鏈治理規格.md
          EOF
          sed -i 's/^          //' /tmp/issue465-preflight-evidence.txt
          python tools/phase6_skill_preflight.py \
            --task "T0 physical part assembly placement true-thickness mating region FinalScene DXF acceptance remote QA" \
            --changed-file ae_engine/inner_door_frames.py \
            --changed-file ae_engine/contracts.py \
            --changed-file ae_engine/assembly_geometry.py \
            --changed-file tests/test_issue465_t0_physical_mating_region.py \
            --changed-file .github/workflows/qa-issue465-t0-preflight.yml \
            --evidence /tmp/issue465-preflight-evidence.txt
