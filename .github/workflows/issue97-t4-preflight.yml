name: Issue97 T4 Preflight
on:
  push:
    branches: [feat/issue97-authoritative-unfold-view-adapter-20260910]
    paths:
      - .github/workflows/issue97-t4-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build evidence
        run: |
          cat > /tmp/issue97_evidence.md <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          截角資料入口收斂
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
      - name: T4 changed-file preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task '#92/#97 T4 Existing Authoritative Unfold View Adapter：selected authoritative part identity → existing authoritative render data → View；禁止新 2D solver、3D mesh 反推 2D、重建 geometry/CornerType/CROSS/孔/Fold Profile/FW/material dimensions；Controller/Adapter contract 必須證明沒有第二條 manufacturing calculation path；remote QA' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue97_authoritative_unfold_view_adapter.py \
            --evidence /tmp/issue97_evidence.md
