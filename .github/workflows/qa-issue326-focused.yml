name: Issue 326 Focused Contract QA

on:
  push:
    branches:
      - fix/issue326-preserve-authority-20260917
    paths:
      - 'tests/process/test_issue326_scheduled_wakeup_continuity_contract.py'
      - '.agents/skills/engineering/executable-continuity-controller/SKILL.md'
      - '.agents/skills/engineering/monitoring-remote-qa/SKILL.md'
      - '個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md'
      - '.github/workflows/qa-issue326-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Run issue 326 contract regression
        run: python -m pytest -q tests/process/test_issue326_scheduled_wakeup_continuity_contract.py
