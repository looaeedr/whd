name: Issue 326 Acceptance QA

on:
  push:
    branches:
      - fix/issue326-preserve-authority-20260917
    paths:
      - 'tests/process/test_issue326_scheduled_wakeup_continuity_contract.py'
      - '.agents/skills/engineering/executable-continuity-controller/SKILL.md'
      - '.agents/skills/engineering/monitoring-remote-qa/SKILL.md'
      - '個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md'
      - '.github/workflows/qa-issue326-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: d88d18587be85d2f155fbc62f171cbb8b423b12e
      TESTED_SHA: b00ef5df1be4bc191e227bfe6966f6578193febf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TESTED_SHA^{commit}"
          git checkout --detach "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          echo "TESTED_SHA=$TESTED_SHA"
      - name: Verify issue 326 scope and protected invariants
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotePath false
          git diff --check "$BASE_SHA" "$TESTED_SHA"
          git diff --name-only "$BASE_SHA" "$TESTED_SHA" | sort | tee /tmp/issue326-scope.txt
          expected=$(cat <<'EOF'
          .agents/skills/engineering/executable-continuity-controller/SKILL.md
          .agents/skills/engineering/monitoring-remote-qa/SKILL.md
          .github/workflows/qa-issue326-focused.yml
          .github/workflows/qa-issue326-green-apply.yml
          tests/process/test_issue326_scheduled_wakeup_continuity_contract.py
          個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          EOF
          )
          diff -u <(printf '%s\n' "$expected" | sort) /tmp/issue326-scope.txt
          git diff --exit-code "$BASE_SHA" "$TESTED_SHA" -- config.ini '*.dxf'
          echo 'PROTECTED_CONFIG_BASELINE_INVARIANT=PASS'
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Run issue 326 and inherited continuity contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/process/test_issue326_scheduled_wakeup_continuity_contract.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_finalization_owner_guard.py \
            tests/process/test_issue321_turn_exit_enforcement.py
      - name: Run changed-file knowledge preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/knowledge_governance.py bootstrap \
            --inventory docs/superpowers/verification/knowledge_governance_inventory_v1.json \
            --base "$BASE_SHA" \
            --head "$TESTED_SHA"
      - name: Read back scheduled wake-up markers from tested tree
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'wake-up trigger != execution owner' .agents/skills/engineering/executable-continuity-controller/SKILL.md
          grep -F 'RUN_NOT_CREATED' .agents/skills/engineering/executable-continuity-controller/SKILL.md
          grep -F 'terminal => continue next autonomous step' .agents/skills/engineering/executable-continuity-controller/SKILL.md
          grep -F 'status update != exit' .agents/skills/engineering/executable-continuity-controller/SKILL.md
          grep -F 'checkpoint before forced turn end' .agents/skills/engineering/executable-continuity-controller/SKILL.md
          grep -F 'does not own scheduled wake-up execution' .agents/skills/engineering/monitoring-remote-qa/SKILL.md
          grep -F 'SCHEDULED_WAKEUP_STATUS_ONLY_PITFALL' '個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md'
          echo 'REMOTE_READBACK_MARKERS=PASS'
