name: "QA #338 T5 Contrast Readability"

on:
  push:
    branches:
      - ui/issue338-contrast-readability-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#338)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact contrast RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue338_contrast_readability.py::test_shared_theme_standard_text_contrast_meets_4_5 > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#338 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-source:
    if: ${{ contains(github.event.head_commit.message, 'green(#338)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest matplotlib
      - run: python -m pytest -q tests/test_issue338_contrast_readability.py -k "not effective_ttk and not canvas_finished"

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#338)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: T5 effective-style / Canvas / Matplotlib acceptance
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue338_contrast_readability.py \
            tests/test_issue188_dark_theme_readability.py \
            tests/test_issue337_control_hierarchy.py \
            tests/test_issue336_left_content_switch.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#338)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid protected authority drift
        shell: bash
        run: |
          git diff --name-only f1b83acc75e8c36e59389024f4499a84e3d8e555...HEAD | tee files.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("files.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          exact = {
              "config.ini",
              "phase6_designer_workspace.py",
              "phase6_workspace_controller.py",
              "phase6_project_file.py",
          }
          bad = sorted(p for p in changed if p in exact or p.startswith("基準檔/") or p.startswith("ae_engine/"))
          if bad:
              raise SystemExit(f"#338 protected authority drift: {bad}")
          print("#338 protected drift PASS", sorted(changed))
          PY
