name: issue132-preflight
on:
  push:
    branches:
      - work/issue-132-continuous-execution-rules
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#132 修改技能 durable execution 派工 regression 修正 remote QA"
          --changed-file ".agents/skills/engineering/派工/SKILL.md"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_continuous_execution_durable_contract.py"
          --changed-file "個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md"
          --evidence ".phase6_issue132_continuous_execution_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run #132 contract
        run: python -m pytest tests/process/test_continuous_execution_durable_contract.py -q
