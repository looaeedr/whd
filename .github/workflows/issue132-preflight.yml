name: issue132-preflight
on:
  push:
    branches:
      - work/issue-132-continuous-execution-rules
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#132 修改技能 durable execution 派工 regression 修正 remote QA"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_continuous_execution_durable_contract.py"
          --changed-file "個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md"
          --evidence ".phase6_issue132_continuous_execution_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run #132 focused regression
        run: >-
          python -m pytest -q
          tests/process/test_continuous_execution_durable_contract.py
          tests/process/test_monitoring_remote_qa_turn_boundary_contract.py
          tests/test_dispatching_skill_timeout_contract.py
          tests/test_issue_closure_completion_skill_contract.py
