name: T1 Issue43 Divider Four Segment QA

on:
  push:
    branches:
      - work/43-receiving-divider-four-segment-fw-relief
    paths:
      - "ae_engine/cabinet_types/receiving.py"
      - "ae_engine/cabinet_types/policy.py"
      - "ae_engine/door_dividers.py"
      - "ae_engine/manufacturing_api.py"
      - "fold_designer_bridge.py"
      - "tests/test_issue38_receiving_divider_baseline.py"
      - "tests/test_issue39_divider_relief.py"
      - "tests/test_issue43_receiving_divider_t1.py"
      - ".github/workflows/qa_issue43_t1_divider_four_segment.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest matplotlib
      - name: Skill preflight
        run: |
          cat > /tmp/t1-preflight.md <<'EOF'
          READ_SKILL: phase6-corner-3d-model-integrity
          READ_SKILL: diagnosing-bugs
          READ_SKILL: tdd
          READ_SKILL: monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "修正 bug/regression：受電箱中隔 18/FW/106/17 四段 Fold、live FW、collision relief；remote QA" \
            --changed-file ae_engine/cabinet_types/receiving.py \
            --changed-file ae_engine/cabinet_types/policy.py \
            --changed-file ae_engine/door_dividers.py \
            --changed-file ae_engine/manufacturing_api.py \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue38_receiving_divider_baseline.py \
            --changed-file tests/test_issue39_divider_relief.py \
            --changed-file tests/test_issue43_receiving_divider_t1.py \
            --changed-file .github/workflows/qa_issue43_t1_divider_four_segment.yml \
            --evidence /tmp/t1-preflight.md
      - name: Config invariant before
        run: sha256sum config.ini | tee /tmp/config-before.sha
      - name: Headless T1
        run: |
          python -m pytest -q \
            tests/test_issue43_receiving_divider_t1.py -k "not gui" \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue41_persistence_parity.py::test_t5_serialized_state_reload_rebuilds_identical_divider_final_material_and_abc \
            tests/test_issue41_persistence_parity.py::test_t5_2d_3d_flat_owner_and_dxf_all_consume_same_solved_divider
      - name: Xvfb T1
        run: xvfb-run -a python -m pytest -q tests/test_issue43_receiving_divider_t1.py::test_r2_gui_final_divider_uses_four_segment_collision_relief
      - name: Stale authority scan
        run: |
          ! grep -R --line-number --fixed-string "18.0, 24.0, 29.0, 82.0, 17.0" ae_engine fold_designer_bridge.py
          ! grep -R --line-number --fixed-string "16.0, 20.0, 25.0, 78.0, 15.0" ae_engine fold_designer_bridge.py
      - name: Config invariant after
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config-after.sha
          diff -u /tmp/config-before.sha /tmp/config-after.sha
