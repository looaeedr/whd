name: Issue 125 R2 Latest-Target RED
on:
  push:
    branches: [work/issue-125-inspector-property-panel-20260912-r2]
    paths:
      - tests/test_issue125_inspector_property_panel.py
      - .github/workflows/issue125-r2-red.yml
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Lock exact latest production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync
          TARGET=ed632917fa90bcb381dc2a7d30d9102bef936182
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "$TARGET"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "$TARGET"
          git -c core.quotePath=false diff --name-only "$TARGET"...HEAD
      - name: Install GUI test runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Snapshot invariants
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baselines.before
      - name: Xvfb RED contract
        id: xvfb
        continue-on-error: true
        shell: bash
        run: timeout 300s xvfb-run -a -s '-screen 0 1600x1000x24' python -m pytest -q tests/test_issue125_inspector_property_panel.py
      - name: Require genuine RED and invariant preservation
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baselines.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baselines.before /tmp/baselines.after
          echo "XVFB_OUTCOME=${{ steps.xvfb.outcome }}"
          if [ "${{ steps.xvfb.outcome }}" = success ]; then
            echo 'Latest target is already GREEN; do not implement obsolete Inspector patch.' >&2
            exit 1
          fi
          echo R2_RED_CONFIRMED=1
