name: Governance Single Authority Gate

# NO_SYNC_COMPATIBILITY_V1
# Legacy status-check context retained only because GitHub rulesets still require
# this exact check name. It performs no main/cleanup mirroring, parity, or ancestry.

on:
  pull_request:
    branches:
      - main
      - cleanup/2d-3d-sync
  push:
    branches:
      - main
      - cleanup/2d-3d-sync

permissions:
  contents: read

jobs:
  no-sync-compatibility:
    name: Governance Mirror Hard Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance mirror machinery stays retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/governance/governance_mirror_manifest.json
          test ! -e tools/governance_parity_gate.py
          test ! -e .github/workflows/whd-governance-ancestry-reconcile.yml
          grep -q 'GOVERNANCE_SINGLE_AUTHORITY_V1' .agents/skills/engineering/flow-v2-execution/SKILL.md
          grep -q 'AUTHORITY_CONSISTENCY' .agents/contracts/WHD_CHANGE_TEST_PROFILE_V1.json
          if grep -q 'paired governance PR' AGENTS.md; then
            echo 'legacy paired governance instruction regrew' >&2
            exit 1
          fi
