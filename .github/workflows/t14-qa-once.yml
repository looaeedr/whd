name: T14 QA once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t14_qa_trigger.txt'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib -r requirements.txt
      - name: Compile T14 production
        run: python -m py_compile fold_designer_bridge.py
      - name: Record config SHA
        run: sha256sum config.ini | tee /tmp/config_before
      - name: T14 R11 focused
        run: xvfb-run -a python -m pytest -q tests/test_phase6_t14_box_body_child_sections.py
      - name: R10 physical-piece guards
        run: |
          xvfb-run -a python -m pytest -q             tests/test_phase6_four_regressions.py::test_real_structure_selector_commits_defaults_and_changes_3d_piece_topology             tests/test_phase6_four_regressions.py::test_receiving_structure_selector_is_family_locked_by_model_source_of_truth             tests/test_phase6_receiving_multipart_integration.py::test_receiving_multipart_project_round_trip_preserves_joints_shrinks_features_and_piece_identity
      - name: Verify config unchanged
        run: |
          sha256sum config.ini | tee /tmp/config_after
          diff -u /tmp/config_before /tmp/config_after
