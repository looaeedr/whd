name: Issue180 T7 Knowledge Preflight

on:
  push:
    branches:
      - docs/issue180-t7-current-history-cleanup-20260913
    paths:
      - '.github/workflows/issue180-t7-preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record protected invariants before
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run T7 full changed-file Knowledge Preflight
        shell: bash
        run: |
          cat > /tmp/issue180-evidence.txt <<'EOF'
          派工
          issue-closure-gate
          Python測試實務
          phase6-release-packaging
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task 'T7 派工：清理 current/history authority sediment；README、AI_HANDOFF、AGENTS、handoff、dated API snapshot 與巨型踩坑庫只保留正確 current/reference/historical 角色；remote QA' \
            --changed-file 'README.md' \
            --changed-file 'AI_HANDOFF.md' \
            --changed-file 'AGENTS.md' \
            --changed-file 'handoff/00_AI_HANDOFF_README.md' \
            --changed-file 'handoff/01_ARCHITECTURE.md' \
            --changed-file 'handoff/05_NEXT_STEPS.md' \
            --changed-file '目前主要任務.md' \
            --changed-file 'docs/superpowers/CURRENT_API_INVENTORY_20260818.md' \
            --changed-file 'docs/superpowers/README.md' \
            --changed-file '個人AI檔案庫/第一層_核心檔案/04_全域AI協作規則.md' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md' \
            --changed-file 'tests/knowledge/test_current_history_authority_contract.py' \
            --changed-file '.github/workflows/issue180-t7-preflight.yml' \
            --changed-file '.github/workflows/issue180-t7-qa.yml' \
            --evidence /tmp/issue180-evidence.txt
      - name: Verify protected invariants
        if: always()
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baseline.before /tmp/baseline.after
