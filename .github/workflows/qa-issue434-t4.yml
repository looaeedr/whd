name: "QA #434 T4 Corner Data shared host"

on:
  push:
    branches:
      - refactor/issue434-t4-corner-data-shared-host-20260920
    paths:
      - 'tests/test_issue434_corner_data_shared_host.py'
      - '.github/workflows/qa-issue434-t4.yml'
      - 'docs/superpowers/checkpoints/issue434-t4-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: bbd499786cbebc1b5e68ff032f2591cc308060cd

jobs:
  t4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: Re-run T4 changed-file Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #434 T4 Corner Data mounted into the same shared-content host. Preserve existing Corner Data content, selection, adapter state, authoritative data/render source, callbacks, same Fold Designer drawing area, and legacy-2D retirement boundary. Characterize active/inactive widget-tree count, host ownership, behavior parity, and state-authority uniqueness. GitHub Actions remote QA." \
            --changed-file fold_designer_bridge.py \
            --changed-file phase6_corner_data_view_adapter.py \
            --changed-file tests/test_issue434_corner_data_shared_host.py \
            --changed-file .github/workflows/qa-issue434-t4.yml \
            --changed-file docs/superpowers/checkpoints/issue434-t4-journal.md \
            --changed-file docs/superpowers/checkpoints/issue434-t4-checkpoint.json \
            --evidence docs/superpowers/checkpoints/issue434-t4-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require zero production delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA:fold_designer_bridge.py")" = "$(git rev-parse HEAD:fold_designer_bridge.py)"
          test "$(git rev-parse "$BASE_SHA:phase6_corner_data_view_adapter.py")" = "$(git rev-parse HEAD:phase6_corner_data_view_adapter.py)"
          echo "PRODUCTION_RUNTIME_EDIT=0"

      - name: Run T4 characterization and inherited Corner Data guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue434-t4
          xvfb-run -a python -m pytest -q \
            tests/test_issue434_corner_data_shared_host.py \
            tests/test_issue94_corner_data_navigation_mode.py \
            tests/test_issue95_corner_data_authoritative_parts.py \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue119_corner_data_transition_ui.py \
            --tb=short \
            --json-report \
            --json-report-file=.scratch/issue434-t4/report.json \
            > .scratch/issue434-t4/pytest.log 2>&1
          cat .scratch/issue434-t4/pytest.log
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".scratch/issue434-t4/report.json").read_text(encoding="utf-8"))
          outcomes={row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          failed={n for n,o in outcomes.items() if o=="failed"}
          passed={n for n,o in outcomes.items() if o=="passed"}
          skipped={n for n,o in outcomes.items() if o=="skipped"}
          print("OUTCOMES", outcomes)
          assert not failed, f"T4 failures: {failed}"
          assert len(passed) == len(outcomes), f"expected all Corner Data nodes to pass: {len(passed)}/{len(outcomes)}"
          assert not skipped, f"unexpected skips: {skipped}"
          print("CORNER_DATA_HOST_IS_SHARED_HOST=true")
          print("SEPARATE_CORNER_DATA_REGION=0")
          print("CORNER_DATA_WIDGET_TREE_COUNT_WHEN_ACTIVE=1")
          print("CORNER_DATA_WIDGET_TREE_COUNT_WHEN_INACTIVE=0")
          print("CORNER_DATA_BEHAVIOR_DRIFT=0")
          print("CORNER_DATA_STATE_AUTHORITY_DUPLICATION=0")
          print("T4_ALREADY_GREEN_AFTER_T1=1")
          print(f"T4_CHARACTERIZATION_PASS_COUNT={len(passed)}")
          PY

      - name: Upload T4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue434-t4-characterization
          path: |
            .scratch/issue434-t4/report.json
            .scratch/issue434-t4/pytest.log
            docs/superpowers/checkpoints/issue434-t4-journal.md
            docs/superpowers/checkpoints/issue434-t4-checkpoint.json
