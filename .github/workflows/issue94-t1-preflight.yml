name: Issue94 T1 Preflight
on:
  push:
    branches: [feat/issue94-corner-data-navigation-mode-20260910]
    paths:
      - .github/workflows/issue94-t1-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build evidence
        run: |
          cat > /tmp/issue94_preflight_evidence.md <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          截角資料入口收斂
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: docs/superpowers/specs/2026-09-10-corner-data-2d-entry-convergence-spec.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD截角資料與2D入口收斂規則.md
          EOF
      - name: T1 task preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task '#92/#94 T1 截角資料 Navigation Mode：Fold Designer 組合體與截角資料同層切換；只做 mode skeleton，不搬展圖；不得修改 manufacturing state / existing_parts；destroy recreate 與 StringVar callback 必須 view-only' \
            --evidence /tmp/issue94_preflight_evidence.md
