name: QA issue293 session authority readback

on:
  push:
    branches:
      - refactor/issue293-session-authority-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Verify committed session authority GREEN
        run: python -m py_compile gui.py gui_modules/editors/hole_editor.py && python -m pytest -q tests/test_issue293_t5_session_authority_slice.py
      - name: Verify no writer drift is required
        run: git diff --check && git diff --exit-code -- gui.py gui_modules/editors/hole_editor.py tests/test_issue293_t5_session_authority_slice.py
