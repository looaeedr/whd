name: QA issue293 session authority GREEN

on:
  push:
    branches:
      - refactor/issue293-session-authority-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply session authority seam
        run: python tools/qa_issue293_session_authority_green.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Verify focused GREEN
        run: python -m py_compile gui.py gui_modules/editors/hole_editor.py && python -m pytest -q tests/test_issue293_t5_session_authority_slice.py
      - name: Commit GREEN after verification
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add gui.py gui_modules/editors/hole_editor.py
          git diff --cached --check
          git commit -m "refactor(#293): route editor session authority"
          git push origin HEAD:${GITHUB_REF_NAME}
