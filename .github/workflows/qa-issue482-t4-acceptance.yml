name: Issue 482 T4 Focused Acceptance

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue482-t4-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-six-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact-six durable decision evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/superpowers/checkpoints/issue482-t4-settings-projection-decision.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = [
              "_phase6_settings_box_structure_projection",
              "_phase6_settings_endcap_fw_projection",
              "_phase6_settings_bottom_wrap_projection",
              "_phase6_settings_corner_projection",
              "_phase6_settings_context_extension_projection",
              "_phase6_sync_settings_panel_extension",
          ]
          assert data["decision"] == "KEEP_BRIDGE_COMPATIBILITY"
          assert data["scope"] == expected
          own = data["ownership_assertions"]
          assert own["settings_presentation_owner"] == "phase6_settings_panel.py"
          assert own["settings_transaction_owner_changed"] is False
          assert own["registry_mutation_owner_changed"] is False
          assert own["manufacturing_mutation_owner_changed"] is False
          assert own["assembly_joint_mutation_owner_changed"] is False
          assert own["new_edit_capability"] is False
          assert own["new_settings_owner"] is False
          assert own["facade_binding_delta"] == 0
          print("ISSUE482_EXACT_SIX_DECISION_GREEN")
          PY

  settings-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run settings owner and presentation parity
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_issue445_settings_presentation_owner.py             tests/test_phase6_settings_panel_ownership.py             tests/test_phase6_settings_center.py             tests/test_phase6_settings_center_bridge.py             tests/test_phase6_settings_center_gui_contract.py             tests/test_issue293_t5_context_switch_slice.py             tests/test_issue293_t5_round_settings_slice.py             tests/test_issue293_t5_round_settings_launcher_slice.py             tests/test_issue293_t5_indicator_context_refresh_slice.py             tests/test_phase6_t5_nested_settings_normalization.py             tests/test_right_settings_dedup.py

  owner-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run transaction registry manufacturing and architecture ratchets
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue366_t2a_settings_stage_controller.py             tests/test_issue366_t2c_corner_external_controller.py             tests/test_issue390_settings_contracts.py             tests/test_issue391_settings_transitions.py             tests/test_issue392_settings_service.py             tests/test_phase6_settings_service.py             tests/test_issue368_t4_registry_diagnostics_owner.py             tests/test_issue295_t7_manufacturing_adapter_slice.py             tests/test_issue396_phase4_composition_root.py             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py

  protected-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify no protected source drift during acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          import ast
          from pathlib import Path

          bridge = Path("fold_designer_bridge.py")
          tree = ast.parse(bridge.read_text(encoding="utf-8"))
          calls = [
              n for n in ast.walk(tree)
              if isinstance(n, ast.Call)
              and isinstance(n.func, ast.Name)
              and n.func.id == "install_fold_designer_bridge_facade"
          ]
          assert len(calls) == 1
          mapping = next(arg for arg in calls[0].args if isinstance(arg, ast.Dict))
          assert len(mapping.keys) <= 69

          adapter = Path("gui_modules/application/fold_designer_adapter.py").read_text(encoding="utf-8")
          assert "import fold_designer_bridge" not in adapter
          assert "from fold_designer_bridge import" not in adapter
          assert not Path("gui_modules/application/fold_designer_composition.py").exists()
          print("ISSUE482_G1_G4_GREEN")
          PY
          git diff --exit-code
