name: "QA #504 T7 Phase 5 Combined Acceptance"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue504-t7-combined.yml'

permissions:
  contents: read

jobs:
  headless-ab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout fixed T0 baseline
        uses: actions/checkout@v4
        with:
          ref: ba9cda2e1eed30d4702a2e2e4cebbd001bbf56aa
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt pytest matplotlib ezdxf
      - name: Run fixed-baseline and candidate Headless
        shell: bash
        run: |
          set +e
          (cd baseline && python -m pytest -q --junitxml="$GITHUB_WORKSPACE/baseline-headless.xml") > baseline-headless.log 2>&1
          echo $? > baseline-headless.rc
          (cd candidate && python -m pytest -q --junitxml="$GITHUB_WORKSPACE/candidate-headless.xml") > candidate-headless.log 2>&1
          echo $? > candidate-headless.rc
          set -e
          tail -n 30 baseline-headless.log || true
          tail -n 30 candidate-headless.log || true
      - name: Headless candidate-only classifier
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def failures(path):
              root = ET.parse(path).getroot()
              out = set()
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for suite in root.iter("testsuite"):
                  for key in totals:
                      try:
                          totals[key] += int(suite.attrib.get(key, 0))
                      except ValueError:
                          pass
              for case in root.iter("testcase"):
                  bad = case.find("failure") is not None or case.find("error") is not None
                  if bad:
                      out.add((case.attrib.get("classname", ""), case.attrib.get("name", "")))
              return out, totals

          b, bt = failures("baseline-headless.xml")
          c, ct = failures("candidate-headless.xml")
          diff = sorted(c - b)
          print(f"BASELINE_HEADLESS_TOTALS={bt}")
          print(f"CANDIDATE_HEADLESS_TOTALS={ct}")
          print(f"HEADLESS_CANDIDATE_ONLY_FAILURES={diff}")
          assert diff == [], diff
          PY

  xvfb-ab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout fixed T0 baseline
        uses: actions/checkout@v4
        with:
          ref: ba9cda2e1eed30d4702a2e2e4cebbd001bbf56aa
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt pytest matplotlib ezdxf
      - name: Run fixed-baseline and candidate Xvfb
        shell: bash
        run: |
          set +e
          (cd baseline && xvfb-run -a python -m pytest -q --junitxml="$GITHUB_WORKSPACE/baseline-xvfb.xml") > baseline-xvfb.log 2>&1
          echo $? > baseline-xvfb.rc
          (cd candidate && xvfb-run -a python -m pytest -q --junitxml="$GITHUB_WORKSPACE/candidate-xvfb.xml") > candidate-xvfb.log 2>&1
          echo $? > candidate-xvfb.rc
          set -e
          tail -n 30 baseline-xvfb.log || true
          tail -n 30 candidate-xvfb.log || true
      - name: Xvfb candidate-only classifier
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          def failures(path):
              root = ET.parse(path).getroot()
              out = set()
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for suite in root.iter("testsuite"):
                  for key in totals:
                      try:
                          totals[key] += int(suite.attrib.get(key, 0))
                      except ValueError:
                          pass
              for case in root.iter("testcase"):
                  bad = case.find("failure") is not None or case.find("error") is not None
                  if bad:
                      out.add((case.attrib.get("classname", ""), case.attrib.get("name", "")))
              return out, totals

          b, bt = failures("baseline-xvfb.xml")
          c, ct = failures("candidate-xvfb.xml")
          diff = sorted(c - b)
          print(f"BASELINE_XVFB_TOTALS={bt}")
          print(f"CANDIDATE_XVFB_TOTALS={ct}")
          print(f"XVFB_CANDIDATE_ONLY_FAILURES={diff}")
          assert diff == [], diff
          PY

  architecture-protected:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout fixed T0 baseline
        uses: actions/checkout@v4
        with:
          ref: ba9cda2e1eed30d4702a2e2e4cebbd001bbf56aa
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Architecture and protected-object gates
        run: |
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          root = Path("candidate")
          bridge = (root / "fold_designer_bridge.py").read_text(encoding="utf-8")
          tree = ast.parse(bridge)

          facade = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "install_fold_designer_bridge_facade"
          )
          assert isinstance(facade.args[1], ast.Dict)
          facade_count = len(facade.args[1].keys)
          assert facade_count <= 69, facade_count

          assert not (root / "phase6_workspace_shell.py").exists()
          assert not (root / "phase6_part_editor_session.py").exists()
          for name in (
              "_phase6_rebuild_linked_endcaps",
              "_fix11_activate_part",
              "_fix11_save_current_part",
              "_phase6_settings_box_structure_projection",
              "_phase6_settings_endcap_fw_projection",
              "_phase6_settings_bottom_wrap_projection",
              "_phase6_settings_corner_projection",
              "_phase6_settings_context_extension_projection",
              "_phase6_sync_settings_panel_extension",
          ):
              assert f"def {name}(" in bridge, name

          owner_files = [
              "phase6_settings_center.py",
              "phase6_settings_contracts.py",
              "phase6_settings_transitions.py",
              "phase6_settings_service.py",
              "phase6_settings_transaction_controller.py",
              "phase6_settings_panel.py",
              "phase6_sync_envelope.py",
              "gui_modules/application/fold_designer_adapter.py",
              "gui_modules/application/command_router.py",
              "gui_modules/application/lifecycle.py",
              "phase6_workspace_navigation_controller.py",
              "phase6_derived_part_projection.py",
              "phase6_settings_profile_projection.py",
              "gui_modules/application/fold_designer_settings_coordinator.py",
          ]
          reverse = 0
          for rel in owner_files:
              text = (root / rel).read_text(encoding="utf-8")
              reverse += text.count("import fold_designer_bridge")
              reverse += text.count("from fold_designer_bridge import")
          assert reverse == 0, reverse

          defs = []
          for py in root.rglob("*.py"):
              if ".git" in py.parts:
                  continue
              text = py.read_text(encoding="utf-8", errors="ignore")
              defs += [
                  str(py.relative_to(root))
                  for _ in range(text.count("class Phase6FoldDesignerComposition"))
              ]
          assert len(defs) == 1, defs

          def object_map(repo_dir):
              lines = subprocess.check_output(
                  ["git", "-C", repo_dir, "ls-tree", "-r", "HEAD"],
                  text=True,
              ).splitlines()
              out = {}
              for line in lines:
                  meta, path = line.split("\t", 1)
                  sha = meta.split()[2]
                  if path == "config.ini" or path.lower().endswith(".dxf"):
                      out[path] = sha
              return out

          b = object_map("baseline")
          c = object_map("candidate")
          assert c == b, {"baseline": b, "candidate": c}
          print(f"FACADE_BINDING_COUNT={facade_count}")
          print("PHASE6_REVERSE_IMPORT_BRIDGE_COUNT=0")
          print("SECOND_COMPOSITION_ROOT=0")
          print("CONFIG_DXF_GIT_OBJECT_DELTA=0")
          print("PHASE5_PROTECTED_DECISIONS_GREEN=1")
          PY

  focused-physical-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run Phase 5 focused physical/persistence gates
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_issue498_settings_application_coordinator.py             tests/test_issue499_settings_apply_coordinator.py             tests/test_issue500_settings_profile_projection.py             tests/test_issue503_live_sync_publication_plan.py             tests/test_phase6_sync_envelope.py             tests/test_phase6_live_canonical_sync.py             tests/test_phase6_baseline_operation_alignment.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue445_settings_presentation_owner.py             tests/test_issue480_derived_part_projection_plan.py             tests/test_dm6_save_reload_semantic_determinism.py             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py             tests/test_receiving_door_dxf_roundtrip.py             tests/test_resolved_manufacturing_export.py             tests/test_phase6_2d_3d_round_trip.py             --tb=short
