name: Issue291 T3 Final Acceptance

on:
  push:
    branches:
      - refactor/issue291-gui-phase2-t3-selector-20260916
    paths:
      - '.github/workflows/issue291-t3-final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue291-t3-final-acceptance
  cancel-in-progress: false

jobs:
  headless:
    name: Headless full suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run headless full suite
        run: python -m pytest -q

  xvfb:
    name: Xvfb full suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run Xvfb full suite
        run: xvfb-run -a python -m pytest -q

  protected-drift:
    name: Protected drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected paths against accepted predecessor
        shell: bash
        run: |
          set -euo pipefail
          BASE=f11ab72850d893f5935ad869ab8ae9205fc0cd92
          git cat-file -e "$BASE^{commit}"
          if ! git diff --quiet "$BASE"...HEAD -- config.ini '基準檔/**' 'ae_engine/**' phase6_project_file.py phase6_fold_profiles.py; then
            echo 'Protected-path drift detected:'
            git diff --name-status "$BASE"...HEAD -- config.ini '基準檔/**' 'ae_engine/**' phase6_project_file.py phase6_fold_profiles.py
            exit 1
          fi
          echo 'Protected-path drift: PASS'
