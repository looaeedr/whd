name: Issue292 T4 Endcap Slice

on:
  push:
    branches:
      - refactor/issue292-gui-phase2-t4-panels-20260916
    paths:
      - '.github/workflows/issue292-t4-endcap-slice.yml'
      - 'tests/test_issue292_t4_endcap_slice.py'
      - 'gui.py'
      - 'gui_modules/parts/panels/endcap.py'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile extraction boundary
        run: python -m py_compile gui.py gui_modules/parts/panels/endcap.py
      - name: Run endcap slice characterization
        run: python -m pytest -q tests/test_issue292_t4_endcap_slice.py
