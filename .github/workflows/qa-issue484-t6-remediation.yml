name: Issue 484 T6 Legacy Compatibility Remediation

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue484-t6-remediation.yml'
      - 'gui_modules/application/fold_designer_adapter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run legacy compatibility and FinalScene ownership regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_phase6_assembly_3d_view.py::test_bridge_assembly_bundle_is_backward_compatible_with_legacy_scene_contract             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue370_t6_final_scene_view_owner.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_issue396_phase4_composition_root.py
      - name: Verify compatibility classes are namespace-bound
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("gui_modules/application/fold_designer_adapter.py").read_text(encoding="utf-8")
          assert 'assembly_render_data_cls=required("AssemblySceneRenderData")' in text
          assert 'assembly_part_cls=required("AssemblyScenePart")' in text
          print("ISSUE484_LEGACY_COMPAT_BINDING_GREEN")
          PY
