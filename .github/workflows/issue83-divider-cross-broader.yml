name: Issue83 Divider CROSS Broader Acceptance
on:
  push:
    branches: [fix/issue83-divider-certified-relief]
    paths:
      - ae_engine/**
      - fold_designer_bridge.py
      - phase6_fold_profiles.py
      - tests/test_dm1_divider_physical_contract.py
      - tests/test_dm3_divider_canonical_relief_contract.py
      - tests/test_dm4_divider_resolved_sinks.py
      - tests/test_issue39_divider_relief.py
      - tests/test_issue63_regression_red.py
      - tests/test_issue71_divider_relief_components.py
      - tests/test_issue74_divider_side_front_penetration.py
      - tests/test_issue83_divider_cross_registry.py
      - .github/workflows/issue83-divider-cross-broader.yml

jobs:
  broader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Divider broader guards
        run: |
          pytest -q -s \
            tests/test_dm1_divider_physical_contract.py \
            tests/test_dm3_divider_canonical_relief_contract.py \
            tests/test_dm4_divider_resolved_sinks.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue63_regression_red.py \
            tests/test_issue71_divider_relief_components.py \
            tests/test_issue74_divider_side_front_penetration.py \
            tests/test_issue83_divider_cross_registry.py
      - name: Authority scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          prod = Path("ae_engine/divider_manufacturing.py").read_text(encoding="utf-8")
          data = json.loads(Path("基準檔/截角資料庫/certified_relief_rules.json").read_text(encoding="utf-8"))
          rule = next(r for r in data["rules"] if r["rule_id"] == "RECEIVING_DIVIDER_CROSS_STANDARD_V1")
          assert rule["corner_type"] == "CROSS"
          assert rule["cross_parameters"]["slot_end_selector"] == "OBJECT_MATING_FOLD_SIGN_NEGATIVE"
          assert "slot_end" not in rule["cross_parameters"]
          assert set(("slotted_fold_u", "plain_fold_u", "fold_v", "slot_width", "slot_straight_depth", "slot_radius")) <= set(rule["formula"])
          assert "_divider_object_mating_fold_signs" in prod
          assert "CERTIFIED_REGISTRY_CROSS_PARAMETERS" in prod
          print("ISSUE83_BROADER_AUTHORITY_SCAN=PASS")
          PY
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
