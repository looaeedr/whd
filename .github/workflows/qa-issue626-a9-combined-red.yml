name: "WHD｜#626 A9｜Phase 7 Combined RED"
run-name: "WHD｜#626 A9｜Combined target census RED"

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - 'tests/test_issue626_phase7_combined_acceptance.py'
      - 'docs/superpowers/checkpoints/issue613-a1-dt-p7-*.json'
      - 'docs/superpowers/checkpoints/issue61*-*-target-completion.json'
      - 'docs/superpowers/checkpoints/issue62*-*-target-completion.json'
      - '.github/workflows/qa-issue626-a9-combined-red.yml'

permissions:
  contents: read

jobs:
  combined-red:
    name: "A9｜Combined target census RED"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Install focused test dependency"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: "Require current Phase 7 census to fail closed"
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue626_phase7_combined_acceptance.py --tb=short | tee /tmp/a9-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "PHASE_NOT_COMPLETE" /tmp/a9-red.log
          grep -q "P7-B canonical DT-6 not COMPLETE" /tmp/a9-red.log
          grep -q "P7-C target completion missing" /tmp/a9-red.log
          grep -q "P7-D target completion missing" /tmp/a9-red.log
          grep -q "P7-E target completion missing" /tmp/a9-red.log
          echo "A9_EXPECTED_RED=PHASE_NOT_COMPLETE"
