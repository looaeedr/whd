name: Issue292 T4 Multipart Slice

on:
  push:
    branches:
      - refactor/issue292-multipart-red-20260917
    paths:
      - '.github/workflows/issue292-t4-multipart-slice.yml'
      - 'tests/test_issue292_t4_multipart_slice.py'
      - 'gui.py'
      - 'gui_modules/parts/panels/multipart.py'

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Multipart characterization RED
        run: python -m pytest -q tests/test_issue292_t4_multipart_slice.py
