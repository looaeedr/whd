name: Issue 469 T3 Focused

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue469-t3.yml'
      - 'ae_engine/contracts.py'
      - 'ae_engine/joint_marking_policy.py'
      - 'tests/test_issue469_t3_joint_marking_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest -r requirements.txt
      - name: Run T3 GREEN and T2-T0 regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_issue469_t3_joint_marking_policy.py \
            tests/test_issue468_t2_contact_local_frame.py \
            tests/test_issue467_t1_legal_contact.py \
            tests/test_issue465_t0_physical_mating_region.py
