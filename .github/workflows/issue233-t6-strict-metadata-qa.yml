name: Issue233 T6 Strict Metadata QA

on:
  push:
    branches:
      - fix/issue233-t6-strict-metadata-20260914
    paths:
      - 'tests/knowledge/test_issue233_strict_metadata_migration.py'
      - 'tools/knowledge_governance.py'
      - 'docs/superpowers/CURRENT_API_INVENTORY_20260818.md'
      - '07_Phase6尺寸語意與標準截角母規則.md'
      - '標準基準檔格式.md'
      - 'docs/superpowers/checkpoints/issue233-t6-preflight-evidence.txt'
      - '.github/workflows/issue233-t6-strict-metadata-qa.yml'

jobs:
  t6-strict-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover changed-file preflight requirements
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T6 strict metadata historical mirror migration WHD_DOC_META_V1" \
            --changed-file tests/knowledge/test_issue233_strict_metadata_migration.py \
            --changed-file tools/knowledge_governance.py \
            --changed-file docs/superpowers/CURRENT_API_INVENTORY_20260818.md \
            --changed-file 07_Phase6尺寸語意與標準截角母規則.md \
            --changed-file 標準基準檔格式.md \
            --evidence docs/superpowers/checkpoints/issue233-t6-preflight-evidence.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Summarize frozen T1 classification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p = Path('docs/superpowers/verification/knowledge_authority_classification_v1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = data.get('rows', [])
          print('T1_TARGET_ROLE_COUNTS', dict(Counter(str(r.get('target_role')) for r in rows)))
          blockers = [r for r in rows if r.get('blocker')]
          print('T1_BLOCKER_COUNT', len(blockers))
          for r in blockers:
              print('T1_BLOCKER', r.get('path'), r.get('target_role'), r.get('contract'), r.get('blocker'))
          PY
      - name: Run focused T6 strict metadata RED
        run: python -m pytest tests/knowledge/test_issue233_strict_metadata_migration.py -q -s
      - name: Keep existing bootstrap guard visible
        if: always()
        run: python -m pytest tests/knowledge/test_knowledge_governance_bootstrap.py -q
