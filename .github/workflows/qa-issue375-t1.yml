name: "QA #375 T1 main selector"

on:
  push:
    branches:
      - ui/issue375-main-selector-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue375_main_selector_navigation.py'
      - '.github/workflows/qa-issue375-t1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  T1_BASELINE: a84886958e537f02025abeecb949d9f714f31ed7

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$T1_BASELINE" HEAD)" = "$T1_BASELINE"
          echo "BASELINE=$T1_BASELINE"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install focused harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: Run T1 contract
        run: python -m pytest -q tests/test_issue375_main_selector_navigation.py --tb=short

      - name: Existing selector/navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_issue186_sheetmetal_selector_visibility.py             tests/test_issue124_structure_tree.py             --tb=short
