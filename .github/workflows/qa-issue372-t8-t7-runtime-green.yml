name: "QA #372 T8 T7 runtime remediation GREEN"

on:
  push:
    branches:
      - fix/issue372-t8-t7-runtime-remediation-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'gui_modules/application/command_router.py'
      - 'gui_modules/application/lifecycle.py'
      - '.github/workflows/qa-issue372-t8-t7-runtime-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c HEAD
          echo "REMEDIATION_BASELINE=94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt

      - name: Compile
        run: python -m py_compile fold_designer_bridge.py gui_modules/application/command_router.py

      - name: Project round-trip scheduler compatibility
        run: |
          python -m pytest -q             tests/test_phase6_2d_3d_round_trip.py::test_save_reload_to_3d_to_2d_round_trip             tests/test_issue371_t7_update_runtime_behavior.py

      - name: Real-Tk scheduler teardown
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_designer_workspace.py::test_destroying_designer_cancels_owned_tk_after_callbacks             tests/test_receiving_cabinet_type.py::test_switching_3d_baseline_model_to_receiving_applies_receiving_family_policy

      - name: T7 ownership and Phase2 purity
        run: |
          python -m pytest -q             tests/test_issue371_t7_lifecycle_facade_owner.py             tests/test_phase6_update_executor_conformance.py             tests/test_issue358_remove_manufacturing_callbacks.py             tests/test_issue361_one_line_manufacturing_facade.py
