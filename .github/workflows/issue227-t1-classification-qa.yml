name: Issue227 T1 Classification QA

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - 'tests/knowledge/test_knowledge_authority_classification.py'
      - 'tools/knowledge_governance.py'
      - 'docs/superpowers/verification/knowledge_authority_classification_v1.json'
      - 'docs/superpowers/checkpoints/issue227-t1-preflight-evidence.txt'
      - '.github/workflows/issue227-t1-classification-qa.yml'

jobs:
  t1-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce changed-file preflight requirements
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T1 Authority Classification Conflict Matrix CURRENT REFERENCE MIRROR HISTORICAL dual-current orphan-current unknown-active stale-route" \
            --changed-file tests/knowledge/test_knowledge_authority_classification.py \
            --changed-file tools/knowledge_governance.py \
            --changed-file docs/superpowers/verification/knowledge_authority_classification_v1.json \
            --evidence docs/superpowers/checkpoints/issue227-t1-preflight-evidence.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused T1 classification tests
        run: python -m pytest tests/knowledge/test_knowledge_authority_classification.py -q
      # Triggered after runner-applied implementation because GITHUB_TOKEN pushes do not recurse.
