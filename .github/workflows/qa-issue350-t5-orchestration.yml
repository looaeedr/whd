name: "#350 T5 manufacturing orchestration extraction"

on:
  push:
    branches:
      - refactor/issue350-manufacturing-orchestration-20260918
    paths:
      - 'tests/test_issue350_manufacturing_orchestration_extraction.py'
      - 'phase6_manufacturing_geometry.py'
      - 'fold_designer_bridge.py'
      - '.github/workflows/qa-issue350-t5-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run orchestration extraction contract
        run: python -m pytest -q tests/test_issue350_manufacturing_orchestration_extraction.py
