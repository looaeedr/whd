name: "#347 T2 helper extraction contract"

on:
  push:
    branches:
      - refactor/issue347-manufacturing-helpers-extraction-20260918
    paths:
      - 'tests/test_issue347_manufacturing_helper_extraction.py'
      - 'phase6_manufacturing_geometry.py'
      - 'fold_designer_bridge.py'
      - '.github/workflows/qa-issue347-t2-helper-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T2 extraction contract
        run: python -m pytest -q tests/test_issue347_manufacturing_helper_extraction.py
