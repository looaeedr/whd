name: Issue 524 Facade Consumer Audit

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue524-facade-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact facade consumer audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          import json
          import re
          import subprocess
          from pathlib import Path

          a0 = json.loads(
              Path("docs/superpowers/checkpoints/issue521-a0-residual-ownership-census.json")
              .read_text(encoding="utf-8")
          )
          inventory = list(a0["facade"]["inventory"])
          assert len(inventory) == 69

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [Path(p.decode("utf-8", "surrogateescape")) for p in raw.split(b"\0") if p]

          py_trees = {}
          runtime_text = {}
          for path in paths:
              p = path.as_posix()
              if p.startswith(("docs/", "logs/", ".dispatch/")):
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\x00" in data[:4096]:
                  continue
              try:
                  text = data.decode("utf-8", "surrogateescape")
              except UnicodeDecodeError:
                  continue
              if p.endswith(".py"):
                  try:
                      py_trees[p] = ast.parse(text, filename=p)
                  except SyntaxError:
                      continue
              elif p.endswith((".json", ".toml", ".ini", ".yml", ".yaml")):
                  runtime_text[p] = text

          rows = []
          for item in inventory:
              name = str(item["name"])
              attr_refs = []
              string_refs = []
              for p, tree in py_trees.items():
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Attribute) and node.attr == name:
                          attr_refs.append((p, getattr(node, "lineno", None)))
                      elif isinstance(node, ast.Constant) and node.value == name:
                          string_refs.append((p, getattr(node, "lineno", None)))

              # The facade mapping itself contains one exact string key in bridge.
              bridge_key_removed = False
              filtered_strings = []
              for ref in string_refs:
                  if (
                      not bridge_key_removed
                      and ref[0] == "fold_designer_bridge.py"
                  ):
                      bridge_key_removed = True
                      continue
                  filtered_strings.append(ref)

              text_refs = []
              token = re.compile(rf"(?<![A-Za-z0-9_]){re.escape(name)}(?![A-Za-z0-9_])")
              for p, text in runtime_text.items():
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if token.search(line):
                          text_refs.append((p, lineno))

              property_compat = bool(item.get("property_compat"))
              public_surface = bool(item.get("public_surface"))
              dynamic_refs = filtered_strings + text_refs
              if property_compat:
                  cls = "PROPERTY_COMPAT"
                  reason = "facade property descriptor compatibility surface"
              elif public_surface:
                  cls = "PUBLIC_REQUIRED"
                  reason = "non-private compatibility/public surface; A3 does not delete without explicit migration evidence"
              elif not attr_refs and not dynamic_refs:
                  cls = "NO_CALLER"
                  reason = "no attribute/dynamic/runtime-text consumer in exact tracked tree"
              else:
                  cls = "LEGACY_REQUIRED"
                  reason = "exact tracked-tree attribute/dynamic compatibility consumer exists"

              rows.append({
                  "name": name,
                  "classification": cls,
                  "reason": reason,
                  "attribute_ref_count": len(attr_refs),
                  "dynamic_string_ref_count": len(filtered_strings),
                  "runtime_text_ref_count": len(text_refs),
                  "attribute_refs": attr_refs[:30],
                  "dynamic_string_refs": filtered_strings[:30],
                  "runtime_text_refs": text_refs[:30],
                  "value_expression": item.get("value_expression"),
                  "public_surface": public_surface,
                  "property_compat": property_compat,
              })

          # Diagnostic-only list of very narrow forwarding wrappers.
          bridge_source = Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          bridge_tree = ast.parse(bridge_source, filename="fold_designer_bridge.py")
          simple_returns = []
          for node in bridge_tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              body = list(node.body)
              if body and isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant) and isinstance(body[0].value.value, str):
                  body = body[1:]
              if len(body) == 1 and isinstance(body[0], ast.Return) and isinstance(body[0].value, ast.Call):
                  callee = ast.unparse(body[0].value.func)
                  simple_returns.append({
                      "name": node.name,
                      "line": node.lineno,
                      "callee": callee,
                      "source": ast.get_source_segment(bridge_source, node),
                  })

          counts = {}
          for row in rows:
              counts[row["classification"]] = counts.get(row["classification"], 0) + 1
          no_caller = [row["name"] for row in rows if row["classification"] == "NO_CALLER"]

          payload = {
              "schema": "WHD_ISSUE524_FACADE_AUDIT_V1",
              "head_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "facade_total": len(rows),
              "facade_accounted": len(rows),
              "unclassified": 0,
              "class_counts": counts,
              "no_caller": no_caller,
              "rows": rows,
              "simple_return_wrappers": simple_returns,
          }
          Path("issue524-facade-audit.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          md = [
              "# Issue 524 Facade Consumer Audit",
              "",
              f"- HEAD: \`{payload['head_sha']}\`",
              f"- FACADE_ACCOUNTED: {len(rows)}/{len(rows)}",
              f"- UNCLASSIFIED: 0",
              f"- NO_CALLER: {len(no_caller)}",
              "",
              "## Classification counts",
              "",
          ]
          for key, value in sorted(counts.items()):
              md.append(f"- {key}: {value}")
          md += ["", "## NO_CALLER", ""]
          md += [f"- \`{name}\`" for name in no_caller] or ["- none"]
          md += ["", "## Rows", "", "| name | class | attr | strings | runtime text |", "|---|---|---:|---:|---:|"]
          for row in rows:
              md.append(
                  f"| \`{row['name']}\` | {row['classification']} | "
                  f"{row['attribute_ref_count']} | {row['dynamic_string_ref_count']} | "
                  f"{row['runtime_text_ref_count']} |"
              )
          Path("issue524-facade-audit.md").write_text("\n".join(md) + "\n", encoding="utf-8")

          print(f"FACADE_ACCOUNTED={len(rows)}")
          print("UNCLASSIFIED_FACADE=0")
          print(f"NO_CALLER_COUNT={len(no_caller)}")
          print("NO_CALLER_NAMES=" + ",".join(no_caller))
          print("CLASS_COUNTS=" + json.dumps(counts, sort_keys=True))
          print(f"SIMPLE_RETURN_WRAPPER_COUNT={len(simple_returns)}")
          print("ISSUE524_FACADE_AUDIT=GREEN")
          PY

      - name: Upload facade audit
        uses: actions/upload-artifact@v4
        with:
          name: issue524-facade-audit
          path: |
            issue524-facade-audit.json
            issue524-facade-audit.md
          if-no-files-found: error
          retention-days: 14
