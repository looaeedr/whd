name: Knowledge Governance Bootstrap

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - '*.md'
      - '*.MD'
      - '個人AI檔案庫/**/*.md'
      - '個人AI檔案庫/**/*.MD'
      - '.agents/skills/**/*.md'
      - '.agents/skills/**/*.MD'
      - '.agents/skills/skill_registry.json'
      - '.agents/contracts/WHD_DEFAULT_BRANCH_FAIL_CLOSED_V1.json'
      - 'tests/governance/test_default_branch_explicit_x_contract.py'
      - 'tests/knowledge/test_current_history_authority_contract.py'
      - 'docs/governance/main_cleanup_governance_sync_20260928.json'
      - 'tests/governance/test_dispatch_remote_only_contract.py'
      - 'tests/governance/test_context_loss_prevention_contract.py'
      - 'docs/**/*.md'
      - 'docs/**/*.MD'
      - 'handoff/**/*.md'
      - 'handoff/**/*.MD'
      - 'UPDATE/**/*.md'
      - 'UPDATE/**/*.MD'
      - 'tools/knowledge_governance.py'
      - 'tests/governance/test_knowledge_uppercase_markdown.py'
      - 'docs/superpowers/verification/knowledge_governance_inventory_v1.json'
      - '.github/workflows/knowledge-governance-bootstrap.yml'

env:
  TZ: Asia/Taipei

permissions:
  contents: read

jobs:
  bootstrap-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Taiwan timezone hard gate contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/governance -p 'test_taipei_timezone_gate.py' -v

      - name: Reject new documentation drift
        shell: bash
        run: |
          python tools/knowledge_governance.py bootstrap \
            --inventory docs/superpowers/verification/knowledge_governance_inventory_v1.json \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}"

      - name: Verify CURRENT and historical document authority regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/knowledge/test_current_history_authority_contract.py

      - name: Reject uppercase Markdown bypass regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/governance -p 'test_knowledge_uppercase_markdown.py' -v

      - name: Enforce explicit X authority and unmanaged historical main
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/governance -p 'test_default_branch_explicit_x_contract.py' -v

      - name: Enforce remote-only dispatch and explicit local takeover
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/governance -p 'test_dispatch_remote_only_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_dispatch_executor_handoff_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_context_loss_prevention_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_issue1464_dispatch_takeover_remote_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_issue_dispatch_ci_continuity_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_dispatch_turn_exit_gate_contract.py' -v
          python -m unittest discover -s tests/process -p 'test_change_lane_gate.py' -v
