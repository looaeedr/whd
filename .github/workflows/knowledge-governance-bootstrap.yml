name: Knowledge Governance Bootstrap

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - '*.md'
      - '個人AI檔案庫/**/*.md'
      - '.agents/skills/**/*.md'
      - 'docs/**/*.md'
      - 'handoff/**/*.md'
      - 'UPDATE/**/*.md'
      - 'tools/knowledge_governance.py'
      - 'docs/superpowers/verification/knowledge_governance_inventory_v1.json'
      - '.github/workflows/knowledge-governance-bootstrap.yml'

env:
  TZ: Asia/Taipei

permissions:
  contents: read

jobs:
  bootstrap-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Taiwan timezone hard gate contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/governance -p 'test_taipei_timezone_gate.py' -v

      - name: Reject new documentation drift
        shell: bash
        run: |
          python tools/knowledge_governance.py bootstrap \
            --inventory docs/superpowers/verification/knowledge_governance_inventory_v1.json \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}"

      - name: Enforce remote-only dispatch and explicit local takeover
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/governance -p 'test_dispatch_remote_only_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_issue1464_dispatch_takeover_remote_contract.py' -v
          python -m unittest discover -s tests/governance -p 'test_issue_dispatch_ci_continuity_contract.py' -v
          python -m unittest discover -s tests/process -p 'test_change_lane_gate.py' -v
