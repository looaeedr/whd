name: Issue 128 R2 Final Combined UI Acceptance

on:
  push:
    branches:
      - work/issue-128-combined-ui-acceptance-20260912-r2
    paths:
      - .github/workflows/issue128-r2-final.yml

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock exact production and durable diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync fix/issue119-replay-latest-20260912-r1
          BASE=711194caac8e8f94d464f8abc4d82316f87edc93
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "$BASE"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "$BASE"
          test "$(git rev-parse origin/fix/issue119-replay-latest-20260912-r1)" = "7f894432ed7b4b4cdcd2160031c2f47e712cf436"
          git merge-base --is-ancestor de31d6709c3bab748b3cc3111b0c57bef1a671b1 7f894432ed7b4b4cdcd2160031c2f47e712cf436
          python - <<'PY'
          import subprocess
          base = "711194caac8e8f94d464f8abc4d82316f87edc93"
          expected = {
              ".agents/skills/engineering/UI設計與去AI味/SKILL.md",
              ".github/workflows/issue128-r2-preflight.yml",
              ".github/workflows/issue128-r2-writeback-red.yml",
              ".github/workflows/issue128-r2-writeback-green.yml",
              ".github/workflows/issue128-r2-final.yml",
              "docs/superpowers/verification/2026-09-12-issue128-r2-state.md",
              "tests/process/test_issue128_invariant_manifest_contract.py",
              "個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md",
          }
          actual = set(subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "diff", "--name-only", f"{base}...HEAD"],
              text=True,
          ).splitlines())
          assert actual == expected, (actual - expected, expected - actual)
          PY
      - name: Snapshot protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > "$RUNNER_TEMP/config.before"
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/baseline.before"
      - name: Provision GUI and test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth python3-tk fonts-noto-cjk scrot
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest matplotlib pillow
      - name: Final changed-file preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/evidence.md" <<'EOF'
          UI設計與去AI味
          執行開發任務
          Python測試實務
          性質導向測試
          tdd
          diagnosing-bugs
          寫技能
          phase6-release-packaging
          驗證板件與DXF
          monitoring-remote-qa
          派工
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task "#128 final Combined UI Acceptance + durable writeback; #119 terminal evidence read-only; pixel runtime + UI/parity/invariant acceptance" \
            --changed-file .agents/skills/engineering/UI設計與去AI味/SKILL.md \
            --changed-file tests/process/test_issue128_invariant_manifest_contract.py \
            --changed-file 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md \
            --evidence "$RUNNER_TEMP/evidence.md"
      - name: Compile combined acceptance surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            gui.py phase6_settings_panel.py fold_designer_bridge.py phase6_settings_center.py \
            tests/test_issue123_ui_foundation.py \
            tests/test_issue124_structure_tree.py \
            tests/test_issue125_inspector_property_panel.py \
            tests/test_issue126_workspace_layout.py \
            tests/test_issue127_surfaces_scale_scroll.py \
            tests/test_issue99_dual_view_parity_persistence.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            tests/process/test_issue128_invariant_manifest_contract.py
      - name: Durable knowledge and AI-design governance guards
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/process/test_issue128_invariant_manifest_contract.py \
            tests/test_ui_design_de_ai_skill_contract.py
      - name: T1-T6 combined UI contracts under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a pytest -q \
            tests/test_issue123_ui_foundation.py \
            tests/test_issue124_structure_tree.py \
            tests/test_issue125_inspector_property_panel.py \
            tests/test_issue126_workspace_layout.py \
            tests/test_issue127_surfaces_scale_scroll.py
      - name: Persistence and authoritative 2D-3D parity under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a pytest -q \
            tests/test_issue99_dual_view_parity_persistence.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py
      - name: Real pixel visual runtime at all text scales
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/issue128-pixels"
          mkdir -p "$EVIDENCE"
          export EVIDENCE
          xvfb-run -a -s '-screen 0 1440x1050x24' python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from PIL import Image
          import tkinter as tk
          import gui

          out = Path(os.environ["EVIDENCE"])
          root = tk.Tk()
          root.geometry("1200x900+0+0")
          app = gui.BoxCalculatorGUI(root)
          app.baseline_var.set("受電箱")

          def pump(widget, cycles=4):
              for _ in range(cycles):
                  widget.update_idletasks()
                  widget.update()

          pump(root)
          designer = app.open_original_fold_designer()
          pump(root)

          def capture(label, size_key, geometry):
              resolved = app._apply_ui_text_size_preference(
                  size_key, persist=False, notify_designer=True
              )
              assert resolved == size_key
              designer.root.geometry(geometry)
              designer.root.lift()
              try:
                  designer.root.focus_force()
              except Exception:
                  pass
              pump(root, 5)
              x = max(0, int(designer.root.winfo_rootx()))
              y = max(0, int(designer.root.winfo_rooty()))
              w = int(designer.root.winfo_width())
              h = int(designer.root.winfo_height())
              assert w >= 700 and h >= 400, (label, w, h)
              path = out / f"{label}-{size_key}-{w}x{h}.png"
              subprocess.run(
                  ["scrot", "-a", f"{x},{y},{w},{h}", str(path)],
                  check=True,
              )
              image = Image.open(path).convert("RGB")
              assert image.size == (w, h)
              colors = image.getcolors(maxcolors=w * h)
              assert colors is not None and len(colors) >= 24, (label, len(colors or ()))
              dominant = max(count for count, _ in colors) / float(w * h)
              assert dominant < 0.97, (label, dominant)
              assert image.entropy() > 1.0, (label, image.entropy())
              print(f"PIXEL_ACCEPT {path.name} colors={len(colors)} dominant={dominant:.4f} entropy={image.entropy():.4f}")

          try:
              capture("workbench", "small", "1200x850+0+0")
              capture("workbench", "medium", "1000x700+0+0")
              capture("workbench", "large", "760x420+0+0")
          finally:
              try:
                  designer.root.destroy()
              except Exception:
                  pass
              try:
                  root.destroy()
              except tk.TclError:
                  pass
          PY
          test "$(find "$EVIDENCE" -name '*.png' -type f | wc -l)" -eq 3
      - name: Verify protected invariants and clean tracked worktree
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > "$RUNNER_TEMP/config.after"
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/baseline.after"
          diff -u "$RUNNER_TEMP/config.before" "$RUNNER_TEMP/config.after"
          diff -u "$RUNNER_TEMP/baseline.before" "$RUNNER_TEMP/baseline.after"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload real pixel evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue128-r2-pixel-evidence
          path: ${{ runner.temp }}/issue128-pixels/*.png
          if-no-files-found: error
          include-hidden-files: true
