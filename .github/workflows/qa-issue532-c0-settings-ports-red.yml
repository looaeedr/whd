name: WHD｜#532｜C0 Settings Ports RED
run-name: "WHD｜#532｜C0 Settings Ports RED｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue532-c0-settings-ports-red.yml
      - tests/test_issue532_c0_presentation_composition.py

permissions:
  contents: read

jobs:
  red:
    name: C0 Settings application ports replacement RED
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 執行 replacement RED
        shell: bash
        run: |
          set +e
          python -m pytest -q             tests/test_issue532_c0_presentation_composition.py::test_c0_settings_application_port_assembly_lives_in_composition_root             > /tmp/issue532-c0-settings-ports-red.log 2>&1
          rc=$?
          cat /tmp/issue532-c0-settings-ports-red.log
          test "$rc" -ne 0
          grep -q "C0 RED: shallow Settings application port wiring still lives in Bridge" /tmp/issue532-c0-settings-ports-red.log
          echo "ISSUE532_C0_SETTINGS_PORTS_RED=RED_PROVEN"
      - name: 上傳 RED 證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue532-c0-settings-ports-red
          path: /tmp/issue532-c0-settings-ports-red.log
          if-no-files-found: warn
          retention-days: 14
