name: "QA #401 T1 scheduled-resume dispatcher GREEN"

on:
  push:
    branches:
      - continuity/issue401-scheduled-resume-dispatcher-20260920
    paths:
      - 'tools/continuity_controller.py'
      - 'tools/scheduled_resume_bridge.py'
      - 'tests/process/test_issue400_scheduled_resume_census.py'
      - 'tests/process/test_issue401_scheduled_resume_dispatcher.py'
      - '.github/workflows/qa-issue401-t1-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD ee9aa71085cccbaa6fe241dd5f02066240197f0a)" = "ee9aa71085cccbaa6fe241dd5f02066240197f0a"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: T1 focused
        run: |
          python -m pytest -q             tests/process/test_issue400_scheduled_resume_census.py             tests/process/test_issue401_scheduled_resume_dispatcher.py             --tb=short
      - name: Existing continuity behavior regressions
        run: |
          python -m pytest -q             tests/process/test_continuity_controller.py             tests/process/test_finalization_owner_guard.py             tests/process/test_issue321_turn_exit_enforcement.py             --tb=short
      - name: Scope
        run: |
          set -euo pipefail
          git diff --check ee9aa71085cccbaa6fe241dd5f02066240197f0a...HEAD
          git diff --name-only ee9aa71085cccbaa6fe241dd5f02066240197f0a...HEAD | tee /tmp/files.txt
          test "$(grep -Ec '^(gui.py|fold_designer_bridge.py|gui_modules/|ae_engine/|config.ini|基準檔/)' /tmp/files.txt || true)" -eq 0
          echo "PASS PROTECTED_DRIFT=0"
