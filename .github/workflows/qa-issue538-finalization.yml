name: WHD #538 可執行關單驗證
run-name: "WHD｜#538｜可執行關單驗證"

on:
  push:
    branches:
      - qa/issue538-finalization-20260923
    paths:
      - .github/workflows/qa-issue538-finalization.yml

permissions:
  contents: read

jobs:
  finalization:
    name: 關單證明驗證
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 驗證本工作流程繁中名稱
        shell: bash
        run: |
          set -euo pipefail
          python tools/actions_visible_naming_guard.py .github/workflows/qa-issue538-finalization.yml

      - name: 取得協調檢查點
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
          git show origin/coord/dispatch-claims:.dispatch/checkpoints/issue-538.json > /tmp/issue-538.json
          cat /tmp/issue-538.json

      - name: 產生關單授權證明
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller authorize-finalization /tmp/issue-538.json \
            --issue 538 \
            --branch feature/issue538-actions-chinese-contract-20260923 \
            --head-sha 37e9f212082e53d7ac063ce540d35b70295de730 \
            --proof-out /tmp/issue-538.finalization-proof.json

      - name: 驗證關單證明
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller verify-finalization-proof \
            /tmp/issue-538.json \
            /tmp/issue-538.finalization-proof.json \
            --issue 538 \
            --branch feature/issue538-actions-chinese-contract-20260923 \
            --head-sha 37e9f212082e53d7ac063ce540d35b70295de730
          sha256sum /tmp/issue-538.finalization-proof.json
          cp /tmp/issue-538.finalization-proof.json issue-538.finalization-proof.json

      - name: 上傳關單證明
        uses: actions/upload-artifact@v4
        with:
          name: issue538-finalization-proof
          path: issue-538.finalization-proof.json
          if-no-files-found: error
          retention-days: 14
