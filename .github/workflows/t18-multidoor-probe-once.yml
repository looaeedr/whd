name: T18 multi-door diagnosis probe once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t18_multidoor_probe_trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib pillow ezdxf -r requirements.txt
      - name: Run multi-door state/export probe
        run: PYTHONPATH=. xvfb-run -a python .github/t18_multidoor_probe.py
