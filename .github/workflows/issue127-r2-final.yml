name: Issue 127 R2 Final Combined Acceptance

on:
  push:
    branches:
      - work/issue-127-ui-surfaces-scale-scroll-20260912-r2
    paths:
      - .github/workflows/issue127-r2-final.yml

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock production baseline and accepted implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync
          BASE=17741535032ed2158e524425af1ffacb89698c7b
          IMPL=f60823a907cbaaa4c0fa2078746b047bbb8dbd74
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "$BASE"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "$BASE"
          git merge-base --is-ancestor "$IMPL" HEAD
          printf '%s\n' "$BASE" > /tmp/issue127_base
          printf '%s\n' "$IMPL" > /tmp/issue127_impl

      - name: Enforce branch diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(cat /tmp/issue127_base)
          git diff --name-only "$BASE"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/issue127-r2-final.yml
          .github/workflows/issue127-r2-implement.yml
          .github/workflows/issue127-r2-preflight.yml
          .github/workflows/issue127-r2-red.yml
          docs/superpowers/verification/2026-09-12-issue127-r2-state.md
          fold_designer_bridge.py
          phase6_settings_panel.py
          tests/test_issue127_surfaces_scale_scroll.py
          tools/issue127_r2_apply_patch.py
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Snapshot protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.before
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline-files.before
          sha256sum /tmp/baseline-files.before > /tmp/baseline.before

      - name: Install GUI runtime and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt

      - name: Compile UI production and acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            phase6_settings_panel.py \
            fold_designer_bridge.py \
            phase6_settings_center.py \
            gui.py \
            tests/test_issue123_ui_foundation.py \
            tests/test_issue124_structure_tree.py \
            tests/test_issue125_inspector_property_panel.py \
            tests/test_issue126_workspace_layout.py \
            tests/test_issue127_surfaces_scale_scroll.py \
            tests/test_issue99_dual_view_parity_persistence.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py

      - name: Build preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/evidence.md <<'EOF'
          UI設計與去AI味
          執行開發任務
          phase6-gui-performance-integrity
          phase6-corner-3d-model-integrity
          Python測試實務
          性質導向測試
          diagnosing-bugs
          tdd
          驗證板件與DXF
          monitoring-remote-qa
          派工
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          EOF

      - name: Phase6 changed-file preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "#127 final acceptance：presentation-only Dropdown/Floating/Status/Scale/Scroll；Status 只讀 authoritative cabinet/part/view；文字倍率固定 1.0/1.2/1.4；不得改 geometry/projection/manufacturing/DXF/config/baseline authority" \
            --changed-file phase6_settings_panel.py \
            --changed-file fold_designer_bridge.py \
            --evidence /tmp/evidence.md

      - name: Focused issue 127 acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-evidence
          xvfb-run -a -s '-screen 0 2000x1200x24' \
            pytest -q tests/test_issue127_surfaces_scale_scroll.py \
            2>&1 | tee .qa-evidence/issue127-focused.log

      - name: UI chain regression 123 through 126
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2000x1200x24' \
            pytest -q \
              tests/test_issue123_ui_foundation.py \
              tests/test_issue124_structure_tree.py \
              tests/test_issue125_inspector_property_panel.py \
              tests/test_issue126_workspace_layout.py \
            2>&1 | tee .qa-evidence/ui-chain-123-126.log

      - name: Persistence and 2D 3D parity regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2000x1200x24' \
            pytest -q \
              tests/test_issue99_dual_view_parity_persistence.py \
              tests/test_issue41_persistence_parity.py \
              tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            2>&1 | tee .qa-evidence/persistence-parity.log

      - name: Verify protected invariants and clean diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline-files.after
          sha256sum /tmp/baseline-files.after > /tmp/baseline.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baseline-files.before /tmp/baseline-files.after
          diff -u /tmp/baseline.before /tmp/baseline.after
          git diff --check
          git status --short --untracked-files=no

      - name: Upload final evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue127-r2-final-evidence
          path: .qa-evidence/
          if-no-files-found: warn
          retention-days: 14
