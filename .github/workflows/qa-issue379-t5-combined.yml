name: "QA #379 T5 Combined UI Acceptance"

on:
  push:
    branches:
      - integration/issue379-ui-combined-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_corner_data_view_adapter.py'
      - 'tests/test_issue375_main_selector_navigation.py'
      - 'tests/test_issue376_assembly_collapsible_data.py'
      - 'tests/test_issue377_remove_wrapper_labels.py'
      - 'tests/test_issue378_assembly_mousewheel.py'
      - '.github/workflows/qa-issue379-t5-combined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity and ancestry
        shell: bash
        run: |
          set -euo pipefail
          PROD_BASE=c79ff3e3e0f863a10869f8b1f40416e8686cc711
          test "$(git merge-base HEAD "$PROD_BASE")" = "$PROD_BASE"
          echo "PRODUCTION_BASE=$PROD_BASE"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install GUI harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Capture protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before

      - name: Static integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fold_designer_bridge.py phase6_corner_data_view_adapter.py
          git diff --check c79ff3e3e0f863a10869f8b1f40416e8686cc711...HEAD

      - name: Combined real Tk UI and #369 preservation
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_issue375_main_selector_navigation.py             tests/test_issue376_assembly_collapsible_data.py             tests/test_issue377_remove_wrapper_labels.py             tests/test_issue378_assembly_mousewheel.py             tests/test_issue124_structure_tree.py             tests/test_issue186_sheetmetal_selector_visibility.py             tests/test_issue369_t5_corner_data_view_owner.py             --tb=short

      - name: Protected invariants and chain cleanup
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          cmp /tmp/config.before /tmp/config.after
          cmp /tmp/baseline.before /tmp/baseline.after

          test ! -e .github/workflows/qa-issue375-t1.yml
          test ! -e .github/workflows/qa-issue376-t2.yml
          test ! -e .github/workflows/qa-issue377-t3.yml
          test ! -e .github/workflows/qa-issue378-t4-red.yml
          test ! -e .github/workflows/qa-issue378-t4-green.yml

          git diff --name-only c79ff3e3e0f863a10869f8b1f40416e8686cc711...HEAD | tee /tmp/issue379-files.txt
          test "$(grep -Ec '^(config.ini$|基準檔/|ae_engine/)' /tmp/issue379-files.txt || true)" -eq 0
          echo "PASS PROTECTED_DRIFT=0"
          echo "PASS TEMP_UI_QA_LEAK=0"
