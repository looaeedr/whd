# trigger: production-visible sheet-metal Menubutton RED
name: Sheet-metal Selector Direct-3D Focused QA

on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - 'tests/test_issue186_sheetmetal_selector_visibility.py'
      - 'fold_designer_bridge.py'
      - 'gui.py'
      - '.github/workflows/qa-sheetmetal-selector-direct3d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct3d-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and focused dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Capture protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Run production direct-3D selector regression
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -s tests/test_issue186_sheetmetal_selector_visibility.py
      - name: Verify protected invariants and worktree
        if: always()
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          git diff --exit-code
