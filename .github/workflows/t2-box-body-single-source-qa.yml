name: T2 Box Body authoritative dimensions QA

on:
  push:
    branches:
      - work/box-body-single-source-t2-20260907
    paths:
      - "gui.py"
      - "ae_engine/manufacturing_api.py"
      - "tests/test_box_body_single_source_t2.py"
      - ".github/workflows/t2-box-body-single-source-qa.yml"

permissions:
  contents: read

jobs:
  t2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Static compile
        run: python -m py_compile gui.py ae_engine/manufacturing_api.py
      - name: T2 expanded Box Body regression
        shell: bash
        run: |
          set +e
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_box_body_single_source_t1.py             tests/test_box_body_single_source_t2.py             tests/test_phase6_box_body_structure.py             tests/test_phase6_t03_piece_dimensions.py             tests/test_phase6_receiving_multipart_integration.py             tests/test_phase6_t06_receiving_fresh_family.py             tests/test_gui_manufacturing_adapter.py             > t2.log 2>&1
          rc=$?
          after="$(sha256sum config.ini | awk '{print $1}')"
          cat t2.log
          printf '{"pytest_rc":%s,"config_before":"%s","config_after":"%s"}\n' "$rc" "$before" "$after" > t2_state.json
          cat t2_state.json
          if [ "$before" != "$after" ]; then
            echo "config.ini mutated" >&2
            exit 97
          fi
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-box-body-single-source-${{ github.run_id }}
          path: |
            t2.log
            t2_state.json
