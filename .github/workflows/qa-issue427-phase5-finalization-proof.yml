name: QA Issue427 Phase5 Finalization Proof

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - .github/workflows/qa-issue427-phase5-finalization-proof.yml
      - docs/superpowers/checkpoints/issue427-phase5-t6-journal.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalization-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_BRANCH: cleanup/2d-3d-sync
      PRODUCTION_SHA: 50e14c7054916cb0b9597c61194725939c5de323
      EVIDENCE: docs/superpowers/checkpoints/issue427-phase5-t6-journal.md

    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工執行 Phase 5 T6 #427 exact-head finalization proof after GREEN cumulative A/B, non-force production integration, protected-owner scan and post-merge Assembly Xvfb smoke' \
            --changed-file .github/workflows/qa-issue427-phase5-finalization-proof.yml \
            --changed-file docs/superpowers/checkpoints/issue427-phase5-t6-journal.md \
            --evidence "$EVIDENCE"
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Verify exact production ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCTION_BRANCH"
          test "$(git rev-parse "origin/$PRODUCTION_BRANCH")" = "$PRODUCTION_SHA"
          echo "FINAL_PRODUCTION_SHA_EXACT=1"

      - name: Checkout exact production SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCTION_SHA }}

      - name: Build terminal checkpoint and authorize closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue427-finalization
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "version": 1,
              "issue": "427",
              "branch": "cleanup/2d-3d-sync",
              "head_sha": os.environ["PRODUCTION_SHA"],
              "state": "TERMINAL_SUCCESS",
              "next_action": None,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "job_id": None,
              "log_cursor": None,
              "blocked_count": 0,
              "blocked_last_notified_at": None,
              "evidence": [
                  "PHASE5_DECISION=GREEN",
                  "CANDIDATE_ONLY_FAILURES=0",
                  "CANDIDATE_ONLY_ERRORS=0",
                  "NON_FORCE_FAST_FORWARD=1",
                  "POST_MERGE_ASSEMBLY_XVFB_SMOKE=GREEN",
                  "PROTECTED_DRIFT=0",
                  "CONFIG_INVARIANT=GREEN",
                  "FINAL_PRODUCTION_SHA_EXACT=1",
              ],
          }
          out = Path("/tmp/issue427-finalization")
          (out / "terminal-checkpoint.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python -m tools.continuity_controller authorize-finalization \
            /tmp/issue427-finalization/terminal-checkpoint.json \
            --issue "427" \
            --branch "$PRODUCTION_BRANCH" \
            --head-sha "$PRODUCTION_SHA" \
            --proof-out /tmp/issue427-finalization/finalization-proof.json

          python -m tools.continuity_controller verify-finalization-proof \
            /tmp/issue427-finalization/terminal-checkpoint.json \
            /tmp/issue427-finalization/finalization-proof.json \
            --issue "427" \
            --branch "$PRODUCTION_BRANCH" \
            --head-sha "$PRODUCTION_SHA"

          echo "FINALIZATION_GUARD_PASS=1"
          echo "FINALIZATION_PROOF_VALID=1"

      - name: Upload finalization proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue427-phase5-finalization-proof
          path: |
            /tmp/issue427-finalization/terminal-checkpoint.json
            /tmp/issue427-finalization/finalization-proof.json
          if-no-files-found: warn
          retention-days: 14
