name: "QA #402 corrective durable lease RED"

on:
  push:
    branches:
      - continuity/issue402-durable-github-lease-corrective-20260920
    paths:
      - 'tests/process/test_issue402_durable_github_lease.py'
      - '.github/workflows/qa-issue402-corrective-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 3838e7b6698c4b4e01e3f9a86821a492a7b281af)" = "3838e7b6698c4b4e01e3f9a86821a492a7b281af"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm corrective RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue402_durable_github_lease.py --tb=short | tee /tmp/red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "ModuleNotFoundError: No module named 'tools.scheduled_resume_lease'" /tmp/red.log
          echo "PASS EXPECTED_CORRECTIVE_T2_RED=1"
