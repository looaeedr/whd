name: "QA #378 T4 assembly MouseWheel RED"

on:
  push:
    branches:
      - ui/issue378-assembly-mousewheel-20260919
    paths:
      - 'tests/test_issue378_assembly_mousewheel.py'
      - '.github/workflows/qa-issue378-t4-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD f2910e4da945808844862e269a727b5a8ef1e7a8)" = "f2910e4da945808844862e269a727b5a8ef1e7a8"
      - name: Install harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Confirm exact intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue378_assembly_mousewheel.py --tb=short | tee /tmp/issue378-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "ValueError: invalid literal for int()" /tmp/issue378-red.log
          grep -q "2 failed, 3 passed" /tmp/issue378-red.log
          echo "PASS EXPECTED_MOUSEWHEEL_RED=1"
