name: WHD｜#790｜claim blob 對帳遠端驗收
run-name: "WHD｜#790｜同 owner claim blob reconciliation focused QA"

on:
  push:
    branches:
      - governance/issue790-intervening-claim-blob-reconcile-20260927

permissions:
  contents: read

jobs:
  focused:
    name: #790 focused reconciliation 驗收
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出工單分支程式碼
        uses: actions/checkout@v4
      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 pytest
        run: python -m pip install pytest
      - name: 執行 claim blob reconciliation focused regressions
        run: >-
          python -m pytest -q
          tests/process/test_issue790_intervening_claim_blob_reconciliation.py
          tests/process/test_issue558_post_commit_claim_head_reconcile.py
          tests/process/test_issue570_merge_head_claim_reconciliation.py
          tests/process/test_issue643_guard_transaction_gate.py
          tests/process/test_issue774_guard_scope_grouping.py
