name: WHD Issue 644 T4 Requirement RED

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - tests/process/test_issue644_trusted_turn_exit_gate.py
      - .github/workflows/qa-issue644-t4-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove exactly twelve approved T4 RED failures
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue644_trusted_turn_exit_gate.py > /tmp/t4-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/t4-red.log
          test "$rc" -ne 0
          grep -Eq '12 failed' /tmp/t4-red.log
          if grep -Eq '[1-9][0-9]* error' /tmp/t4-red.log; then
            exit 1
          fi
          echo 'ISSUE644_T4_REQUIREMENT_RED=GREEN'
