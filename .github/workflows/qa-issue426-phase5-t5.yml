name: QA Issue426 Phase5 T5

on:
  push:
    branches:
      - refactor/issue413-phase5-assembly-presentation-20260920
    paths:
      - phase6_assembly_presentation.py
      - fold_designer_bridge.py
      - tests/process/test_issue426_phase5_t5_bridge_compression.py
      - .github/workflows/qa-issue426-phase5-t5.yml
      - docs/superpowers/checkpoints/issue426-phase5-t5-journal.md
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - phase6_assembly_presentation.py
      - fold_designer_bridge.py
      - tests/process/test_issue426_phase5_t5_bridge_compression.py
      - .github/workflows/qa-issue426-phase5-t5.yml
      - docs/superpowers/checkpoints/issue426-phase5-t5-journal.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-t5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      WORK_BRANCH: refactor/issue413-phase5-assembly-presentation-20260920
      ACCEPTED_PREDECESSOR: 5581b091cd891bd725577dfc60376cf35bc13e63
      EVIDENCE: docs/superpowers/checkpoints/issue426-phase5-t5-journal.md
      TEST_LOG: /tmp/issue426-t5-pytest.log
      CONFIG_BEFORE: /tmp/issue426-config-before.sha256
      CONFIG_AFTER: /tmp/issue426-config-after.sha256

    steps:
      - name: Checkout exact work-order head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OWNER_HEAD }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -r requirements.txt matplotlib
          python -m pytest --version
          command -v xvfb-run

      - name: Verify T5 lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OWNER_HEAD"
          git cat-file -e "$ACCEPTED_PREDECESSOR^{commit}"
          git merge-base --is-ancestor "$ACCEPTED_PREDECESSOR" "$OWNER_HEAD"
          echo "T5_PARENT_ANCESTOR=1"
          echo "WORK_ORDER_HEAD=$OWNER_HEAD"

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工執行 Phase 5 accepted specification T5 #426: preserve exact T0 refresh callsites and mount/unmount triggers, compress Assembly presentation Bridge implementation to thin compatibility/composition wrappers, preserve rebuild-safe legacy aliases and corner snapshot compatibility, no refresh optimization, no UI redesign, no right diagnostics refactor, remote QA and durable closure' \
            --changed-file phase6_assembly_presentation.py \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/process/test_issue426_phase5_t5_bridge_compression.py \
            --changed-file .github/workflows/qa-issue426-phase5-t5.yml \
            --changed-file docs/superpowers/checkpoints/issue426-phase5-t5-journal.md \
            --evidence "$EVIDENCE"
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require T5 scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          predecessor = "5581b091cd891bd725577dfc60376cf35bc13e63"
          allowed = {
              "phase6_assembly_presentation.py",
              "fold_designer_bridge.py",
              "tests/process/test_issue426_phase5_t5_bridge_compression.py",
              ".github/workflows/qa-issue426-phase5-t5.yml",
              "docs/superpowers/checkpoints/issue426-phase5-t5-journal.md",
          }
          changed = {
              x.strip()
              for x in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{predecessor}...HEAD"],
                  text=True,
              ).splitlines()
              if x.strip()
          }
          extra = sorted(changed - allowed)
          print("T5_CHANGED_FILES=", sorted(changed))
          print("T5_SCOPE_EXTERNAL_FILES=", extra)
          if extra:
              raise SystemExit("T5 scope drift: " + repr(extra))
          print("T5_SCOPE_EXTERNAL_DRIFT=0")
          PY

      - name: Capture protected config hash
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | awk '{print $1}' > "$CONFIG_BEFORE"

      - name: Run T5 RED or GREEN under Xvfb
        shell: bash
        run: |
          set -uo pipefail
          if grep -Eq '^def legacy_assembly_presentation_groups\(' phase6_assembly_presentation.py; then
            set -e
            xvfb-run -a python -m pytest -q \
              tests/process/test_issue426_phase5_t5_bridge_compression.py \
              | tee "$TEST_LOG"
            echo "T5_GREEN=1"
            echo "REFRESH_TRIGGER_PARITY=GREEN"
            echo "REFRESH_CALLSITE_PARITY=GREEN"
            echo "REPEATED_REFRESH_STATE_PARITY=GREEN"
            echo "NO_NEW_REFRESH_TRIGGER_DELTA=0"
            echo "NO_REMOVED_REFRESH_TRIGGER_DELTA=0"
            echo "MOUNT_TRIGGER_PARITY=GREEN"
            echo "UNMOUNT_TRIGGER_PARITY=GREEN"
            echo "ASSEMBLY_ROW_TK_CONSTRUCTION_IN_BRIDGE=0"
            echo "ASSEMBLY_PIECE_ROW_TK_CONSTRUCTION_IN_BRIDGE=0"
            echo "ASSEMBLY_COLLAPSE_IMPLEMENTATION_IN_BRIDGE=0"
            echo "ASSEMBLY_SCROLL_IMPLEMENTATION_IN_BRIDGE=0"
            echo "ASSEMBLY_GROUPING_IMPLEMENTATION_IN_BRIDGE=0"
            echo "ASSEMBLY_VISIBILITY_POLICY_IMPLEMENTATION_IN_BRIDGE=0"
            echo "COMPAT_WRAPPER_SECOND_STATE=0"
            echo "COMPAT_WRAPPER_TK_CONSTRUCTION=0"
            echo "COMPAT_WRAPPER_DOMAIN_LOGIC=0"
            echo "COMPAT_WRAPPER_COUNT_GROWTH=0"
            echo "LEGACY_ALIAS_SURVIVES_REBUILD=GREEN"
            echo "STALE_LEGACY_REGISTRY_REFERENCE=0"
            echo "LEGACY_ATTRIBUTE_COMPATIBILITY_PARITY=GREEN"
            echo "LAST_ASSEMBLY_CORNER_TEXTS_RETAINED=1"
          else
            set +e
            xvfb-run -a python -m pytest -q \
              tests/process/test_issue426_phase5_t5_bridge_compression.py \
              >"$TEST_LOG" 2>&1
            rc=$?
            set -e
            cat "$TEST_LOG"
            if [ "$rc" -eq 0 ]; then
              echo "T5_RED_INVALID=pytest unexpectedly passed"
              exit 1
            fi
            if grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError' "$TEST_LOG"; then
              echo "T5_RED_INVALID=harness_or_collection_error"
              exit 1
            fi
            grep -Fq 'T5 requirement RED: pure Assembly presentation grouping compatibility projection is missing' "$TEST_LOG"
            grep -Eq '[1-9][0-9]* failed' "$TEST_LOG"
            echo "T5_RED_INTENDED=1"
            echo "T5_RED_PYTEST_RC=$rc"
          fi

      - name: Verify right diagnostics stayed outside T5 diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          predecessor = "5581b091cd891bd725577dfc60376cf35bc13e63"
          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", f"{predecessor}...HEAD", "--", "fold_designer_bridge.py"],
              text=True,
          )
          protected_terms = (
              "assembly_diagnostics_frame",
              "_phase6_update_assembly_diagnostic_status",
              "_phase6_refresh_joint_diagnostic_selector",
              "assembly_show_interference_var",
          )
          changed_lines = [
              line for line in diff.splitlines()
              if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
          ]
          hits = [
              line for line in changed_lines
              if any(term in line for term in protected_terms)
          ]
          print("T5_RIGHT_DIAGNOSTICS_DIFF_HITS=", hits)
          if hits:
              raise SystemExit("right-side diagnostics changed in T5")
          print("RIGHT_DIAGNOSTICS_OUT_OF_SCOPE_EXPLICIT=1")
          PY

      - name: Run legacy Assembly mount and compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue336_left_content_switch.py \
            tests/test_issue376_assembly_collapsible_data.py \
            tests/test_issue383_content_ownership_red.py \
            tests/test_issue384_assembly_only_function_presentation.py \
            tests/test_issue385_assembly_parent_child_groups.py \
            tests/test_issue386_default_assembly_collapsed.py \
            tests/test_phase6_latest_layout_contract.py \
            tests/test_phase6_corner_dimension_controls.py
          echo "LEGACY_T5_ASSEMBLY_REGRESSIONS=GREEN"

      - name: Verify protected config invariant
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | awk '{print $1}' > "$CONFIG_AFTER"
          cmp "$CONFIG_BEFORE" "$CONFIG_AFTER"
          echo "CONFIG_INVARIANT=GREEN"

      - name: Upload T5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue426-phase5-t5
          path: |
            /tmp/issue426-t5-pytest.log
            /tmp/issue426-config-before.sha256
            /tmp/issue426-config-after.sha256
          if-no-files-found: warn
          retention-days: 14
