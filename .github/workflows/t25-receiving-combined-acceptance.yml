name: T25 Receiving Combined Acceptance

on:
  push:
    branches:
      - qa/20260907-t7-combined-acceptance
    paths:
      - .github/workflows/t25-receiving-combined-acceptance.yml
      - tests/test_phase6_t25_combined_receiving_acceptance.py

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Record config invariant
        shell: bash
        run: |
          sha256sum config.ini | tee /tmp/config_before.sha256
      - name: Run resumable Combined Acceptance
        shell: bash
        run: |
          set -uo pipefail
          JOURNAL=/tmp/t25_combined.jsonl
          STATE=/tmp/t25_combined.state.json
          ARGS=(
            tests/test_phase6_t25_combined_receiving_acceptance.py
            tests/test_phase6_t11_family_preset_switching.py
            tests/test_phase6_t13_receiving_base_plate_55.py
            tests/test_phase6_t14_box_body_child_sections.py
            tests/test_phase6_t16_receiving_placement.py
            tests/test_phase6_t19_receiving_baseplate_topology.py
            tests/test_phase6_t20_receiving_baseplate_placement.py
            tests/test_phase6_t21_live_switch_selector.py
            tests/test_phase6_t22_settings_vertical_scroll.py
            tests/test_phase6_t23_bottom_edge_visibility.py
            tests/test_phase6_t24_edge_selector_width.py
            tests/test_phase6_receiving_multipart_integration.py
            tests/test_phase6_2d_3d_round_trip.py
            tests/test_multi_door_gui.py
            tests/test_assembly_placement_divider.py
          )
          first=1
          while true; do
            RESET=()
            if [ "$first" -eq 1 ]; then RESET=(--reset); first=0; fi
            set +e
            python tools/phase6_release_test_runner.py               --root .               --mode xvfb               --journal "$JOURNAL"               --state "$STATE"               --batch-size 8               --batch-timeout 45               --budget-seconds 240               "${RESET[@]}"               "${ARGS[@]}"
            rc=$?
            set -e
            cat "$STATE"
            if [ "$rc" -eq 75 ]; then
              echo "runner checkpoint; resuming same journal"
              continue
            fi
            if [ "$rc" -ne 0 ]; then
              echo "combined runner failed rc=$rc"
              exit "$rc"
            fi
            break
          done
          cp "$JOURNAL" t25_combined.jsonl
          cp "$STATE" t25_combined.state.json
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("t25_combined.state.json").read_text())
          print("FINAL_STATE", json.dumps(state, sort_keys=True))
          assert state["pending_nodeids"] == 0, state
          assert state["failed_batches"] == 0, state
          assert state["completed_nodeids"] == state["total_nodeids"], state
          PY
      - name: Verify config invariant
        shell: bash
        run: |
          sha256sum config.ini | tee /tmp/config_after.sha256
          diff -u /tmp/config_before.sha256 /tmp/config_after.sha256
          git diff --exit-code -- config.ini
      - name: Upload Combined Acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t25-receiving-combined-acceptance
          path: |
            t25_combined.jsonl
            t25_combined.state.json
