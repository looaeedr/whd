name: "QA #403 T3 runtime recovery policy RED"

on:
  push:
    branches:
      - continuity/issue403-runtime-recovery-policy-20260920
    paths:
      - 'tests/process/test_issue403_runtime_recovery_policy.py'
      - '.github/workflows/qa-issue403-t3-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 72bab371157bb6bd18c97c4a6f08d3187750495f)" = "72bab371157bb6bd18c97c4a6f08d3187750495f"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm intended T3 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue403_runtime_recovery_policy.py --tb=short | tee /tmp/red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "ModuleNotFoundError: No module named 'tools.scheduled_resume_runtime'" /tmp/red.log
          echo "PASS EXPECTED_T3_RED=1"
