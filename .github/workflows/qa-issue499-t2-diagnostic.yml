name: "QA #499 T2 focused diagnostic"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue499-t2-diagnostic.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_issue499_settings_apply_coordinator.py
          - tests/test_issue498_settings_application_coordinator.py
          - tests/test_issue366_t2_settings_transaction_owner.py
          - tests/test_issue366_t2a_settings_stage_controller.py
          - tests/test_issue390_settings_contracts.py
          - tests/test_issue391_settings_transitions.py
          - tests/test_issue392_settings_service.py
          - tests/test_phase6_settings_service.py
          - tests/test_phase6_left_global_transaction.py
          - tests/test_gui_fold_designer_transaction_contract.py
          - tests/test_issue445_settings_presentation_owner.py
          - tests/test_phase6_settings_panel_ownership.py
    steps:
      - uses: actions/checkout@v4
      - name: Install focused harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Run one focused file
        run: python -m pytest -q "${{ matrix.test_file }}" --tb=short
