name: "QA #396 T7 RED composition root"

on:
  push:
    branches:
      - "refactor/issue396-phase4-t7-composition-root-20260920"
    paths:
      - "tests/test_issue396_phase4_composition_root.py"
      - ".github/workflows/qa-issue396-t7-red.yml"

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=396"
          echo "PREDECESSOR=f5b3bd7ad64d9c4d18e676296a95de67de34b94e"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor f5b3bd7ad64d9c4d18e676296a95de67de34b94e HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Require intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue396_phase4_composition_root.py --tb=short | tee /tmp/issue396-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "PYTEST_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "single composition root|bridge still constructs deep Settings/Final Scene owners|composition root does not own required construction|Phase6FoldDesignerComposition|FinalSceneCompositionPorts" /tmp/issue396-red.log
          echo "ISSUE396_T7_EXPECTED_RED=1"
