name: "QA #402 T2 scheduled-resume idempotency GREEN"

on:
  push:
    branches:
      - continuity/issue402-scheduled-resume-idempotency-20260920
    paths:
      - 'tools/continuity_controller.py'
      - 'tools/scheduled_resume_bridge.py'
      - 'tests/process/test_issue401_scheduled_resume_dispatcher.py'
      - 'tests/process/test_issue402_scheduled_resume_idempotency.py'
      - '.github/workflows/qa-issue402-t2-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 9822b1cbdd48deb6e6bc9779a06c136fb95b157e)" = "9822b1cbdd48deb6e6bc9779a06c136fb95b157e"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: T2 focused
        run: |
          python -m pytest -q             tests/process/test_issue401_scheduled_resume_dispatcher.py             tests/process/test_issue402_scheduled_resume_idempotency.py             --tb=short
      - name: Existing continuity regressions
        run: |
          python -m pytest -q             tests/process/test_continuity_controller.py             tests/process/test_checkpoint_resume_contract.py             tests/process/test_watchdog_fallback_continuity_contract.py             --tb=short
      - name: Scope
        run: |
          set -euo pipefail
          git diff --check 9822b1cbdd48deb6e6bc9779a06c136fb95b157e...HEAD
          git diff --name-only 9822b1cbdd48deb6e6bc9779a06c136fb95b157e...HEAD | tee /tmp/files.txt
          test "$(grep -Ec '^(gui.py|fold_designer_bridge.py|gui_modules/|ae_engine/|config.ini|基準檔/)' /tmp/files.txt || true)" -eq 0
          echo "PASS DUPLICATE_MUTATION=0"
          echo "PASS PROTECTED_DRIFT=0"
