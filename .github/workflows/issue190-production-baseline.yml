name: Issue 190 Production Baseline Full Suite

on:
  push:
    branches:
      - fix/issue190-combined-acceptance-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-baseline-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact production baseline
        uses: actions/checkout@v4
        with:
          ref: 06da676e18a365075cbfa0a517ff73a1784b2a6d

      - name: Verify exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "06da676e18a365075cbfa0a517ff73a1784b2a6d"
          git rev-parse HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and Xvfb
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Snapshot production invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/issue190-production-config-before.sha256
          if [ -d '基準檔' ]; then
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/issue190-production-baseline-before.sha256
          else
            : > /tmp/issue190-production-baseline-before.sha256
          fi

      - name: Full-suite production baseline under Xvfb
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q 2>&1 | tee /tmp/issue190-production-full-suite.log
          exit ${PIPESTATUS[0]}

      - name: Post-run production invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/issue190-production-config-before.sha256
          if [ -d '基準檔' ]; then
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/issue190-production-baseline-after.sha256
          else
            : > /tmp/issue190-production-baseline-after.sha256
          fi
          diff -u /tmp/issue190-production-baseline-before.sha256 /tmp/issue190-production-baseline-after.sha256
          git diff --exit-code
          status_output="$(git status --porcelain)"
          if [ -n "$status_output" ]; then
            printf '%s\n' "$status_output"
            exit 1
          fi
