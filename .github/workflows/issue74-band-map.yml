name: Issue74 Source Band Penetration Map
on:
  push:
    branches: [fix/issue74-divider-side-front-penetration]
    paths: [.github/workflows/issue74-band-map.yml]
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib -r requirements.txt
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          import fold_designer_bridge as bridge
          from tests.test_issue39_divider_relief import _snapshot,_body_part,_divider_part
          from ae_engine.assembly_collision import _triangle_pair_crossing_segment,_barycentric_world_to_flat
          snap=_snapshot(); body=_body_part(snap); divider,dp=_divider_part(snap)
          solved,diags,joints=bridge._phase6_resolve_family_divider_reliefs(
              (body,dp),finished_dimensions=(snap["w"],snap["h"],snap["d"]),
              sheet_thickness=snap["t"],clearance=0.0)
          sd=next(p for p in solved if p.part_key==divider.stable_id)
          world=bridge._phase6_build_joint_world_geometry(tuple(solved),(snap["w"],snap["h"],snap["d"]),snap["t"])
          tgt=tuple(world["mapped_skin_triangles_by_part"][divider.stable_id])
          pieces={f"box_body:{p.role}":p for p in body.render_data.pieces}
          out={}
          for key in ("box_body:left_side","box_body:right_side"):
              piece=pieces[key]
              bands=[]; cur=0.0
              for row in piece.fold_profile:
                  nxt=cur+float(row.length)
                  bands.append((str(row.phase6_key),cur,nxt,float(row.length)))
                  cur=nxt
              srcs=tuple(world["mapped_skin_triangles_by_part"][key])
              rows={}
              for name,u0,u1,L in bands:
                  sides=defaultdict(int); divuv=[]; srcuv=[]
                  for src in srcs:
                      su=[float(p[0]) for p in src.flat]
                      if max(su)<u0-1e-6 or min(su)>u1+1e-6: continue
                      for tar in tgt:
                          seg=_triangle_pair_crossing_segment(src.world,tar.world,tolerance=1e-7)
                          if not seg: continue
                          ms=[]; mt=[]
                          try:
                              for p in seg:
                                  ms.append(_barycentric_world_to_flat(p,src.world,src.flat))
                                  mt.append(_barycentric_world_to_flat(p,tar.world,tar.flat))
                          except Exception: continue
                          mu=sum(float(p[0]) for p in ms)/len(ms)
                          if mu<u0-1e-5 or mu>u1+1e-5: continue
                          sides[int(src.side)]+=1
                          srcuv += ms; divuv += mt
                  rows[name]={
                      "band":[u0,u1],"length":L,"counts":dict(sides),
                      "crosses_both_skins":bool(sides.get(-1) and sides.get(1)),
                      "divider_uv_bounds":None if not divuv else [
                          min(float(p[0]) for p in divuv),max(float(p[0]) for p in divuv),
                          min(float(p[1]) for p in divuv),max(float(p[1]) for p in divuv)],
                  }
              out[key]=rows
          print("ISSUE74_BAND_MAP="+json.dumps(out,ensure_ascii=False))
          PY
