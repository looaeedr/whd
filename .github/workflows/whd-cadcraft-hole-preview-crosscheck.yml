name: WHD CADCraft Hole Editor Preview Crosscheck

on:
  pull_request:
    branches: [localX]
    paths:
      - 'gui_modules/editors/cadcraft_preview_bridge.py'
      - 'gui_modules/editors/cadcraft_paths.py'
      - 'tests/test_issue1959_cadcraft_relative_location.py'
      - 'gui_modules/editors/hole_editor_composition.py'
      - 'gui_modules/editors/hole_editor_view.py'
      - 'tests/test_cadcraft_hole_editor_preview.py'
      - 'tools/cadcraft_hole_editor_preview_crosscheck.py'
      - 'tools/issue1820_cadcraft_dxf_fidelity_gate.py'
      - 'tests/test_issue1820_cadcraft_dxf_fidelity_gate.py'
      - '.github/workflows/whd-cadcraft-hole-preview-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Taipei

concurrency:
  group: whd-cadcraft-hole-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-dxf-preview:
    name: CADCraft CLI read-write and WHD CHECK geometry parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WHD dependencies
        run: python -m pip install -r requirements.txt ezdxf pytest
      - name: Verify app-relative GUI and CLI lookup without env/PATH
        run: python -m pytest -q tests/test_issue1959_cadcraft_relative_location.py tests/test_cadcraft_hole_editor_preview.py
      - name: Download CADCraft pinned v0.8.0 CLI with SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.8.0
          PACKAGE="cadcraft-$VERSION-linux-x86_64.tar.gz"
          BASE="https://github.com/storytold/cadcraft/releases/download/v$VERSION"
          mkdir -p "$RUNNER_TEMP/cadcraft"
          curl --fail --location --silent --show-error --retry 3 "$BASE/SHA256SUMS.txt" -o "$RUNNER_TEMP/cadcraft/SHA256SUMS.txt"
          curl --fail --location --silent --show-error --retry 3 "$BASE/$PACKAGE" -o "$RUNNER_TEMP/cadcraft/$PACKAGE"
          cd "$RUNNER_TEMP/cadcraft"
          python - "$PACKAGE" <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          name = sys.argv[1]
          rows = dict(
              (row.split(maxsplit=1)[1].lstrip("*"), row.split()[0])
              for row in Path("SHA256SUMS.txt").read_text().splitlines()
              if len(row.split()) >= 2
          )
          expected = rows.get(name)
          if expected is None:
              raise SystemExit("CADCRAFT_RELEASE_SHA256_ENTRY_MISSING")
          digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          if digest.lower() != expected.lower():
              raise SystemExit("CADCRAFT_RELEASE_SHA256_MISMATCH")
          print("CADCRAFT_VERIFIED_RELEASE_SHA256", name, digest)
          PY
          tar -xzf "$PACKAGE"
          test -x "$RUNNER_TEMP/cadcraft/cadcraft-$VERSION-linux-x86_64/bin/cadcraft-cli"
      - name: Emit actual WHD Hole Editor test preview DXF
        run: |
          mkdir -p work/cadcraft-hole-preview
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/cadcraft_hole_editor_preview_crosscheck.py emit work/cadcraft-hole-preview/source.dxf
      - name: CADCraft CLI open, inspect, and resave
        shell: bash
        run: |
          set -euo pipefail
          export CADCRAFT_CONFIG_DIR="$RUNNER_TEMP/cadcraft-config"
          CLI="$RUNNER_TEMP/cadcraft/cadcraft-0.8.0-linux-x86_64/bin/cadcraft-cli"
          "$CLI" info work/cadcraft-hole-preview/source.dxf > work/cadcraft-hole-preview/info.json
          "$CLI" run work/cadcraft-hole-preview/source.dxf --save work/cadcraft-hole-preview/resaved.dxf
          test -s work/cadcraft-hole-preview/resaved.dxf
      - name: Compare every primitive, XY and layer with independent ezdxf
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/cadcraft_hole_editor_preview_crosscheck.py verify work/cadcraft-hole-preview/source.dxf work/cadcraft-hole-preview/resaved.dxf
      - name: Refuse DXF header/geometry/block/annotation semantic drift
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/issue1820_cadcraft_dxf_fidelity_gate.py \
            work/cadcraft-hole-preview/source.dxf \
            work/cadcraft-hole-preview/resaved.dxf \
            --json work/cadcraft-hole-preview/fidelity-gate.json
      - name: Preserve inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadcraft-hole-editor-preview-evidence
          path: work/cadcraft-hole-preview/
          if-no-files-found: warn
          retention-days: 7
