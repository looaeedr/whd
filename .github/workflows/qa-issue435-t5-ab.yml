name: "QA #435 T5 A-B qualification"

on:
  push:
    branches:
      - refactor/issue435-t5-switch-lifecycle-guards-20260920
    paths:
      - '.github/workflows/qa-issue435-t5-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 07a5fe36880d1548c9f42f2f6d071f46a9ac062f
  TESTED_SHA: 94fe9251c99b41386c304c8cc97d89bcc3690dd5

jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run T5 Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #435 T5 switch lifecycle, state preservation and duplicate-tree guards final A/B. Use one common candidate test contract on predecessor and candidate. Preserve accepted #431-#434 owners and semantics; production must remain byte-identical." \
            --changed-file tests/test_issue435_switch_lifecycle_guards.py \
            --changed-file tests/test_issue378_assembly_mousewheel.py \
            --changed-file .github/workflows/qa-issue435-t5-ab.yml \
            --evidence docs/superpowers/checkpoints/issue435-t5-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require production exact predecessor
        shell: bash
        run: |
          set -euo pipefail
          for path in fold_designer_bridge.py phase6_assembly_panel.py phase6_corner_data_view_adapter.py phase6_project_controller.py; do
            test "$(git rev-parse "$BASE_SHA:$path")" = "$(git rev-parse "$TESTED_SHA:$path")"
          done
          echo "PRODUCTION_EXACT_PREDECESSOR=1"
          echo "PRODUCTION_RUNTIME_EDIT=0"

  lifecycle-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: Materialize common candidate test contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue435-contract
          git show "$TESTED_SHA:tests/test_issue435_switch_lifecycle_guards.py" > /tmp/issue435-contract/test_issue435_switch_lifecycle_guards.py
          git show "$TESTED_SHA:tests/test_issue378_assembly_mousewheel.py" > /tmp/issue435-contract/test_issue378_assembly_mousewheel.py

      - name: Run exact lifecycle A-B with same tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue435-ab
          TESTS=(
            tests/test_issue435_switch_lifecycle_guards.py
            tests/test_issue430_single_host_red.py
            tests/test_issue432_general_part_shared_host.py
            tests/test_issue433_assembly_shared_host.py
            tests/test_issue434_corner_data_shared_host.py
            tests/test_issue376_assembly_collapsible_data.py
            tests/test_issue119_corner_data_transition_ui.py
            tests/test_issue378_assembly_mousewheel.py
          )

          run_one() {
            label="$1"
            ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            cp /tmp/issue435-contract/test_issue435_switch_lifecycle_guards.py tests/test_issue435_switch_lifecycle_guards.py
            cp /tmp/issue435-contract/test_issue378_assembly_mousewheel.py tests/test_issue378_assembly_mousewheel.py
            before="$(sha256sum config.ini | awk '{print $1}')"
            xvfb-run -a python -m pytest -q "${TESTS[@]}" --tb=short \
              --json-report --json-report-file="/tmp/issue435-ab/$label.json" \
              >"/tmp/issue435-ab/$label.log" 2>&1
            after="$(sha256sum config.ini | awk '{print $1}')"
            test "$before" = "$after"
          }

          run_one baseline "$BASE_SHA"
          run_one candidate "$TESTED_SHA"

          python - <<'PY'
          import json
          from pathlib import Path

          ALLOWED_SKIP={
              "tests/test_issue376_assembly_collapsible_data.py::test_box_body_physical_piece_rows_are_also_collapsible_when_present"
          }

          def load(label):
              data=json.loads(Path(f"/tmp/issue435-ab/{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}

          b=load("baseline")
          c=load("candidate")
          print("BASELINE_COUNTS", {x:list(b.values()).count(x) for x in sorted(set(b.values()))})
          print("CANDIDATE_COUNTS", {x:list(c.values()).count(x) for x in sorted(set(c.values()))})
          assert b == c, "T5 candidate lifecycle outcomes differ from predecessor under common contract"
          assert len(b) == 35
          assert {n for n,o in b.items() if o=="failed"} == set()
          assert {n for n,o in b.items() if o=="skipped"} <= ALLOWED_SKIP
          print("LIFECYCLE_AB_EXACT_OUTCOME_PARITY=1")
          print("LIFECYCLE_CANDIDATE_ONLY_FAILURES=0")
          print("CONFIG_INVARIANT=1")
          PY

      - name: Upload lifecycle A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue435-t5-lifecycle-ab
          path: /tmp/issue435-ab

  persistence-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install persistence dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: Exact persistence A-B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue435-persist
          run_one() {
            label="$1"
            ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            python -m pytest -q tests/test_issue41_persistence_parity.py --tb=short \
              --json-report --json-report-file="/tmp/issue435-persist/$label.json" \
              >"/tmp/issue435-persist/$label.log" 2>&1
          }
          run_one baseline "$BASE_SHA"
          run_one candidate "$TESTED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          def load(label):
              data=json.loads(Path(f"/tmp/issue435-persist/{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}

          b=load("baseline")
          c=load("candidate")
          print("PERSIST_BASELINE_COUNTS", {x:list(b.values()).count(x) for x in sorted(set(b.values()))})
          print("PERSIST_CANDIDATE_COUNTS", {x:list(c.values()).count(x) for x in sorted(set(c.values()))})
          assert b == c
          assert all(v=="passed" for v in b.values())
          print("PROJECT_LOAD_SAVE_RELOAD_AB_EXACT_OUTCOME_PARITY=1")
          PY
      - name: Upload persistence A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue435-t5-persistence-ab
          path: /tmp/issue435-persist

  accepted:
    runs-on: ubuntu-latest
    needs: [source-guard, lifecycle-ab, persistence-ab]
    steps:
      - name: T5 A-B accepted
        run: |
          echo "T5_AB_QUALIFICATION_GREEN=1"
          echo "BASE_SHA=$BASE_SHA"
          echo "TESTED_SHA=$TESTED_SHA"
