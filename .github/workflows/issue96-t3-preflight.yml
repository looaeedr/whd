name: Issue96 T3 Preflight
on:
  push:
    branches: [feat/issue96-selection-lifecycle-multipart-20260910]
    paths:
      - .github/workflows/issue96-t3-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build evidence
        run: |
          cat > /tmp/issue96_evidence.md <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          截角資料入口收斂
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
      - name: T3 task preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task '#92/#96 T3 Selection Lifecycle + Multipart Navigation：截角資料保留有效 stable selection；stale key 清除並重新 resolve；箱身 remembered valid physical child 否則 authoritative first child；door 2→1、multipart topology change、add part 不錯位' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue96_corner_data_selection_lifecycle.py \
            --evidence /tmp/issue96_evidence.md
