name: Issue228 T2 Completion Audit

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue228-t2-completion-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce T2 changed-file preflight
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T2 continuous execution authority normalization machine owner operations owner legacy reference metadata supersession" \
            --changed-file tests/knowledge/test_continuous_execution_authority_normalization.py \
            --changed-file .agents/skills/engineering/executable-continuity-controller/SKILL.md \
            --changed-file 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md \
            --changed-file 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md \
            --evidence docs/superpowers/checkpoints/issue228-t2-preflight-evidence.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify controller source remained untouched
        shell: bash
        run: |
          actual="$(git hash-object tools/continuity_controller.py)"
          echo "CONTROLLER_BLOB_SHA=$actual"
          test "$actual" = "a7e5a7f1863954e1aa35242095619f10d5596be2"
      - name: Run governance and continuity regression set
        run: |
          python -m py_compile tools/knowledge_governance.py tools/continuity_controller.py
          python -m pytest \
            tests/knowledge/test_knowledge_governance_bootstrap.py \
            tests/knowledge/test_knowledge_authority_classification.py \
            tests/knowledge/test_continuous_execution_authority_normalization.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_continuous_execution_durable_contract.py \
            tests/test_writing_skill_contract.py \
            tests/test_phase6_skill_preflight_gate.py -q
      - name: Verify authority semantics directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.knowledge_governance import _authority_rows, parse_doc_metadata

          root = Path('.').resolve()
          rows = _authority_rows(root)
          machine = [r for r in rows if r['contract'] == 'continuous-execution-machine' and r['role'] == 'CURRENT']
          operations = [r for r in rows if r['contract'] == 'continuous-execution-operations' and r['role'] == 'CURRENT']
          assert [r['path'] for r in machine] == ['tools/continuity_controller.py'], machine
          assert [r['path'] for r in operations] == ['.agents/skills/engineering/executable-continuity-controller/SKILL.md'], operations

          skill_path = Path('.agents/skills/engineering/executable-continuity-controller/SKILL.md')
          legacy_path = Path('個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md')
          skill_meta = parse_doc_metadata(skill_path.read_text(encoding='utf-8'), path=skill_path.as_posix())
          legacy_text = legacy_path.read_text(encoding='utf-8')
          legacy_meta = parse_doc_metadata(legacy_text, path=legacy_path.as_posix())
          assert (skill_meta.role, skill_meta.contract) == ('CURRENT', 'continuous-execution-operations')
          assert (legacy_meta.role, legacy_meta.contract) == ('REFERENCE', 'continuous-execution-operations')
          assert '30 秒 polling 是 controller 責任' not in legacy_text
          assert 'polling cadence 由 `.agents/skills/engineering/monitoring-remote-qa/SKILL.md` 負責' in legacy_text
          assert 'documentation compatibility evidence' in legacy_text
          assert 'not executable enforcement' in legacy_text
          assert '## 對應 Machine Guard' not in legacy_text
          print('T2_AUTHORITY_SEMANTICS=GREEN')
          PY
