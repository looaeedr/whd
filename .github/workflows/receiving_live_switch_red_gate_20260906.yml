name: Receiving Live Switch RED Gate

on:
  push:
    branches:
      - red/20260906-receiving-door-baseplate-ui

permissions:
  contents: read

jobs:
  live-switch-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Run live-switch RED probes
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_receiving_spec_red_20260906.py::test_red_live_switch_to_receiving_refreshes_dynamic_door_selector_and_callbacks \
            tests/test_phase6_receiving_spec_red_20260906.py::test_red_live_switch_to_receiving_rebuilds_three_box_body_piece_input_sections \
            2>&1 | tee live_switch_red.log
      - name: Upload RED log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiving-live-switch-red-log
          path: live_switch_red.log
