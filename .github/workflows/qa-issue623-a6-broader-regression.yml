name: "WHD｜工單 #623｜A6 製造碰撞 DXF 擴大回歸"
run-name: "WHD｜#623 A6｜製造／碰撞／DXF 擴大驗收"

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - 'phase6_manufacturing_geometry.py'
      - 'phase6_explicit_joint_pipeline.py'
      - 'tests/test_issue623_phase7_a6_explicit_joint_pipeline.py'
      - '.github/workflows/qa-issue623-a6-broader-regression.yml'

permissions:
  contents: read

jobs:
  broader:
    name: "A6｜manufacturing collision DXF regression"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "簽出 A6 工單主分支"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "確認 A6 lineage"
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c295ad64e5c3fb3b75f1776dca452ce89de5e9ef HEAD
          echo "A6_IMPLEMENTATION=c295ad64e5c3fb3b75f1776dca452ce89de5e9ef"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: "安裝驗收相依"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: "編譯 A6 owner 與 facade"
        run: python -m py_compile phase6_explicit_joint_pipeline.py phase6_manufacturing_geometry.py

      - name: "執行 A6 manufacturing collision DXF 回歸"
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q --tb=short             tests/test_issue623_phase7_a6_explicit_joint_pipeline.py             tests/test_issue349_explicit_joint_relief_extraction.py             tests/test_issue621_phase7_a5_collision_owners.py             tests/test_joint_backprojection_and_topology.py             tests/test_piece_level_joint_geometry.py             tests/test_assembly_collision.py             tests/test_assembly_collision_integration.py             tests/test_manufacturing_collision_dependency.py             tests/test_manufacturing_policy_boundary.py             tests/test_manufacturing_api.py             tests/test_manufacturing_api_finished_face_contract.py             tests/test_resolved_manufacturing_geometry.py             tests/test_resolved_manufacturing_export.py             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py             tests/test_receiving_door_dxf_roundtrip.py             tests/test_phase6_t07_receiving_bottom_seam_relief.py
