name: "QA #764 scheduler Skill contract"

on:
  push:
    branches:
      - governance/issue764-recurring-scheduler-skill-census-20260927

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused scheduler Skill contract
        run: python -m pytest -q tests/process/test_scheduler_no_work_census_contract.py
