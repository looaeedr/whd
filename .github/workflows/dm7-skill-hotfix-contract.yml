name: DM7 Skill Hotfix Contract

on:
  push:
    branches:
      - docs/fix-dispatch-nonterminal-continue-20260913

permissions:
  contents: read

jobs:
  dispatch-skill-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dispatch skill contract
        run: python -m pytest -q tests/test_dispatching_skill_timeout_contract.py
