name: Issue83 Divider CROSS Focused QA
on:
  push:
    branches: [fix/issue83-divider-certified-relief]
    paths:
      - ae_engine/sheetmetal_geometry.py
      - ae_engine/certified_relief_registry.py
      - ae_engine/divider_manufacturing.py
      - ae_engine/manufacturing_api.py
      - ae_engine/cabinet_types/receiving.py
      - '基準檔/截角資料庫/**'
      - '基準檔/金庫型/中隔.dxf'
      - tests/test_issue83_divider_cross_registry.py
      - tests/test_relief_formula_evaluator.py
      - tests/test_certified_relief_registry_schema_v2.py
      - tests/test_corner_types.py
      - .github/workflows/issue83-divider-cross-focused.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Compile changed geometry modules
        run: |
          python -m py_compile \
            ae_engine/sheetmetal_geometry.py \
            ae_engine/certified_relief_registry.py \
            ae_engine/divider_manufacturing.py \
            ae_engine/manufacturing_api.py \
            ae_engine/cabinet_types/receiving.py
      - name: Issue83 focused registry and geometry tests
        run: |
          pytest -q -s \
            tests/test_issue83_divider_cross_registry.py \
            tests/test_relief_formula_evaluator.py \
            tests/test_certified_relief_registry_schema_v2.py \
            tests/test_corner_types.py
      - name: Source authority scan
        run: |
          python - <<'PY'
          from pathlib import Path
          divider = Path("ae_engine/divider_manufacturing.py").read_text(encoding="utf-8")
          registry = Path("基準檔/截角資料庫/certified_relief_rules.json").read_text(encoding="utf-8")
          assert "CERTIFIED_REGISTRY_CROSS_PARAMETERS" in divider
          assert "RECEIVING_DIVIDER_CROSS_STANDARD_V1" in registry
          assert "slot_width" in registry and "slot_straight_depth" in registry and "slot_radius" in registry
          assert "INSERT_OVERLAY" not in registry.split('"rule_id": "RECEIVING_DIVIDER_CROSS_STANDARD_V1"', 1)[1].split('"rule_id":', 1)[0]
          print("ISSUE83_SOURCE_AUTHORITY_SCAN=PASS")
          PY
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
