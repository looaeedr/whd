name: Issue 310 T6 Duration Tuning QA

on:
  push:
    branches:
      - ci-sharding/issue310-t6-duration-tuning-20260917
    paths:
      - 'tools/test_shard_tuning.py'
      - 'tests/test_issue310_t6_duration_tuning.py'
      - 'config/ci_test_execution.json'
      - '.github/workflows/qa-issue310-t6-tuning.yml'
      - 'docs/superpowers/checkpoints/issue310-t6.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-enforce T6 Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Measure CI queue and shard duration evidence, evaluate concurrency budget and the 1.75x-median large-lane imbalance gate, keep HRW authoritative unless measured evidence justifies a deliberate versioned duration-aware manifest, preserve full collection ownership and protected invariants, and report execution versus end-to-end wall clock separately." \
            --changed-file tools/test_shard_tuning.py \
            --changed-file tests/test_issue310_t6_duration_tuning.py \
            --changed-file config/ci_test_execution.json \
            --changed-file .github/workflows/qa-issue310-t6-tuning.yml \
            --changed-file docs/superpowers/checkpoints/issue310-t6.json \
            --evidence docs/superpowers/checkpoints/issue310-t6-preflight-evidence.txt
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Run T6 and inherited execution contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue310_t6_duration_tuning.py \
            tests/test_issue309_t5_xdist_state_isolation.py \
            tests/test_issue308_t4_aggregation.py

  plan:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      non_gui_matrix: ${{ steps.non-gui-matrix.outputs.matrix }}
      non_gui_max_parallel: ${{ steps.non-gui-matrix.outputs.max_parallel }}
      xvfb_matrix: ${{ steps.xvfb-matrix.outputs.matrix }}
      xvfb_max_parallel: ${{ steps.xvfb-matrix.outputs.max_parallel }}
      source_sha: ${{ steps.owner.outputs.source_sha }}
      manifest_sha256: ${{ steps.manifest-meta.outputs.manifest_sha256 }}
      plan_artifact_digest: ${{ steps.upload-plan.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind T6 acceptance to this exact SHA
        id: owner
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "ISSUE310_ACCEPTANCE_SOURCE_SHA=$actual"
      - name: Reject production or unrelated drift from accepted T5
        env:
          T5_ACCEPTED_HEAD: 17b0dd1f27d2b8d078a4b8d8021ee38eaadcf6ef
        run: |
          set -euo pipefail
          git diff --name-only "$T5_ACCEPTED_HEAD" "$GITHUB_SHA" | sort | tee /tmp/issue310-scope.txt
          python - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/issue310-scope.txt').read_text().splitlines())
          expected = {
              '.github/workflows/qa-issue310-t6-preflight.yml',
              '.github/workflows/qa-issue310-t6-tuning.yml',
              'config/ci_test_execution.json',
              'docs/superpowers/checkpoints/issue310-t6-preflight-evidence.txt',
              'docs/superpowers/checkpoints/issue310-t6.json',
              'tests/test_issue310_t6_duration_tuning.py',
              'tools/test_shard_tuning.py',
          }
          assert actual == expected, f'ISSUE310_SCOPE_DRIFT={sorted(actual)}'
          print('ISSUE310_SCOPE=CI_TUNING_ONLY')
          PY
      - name: Verify exact A/B-proven budget and unchanged xdist authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.test_shard_execution import load_execution_config, load_xdist_policy, resolve_xdist_workers
          path = Path('config/ci_test_execution.json')
          payload = json.loads(path.read_text())
          assert load_execution_config(path) == 8, payload
          proof = payload['concurrency_tuning']
          expected = {
              'selected_budget': 8,
              'baseline_budget': 4,
              'proof_run_id': 35134127715,
              'proof_head_sha': 'b4276bf7b16403166f2893f0933d9f59333a5a29',
              'proof_artifact_id': 10462837430,
              'proof_artifact_sha256': '994e1f4cca8f83347d129c6e07cbc83e62a9031a743fd44a4815d7d1c25e416d',
              'proof_manifest_sha256': 'e568e419786cb48069eb827a2a21c48876e7dd58631a9bd620f124378d405b64',
              'semantic_result_digest': '61d5e6b47ab69c91279daf66f974ef13ae1afd18bbaabe8d5b80f2085d76a4cc',
              'baseline_execution_wall_clock_seconds': 151.0,
              'candidate_execution_wall_clock_seconds': 85.0,
              'baseline_end_to_end_wall_clock_seconds': 154.0,
              'candidate_end_to_end_wall_clock_seconds': 87.0,
              'baseline_max_job_wait_seconds': 122.0,
              'candidate_max_job_wait_seconds': 63.0,
              'manifest_strategy': 'KEEP_HRW',
              'decision_reason': 'MEASURED_EXECUTION_IMPROVEMENT',
          }
          assert proof == expected, proof
          policy = load_xdist_policy(path)
          assert set(policy['safe_shards']) == {'dxf:s00'}, policy
          assert resolve_xdist_workers(policy, lane='dxf', shard_id='s00') == 2
          assert resolve_xdist_workers(policy, lane='geometry', shard_id='s00') == 1
          x = policy['safe_shards']['dxf:s00']
          assert x['proof_run_id'] == 35124104891, x
          assert x['proof_head_sha'] == '45811716bb03b95927a33451bf7f1c8d0769c407', x
          assert x['proof_artifact_id'] == 10458605621, x
          assert x['proof_artifact_sha256'] == '21340f1f0d39a97ab3c40cf756c624a7f5f3b00c22430f90a35d4f9a514d3ada', x
          print('ISSUE310_CONCURRENCY_BUDGET=8')
          print('ISSUE310_MANIFEST_STRATEGY=KEEP_HRW')
          print('ISSUE310_XDIST_POLICY=EXACT_DXF_S00_ONLY')
          PY
      - name: Install collection dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Generate one authoritative live manifest
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue310/acceptance/plan
          python tools/test_shard_manifest.py \
            --out-dir .scratch/issue310/acceptance/plan/manifest \
            --source-sha "$GITHUB_SHA" \
            | tee .scratch/issue310/acceptance/plan/manifest-generation.log
      - name: Bind manifest digest to exact acceptance SHA
        id: manifest-meta
        run: |
          set -euo pipefail
          manifest=.scratch/issue310/acceptance/plan/manifest/shard-manifest.json
          digest="$(sha256sum "$manifest" | awk '{print $1}')"
          GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('.scratch/issue310/acceptance/plan/manifest/shard-manifest.json').read_text())
          assert p['source_sha'] == os.environ['GITHUB_SHA'], p
          r = p['reconciliation']
          assert r['full_count'] == r['lane_union_count'] == r['unique_shard_union_count'], r
          for key in ('lane_missing','lane_extra','lane_duplicate','shard_missing','shard_extra','shard_duplicate'):
              assert not r[key], (key, r[key])
          print(f"FULL_COLLECTION={r['full_count']}")
          PY
          echo "manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > .scratch/issue310/acceptance/plan/manifest.sha256
          printf '%s\n' "$GITHUB_SHA" > .scratch/issue310/acceptance/plan/source.sha
      - name: Lock authoritative T0 Xvfb inherited failure contract
        run: |
          set -euo pipefail
          cp config/issue307_t0_xvfb_failure_contract.json .scratch/issue310/acceptance/plan/t0-failure-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.scratch/issue310/acceptance/plan')
          contract = json.loads((root / 't0-failure-contract.json').read_text())
          assert len(contract['failures']) == 13, len(contract['failures'])
          manifest = json.loads((root / 'manifest/shard-manifest.json').read_text())
          union = {node for item in manifest['shards']['xvfb_ui'].values() for node in item['nodes']}
          missing = sorted(set(contract['failures']) - union)
          assert not missing, f'T0_EXPECTED_XVFB_NOT_IN_CURRENT_MANIFEST={missing}'
          (root / 'expected-xvfb-global.json').write_text(json.dumps(sorted(contract['failures']), indent=2) + '\n')
          print(f'XVFB_LIVE_UNION={len(union)}')
          print('XVFB_T0_FAILURE_CONTRACT=13')
          PY
      - name: Emit non-GUI matrix from the live manifest
        id: non-gui-matrix
        run: |
          set -euo pipefail
          python tools/test_shard_execution.py matrix \
            --manifest .scratch/issue310/acceptance/plan/manifest/shard-manifest.json \
            --execution-config config/ci_test_execution.json \
            --github-output "$GITHUB_OUTPUT"
          test "$(cat "$GITHUB_OUTPUT" | sed -n 's/^max_parallel=//p' | tail -1)" = "8"
      - name: Emit exact four-way Xvfb matrix from the same manifest
        id: xvfb-matrix
        run: |
          set -euo pipefail
          python tools/xvfb_shard_execution.py matrix \
            --manifest .scratch/issue310/acceptance/plan/manifest/shard-manifest.json \
            --execution-config config/ci_test_execution.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload one shared T6 plan artifact
        id: upload-plan
        uses: actions/upload-artifact@v4
        with:
          name: issue310-t6-plan
          path: .scratch/issue310/acceptance/plan
          if-no-files-found: error

  non-gui-shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.non_gui_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.non_gui_matrix) }}
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shard dependencies including proof-authorized xdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-xdist matplotlib ezdxf
      - name: Download authoritative T6 plan
        uses: actions/download-artifact@v4
        with:
          name: issue310-t6-plan
          path: .scratch/issue310/acceptance/plan
      - name: Verify exact checkout and manifest identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue310/acceptance/plan/source.sha)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue310/acceptance/plan/manifest.sha256)" = "$PLAN_MANIFEST_SHA256"
          test "$(sha256sum .scratch/issue310/acceptance/plan/manifest/shard-manifest.json | awk '{print $1}')" = "$PLAN_MANIFEST_SHA256"
      - name: Capture protected hashes before shard
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/non-gui/$LANE/$SHARD_ID"
          mkdir -p "$root"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-before.sha256"
      - name: Run exact non-GUI manifest shard with budget-eight policy
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/non-gui/$LANE/$SHARD_ID"
          set +e
          python tools/test_shard_execution.py run \
            --manifest .scratch/issue310/acceptance/plan/manifest/shard-manifest.json \
            --execution-config config/ci_test_execution.json \
            --lane "$LANE" \
            --shard "$SHARD_ID" \
            --result-json "$root/shard-result.json" \
            --junit-xml "$root/result.xml" \
            --log "$root/pytest.log" \
            --basetemp "$root/pytest-tmp"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/runner-rc.txt"
          test -f "$root/shard-result.json"
          LANE="$LANE" SHARD_ID="$SHARD_ID" RESULT="$root/shard-result.json" python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ['RESULT']).read_text())
          expected_workers = 2 if (os.environ['LANE'], os.environ['SHARD_ID']) == ('dxf', 's00') else 1
          assert p['xdist_workers'] == expected_workers, p
          assert p['xdist_distribution'] == 'load', p
          assert p['child_rc'] == 0, p
          print(f"NON_GUI_XDIST_WORKERS={p['xdist_workers']}")
          PY
          test "$rc" -eq 0
      - name: Verify protected invariants after shard
        if: always()
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/non-gui/$LANE/$SHARD_ID"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-after.sha256"
          cmp "$root/protected-before.sha256" "$root/protected-after.sha256"
          git diff --exit-code
      - name: Upload complete non-GUI shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue310-nongui-${{ matrix.lane }}-${{ matrix.shard_id }}
          path: .scratch/issue310/acceptance/non-gui/${{ matrix.lane }}/${{ matrix.shard_id }}
          if-no-files-found: error

  xvfb-shard:
    if: always() && needs.plan.result == 'success'
    needs: [plan, non-gui-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.xvfb_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.xvfb_matrix) }}
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Download authoritative T6 plan
        uses: actions/download-artifact@v4
        with:
          name: issue310-t6-plan
          path: .scratch/issue310/acceptance/plan
      - name: Verify exact checkout and manifest identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue310/acceptance/plan/source.sha)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue310/acceptance/plan/manifest.sha256)" = "$PLAN_MANIFEST_SHA256"
          test "$(sha256sum .scratch/issue310/acceptance/plan/manifest/shard-manifest.json | awk '{print $1}')" = "$PLAN_MANIFEST_SHA256"
      - name: Slice T0 inherited RED by manifest ownership
        env:
          SHARD_ID: ${{ matrix.shard_id }}
          EXPECTED_NODE_COUNT: ${{ matrix.node_count }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/xvfb/$SHARD_ID"
          mkdir -p "$root"
          python - <<'PY'
          import json, os
          from pathlib import Path
          shard_id = os.environ['SHARD_ID']
          expected_count = int(os.environ['EXPECTED_NODE_COUNT'])
          plan = Path('.scratch/issue310/acceptance/plan')
          manifest = json.loads((plan / 'manifest/shard-manifest.json').read_text())
          assigned = manifest['shards']['xvfb_ui'][shard_id]['nodes']
          assert len(assigned) == expected_count, (len(assigned), expected_count)
          inherited = set(json.loads((plan / 'expected-xvfb-global.json').read_text()))
          expected = sorted(inherited.intersection(assigned))
          out = Path('.scratch/issue310/acceptance/xvfb') / shard_id / 'expected.json'
          out.write_text(json.dumps(expected, indent=2) + '\n')
          print(f'SHARD={shard_id} NODES={len(assigned)} EXPECTED_T0_RED={len(expected)}')
          PY
      - name: Capture protected hashes before shard
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/xvfb/$SHARD_ID"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-before.sha256"
      - name: Run exact isolated Xvfb shard serially
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/xvfb/$SHARD_ID"
          set +e
          python tools/xvfb_shard_execution.py run \
            --manifest .scratch/issue310/acceptance/plan/manifest/shard-manifest.json \
            --shard "$SHARD_ID" \
            --expected-failures "$root/expected.json" \
            --result-json "$root/result.json" \
            --log "$root/pytest.log" \
            --basetemp "$root/pytest-tmp" \
            --timeout-seconds 1200 \
            --expected-source-sha "$PLAN_SOURCE_SHA" \
            --expected-manifest-sha256 "$PLAN_MANIFEST_SHA256"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/runner-rc.txt"
          test -f "$root/result.json"
          echo "XVFB_RUNNER_RC=$rc"
      - name: Verify protected invariants after shard
        if: always()
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue310/acceptance/xvfb/$SHARD_ID"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-after.sha256"
          cmp "$root/protected-before.sha256" "$root/protected-after.sha256"
          git diff --exit-code
      - name: Upload complete Xvfb shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue310-xvfb-${{ matrix.shard_id }}
          path: .scratch/issue310/acceptance/xvfb/${{ matrix.shard_id }}
          if-no-files-found: error

  aggregate:
    if: always() && needs.plan.result == 'success'
    needs: [plan, non-gui-shard, xvfb-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
      PLAN_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify aggregate checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          test -n "$PLAN_MANIFEST_SHA256"
          test -n "$PLAN_ARTIFACT_DIGEST"
      - name: Download authoritative T6 plan
        uses: actions/download-artifact@v4
        with:
          name: issue310-t6-plan
          path: .scratch/issue310/acceptance/plan
      - name: Download all non-GUI evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue310-nongui-*
          path: .scratch/issue310/acceptance/all-nongui
      - name: Download all Xvfb evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue310-xvfb-*
          path: .scratch/issue310/acceptance/all-xvfb
      - name: Normalize actual artifacts and aggregate fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import defaultdict
          from pathlib import Path
          from tools.test_shard_aggregation import aggregate_shard_results, normalize_shard_artifact, render_unified_summary
          from tools.test_shard_execution import load_execution_config, load_xdist_policy, resolve_xdist_workers
          from tools.test_shard_tuning import KEEP_HRW, decide_manifest_strategy, summarize_lane_imbalance

          plan = Path('.scratch/issue310/acceptance/plan')
          manifest_path = plan / 'manifest/shard-manifest.json'
          manifest_bytes = manifest_path.read_bytes()
          digest = hashlib.sha256(manifest_bytes).hexdigest()
          assert digest == os.environ['PLAN_MANIFEST_SHA256'], (digest, os.environ['PLAN_MANIFEST_SHA256'])
          assert (plan / 'manifest.sha256').read_text().strip() == digest
          assert (plan / 'source.sha').read_text().strip() == os.environ['PLAN_SOURCE_SHA']
          manifest = json.loads(manifest_bytes)
          config_path = Path('config/ci_test_execution.json')
          assert load_execution_config(config_path) == 8
          policy = load_xdist_policy(config_path)

          results = []
          invariants = {}
          xdist_execution = {}
          expected_non_gui = sum(len(shards) for lane, shards in manifest['shards'].items() if lane != 'xvfb_ui')
          non_gui_roots = sorted(Path('.scratch/issue310/acceptance/all-nongui').glob('issue310-nongui-*'))
          assert len(non_gui_roots) == expected_non_gui, (len(non_gui_roots), expected_non_gui)
          for root in non_gui_roots:
              result_path = root / 'shard-result.json'
              junit_path = root / 'result.xml'
              assert result_path.is_file() and junit_path.is_file(), f'NON_GUI_EVIDENCE_MISSING={root}'
              payload = json.loads(result_path.read_text())
              expected_workers = resolve_xdist_workers(policy, lane=payload['lane'], shard_id=payload['shard_id'])
              assert payload['xdist_workers'] == expected_workers, payload
              assert payload['xdist_distribution'] == 'load', payload
              key = f"{payload['lane']}:{payload['shard_id']}"
              xdist_execution[key] = expected_workers
              artifact_name = root.name
              results.append(normalize_shard_artifact(
                  result_payload=payload,
                  junit_xml=junit_path,
                  expected_source_sha=os.environ['PLAN_SOURCE_SHA'],
                  artifact_refs=[f'artifact://{artifact_name}'],
              ))
              before = root / 'protected-before.sha256'
              after = root / 'protected-after.sha256'
              assert before.is_file() and after.is_file(), f'NON_GUI_INVARIANT_MISSING={root}'
              invariants[artifact_name] = {
                  'before': hashlib.sha256(before.read_bytes()).hexdigest(),
                  'after': hashlib.sha256(after.read_bytes()).hexdigest(),
              }
          assert {k for k, v in xdist_execution.items() if v == 2} == {'dxf:s00'}, xdist_execution
          assert all(v in {1, 2} for v in xdist_execution.values()), xdist_execution

          xvfb_roots = sorted(Path('.scratch/issue310/acceptance/all-xvfb').glob('issue310-xvfb-*'))
          assert len(xvfb_roots) == len(manifest['shards']['xvfb_ui']) == 4, len(xvfb_roots)
          for root in xvfb_roots:
              result_path = root / 'result.json'
              junit_path = root / 'result.xml'
              assert result_path.is_file() and junit_path.is_file(), f'XVFB_EVIDENCE_MISSING={root}'
              payload = json.loads(result_path.read_text())
              artifact_name = root.name
              results.append(normalize_shard_artifact(
                  result_payload=payload,
                  junit_xml=junit_path,
                  expected_source_sha=os.environ['PLAN_SOURCE_SHA'],
                  artifact_refs=[f'artifact://{artifact_name}'],
              ))
              before = root / 'protected-before.sha256'
              after = root / 'protected-after.sha256'
              assert before.is_file() and after.is_file(), f'XVFB_INVARIANT_MISSING={root}'
              invariants[artifact_name] = {
                  'before': hashlib.sha256(before.read_bytes()).hexdigest(),
                  'after': hashlib.sha256(after.read_bytes()).hexdigest(),
              }

          summary = aggregate_shard_results(
              manifest=manifest,
              shard_results=results,
              expected_source_sha=os.environ['PLAN_SOURCE_SHA'],
              protected_invariants=invariants,
          )
          assert summary['decision'] == 'GREEN', summary
          assert summary['executed_unique_count'] == summary['full_collection_count'], summary
          assert summary['counts']['failed'] == 13, summary['counts']
          assert summary['counts']['errors'] == 0, summary['counts']
          assert not summary['warnings'], summary['warnings']
          assert len(summary['failures']) == 13, summary['failures']
          assert all(item['classification'] == 'INHERITED_BASELINE_RED' for item in summary['failures']), summary['failures']

          by_lane = defaultdict(list)
          for shard in summary['shards'].values():
              by_lane[shard['lane']].append(float(shard['execution_seconds']))
          imbalance = [summarize_lane_imbalance(lane, values) for lane, values in sorted(by_lane.items()) if len(values) >= 2]
          assert decide_manifest_strategy(imbalance) == KEEP_HRW, imbalance

          summary['manifest_sha256'] = digest
          summary['plan_artifact_digest'] = os.environ['PLAN_ARTIFACT_DIGEST']
          summary['t0_provenance'] = json.loads((plan / 't0-failure-contract.json').read_text())['provenance']
          summary['t6_tuning'] = {
              'concurrency_budget': 8,
              'manifest_strategy': 'KEEP_HRW',
              'ab_proof_run_id': 35134127715,
              'ab_proof_head_sha': 'b4276bf7b16403166f2893f0933d9f59333a5a29',
              'ab_proof_artifact_id': 10462837430,
              'ab_proof_artifact_sha256': '994e1f4cca8f83347d129c6e07cbc83e62a9031a743fd44a4815d7d1c25e416d',
              'xdist_executed_workers': xdist_execution,
              'parallel_xdist_shards': sorted(k for k, v in xdist_execution.items() if v == 2),
              'imbalance_reports': imbalance,
          }
          out = Path('.scratch/issue310/acceptance/aggregate')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'aggregation.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          markdown = render_unified_summary(summary)
          markdown += '\n## T6 tuning\n\n- Job concurrency budget: **8**\n- Manifest strategy: **KEEP_HRW**\n- Exact in-job xdist shard: `dxf:s00` with **2 workers**\n- All other non-GUI shards: **1 worker**\n- Xvfb/Tk: **serial inside each isolated display**\n'
          (out / 'unified-summary.md').write_text(markdown)
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('ISSUE310_T6_AGGREGATION=GREEN')
          print('ISSUE310_MANIFEST_STRATEGY=KEEP_HRW')
          PY
      - name: Publish unified Markdown summary
        run: |
          set -euo pipefail
          cat .scratch/issue310/acceptance/aggregate/unified-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload T6 aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue310-t6-aggregate
          path: .scratch/issue310/acceptance/aggregate
          if-no-files-found: error

  timing:
    if: always() && needs.plan.result == 'success' && needs.aggregate.result == 'success'
    needs: [plan, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download T6 aggregate evidence
        uses: actions/download-artifact@v4
        with:
          name: issue310-t6-aggregate
          path: .scratch/issue310/acceptance/aggregate
      - name: Fetch exact current-run metadata and jobs
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue310/acceptance/timing
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > .scratch/issue310/acceptance/timing/run.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > .scratch/issue310/acceptance/timing/jobs.json
      - name: Classify full optimized execution timing
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.test_shard_tuning import PERFORMANCE_FAIL, classify_performance, job_wait_seconds, summarize_workflow_timing

          root = Path('.scratch/issue310/acceptance/timing')
          run = json.loads((root / 'run.json').read_text())
          jobs = json.loads((root / 'jobs.json').read_text())['jobs']
          aggregate = json.loads(Path('.scratch/issue310/acceptance/aggregate/aggregation.json').read_text())
          assert run['head_sha'] == os.environ['PLAN_SOURCE_SHA'], run['head_sha']
          assert aggregate['source_sha'] == os.environ['PLAN_SOURCE_SHA'], aggregate['source_sha']
          assert aggregate['manifest_sha256'] == os.environ['PLAN_MANIFEST_SHA256'], aggregate['manifest_sha256']
          assert aggregate['decision'] == 'GREEN', aggregate

          required = [job for job in jobs if (
              job['name'] in {'focused', 'plan', 'aggregate'}
              or job['name'].startswith('non-gui-shard (')
              or job['name'].startswith('xvfb-shard (')
          )]
          expected_jobs = 1 + 1 + 20 + 4 + 1
          assert len(required) == expected_jobs, (len(required), expected_jobs, [j['name'] for j in required])
          for job in required:
              assert job['status'] == 'completed' and job['conclusion'] == 'success', job
              assert job['started_at'] and job['completed_at'] and job['created_at'], job
          aggregate_jobs = [job for job in required if job['name'] == 'aggregate']
          assert len(aggregate_jobs) == 1, aggregate_jobs
          aggregate_job = aggregate_jobs[0]
          started = min(job['started_at'] for job in required)
          timing = summarize_workflow_timing(
              created_at=run['created_at'],
              first_required_job_started_at=started,
              final_required_job_completed_at=aggregate_job['completed_at'],
          )
          shard_jobs = [job for job in required if job['name'].startswith('non-gui-shard (') or job['name'].startswith('xvfb-shard (')]
          waits = [job_wait_seconds(created_at=job['created_at'], started_at=job['started_at']) for job in shard_jobs]
          timing['max_shard_job_wait_seconds'] = max(waits)
          timing['performance_classification'] = classify_performance(timing['execution_wall_clock_seconds'])
          timing['target_seconds'] = 720
          timing['hard_ceiling_seconds'] = 900
          timing['source_sha'] = os.environ['PLAN_SOURCE_SHA']
          timing['manifest_sha256'] = os.environ['PLAN_MANIFEST_SHA256']
          timing['concurrency_budget'] = 8
          timing['manifest_strategy'] = 'KEEP_HRW'
          (root / 'timing.json').write_text(json.dumps(timing, indent=2, sort_keys=True) + '\n')
          print(json.dumps(timing, indent=2, sort_keys=True))
          assert timing['performance_classification'] != PERFORMANCE_FAIL, timing
          print(f"EXECUTION_WALL_CLOCK={timing['execution_wall_clock_seconds']:.1f}s")
          print(f"END_TO_END_WALL_CLOCK={timing['end_to_end_wall_clock_seconds']:.1f}s")
          print(f"MAX_SHARD_JOB_WAIT={timing['max_shard_job_wait_seconds']:.1f}s")
          print(f"ISSUE310_PERFORMANCE={timing['performance_classification']}")
          PY
      - name: Publish T6 timing summary
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path('.scratch/issue310/acceptance/timing/timing.json').read_text())
          print('## #310 T6 full optimized timing')
          print()
          print(f"- Tested SHA: `{p['source_sha']}`")
          print(f"- Concurrency budget: **{p['concurrency_budget']}**")
          print(f"- Manifest strategy: **{p['manifest_strategy']}**")
          print(f"- EXECUTION_WALL_CLOCK: **{p['execution_wall_clock_seconds']:.1f}s**")
          print(f"- END_TO_END_WALL_CLOCK: **{p['end_to_end_wall_clock_seconds']:.1f}s**")
          print(f"- Max shard job wait: **{p['max_shard_job_wait_seconds']:.1f}s**")
          print(f"- Performance classification: **{p['performance_classification']}**")
          PY
      - name: Upload T6 timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue310-t6-timing
          path: .scratch/issue310/acceptance/timing/timing.json
          if-no-files-found: error
