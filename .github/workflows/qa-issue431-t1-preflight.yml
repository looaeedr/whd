name: "QA #431 T1 Knowledge Preflight"

on:
  push:
    branches:
      - refactor/issue431-t1-shared-content-host-20260920
    paths:
      - '.github/workflows/qa-issue431-t1-preflight.yml'
      - 'docs/superpowers/checkpoints/issue431-t1-preflight-evidence.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 Knowledge Preflight for T1 planned changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue431-t1
          python tools/phase6_skill_preflight.py \
            --task "Issue #431 T1 Shared-content host and mutually-exclusive mode controller UI change. Create exactly one dedicated Fold Designer left shared-content host for normal part, assembly, and corner-data presentations. Preserve existing active-part, display-mode, visibility, corner-data, geometry, persistence, and callback authorities. Use inherited characterization RED, minimal GREEN, focused regression, GitHub Actions remote QA." \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue431_shared_content_host.py \
            --changed-file .github/workflows/qa-issue431-t1.yml \
            --changed-file docs/superpowers/checkpoints/issue431-t1-journal.md \
            --changed-file docs/superpowers/checkpoints/issue431-t1-checkpoint.json \
            --evidence docs/superpowers/checkpoints/issue431-t1-preflight-evidence.txt \
            > .scratch/issue431-t1/preflight-output.txt
          cat .scratch/issue431-t1/preflight-output.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue431-t1-preflight
          path: |
            .scratch/issue431-t1/preflight-output.txt
            docs/superpowers/checkpoints/issue431-t1-preflight-evidence.txt
