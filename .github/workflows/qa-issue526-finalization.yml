name: QA Issue 526 Executable Finalization

on:
  push:
    branches:
      - qa/issue526-finalization-20260923
    paths:
      - .github/workflows/qa-issue526-finalization.yml

permissions:
  contents: read

jobs:
  finalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch coordination checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coord/dispatch-claims
          git show origin/coord/dispatch-claims:.dispatch/checkpoints/issue-526.json > /tmp/issue-526.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/issue-526.json',encoding='utf-8'))
          assert d['state']=='TERMINAL_SUCCESS'
          assert d['issue']=='526'
          assert d['branch']=='work/issue520-phase6-bridge-residual-reduction-20260923'
          assert d['head_sha']=='185991276c57fa3aeecace562daf89fa7be5b5ae'
          assert d['master_issue']=='520'
          assert d['chain_state']=='NEXT_CHILD_EXECUTABLE'
          assert d['next_issue']=='527'
          print('CHECKPOINT_IDENTITY_GREEN')
          PY

      - name: Authorize finalization
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller authorize-finalization \
            /tmp/issue-526.json \
            --issue 526 \
            --branch work/issue520-phase6-bridge-residual-reduction-20260923 \
            --head-sha 185991276c57fa3aeecace562daf89fa7be5b5ae \
            --proof-out /tmp/issue-526.finalization-proof.json

      - name: Verify finalization proof
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller verify-finalization-proof \
            /tmp/issue-526.json \
            /tmp/issue-526.finalization-proof.json \
            --issue 526 \
            --branch work/issue520-phase6-bridge-residual-reduction-20260923 \
            --head-sha 185991276c57fa3aeecace562daf89fa7be5b5ae
          sha256sum /tmp/issue-526.finalization-proof.json
          cp /tmp/issue-526.finalization-proof.json issue-526.finalization-proof.json

      - uses: actions/upload-artifact@v4
        with:
          name: issue526-finalization-proof
          path: issue-526.finalization-proof.json
          if-no-files-found: error
          retention-days: 14
