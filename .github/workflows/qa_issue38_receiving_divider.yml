name: T2 Receiving Divider Baseline QA

on:
  push:
    branches:
      - feat/38-receiving-divider-baseline
    paths:
      - 'ae_engine/cabinet_types/policy.py'
      - 'ae_engine/cabinet_types/receiving.py'
      - 'ae_engine/door_dividers.py'
      - 'ae_engine/manufacturing_api.py'
      - 'gui.py'
      - 'fold_designer_bridge.py'
      - '基準檔/金庫型/中隔.dxf'
      - 'tests/test_issue38_receiving_divider_baseline.py'
      - '.scratch/issue38_preflight_evidence.txt'
      - '.github/workflows/qa_issue38_receiving_divider.yml'

jobs:
  t2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "bug fix Fold 3D manufacturing baseline: Receiving Divider canonical Fold and fixed holes" \
            --changed-file ae_engine/cabinet_types/policy.py \
            --changed-file ae_engine/cabinet_types/receiving.py \
            --changed-file ae_engine/door_dividers.py \
            --changed-file ae_engine/manufacturing_api.py \
            --changed-file gui.py \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue38_receiving_divider_baseline.py \
            --evidence .scratch/issue38_preflight_evidence.txt
      - name: T2 targeted with config invariant
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          pytest -q -vv \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_phase6_t05_box_body_dividers.py \
            tests/test_assembly_placement_divider.py \
            tests/test_issue37_vault_baseplate_placement.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "config_before=$before"
          echo "config_after=$after"
          test "$before" = "$after"
