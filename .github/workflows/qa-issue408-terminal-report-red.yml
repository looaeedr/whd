name: "QA #408 Immediate terminal report RED"

on:
  push:
    branches:
      - continuity/issue408-immediate-terminal-report-20260920
    paths:
      - 'tests/process/test_issue408_immediate_terminal_report_contract.py'
      - '.github/workflows/qa-issue408-terminal-report-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue408_immediate_terminal_report_contract.py --tb=short | tee /tmp/red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Eq "IMMEDIATE_TERMINAL_PROGRESS_REPORT|Immediate terminal progress report|TERMINAL_EVIDENCE_DELAYED_REPORT_PITFALL" /tmp/red.log
          echo "PASS EXPECTED_TERMINAL_REPORT_RED=1"
