name: T5 Engineering Drawing QA

on:
  push:
    branches:
      - feat/engineering-drawing-dxf-qa
    paths:
      - tests/test_engineering_drawing_integration.py
      - ae_engine/engineering_drawing.py
      - ae_engine/drawing_annotations.py
      - ae_engine/drawing_annotation_layout.py
      - gui.py
      - fold_designer_bridge.py
      - phase6_final_scene_view.py
      - .scratch/engineering-drawing-dxf-qa/T5.preflight.evidence.md
      - .github/workflows/t5-engineering-drawing-qa.yml
  workflow_dispatch:

jobs:
  t5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T5 Engineering Drawing integration regression remote QA" \
            --changed-file tests/test_engineering_drawing_integration.py \
            --changed-file ae_engine/engineering_drawing.py \
            --changed-file gui.py \
            --evidence .scratch/engineering-drawing-dxf-qa/T5.preflight.evidence.md
      - name: Targeted T5
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          python -m py_compile ae_engine/drawing_annotations.py ae_engine/drawing_annotation_layout.py ae_engine/engineering_drawing.py gui.py
          pytest -q tests/test_engineering_drawing_integration.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- config.ini
