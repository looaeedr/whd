name: Issue 484 T6 True Differential Acceptance

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue484-t6-true-differential.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  T0_BASELINE_SHA: 02a58dfe1102db0d3a97ed04f12f5ec1286a68b9

jobs:
  baseline-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout fixed T0 baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$T0_BASELINE_SHA"
          test "$(git rev-parse HEAD)" = "$T0_BASELINE_SHA"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run baseline Headless and retain failures as differential evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .scratch/t6/baseline-headless
          set +e
          python -m pytest -q -ra --tb=short --junitxml=.scratch/t6/baseline-headless/junit.xml             2>&1 | tee .scratch/t6/baseline-headless/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > .scratch/t6/baseline-headless/rc.txt
          test -s .scratch/t6/baseline-headless/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: issue484-true-baseline-headless
          path: .scratch/t6/baseline-headless
          if-no-files-found: error

  candidate-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run candidate Headless and retain failures as differential evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .scratch/t6/candidate-headless
          set +e
          python -m pytest -q -ra --tb=short --junitxml=.scratch/t6/candidate-headless/junit.xml             2>&1 | tee .scratch/t6/candidate-headless/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > .scratch/t6/candidate-headless/rc.txt
          test -s .scratch/t6/candidate-headless/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: issue484-true-candidate-headless
          path: .scratch/t6/candidate-headless
          if-no-files-found: error

  baseline-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout fixed T0 baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$T0_BASELINE_SHA"
          test "$(git rev-parse HEAD)" = "$T0_BASELINE_SHA"
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run baseline Xvfb and retain failures as differential evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .scratch/t6/baseline-xvfb
          set +e
          xvfb-run -a python -m pytest -q -ra --tb=short --junitxml=.scratch/t6/baseline-xvfb/junit.xml             2>&1 | tee .scratch/t6/baseline-xvfb/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > .scratch/t6/baseline-xvfb/rc.txt
          test -s .scratch/t6/baseline-xvfb/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: issue484-true-baseline-xvfb
          path: .scratch/t6/baseline-xvfb
          if-no-files-found: error

  candidate-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run candidate Xvfb and retain failures as differential evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .scratch/t6/candidate-xvfb
          set +e
          xvfb-run -a python -m pytest -q -ra --tb=short --junitxml=.scratch/t6/candidate-xvfb/junit.xml             2>&1 | tee .scratch/t6/candidate-xvfb/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > .scratch/t6/candidate-xvfb/rc.txt
          test -s .scratch/t6/candidate-xvfb/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: issue484-true-candidate-xvfb
          path: .scratch/t6/candidate-xvfb
          if-no-files-found: error

  differential-classifier:
    needs: [baseline-headless, candidate-headless, baseline-xvfb, candidate-xvfb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue484-true-baseline-headless
          path: evidence/baseline-headless
      - uses: actions/download-artifact@v4
        with:
          name: issue484-true-candidate-headless
          path: evidence/candidate-headless
      - uses: actions/download-artifact@v4
        with:
          name: issue484-true-baseline-xvfb
          path: evidence/baseline-xvfb
      - uses: actions/download-artifact@v4
        with:
          name: issue484-true-candidate-xvfb
          path: evidence/candidate-xvfb
      - name: Classify candidate-only failures and errors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def read(label):
              path = Path("evidence") / label / "junit.xml"
              root = ET.parse(path).getroot()
              failures, errors = set(), set()
              passed = skipped = total = 0
              for case in root.iter("testcase"):
                  total += 1
                  key = f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}"
                  if case.find("failure") is not None:
                      failures.add(key)
                  elif case.find("error") is not None:
                      errors.add(key)
                  elif case.find("skipped") is not None:
                      skipped += 1
                  else:
                      passed += 1
              return {
                  "total": total, "passed": passed, "skipped": skipped,
                  "failures": failures, "errors": errors,
              }

          lanes = [
              ("headless", read("baseline-headless"), read("candidate-headless")),
              ("xvfb", read("baseline-xvfb"), read("candidate-xvfb")),
          ]
          bad = False
          for lane, baseline, candidate in lanes:
              candidate_only_failures = sorted(candidate["failures"] - baseline["failures"])
              candidate_only_errors = sorted(candidate["errors"] - baseline["errors"])
              print(
                  f"ISSUE484_{lane.upper()}_TOTALS "
                  f"baseline={baseline['passed']}pass/{len(baseline['failures'])}fail/"
                  f"{len(baseline['errors'])}error/{baseline['skipped']}skip "
                  f"candidate={candidate['passed']}pass/{len(candidate['failures'])}fail/"
                  f"{len(candidate['errors'])}error/{candidate['skipped']}skip"
              )
              print(f"ISSUE484_{lane.upper()}_CANDIDATE_ONLY_FAILURES={candidate_only_failures}")
              print(f"ISSUE484_{lane.upper()}_CANDIDATE_ONLY_ERRORS={candidate_only_errors}")
              if candidate_only_failures or candidate_only_errors:
                  bad = True
          if bad:
              raise SystemExit("candidate-only differential is non-empty")
          print("ISSUE484_TRUE_DIFFERENTIAL_GREEN")
          PY

  architecture-and-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot protected config and DXF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/t6/protected
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > .scratch/t6/protected/before.sha256
      - name: Verify R1-R4 and focused behavior after remediation
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_phase6_assembly_3d_view.py::test_bridge_assembly_bundle_is_backward_compatible_with_legacy_scene_contract             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_issue483_t5_bridge_dead_glue_cleanup.py             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py             tests/test_issue396_phase4_composition_root.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_phase6_settings_center_bridge.py             tests/test_phase6_designer_workspace.py             tests/test_fold_designer_joint_state.py             tests/test_issue41_persistence_parity.py             tests/test_resolved_manufacturing_bridge.py             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py
      - name: Verify protected invariants unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > .scratch/t6/protected/after.sha256
          cmp .scratch/t6/protected/before.sha256 .scratch/t6/protected/after.sha256
          git diff --exit-code
          echo "ISSUE484_R1_R4_G1_G4_GREEN"
