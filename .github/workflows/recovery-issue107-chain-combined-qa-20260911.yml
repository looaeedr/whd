name: recovery-issue107-chain-combined-qa-20260911

on:
  push:
    branches:
      - recovery/issue107-chain-plus-second-batch-20260911
    paths:
      - '.github/workflows/recovery-issue107-chain-combined-qa-20260911.yml'

permissions:
  contents: write

env:
  RECOVERY_BRANCH: recovery/issue107-chain-plus-second-batch-20260911
  RED_BASE: 5f82aecbd656185b0de1559bac5d559be04db5aa

jobs:
  guarded-selection-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/issue107-chain-plus-second-batch-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact controller lineage
        run: |
          git fetch origin "$RECOVERY_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$RECOVERY_BRANCH)"
          test "$(git rev-parse HEAD^)" = "$RED_BASE"
          test "$(git -c core.quotePath=false diff --name-only HEAD^ HEAD)" = ".github/workflows/recovery-issue107-chain-combined-qa-20260911.yml"
          echo "CONTROLLER_HEAD=$(git rev-parse HEAD)"
      - name: Install focused-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Re-run changed-file preflight before write
        run: |
          cat > /tmp/issue112-preflight-evidence.txt <<'EOF'
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          驗證板件與DXF
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task '#112 recovery: split stable box_body navigation identity from Receiving physical-child authority' \
            --changed-file 'fold_designer_bridge.py' \
            --evidence /tmp/issue112-preflight-evidence.txt
      - name: Prove exact requirement RED before repair
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          pytest -q tests/test_issue96_corner_data_selection_lifecycle.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q '2 failed' /tmp/red.log
          grep -q 'test_multipart_box_body_parent_identity_is_not_hijacked_by_remembered_child' /tmp/red.log
          grep -q 'test_corner_data_selection_callback_resolves_identity_without_activating_workspace' /tmp/red.log
      - name: Snapshot invariants
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Apply family-scoped Corner Data selection repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fold_designer_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if requested == "box_body" or _phase6_is_box_body_physical_piece_key(requested):\n        resolved = _phase6_resolve_operator_part_key(self, requested)\n    else:\n        resolved = requested\n'''
          new = '''    if requested == "box_body":\n        resolved = (\n            _phase6_resolve_operator_part_key(self, requested)\n            if _phase6_current_cabinet_family(self) == "受電箱"\n            else requested\n        )\n    elif _phase6_is_box_body_physical_piece_key(requested):\n        resolved = _phase6_resolve_operator_part_key(self, requested)\n    else:\n        resolved = requested\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'selection seam: expected exactly 1 match, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Focused parent child and Receiving GREEN
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          xvfb-run -a pytest -q \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_box_body_single_source_t3.py \
            tests/test_issue109_corner_data_boxbody_tree.py \
            tests/test_issue110_shared_info_projection.py \
            tests/test_issue111_corner_data_grid_isolation.py \
            | tee /tmp/focused.log
      - name: Verify invariants and one-file production diff
        run: |
          sha256sum config.ini > /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/baseline.before /tmp/baseline.after
          test "$(git -c core.quotePath=false diff --name-only)" = "fold_designer_bridge.py"
      - name: Commit and push verified selection repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- fold_designer_bridge.py
          git commit -m 'fix(recovery): preserve box-body parent selection outside Receiving'
          git push origin "HEAD:$RECOVERY_BRANCH"
          echo "REPAIR_HEAD=$(git rev-parse HEAD)"
