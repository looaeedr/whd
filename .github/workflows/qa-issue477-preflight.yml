name: Issue 477 Preflight Gate

on:
  push:
    branches:
      - process/issue477-skill-write-preflight-hard-gate-20260922

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical Phase6 Knowledge Preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "補強 Skill mutation 硬閘門：任何 .agents/skills/**/SKILL.md write/commit 必須先完成 寫技能 Phase6 Preflight，execution_claim_guard 缺少 changed-file 或 preflight evidence 時 fail closed。" \
            --changed-file "tools/execution_claim_guard.py" \
            --changed-file "tests/process/test_issue256_execution_claim_guard.py" \
            --changed-file "AGENTS.md" \
            --changed-file ".agents/skills/engineering/寫技能/SKILL.md" \
            --changed-file ".agents/skills/engineering/派工/SKILL.md" \
            --evidence "docs/superpowers/checkpoints/issue477-skill-write-preflight-evidence.md"
