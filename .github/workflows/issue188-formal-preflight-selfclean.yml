name: issue188-formal-preflight-selfclean
on:
  push:
    branches:
      - feat/issue188-dark-engineering-theme-20260913
    paths:
      - .github/workflows/issue188-formal-preflight-selfclean.yml
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-clean preflight harness
        shell: bash
        run: |
          git config user.name looaeedr
          git config user.email 76246585+looaeedr@users.noreply.github.com
          rm .github/workflows/issue188-formal-preflight-selfclean.yml
          git add -A
          git commit -m 'chore(issue188): remove formal preflight harness'
          git push origin HEAD:feat/issue188-dark-engineering-theme-20260913
          echo "ISSUE188_PREFLIGHT_CLEAN_SHA=$(git rev-parse HEAD)"
      - name: Build verified evidence file
        shell: bash
        run: |
          cat > /tmp/issue188-evidence.txt <<'EOF'
          REQUIRED SKILLS READ:
          截角資料入口收斂
          UI設計與去AI味
          派工
          issue-closure-gate
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD截角資料與2D入口收斂規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/dm7_part_navigation_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
      - name: Formal changed-file preflight
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task '#188 T3 WHD dark engineering theme 3D readability Tk ttk Matplotlib UI text scale 1.0 1.2 1.4 Corner Data Output DXF persistence config invariant 派工' \
            --changed-file whd_theme.py \
            --changed-file gui.py \
            --changed-file fold_designer_original.py \
            --changed-file fold_designer_bridge.py \
            --changed-file phase6_settings_panel.py \
            --changed-file phase6_final_scene_view.py \
            --changed-file tests/test_issue188_dark_theme_readability.py \
            --evidence /tmp/issue188-evidence.txt
