name: T5 Nested Phase6 Settings QA

on:
  push:
    branches:
      - fix/phase6-nested-settings-normalization-t5-rebase-20260907
    paths:
      - "fold_designer_bridge.py"
      - "tests/test_phase6_t5_nested_settings_normalization.py"
      - ".github/workflows/t5-nested-settings-qa.yml"

permissions:
  contents: read

jobs:
  t5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Knowledge Preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T5 #30 fix regression in Fold Designer 3D compatibility snapshot load with remote QA; normalize nested settings before canonical Fold Profile construction without creating a second Source of Truth" \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_phase6_t5_nested_settings_normalization.py \
            --changed-file .github/workflows/t5-nested-settings-qa.yml \
            --evidence logs/box_body_single_source/T5.preflight.txt
      - name: Static compile
        run: python -m py_compile fold_designer_bridge.py

      - name: Expanded nested-settings regression
        shell: bash
        run: |
          set +e
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t5_nested_settings_normalization.py \
            tests/test_phase6_assembly_3d_view.py \
            tests/test_receiving_door_frame_width_semantics.py \
            tests/test_receiving_door_dimension_projection_semantics.py \
            tests/test_box_body_single_source_t1.py \
            tests/test_box_body_single_source_t2.py \
            tests/test_box_body_single_source_t3.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_t06_receiving_fresh_family.py \
            tests/test_phase6_t25_combined_receiving_acceptance.py \
            > t5.log 2>&1
          rc=$?
          after="$(sha256sum config.ini | awk '{print $1}')"
          cat t5.log
          printf '{"pytest_rc":%s,"config_before":"%s","config_after":"%s"}\n' "$rc" "$before" "$after" > t5_state.json
          cat t5_state.json
          if [ "$before" != "$after" ]; then
            echo "config.ini mutated" >&2
            exit 97
          fi
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5-nested-settings-${{ github.run_id }}
          path: |
            t5.log
            t5_state.json
