name: "QA #342 T9 Final Combined Acceptance"

on:
  push:
    branches:
      - qa/issue342-final-combined-20260918
  workflow_dispatch:

permissions:
  contents: read

env:
  T9_BASE: "6b04fb2bb72d9c251c979167530dee04ab4a372e"

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#342)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact final-manifest RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue342_final_acceptance.py::test_t9_final_acceptance_manifest_exists_and_is_complete > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#342 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  manifest-authority:
    if: ${{ contains(github.event.head_commit.message, 'green(#342)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Final manifest + no-second-authority contract
        run: python -m pytest -q tests/test_issue342_final_acceptance.py

  focused-authority:
    if: ${{ contains(github.event.head_commit.message, 'green(#342)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused runtime deps
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib pillow
      - name: Save/reload selector renderer authority regressions
        run: |
          python -m pytest -q             tests/test_dm6_save_reload_semantic_determinism.py             tests/test_issue175_dm7_navigation_authority_contract.py             tests/test_issue211_renderer_dependency_gate.py             tests/test_issue293_t5_session_authority_slice.py             tests/test_phase6_3d_single_source_renderer.py             tests/test_phase6_designer_workspace.py             tests/test_phase6_project_file.py             tests/test_phase6_t10_project_authority.py             tests/test_phase6_workspace_controller.py             tests/test_issue334_shared_menu_theme.py             tests/test_issue335_top_toolbar.py             tests/test_issue336_left_content_switch.py             tests/test_issue337_control_hierarchy.py             tests/test_issue338_contrast_readability.py             tests/test_issue339_corner_presentation_fail_closed.py             tests/test_issue340_keyboard_focus.py             tests/test_issue343_t8_visual_remediation.py

  full-headless:
    if: ${{ contains(github.event.head_commit.message, 'green(#342)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full runtime deps
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib pillow
      - name: Full headless regression
        run: python -m pytest -q
      - name: Protected runtime files unchanged after headless
        shell: bash
        run: |
          git status --porcelain --untracked-files=all -- config.ini '基準檔' | tee protected-status.txt
          test ! -s protected-status.txt

  full-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#342)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full GUI runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib pillow
      - name: Full Xvfb regression
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest -q
      - name: Protected runtime files unchanged after Xvfb
        shell: bash
        run: |
          git status --porcelain --untracked-files=all -- config.ini '基準檔' | tee protected-status.txt
          test ! -s protected-status.txt

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#342)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final candidate must be validation-only
        shell: bash
        run: |
          git diff --name-only "$T9_BASE"...HEAD | tee changed.txt
          python - <<'PY'
          import os
          from pathlib import Path
          changed = {x.strip() for x in Path("changed.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          allowed_prefixes = (
              ".github/workflows/qa-issue342-",
              "tests/test_issue342_",
              "docs/superpowers/checkpoints/issue342-",
          )
          bad = sorted(p for p in changed if not p.startswith(allowed_prefixes))
          if bad:
              raise SystemExit(f"#342 final candidate product drift: {bad}")
          print("#342 protected drift PASS", sorted(changed))
          PY
