name: Issue94 T1 Worker
on:
  push:
    branches: [feat/issue94-corner-data-navigation-mode-20260910]
    paths:
      - .github/workflows/issue94-t1-worker.yml

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Apply minimal T1 production change
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('fold_designer_bridge.py')
          text = p.read_text(encoding='utf-8')

          marker = 'def _phase6_show_assembly(self, initial=False):\n'
          assert marker in text, 'show assembly marker missing'
          assert 'def _phase6_show_corner_data(self):' not in text, 'corner-data mode already exists'
          helper = '''def _phase6_show_corner_data(self):
              """Switch Fold Designer to the view-only corner-data navigation mode.

              This mode is navigation only: it must not flush/publish settings, add a
              manufacturing part, or alter workspace selection/state. T2 will populate
              the authoritative part projection inside the mode panel.
              """
              self._phase6_3d_display_mode = "corner_data"
              if hasattr(self, "part_var"):
                  self.part_var.set("截角資料")

              piece_selector = getattr(self, "box_body_piece_selector", None)
              if piece_selector is not None and hasattr(piece_selector, "pack_forget"):
                  try:
                      piece_selector.pack_forget()
                  except Exception:
                      pass

              fold_host = getattr(self, "fold_editor_host", None)
              if fold_host is not None and hasattr(fold_host, "pack_forget"):
                  fold_host.pack_forget()

              assembly_panel = getattr(self, "assembly_parts_panel", None)
              if assembly_panel is not None and hasattr(assembly_panel, "pack_forget"):
                  assembly_panel.pack_forget()

              panel = getattr(self, "corner_data_panel", None)
              if panel is None and getattr(self, "left", None) is not None:
                  panel = original.ttk.Frame(self.left, padding=6)
                  self.corner_data_panel = panel
              if panel is not None and hasattr(panel, "pack"):
                  panel.pack(fill=original.tk.BOTH, expand=True, pady=(0, 8))

              refresh = getattr(self, "_refresh_part_button_states", None)
              if callable(refresh):
                  refresh()


          '''
          text = text.replace(marker, helper + marker, 1)

          menu_pattern = re.compile(
              r'(\s+menu\.add_radiobutton\(\n'
              r'\s+label="組合體",\n'
              r'\s+variable=self\.part_var,\n'
              r'\s+value="組合體",\n'
              r'\s+command=lambda: _phase6_show_assembly\(self\),\n'
              r'\s+\)\n)(\s+for key in _phase6_operator_part_selector_keys\(self\.available_parts\):)'
          )
          match = menu_pattern.search(text)
          assert match, 'part menu block missing'
          indent = re.match(r'\s*', match.group(2)).group(0)
          corner_item = (
              f'{indent}menu.add_radiobutton(\n'
              f'{indent}    label="截角資料",\n'
              f'{indent}    variable=self.part_var,\n'
              f'{indent}    value="截角資料",\n'
              f'{indent}    command=lambda: _phase6_show_corner_data(self),\n'
              f'{indent})\n'
          )
          text = text[:match.start()] + match.group(1) + corner_item + match.group(2) + text[match.end():]

          mode_pattern = re.compile(
              r'(\s+if mode == "assembly":\n\s+self\.part_var\.set\("組合體"\)\n)'
              r'(\s+elif _phase6_is_box_body_physical_piece_key\(active\):)'
          )
          match = mode_pattern.search(text)
          assert match, 'mode label block missing'
          indent = re.match(r'\s*', match.group(2)).group(0)
          corner_mode = f'{indent}elif mode == "corner_data":\n{indent}    self.part_var.set("截角資料")\n'
          text = text[:match.start()] + match.group(1) + corner_mode + match.group(2) + text[match.end():]

          assembly_anchor = '    assembly_panel = getattr(self, "assembly_parts_panel", None)\n'
          assembly_pos = text.find(assembly_anchor, text.find(marker))
          assert assembly_pos >= 0, 'assembly panel anchor missing in show_assembly'
          hide_corner = (
              '    corner_data_panel = getattr(self, "corner_data_panel", None)\n'
              '    if corner_data_panel is not None and hasattr(corner_data_panel, "pack_forget"):\n'
              '        corner_data_panel.pack_forget()\n'
          )
          text = text[:assembly_pos] + hide_corner + text[assembly_pos:]

          p.write_text(text, encoding='utf-8')
          PY
      - name: T1 focused GREEN
        run: pytest -q tests/test_issue94_corner_data_navigation_mode.py
      - name: Syntax/import guard
        run: python -m py_compile fold_designer_bridge.py
      - name: Commit worker result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py
          git commit -m 'feat(issue94): add corner-data navigation mode'
          git push origin HEAD:feat/issue94-corner-data-navigation-mode-20260910
