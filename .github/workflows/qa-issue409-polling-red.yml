name: "QA #409 Polling observation RED"

on:
  push:
    branches:
      - continuity/issue409-polling-observation-only-20260920
    paths:
      - 'tests/process/test_issue409_polling_observation_only_contract.py'
      - '.github/workflows/qa-issue409-polling-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue409_polling_observation_only_contract.py --tb=short | tee /tmp/red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Eq "POLLING_OBSERVATION_ONLY|REAL_PROGRESS_PRODUCER_GATE|POLLING_WITHOUT_PROGRESS_PRODUCER_PITFALL" /tmp/red.log
          echo "PASS EXPECTED_POLLING_RED=1"
