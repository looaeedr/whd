name: DM2 Final QA
on:
  push:
    branches:
      - work/dm2-divider-physical-contract
    paths:
      - .github/workflows/dm2-targeted.yml

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record locked evidence
        shell: bash
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "BASE_SHA=154a4e5098b340dc80d73cae1f9d2aa895b9bdc1"
          sha256sum config.ini | tee /tmp/config.before
          git status --short
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: DM2 physical contract GREEN
        run: pytest -q tests/test_dm1_divider_physical_contract.py
      - name: Assembly collision regressions
        run: pytest -q tests/test_assembly_collision.py tests/test_assembly_collision_integration.py
      - name: T48-1 FW face flush regression
        run: pytest -q tests/test_issue48_receiving_fw_flush_red.py
      - name: Divider 6p4 shared datum regression
        run: pytest -q tests/test_issue40_divider_6p4_shared_datum.py
      - name: Receiving and Vault family guards
        run: >-
          pytest -q
          tests/test_issue43_receiving_divider_t1.py
          tests/test_receiving_cabinet_type.py
          tests/test_phase6_cabinet_family_policy.py
          tests/test_phase6_t11_family_preset_switching.py
          tests/test_overlay_formed_fw_registry_contract.py
          tests/test_issue37_vault_baseplate_placement.py
      - name: Raw index leak scan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              Path('ae_engine/manufacturing_api.py'): ('"frame_width_segment_index"', '"core_segment_index"'),
              Path('fold_designer_bridge.py'): ('metadata.get("frame_width_segment_index")', 'metadata.get("core_segment_index")'),
          }
          bad=[]
          for p, tokens in checks.items():
              text=p.read_text(encoding='utf-8')
              for token in tokens:
                  if token in text:
                      bad.append(f'{p}:{token}')
          if bad:
              raise SystemExit('raw sink index leak remains: ' + ', '.join(bad))
          print('RAW_INDEX_LEAK_SCAN=PASS')
          PY
      - name: Base to final drift audit
        shell: bash
        run: |
          git diff --name-status 154a4e5098b340dc80d73cae1f9d2aa895b9bdc1...HEAD | tee /tmp/dm2-drift.txt
          python - <<'PY'
          from pathlib import Path
          allowed = (
              'ae_engine/door_dividers.py',
              'ae_engine/manufacturing_api.py',
              'fold_designer_bridge.py',
              'tests/test_dm1_divider_physical_contract.py',
              '.github/workflows/dm2-',
              'docs/superpowers/plans/',
              '.scratch/dm2/',
          )
          bad=[]
          for line in Path('/tmp/dm2-drift.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              path=line.split('\t')[-1]
              if not any(path == p or path.startswith(p) for p in allowed):
                  bad.append(line)
          if bad:
              raise SystemExit('unexpected DM2 drift:\n' + '\n'.join(bad))
          print('DM2_DRIFT_AUDIT=PASS')
          PY
      - name: Config invariant and clean tree
        shell: bash
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          test -z "$(git status --porcelain)"
          echo "CONFIG_INVARIANT=PASS"
          echo "CLEAN_TREE=PASS"
