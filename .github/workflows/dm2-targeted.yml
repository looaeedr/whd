name: DM2 Final QA
on:
  push:
    branches:
      - work/dm2-divider-physical-contract
    paths:
      - .github/workflows/dm2-targeted.yml

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record locked evidence
        shell: bash
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "BASE_SHA=154a4e5098b340dc80d73cae1f9d2aa895b9bdc1"
          sha256sum config.ini | tee /tmp/config.before
          git status --short
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: DM2 physical contract GREEN
        run: pytest -q tests/test_dm1_divider_physical_contract.py
      - name: Assembly collision regressions
        run: pytest -q tests/test_assembly_collision.py tests/test_assembly_collision_integration.py
      - name: Receiving Vault Divider family guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          candidates = []
          for p in Path('tests').glob('test_*.py'):
              text = p.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'(?i)receiving|vault|divider', text):
                  candidates.append(str(p))
          # Exclude the already-run focused and very broad collision files.
          candidates = [p for p in candidates if p not in {
              'tests/test_dm1_divider_physical_contract.py',
              'tests/test_assembly_collision.py',
              'tests/test_assembly_collision_integration.py',
          }]
          print('FAMILY_GUARD_FILES', len(candidates))
          print('\n'.join(candidates))
          if not candidates:
              raise SystemExit('no receiving/vault/divider family guard tests discovered')
          cmd = [sys.executable, '-m', 'pytest', '-q', *candidates, '-k', 'receiving or vault or divider']
          raise SystemExit(subprocess.call(cmd))
          PY
      - name: Raw index leak scan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ('frame_width_segment_index', 'core_segment_index')
          sink_files = [
              Path('ae_engine/manufacturing_api.py'),
              Path('fold_designer_bridge.py'),
          ]
          bad = []
          for p in sink_files:
              text = p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      bad.append(f'{p}:{token}')
          if bad:
              raise SystemExit('raw index leak remains in sink: ' + ', '.join(bad))
          print('RAW_INDEX_LEAK_SCAN=PASS')
          PY
      - name: Base to final drift audit
        shell: bash
        run: |
          git diff --name-status 154a4e5098b340dc80d73cae1f9d2aa895b9bdc1...HEAD | tee /tmp/dm2-drift.txt
          python - <<'PY'
          from pathlib import Path
          allowed_prefixes = (
              'ae_engine/door_dividers.py',
              'ae_engine/manufacturing_api.py',
              'fold_designer_bridge.py',
              'tests/test_dm1_divider_physical_contract.py',
              '.github/workflows/dm2-',
              'docs/plans/',
              '.scratch/dm2/',
          )
          bad=[]
          for line in Path('/tmp/dm2-drift.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              path=line.split('\t')[-1]
              if not any(path == p or path.startswith(p) for p in allowed_prefixes):
                  bad.append(line)
          if bad:
              raise SystemExit('unexpected DM2 drift:\n' + '\n'.join(bad))
          print('DM2_DRIFT_AUDIT=PASS')
          PY
      - name: Config invariant and clean tree
        shell: bash
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          test -z "$(git status --porcelain)"
          echo "CONFIG_INVARIANT=PASS"
          echo "CLEAN_TREE=PASS"
