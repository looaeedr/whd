name: Issue111 Exact Head QA
on:
  push:
    branches: [fix/issue111-corner-data-grid-isolation-20260911]
    paths:
      - .github/workflows/issue111-corner-data-grid-apply.yml

permissions:
  contents: read

jobs:
  exact-head-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue111-corner-data-grid-isolation-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Lock exact branch head
        run: |
          git fetch origin fix/issue111-corner-data-grid-isolation-20260911
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/issue111-corner-data-grid-isolation-20260911)"
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Phase6 QA preflight
        run: |
          cat > /tmp/issue111-preflight-evidence.txt <<'EOF'
          派工
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          驗證板件與DXF
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task '#111 exact-head QA：Corner Data grid isolation；preserve other grid callers' \
            --changed-file gui.py \
            --changed-file tests/test_issue111_corner_data_grid_isolation.py \
            --evidence /tmp/issue111-preflight-evidence.txt
      - name: Exact-head focused plus inherited contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          pytest -q \
            tests/test_issue111_corner_data_grid_isolation.py \
            tests/test_issue110_shared_info_projection.py \
            tests/test_issue109_corner_data_boxbody_tree.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            | tee /tmp/issue111-exact-head.log
      - name: Verify production delta and DXF isolation
        run: |
          BASE=163dd5d6a9416887fb65b75d329ce56d62793236
          git diff "$BASE"..HEAD -- gui.py | tee /tmp/issue111-gui.diff
          test "$(git diff --numstat "$BASE"..HEAD -- gui.py | awk '{print $1}')" = "0"
          test "$(git diff --numstat "$BASE"..HEAD -- gui.py | awk '{print $2}')" = "1"
          grep -q -- '-        self.draw_grid(canvas, cw, ch)' /tmp/issue111-gui.diff
          test "$(grep -c '^[-+]        self.draw_grid(canvas, cw, ch)' /tmp/issue111-gui.diff)" = "1"
          test -z "$(git diff --name-only "$BASE"..HEAD -- '基準檔/**')"
      - name: Verify config invariant
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
      - name: Verify branch did not move during QA
        run: |
          git fetch origin fix/issue111-corner-data-grid-isolation-20260911
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/issue111-corner-data-grid-isolation-20260911)"
          echo "EXACT_HEAD_QA=PASS"
