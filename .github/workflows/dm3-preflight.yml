name: DM3 Preflight
on:
  push:
    branches:
      - work/dm3-divider-canonical-relief
    paths:
      - .github/workflows/dm3-preflight.yml
      - .scratch/dm3/phase6_preflight_evidence.md
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase6 Knowledge Preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "Issue #53 DM3 Divider canonical relief、final material 與 placement datum 單源化；FW physical face/formed geometry 先建立合法 placement，再由真實 multi-piece BoxBody collision/backprojection 求 canonical relief；verified 必含 placement/collision evidence；保持 T48-2，禁止固定 world Z、bbox center、174、47/26、1mm probe、renderer/exporter/GUI geometry patch、duplicate relief state"
          --evidence .scratch/dm3/phase6_preflight_evidence.md
