name: WHD #540 main 遠端守門 claim-takeover GREEN
run-name: "WHD｜#540｜main 遠端守門 claim-takeover GREEN"

on:
  push:
    branches:
      - hotfix/issue540-main-remote-guard-takeover-20260923
    paths:
      - .github/workflows/whd-remote-execution-guard.yml
      - tests/process/test_issue540_main_remote_guard_contract.py
      - .github/workflows/qa-issue540-main-remote-guard-green.yml

permissions:
  contents: read

jobs:
  green:
    name: 驗證 main 遠端守門 claim-takeover 接線
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝 pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: 執行 claim-takeover GREEN contract
        run: python -m pytest -q tests/process/test_issue540_main_remote_guard_contract.py
