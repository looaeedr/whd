name: QA issue293 composition root handoff GREEN

on:
  push:
    branches:
      - refactor/issue293-composition-root-handoff-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply composition root handoff
        run: python tools/qa_issue293_composition_root_handoff_green.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Compile extracted editor modules
        run: python -m py_compile gui.py gui_modules/editors/hole_editor.py gui_modules/editors/hole_editor_view.py gui_modules/editors/hole_editor_composition.py
      - name: Verify dependency adapter fail-closed resolution
        run: |
          python - <<'PY'
          import gui
          from gui_modules.editors.hole_editor_composition import HoleEditorCompositionDependencies
          HoleEditorCompositionDependencies.from_namespace(vars(gui))
          print('COMPOSITION_DEPENDENCIES_OK')
          PY
      - name: Verify architecture and authority GREEN
        run: >-
          python -m pytest -q
          tests/test_issue293_t5_composition_root_handoff.py
          tests/test_issue293_gui_phase2_t5_editors.py
          tests/test_issue293_t5_session_authority_slice.py
          tests/test_issue293_t5_canvas_authority_slice.py
          tests/test_issue293_t5_window_shell_slice.py
          tests/test_issue293_t5_indicator_panel_builder_slice.py
          tests/test_issue293_t5_catalog_sidebar_builder_slice.py
          tests/test_issue293_t5_center_workspace_builder_slice.py
          tests/test_issue293_t5_fullscreen_actions_slice.py
      - name: Verify diff and residual size
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('gui.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text)
          host=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='Phase6ApplicationHost')
          fn=next(n for n in host.body if isinstance(n,ast.FunctionDef) and n.name=='_open_unified_hole_editor')
          print(f'ROOT_SPAN={fn.end_lineno-fn.lineno+1}')
          print(f'GUI_LOC={len(text.splitlines())}')
          PY
      - name: Commit GREEN after verification
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add gui.py gui_modules/editors/hole_editor_composition.py
          git diff --cached --check
          git commit -m "refactor(#293): hand off unified editor composition root"
          git push origin HEAD:${GITHUB_REF_NAME}
