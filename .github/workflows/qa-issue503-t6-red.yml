name: "QA #503 T6 Live-sync RED"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue503-t6-red.yml'

permissions:
  contents: read

jobs:
  t6-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused harness
        run: python -m pip install pytest
      - name: Run expected R6 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue503_live_sync_publication_plan.py --tb=short > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "LiveSyncPublicationPlan|plan_live_sync_envelope|plan_then_effect_boundary|AttributeError|AssertionError" /tmp/red.log
          echo "ISSUE503_R6_EXPECTED_RED=1"
          exit 0
