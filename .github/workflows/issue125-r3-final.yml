name: Issue 125 R3 Final Acceptance
on:
  push:
    branches: [work/issue-125-inspector-property-panel-20260912-r3]
    paths: [.github/workflows/issue125-r3-final.yml]
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Lock latest production ancestry
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "c0a26880756861311cccce6fced0d8828c2aff29"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "c0a26880756861311cccce6fced0d8828c2aff29"
      - name: Install GUI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Snapshot invariants
        run: |
          sha256sum config.ini > /tmp/config.before
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baselines.before
      - name: Inspector focused Xvfb
        run: timeout 300s xvfb-run -a -s '-screen 0 1600x1000x24' python -m pytest -q tests/test_issue125_inspector_property_panel.py
      - name: UI persistence and authority regression
        run: python -m pytest -q tests/test_settings_center.py tests/test_phase6_settings_panel.py tests/test_save_reload.py tests/test_dxf_export.py
      - name: Invariants
        run: |
          sha256sum config.ini > /tmp/config.after
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baselines.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baselines.before /tmp/baselines.after
          git diff --exit-code -- config.ini 基準檔
