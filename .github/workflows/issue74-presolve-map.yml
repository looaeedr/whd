name: Issue74 PreSolve True Thickness Map
on:
  push:
    branches: [fix/issue74-divider-side-front-penetration]
    paths: [.github/workflows/issue74-presolve-map.yml]
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib -r requirements.txt
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          import fold_designer_bridge as bridge
          from tests.test_issue39_divider_relief import _snapshot,_body_part,_divider_part
          from ae_engine.assembly_collision import _triangle_pair_crossing_segment,_barycentric_world_to_flat
          snap=_snapshot(); body=_body_part(snap); divider,dp=_divider_part(snap)
          world=bridge._phase6_build_joint_world_geometry((body,dp),(snap["w"],snap["h"],snap["d"]),snap["t"])
          tgt=tuple(world["mapped_skin_triangles_by_part"][divider.stable_id])
          pieces={f"box_body:{p.role}":p for p in body.render_data.pieces}
          out={}
          for key in ("box_body:left_side","box_body:right_side"):
              piece=pieces[key]; bands=[]; cur=0.0
              for row in piece.fold_profile:
                  nxt=cur+float(row.length); bands.append((str(row.phase6_key),cur,nxt)); cur=nxt
              srcs=tuple(world["mapped_skin_triangles_by_part"][key]); rows={}
              for name,u0,u1 in bands:
                  side_segments=defaultdict(list)
                  for src in srcs:
                      su=[float(p[0]) for p in src.flat]
                      if max(su)<u0-1e-6 or min(su)>u1+1e-6: continue
                      for tar in tgt:
                          seg=_triangle_pair_crossing_segment(src.world,tar.world,tolerance=1e-7)
                          if not seg: continue
                          try:
                              ms=[_barycentric_world_to_flat(p,src.world,src.flat) for p in seg]
                              mt=[_barycentric_world_to_flat(p,tar.world,tar.flat) for p in seg]
                          except Exception: continue
                          mu=sum(float(p[0]) for p in ms)/2.0
                          if not (u0-1e-5 <= mu <= u1+1e-5): continue
                          side_segments[int(src.side)].append(mt)
                  both=bool(side_segments.get(-1) and side_segments.get(1))
                  pts=[p for segs in side_segments.values() for seg in segs for p in seg]
                  rows[name]={
                      "counts":{str(k):len(v) for k,v in side_segments.items()},
                      "crosses_both_skins":both,
                      "divider_uv_bounds":None if not pts else [
                        min(float(p[0]) for p in pts),max(float(p[0]) for p in pts),
                        min(float(p[1]) for p in pts),max(float(p[1]) for p in pts)]
                  }
              out[key]=rows
          print("ISSUE74_PRESOLVE_MAP="+json.dumps(out,ensure_ascii=False))
          PY
