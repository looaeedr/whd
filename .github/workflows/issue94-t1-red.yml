name: Issue94 T1 RED
on:
  push:
    branches: [feat/issue94-corner-data-navigation-mode-20260910]
    paths:
      - .github/workflows/issue94-t1-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Build evidence
        run: |
          cat > /tmp/issue94_evidence.md <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          截角資料入口收斂
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
      - name: Changed-file preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task '#92/#94 T1 截角資料 Navigation Mode' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue94_corner_data_navigation_mode.py \
            --evidence /tmp/issue94_evidence.md
      - name: RED contract must fail before production change
        run: |
          set +e
          pytest -q tests/test_issue94_corner_data_navigation_mode.py | tee /tmp/red.log
          rc=${PIPESTATUS[0]}
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q 'T1 requires a dedicated Fold Designer corner-data navigation mode\|corner-data mode API missing' /tmp/red.log
          echo 'EXPECTED_RED=PASS'
