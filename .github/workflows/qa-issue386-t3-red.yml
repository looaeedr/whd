name: "QA #386 T3 default collapsed RED"

on:
  push:
    branches:
      - ui/issue386-default-assembly-collapsed-20260919
    paths:
      - 'tests/test_issue386_default_assembly_collapsed.py'
      - '.github/workflows/qa-issue386-t3-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD bc8462c918faed80f38b4e62b78f7e2c4f42bdbf)" = "bc8462c918faed80f38b4e62b78f7e2c4f42bdbf"
      - name: Install GUI harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Confirm intended T3 RED
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue386_default_assembly_collapsed.py --tb=short | tee /tmp/t3-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "3 failed, 2 passed" /tmp/t3-red.log
          grep -q "fresh detail is expanded" /tmp/t3-red.log
          grep -q "parent group is expanded" /tmp/t3-red.log
          grep -q "physical child detail is expanded" /tmp/t3-red.log
          echo "PASS EXPECTED_T3_RED=3"
