name: Issue179 T6 Apply Runtime Repairs

on:
  push:
    branches:
      - governance/issue179-active-skill-runtime-20260913
    paths:
      - '.github/workflows/issue179-t6-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed runtime repairs
        run: python .scratch/issue179-t6/apply_runtime_repairs.py
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'looaeedr'
          git config user.email '76246585+looaeedr@users.noreply.github.com'
          git add .agents/skills/engineering .agents/skills/productivity/handoff/SKILL.md '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'governance: repair active Skill runtime contracts'
          git push origin HEAD:${GITHUB_REF_NAME}
