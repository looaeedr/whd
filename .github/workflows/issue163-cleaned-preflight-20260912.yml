name: Issue163 cleaned final preflight
on:
  push:
    branches:
      - fix/issue163-unfold-workspace-layout-20260912
    paths:
      - .github/workflows/issue163-cleaned-preflight-20260912.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ephemeral reread evidence
        run: |
          cat > /tmp/issue163-final-evidence.md <<'EOF'
          FINAL REREAD SKILLS
          UI設計與去AI味
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
      - name: Final cleaned changed-file preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#163 cleaned final preflight: structural UI relayout; top File + Corner Data only; left selector/input scroll ownership; right relocated controls; no manufacturing geometry rewrite"
          --changed-file fold_designer_bridge.py
          --changed-file tests/test_issue163_unfold_workspace_layout.py
          --evidence /tmp/issue163-final-evidence.md
      - name: Confirm only intended durable diff plus this one-shot workflow
        run: |
          git diff --name-only 155fc17aba13bde5cd0b48578334a5529b0b0c4b...HEAD | sort | tee /tmp/diff.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/issue163-cleaned-preflight-20260912.yml
          fold_designer_bridge.py
          tests/test_issue163_unfold_workspace_layout.py
          EOF
          diff -u /tmp/expected.txt /tmp/diff.txt
