name: issue279 T4 parent classifier

on:
  push:
    branches:
      - qa/issue279-parent-classifier-20260915

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      T1_PARENT: a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6
      TASK_HEAD: 770d3f15eff46a289f19d418722a779e53d0698a
      TASK_BRANCH: test-cleanup/issue279-gui-characterization-20260915
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock exact T4 lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$TASK_BRANCH:refs/remotes/origin/task"
          test "$(git rev-parse refs/remotes/origin/task)" = "$TASK_HEAD"
          git cat-file -e "$TASK_HEAD^{commit}"
          git merge-base --is-ancestor "$T1_PARENT" "$TASK_HEAD"
          changed="$(git diff --name-only "$T1_PARENT" "$TASK_HEAD")"
          printf '%s\n' "$changed"
          test "$changed" = "docs/plans/2026-09-15-test-cleanup-t4-gui-characterization-retirement.md"
          echo "PARALLEL_LINEAGE=GREEN"

      - name: Prove migration characterization is present on parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$T1_PARENT"
          test -f tests/test_issue206_gui_modularization_characterization.py
          grep -Fq 'assert gui._project_toolbar_presentation() == {' tests/test_issue206_gui_modularization_characterization.py
          grep -Fq '"toolbar_padx": 10' tests/test_issue206_gui_modularization_characterization.py
          grep -Fq 'assert canvas.calls == [' tests/test_issue206_gui_modularization_characterization.py
          test ! -e tests/test_gui_drawing_contract.py
          test ! -e tests/test_gui_toolbar_contract.py
          echo "CLASSIFICATION=MIGRATION_CHARACTERIZATION_PRESENT"
          echo "PERMANENT_SUCCESSORS=ABSENT"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Run focused parent baseline and capture exact output
        id: baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_issue206_gui_modularization_characterization.py \
            tests/test_issue210_project_actions_move_contract.py \
            tests/test_issue211_renderer_dependency_gate.py 2>&1 | tee parent-baseline.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "PARENT_BASELINE_EXIT=$status"
          exit 0

      - name: Upload parent baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue279-parent-baseline
          path: parent-baseline.txt
          if-no-files-found: error

      - name: Verify plan-only task drift
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$T1_PARENT" "$TASK_HEAD")"
          test "$changed" = "docs/plans/2026-09-15-test-cleanup-t4-gui-characterization-retirement.md"
          echo "PRODUCTION_SOURCE_DRIFT=0"
          echo "OUTCOME_CONTROL_DRIFT=0"

      - name: Enforce parent baseline result
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.baseline.outputs.status }}" -eq 0
