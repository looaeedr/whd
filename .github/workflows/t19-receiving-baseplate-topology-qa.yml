name: T19 Receiving Base Plate Topology QA

on:
  push:
    branches:
      - work/20260906-t1-receiving-baseplate-topology
    paths:
      - fold_designer_bridge.py
      - tests/test_phase6_t19_receiving_baseplate_topology.py

permissions:
  contents: read

jobs:
  t19:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Run T19 focused test
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t19_receiving_baseplate_topology.py \
            tests/test_phase6_receiving_multipart_integration.py::test_opening_receiving_designer_preserves_formal_door_features_and_authoritative_rows \
            tests/test_phase6_receiving_multipart_integration.py::test_receiving_joint_shrinks_features_round_trip_from_designer_to_project \
            2>&1 | tee t19.log
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-receiving-baseplate-topology-log
          path: t19.log
