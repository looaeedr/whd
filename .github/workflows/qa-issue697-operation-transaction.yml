name: WHD #697 A2 操作交易 RED／GREEN 驗收
run-name: "WHD｜#697 A2｜操作交易核心 RED／GREEN"

on:
  push:
    branches:
      - work/issue697-operation-transaction-core-20260926

permissions:
  contents: read

jobs:
  focused:
    name: A2 操作交易核心驗收
    runs-on: ubuntu-latest
    steps:
      - name: 取出驗收版本
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: 執行 RED-STOP-17 與 RED-STOP-18
        run: |
          python -m pytest -q --confcutdir=tests/process \
            tests/process/test_issue697_operation_transaction_core.py
          echo "ISSUE697_A2_TESTS_GREEN=PASS"
