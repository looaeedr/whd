name: Issue281 T6 Full Lane Validation

on:
  push:
    branches:
      - test-cleanup/issue281-full-lane-validation-20260916
    paths:
      - '.github/workflows/issue281-full-lane-validation.yml'
      - 'docs/superpowers/verification/2026-09-16-issue281-full-lane-preflight-evidence.md'

permissions:
  contents: read

jobs:
  full-lane-validation:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 153455d5cbc81d2443802fb09c0cca0714ef8c0d
      CLAIM_REF: coord/claim-issue281-20260916
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Validate execution claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue281
          git fetch origin "$CLAIM_REF:refs/remotes/origin/$CLAIM_REF"
          git show "refs/remotes/origin/$CLAIM_REF:.coord/claims/issue281.json" > .scratch/issue281/claim.json
          python tools/execution_claim_guard.py \
            --claim .scratch/issue281/claim.json \
            --issue 281 \
            --worker chatgpt \
            --branch "$GITHUB_REF_NAME" \
            --action qa-dispatch \
            --base-sha "$BASE_SHA" \
            --head-sha "$GITHUB_SHA"

      - name: Fail-closed skill preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task 'pytest coverage full lane validation UI Xvfb governance unit geometry projection persistence DXF architecture integration' \
            --changed-file .github/workflows/issue281-full-lane-validation.yml \
            --changed-file docs/superpowers/verification/2026-09-16-issue281-full-lane-preflight-evidence.md \
            --evidence docs/superpowers/verification/2026-09-16-issue281-full-lane-preflight-evidence.md

      - name: Lock T6 scope and capture invariants
        shell: bash
        run: |
          set -euo pipefail
          git -c core.quotepath=false diff --name-only "$BASE_SHA" "$GITHUB_SHA" | tee .scratch/issue281/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('.scratch/issue281/changed.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          allowed = {
              '.github/workflows/issue281-full-lane-validation.yml',
              'docs/superpowers/verification/2026-09-16-issue281-full-lane-preflight-evidence.md',
          }
          bad = [x for x in changed if x not in allowed]
          assert not bad, f'T6_SOURCE_DRIFT={bad}'
          print('T6_SOURCE_DRIFT=0')
          PY
          find . -type f \( -name config.ini -o -iname '*.dxf' \) \
            -not -path './.git/*' -not -path './.scratch/*' \
            -print0 | sort -z | xargs -0 sha256sum > .scratch/issue281/invariants-before.sha256

      - name: Audit full collection and lane union
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_lane_audit.py --json-out .scratch/issue281/lane-collection.json | tee .scratch/issue281/lane-collection.log

      - name: Run every lane to terminal
        shell: bash
        run: |
          set -euo pipefail
          : > .scratch/issue281/lane-status.tsv
          run_lane() {
            name="$1"
            expr="$2"
            display_mode="$3"
            echo "===== LANE $name :: $expr ====="
            set +e
            if [ "$display_mode" = "xvfb" ]; then
              xvfb-run -a python -m pytest -q -ra --tb=short \
                --junitxml=".scratch/issue281/${name}.xml" -m "$expr" tests \
                2>&1 | tee ".scratch/issue281/${name}.log"
              rc=${PIPESTATUS[0]}
            else
              python -m pytest -q -ra --tb=short \
                --junitxml=".scratch/issue281/${name}.xml" -m "$expr" tests \
                2>&1 | tee ".scratch/issue281/${name}.log"
              rc=${PIPESTATUS[0]}
            fi
            set -e
            printf '%s\t%s\n' "$name" "$rc" >> .scratch/issue281/lane-status.tsv
            echo "LANE_TERMINAL name=$name rc=$rc"
          }

          run_lane governance 'governance' headless
          run_lane unit 'unit' headless
          run_lane geometry 'geometry' headless
          run_lane projection 'projection' headless
          run_lane persistence 'persistence' headless
          run_lane dxf 'dxf' headless
          run_lane architecture 'architecture' headless
          run_lane ui_headless 'ui and not xvfb' headless
          run_lane integration 'integration' headless
          run_lane xvfb_ui 'ui and xvfb' xvfb

      - name: Build lane evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.scratch/issue281')
          statuses = {}
          status_path = root / 'lane-status.tsv'
          if status_path.is_file():
              for line in status_path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  name, rc = line.split('\t', 1)
                  statuses[name] = int(rc)

          lanes = {}
          for name, rc in statuses.items():
              counts = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
              xml_path = root / f'{name}.xml'
              if xml_path.is_file():
                  tree = ET.parse(xml_path)
                  nodes = [tree.getroot()]
                  if tree.getroot().tag == 'testsuites':
                      nodes = list(tree.getroot())
                  for node in nodes:
                      for key in counts:
                          counts[key] += int(node.attrib.get(key, 0) or 0)
              failed = []
              log_path = root / f'{name}.log'
              if log_path.is_file():
                  for line in log_path.read_text(encoding='utf-8', errors='replace').splitlines():
                      if line.startswith('FAILED ') or line.startswith('ERROR '):
                          failed.append(line.strip())
              lanes[name] = {'returncode': rc, **counts, 'failure_lines': failed}

          payload = {'lanes': lanes}
          collection = root / 'lane-collection.json'
          if collection.is_file():
              payload['collection'] = json.loads(collection.read_text(encoding='utf-8'))
          (root / 'lane-summary.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Verify protected invariants and tracked tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .scratch/issue281/invariants-before.sha256 ]; then
            echo 'INVARIANT_CHECK_NOT_REACHED'
            exit 1
          fi
          find . -type f \( -name config.ini -o -iname '*.dxf' \) \
            -not -path './.git/*' -not -path './.scratch/*' \
            -print0 | sort -z | xargs -0 sha256sum > .scratch/issue281/invariants-after.sha256
          diff -u .scratch/issue281/invariants-before.sha256 .scratch/issue281/invariants-after.sha256
          git diff --exit-code
          echo 'CONFIG_DXF_INVARIANTS=GREEN'
          echo 'TRACKED_WORKTREE_CLEAN=GREEN'

      - name: Upload T6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue281-full-lane-evidence
          path: .scratch/issue281

      - name: Fail closed on any RED lane
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.scratch/issue281/lane-status.tsv')
          assert p.is_file(), 'LANE_STATUS_MISSING'
          red = []
          for line in p.read_text(encoding='utf-8').splitlines():
              name, rc = line.split('\t', 1)
              if int(rc) != 0:
                  red.append((name, int(rc)))
          if red:
              raise SystemExit(f'UNCLASSIFIED_RED_LANES={red}')
          print('ALL_LANES_TERMINAL_GREEN')
          PY

      - name: Seal T6 baseline validation
        shell: bash
        run: echo 'ISSUE281_T6_FULL_LANE_BASELINE=GREEN'
