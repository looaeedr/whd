name: Issue555 Execution Instance Identity Contract

on:
  push:
    branches:
      - governance/issue555-execution-instance-identity-20260923
    paths:
      - 'tests/process/test_issue555_execution_instance_identity_contract.py'
      - '.agents/skills/engineering/派工/SKILL.md'
      - '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
      - '.github/workflows/qa-issue555-execution-instance-identity.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test harness
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run issue555 contract
        run: python -m pytest -q tests/process/test_issue555_execution_instance_identity_contract.py
