name: "#351 T6 compatibility gate"

on:
  push:
    branches:
      - refactor/issue351-compatibility-zero-reverse-import-20260918
    paths:
      - 'tools/issue351_t6_compatibility_gate.py'
      - 'tests/test_issue351_t6_compatibility_gate.py'
      - 'phase6_manufacturing_geometry.py'
      - 'fold_designer_bridge.py'
      - '.github/workflows/qa-issue351-t6-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Compile owner and bridge
        run: python -m py_compile phase6_manufacturing_geometry.py fold_designer_bridge.py tools/issue351_t6_compatibility_gate.py
      - name: Run static gate
        run: python tools/issue351_t6_compatibility_gate.py
      - name: Run runtime compatibility tests
        run: |
          python -m pytest -q             tests/test_issue351_t6_compatibility_gate.py             tests/test_issue350_manufacturing_orchestration_extraction.py             tests/test_issue347_manufacturing_helper_extraction.py
