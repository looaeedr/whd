name: issue262-integration-acceptance

on:
  push:
    branches:
      - integration/issue262-x-acceptance-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run full T1-T7 governance regression on merged candidate
        run: >-
          python -m pytest -q
          tests/process/test_issue264_frozen_base_guard.py
          tests/process/test_issue265_parent_contract.py
          tests/process/test_issue266_cross_chain_isolation.py
          tests/process/test_issue267_dispatch_run_identity.py
          tests/process/test_issue268_atomic_chain_acceptance.py
          tests/process/test_issue269_current_x_integration_readiness.py
          tests/process/test_issue270_durable_governance_writeback.py
