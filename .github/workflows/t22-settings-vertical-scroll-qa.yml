name: T22 Settings Vertical Scroll QA

on:
  push:
    branches:
      - work/20260906-t4-settings-vertical-scroll
    paths:
      - phase6_settings_panel.py
      - tests/test_phase6_t22_settings_vertical_scroll.py

permissions:
  contents: read

jobs:
  t22:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Run T22 focused QA
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t22_settings_vertical_scroll.py \
            tests/test_phase6_t08_ui_text_and_edge_selectors.py \
            2>&1 | tee t22.log
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t22-settings-vertical-scroll-log
          path: t22.log
