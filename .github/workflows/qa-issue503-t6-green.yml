name: "QA #503 T6 Live-sync GREEN"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue503-t6-green.yml'

permissions:
  contents: read

jobs:
  t6-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run pure planner contract
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue503_live_sync_publication_plan.py             --tb=short
      - name: Run live-sync focused parity under Xvfb
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_sync_envelope.py             tests/test_phase6_live_canonical_sync.py             tests/test_gui_fold_designer_transaction_contract.py             --tb=short
      - name: Architecture ratchet
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          bridge = Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree = ast.parse(bridge)
          fn = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "_phase6_publish_live_state"
          )
          src = ast.get_source_segment(bridge, fn) or ""
          assert "plan_live_sync_envelope(" in src
          assert "materialize_sync_value(" in src
          for token in (
              "mapping_delta(",
              "force_host_relief_sync =",
              'payload.update({',
              'f"fold_designer:{revision}"',
          ):
              assert token not in src, token

          sync = Path("phase6_sync_envelope.py").read_text(encoding="utf-8")
          stree = ast.parse(sync)
          imports = set()
          for node in ast.walk(stree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          forbidden = {
              name for name in imports
              if name == "fold_designer_bridge"
              or name == "tkinter"
              or name.startswith("tkinter.")
              or "manufacturing" in name
              or "renderer" in name
          }
          assert forbidden == set(), forbidden

          facade_call = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "install_fold_designer_bridge_facade"
          )
          assert isinstance(facade_call.args[1], ast.Dict)
          facade_count = len(facade_call.args[1].keys)
          assert facade_count <= 69, facade_count
          print(f"FACADE_BINDING_COUNT={facade_count}")
          print("ISSUE503_T6_ARCH_GREEN=1")
          PY
