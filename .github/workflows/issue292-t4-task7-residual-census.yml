name: Issue292 T4 Task7 Residual Census
on:
  push:
    branches: [refactor/issue292-task7-adapters-green-20260917]
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report residual T4 method dependencies
        run: |
          python - <<'PY'
          import ast
          import builtins
          from pathlib import Path

          text = Path('gui.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          host = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          wanted = {
              '_parse_layout_value',
              '_reject_door_layout_dimension',
              'rebuild_door_layout_ui',
              'refresh_door_layout_status',
              'sync_base_plate_shrink',
              'setup_tab_indicator_box_ui',
              '_indicator_small_door_size_chain_label',
              '_attach_part_hole_entrypoint',
              'setup_tab_door_ui',
              'setup_tab_indicator_door_ui',
              'rebuild_layers_config_ui',
          }
          methods = {n.name: n for n in host.body if isinstance(n, ast.FunctionDef) and n.name in wanted}
          assert wanted == methods.keys(), sorted(wanted - methods.keys())
          built = set(dir(builtins))
          print('GUI_LOC', len(text.splitlines()))
          for name in sorted(wanted):
              node = methods[name]
              params = {a.arg for a in node.args.posonlyargs + node.args.args + node.args.kwonlyargs}
              if node.args.vararg:
                  params.add(node.args.vararg.arg)
              if node.args.kwarg:
                  params.add(node.args.kwarg.arg)
              stored = {n.id for n in ast.walk(node) if isinstance(n, ast.Name) and isinstance(n.ctx, (ast.Store, ast.Del))}
              loaded = {n.id for n in ast.walk(node) if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)}
              globals_used = sorted(loaded - params - stored - built)
              span = (node.end_lineno or node.lineno) - node.lineno + 1
              print(f'{name}|span={span}|globals={globals_used}')
          PY
