name: "#354 T0 Phase2 preflight"

on:
  push:
    branches:
      - refactor/issue354-phase2-preflight-20260919
    paths:
      - 'tools/issue354_phase2_preflight.py'
      - '.github/workflows/qa-issue354-t0-phase2-preflight.yml'
      - 'docs/superpowers/checkpoints/issue354-t0-phase2-preflight.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile preflight
        run: python -m py_compile tools/issue354_phase2_preflight.py
      - name: Run Phase 2 preflight
        run: python tools/issue354_phase2_preflight.py
