name: Remote QA monitoring skill QA once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/remote_qa_monitoring_skill_trigger.txt'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q pytest
      - name: Record remote head
        run: git rev-parse HEAD
      - name: Remote QA monitoring skill contract
        run: python -m pytest -q tests/test_remote_qa_monitoring_skill_contract.py
      - name: Dispatch timeout and monitoring contract
        run: python -m pytest -q tests/test_dispatching_skill_timeout_contract.py
      - name: Skill preflight registry gate
        run: python -m pytest -q tests/test_phase6_skill_preflight_gate.py
