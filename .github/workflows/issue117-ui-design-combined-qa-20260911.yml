name: issue117-ui-design-combined-qa-20260911

on:
  push:
    branches:
      - qa/issue117-ui-design-combined-acceptance-20260911
    paths:
      - 'docs/superpowers/verification/.issue117-ui-design-trigger'

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Knowledge Preflight
        run: |
          python3 tools/phase6_skill_preflight.py \
            --task "Issue #117: 對第五批 UI 介面重整與去 AI 味做 Combined Acceptance、release integration readiness、remote QA、cleanup 與 drift audit；不修改 production" \
            --changed-file 'docs/superpowers/verification/2026-09-11-issue117-ui-design-combined-acceptance.md' \
            --changed-file '.github/workflows/issue117-ui-design-combined-qa-20260911.yml' \
            --evidence 'docs/superpowers/verification/2026-09-11-issue117-ui-design-combined-acceptance.md'
      - name: Fifth-batch R1-R6 contract
        run: python3 tests/test_ui_design_de_ai_skill_contract.py
      - name: Project Skill and release guards
        run: |
          python3 -m pytest -q \
            tests/test_chinese_skill_identity_contract.py \
            tests/test_writing_skill_contract.py \
            tests/test_writing_skill_preflight_route.py \
            tests/test_find_skill_contract.py \
            tests/test_second_batch_skills_contract.py \
            tests/test_python_testing_practices_skill_contract.py \
            tests/test_fourth_batch_skills_contract.py \
            tests/test_dxf_skill_scope_contract.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_phase6_release_packaging_policy.py \
            tests/test_release_integrity_gate.py
      - name: Machine-readable governance parse
        run: |
          python3 -m json.tool .agents/skills/skill_registry.json >/dev/null
          python3 -m json.tool release_required_artifacts.json >/dev/null
      - name: Verify config and clean tree
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git diff --exit-code
