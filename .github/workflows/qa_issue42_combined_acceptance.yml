name: T6 Combined Acceptance

on:
  push:
    branches:
      - qa/42-combined-acceptance
    paths:
      - 'ae_engine/manufacturing_api.py'
      - 'tests/test_phase6_t16_receiving_placement.py'
      - '.scratch/issue42_preflight_evidence.txt'
      - '.github/workflows/qa_issue42_combined_acceptance.yml'

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib numpy
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "combined acceptance regression QA collision 3D placement save reload DXF shared datum production integration" \
            --changed-file ae_engine/manufacturing_api.py \
            --changed-file tests/test_phase6_t16_receiving_placement.py \
            --changed-file tests/test_issue37_vault_baseplate_placement.py \
            --changed-file tests/test_issue38_receiving_divider_baseline.py \
            --changed-file tests/test_issue39_divider_relief.py \
            --changed-file tests/test_issue40_divider_6p4_shared_datum.py \
            --changed-file tests/test_issue41_persistence_parity.py \
            --evidence .scratch/issue42_preflight_evidence.txt
      - name: Headless Combined Acceptance
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          pytest -q -vv -s \
            tests/test_issue37_vault_baseplate_placement.py \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue40_divider_6p4_shared_datum.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_phase6_t25_combined_receiving_acceptance.py \
            tests/test_phase6_t16_receiving_placement.py \
            tests/test_phase6_t19_receiving_baseplate_topology.py \
            tests/test_phase6_t20_receiving_baseplate_placement.py \
            tests/test_phase6_receiving_multipart_integration.py \
            tests/test_rebuild_t6_receiving_joint_ownership.py \
            tests/test_joint_backprojection_and_topology.py \
            tests/test_piece_level_joint_geometry.py \
            tests/test_assembly_placement_contract.py \
            tests/test_assembly_placement_divider.py \
            tests/test_resolved_manufacturing_export.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "combined_headless_config_before=$before"
          echo "combined_headless_config_after=$after"
          test "$before" = "$after"
      - name: Xvfb Combined GUI Acceptance
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a pytest -q -vv \
            tests/test_phase6_t11_family_preset_switching.py \
            tests/test_phase6_t20_receiving_baseplate_placement.py \
            tests/test_phase6_t21_live_switch_selector.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "combined_xvfb_config_before=$before"
          echo "combined_xvfb_config_after=$after"
          test "$before" = "$after"
