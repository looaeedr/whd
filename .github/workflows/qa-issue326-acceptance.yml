name: Issue 326 Acceptance

on:
  push:
    branches: [fix/issue326-preserve-authority-20260917]
    paths: ['.github/workflows/qa-issue326-acceptance.yml']

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: d88d18587be85d2f155fbc62f171cbb8b423b12e
      TESTED_SHA: b00ef5df1be4bc191e227bfe6966f6578193febf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock tested SHA
        run: git checkout --detach "$TESTED_SHA" && test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Verify protected files unchanged
        run: git diff --check "$BASE_SHA" "$TESTED_SHA" && git diff --exit-code "$BASE_SHA" "$TESTED_SHA" -- config.ini '*.dxf'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run issue 326 and inherited continuity tests
        run: python -m pytest -q tests/process/test_issue326_scheduled_wakeup_continuity_contract.py tests/process/test_continuity_controller.py tests/process/test_finalization_owner_guard.py tests/process/test_issue321_turn_exit_enforcement.py
      - name: Knowledge preflight
        run: python tools/knowledge_governance.py bootstrap --inventory docs/superpowers/verification/knowledge_governance_inventory_v1.json --base "$BASE_SHA" --head "$TESTED_SHA"
      - name: Readback required markers
        run: python -c "from pathlib import Path; c=Path('.agents/skills/engineering/executable-continuity-controller/SKILL.md').read_text(); m=Path('.agents/skills/engineering/monitoring-remote-qa/SKILL.md').read_text(); p=Path('個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md').read_text(); req=['wake-up trigger != execution owner','RUN_NOT_CREATED','terminal => continue next autonomous step','status update != exit','checkpoint before forced turn end']; assert all(x in c for x in req); assert 'does not own scheduled wake-up execution' in m; assert 'SCHEDULED_WAKEUP_STATUS_ONLY_PITFALL' in p; print('REMOTE_READBACK_MARKERS=PASS')"
