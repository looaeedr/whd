name: Issue 527 B2 GREEN

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue527-b2-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Headless shell and owner contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue365_t1_workspace_navigation_controller.py             tests/test_phase6_designer_workspace.py             tests/test_issue445_settings_presentation_owner.py             tests/test_issue498_settings_application_coordinator.py             | tee /tmp/issue527-headless.log
          grep -E '[0-9]+ passed' /tmp/issue527-headless.log | tail -1

      - name: Xvfb shell and activation parity
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_issue447_workspace_shell_owner.py             tests/test_phase6_designer_workspace.py::test_real_designer_switch_saves_outgoing_before_workspace_changes_active_part             | tee /tmp/issue527-xvfb.log
          grep -E '[0-9]+ passed' /tmp/issue527-xvfb.log | tail -1

      - name: Architecture and reduction evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue527-architecture.log
          import ast
          from pathlib import Path

          bridge = Path("fold_designer_bridge.py")
          shell = Path("phase6_workspace_shell.py")
          bsrc = bridge.read_text(encoding="utf-8")
          ssrc = shell.read_text(encoding="utf-8")
          btree = ast.parse(bsrc)
          stree = ast.parse(ssrc)
          imports=set()
          for node in ast.walk(stree):
              if isinstance(node,ast.Import):
                  imports.update(a.name for a in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module:
                  imports.add(node.module)
          forbidden={
              "fold_designer_bridge",
              "phase6_manufacturing_geometry",
              "phase6_manufacturing_service",
          }
          assert not imports & forbidden
          funcs={
              n.name:n for n in btree.body if isinstance(n,ast.FunctionDef)
          }
          names={
              "_phase6_build_persistent_top_area",
              "_phase6_build_project_toolbar",
              "_phase6_build_transaction_buttons",
              "_phase6_build_global_persistent_controls",
              "_phase6_build_output_controls",
              "_phase6_build_visual_controls",
              "_phase6_toggle_fullscreen",
              "_phase6_mount_shared_content",
          }
          spans={name:funcs[name].end_lineno-funcs[name].lineno+1 for name in names}
          assert max(spans.values()) <= 36, spans
          loc=bsrc.count("\n")
          assert loc < 7796
          print("BRIDGE_LOC="+str(loc))
          print("B2_REDUCTION_FROM_STAGE_A="+str(7796-loc))
          print("MAX_SHELL_COMPAT_SPAN="+str(max(spans.values())))
          print("REVERSE_IMPORT_BRIDGE=0")
          print("ISSUE527_B2_GREEN=GREEN")
          PY

      - name: Upload GREEN evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue527-b2-green
          path: |
            /tmp/issue527-headless.log
            /tmp/issue527-xvfb.log
            /tmp/issue527-architecture.log
          if-no-files-found: error
          retention-days: 14
