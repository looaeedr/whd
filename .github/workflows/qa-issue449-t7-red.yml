name: "QA #449 T7 RED bootstrap contract"

on:
  push:
    branches:
      - refactor/issue449-t7-fix11-init-bootstrap-20260921
    paths:
      - 'tests/test_issue449_fix11_init_bootstrap_owner.py'
      - '.github/workflows/qa-issue449-t7-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run T7 RED contract
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue449_fix11_init_bootstrap_owner.py --tb=short | tee /tmp/issue449-red.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ISSUE449_RED_UNEXPECTED_GREEN=1"
            exit 1
          fi
          grep -q "T7 RED:" /tmp/issue449-red.log
          echo "ISSUE449_EXPECTED_RED=1"
          exit 0
