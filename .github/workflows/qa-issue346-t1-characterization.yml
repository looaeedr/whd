name: "#346 T1 manufacturing characterization"

on:
  push:
    branches:
      - refactor/issue346-manufacturing-characterization-20260918
    paths:
      - '.github/workflows/qa-issue346-t1-characterization.yml'
      - 'docs/superpowers/checkpoints/issue346-t1-characterization.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  MPLBACKEND: Agg

jobs:
  headless-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run manufacturing characterization headless
        run: |
          python -m pytest -q             tests/test_resolved_manufacturing_bridge.py             tests/test_resolved_manufacturing_geometry.py             tests/test_resolved_manufacturing_export.py             tests/test_endcap_resolved_geometry_ownership.py             tests/test_dm3_divider_canonical_relief_contract.py             tests/test_receiving_bottom_wrap_registry.py             tests/test_phase6_t09_multi_wrap.py             tests/test_phase6_receiving_multipart_integration.py             tests/test_phase6_2d_3d_round_trip.py             tests/test_assembly_collision_integration.py             tests/test_joint_backprojection_and_topology.py             tests/test_phase6_assembly_3d_view.py             tests/test_phase6_project_file.py             tests/test_phase6_derived_cache_owner.py             tests/test_phase6_baseline_source_cache.py

  xvfb-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run manufacturing characterization under Xvfb
        run: |
          xvfb-run -a python -m pytest -q             tests/test_resolved_manufacturing_bridge.py             tests/test_resolved_manufacturing_geometry.py             tests/test_resolved_manufacturing_export.py             tests/test_endcap_resolved_geometry_ownership.py             tests/test_dm3_divider_canonical_relief_contract.py             tests/test_receiving_bottom_wrap_registry.py             tests/test_phase6_t09_multi_wrap.py             tests/test_phase6_receiving_multipart_integration.py             tests/test_phase6_2d_3d_round_trip.py             tests/test_assembly_collision_integration.py             tests/test_joint_backprojection_and_topology.py             tests/test_phase6_assembly_3d_view.py             tests/test_phase6_project_file.py             tests/test_phase6_derived_cache_owner.py             tests/test_phase6_baseline_source_cache.py
