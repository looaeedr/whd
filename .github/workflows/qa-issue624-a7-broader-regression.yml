name: "WHD｜工單 #624｜A7 Bridge 廣域回歸驗收"
run-name: "WHD｜#624 A7｜Bridge 相容性與深層 owner 廣域驗收"

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue624_phase7_a7_bridge_residual_reduction.py'
      - '.github/workflows/qa-issue624-a7-broader-regression.yml'

permissions:
  contents: read

jobs:
  broader:
    name: "A7｜Bridge 廣域相容性驗收"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "簽出 Phase 7 A7 工單主分支"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "確認 A7 lineage"
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99e389de4e82ad5e34f80cc91e2e83aab0dd0f7d HEAD
          echo "A7_PARENT=99e389de4e82ad5e34f80cc91e2e83aab0dd0f7d"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: "安裝 Bridge 回歸測試相依"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: "執行 A7 聚焦與 owner 邊界回歸"
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue624_phase7_a7_bridge_residual_reduction.py \
            tests/test_issue448_part_editor_owner_decision.py \
            tests/test_issue479_final_scene_composition_owner.py \
            tests/test_issue483_t5_bridge_dead_glue_cleanup.py \
            tests/test_phase6_bridge_domain_ownership.py \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_phase6_workspace_controller.py \
            tests/test_phase6_workspace_projection.py \
            tests/test_phase6_workspace_state.py \
            tests/test_issue498_settings_application_coordinator.py \
            tests/test_issue499_settings_apply_coordinator.py \
            tests/test_issue500_settings_profile_projection.py \
            tests/test_issue502_editor_settings_commit_seam.py \
            --tb=short

      - name: "執行原始 Bridge 與 GUI 相容性回歸"
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_original_fold_designer_bridge.py \
            tests/test_phase6_settings_center_bridge.py \
            tests/test_issue293_t5_part_editor_routing.py \
            --tb=short
