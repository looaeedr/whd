name: "WHD｜#626 A9｜Phase 7 Combined GREEN"
run-name: "WHD｜#626 A9｜Combined target census GREEN"
on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - 'tests/test_issue626_phase7_combined_acceptance.py'
      - 'docs/superpowers/checkpoints/issue613-a1-dt-p7-*.json'
      - 'docs/superpowers/checkpoints/issue61*-*-target-completion.json'
      - 'docs/superpowers/checkpoints/issue62*-*-target-completion.json'
      - '.github/workflows/qa-issue626-a9-combined-green.yml'
permissions:
  contents: read
jobs:
  combined-green:
    name: "A9｜Combined target census GREEN"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Install focused test dependency"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: "Require all seven Phase 7 targets machine terminal"
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue626_phase7_combined_acceptance.py --tb=short
          echo "A9_COMBINED_TARGET_CENSUS=GREEN"
