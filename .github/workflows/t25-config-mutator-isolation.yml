name: T25 Config Mutator Isolation

on:
  push:
    branches:
      - qa/20260907-t7-combined-acceptance
    paths:
      - .github/workflows/t25-config-mutator-isolation.yml

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Isolate config mutators
        shell: bash
        run: |
          set -uo pipefail
          : > t25_config_mutators.txt
          canonical="$(git show HEAD:config.ini | sha256sum | awk '{print $1}')"
          echo "CANONICAL=$canonical"
          cases=(
            "T22|tests/test_phase6_t22_settings_vertical_scroll.py"
            "T23|tests/test_phase6_t23_bottom_edge_visibility.py"
            "T24|tests/test_phase6_t24_edge_selector_width.py"
            "T25|tests/test_phase6_t25_combined_receiving_acceptance.py"
          )
          for row in "${cases[@]}"; do
            name="${row%%|*}"
            spec="${row#*|}"
            git checkout -- config.ini
            before="$(sha256sum config.ini | awk '{print $1}')"
            echo "BEGIN $name $spec before=$before"
            set +e
            xvfb-run -a python -m pytest -q "$spec"
            rc=$?
            set -e
            after="$(sha256sum config.ini | awk '{print $1}')"
            dirty="$(git status --porcelain -- config.ini || true)"
            echo "END $name rc=$rc after=$after dirty=$dirty"
            if [ "$rc" -ne 0 ]; then
              echo "TEST_FAILURE $name rc=$rc" | tee -a t25_config_mutators.txt
            fi
            if [ "$before" != "$after" ] || [ -n "$dirty" ]; then
              echo "MUTATOR $name before=$before after=$after dirty=$dirty" | tee -a t25_config_mutators.txt
            else
              echo "CLEAN $name" | tee -a t25_config_mutators.txt
            fi
          done
          echo "===RESULT==="
          cat t25_config_mutators.txt
          grep -q '^MUTATOR ' t25_config_mutators.txt
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t25-config-mutator-isolation
          path: t25_config_mutators.txt
