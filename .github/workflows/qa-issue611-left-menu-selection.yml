name: WHD｜#611｜左側選單選中狀態驗收
run-name: "WHD｜#611｜左側主選單選中狀態 Xvfb 驗收｜${{ github.sha }}"

on:
  push:
    branches:
      - hotfix/issue611-left-menu-selection-20260924
    paths:
      - '.github/workflows/qa-issue611-left-menu-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xvfb:
    name: 驗證左側主選單選中狀態
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出工單分支
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝 Xvfb 與測試相依
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 記錄受保護檔案雜湊
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/issue611-protected-before.sha256

      - name: 執行左側選單 real Tk Xvfb 驗收
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q tests/test_issue334_shared_menu_theme.py | tee /tmp/issue611-pytest.log

      - name: 驗證受保護檔案與工作樹未漂移
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/issue611-protected-after.sha256
          cmp /tmp/issue611-protected-before.sha256 /tmp/issue611-protected-after.sha256
          git diff --exit-code

      - name: 上傳 #611 驗收證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue611-left-menu-selection
          path: |
            /tmp/issue611-pytest.log
            /tmp/issue611-protected-before.sha256
            /tmp/issue611-protected-after.sha256
          if-no-files-found: error
