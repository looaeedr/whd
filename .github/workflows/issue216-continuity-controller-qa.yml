name: issue216 continuity controller QA

on:
  push:
    branches:
      - fix/continuous-execution-runtime-guard-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show authority
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "BRANCH=${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Snapshot protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | tee /tmp/issue216-config-before.sha256
          find '基準檔' -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/issue216-baseline-before.sha256
          echo "BASELINE_FILE_COUNT=$(wc -l < /tmp/issue216-baseline-before.sha256)"
          sha256sum /tmp/issue216-baseline-before.sha256

      - name: Validate controller and registry syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/continuity_controller.py
          python -m json.tool .agents/skills/skill_registry.json >/dev/null
          python -m tools.continuity_controller --help >/dev/null
          echo 'CONTROLLER_AND_REGISTRY_SYNTAX=GREEN'

      - name: Run executable continuity combined process acceptance
        run: >-
          python -m pytest
          tests/process/test_continuity_controller.py
          tests/process/test_continuous_execution_durable_contract.py
          tests/process/test_long_log_context_safe_execution_contract.py
          -q

      - name: Verify protected invariants unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | tee /tmp/issue216-config-after.sha256
          diff -u /tmp/issue216-config-before.sha256 /tmp/issue216-config-after.sha256
          find '基準檔' -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/issue216-baseline-after.sha256
          diff -u /tmp/issue216-baseline-before.sha256 /tmp/issue216-baseline-after.sha256
          echo 'CONFIG_INVARIANT=GREEN'
          echo 'PROTECTED_BASELINE_INVARIANT=GREEN'
          echo 'ISSUE216_COMBINED_ACCEPTANCE=GREEN'
