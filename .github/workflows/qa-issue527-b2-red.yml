name: Issue 527 B2 RED

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue527-b2-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Replacement requirement must be RED before extraction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue447_workspace_shell_owner.py > /tmp/issue527-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue527-red.log
          test "$rc" -ne 0
          grep -E "B2 RED|phase6_workspace_shell.py|bridge still owns deep shell bodies" /tmp/issue527-red.log
          echo "ISSUE527_REPLACEMENT_RED=GREEN"

      - name: Upload RED log
        uses: actions/upload-artifact@v4
        with:
          name: issue527-b2-red
          path: /tmp/issue527-red.log
          if-no-files-found: error
          retention-days: 14
