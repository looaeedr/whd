name: issue268-t5-atomic-chain-acceptance

on:
  push:
    branches:
      - governance/issue268-t5-atomic-chain-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-chain-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run #268 regression
        run: python -m pytest -q tests/process/test_issue268_atomic_chain_acceptance.py
