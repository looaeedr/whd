name: Issue 471 T6 Gate B

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue471-t6.yml'
      - 'ae_engine/receiving_joint_marking.py'
      - 'ae_engine/joint_marking_policy.py'
      - 'phase6_manufacturing_service.py'
      - 'phase6_manufacturing_contracts.py'
      - 'tests/test_issue471_t6_receiving_marking_activation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest -r requirements.txt
      - name: Run Issue471 T6 Gate B RED
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_issue471_t6_receiving_marking_activation.py
