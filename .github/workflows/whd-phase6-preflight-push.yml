name: WHD Remote Phase6 Preflight Push
run-name: "WHD｜Phase6 Push Preflight｜${{ github.ref_name }}｜${{ github.sha }}"

on:
  push:
    branches:
      - coord/preflight-requests-a
      - coord/preflight-requests-b
    paths:
      - .dispatch/preflight-request.json

permissions:
  contents: read
  issues: write

concurrency:
  group: whd-phase6-preflight-push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: request
          fetch-depth: 1

      - name: Checkout trusted production transport
        uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          path: prod
          fetch-depth: 1

      - name: Validate scheduler preflight push request
        id: request
        env:
          REQUEST_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=prod python prod/tools/phase6_preflight_push_request.py \
            --request-file request/.dispatch/preflight-request.json \
            --request-branch "$REQUEST_BRANCH" \
            --output /tmp/phase6-preflight-request.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          request = json.load(open('/tmp/phase6-preflight-request.json', encoding='utf-8'))
          print(f"issue={request['issue']}")
          print(f"branch={request['branch']}")
          print(f"head_sha={request['head_sha']}")
          PY

      - name: Checkout exact requested HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.head_sha }}
          path: target
          fetch-depth: 0

      - name: Verify requested branch still points at exact HEAD
        env:
          REQUESTED_BRANCH: ${{ steps.request.outputs.branch }}
          REQUESTED_HEAD: ${{ steps.request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live_head=$(git -C target ls-remote origin "refs/heads/$REQUESTED_BRANCH" | awk '{print $1}')
          test -n "$live_head"
          test "$live_head" = "$REQUESTED_HEAD"
          actual=$(git -C target rev-parse HEAD)
          test "$actual" = "$REQUESTED_HEAD"

      - name: Run canonical Phase6 Knowledge Preflight
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python tools/phase6_remote_preflight.py \
            --request-file /tmp/phase6-preflight-request.json \
            --run-id "$GITHUB_RUN_ID_VALUE" \
            --output /tmp/phase6-preflight-result.json

      - name: Publish machine-readable preflight receipt
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/phase6-preflight-result.json', 'utf8').trim();
            const receipt = JSON.parse(raw);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: receipt.issue,
              body: ['WHD_REMOTE_PHASE6_PREFLIGHT_RESULT_V1', '~~~json', raw, '~~~'].join('\n'),
            });

      - name: Save preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-push-preflight-${{ github.run_id }}
          path: /tmp/phase6-preflight-result.json
          if-no-files-found: warn
          retention-days: 7
