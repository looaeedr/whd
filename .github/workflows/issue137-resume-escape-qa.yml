name: issue137-resume-escape-qa
on:
  push:
    branches:
      - fix/issue137-resume-point-final-escape-20260912
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: focused contract
        run: python -m pytest -q tests/process/test_no_fake_completion_contract.py
      - name: governance regression
        run: python -m pytest -q tests/process/test_continuous_execution_durable_contract.py tests/process/test_continuous_execution_state_contract.py tests/process/test_remote_qa_state_bridge_contract.py tests/process/test_fail_recovery_contract.py tests/process/test_checkpoint_resume_contract.py tests/process/test_no_fake_completion_contract.py tests/process/test_monitoring_remote_qa_turn_boundary_contract.py
