name: QA Issue424 Phase5 T3

on:
  push:
    branches:
      - refactor/issue413-phase5-assembly-presentation-20260920
    paths:
      - phase6_assembly_panel.py
      - fold_designer_bridge.py
      - tests/process/test_issue424_phase5_t3_box_piece_panel.py
      - .github/workflows/qa-issue424-phase5-t3.yml
      - docs/superpowers/checkpoints/issue424-phase5-t3-journal.md
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - phase6_assembly_panel.py
      - fold_designer_bridge.py
      - tests/process/test_issue424_phase5_t3_box_piece_panel.py
      - .github/workflows/qa-issue424-phase5-t3.yml
      - docs/superpowers/checkpoints/issue424-phase5-t3-journal.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-t3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      WORK_BRANCH: refactor/issue413-phase5-assembly-presentation-20260920
      ACCEPTED_PREDECESSOR: b3d798c1a1d8ec3ad690948bee833d7c174df122
      EVIDENCE: docs/superpowers/checkpoints/issue424-phase5-t3-journal.md
      TEST_LOG: /tmp/issue424-t3-pytest.log
      CONFIG_BEFORE: /tmp/issue424-config-before.sha256
      CONFIG_AFTER: /tmp/issue424-config-after.sha256

    steps:
      - name: Checkout exact work-order head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OWNER_HEAD }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest --version
          command -v xvfb-run

      - name: Verify T3 lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OWNER_HEAD"
          git cat-file -e "$ACCEPTED_PREDECESSOR^{commit}"
          git merge-base --is-ancestor "$ACCEPTED_PREDECESSOR" "$OWNER_HEAD"
          echo "T3_PARENT_ANCESTOR=1"
          echo "WORK_ORDER_HEAD=$OWNER_HEAD"

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工執行 Phase 5 accepted specification T3 #424: move render-time BoxBody physical-piece rows/text/visibility stash/collapse/wheel presentation into Assembly panel; preserve render_data.pieces source/timing/order, setting_number_text and corner formatter semantics; no DM7 replacement, no topology-time precreation, no visibility policy change, remote QA and durable closure' \
            --changed-file phase6_assembly_panel.py \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/process/test_issue424_phase5_t3_box_piece_panel.py \
            --changed-file .github/workflows/qa-issue424-phase5-t3.yml \
            --changed-file docs/superpowers/checkpoints/issue424-phase5-t3-journal.md \
            --evidence "$EVIDENCE"
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require T3 scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          predecessor = "b3d798c1a1d8ec3ad690948bee833d7c174df122"
          allowed = {
              "phase6_assembly_panel.py",
              "fold_designer_bridge.py",
              "tests/process/test_issue424_phase5_t3_box_piece_panel.py",
              ".github/workflows/qa-issue424-phase5-t3.yml",
              "docs/superpowers/checkpoints/issue424-phase5-t3-journal.md",
          }
          changed = {
              x.strip()
              for x in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{predecessor}...HEAD"],
                  text=True,
              ).splitlines()
              if x.strip()
          }
          extra = sorted(changed - allowed)
          print("T3_CHANGED_FILES=", sorted(changed))
          print("T3_SCOPE_EXTERNAL_FILES=", extra)
          if extra:
              raise SystemExit("T3 scope drift: " + repr(extra))
          print("T3_SCOPE_EXTERNAL_DRIFT=0")
          PY

      - name: Capture protected config hash
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | awk '{print $1}' > "$CONFIG_BEFORE"

      - name: Run T3 RED or GREEN under Xvfb
        shell: bash
        run: |
          set -uo pipefail
          if grep -Eq '^[[:space:]]+def refresh_box_body_piece_info\(' phase6_assembly_panel.py; then
            set -e
            xvfb-run -a python -m pytest -q \
              tests/process/test_issue424_phase5_t3_box_piece_panel.py \
              | tee "$TEST_LOG"
            echo "T3_GREEN=1"
            echo "BOX_PIECE_ROW_SOURCE_RENDER_DATA_PIECES=true"
            echo "BOX_PIECE_ROW_SOURCE_SWITCH_TO_DM7=0"
            echo "BOX_PIECE_ROW_CREATION_MOVED_TO_TOPOLOGY_TIME=0"
            echo "BOX_PIECE_ROW_CREATION_TIMING_PARITY=GREEN"
            echo "BOX_PIECE_ROW_ORDER_PARITY=GREEN"
            echo "BOX_PIECE_VAR_OWNER_IS_PANEL=true"
            echo "BOX_PIECE_VISIBILITY_STASH_PARITY=GREEN"
            echo "LATE_PIECE_WHEEL_COVERAGE=GREEN"
            echo "BOX_PIECE_TEXT_REWRITTEN_ON_EVERY_REFRESH=true"
            echo "BOX_PIECE_TEXT_REFRESH_WITHOUT_ROW_REBUILD_PARITY=GREEN"
            echo "BOX_BODY_LOGICAL_TEXT_SUMMARY_PARITY=GREEN"
            echo "BOX_PIECE_FORMED_TEXT_FORMAT_PARITY=GREEN"
            echo "BOX_PIECE_BLANK_TEXT_FORMAT_PARITY=GREEN"
            echo "BOX_PIECE_CORNER_TEXT_FORMAT_PARITY=GREEN"
            echo 'BOX_PIECE_MISSING_ROLE_CORNER_FALLBACK=截角尺寸：無'
          else
            set +e
            xvfb-run -a python -m pytest -q \
              tests/process/test_issue424_phase5_t3_box_piece_panel.py \
              >"$TEST_LOG" 2>&1
            rc=$?
            set -e
            cat "$TEST_LOG"
            if [ "$rc" -eq 0 ]; then
              echo "T3_RED_INVALID=pytest unexpectedly passed"
              exit 1
            fi
            if grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError' "$TEST_LOG"; then
              echo "T3_RED_INVALID=harness_or_collection_error"
              exit 1
            fi
            grep -Fq 'T3 requirement RED: Phase6AssemblyPanel.refresh_box_body_piece_info is missing' "$TEST_LOG"
            grep -Eq '[1-9][0-9]* failed' "$TEST_LOG"
            echo "T3_RED_INTENDED=1"
            echo "T3_RED_PYTEST_RC=$rc"
          fi

      - name: Verify T3 panel architecture
        if: ${{ hashFiles('phase6_assembly_panel.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("phase6_assembly_panel.py").read_text(encoding="utf-8")
          checks = {
              "PANEL_BRIDGE_IMPORTS": int("fold_designer_bridge" in text),
              "PANEL_DM7_IMPORTS": int("phase6_part_navigation" in text),
              "PANEL_SETTINGS_IMPORTS": int("phase6_settings_panel" in text),
              "PANEL_DISPLAY_MODE_REFS": int("display_mode" in text or "_phase6_3d_display_mode" in text),
              "PANEL_MANUFACTURING_SOLVE": int("resolve_geometry(" in text or "manufacturing_api" in text),
              "PANEL_PROJECT_MUTATION": int("project_controller" in text),
          }
          for key, value in checks.items():
              print(f"{key}={value}")
          if any(checks.values()):
              raise SystemExit("T3 panel architecture violation")
          PY

      - name: Install legacy regression dependencies
        if: ${{ hashFiles('phase6_assembly_panel.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt matplotlib

      - name: Run legacy BoxBody Assembly regressions
        if: ${{ hashFiles('phase6_assembly_panel.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue376_assembly_collapsible_data.py \
            tests/test_issue385_assembly_parent_child_groups.py \
            tests/test_issue386_default_assembly_collapsed.py \
            tests/test_phase6_latest_layout_contract.py
          echo "LEGACY_BOX_PIECE_REGRESSIONS=GREEN"

      - name: Verify protected config invariant
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | awk '{print $1}' > "$CONFIG_AFTER"
          cmp "$CONFIG_BEFORE" "$CONFIG_AFTER"
          echo "CONFIG_INVARIANT=GREEN"

      - name: Authorize exact-owner T3 closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("/tmp/issue424-t3-closing")
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              "version": 1,
              "issue": "424",
              "branch": os.environ["WORK_BRANCH"],
              "head_sha": os.environ["OWNER_HEAD"],
              "state": "TERMINAL_SUCCESS",
              "next_action": None,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "job_id": None,
              "log_cursor": None,
              "blocked_count": 0,
              "blocked_last_notified_at": None,
              "evidence": [
                  "KNOWLEDGE_PREFLIGHT_RC=0",
                  "T3_GREEN=1",
                  "BOX_PIECE_ROW_SOURCE_RENDER_DATA_PIECES=true",
                  "BOX_PIECE_ROW_SOURCE_SWITCH_TO_DM7=0",
                  "BOX_PIECE_ROW_CREATION_MOVED_TO_TOPOLOGY_TIME=0",
                  "BOX_PIECE_ROW_CREATION_TIMING_PARITY=GREEN",
                  "BOX_PIECE_ROW_ORDER_PARITY=GREEN",
                  "BOX_PIECE_VAR_OWNER_IS_PANEL=true",
                  "BOX_PIECE_VISIBILITY_STASH_PARITY=GREEN",
                  "LATE_PIECE_WHEEL_COVERAGE=GREEN",
                  "BOX_PIECE_TEXT_REWRITTEN_ON_EVERY_REFRESH=true",
                  "BOX_PIECE_TEXT_REFRESH_WITHOUT_ROW_REBUILD_PARITY=GREEN",
                  "BOX_BODY_LOGICAL_TEXT_SUMMARY_PARITY=GREEN",
                  "BOX_PIECE_FORMED_TEXT_FORMAT_PARITY=GREEN",
                  "BOX_PIECE_BLANK_TEXT_FORMAT_PARITY=GREEN",
                  "BOX_PIECE_CORNER_TEXT_FORMAT_PARITY=GREEN",
                  "LEGACY_BOX_PIECE_REGRESSIONS=GREEN",
                  "PANEL_BRIDGE_IMPORTS=0",
                  "PANEL_DM7_IMPORTS=0",
                  "PANEL_SETTINGS_IMPORTS=0",
                  "PANEL_DISPLAY_MODE_REFS=0",
                  "PANEL_MANUFACTURING_SOLVE=0",
                  "PANEL_PROJECT_MUTATION=0",
                  "T3_SCOPE_EXTERNAL_DRIFT=0",
                  "CONFIG_INVARIANT=GREEN",
              ],
          }
          (out / "terminal-checkpoint.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python -m tools.continuity_controller authorize-finalization \
            /tmp/issue424-t3-closing/terminal-checkpoint.json \
            --issue "424" \
            --branch "$WORK_BRANCH" \
            --head-sha "$OWNER_HEAD" \
            --proof-out /tmp/issue424-t3-closing/finalization-proof.json
          python -m tools.continuity_controller verify-finalization-proof \
            /tmp/issue424-t3-closing/terminal-checkpoint.json \
            /tmp/issue424-t3-closing/finalization-proof.json \
            --issue "424" \
            --branch "$WORK_BRANCH" \
            --head-sha "$OWNER_HEAD"
          echo "FINALIZATION_GUARD_PASS=1"
          echo "FINALIZATION_PROOF_VALID=1"

      - name: Upload T3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue424-phase5-t3
          path: |
            /tmp/issue424-t3-pytest.log
            /tmp/issue424-config-before.sha256
            /tmp/issue424-config-after.sha256
            /tmp/issue424-t3-closing/terminal-checkpoint.json
            /tmp/issue424-t3-closing/finalization-proof.json
          if-no-files-found: warn
          retention-days: 14
