name: Issue 479 T1 Final Acceptance

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue479-t1-acceptance.yml'
      - 'tests/process/test_issue425_phase5_t4_final_scene_visibility.py'
      - 'tests/test_phase6_3d_single_source_renderer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FinalScene dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot protected Git objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue479/final-scene
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue479/final-scene/before.digest
      - name: Run FinalScene render query preview visibility regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue295_t7_fold_designer_adapter_4a.py             tests/test_issue295_t7_fold_designer_adapter_4b.py             tests/test_issue295_t7_fold_designer_adapter_4c.py             tests/test_issue370_t6_final_scene_view_owner.py             tests/test_issue393_final_scene_contracts.py             tests/test_issue394_final_scene_projection.py             tests/test_issue395_final_scene_renderer.py             tests/test_phase6_final_scene_view_ownership.py             tests/process/test_issue425_phase5_t4_final_scene_visibility.py             tests/test_phase6_3d_single_source_renderer.py             tests/architecture/test_renderer_ownership.py             tests/projection/test_renderer_behavior.py             2>&1 | tee .scratch/issue479/final-scene/pytest.log
      - name: Verify FinalScene protected invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue479/final-scene/after.digest
          cmp .scratch/issue479/final-scene/before.digest .scratch/issue479/final-scene/after.digest
          git diff --exit-code

  physical-dxf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install physical acceptance dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot physical protected Git objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue479/physical
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue479/physical/before.digest
      - name: Run physical part DXF and persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py             tests/test_resolved_manufacturing_bridge.py             tests/test_resolved_manufacturing_export.py             tests/test_resolved_manufacturing_geometry.py             tests/test_issue41_persistence_parity.py             tests/test_issue45_dynamic_parts_2d_roundtrip.py             2>&1 | tee .scratch/issue479/physical/pytest.log
      - name: Verify physical protected invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue479/physical/after.digest
          cmp .scratch/issue479/physical/before.digest .scratch/issue479/physical/after.digest
          git diff --exit-code

  protected-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run protected architecture ratchets
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short             tests/test_issue396_phase4_composition_root.py             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py
