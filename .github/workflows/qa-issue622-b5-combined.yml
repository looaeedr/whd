name: "WHD｜#622 B5｜Receiving 整合驗收"
run-name: "WHD｜#622 B5｜B1/B2/B4 整合驗收"

on:
  push:
    branches:
      - work/issue628-receiving-rear-panel-overlay-live-switch-20260924
    paths:
      - '.github/workflows/qa-issue622-b5-combined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    name: "B5｜選單＋視窗覆蓋層＋原子切換整合驗收"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "Checkout 精確候選 HEAD"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "安裝 Xvfb 與 Python 相依套件"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -q pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: "驗證 B5 Knowledge Preflight"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/issue622-preflight.txt <<'EOF'
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          long-log-context-safe-execution
          executable-continuity-controller
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "Issue #622 B5 Combined Acceptance workflow: integrated B1 B2 B4 regression" \
            --changed-file '.github/workflows/qa-issue622-b5-combined.yml' \
            --evidence /tmp/issue622-preflight.txt

      - name: "驗證 B1/B2/B4 lineage 與 workflow-only bootstrap"
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c043e447afc0da533ef965fe82d175e75011d186 HEAD
          git merge-base --is-ancestor 952fb35d185530feea5fce81069e6a48d980f12d HEAD
          git merge-base --is-ancestor 5d9d9b3058e0cdcd2ffcafa4bdc0f3d29fef2104 HEAD
          test "$(git rev-parse HEAD^)" = "aa9c25aa44283f325445311b013b26086467395b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/qa-issue622-b5-combined.yml"

      - name: "執行 Headless owner 與 source duplication gate"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue622
          python -m pytest -q \
            tests/test_issue445_settings_presentation_owner.py \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            tests/test_issue447_workspace_shell_owner.py \
            tests/test_issue501_baseline_reset_coordinator.py \
            --tb=short \
            --json-report --json-report-file=/tmp/issue622/headless-report.json

      - name: "執行 Xvfb Combined 使用者路徑／輸出／持久化驗收"
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q \
            tests/test_issue614_receiving_back_panel_selector_reachability.py \
            tests/test_issue510_receiving_back_panel_modes.py \
            tests/test_issue615_workspace_overlay.py \
            tests/test_issue619_atomic_family_live_switch.py \
            tests/test_phase6_t21_live_switch_selector.py \
            tests/test_phase6_3d_retain_and_baseline.py \
            tests/test_phase6_t25_combined_receiving_acceptance.py \
            tests/test_issue517_receiving_live_switch_ui_export_marking.py::test_live_switch_with_visible_3d_replaces_vault_render_with_receiving_geometry \
            tests/test_issue517_receiving_live_switch_ui_export_marking.py::test_structure_tree_selecting_back_panel_exposes_mapped_back_panel_mode_selector \
            tests/test_issue517_receiving_live_switch_ui_export_marking.py::test_actual_gui_batch_export_matches_canonical_resolved_physical_inventory \
            tests/test_phase6_ui_state_regressions.py \
            --deselect=tests/test_phase6_ui_state_regressions.py::test_real_tk_part_selector_menu_opens_part_and_delete_shares_selector_row \
            --tb=short \
            --json-report --json-report-file=/tmp/issue622/xvfb-report.json
          after="$(sha256sum config.ini | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- config.ini
          printf 'config_sha256=%s\n' "$after" > /tmp/issue622/protected-config.txt

      - name: "上傳 B5 Combined 驗收證據"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue622-b5-combined
          path: |
            /tmp/issue622/headless-report.json
            /tmp/issue622/xvfb-report.json
            /tmp/issue622/protected-config.txt
          if-no-files-found: error
