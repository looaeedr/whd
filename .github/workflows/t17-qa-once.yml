name: T17 QA once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t17_qa_trigger.txt'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib -r requirements.txt
      - name: Compile T17 production
        run: python -m py_compile ae_engine/cabinet_types/receiving.py ae_engine/cabinet_types/policy.py ae_engine/assembly_placement.py gui.py
      - name: Record config SHA
        run: sha256sum config.ini | tee /tmp/config_before
      - name: T17 focused and placement guards
        run: |
          xvfb-run -a python -m pytest -q             tests/test_phase6_t17_receiving_inner_door_80.py             tests/test_phase6_t16_receiving_placement.py             tests/test_phase6_t15_inner_door_panels.py             tests/test_phase6_2d_3d_round_trip.py
      - name: Receiving fresh and integration guards
        run: |
          xvfb-run -a python -m pytest -q             tests/test_phase6_t06_receiving_fresh_family.py             tests/test_phase6_t11_integration_matrix.py             tests/test_phase6_receiving_multipart_integration.py
      - name: Slow GUI guards
        run: |
          xvfb-run -a python -m pytest -q             tests/test_phase6_gui_3d_integrity_20260830.py             tests/test_phase6_four_regressions.py             tests/test_phase6_receiving_followup_20260830.py
      - name: Verify config unchanged
        run: |
          sha256sum config.ini | tee /tmp/config_after
          diff -u /tmp/config_before /tmp/config_after
