name: Issue 326 Minimal GREEN Apply

on:
  push:
    branches:
      - fix/issue326-preserve-authority-20260917
    paths:
      - '.github/workflows/qa-issue326-green-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert scheduled wake-up contract without rewriting existing authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          updates = {
              Path('.agents/skills/engineering/executable-continuity-controller/SKILL.md'): (
                  '# Executable Continuity Controller\n',
                  '''\n## SCHEDULED_WAKEUP_CONTINUITY_CONTRACT\n\nThis Skill is the unique operations/semantic CURRENT authority for scheduled wake-up continuity. An automation or schedule is only a wake-up trigger; it never becomes the execution owner. Canonical shorthand: `wake-up trigger != execution owner`.\n\nOn every scheduled wake-up, first restore and live-verify the owning issue/checkpoint/branch/current concrete RUN identity, then continue the owning plan rather than producing a status-only response.\n\n- Concrete RUN exists: lock exact `run_id + head_sha`, poll to terminal, read jobs/logs/evidence, then execute the next autonomous step. `terminal => continue next autonomous step`.\n- No concrete RUN exists when one is required: classify `RUN_NOT_CREATED`; do not wait or poll. Immediately execute/fix the prerequisite or trigger that should create the RUN.\n- GREEN is not an exit reason; advance to the next unfinished gate/slice.\n- RED is not an exit reason; inspect exact failure evidence, classify it, apply the smallest valid TDD repair, and revalidate.\n- A progress/status report is observation only: `status update != exit`.\n- Schedule cadence is wake-up cadence, not execution cadence. Once awake, continue execution/polling inside the available turn.\n- If the platform/tool forces the turn to end, persist `checkpoint before forced turn end`: owning issue, branch, HEAD, RUN identity/status, last accepted gate, next exact action, and prohibitions. The next wake-up resumes from that checkpoint.\n- Project-specific automation prompts may add owner/scope/prohibition data but must reference this contract rather than define a second continuity authority.\n'''
              ),
              Path('.agents/skills/engineering/monitoring-remote-qa/SKILL.md'): (
                  '# Monitoring Remote QA\n',
                  '''\n## SCHEDULED_WAKEUP_CONTINUITY_BRIDGE\n\nScheduled wake-up execution is owned by `.agents/skills/engineering/executable-continuity-controller/SKILL.md`; this Skill **does not own scheduled wake-up execution** and must not create a second execution authority. A schedule only wakes the owning execution context.\n\nOn wake-up, restore the exact owning checkpoint/branch and concrete `run_id + head_sha` before polling. If the owning plan requires a run but no concrete RUN exists, classify `RUN_NOT_CREATED` and immediately execute/fix the prerequisite or trigger instead of waiting. While a locked run is queued/in-progress, retain this Skill's existing polling contract. Terminal status releases only the remote lock; unfinished acceptance returns to the continuity owner as `RUNNING(next_action)` and continues.\n'''
              ),
              Path('個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md'): (
                  '# 長流程持續執行 / 停工點踩坑規則\n',
                  '''\n## SCHEDULED_WAKEUP_STATUS_ONLY_PITFALL\n\n排程／automation 只是 wake-up trigger，不是 execution owner；canonical shorthand：`wake-up trigger != execution owner`。醒來後只做狀態回報再停止，等同把排程誤當 execution cadence，屬於 continuity regression。\n\n- 先恢復 owning issue/checkpoint/branch/current concrete RUN identity。\n- 有 concrete RUN：沿 canonical remote-QA contract 追到 terminal，然後直接進下一個 autonomous step。\n- 沒有 concrete RUN 但 owning plan 需要 RUN：分類 `RUN_NOT_CREATED`，立即處理會建立 RUN 的 prerequisite/trigger/fix，禁止等待。\n- `status update != exit`；GREEN/RED 都不是自動停點。\n- 若平台被迫切斷，先留下完整 durable checkpoint，下一次 wake-up 從 exact next action 恢復。\n- 本段是 REFERENCE/pitfall；唯一 scheduled-wakeup execution authority 仍是 `.agents/skills/engineering/executable-continuity-controller/SKILL.md`。\n'''
              ),
          }

          for path, (anchor, block) in updates.items():
              text = path.read_text(encoding='utf-8')
              assert block.strip().splitlines()[0].lstrip('# ').strip() not in text, path
              assert text.count(anchor) == 1, (path, 'anchor count', text.count(anchor))
              path.write_text(text.replace(anchor, anchor + block, 1), encoding='utf-8')
          PY

          git diff --check
          git diff --name-only | sort | tee /tmp/issue326-green-files.txt
          expected=$(cat <<'EOF'
          .agents/skills/engineering/executable-continuity-controller/SKILL.md
          .agents/skills/engineering/monitoring-remote-qa/SKILL.md
          個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          EOF
          )
          diff -u <(printf '%s\n' "$expected" | sort) /tmp/issue326-green-files.txt
      - name: Commit minimal GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '.agents/skills/engineering/executable-continuity-controller/SKILL.md' \
            '.agents/skills/engineering/monitoring-remote-qa/SKILL.md' \
            '個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md'
          git commit -m '#326 GREEN: add scheduled wake-up continuity without authority loss'
          git push origin HEAD:fix/issue326-preserve-authority-20260917
