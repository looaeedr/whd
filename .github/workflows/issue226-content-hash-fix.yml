name: Issue226 Content Hash Fix

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue226-content-hash-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue225-knowledge-documentation-consolidation-20260914
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch content-hash freeze semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/knowledge_governance.py')
          text = path.read_text(encoding='utf-8')

          old = 'import fnmatch\nimport json\n'
          new = 'import fnmatch\nimport hashlib\nimport json\n'
          assert old in text, 'hashlib import anchor missing'
          text = text.replace(old, new, 1)

          old = '''                "action": action,\n                "metadata_status": metadata_status,\n            }\n'''
          new = '''                "action": action,\n                "metadata_status": metadata_status,\n                "content_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),\n            }\n'''
          assert old in text, 'inventory row anchor missing'
          text = text.replace(old, new, 1)

          old = '''            owners[contract].add(path)\n\n    for rel in changed:\n'''
          new = '''            owners[contract].add(path)\n\n    # PR bases can predate the inventory freeze. A path listed by the PR diff\n    # is not post-freeze drift when its current bytes still match the frozen\n    # inventory snapshot. Only true post-freeze changes enter enforcement.\n    effective_changed: list[str] = []\n    for rel in changed:\n        path = root / rel\n        baseline = baseline_by_path.get(rel)\n        frozen_hash = baseline.get("content_sha256") if baseline else None\n        if (\n            path.is_file()\n            and isinstance(frozen_hash, str)\n            and frozen_hash\n            and hashlib.sha256(path.read_bytes()).hexdigest() == frozen_hash\n        ):\n            continue\n        effective_changed.append(rel)\n    changed = tuple(effective_changed)\n\n    for rel in changed:\n'''
          assert old in text, 'bootstrap effective-changed anchor missing'
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/knowledge_governance.py
          git commit -m "fix(issue226): grandfather unchanged frozen legacy by content hash"
          git push origin HEAD:work/issue225-knowledge-documentation-consolidation-20260914
