name: issue187-durable-writeback-red
on:
  push:
    branches:
      - feat/issue187-3d-output-migration-20260913
    paths:
      - .github/workflows/issue187-durable-writeback-red.yml
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Durable #187 contracts must not exist yet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('.agents/skills/engineering/UI設計與去AI味/SKILL.md').read_text(encoding='utf-8')
          validation = Path('.agents/skills/engineering/驗證板件與DXF/SKILL.md').read_text(encoding='utf-8')
          pitfall = Path('個人AI檔案庫/踩坑庫/legacy_2d_entry_retirement_20260910.md').read_text(encoding='utf-8')
          required = {
              'UI': (ui, 'ISSUE187_3D_OUTPUT_REHOST_CONTRACT'),
              'DXF': (validation, 'ISSUE187_OUTPUT_TRUTH_SEPARATION_CONTRACT'),
              'PITFALL': (pitfall, 'ISSUE187_OUTPUT_MIGRATION_PITFALL'),
          }
          missing = [name for name, (text, marker) in required.items() if marker not in text]
          print('MISSING_DURABLE_CONTRACTS=', missing)
          assert not missing, f'#187 RED: durable contracts not written yet: {missing}'
          PY
