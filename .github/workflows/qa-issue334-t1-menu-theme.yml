name: "QA #334 T1 Menu Theme"

on:
  push:
    branches:
      - ui/issue334-menu-theme-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#334)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact shared-menu RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue334_shared_menu_theme.py::test_all_visible_menu_constructors_route_through_shared_adapter > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#334 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-focused:
    if: ${{ contains(github.event.head_commit.message, 'green(#334)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Source focused GREEN
        run: python -m pytest -q tests/test_issue334_shared_menu_theme.py -k "not real_tk and not postable"

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#334)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: Real Tk / Xvfb menu acceptance
        run: xvfb-run -a python -m pytest -q tests/test_issue334_shared_menu_theme.py

  focused-regression-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#334)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused UI runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: Existing UI regressions
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_issue188_dark_theme_readability.py \
            tests/test_corner_registry_chinese_presentation.py \
            tests/test_issue293_t5_canvas_pointer_slice.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#334)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid protected authority drift
        shell: bash
        run: |
          git diff --name-only d88bf904317fb16744bfc644bb89ff7b405c435e...HEAD | tee issue334-files.txt
          python - <<'PY'
          from pathlib import Path
          changed = {
              line.strip()
              for line in Path("issue334-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          exact_forbidden = {
              "config.ini",
              "phase6_designer_workspace.py",
              "phase6_workspace_controller.py",
              "phase6_project_file.py",
              "phase6_final_scene_view.py",
          }
          forbidden = sorted(
              path for path in changed
              if path in exact_forbidden
              or path.startswith("基準檔/")
              or path.startswith("ae_engine/")
          )
          if forbidden:
              raise SystemExit(f"#334 protected authority drift: {forbidden}")
          print("#334 protected drift PASS", sorted(changed))
          PY

