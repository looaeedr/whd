name: Issue 483 T5 Dead Glue Census

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue483-t5-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical Phase6 preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/preflight
          cat > logs/preflight/issue483-t5-preflight.txt <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
          python tools/phase6_skill_preflight.py             --task "Issue483 T5 Bridge compatibility ratchet and dead-glue cleanup after Phase4 T1-T4 accepted owner decisions. Identify and remove only zero-caller glue, duplicate delegates, stale aliases, or superseded implementations while preserving issue447 NO_EXTRACTION, issue448 C_KEEP_BRIDGE_COMPATIBILITY, issue449 bootstrap-only, reverse-import=0, second composition root=0, facade binding count<=69, and zero behavior/geometry/persistence drift."             --changed-file fold_designer_bridge.py             --evidence logs/preflight/issue483-t5-preflight.txt
      - name: Census bridge top-level symbols and static references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path(".")
          bridge = root / "fold_designer_bridge.py"
          source = bridge.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(bridge))
          defs = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          py_files = [
              path for path in root.rglob("*.py")
              if ".git" not in path.parts
              and "BACKUP" not in path.parts
              and ".scratch" not in path.parts
          ]
          ast_refs = {name: [] for name in defs}
          text_refs = {name: [] for name in defs}

          for path in py_files:
              try:
                  text = path.read_text(encoding="utf-8")
                  parsed = ast.parse(text, filename=str(path))
              except Exception:
                  continue
              for node in ast.walk(parsed):
                  if isinstance(node, ast.Name) and node.id in defs:
                      # Exclude the function's own declaration: FunctionDef.name is not ast.Name.
                      ast_refs[node.id].append((str(path), getattr(node, "lineno", 0)))
              for name in defs:
                  if name in text:
                      text_refs[name].append(str(path))

          candidates = []
          for name, node in defs.items():
              refs = ast_refs[name]
              # A top-level function is a strong deletion candidate only when no static
              # Name reference exists anywhere outside its own body and its exact text
              # appears in bridge only at the definition site.
              bridge_occurrences = source.count(name)
              if not refs and bridge_occurrences == 1:
                  candidates.append({
                      "name": name,
                      "line": node.lineno,
                      "end_line": node.end_lineno,
                      "loc": node.end_lineno - node.lineno + 1,
                      "bridge_occurrences": bridge_occurrences,
                      "text_files": sorted(set(text_refs[name]))[:20],
                  })

          facade_calls = [
              n for n in ast.walk(tree)
              if isinstance(n, ast.Call)
              and isinstance(n.func, ast.Name)
              and n.func.id == "install_fold_designer_bridge_facade"
          ]
          assert len(facade_calls) == 1
          mapping = next(arg for arg in facade_calls[0].args if isinstance(arg, ast.Dict))
          protected = {
              "workspace_shell_exists": Path("phase6_workspace_shell.py").exists(),
              "part_editor_session_exists": Path("phase6_part_editor_session.py").exists(),
              "facade_binding_count": len(mapping.keys),
          }
          print("ISSUE483_CENSUS_JSON=" + json.dumps({
              "bridge_loc": len(source.splitlines()),
              "top_level_functions": len(defs),
              "strong_zero_static_candidates": candidates,
              "protected": protected,
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Verify protected T5 boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
          python -m pytest -q -ra --tb=short             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py             tests/test_issue396_phase4_composition_root.py
