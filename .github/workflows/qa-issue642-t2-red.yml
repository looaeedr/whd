name: WHD｜#642｜T2 Active Claim Checkpoint RED
run-name: "WHD｜#642｜T2 ACTIVE_CLAIM_REQUIRES_CHECKPOINT RED｜${{ github.sha }}"

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - tests/process/test_issue642_active_claim_checkpoint_gate.py
      - .github/workflows/qa-issue642-t2-red.yml

permissions:
  contents: read

jobs:
  red:
    name: 驗證 active claim 缺 checkpoint 目前仍為 RED
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 pytest
        run: python -m pip install pytest
      - name: 實跑 T2 focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/process/test_issue642_active_claim_checkpoint_gate.py             > /tmp/issue642-t2-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue642-t2-red.log
          test "$rc" -ne 0
          grep -q "ACTIVE_CLAIM_REQUIRES_CHECKPOINT" /tmp/issue642-t2-red.log
          echo "ISSUE642_T2_RED=GREEN"
      - name: 上傳 T2 RED 證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue642-t2-red-${{ github.sha }}
          path: /tmp/issue642-t2-red.log
          if-no-files-found: error
          retention-days: 14
