name: "QA #402 T2 scheduled-resume idempotency RED"

on:
  push:
    branches:
      - continuity/issue402-scheduled-resume-idempotency-20260920
    paths:
      - 'tests/process/test_issue402_scheduled_resume_idempotency.py'
      - '.github/workflows/qa-issue402-t2-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 9822b1cbdd48deb6e6bc9779a06c136fb95b157e)" = "9822b1cbdd48deb6e6bc9779a06c136fb95b157e"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm intended T2 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue402_scheduled_resume_idempotency.py --tb=short | tee /tmp/t2-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Eq "ImportError|cannot import name 'claim_scheduled_wake'" /tmp/t2-red.log
          echo "PASS EXPECTED_T2_RED=1"
