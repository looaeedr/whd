name: Bootstrap Flow v2 Issue 873 P4

on:
  push:
    branches:
      - flow-v2/issue873-cutover-r1
    paths:
      - .github/workflows/bootstrap-flow-v2-issue873-p4.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow-v2/issue873-cutover-r1
          fetch-depth: 0

      - name: Download validated P4 core
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0f20-8209-9924-df48042d0752/raw?se=2026-09-28T04%3A39%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=03b7a37f-baec-506a-8ac2-5ef139f90648&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A29%3A55Z&ske=2026-09-29T00%3A29%3A55Z&sks=b&skv=2026-02-06&sig=KUVItwT3G9hdfchTroY0O0ck1jRIdd28quVoaGH%2B32Q%3D' -o /tmp/issue873-p4.zip
          echo 'cdf53677e0c816921129a2eea1cf6de336045056828051362fff53d63c8762be  /tmp/issue873-p4.zip' | sha256sum -c -
          unzip -o /tmp/issue873-p4.zip

      - name: Salvage accepted #684 product evidence only
        shell: bash
        run: |
          set -euo pipefail
          donor='repair/issue684-main-mirror-sealed-20260928'
          git fetch origin "$donor"
          mkdir -p docs/governance tools tests/process
          git show FETCH_HEAD:docs/governance/whd_ha_poweroff_integration_usage.md > docs/governance/whd_ha_poweroff_integration_usage.md
          git show FETCH_HEAD:tools/whd_poweroff_end_to_end_acceptance.py > tools/whd_poweroff_end_to_end_acceptance.py
          git show FETCH_HEAD:tests/process/test_issue684_real_ha_combined_acceptance.py > tests/process/test_issue684_real_ha_combined_acceptance.py

      - name: Run P4 and #684 focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q --confcutdir=tests/process             tests/process/test_flow_v2_execution_record_shadow.py             tests/process/test_flow_v2_execution_cutover_gate.py             tests/process/test_flow_v2_execution_record_bootstrap.py             tests/process/test_flow_v2_execution_authority_policy.py             tests/process/test_issue684_real_ha_combined_acceptance.py

      - name: Commit validated P4 core and #684 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools tests docs/governance
          git commit -m 'feat(#873): add Flow v2 cutover core and preserve #684 acceptance evidence'
          git push origin HEAD:flow-v2/issue873-cutover-r1
