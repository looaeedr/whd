name: "QA #400 T0 scheduled-resume census RED"

on:
  push:
    branches:
      - continuity/issue400-scheduled-resume-census-20260920
    paths:
      - 'tests/process/test_issue400_scheduled_resume_census.py'
      - 'docs/superpowers/checkpoints/issue400-scheduled-resume-census.md'
      - '.github/workflows/qa-issue400-t0-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 57d06c793df66982238e25641fa9f84f20cf970e)" = "57d06c793df66982238e25641fa9f84f20cf970e"
      - name: Install test harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Confirm exact T0 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue400_scheduled_resume_census.py --tb=short | tee /tmp/t0-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "2 failed, 1 passed" /tmp/t0-red.log
          grep -q "no executable generic tools/scheduled_resume_bridge.py exists" /tmp/t0-red.log
          grep -q "canonical continuity controller has no scheduled-resume delegation API" /tmp/t0-red.log
          echo "PASS EXPECTED_T0_RED=2"
      - name: Production-source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 57d06c793df66982238e25641fa9f84f20cf970e...HEAD | tee /tmp/files.txt
          test "$(grep -Ec '^(tools/continuity_controller.py|tools/scheduled_resume_bridge.py|\.agents/skills/)' /tmp/files.txt || true)" -eq 0
          echo "PASS PRODUCTION_SOURCE_DRIFT=0"
