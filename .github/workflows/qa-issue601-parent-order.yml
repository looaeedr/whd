name: WHD｜#601｜Merge parent-order RED／GREEN
run-name: "WHD｜#601｜Merge parent-order focused｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue601-parent-order-reconciliation-20260924

permissions:
  contents: read

jobs:
  focused:
    name: "Focused｜merge-sync claim reconciliation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout exact branch"
        uses: actions/checkout@v4
      - name: "安裝 Tk 測試環境"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: "安裝 pytest"
        run: python -m pip install pytest
      - name: "執行 parent-order focused tests"
        run: python -m pytest -q tests/process/test_issue570_merge_head_claim_reconciliation.py
