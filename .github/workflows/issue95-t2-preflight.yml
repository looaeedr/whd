name: Issue95 T2 Preflight
on:
  push:
    branches: [feat/issue95-authoritative-parts-projection-20260910]
    paths:
      - .github/workflows/issue95-t2-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build evidence
        run: |
          cat > /tmp/issue95_evidence.md <<'EOF'
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          截角資料入口收斂
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
      - name: T2 task preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task '#92/#95 T2 Authoritative Parts Projection：截角資料只投影 authoritative workspace/current physical parts，stable part key 為 identity；涵蓋 multipart、多門、多底板、中隔、dynamic topology；禁止固定 2D part list 或第二份 state' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue95_corner_data_authoritative_parts.py \
            --evidence /tmp/issue95_evidence.md
