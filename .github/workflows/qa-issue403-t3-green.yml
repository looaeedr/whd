name: "QA #403 T3 runtime recovery policy GREEN"

on:
  push:
    branches:
      - continuity/issue403-runtime-recovery-policy-20260920
    paths:
      - 'tools/continuity_controller.py'
      - 'tools/scheduled_resume_runtime.py'
      - 'tools/scheduled_resume_bridge.py'
      - 'tools/scheduled_resume_lease.py'
      - 'tests/process/test_issue403_runtime_recovery_policy.py'
      - 'tests/process/test_issue401_scheduled_resume_dispatcher.py'
      - 'tests/process/test_issue402_scheduled_resume_idempotency.py'
      - '.github/workflows/qa-issue403-t3-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 72bab371157bb6bd18c97c4a6f08d3187750495f)" = "72bab371157bb6bd18c97c4a6f08d3187750495f"
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: T3 focused runtime policy
        run: python -m pytest -q tests/process/test_issue403_runtime_recovery_policy.py --tb=short
      - name: T1-T2 bridge and lease regressions
        run: |
          python -m pytest -q             tests/process/test_issue401_scheduled_resume_dispatcher.py             tests/process/test_issue402_scheduled_resume_idempotency.py             tests/process/test_issue402_durable_github_lease.py             --tb=short
      - name: Canonical continuity regressions
        run: |
          python -m pytest -q             tests/process/test_continuity_controller.py             tests/process/test_finalization_owner_guard.py             tests/process/test_issue321_turn_exit_enforcement.py             --tb=short
      - name: Scope
        run: |
          set -euo pipefail
          git diff --check 72bab371157bb6bd18c97c4a6f08d3187750495f...HEAD
          git diff --name-only 72bab371157bb6bd18c97c4a6f08d3187750495f...HEAD | tee /tmp/files.txt
          test "$(grep -Ec '^(gui.py|fold_designer_bridge.py|gui_modules/|ae_engine/|config.ini|基準檔/)' /tmp/files.txt || true)" -eq 0
          echo "PASS HOURLY_REMOTE_STALE_POLICY=1"
          echo "PASS BLOCKED_ESCALATION_BACKOFF=1"
          echo "PASS TERMINAL_CLOSING_HANDOFF=1"
          echo "PASS PROTECTED_DRIFT=0"
