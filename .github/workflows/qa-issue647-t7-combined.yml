name: "WHD | #647 T7 Combined Acceptance"

on:
  push:
    branches:
      - "workorder/issue640-guard-turn-exit-helper-hardening-20260925"
    paths:
      - ".github/workflows/qa-issue647-t7-combined.yml"

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install process-test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest matplotlib -r requirements.txt

      - name: Focused #640/#647 process acceptance
        run: |
          python -m pytest -q --confcutdir=tests/process \
            tests/process/test_issue540_stale_claim_takeover.py \
            tests/process/test_issue641_closing_turn_exit_red.py \
            tests/process/test_issue641_helper_reservation_red.py \
            tests/process/test_issue642_active_claim_checkpoint_gate.py \
            tests/process/test_issue643_guard_transaction_gate.py \
            tests/process/test_issue644_trusted_turn_exit_gate.py \
            tests/process/test_issue645_helper_reservation_race.py \
            tests/process/test_issue558_post_commit_claim_head_reconcile.py \
            tests/process/test_issue560_remote_finalization_executor.py \
            tests/process/test_issue567_reopened_released_claim_recovery.py \
            tests/process/test_issue570_merge_head_claim_reconciliation.py \
            tests/process/test_issue573_sibling_scheduler_takeover.py \
            tests/process/test_issue578_scheduler_runtime_liveness.py \
            tests/process/test_issue589_user_directed_interactive_owner_takeover.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_finalization_owner_guard.py

      - name: Governance and writeback readback
        run: |
          python -m pytest -q \
            tests/knowledge/test_combined_authority_acceptance_contract.py \
            tests/knowledge/test_executable_continuity_routing_alignment.py \
            tests/process/test_issue270_durable_governance_writeback.py \
            tests/process/test_remote_execution_guard_skill_contract.py \
            tests/process/test_write_scheduler_skill_contract.py \
            tests/test_issue_closure_completion_skill_contract.py \
            tests/test_remote_qa_monitoring_skill_contract.py

      - name: Trusted default-branch artifacts are exact accepted blobs
        run: |
          git fetch --no-tags origin main cleanup/2d-3d-sync
          test "$(git rev-parse refs/remotes/origin/main:.github/workflows/whd-remote-claim-activation.yml)" = "13d0b673a26a2912917df89234bd29428563cd10"
          test "$(git rev-parse refs/remotes/origin/main:.github/workflows/whd-turn-exit-gate.yml)" = "41bf76f78c9af8246947939660daf05f525989d8"
          test "$(git rev-parse refs/remotes/origin/main:.github/workflows/whd-remote-execution-guard.yml)" = "c6e96581c47b4d46704f719877174f9248928f5e"
          git merge-base --is-ancestor 2bf5969aba8c8aa033b314f0d6f92165239f67c0 refs/remotes/origin/cleanup/2d-3d-sync
          echo "ISSUE647_TRUSTED_DEFAULT_BRANCH_READBACK=GREEN"

      - name: Canonical fingerprint and turn-exit SSOT checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import inspect
          import tools.continuity_controller as continuity

          skill = Path(".agents/skills/engineering/executable-continuity-controller/SKILL.md").read_text(encoding="utf-8")
          dispatch = Path(".agents/skills/engineering/派工/SKILL.md").read_text(encoding="utf-8")
          sig = inspect.signature(continuity.assert_turn_exitable)
          required = {"claim_state", "transaction_state"}
          assert required.issubset(sig.parameters), sig
          assert "load_checkpoint" in skill
          assert "checkpoint_fingerprint" in skill
          assert "authorize-finalization" in skill or "authorize_finalization" in skill
          assert "load_checkpoint" in dispatch
          assert "checkpoint_fingerprint" in dispatch
          print("ISSUE647_GOVERNANCE_SSOT=GREEN")
          PY
