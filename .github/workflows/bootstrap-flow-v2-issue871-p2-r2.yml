name: Bootstrap Flow v2 Issue 871 P2 r2

on:
  push:
    branches:
      - flow-v2/issue871-atomic-transactions-r2
    paths:
      - .github/workflows/bootstrap-flow-v2-issue871-p2-r2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow-v2/issue871-atomic-transactions-r2
          fetch-depth: 0

      - name: Download validated P2 bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1404-8209-bee7-1af1cedcf8fd/raw?se=2026-09-28T04%3A26%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=41bd0ef8-8c27-5816-9456-d2316ed76916&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A39%3A58Z&ske=2026-09-29T00%3A39%3A58Z&sks=b&skv=2026-02-06&sig=o%2BZOD2pKhf35ht5z5Pc0DrBH%2BBdiKqM2pHnzJsv2iAo%3D' -o /tmp/issue871-p2.zip
          echo '25a919fb14b92fbc00bccd64dccdc90d19a9f5ff8378f72609f9dd71df271f88  /tmp/issue871-p2.zip' | sha256sum -c -
          unzip -o /tmp/issue871-p2.zip
          rm -f .github/workflows/bootstrap-flow-v2-issue871-p2-r2.yml

      - name: Run P2 focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q             tests/process/test_flow_v2_atomic_control_transaction.py             tests/process/test_flow_v2_control_transaction_transport.py             tests/process/test_flow_v2_control_transaction_terminal_executor.py             tests/process/test_flow_v2_execution_action_contract.py             tests/process/test_flow_v2_control_transaction_shadow_workflow.py             tests/process/test_flow_v2_terminal_shadow_workflow_contract.py

      - name: Commit validated P2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools tests .github/workflows .flow-v2/execution-fence.json
          git commit -m 'feat(#871): atomic transactions and terminal-only transport'
          git push origin HEAD:flow-v2/issue871-atomic-transactions-r2