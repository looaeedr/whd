name: Issue 312 T8 Final Qualification

on:
  push:
    branches:
      - ci-sharding/issue312-t8-final-qualification-20260917
    paths:
      - 'tests/test_issue312_t8_final_qualification.py'
      - 'tools/issue312_t8_final_qualification.py'
      - '.github/workflows/qa-issue312-t8-final-qualification.yml'
      - 'docs/superpowers/checkpoints/issue312-t8-preflight-evidence.txt'
      - 'docs/superpowers/checkpoints/issue312-t8.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Run T8 qualification RED contract
        run: python -m pytest -q tests/test_issue312_t8_final_qualification.py
