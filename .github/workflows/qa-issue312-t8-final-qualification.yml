name: Issue 312 T8 Final Qualification

on:
  push:
    branches:
      - ci-sharding/issue312-t8-final-qualification-20260917
    paths:
      - 'tests/test_issue312_t8_final_qualification.py'
      - 'tools/issue312_t8_final_qualification.py'
      - 'tools/issue312_t8_drift_audit.py'
      - 'tools/issue312_t8_cleanup_gate.py'
      - '.github/workflows/qa-issue312-t8-final-qualification.yml'
      - 'docs/superpowers/checkpoints/issue312-t8-preflight-evidence.txt'
      - 'docs/superpowers/checkpoints/issue312-t8.json'
      - 'docs/superpowers/checkpoints/issue312-t8-drift-evidence.md'
      - 'docs/superpowers/checkpoints/issue312-t8-cleanup-evidence.md'
      - 'docs/superpowers/checkpoints/issue312-t8-knowledge-readback.md'
      - 'docs/superpowers/checkpoints/issue312-t8-final-payload.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-enforce T8 Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Run final CI integration qualification from the exact accepted T7 tested SHA, preserve tested/orchestration identity separation, secure fresh optimized acceptance evidence before cleanup, qualify production drift read-only, persist durable CI rules, and stop at QUALIFIED_FOR_INTEGRATION until explicit user authorization 合." \
            --changed-file tests/test_issue312_t8_final_qualification.py \
            --changed-file tools/issue312_t8_final_qualification.py \
            --changed-file tools/issue312_t8_drift_audit.py \
            --changed-file tools/issue312_t8_cleanup_gate.py \
            --changed-file .github/workflows/qa-issue312-t8-final-qualification.yml \
            --changed-file docs/superpowers/checkpoints/issue312-t8-preflight-evidence.txt \
            --changed-file docs/superpowers/checkpoints/issue312-t8.json \
            --changed-file docs/superpowers/checkpoints/issue312-t8-drift-evidence.md \
            --changed-file docs/superpowers/checkpoints/issue312-t8-cleanup-evidence.md \
            --changed-file docs/superpowers/checkpoints/issue312-t8-knowledge-readback.md \
            --changed-file docs/superpowers/checkpoints/issue312-t8-final-payload.json \
            --evidence docs/superpowers/checkpoints/issue312-t8-preflight-evidence.txt
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Run T8 qualification contract
        run: python -m pytest -q tests/test_issue312_t8_final_qualification.py
