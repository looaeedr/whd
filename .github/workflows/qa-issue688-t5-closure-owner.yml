name: "QA #688 T5 closure-owner contract"

on:
  push:
    branches:
      - work/issue688-ticket-closure-owner-20260926
    paths:
      - tests/process/test_issue688_ticket_closure_owner_contract.py
      - tools/ticket_breakdown_guard.py
      - .agents/skills/engineering/拆解任務工單/SKILL.md
      - .github/workflows/qa-issue688-t5-closure-owner.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused harness
        run: python -m pip install pytest

      - name: Run RED-STOP-14 focused behavior contract
        run: python -m pytest -q tests/process/test_issue688_ticket_closure_owner_contract.py --tb=short
