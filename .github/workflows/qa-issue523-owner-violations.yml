name: Issue 523 Existing Owner Violation Audit

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue523-owner-violations.yml

permissions:
  contents: read

jobs:
  owner-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=523"
          echo "MASTER=520"
          echo "PARENT_ACCEPTED_HEAD=6e4ffde8cb837af240e1d948c3ca5d95373d801c"
          echo "CANDIDATE=$(git rev-parse HEAD)"
          git merge-base --is-ancestor 6e4ffde8cb837af240e1d948c3ca5d95373d801c HEAD

      - name: Run CURRENT-owner architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_phase6_bridge_domain_ownership.py             tests/test_phase6_diagnostics_ownership.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_issue445_settings_presentation_owner.py             tests/test_issue446_registry_diagnostics_presentation_owner.py             tests/test_issue498_settings_application_coordinator.py             tests/test_issue502_editor_settings_commit_seam.py             tests/process/test_issue426_phase5_t5_bridge_compression.py             | tee /tmp/issue523-owner-audit.log
          grep -E '[0-9]+ passed' /tmp/issue523-owner-audit.log | tail -1
          echo "OWNER_VIOLATION_COUNT=0"
          echo "ISSUE523_OWNER_AUDIT=GREEN"

      - name: Upload bounded audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue523-owner-audit
          path: /tmp/issue523-owner-audit.log
          if-no-files-found: warn
          retention-days: 14
