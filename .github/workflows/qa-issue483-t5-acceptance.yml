name: Issue 483 T5 Focused Acceptance

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue483-t5-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T1-T5 ownership and protected ratchets
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short             tests/test_issue483_t5_bridge_dead_glue_cleanup.py             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py             tests/test_issue396_phase4_composition_root.py

  behavior-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot protected config and DXF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue483
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue483/before.digest
      - name: Run behavior geometry persistence and DXF acceptance
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_phase6_final_scene_view_ownership.py             tests/test_phase6_settings_center_bridge.py             tests/test_phase6_designer_workspace.py             tests/test_fold_designer_joint_state.py             tests/test_issue41_persistence_parity.py             tests/test_resolved_manufacturing_bridge.py             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py             2>&1 | tee .scratch/issue483/pytest.log
      - name: Verify protected config and DXF unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue483/after.digest
          cmp .scratch/issue483/before.digest .scratch/issue483/after.digest
          git diff --exit-code

  deletion-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deletion evidence and no over-cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("docs/superpowers/checkpoints/issue483-t5-dead-glue-deletion.json")
              .read_text(encoding="utf-8")
          )
          assert evidence["deletion_class"] == "ZERO_CALLER_GLUE"
          assert len(evidence["deleted"]) == 6
          names = {row["name"] for row in evidence["deleted"]}

          tree = ast.parse(Path("fold_designer_bridge.py").read_text(encoding="utf-8"))
          funcs = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          assert names.isdisjoint(funcs)
          for keep in (
              "_phase6_rebuild_linked_endcaps",
              "_phase6_settings_box_structure_projection",
              "_phase6_settings_endcap_fw_projection",
              "_phase6_settings_bottom_wrap_projection",
              "_phase6_settings_corner_projection",
              "_phase6_settings_context_extension_projection",
              "_phase6_sync_settings_panel_extension",
              "_fix11_init",
          ):
              assert keep in funcs
          print("ISSUE483_DELETION_EVIDENCE_GREEN")
          PY
