name: WHD｜#756｜Post-drift coordination write parity
run-name: WHD｜#756｜Post-drift coordination write parity

on:
  push:
    branches:
      - governance/issue756-postdrift-coord-write-parity-20260927
    paths:
      - 'tools/execution_claim_guard.py'
      - '.github/workflows/whd-remote-execution-guard.yml'
      - 'tests/process/test_issue739_write_auto_consume.py'
      - '.github/workflows/qa-issue756-postdrift-coord-write-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: '#756 coordination-write parity regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Run #755 coordination-write auto-consume
        run: python -m pytest tests/process/test_issue739_write_auto_consume.py -q
      - name: Run protected Guard regressions
        if: always()
        run: >-
          python -m pytest -q
          tests/process/test_issue739_pr_write_auto_consume.py
          tests/process/test_issue643_guard_transaction_gate.py
          tests/process/test_issue731_branch_create_auto_consume.py
