name: WHD｜#618 A3｜Baseline 與 DXF 分離最終驗收
run-name: WHD｜#618 A3｜精確版本遠端驗收｜${{ github.sha }}

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - .github/workflows/qa-issue618-a3-final.yml

permissions:
  contents: read

concurrency:
  group: issue618-a3-final
  cancel-in-progress: false

jobs:
  acceptance:
    name: A3｜結構、Baseline、DXF、reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 反讀 exact 驗收版本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝驗收相依套件
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 鎖定 exact SHA 與受保護輸入
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          sha256sum config.ini > /tmp/issue618-config-before.sha256
          find 基準檔 -type f -iname '*.dxf' -print0 | sort -z | xargs -0 -r sha256sum > /tmp/issue618-dxf-before.sha256
          test -s /tmp/issue618-dxf-before.sha256
      - name: 執行 P7-R-C 與 ASCG 結構驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue618-structural.xml             tests/test_issue618_phase7_a3_dxf_serialization.py             tests/test_issue618_phase7_a3_baseline_resources.py             tests/test_issue618_phase7_a3_legacy_scene_adapter.py             tests/test_phase6_baseline_source_cache.py             tests/test_phase6_derived_cache_owner.py             tests/test_baseline_resource_resolution.py             tests/process/test_issue533_c1_anti_regrowth.py

      - name: 執行 Baseline／DXF／reopen 製造驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue618-manufacturing.xml             tests/test_phase6_baseline_operation_alignment.py             tests/test_phase6_t08_endcap_baseline_features.py             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py             tests/test_receiving_door_dxf_roundtrip.py             tests/test_resolved_manufacturing_export.py             tests/test_engineering_drawing_integration.py
      - name: 執行 Xvfb 交叉環境驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          xvfb-run -a pytest -q --junitxml=issue618-xvfb.xml             tests/test_issue618_phase7_a3_legacy_scene_adapter.py             tests/test_receiving_door_dxf_roundtrip.py             tests/test_engineering_drawing_integration.py             tests/test_dxf_acceptance.py

      - name: 驗證 config.ini 與基準 DXF 未被修改
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/issue618-config-after.sha256
          find 基準檔 -type f -iname '*.dxf' -print0 | sort -z | xargs -0 -r sha256sum > /tmp/issue618-dxf-after.sha256
          diff -u /tmp/issue618-config-before.sha256 /tmp/issue618-config-after.sha256
          diff -u /tmp/issue618-dxf-before.sha256 /tmp/issue618-dxf-after.sha256
          echo "ISSUE618_PROTECTED_INPUTS_GREEN=1"
      - name: 上傳 #618 A3 驗收證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue618-a3-final-${{ github.sha }}
          path: |
            issue618-structural.xml
            issue618-manufacturing.xml
            issue618-xvfb.xml
          if-no-files-found: warn
          retention-days: 14
