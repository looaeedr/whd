name: Issue74 Physical Solid Acceptance
on:
  push:
    branches: [fix/issue74-physical-solid-collision]
    paths:
      - ae_engine/assembly_collision.py
      - ae_engine/divider_manufacturing.py
      - tests/test_issue74_divider_side_front_penetration.py
      - tests/test_issue71_divider_relief_components.py
      - tests/test_issue63_regression_red.py
      - .github/workflows/issue74-physical-solid-acceptance.yml
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: config before
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Issue74 exact physical
        run: pytest -q -s tests/test_issue74_divider_side_front_penetration.py
      - name: Divider topology guards
        run: pytest -q -s tests/test_issue71_divider_relief_components.py tests/test_issue39_divider_relief.py
      - name: Resolved EndCap Divider parity
        run: xvfb-run -a pytest -q -s tests/test_issue63_regression_red.py::test_issue63_resolved_divider_matches_resolved_head_tail_middle_and_hole_edge_parity
      - name: config after
        shell: bash
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
