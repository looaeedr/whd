name: Issue 207 T3 Preflight

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - '.github/workflows/issue207-t3-preflight.yml'
      - '.scratch/issue207/**'
      - '.scratch/issue207-t3-checkpoint.md'
      - 'docs/superpowers/plans/2026-09-14-gui-pure-drawing-move.md'
  workflow_dispatch:

jobs:
  t3-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase6 preflight for planned changed files
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .scratch/issue207/run
          python tools/phase6_skill_preflight.py \
            --task "Issue #207 T3 strict move-only extraction of proven-safe gui.py drawing helpers into gui_modules/drawing.py; preserve compatibility and behavior" \
            --changed-file 'gui.py' \
            --changed-file 'gui_modules/__init__.py' \
            --changed-file 'gui_modules/drawing.py' \
            --changed-file 'tests/test_issue206_gui_modularization_characterization.py' \
            --changed-file '.scratch/issue207/preflight-evidence.md' \
            --changed-file '.scratch/issue207-t3-checkpoint.md' \
            --changed-file 'docs/superpowers/plans/2026-09-14-gui-pure-drawing-move.md' \
            --evidence '.scratch/issue207/preflight-evidence.md' \
            | tee .scratch/issue207/run/preflight.txt
      - name: Assert pre-implementation production drift is zero
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync --depth=1
          changed=$(git diff --name-only origin/cleanup/2d-3d-sync...HEAD -- . \
            ':!.scratch/**' \
            ':!docs/superpowers/plans/2026-09-14-gui-pure-drawing-move.md' \
            ':!.github/workflows/issue207-t3-preflight.yml')
          if [ -n "$changed" ]; then
            echo "Unexpected production changes before T3 implementation:"
            echo "$changed"
            exit 1
          fi
          echo 'preimplementation_production_drift=0' | tee .scratch/issue207/run/drift.txt
      - name: Upload T3 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue207-t3-preflight
          path: .scratch/issue207/run/
