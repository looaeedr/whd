name: Restore Sheet-metal Menu Apply + GREEN

on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-menu-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal production restore
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('fold_designer_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Legacy menu remains as a compatibility object for old callbacks/tests, but\n    # #124 removes it as an operator-facing navigation surface.\n    self.part_choice_button = original.ttk.Menubutton(self.part_selector, textvariable=self.part_var)\n    self.part_choice_menu = original.tk.Menu(self.part_choice_button, tearoff=False)\n    self.part_choice_button.configure(menu=self.part_choice_menu)\n'''
          new = '''    # The compact sheet-metal menu and the Structure Tree are two presentation\n    # projections of the same authoritative part_var / workspace callbacks.\n    # Keep the existing menu visible; do not create a second state owner.\n    self.part_choice_button = original.ttk.Menubutton(self.part_selector, textvariable=self.part_var)\n    self.part_choice_menu = original.tk.Menu(self.part_choice_button, tearoff=False)\n    self.part_choice_button.configure(menu=self.part_choice_menu)\n    self.part_choice_button.pack(fill=original.tk.X, pady=(0, 4))\n'''
          count = text.count(old)
          assert count == 1, f'expected one exact sheet-metal menu marker, got {count}'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff -- fold_designer_bridge.py
      - name: Install Xvfb and focused dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Capture protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Run direct-3D sheet-metal selector GREEN
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -s tests/test_issue186_sheetmetal_selector_visibility.py
      - name: Verify protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          test "$(git diff --name-only | sort)" = "fold_designer_bridge.py"
      - name: Commit verified production restore
        run: |
          set -euo pipefail
          git config user.name 'WHD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fold_designer_bridge.py
          git commit -m 'fix(ui): restore sheet-metal part menu'
          git push origin HEAD:fix/restore-sheetmetal-structure-tree-20260917
