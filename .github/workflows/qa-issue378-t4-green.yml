name: "QA #378 T4 assembly MouseWheel GREEN"

on:
  push:
    branches:
      - ui/issue378-assembly-mousewheel-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue378_assembly_mousewheel.py'
      - '.github/workflows/qa-issue378-t4-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD f2910e4da945808844862e269a727b5a8ef1e7a8)" = "f2910e4da945808844862e269a727b5a8ef1e7a8"
          echo "T4_BASELINE=f2910e4da945808844862e269a727b5a8ef1e7a8"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Capture protected hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before

      - name: T4 focused MouseWheel regression
        run: python -m pytest -q tests/test_issue378_assembly_mousewheel.py --tb=short

      - name: Inherited UI regressions
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue376_assembly_collapsible_data.py             tests/test_issue377_remove_wrapper_labels.py             tests/test_issue186_sheetmetal_selector_visibility.py             --tb=short

      - name: Protected invariants and scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          cmp /tmp/config.before /tmp/config.after
          cmp /tmp/baseline.before /tmp/baseline.after
          git diff --name-only f2910e4da945808844862e269a727b5a8ef1e7a8...HEAD | tee /tmp/t4-files.txt
          test "$(grep -Ec '^(基準檔/|config.ini$|ae_engine/)' /tmp/t4-files.txt || true)" -eq 0
          echo "PASS PROTECTED_DRIFT=0"
