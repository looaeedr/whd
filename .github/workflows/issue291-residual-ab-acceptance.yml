name: Issue291 residual AB acceptance diagnostic

on:
  push:
    branches:
      - qa/issue291-residual-ab-diagnostic-20260916
    paths:
      - '.github/workflows/issue291-residual-ab-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: issue291-residual-ab-acceptance-diagnostic
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  focused:
    name: Focused topology contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run 11 stale-owner contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_endcap_regression_and_text_scale.py::test_ui_sources_expose_small_medium_large_text_size_controls \
            tests/test_issue100_remove_legacy_2d_entry.py::test_t7_main_create_widgets_has_no_user_reachable_legacy_2d_notebook \
            tests/test_issue123_ui_foundation.py::test_project_toolbar_uses_engineering_action_hierarchy \
            tests/test_issue123_ui_foundation.py::test_project_toolbar_is_compact_and_not_marketing_copy \
            tests/test_issue123_ui_foundation.py::test_gui_keeps_toolbar_presentation_public_surface_after_move \
            tests/test_issue98_existing_2d_capability_migration.py::test_direct_application_host_installs_new_view_callback_without_returning_to_legacy_notebook \
            tests/test_phase6_home_baseline_ui.py::test_main_gui_wires_lazy_baseline_numeric_query_into_3d \
            tests/test_phase6_project_file.py::test_project_file_controls_are_global_not_embedded_in_3d_settings_footer \
            tests/test_phase6_tail_native_orientation_and_save.py::test_project_file_controls_are_global_not_in_fold_designer_footer \
            tests/test_separate_3d_entry_contract.py::test_3d_is_separate_entry_not_workspace_mode \
            tests/test_separate_3d_entry_contract.py::test_main_gui_no_longer_embeds_legacy_workspace_mode_frames

  structural:
    name: T3 structural contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run structural contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_issue291_gui_phase2_t3_selector.py

  residual-ab:
    name: Parent candidate residual A-B
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d46de1f2babb4bef269550880d40949cb38a68a8
          path: parent
      - uses: actions/checkout@v4
        with:
          ref: cefb1a11c837a73508a6a2b09eac77ba38c798f6
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate/requirements.txt pytest matplotlib
      - name: Prove exact 5 residuals are inherited
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'tests/knowledge/test_issue233_strict_metadata_migration.py::test_all_governed_markdown_has_valid_whd_doc_meta_v1'
            'tests/knowledge/test_issue233_strict_metadata_migration.py::test_strict_validator_accepts_the_repository_after_migration'
            'tests/knowledge/test_issue252_t6_strict_validation.py::test_exact_governed_set_matches_effective_authority_and_strict_validation'
            'tests/knowledge/test_issue255_t6_authority_completion.py::test_repository_effective_authority_is_total_and_unblocked'
            'tests/test_phase6_semantic_doc_status.py::test_current_overlay_docs_point_to_v3_standard_plus_semantic_delta'
          )
          run_side() {
            side="$1"
            pushd "$side" >/dev/null
            set +e
            PYTHONPATH="$PWD" python -m pytest -q "${tests[@]}" > "../${side}.log" 2>&1
            rc=$?
            set -e
            popd >/dev/null
            cat "${side}.log"
            test "$rc" -ne 0
            test "$(grep -c '^FAILED ' "${side}.log")" -eq 5
            grep -Fq '5 failed' "${side}.log"
            for node in "${tests[@]}"; do grep -Fq "$node" "${side}.log"; done
          }
          run_side parent
          run_side candidate
          echo 'Exact residual A/B: PASS — same 5 nodeids fail on parent and candidate.'

  protected-drift:
    name: Protected drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=f11ab72850d893f5935ad869ab8ae9205fc0cd92
          git cat-file -e "$BASE^{commit}"
          git diff --quiet "$BASE"...cefb1a11c837a73508a6a2b09eac77ba38c798f6 -- config.ini '基準檔/**' 'ae_engine/**' phase6_project_file.py phase6_fold_profiles.py
          echo 'Protected-path drift: PASS'

  headless:
    name: Headless exact inherited residuals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run full headless and require exact inherited residual set
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -q > headless.log 2>&1
          rc=$?
          set -e
          cat headless.log
          test "$rc" -ne 0
          test "$(grep -c '^FAILED ' headless.log)" -eq 5
          grep -Fq '5 failed' headless.log
          expected=(
            'tests/knowledge/test_issue233_strict_metadata_migration.py::test_all_governed_markdown_has_valid_whd_doc_meta_v1'
            'tests/knowledge/test_issue233_strict_metadata_migration.py::test_strict_validator_accepts_the_repository_after_migration'
            'tests/knowledge/test_issue252_t6_strict_validation.py::test_exact_governed_set_matches_effective_authority_and_strict_validation'
            'tests/knowledge/test_issue255_t6_authority_completion.py::test_repository_effective_authority_is_total_and_unblocked'
            'tests/test_phase6_semantic_doc_status.py::test_current_overlay_docs_point_to_v3_standard_plus_semantic_delta'
          )
          for node in "${expected[@]}"; do grep -Fq "$node" headless.log; done
          echo 'Headless residual classification: PASS'

  xvfb:
    name: Xvfb exact inherited residuals
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run full Xvfb and require exact inherited residual set
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          xvfb-run -a python -m pytest -q > xvfb.log 2>&1
          rc=$?
          set -e
          echo "PYTEST_RC=$rc"
          echo '--- pytest tail ---'
          tail -n 120 xvfb.log || true
          echo '--- FAILED lines ---'
          grep '^FAILED ' xvfb.log || true
          python - "$rc" <<'PY'
          import re
          import sys
          from pathlib import Path

          rc = int(sys.argv[1])
          text = Path('xvfb.log').read_text(encoding='utf-8', errors='replace')
          expected = [
              'tests/knowledge/test_issue233_strict_metadata_migration.py::test_all_governed_markdown_has_valid_whd_doc_meta_v1',
              'tests/knowledge/test_issue233_strict_metadata_migration.py::test_strict_validator_accepts_the_repository_after_migration',
              'tests/knowledge/test_issue252_t6_strict_validation.py::test_exact_governed_set_matches_effective_authority_and_strict_validation',
              'tests/knowledge/test_issue255_t6_authority_completion.py::test_repository_effective_authority_is_total_and_unblocked',
              'tests/test_phase6_semantic_doc_status.py::test_current_overlay_docs_point_to_v3_standard_plus_semantic_delta',
          ]
          actual = re.findall(r'^FAILED ([^\s]+)', text, flags=re.MULTILINE)
          unique = list(dict.fromkeys(actual))
          missing = [node for node in expected if node not in unique]
          extra = [node for node in unique if node not in expected]
          summary_ok = '5 failed' in text
          print(f'Xvfb diagnostic: rc={rc} failed_lines={len(actual)} unique_failed={len(unique)} summary_has_5_failed={summary_ok}')
          print('Xvfb actual nodeids:')
          for node in unique:
              print(f'  {node}')
          print(f'Xvfb missing expected: {missing}')
          print(f'Xvfb unexpected extra: {extra}')
          ok = (
              rc != 0
              and len(actual) == 5
              and len(unique) == 5
              and set(unique) == set(expected)
              and summary_ok
          )
          if not ok:
              print('Xvfb residual classification: FAIL')
              raise SystemExit(1)
          print('Xvfb residual classification: PASS')
          PY

  reconciliation:
    name: Candidate reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify QA branch differs from candidate only by workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE=cefb1a11c837a73508a6a2b09eac77ba38c798f6
          git diff --name-only "$BASE"...HEAD
          git diff --quiet "$BASE"...HEAD -- ':!.github/workflows/issue291-residual-ab-acceptance.yml'
          echo 'Candidate reconciliation: PASS'
