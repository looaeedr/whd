name: "QA #394 T5 GREEN pure Final Scene projection"

on:
  push:
    branches:
      - "refactor/issue394-phase4-t5-final-scene-projection-20260920"
    paths:
      - "phase6_final_scene_projection.py"
      - "phase6_final_scene_view.py"
      - "fold_designer_bridge.py"
      - "tests/test_issue394_final_scene_projection.py"
      - "tools/issue394_t5_projection_fingerprint.py"
      - ".github/workflows/qa-issue394-t5-green.yml"

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=394"
          echo "PREDECESSOR=40f09602dcf1be3d08f859ab88a9780cad075fc5"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor 40f09602dcf1be3d08f859ab88a9780cad075fc5 HEAD

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Compile projection/view
        run: |
          python -m py_compile             phase6_final_scene_projection.py             phase6_final_scene_view.py             tools/issue394_t5_projection_fingerprint.py

      - name: T5 projection ownership GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue394_final_scene_projection.py --tb=short
          echo "ISSUE394_T5_PROJECTION_OWNER_GREEN=1"

      - name: Projection definition predecessor A-B
        shell: bash
        run: |
          set -euo pipefail
          base=40f09602dcf1be3d08f859ab88a9780cad075fc5
          rm -rf /tmp/issue394-base
          git worktree add --detach /tmp/issue394-base "$base"
          python tools/issue394_t5_projection_fingerprint.py             --source /tmp/issue394-base/phase6_final_scene_view.py             > /tmp/issue394-baseline.json
          python tools/issue394_t5_projection_fingerprint.py             --source phase6_final_scene_projection.py             > /tmp/issue394-candidate.json
          python - <<'PY'
          import json
          b=json.load(open("/tmp/issue394-baseline.json",encoding="utf-8"))
          c=json.load(open("/tmp/issue394-candidate.json",encoding="utf-8"))
          assert b["count"] == c["count"] == 22, (b["count"],c["count"])
          assert b["hashes"] == c["hashes"], {
              k:(b["hashes"].get(k),c["hashes"].get(k))
              for k in sorted(set(b["hashes"]) | set(c["hashes"]))
              if b["hashes"].get(k) != c["hashes"].get(k)
          }
          assert b["aggregate"] == c["aggregate"]
          print("UNEXPLAINED_3D_PROJECTION_DELTA=0")
          print("ISSUE394_T5_MOVED_DEFINITIONS=22")
          PY

      - name: Final Scene projection regression matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_phase6_final_scene_view_ownership.py             tests/test_phase6_3d_cutting_mesh.py             tests/test_phase6_assembly_3d_view.py             tests/test_phase6_t05_multi_door_flow.py::test_receiving_assembly_resolved_parts_place_upper_and_lower_doors_separately             tests/test_phase6_t20_receiving_baseplate_placement.py::test_receiving_per_door_base_plates_have_authoritative_distinct_placements             tests/test_assembly_placement_divider.py::test_3d_assembly_places_divider_with_correct_orientation             tests/test_phase6_t04_inner_door_frames.py::test_frame_render_data_has_own_blank_bends_and_fold_profile             tests/test_phase6_t15_inner_door_panels.py::test_3d_workspace_generates_panels_only_for_checked_outer_doors_and_keeps_guards_green             tests/test_fold_designer_joint_state.py::test_bridge_sync_joint_state_updates_intent_and_preserves_user_wrap             tests/test_joint_diagnostics_contract.py::test_assembly_scene_bundle_carries_joint_diagnostics_and_selection             --tb=short
          echo "ISSUE394_T5_PROJECTION_MATRIX_GREEN=1"

      - name: Projection purity / no duplicate formula
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          projection=Path("phase6_final_scene_projection.py")
          view=Path("phase6_final_scene_view.py")
          psource=projection.read_text(encoding="utf-8")
          vsource=view.read_text(encoding="utf-8")
          ptree=ast.parse(psource,filename=str(projection))
          vtree=ast.parse(vsource,filename=str(view))
          imports=set()
          for n in ast.walk(ptree):
              if isinstance(n,ast.Import):
                  imports.update(a.name for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  imports.add(n.module)
          bad=sorted(
              x for x in imports
              if x=="tkinter" or x.startswith("tkinter.")
              or x=="fold_designer_bridge"
              or x.startswith("gui")
              or x.startswith("matplotlib")
              or x=="whd_theme"
          )
          assert not bad,bad
          assert "self." not in psource
          for token in (".ax3d","add_collection3d",".plot(",".draw(",".draw_idle("):
              assert token not in psource,token
          moved={
              "_phase6_profile_base_index","_phase6_profile_geometry",
              "_phase6_fold_mask_for_cross_coordinate","_phase6_profile_map_with_guides",
              "_phase6_profile_map","_phase6_profile_flat_map",
              "_phase6_folded_mesh_from_polygon","_phase6_mesh_feature_segments",
              "_phase6_fitted_limits_from_vertices","_phase6_scene_fold_boundaries",
              "_phase6_profile_to_scene_boundaries","_phase6_fold_ownership_exemptions",
              "_default_number_text","_phase6_folded_outside_envelope",
              "_phase6_profile_operator_fold_values","_phase6_contract_profile_rows",
              "_phase6_box_body_piece_world_mapper","_phase6_box_body_piece_dimension_lines",
              "_phase6_box_body_structure_meshes","format_operator_info_text",
              "_phase6_triangle_bounds","_phase6_place_assembly_triangles",
          }
          view_defs={
              n.name for n in vtree.body
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))
          }
          assert not (moved & view_defs),sorted(moved & view_defs)
          print("FINAL_SCENE_PROJECTION_RENDERER_MUTATION=0")
          print("FINAL_SCENE_PROJECTION_TK_REFS=0")
          print("FINAL_SCENE_PROJECTION_REVERSE_IMPORTS=0")
          print("FINAL_SCENE_DUPLICATE_PROJECTION_FORMULAS=0")
          PY

      - name: Scope and protected drift
        shell: bash
        run: |
          set -euo pipefail
          base=40f09602dcf1be3d08f859ab88a9780cad075fc5
          git diff --name-only "$base"...HEAD | sort | tee /tmp/issue394-changed
          python - <<'PY'
          from pathlib import Path
          changed=set(Path("/tmp/issue394-changed").read_text().splitlines())
          allowed={
            "phase6_final_scene_projection.py",
            "phase6_final_scene_view.py",
            "fold_designer_bridge.py",
            "tests/test_issue394_final_scene_projection.py",
            "tools/issue394_t5_projection_fingerprint.py",
            ".github/workflows/qa-issue394-t5-red.yml",
            ".github/workflows/qa-issue394-t5-green.yml",
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected,unexpected
          print("ISSUE394_T5_SCOPE_GREEN=1")
          PY
          protected=(
            phase6_final_scene_contracts.py
            phase6_settings_contracts.py
            phase6_settings_transitions.py
            phase6_settings_service.py
            phase6_settings_transaction_controller.py
            phase6_settings_panel.py
            phase6_workspace_navigation_controller.py
            phase6_project_controller.py
            phase6_registry_diagnostics_controller.py
            phase6_corner_data_view_adapter.py
            phase6_manufacturing_cache.py
            phase6_manufacturing_contracts.py
            phase6_manufacturing_geometry.py
            phase6_manufacturing_service.py
            phase6_manufacturing_adapter.py
            config.ini
            ae_engine/cabinet_types/policy.py
            ae_engine/cabinet_types/receiving.py
            ae_engine/cabinet_types/vault.py
          )
          git diff --exit-code "$base"...HEAD -- "${protected[@]}"
          echo "ISSUE394_T5_PROTECTED_DRIFT=0"

  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Final Scene real-view regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_3d_view_regressions.py             tests/test_phase6_3d_operator_view.py             tests/test_phase6_assembly_3d_view.py             --tb=short
          echo "ISSUE394_T5_XVFB_GREEN=1"
