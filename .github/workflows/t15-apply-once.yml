name: T15 apply once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t15_apply_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - name: Apply T15 anchored patch
        run: python .github/t15_apply_patch.py
      - name: Compile changed production
        run: python -m py_compile gui.py fold_designer_bridge.py ae_engine/manufacturing_api.py ae_engine/inner_door_panels.py ae_engine/cabinet_types/receiving.py ae_engine/cabinet_types/policy.py
      - name: Commit T15 large-file patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui.py fold_designer_bridge.py ae_engine/manufacturing_api.py
          git commit -m 'feat(T15): wire per-door inner panel into 2D and 3D'
          git push origin HEAD:cleanup/2d-3d-sync
