name: WHD Performance Baseline Evidence

on:
  pull_request:
    branches:
      - localX
    paths:
      - '.github/workflows/whd-performance-baseline-evidence.yml'
      - 'tools/whd_performance_baseline.py'
      - 'tools/merge_whd_performance_baseline.py'
      - 'tests/test_whd_performance_baseline_merge.py'
      # True Tk performance evidence must run when certified physical
      # source-flat geometry/triangulation costs change, not just harnesses.
      - 'ae_engine/receiving_base_fixing_plate_geometry.py'
      - 'gui_modules/application/fold_designer_manufacturing_projection.py'
      - 'phase6_manufacturing_adapter.py'
      - 'gui_modules/application/command_router.py'
      - 'gui_modules/application/lifecycle.py'
      - 'phase6_sync_envelope.py'
      # Changing the active view must never commit hidden Receiving Bay geometry.
      - 'gui_modules/application/fold_designer_part_session.py'
      - 'gui_modules/application/fold_designer_composition_receiving.py'
      - 'docs/performance/issue1816-baseline.md'

permissions:
  contents: read

concurrency:
  group: whd-performance-evidence-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measured-tk-bays:
    # Each real worker gets its own runner. Do not time multiple GUI processes
    # on a shared runner or dilute the original three samples and five cycles.
    name: Measured Tk sample (${{ matrix.bays }} Bay, sample ${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        bays: [3, 1]
        sample: [0, 1, 2]
    env:
      TZ: Asia/Taipei
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: TkAgg
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # An existing Ubuntu runner image may already provide a working GUI
      # stack. Probe a real Tk window inside Xvfb before skipping any apt step;
      # missing or broken components still use the original install fallback.
      - name: Probe existing Xvfb and real Tk
        id: gui-runtime
        shell: bash
        run: |
          set -euo pipefail
          if command -v Xvfb >/dev/null 2>&1 \
            && command -v xvfb-run >/dev/null 2>&1 \
            && xvfb-run -a python -c 'import tkinter; root = tkinter.Tk(); root.update(); root.destroy()'; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'CI_TK_RUNTIME_PREINSTALLED=true; skip APT'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'CI_TK_RUNTIME_PREINSTALLED=false; install GUI runtime'
          fi
      - name: Install missing GUI runtime
        if: steps.gui-runtime.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Install benchmark Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt matplotlib pytest psutil
      - name: Verify real Tk before measurements
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -c 'import tkinter; root = tkinter.Tk(); root.update(); root.destroy()'
          echo 'CI_TK_RUNTIME_READY=true'
      - name: Record environment and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/perf
          {
            echo "kind=LINUX_CLOUD_REFERENCE_NOT_WINDOWS_UAT"
            echo "repo=looaeedr/whd"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            lscpu
            python -V
            python -m pip freeze
            sha256sum config.ini tools/whd_performance_baseline.py
          } > work/perf/environment.txt
      - name: Observe real Tk latency in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            python tools/whd_performance_baseline.py \
            --samples 3 --cycles 5 --bay-scope ${{ matrix.bays }} \
            --sample-index ${{ matrix.sample }} \
            --output work/perf/baseline-b${{ matrix.bays }}-s${{ matrix.sample }}.json
      - name: Print sample counts median and P95 without inventing missing data
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('work/perf/baseline-b${{ matrix.bays }}-s${{ matrix.sample }}.json')
          if not p.exists():
              print('BASELINE_REPORT_MISSING; inspect worker logs and artifact')
          else:
              result = json.loads(p.read_text(encoding='utf-8'))
              print('BASELINE_HEAD_SHA:', result['metadata']['source_sha'])
              print('BASELINE_KIND: LINUX_CLOUD_REFERENCE, not Windows UAT')
              print('BASELINE_PENDING:', result['metadata']['pending'])
              for row in result['summary']:
                  print(json.dumps(row, ensure_ascii=False, sort_keys=True))
              failures = [x for x in result['rows'] if x['status'] != 'ok']
              print('FAILED_SAMPLES:', len(failures))
              for item in failures[:10]:
                  print('FAIL:', item['bays'], item['operation'], item['error'])
          PY
      - name: Keep raw measurement journals and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whd-issue1816-tk-baseline-b${{ matrix.bays }}-s${{ matrix.sample }}
          path: work/perf/
          if-no-files-found: error
          retention-days: 14

  baseline-evidence:
    # Keep the existing required check name and original aggregate artifact.
    # Any of the six genuine worker failures blocks publication.
    name: Measured Tk baseline (Linux cloud reference)
    needs: measured-tk-bays
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout exact candidate for evidence reconciliation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all six independent Bay/sample artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: whd-issue1816-tk-baseline-b*-s*
          path: work/perf
          merge-multiple: false
      - name: Reconcile all real samples at one immutable source SHA
        run: |
          set -euo pipefail
          python tools/merge_whd_performance_baseline.py \
            --input-dir work/perf \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --samples 3 --cycles 5 --isolated-samples
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("work/perf/baseline.json").read_text(encoding="utf-8"))
          print("BASELINE_HEAD_SHA:", data["metadata"]["source_sha"])
          print("BASELINE_KIND: LINUX_CLOUD_REFERENCE, not Windows UAT")
          print("BASELINE_PENDING:", data["metadata"]["pending"])
          for entry in data["summary"]:
              print(json.dumps(entry, ensure_ascii=False, sort_keys=True))
          print("FAILED_SAMPLES:", sum(row["status"] != "ok" for row in data["rows"]))
          PY
      - name: Preserve original consolidated evidence and both raw runner environments
        uses: actions/upload-artifact@v4
        with:
          name: whd-issue1816-tk-baseline-raw
          path: work/perf/
          if-no-files-found: error
          retention-days: 14
