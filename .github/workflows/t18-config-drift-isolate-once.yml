name: T18 config drift verify once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t18_config_drift_trigger.txt'

permissions:
  contents: read

jobs:
  verify-config-drift-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt

      - name: Verify isolated UI text-size test preserves config
        shell: bash
        run: |
          set -e
          expected=980eab68d4a1732a5313b22329852dfc9691c83e4e2a64cccd18022afae4ee67
          before=$(sha256sum config.ini | awk '{print $1}')
          echo "T18_CONFIG_BEFORE $before"
          test "$before" = "$expected"
          xvfb-run -a python -m pytest -q             tests/test_phase6_t08_ui_text_and_edge_selectors.py::test_fold_designer_controls_and_edge_selectors_update_on_text_size_changed
          after=$(sha256sum config.ini | awk '{print $1}')
          echo "T18_CONFIG_AFTER $after"
          test "$after" = "$expected"
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"
