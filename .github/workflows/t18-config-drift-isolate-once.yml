name: T18 config drift isolate once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t18_config_drift_trigger.txt'

permissions:
  contents: read

jobs:
  isolate-config-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt

      - name: Isolate config.ini mutating nodeid
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee t18_config_drift.log
          from __future__ import annotations
          import difflib
          import hashlib
          import subprocess
          from pathlib import Path

          EXPECTED = "980eab68d4a1732a5313b22329852dfc9691c83e4e2a64cccd18022afae4ee67"
          config = Path("config.ini")
          canonical = config.read_bytes()

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def run_pytest(nodeids):
              cmd = ["xvfb-run", "-a", "python", "-m", "pytest", "-q", *nodeids]
              cp = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(cp.stdout, end="")
              return cp.returncode

          print("T18_CONFIG_INITIAL_SHA", sha(canonical))
          assert sha(canonical) == EXPECTED

          collect = subprocess.run(
              ["xvfb-run", "-a", "python", "-m", "pytest", "--collect-only", "-q", "tests"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          )
          print(collect.stdout, end="")
          if collect.returncode != 0:
              raise SystemExit(80)
          nodeids = [line.strip() for line in collect.stdout.splitlines() if "::" in line and not line.startswith("=")]
          print("T18_CONFIG_COLLECTION", len(nodeids))
          if len(nodeids) != 1516:
              raise SystemExit(81)

          batch_size = 12
          for start in range(0, len(nodeids), batch_size):
              batch = nodeids[start:start + batch_size]
              config.write_bytes(canonical)
              print(f"T18_CONFIG_BATCH start={start} count={len(batch)}")
              rc = run_pytest(batch)
              if rc != 0:
                  print("T18_CONFIG_BATCH_TEST_FAILURE", start, rc)
                  raise SystemExit(rc)
              after = config.read_bytes()
              if sha(after) == EXPECTED:
                  continue

              print("T18_CONFIG_DRIFT_BATCH", start, batch)
              print("T18_CONFIG_DRIFT_BATCH_SHA", sha(after))

              for nodeid in batch:
                  config.write_bytes(canonical)
                  print("T18_CONFIG_SINGLE", nodeid)
                  rc = run_pytest([nodeid])
                  if rc != 0:
                      print("T18_CONFIG_SINGLE_TEST_FAILURE", nodeid, rc)
                      raise SystemExit(rc)
                  one_after = config.read_bytes()
                  one_sha = sha(one_after)
                  if one_sha != EXPECTED:
                      print("T18_CONFIG_DRIFT_NODEID", nodeid)
                      print("T18_CONFIG_DRIFT_SHA", one_sha)
                      before_text = canonical.decode("utf-8", errors="replace").splitlines()
                      after_text = one_after.decode("utf-8", errors="replace").splitlines()
                      for line in difflib.unified_diff(
                          before_text, after_text,
                          fromfile="config.ini.canonical",
                          tofile="config.ini.after",
                          lineterm="",
                      ):
                          print(line)
                      raise SystemExit(42)

              print("T18_CONFIG_DRIFT_ORDER_DEPENDENT_BATCH", start, batch)
              raise SystemExit(43)

          print("T18_CONFIG_NO_DRIFT_FOUND")
          raise SystemExit(0)
          PY
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Upload isolation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t18-config-drift-isolation
          path: t18_config_drift.log
          if-no-files-found: error
