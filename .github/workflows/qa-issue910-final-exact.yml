name: WHD｜#910｜Final exact 3D startup + runtime LOG
run-name: "WHD｜#910｜Final exact｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue910-3d-startup-runtime-log-20260928
    paths:
      - gui.py
      - gui_modules/application/lifecycle.py
      - gui_modules/runtime_error_log.py
      - tests/test_issue910_runtime_error_log.py
      - .github/workflows/qa-issue910-final-exact.yml

permissions:
  contents: read

jobs:
  final-exact-xvfb:
    name: Final exact 真 Tk 3D startup + runtime LOG
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 GUI / 測試相依
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib

      - name: 鎖 exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "ISSUE910_EXACT_SHA=${GITHUB_SHA}"

      - name: 語法檢查
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            gui.py \
            gui_modules/application/lifecycle.py \
            gui_modules/runtime_error_log.py

      - name: 真 Tk / Xvfb final exact regression
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue910_runtime_error_log.py \
            tests/test_issue189_direct_3d_startup.py \
            tests/test_phase6_3d_view_regressions.py \
            tests/test_phase6_3d_single_source_renderer.py \
            --tb=short | tee issue910-final-exact.log
          echo "ISSUE910_FINAL_EXACT_GREEN=1" | tee -a issue910-final-exact.log

      - name: 上傳 final exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue910-final-exact-${{ github.sha }}
          path: issue910-final-exact.log
          if-no-files-found: warn
          retention-days: 14
