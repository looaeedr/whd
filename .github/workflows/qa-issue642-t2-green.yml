name: WHD｜#642｜T2 Active Claim Checkpoint GREEN
run-name: "WHD｜#642｜T2 ACTIVE_CLAIM_REQUIRES_CHECKPOINT GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - .github/workflows/qa-issue642-t2-green.yml
      - .github/workflows/whd-remote-claim-activation.yml
      - .github/workflows/whd-remote-execution-guard.yml
      - tools/execution_claim_guard.py
      - tests/process/test_issue642_active_claim_checkpoint_gate.py
      - tests/process/test_issue256_execution_claim_guard.py

permissions:
  contents: read

jobs:
  green:
    name: 驗證 active claim checkpoint machine gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 pytest
        run: python -m pip install pytest
      - name: Compile canonical guard
        run: python -m py_compile tools/execution_claim_guard.py
      - name: Focused GREEN + regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/process/test_issue642_active_claim_checkpoint_gate.py \
            tests/process/test_issue256_execution_claim_guard.py \
            tests/process/test_issue567_reopened_released_claim_recovery.py \
            tests/process/test_issue540_stale_claim_takeover.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_finalization_owner_guard.py \
            > /tmp/issue642-t2-green.log 2>&1
          cat /tmp/issue642-t2-green.log
          grep -q "passed" /tmp/issue642-t2-green.log
          echo "ISSUE642_T2_GREEN=PASS"
      - name: 上傳 T2 GREEN 證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue642-t2-green-${{ github.sha }}
          path: /tmp/issue642-t2-green.log
          if-no-files-found: error
          retention-days: 14
