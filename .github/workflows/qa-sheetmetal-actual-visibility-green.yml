name: Sheet-metal Actual Visibility GREEN

on:
  push:
    branches:
      - fix/sheetmetal-selector-actually-visible-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-actual-visibility-green.yml'

permissions:
  contents: write

jobs:
  clean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Build clean candidate from production
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin
          git switch -C fix/sheetmetal-actual-visibility-clean-integration-20260917 origin/fix/sheetmetal-actual-visibility-clean-integration-20260917

          git show 76e048f9bc6ab540d73601d3d07e5aaff1ef9455:fold_designer_bridge.py > fold_designer_bridge.py
          git show 76e048f9bc6ab540d73601d3d07e5aaff1ef9455:tests/test_issue186_sheetmetal_selector_visibility.py > tests/test_issue186_sheetmetal_selector_visibility.py

          python - <<'PY'
          from pathlib import Path
          updates = {
              Path('.agents/skills/engineering/UI設計與去AI味/SKILL.md'): '''### REAL_PIXEL_VISIBILITY_GATE_V1
- Tk 控制項 `winfo_ismapped()` / geometry manager 非空，只能證明它被 geometry manager 管理，不能證明操作者真的看得到。若控制項與 Canvas / sibling 疊層共存，驗收至少要檢查：viewport 交集為正、實際寬高為正、控制項中心點 `winfo_containing()` 命中該控制項或其子元件，而不是被 Canvas / overlay 蓋住。
- 現代啟動 UI 的「可見」驗收必須包含 real-pixel / stacking hit-test；不得再以 object exists、`mapped == 1`、pack/grid manager 非空單獨宣稱可見。
- Canvas `create_window(window=...)` 若嵌入的是 Canvas 的 sibling/root child，必須明確處理 stacking order；mapped child 仍可能被 sibling Canvas 完整塗在下面。''',
              Path('個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'): '''### SHEETMETAL_SELECTOR_CANVAS_OCCLUSION_20260917
- 症狀：鈑金選單物件存在、`winfo_ismapped()==1`，測試看似 GREEN，但現場完全看不到。
- 根因：`self.left` 是 root child，卻透過 sibling `left_scroll_canvas.create_window(..., window=self.left)` 顯示；Canvas 的 stacking order 在上層，把 embedded left workspace 與鈑金 Menubutton 畫在下面。
- 修法：在 Canvas/scrollbar/right 完成 pack 後，明確 `self.left.lift(self.left_scroll_canvas)`，保持既有 selector/state/callback，不新增第二套狀態。
- 防錯：UI 可見性回歸必須做 pixel hit-test（中心點 topmost widget）、viewport intersection、實際尺寸；`mapped` 不能當作真實可見性的充分條件。''',
          }
          for path, block in updates.items():
              text = path.read_text(encoding='utf-8')
              marker = block.splitlines()[0].lstrip('# ').strip()
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
          PY

          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(cat <<'EOF'
          .agents/skills/engineering/UI設計與去AI味/SKILL.md
          fold_designer_bridge.py
          tests/test_issue186_sheetmetal_selector_visibility.py
          個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          EOF
          )
          diff -u <(printf '%s\n' "$expected" | sort) <(printf '%s\n' "$changed" | sort)
      - name: Verify clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
          xvfb-run -a python -m pytest -q -s \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_issue124_structure_tree.py
          python tools/validate_knowledge_docs.py \
            '.agents/skills/engineering/UI設計與去AI味/SKILL.md' \
            '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          test ! -e .github/workflows/qa-sheetmetal-actual-visibility-clean-writer.yml
          test ! -e .github/workflows/qa-sheetmetal-actual-visibility-green.yml
      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WHD QA'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            fold_designer_bridge.py \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            '.agents/skills/engineering/UI設計與去AI味/SKILL.md' \
            '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          git commit -m 'Fix actual sheet-metal selector visibility and guard real pixels'
          git push origin HEAD:fix/sheetmetal-actual-visibility-clean-integration-20260917
          echo "CLEAN_HEAD=$(git rev-parse HEAD)"
