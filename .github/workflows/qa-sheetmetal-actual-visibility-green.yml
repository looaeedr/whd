name: Sheet-metal Actual Visibility GREEN

on:
  push:
    branches:
      - fix/sheetmetal-selector-actually-visible-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-actual-visibility-green.yml'

permissions:
  contents: write

jobs:
  clean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Build code-only clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin
          git switch -C fix/sheetmetal-actual-visibility-clean-integration-20260917 origin/fix/sheetmetal-actual-visibility-clean-integration-20260917
          git show 76e048f9bc6ab540d73601d3d07e5aaff1ef9455:fold_designer_bridge.py > fold_designer_bridge.py
          git show 76e048f9bc6ab540d73601d3d07e5aaff1ef9455:tests/test_issue186_sheetmetal_selector_visibility.py > tests/test_issue186_sheetmetal_selector_visibility.py
          git diff --check
          changed=$(git diff --name-only | sort)
          printf '%s\n' fold_designer_bridge.py tests/test_issue186_sheetmetal_selector_visibility.py | sort > /tmp/expected.txt
          printf '%s\n' "$changed" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Verify code-only clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
          xvfb-run -a python -m pytest -q -s tests/test_issue186_sheetmetal_selector_visibility.py tests/test_issue124_structure_tree.py
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          test ! -e .github/workflows/qa-sheetmetal-actual-visibility-green.yml
      - name: Commit code-only clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WHD QA'
          git config user.email 'actions@users.noreply.github.com'
          git add fold_designer_bridge.py tests/test_issue186_sheetmetal_selector_visibility.py
          git commit -m 'Fix actual sheet-metal selector visibility'
          git push origin HEAD:fix/sheetmetal-actual-visibility-clean-integration-20260917
          echo "CLEAN_HEAD=$(git rev-parse HEAD)"
