name: Sheet-metal Actual Visibility GREEN

on:
  push:
    branches:
      - fix/sheetmetal-selector-actually-visible-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-actual-visibility-green.yml'

jobs:
  final-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Verify exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin
          git switch --detach 14ac21e40be1e97bad762ef11ce39e4a88576ea1
          test "$(git rev-parse HEAD)" = '14ac21e40be1e97bad762ef11ce39e4a88576ea1'
          git diff --check 0511eb40b75cd7e3df1e3e745e8ec0fd8dae3730..HEAD
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
          xvfb-run -a python -m pytest -q -s \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_issue124_structure_tree.py
          python - <<'PY'
          from pathlib import Path
          from tools.knowledge_governance import parse_doc_metadata
          checks = {
              '.agents/skills/engineering/UI設計與去AI味/SKILL.md': ('CURRENT', 'ui-design-de-ai', 'REAL_PIXEL_VISIBILITY_GATE_V1'),
              '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md': ('REFERENCE', 'pitfall-ledger', 'SHEETMETAL_SELECTOR_CANVAS_OCCLUSION_20260917'),
          }
          for rel, (role, contract, marker) in checks.items():
              text = Path(rel).read_text(encoding='utf-8')
              meta = parse_doc_metadata(text, path=rel)
              assert meta.role == role and meta.contract == contract
              assert meta.schema == 'WHD_DOC_META_V1' and meta.canonical is None
              assert marker in text
          print('FINAL_DOC_GATE_GREEN=2')
          PY
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          test ! -e .github/workflows/qa-sheetmetal-actual-visibility-green.yml
          test ! -e .github/workflows/qa-sheetmetal-actual-visibility-clean-writer.yml
          grep -F 'self.left.lift(self.left_scroll_canvas)' fold_designer_bridge.py
          grep -F 'test_issue186_sheetmetal_compact_menu_has_real_unobscured_pixels' tests/test_issue186_sheetmetal_selector_visibility.py
          echo 'FINAL_VISIBILITY_CANDIDATE_GREEN=14ac21e40be1e97bad762ef11ce39e4a88576ea1'
