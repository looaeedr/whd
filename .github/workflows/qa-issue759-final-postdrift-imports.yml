name: WHD｜#759｜Final post-drift Remote Guard imports
run-name: WHD｜#759｜Final post-drift Remote Guard imports

on:
  push:
    branches:
      - governance/issue759-final-postdrift-remote-guard-imports-20260927
    paths:
      - '.github/workflows/whd-remote-execution-guard.yml'
      - '.agents/skills/engineering/remote-execution-guard/SKILL.md'
      - '.agents/skills/engineering/派工/SKILL.md'
      - '個人AI檔案庫/踩坑庫/execution_claim_hard_gate_pitfall.md'
      - '.github/workflows/qa-issue759-final-postdrift-imports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: '#759 Remote Guard import + coord-write regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Verify embedded Python imports and authority blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/whd-remote-execution-guard.yml').read_text(encoding='utf-8')
          assert wf.count('import subprocess') == 2
          assert wf.count('import urllib.parse') == 2
          for path in [
              '.agents/skills/engineering/remote-execution-guard/SKILL.md',
              '.agents/skills/engineering/派工/SKILL.md',
              '個人AI檔案庫/踩坑庫/execution_claim_hard_gate_pitfall.md',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              assert 'COORD_WRITE_EXACT_COMMIT_AUTO_CONSUME_V1' in text, path
          PY
      - name: Run coordination-write and protected Guard regressions
        run: >-
          python -m pytest -q
          tests/process/test_issue739_write_auto_consume.py
          tests/process/test_issue739_pr_write_auto_consume.py
          tests/process/test_issue643_guard_transaction_gate.py
          tests/process/test_issue731_branch_create_auto_consume.py
