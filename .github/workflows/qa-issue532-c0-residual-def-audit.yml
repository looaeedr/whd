name: WHD｜#532｜C0 殘餘函式 caller 稽核
run-name: "WHD｜#532｜C0 殘餘函式 caller 稽核｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue532-c0-residual-def-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: C0 無內部 caller 函式 repo-wide AST 稽核
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 掃描 residual top-level defs 與外部 bridge consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue532-c0-residual-def-audit.log
          import ast
          import json
          import subprocess
          from pathlib import Path

          bridge=Path("fold_designer_bridge.py")
          source=bridge.read_text(encoding="utf-8")
          tree=ast.parse(source, filename=str(bridge))

          top_defs=[
              node for node in tree.body
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))
          ]
          starts=[node.lineno for node in top_defs]
          load_names=[
              node.id for node in ast.walk(tree)
              if isinstance(node,ast.Name) and isinstance(node.ctx,ast.Load)
          ]

          candidates=[]
          for i,node in enumerate(top_defs):
              # A top-level function with no Name-load in bridge has no direct internal/facade caller.
              # Dynamic string callers are handled below by repo-wide bridge access scan.
              if node.name in load_names:
                  continue
              end=(starts[i+1]-1) if i+1<len(starts) else len(source.splitlines())
              candidates.append({
                  "name":node.name,
                  "start":node.lineno,
                  "end":end,
                  "span":end-node.lineno+1,
              })

          raw=subprocess.check_output(["git","ls-files","-z"])
          tracked=[
              Path(p.decode("utf-8",errors="surrogateescape"))
              for p in raw.split(b"\0") if p
          ]

          refs={row["name"]:[] for row in candidates}
          generic_dynamic=[]
          unreadable=[]
          names=set(refs)

          # Count application-composition required("...") bridge namespace ports
          # as real runtime consumers. Without this, string-bound FinalScene
          # ports can be misclassified as zero-caller and deleted.
          composition_path=Path("gui_modules/application/fold_designer_adapter.py")
          composition_source=composition_path.read_text(encoding="utf-8")
          composition_tree=ast.parse(
              composition_source,
              filename=str(composition_path),
          )
          for node in ast.walk(composition_tree):
              if (
                  isinstance(node,ast.Call)
                  and isinstance(node.func,ast.Name)
                  and node.func.id=="required"
                  and node.args
                  and isinstance(node.args[0],ast.Constant)
                  and isinstance(node.args[0].value,str)
                  and node.args[0].value in names
              ):
                  refs[node.args[0].value].append({
                      "path":str(composition_path),
                      "line":node.lineno,
                      "kind":"composition_required_namespace",
                      "category":"production",
                  })

          def category(path):
              s=str(path).replace("\\","/")
              if s.startswith("tests/"):
                  return "tests"
              if s.startswith("tools/"):
                  return "tools"
              if s.startswith(".agents/"):
                  return "skills"
              return "production"

          for path in tracked:
              s=str(path).replace("\\","/")
              if path==bridge or not s.endswith(".py"):
                  continue
              if s.startswith("BACKUP/") or s.startswith("基準檔/"):
                  continue
              try:
                  text=path.read_text(encoding="utf-8")
                  mod=ast.parse(text, filename=s)
              except Exception as exc:
                  unreadable.append({"path":s,"error":type(exc).__name__})
                  continue

              aliases=set()
              for node in ast.walk(mod):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name=="fold_designer_bridge":
                              aliases.add(a.asname or "fold_designer_bridge")
                  elif isinstance(node,ast.ImportFrom) and node.module=="fold_designer_bridge":
                      for a in node.names:
                          if a.name in names:
                              refs[a.name].append({
                                  "path":s,"line":node.lineno,
                                  "kind":"from_import","category":category(path),
                              })

              for node in ast.walk(mod):
                  if (
                      isinstance(node,ast.Attribute)
                      and isinstance(node.value,ast.Name)
                      and node.value.id in aliases
                      and node.attr in names
                  ):
                      refs[node.attr].append({
                          "path":s,"line":node.lineno,
                          "kind":"module_attribute","category":category(path),
                      })
                  if (
                      isinstance(node,ast.Call)
                      and isinstance(node.func,ast.Name)
                      and node.func.id in {"getattr","hasattr","setattr"}
                      and len(node.args)>=2
                      and isinstance(node.args[0],ast.Name)
                      and node.args[0].id in aliases
                  ):
                      attr=node.args[1]
                      if isinstance(attr,ast.Constant) and isinstance(attr.value,str):
                          if attr.value in names:
                              refs[attr.value].append({
                                  "path":s,"line":node.lineno,
                                  "kind":"dynamic_exact","category":category(path),
                              })
                      else:
                          # Finite dynamic loops keep the target names as string literals
                          # in the same tracked file. Only those candidates are blocked.
                          possible=[name for name in names if name in text]
                          generic_dynamic.append({
                              "path":s,"line":node.lineno,
                              "kind":node.func.id,
                              "possible_targets":sorted(possible),
                          })
                          for name in possible:
                              refs[name].append({
                                  "path":s,"line":node.lineno,
                                  "kind":"dynamic_finite_text","category":category(path),
                              })

          safe=[]
          compat=[]
          runtime=[]
          for row in candidates:
              evidence=refs[row["name"]]
              prod=[r for r in evidence if r["category"]=="production"]
              nonprod=[r for r in evidence if r["category"]!="production"]
              item={**row,"production_refs":prod,"compat_refs":nonprod}
              if unreadable:
                  item["decision"]="BLOCKED_UNREADABLE_CURRENT_PYTHON"
              elif prod:
                  item["decision"]="RETAIN_CURRENT_RUNTIME_CONSUMER"
                  runtime.append(item)
              elif nonprod:
                  item["decision"]="MIGRATE_TEST_TOOL_COMPAT"
                  compat.append(item)
              else:
                  item["decision"]="DELETE_PROVEN_ZERO_CONSUMER"
                  safe.append(item)

          safe.sort(key=lambda r:(-r["span"],r["name"]))
          compat.sort(key=lambda r:(-r["span"],r["name"]))
          runtime.sort(key=lambda r:(-r["span"],r["name"]))

          report={
              "schema":"WHD_ISSUE532_C0_RESIDUAL_DEF_AUDIT_V1",
              "issue":532,
              "bridge_loc":len(source.splitlines()),
              "candidate_count":len(candidates),
              "unreadable_current_python":unreadable,
              "generic_dynamic":generic_dynamic,
              "safe_zero_consumer":safe,
              "test_tool_compat_only":compat,
              "runtime_consumers":runtime,
          }
          Path("/tmp/issue532-c0-residual-def-audit.json").write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+"\n",
              encoding="utf-8",
          )

          print("C0_RESIDUAL_DEF_CANDIDATES="+str(len(candidates)))
          print("C0_UNREADABLE_CURRENT_PYTHON="+str(len(unreadable)))
          print("C0_ZERO_CONSUMER_COUNT="+str(len(safe)))
          print("C0_ZERO_CONSUMER_SPAN="+str(sum(r["span"] for r in safe)))
          for row in safe:
              print("C0_ZERO_CONSUMER="+json.dumps({
                  "name":row["name"],"start":row["start"],"end":row["end"],"span":row["span"]
              },ensure_ascii=False,sort_keys=True))
          print("C0_COMPAT_ONLY_COUNT="+str(len(compat)))
          print("C0_COMPAT_ONLY_SPAN="+str(sum(r["span"] for r in compat)))
          for row in compat:
              print("C0_COMPAT_ONLY="+json.dumps({
                  "name":row["name"],"span":row["span"],
                  "refs":row["compat_refs"][:12],
              },ensure_ascii=False,sort_keys=True))
          print("C0_RUNTIME_CONSUMER_COUNT="+str(len(runtime)))
          print("C0_RUNTIME_CONSUMER_SPAN="+str(sum(r["span"] for r in runtime)))
          for row in runtime:
              print("C0_RUNTIME_CONSUMER="+json.dumps({
                  "name":row["name"],"span":row["span"],
                  "refs":row["production_refs"][:12],
              },ensure_ascii=False,sort_keys=True))
          print("ISSUE532_C0_RESIDUAL_DEF_AUDIT=GREEN")
          PY

      - name: 上傳 residual def audit
        uses: actions/upload-artifact@v4
        with:
          name: issue532-c0-residual-def-audit
          path: |
            /tmp/issue532-c0-residual-def-audit.log
            /tmp/issue532-c0-residual-def-audit.json
          if-no-files-found: error
          retention-days: 14
