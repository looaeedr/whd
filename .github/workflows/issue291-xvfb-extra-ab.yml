name: Issue291 owning finalization guard

on:
  push:
    branches:
      - qa/issue291-xvfb-extra-ab-20260916

permissions:
  contents: read
  issues: read

jobs:
  owning-finalization-guard:
    name: Exact #291 owning checkpoint and guard proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical guard implementation
        uses: actions/checkout@v4
        with:
          ref: 8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9
          path: guard

      - name: Verify live owner before guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_head='cefb1a11c837a73508a6a2b09eac77ba38c798f6'
          live_head="$(git ls-remote https://github.com/looaeedr/whd.git 'refs/heads/fix/issue291-topology-contracts-20260916' | awk '{print $1}')"
          echo "OWNER_BRANCH_HEAD=$live_head"
          test "$live_head" = "$expected_head"
          state="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/looaeedr/whd/issues/291 \
            | python -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
          echo "ISSUE_STATE=$state"
          test "$state" = 'open'

      - name: Build terminal owning checkpoint
        shell: bash
        run: |
          cat > continuity.json <<'JSON'
          {
            "version": 1,
            "issue": "#291",
            "branch": "fix/issue291-topology-contracts-20260916",
            "head_sha": "cefb1a11c837a73508a6a2b09eac77ba38c798f6",
            "state": "TERMINAL_SUCCESS",
            "next_action": null,
            "run_id": 35114155552,
            "job_id": 104855166293,
            "log_cursor": null,
            "evidence": [
              "RUN 35109617631 candidate full Xvfb reproduced 33 FAIL / 2231 PASS twice",
              "RUN 35114155552 parent full Xvfb 44 FAIL / 2220 PASS; candidate-only failures = 0",
              "RUN 35109617631 focused topology contracts SUCCESS",
              "RUN 35109617631 T3 structural contract SUCCESS",
              "RUN 35109617631 Headless exact inherited residuals SUCCESS",
              "RUN 35109617631 protected drift and candidate reconciliation SUCCESS",
              "issue comment 5700158135 records terminal A/B evidence"
            ]
          }
          JSON
          cat continuity.json

      - name: Invoke canonical owning finalization guard
        shell: bash
        run: |
          set -euo pipefail
          python guard/tools/continuity_controller.py authorize-finalization \
            continuity.json \
            --issue '#291' \
            --branch 'fix/issue291-topology-contracts-20260916' \
            --head-sha 'cefb1a11c837a73508a6a2b09eac77ba38c798f6' \
            --proof-out finalization-proof.json
          test -s finalization-proof.json
          cat finalization-proof.json

      - name: Verify current guard invocation proof at closure boundary
        shell: bash
        run: |
          set -euo pipefail
          python guard/tools/continuity_controller.py verify-finalization-proof \
            continuity.json \
            finalization-proof.json \
            --issue '#291' \
            --branch 'fix/issue291-topology-contracts-20260916' \
            --head-sha 'cefb1a11c837a73508a6a2b09eac77ba38c798f6'
          echo 'ISSUE291_CLOSURE_GUARD=PASS'
