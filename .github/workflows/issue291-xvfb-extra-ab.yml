# registered-workflow-trigger
name: Issue291 Xvfb inherited residual fingerprint

on:
  push:
    branches:
      - qa/issue291-xvfb-extra-ab-20260916

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  parent-full-xvfb:
    name: Parent full Xvfb exact candidate-33 fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d46de1f2babb4bef269550880d40949cb38a68a8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk Xvfb and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run parent full Xvfb and require exact candidate residual fingerprint
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          xvfb-run -a python -m pytest -q > parent-full.log 2>&1
          rc=$?
          set -e
          echo "PYTEST_RC=$rc"
          tail -n 120 parent-full.log || true
          echo '--- FAILED lines ---'
          grep '^FAILED ' parent-full.log || true
          python - "$rc" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          expected_count = 33
          expected_sha256 = 'bf7b64bf083e72f1af6541ce013f3966d26eed59202a8a366802e40f11024405'
          rc = int(sys.argv[1])
          text = Path('parent-full.log').read_text(encoding='utf-8', errors='replace')
          nodes = list(dict.fromkeys(re.findall(r'^FAILED ([^\s]+)', text, flags=re.MULTILINE)))
          payload = '\n'.join(sorted(nodes)) + '\n'
          digest = hashlib.sha256(payload.encode()).hexdigest()
          print(f'Parent full Xvfb diagnostic: rc={rc} failed={len(nodes)} sha256={digest}')
          print('Parent actual nodeids:')
          for node in nodes:
              print(f'  {node}')
          ok = rc != 0 and len(nodes) == expected_count and digest == expected_sha256
          if not ok:
              print('Parent full Xvfb inherited fingerprint: FAIL')
              raise SystemExit(1)
          print('Parent full Xvfb inherited fingerprint: PASS — exact candidate 33-set exists on parent')
          PY

  reconciliation:
    name: QA reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify QA branch differs from candidate only by workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE=cefb1a11c837a73508a6a2b09eac77ba38c798f6
          git diff --name-only "$BASE"...HEAD
          git diff --quiet "$BASE"...HEAD -- ':!.github/workflows/issue291-xvfb-extra-ab.yml'
          echo 'QA reconciliation: PASS'
