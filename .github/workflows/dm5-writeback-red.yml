name: DM5 Writeback Contract RED
on:
  push:
    branches: [work/dm5-divider-deep-module-integration]
    paths:
      - tests/test_dm5_deep_module_writeback_contract.py
      - .agents/skills/engineering/掃描深模組/SKILL.md
      - .agents/skills/engineering/拆解任務工單/SKILL.md
      - .agents/skills/engineering/派工/SKILL.md
      - CONTEXT.md
      - 個人AI檔案庫/**
      - .github/workflows/dm5-writeback-red.yml
  workflow_dispatch:
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run DM5 writeback RED
        run: python -m pytest -q tests/test_dm5_deep_module_writeback_contract.py
