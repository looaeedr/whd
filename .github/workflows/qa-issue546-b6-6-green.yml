name: 工單546 B6-6 GREEN 驗收
run-name: "工單 #546 B6-6｜Final Seven Facade GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue546-b6-6-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B6-6 Facade final batch 驗收
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Headless facade / ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue546_b6_6_facade_batch.py \
            tests/test_issue524_a3_facade_ratchet.py \
            tests/test_phase6_bridge_domain_ownership.py \
            tests/test_issue371_t7_lifecycle_facade_owner.py \
            tests/test_issue366_t2_settings_transaction_owner.py \
            | tee /tmp/issue546-b6-6-headless.log

      - name: Xvfb affected runtime parity
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_receiving_edge_controls_gui.py \
            tests/test_phase6_receiving_multipart_integration.py \
            tests/test_phase6_head_tail_close_perf.py \
            tests/test_phase6_outside_advanced_perf.py \
            tests/test_phase6_part_switch_external_callback.py \
            tests/test_phase6_part_switch_performance.py \
            | tee /tmp/issue546-b6-6-xvfb.log

      - name: Architecture / facade count gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue546-b6-6-architecture.log
          import ast
          from pathlib import Path

          source = Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          call = next(
              n for n in ast.walk(tree)
              if isinstance(n, ast.Call)
              and isinstance(n.func, ast.Name)
              and n.func.id == "install_fold_designer_bridge_facade"
          )
          mapping = next(arg for arg in call.args if isinstance(arg, ast.Dict))
          bindings = {
              k.value: ast.unparse(v)
              for k, v in zip(mapping.keys, mapping.values)
              if isinstance(k, ast.Constant) and isinstance(k.value, str)
          }
          removed = {
              "_phase6_render_endcap_edge_controls",
              "_phase6_commit_base_plate_edge_shrink",
              "apply_settings_delta",
              "switch_active_part",
              "publish_if_changed",
              "_phase6_flush_update_intents",
              "refresh_3d_preview",
          }
          retained = {
              "submit_update_intent": "_phase6_submit_update_intent",
              "set_3d_preview_enabled": "_phase6_set_3d_preview_enabled",
          }
          assert removed.isdisjoint(bindings), sorted(removed & set(bindings))
          for key, value in retained.items():
              assert bindings.get(key) == value, (key, bindings.get(key))
          assert len(bindings) == 45, len(bindings)

          definitions = {
              n.name for n in tree.body
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          for name in (
              "_phase6_render_endcap_edge_controls",
              "_phase6_commit_base_plate_edge_shrink",
              "_phase6_apply_settings_delta",
              "_phase6_switch_active_part",
              "_phase6_publish_if_changed",
              "_phase6_flush_update_intents",
              "_phase6_refresh_3d_preview",
          ):
              assert name in definitions, name

          print("B6_6_ACCOUNTED=9")
          print("B6_6_UNCLASSIFIED=0")
          print("B6_6_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_6_REMOVED=7")
          print("B6_6_PUBLIC_REQUIRED=2")
          print("FACADE_COUNT=45")
          print("ISSUE546_B6_6_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue546-b6-6-green
          path: |
            /tmp/issue546-b6-6-headless.log
            /tmp/issue546-b6-6-xvfb.log
            /tmp/issue546-b6-6-architecture.log
          if-no-files-found: warn
          retention-days: 14
