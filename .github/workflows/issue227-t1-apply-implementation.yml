name: Issue227 T1 Apply Classification Implementation

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue227-t1-apply-implementation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal T1 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/knowledge_governance.py')
          text = path.read_text(encoding='utf-8')
          if 'CLASSIFICATION_SCHEMA = "WHD_KNOWLEDGE_CLASSIFICATION_V1"' in text:
              raise SystemExit('classification implementation already present')

          marker = 'INVENTORY_SCHEMA = "WHD_KNOWLEDGE_INVENTORY_V1"\nVALID_ROLES ='
          replacement = 'INVENTORY_SCHEMA = "WHD_KNOWLEDGE_INVENTORY_V1"\nCLASSIFICATION_SCHEMA = "WHD_KNOWLEDGE_CLASSIFICATION_V1"\nVALID_ROLES ='
          if marker not in text:
              raise SystemExit('schema insertion marker missing')
          text = text.replace(marker, replacement, 1)

          function_marker = '\ndef _git_changed_files(root: Path, base: str, head: str) -> tuple[str, ...]:\n'
          if function_marker not in text:
              raise SystemExit('classification function insertion marker missing')
          functions = r'''

def _safe_target_role(path: str) -> tuple[str, str | None]:
    rel = _norm(path)
    name = Path(rel).name
    if rel.startswith("docs/superpowers/plans/"):
        return "HISTORICAL", None
    if rel.startswith("docs/superpowers/verification/"):
        return "HISTORICAL", None
    if rel.startswith("docs/superpowers/checkpoints/"):
        return "HISTORICAL", None
    if rel.startswith("handoff/"):
        return "HISTORICAL", None
    if rel.startswith(".agents/skills/deprecated/"):
        return "HISTORICAL", None
    if rel.startswith(".agents/skills/") and name == "README.md":
        return "REFERENCE", None
    if rel.startswith(".agents/skills/") and name == "SKILL.md":
        return "CURRENT", "MISSING_STABLE_CONTRACT"
    if name == "README.md":
        return "REFERENCE", None
    if rel.startswith("個人AI檔案庫/踩坑庫/"):
        return "REFERENCE", None
    if rel == "個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md":
        return "REFERENCE", None
    if name.startswith("CURRENT_"):
        return "HISTORICAL", None
    return "UNRESOLVED", "ROLE_REQUIRES_AUTHORITY_REVIEW"


def build_classification_matrix(
    root: Path,
    inventory: Mapping[str, object],
) -> dict[str, object]:
    if inventory.get("schema") != INVENTORY_SCHEMA:
        raise GovernanceError(f"inventory schema must be {INVENTORY_SCHEMA}")
    raw_rows = inventory.get("rows")
    if not isinstance(raw_rows, list):
        raise GovernanceError("inventory rows must be a list")

    authority_rows = _authority_rows(root.resolve())
    authority_by_path: dict[str, dict[str, str]] = {}
    authority_currents: dict[str, set[str]] = defaultdict(set)
    for authority in authority_rows:
        rel = _norm(authority["path"])
        authority_by_path[rel] = authority
        if authority.get("role") == "CURRENT":
            authority_currents[authority["contract"]].add(rel)

    classified_rows: list[dict[str, object]] = []
    by_contract: dict[str, list[dict[str, object]]] = defaultdict(list)
    for raw in raw_rows:
        if not isinstance(raw, dict):
            continue
        row = dict(raw)
        rel = _norm(str(row.get("path") or ""))
        observed_role = str(row.get("role") or "UNKNOWN")
        contract = row.get("contract")
        contract = contract if isinstance(contract, str) and contract else None
        authority = authority_by_path.get(rel)

        blocker: str | None = None
        if authority is not None:
            target_role = authority.get("role", observed_role)
            contract = authority.get("contract") or contract
            if target_role == "MIRROR":
                row["replacement"] = authority.get("canonical") or row.get("replacement")
        elif observed_role in VALID_ROLES:
            target_role = observed_role
        else:
            target_role, blocker = _safe_target_role(rel)

        if target_role == "CURRENT" and not contract:
            blocker = blocker or "MISSING_STABLE_CONTRACT"

        classified = {
            **row,
            "path": rel,
            "observed_role": observed_role,
            "target_role": target_role,
            "contract": contract,
            "blocker": blocker,
            "proposed_current_owner": None,
        }
        classified_rows.append(classified)
        if contract:
            by_contract[contract].append(classified)

    all_contracts = set(by_contract) | set(authority_currents)
    contract_rows: list[dict[str, object]] = []
    proposed_by_contract: dict[str, str | None] = {}
    conflicts: list[dict[str, object]] = []

    for contract in sorted(all_contracts):
        rows = by_contract.get(contract, [])
        candidates = {
            str(row["path"])
            for row in rows
            if row.get("target_role") == "CURRENT"
        }
        candidates.update(authority_currents.get(contract, set()))
        canonical_hints = {
            _norm(str(row.get("canonical_owner")))
            for row in rows
            if isinstance(row.get("canonical_owner"), str) and row.get("canonical_owner")
        }
        mapped = sorted(authority_currents.get(contract, set()))
        if len(mapped) == 1:
            proposed = mapped[0]
        elif len(canonical_hints) == 1:
            proposed = next(iter(canonical_hints))
        elif len(candidates) == 1:
            proposed = next(iter(candidates))
        else:
            proposed = None
        proposed_by_contract[contract] = proposed
        contract_rows.append(
            {
                "contract": contract,
                "current_candidates": sorted(candidates),
                "proposed_current_owner": proposed,
            }
        )
        if len(candidates) > 1:
            conflicts.append(
                {
                    "code": "DUAL_CURRENT",
                    "contract": contract,
                    "paths": sorted(candidates),
                    "proposed_current_owner": proposed,
                }
            )

    for row in classified_rows:
        contract = row.get("contract")
        if isinstance(contract, str):
            row["proposed_current_owner"] = proposed_by_contract.get(contract)
        target_role = row.get("target_role")
        rel = str(row.get("path") or "")
        routing = list(row.get("machine_routing") or [])
        incoming = list(row.get("incoming_references") or [])
        if target_role == "CURRENT" and not contract:
            conflicts.append(
                {
                    "code": "ORPHAN_CURRENT",
                    "contract": None,
                    "paths": [rel],
                    "proposed_current_owner": None,
                }
            )
        if target_role == "UNRESOLVED" and (routing or incoming):
            conflicts.append(
                {
                    "code": "UNKNOWN_ACTIVE",
                    "contract": contract,
                    "paths": [rel],
                    "proposed_current_owner": row.get("proposed_current_owner"),
                }
            )
        if target_role == "HISTORICAL" and routing:
            conflicts.append(
                {
                    "code": "STALE_ROUTE",
                    "contract": contract,
                    "paths": [rel],
                    "routes": sorted(str(item) for item in routing),
                    "proposed_current_owner": row.get("proposed_current_owner"),
                }
            )
        if target_role == "HISTORICAL" and "CURRENT" in Path(rel).name.upper():
            conflicts.append(
                {
                    "code": "MISLEADING_CURRENT_NAME",
                    "contract": contract,
                    "paths": [rel],
                    "proposed_current_owner": row.get("proposed_current_owner"),
                }
            )

    return {
        "schema": CLASSIFICATION_SCHEMA,
        "source_head": inventory.get("source_head"),
        "rows": sorted(classified_rows, key=lambda row: str(row.get("path") or "")),
        "contracts": contract_rows,
        "conflicts": sorted(
            conflicts,
            key=lambda item: (str(item.get("code") or ""), str(item.get("contract") or ""), tuple(item.get("paths") or [])),
        ),
    }
'''
          text = text.replace(function_marker, functions + function_marker, 1)

          parser_marker = '    bootstrap_parser.add_argument("--head", default="HEAD")\n    return parser\n'
          parser_replacement = '''    bootstrap_parser.add_argument("--head", default="HEAD")\n\n    classify_parser = subparsers.add_parser("classify", help="classify governed-document authority")\n    classify_parser.add_argument("--root", default=".")\n    classify_parser.add_argument("--inventory", required=True)\n    classify_parser.add_argument("--output", required=True)\n    return parser\n'''
          if parser_marker not in text:
              raise SystemExit('classify parser insertion marker missing')
          text = text.replace(parser_marker, parser_replacement, 1)

          main_marker = '        print(f"inventory rows={len(payload[\'rows\'])} source_head={args.source_head}")\n        return 0\n\n    inventory_path = Path(args.inventory)\n'
          main_replacement = '''        print(f"inventory rows={len(payload['rows'])} source_head={args.source_head}")\n        return 0\n\n    if args.command == "classify":\n        inventory_path = Path(args.inventory)\n        if not inventory_path.is_absolute():\n            inventory_path = root / inventory_path\n        inventory = _load_inventory(inventory_path)\n        payload = build_classification_matrix(root, inventory)\n        output = Path(args.output)\n        if not output.is_absolute():\n            output = root / output\n        _write_json(output, payload)\n        print(f"classification rows={len(payload['rows'])} conflicts={len(payload['conflicts'])}")\n        return 0\n\n    inventory_path = Path(args.inventory)\n'''
          if main_marker not in text:
              raise SystemExit('classify main insertion marker missing')
          text = text.replace(main_marker, main_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile tools/knowledge_governance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/knowledge_governance.py
          git rm .github/workflows/issue227-t1-apply-implementation.yml
          git commit -m 'feat(issue227): add authority classification matrix'
          git push origin HEAD:work/issue225-knowledge-documentation-consolidation-20260914
