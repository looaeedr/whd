name: Issue227 T1 Apply Classification Implementation

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue227-t1-apply-implementation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal T1 implementation
        run: python tools/issue227_apply_classification_patch.py
      - name: Compile, commit, and self-clean
        shell: bash
        run: |
          python -m py_compile tools/knowledge_governance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/knowledge_governance.py
          git rm tools/issue227_apply_classification_patch.py
          git rm .github/workflows/issue227-t1-apply-implementation.yml
          git commit -m 'feat(issue227): add authority classification matrix'
          git push origin HEAD:work/issue225-knowledge-documentation-consolidation-20260914
