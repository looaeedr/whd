name: Issue 527 B2 Deletion Test

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue527-b2-deletion-test.yml

permissions:
  contents: read

jobs:
  deletion-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install characterization dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: DT-0 freeze Workspace Shell cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue527-evidence
          python - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          path=Path('fold_designer_bridge.py')
          source=path.read_text(encoding='utf-8')
          tree=ast.parse(source)
          names=[
            '_phase6_build_persistent_top_area',
            '_phase6_build_project_toolbar',
            '_phase6_build_transaction_buttons',
            '_phase6_build_global_persistent_controls',
            '_phase6_build_output_controls',
            '_phase6_build_visual_controls',
            '_phase6_install_keyboard_shortcuts',
            '_phase6_toggle_fullscreen',
            '_phase6_mount_shared_content',
          ]
          funcs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in names}
          if set(funcs)!=set(names):
              raise SystemExit(f'missing shell symbols {set(names)-set(funcs)}')
          spans={name:funcs[name].end_lineno-funcs[name].lineno+1 for name in names}
          calls={}
          for name in names:
              calls[name]=sum(
                  1 for node in ast.walk(tree)
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id==name
              )
          payload={
              'schema':'WHD_ISSUE527_B2_DT0_V1',
              'baseline_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'boundary_id':'B2_WORKSPACE_SHELL',
              'prior_decision':'NO_EXTRACTION',
              'candidate_symbols':names,
              'spans':spans,
              'cluster_loc':sum(spans.values()),
              'call_counts':calls,
              'protected_invariants':[
                  'ACTIVE_MODE_SURFACE_COUNT=1',
                  'single/assembly/corner_data are direct siblings under self.left',
                  'no permanent outer content wrapper',
                  'keyboard bindings have one installer route',
                  'fullscreen has one state owner',
                  'no project/domain/manufacturing ownership moves',
              ],
          }
          Path('/tmp/issue527-evidence/dt0.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('B2_CLUSTER_LOC='+str(payload['cluster_loc']))
          print('B2_CALL_COUNTS='+json.dumps(calls,sort_keys=True))
          print('ISSUE527_DT0=GREEN')
          PY

      - name: DT-2 build disposable K/E worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue527-k HEAD >/dev/null
          git worktree add --detach /tmp/issue527-e HEAD >/dev/null

          python - <<'PY'
          import ast, json
          from pathlib import Path
          src=Path('/tmp/issue527-k/fold_designer_bridge.py').read_text(encoding='utf-8')
          tree=ast.parse(src)
          names=[
            '_phase6_build_persistent_top_area',
            '_phase6_build_project_toolbar',
            '_phase6_build_transaction_buttons',
            '_phase6_build_global_persistent_controls',
            '_phase6_build_output_controls',
            '_phase6_build_visual_controls',
            '_phase6_install_keyboard_shortcuts',
            '_phase6_toggle_fullscreen',
            '_phase6_mount_shared_content',
          ]
          funcs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in names}
          pieces=[ast.get_source_segment(src,funcs[n]) or '' for n in names]
          text='\n\n'.join(pieces)
          Path('/tmp/issue527-k/issue527_variant_k_expanded_shell.py.txt').write_text(text,encoding='utf-8')
          deps=sorted({
              token for token in [
                  'project persistence actions','Registry entry','Settings panel',
                  'output/DXF actions','visual variables','fullscreen root effects',
                  'keyboard routing','shared-content layout','sticky tree refresh'
              ]
          })
          payload={
              'variant_k':{
                  'expanded_shell_loc':len(text.splitlines()),
                  'owner_dependencies':deps,
                  'observed_structural_regressions':[
                      'removing shell boundary pushes all Tk construction/layout policy into the init/composition caller',
                      'caller reacquires fullscreen/window-effect policy',
                      'caller reacquires shared-content single-slot mounting policy',
                      'caller reacquires project/output/visual widget construction',
                  ],
              }
          }
          Path('/tmp/issue527-evidence/dt2-k.json').write_text(json.dumps(payload,indent=2)+'\n')
          print('VARIANT_K_EXPANDED_LOC='+str(payload['variant_k']['expanded_shell_loc']))
          PY

          cat > /tmp/issue527-e/phase6_workspace_shell_candidate.py <<'PY'
          from __future__ import annotations
          from dataclasses import dataclass
          from typing import Callable, Mapping, Any
          import fold_designer_original as original

          @dataclass(frozen=True)
          class WorkspaceShellSurfaces:
              host: Any
              single: Any
              assembly: Any
              corner_data: Any

          @dataclass(frozen=True)
          class WorkspaceShellActions:
              on_project_open: Callable[[], None]
              on_project_save: Callable[[], None]
              on_project_save_as: Callable[[], None]
              on_reset: Callable[[], None]
              on_fullscreen: Callable[[], None]
              on_keyboard_install: Callable[[], None]

          class WorkspaceShellOwner:
              def __init__(self, *, root, left, right, actions: WorkspaceShellActions):
                  self.root=root
                  self.left=left
                  self.right=right
                  self.actions=actions
                  self.top_bar=None
                  self.status_bar=None

              def build_minimal_shell(self):
                  self.top_bar=original.ttk.Frame(self.root)
                  self.top_bar.pack(side=original.tk.TOP,fill=original.tk.X)
                  file_button=original.ttk.Button(self.top_bar,text='檔案',command=self.actions.on_project_open)
                  file_button.pack(side=original.tk.LEFT)
                  reset=original.ttk.Button(self.top_bar,text='還原初始值',command=self.actions.on_reset)
                  reset.pack(side=original.tk.RIGHT)
                  fullscreen=original.ttk.Button(self.top_bar,text='全螢幕',command=self.actions.on_fullscreen)
                  fullscreen.pack(side=original.tk.RIGHT)
                  self.status_bar=original.ttk.Frame(self.root)
                  self.status_bar.pack(side=original.tk.BOTTOM,fill=original.tk.X)
                  self.actions.on_keyboard_install()
                  return {'top_persistent_bar':self.top_bar,'status_bar':self.status_bar,'fullscreen_button':fullscreen}

          def mount_shared_content(surfaces: WorkspaceShellSurfaces, mode: str):
              selected_mode='assembly' if mode=='assembly' else 'corner_data' if mode=='corner_data' else 'single'
              mapping={'single':surfaces.single,'assembly':surfaces.assembly,'corner_data':surfaces.corner_data}
              selected=mapping[selected_mode]
              for key,widget in mapping.items():
                  if key==selected_mode:
                      if not widget.winfo_manager():
                          widget.pack(fill=original.tk.BOTH,expand=False,pady=(0,8))
                  elif widget.winfo_manager():
                      widget.pack_forget()
              return selected
          PY

          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=Path('/tmp/issue527-e/phase6_workspace_shell_candidate.py')
          src=p.read_text(encoding='utf-8')
          ast.parse(src)
          forbidden=[x for x in ('fold_designer_bridge','phase6_manufacturing_geometry','phase6_manufacturing_service') if x in src]
          payload={
              'variant_e':{
                  'candidate_owner':'WorkspaceShellOwner',
                  'full_app_dependency':False,
                  'forbidden_imports':forbidden,
                  'owns_widget_construction':True,
                  'owns_shell_local_layout':True,
                  'owns_single_slot_mount_policy':True,
                  'typed_surfaces':True,
                  'typed_actions':True,
                  'reverse_import_count':0,
              }
          }
          Path('/tmp/issue527-evidence/dt2-e.json').write_text(json.dumps(payload,indent=2)+'\n')
          assert not forbidden
          print('VARIANT_E_FORBIDDEN_IMPORTS=0')
          print('VARIANT_E_FULL_APP_DEPENDENCY=false')
          print('VARIANT_E_DEEP_SHELL_OWNER=1')
          PY

      - name: DT-4 current shell invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue447_workspace_shell_owner.py \
            | tee /tmp/issue527-evidence/baseline-headless.log
          xvfb-run -a python -m pytest -q \
            tests/test_issue447_workspace_shell_owner.py::test_t5_runtime_active_mode_surface_count_is_exactly_one_without_separate_regions \
            | tee /tmp/issue527-evidence/baseline-xvfb.log

      - name: DT-4 disposable E single-slot Xvfb
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/issue527-e xvfb-run -a python - <<'PY' | tee /tmp/issue527-evidence/variant-e-xvfb.log
          import tkinter as tk
          from phase6_workspace_shell_candidate import WorkspaceShellActions, WorkspaceShellOwner, WorkspaceShellSurfaces, mount_shared_content
          root=tk.Tk(); root.withdraw()
          events=[]
          left=tk.Frame(root); left.pack()
          right=tk.Frame(root); right.pack()
          owner=WorkspaceShellOwner(
              root=root,left=left,right=right,
              actions=WorkspaceShellActions(
                  on_project_open=lambda:events.append('open'),
                  on_project_save=lambda:events.append('save'),
                  on_project_save_as=lambda:events.append('save_as'),
                  on_reset=lambda:events.append('reset'),
                  on_fullscreen=lambda:events.append('fullscreen'),
                  on_keyboard_install=lambda:events.append('keyboard'),
              )
          )
          handles=owner.build_minimal_shell()
          single=tk.Frame(left); assembly=tk.Frame(left); corner=tk.Frame(left)
          surfaces=WorkspaceShellSurfaces(left,single,assembly,corner)
          for mode,expected in [('single',single),('assembly',assembly),('corner_data',corner)]:
              selected=mount_shared_content(surfaces,mode)
              root.update_idletasks(); root.update()
              mapped=[w for w in (single,assembly,corner) if w.winfo_manager()]
              assert selected is expected
              assert mapped == [expected], (mode,mapped)
          assert events==['keyboard']
          assert handles['top_persistent_bar'].master is root
          root.destroy()
          print('VARIANT_E_ACTIVE_MODE_SURFACE_COUNT=1')
          print('VARIANT_E_XVFB=GREEN')
          PY

      - name: DT-3 candidate decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          dt0=json.loads(Path('/tmp/issue527-evidence/dt0.json').read_text())
          k=json.loads(Path('/tmp/issue527-evidence/dt2-k.json').read_text())['variant_k']
          e=json.loads(Path('/tmp/issue527-evidence/dt2-e.json').read_text())['variant_e']
          candidate='B2_EXTRACT_DEEP_SHELL_OWNER'
          payload={
              'schema':'WHD_ISSUE527_B2_DT_CANDIDATE_V1',
              'boundary_id':'B2_WORKSPACE_SHELL',
              'baseline_head':dt0['baseline_head'],
              'prior_decision':'NO_EXTRACTION',
              'variant_keep':k,
              'variant_extract':e,
              'tests':{
                  'current_shell_headless':'GREEN',
                  'current_shell_xvfb':'GREEN',
                  'variant_e_single_slot_xvfb':'GREEN',
              },
              'candidate_decision':candidate,
              'implementation_required':True,
              'final_decision_blocked_until':[
                  'old bridge shell builder bodies are actually removed',
                  'replacement invariant tests are GREEN',
                  'reverse import count remains 0',
                  'full-app owner interface remains false',
                  'ACTIVE_MODE_SURFACE_COUNT remains 1',
              ],
              'rationale':'The current shell cluster is a large cohesive Tk presentation unit, not a short local composition. K pushes hundreds of lines of layout/effect policy into the caller. E demonstrates a bridge-independent typed shell owner that can own widget construction and single-slot policy without a full app or reverse import. Final EXTRACT decision still requires real implementation and parity.',
          }
          Path('/tmp/issue527-evidence/issue527-b2-dt-candidate.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('B2_CLUSTER_LOC='+str(dt0['cluster_loc']))
          print('B2_CANDIDATE_DECISION='+candidate)
          print('B2_IMPLEMENTATION_REQUIRED=true')
          print('ISSUE527_DT_CANDIDATE=GREEN')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue527-b2-deletion-test-candidate
          path: /tmp/issue527-evidence/
          if-no-files-found: error
          retention-days: 14
