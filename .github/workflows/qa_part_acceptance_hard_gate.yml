name: Part Acceptance Hard Gate QA

on:
  push:
    branches:
      - docs/part-acceptance-hard-gate

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate hard gate
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"

          python tools/phase6_skill_preflight.py \
            --task "固化 focused QA 不得取代成品板件驗收" \
            --changed-file .agents/skills/engineering/驗證板件與DXF/SKILL.md \
            --changed-file .agents/skills/engineering/phase6-release-packaging/SKILL.md \
            --changed-file .agents/skills/skill_registry.json \
            --changed-file AGENTS.md \
            --changed-file tests/test_phase6_skill_preflight_gate.py \
            --changed-file 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md \
            --evidence .scratch/part_acceptance_hard_gate_preflight.txt

          python -m json.tool .agents/skills/skill_registry.json >/dev/null
          pytest -q tests/test_phase6_skill_preflight_gate.py tests/test_phase6_release_packaging_policy.py

          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "config.ini before=$before"
          echo "config.ini after=$after"
          test "$before" = "$after"
