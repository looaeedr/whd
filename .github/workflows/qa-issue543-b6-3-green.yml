name: 工單543 B6-3 GREEN 驗收
run-name: "工單 #543 B6-3｜Facade 12-key GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue543-b6-3-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B6-3 Facade 收斂驗收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 跑 B6-3 與 Settings / workspace compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue543_b6_3_facade_batch.py             tests/test_phase6_designer_workspace.py             tests/test_phase6_settings_panel_ownership.py             tests/test_issue445_settings_presentation_owner.py             tests/test_issue498_settings_application_coordinator.py             tests/test_issue524_a3_facade_ratchet.py             | tee /tmp/issue543-b6-3-green.log
          grep -E '[0-9]+ passed' /tmp/issue543-b6-3-green.log | tail -1

      - name: 驗證 12-key final classification 與 facade count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue543-b6-3-architecture.log
          import ast
          from pathlib import Path

          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          call=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          )
          mapping=next(arg for arg in call.args if isinstance(arg,ast.Dict))
          bindings={
              k.value:ast.unparse(v)
              for k,v in zip(mapping.keys,mapping.values)
              if isinstance(k,ast.Constant) and isinstance(k.value,str)
          }

          removed={"show_global_settings","save_settings_context_as_defaults"}
          retained={
              "selected_part_key",
              "_phase6_part_profiles",
              "_phase6_part_features",
              "_phase6_part_face_features",
              "_phase6_workspace_dirty",
              "_phase6_switching_part",
              "_phase6_box_body_active_piece_key",
              "apply_external_assembly_type",
              "export_phase6_snapshot",
              "toggle_baseline_data",
          }
          assert removed.isdisjoint(bindings)
          assert retained <= set(bindings)
          assert len(bindings)==62, len(bindings)

          definitions={
              n.name for n in tree.body if isinstance(n,ast.FunctionDef)
          }
          assert "_phase6_show_global_settings" in definitions
          assert "_phase6_save_settings_context_as_defaults" in definitions

          for key in (
              "selected_part_key",
              "_phase6_part_profiles",
              "_phase6_part_features",
              "_phase6_part_face_features",
              "_phase6_workspace_dirty",
              "_phase6_switching_part",
              "_phase6_box_body_active_piece_key",
          ):
              assert bindings[key].startswith("property("), (key,bindings[key])

          print("B6_3_ACCOUNTED=12")
          print("B6_3_UNCLASSIFIED=0")
          print("B6_3_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_3_REMOVED=2")
          print("FACADE_COUNT=62")
          print("ISSUE543_B6_3_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue543-b6-3-green
          path: |
            /tmp/issue543-b6-3-green.log
            /tmp/issue543-b6-3-architecture.log
          if-no-files-found: error
          retention-days: 14
