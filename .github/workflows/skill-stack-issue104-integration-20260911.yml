name: Skill Stack Issue104 Integration 2026-09-11

on:
  push:
    branches:
      - integration/skill-stack-onto-issue104-20260911
    paths:
      - docs/superpowers/verification/2026-09-11-skill-stack-issue104-integration.md

permissions:
  contents: read

jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Snapshot config invariant
        run: sha256sum config.ini | tee /tmp/config-before.sha256
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "整合已驗收的中文 Skill identity／寫技能／派工／找技能 stack 到最新 cleanup/2d-3d-sync，保留 Issue #104 DXF verifier tolerance authority，驗證可安全合併" \
            --changed-file ".agents/skills/engineering/README.md" \
            --changed-file ".agents/skills/engineering/ask-matt/SKILL.md" \
            --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md" \
            --changed-file ".agents/skills/engineering/寫成規格書/SKILL.md" \
            --changed-file ".agents/skills/engineering/寫技能/SKILL.md" \
            --changed-file ".agents/skills/engineering/拆解任務工單/SKILL.md" \
            --changed-file ".agents/skills/engineering/拷問邊建立文件/SKILL.md" \
            --changed-file ".agents/skills/engineering/掃描深模組/SKILL.md" \
            --changed-file ".agents/skills/engineering/派工/SKILL.md" \
            --changed-file ".agents/skills/engineering/程式碼庫設計/DESIGN-IT-TWICE.md" \
            --changed-file ".agents/skills/engineering/程式碼庫設計/SKILL.md" \
            --changed-file ".agents/skills/engineering/領域建模/SKILL.md" \
            --changed-file ".agents/skills/engineering/驗證板件與DXF/SKILL.md" \
            --changed-file ".agents/skills/productivity/README.md" \
            --changed-file ".agents/skills/productivity/找技能/SKILL.md" \
            --changed-file ".agents/skills/productivity/深度質詢/SKILL.md" \
            --changed-file ".agents/skills/skill_registry.json" \
            --changed-file "release_required_artifacts.json" \
            --changed-file "tests/test_chinese_skill_identity_contract.py" \
            --changed-file "tests/test_dispatching_skill_timeout_contract.py" \
            --changed-file "tests/test_dxf_skill_scope_contract.py" \
            --changed-file "tests/test_find_skill_contract.py" \
            --changed-file "tests/test_writing_skill_contract.py" \
            --changed-file "tests/test_writing_skill_preflight_route.py" \
            --changed-file "個人AI檔案庫/第二層_專案與SOP/07_WHD技能發現與掃描深模組規則.md" \
            --changed-file "個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md" \
            --evidence "docs/superpowers/verification/2026-09-11-skill-stack-issue104-integration.md"
      - name: Authority reconciliation guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.agents/skills/engineering/驗證板件與DXF/SKILL.md').read_text(encoding='utf-8')
          required = [
              '修改DXF', '不是本專案 Skill', 'CROSS（十字截角）＋參數', 'Registry HIT',
              'DXF reopen 的獨立性與容差 authority', 'Production 製造 snap 與 verifier 數值等價 tolerance 是不同 authority',
              'gap 大於 `coordinate_tolerance`', 'tests/test_receiving_door_dxf_roundtrip.py'
          ]
          missing = [x for x in required if x not in p]
          assert not missing, f'missing authority markers: {missing}'
          assert Path('.agents/skills/engineering/截角資料入口收斂/SKILL.md').exists()
          PY
      - name: Skill and Issue104 regression matrix
        run: |
          python -m pytest -q \
            tests/test_chinese_skill_identity_contract.py \
            tests/test_dxf_skill_scope_contract.py \
            tests/test_find_skill_contract.py \
            tests/test_writing_skill_contract.py \
            tests/test_writing_skill_preflight_route.py \
            tests/test_dispatching_skill_timeout_contract.py \
            .agents/skills/engineering/掃描深模組/tests/test_skill_sources_zh_tw.py \
            .agents/skills/engineering/掃描深模組/tests/test_check_zh_tw_report.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_phase6_release_packaging_policy.py \
            tests/test_release_integrity_gate.py \
            tests/test_dxf_acceptance.py \
            tests/test_receiving_door_dxf_roundtrip.py
      - name: Verify config and tracked-tree invariants
        run: |
          sha256sum config.ini | tee /tmp/config-after.sha256
          diff -u /tmp/config-before.sha256 /tmp/config-after.sha256
          git diff --exit-code
