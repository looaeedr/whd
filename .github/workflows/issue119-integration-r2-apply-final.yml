name: Issue119 R2 Latest Production Apply Final

on:
  push:
    branches:
      - fix/issue119-integration-latest-20260912-r2
    paths:
      - .github/workflows/issue119-integration-r2-apply-final.yml
      - .github/scripts/issue119-integration-r2-apply-final.sh

permissions:
  contents: write

jobs:
  apply_final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run latest production replay and final acceptance
        shell: bash
        run: bash .github/scripts/issue119-integration-r2-apply-final.sh
