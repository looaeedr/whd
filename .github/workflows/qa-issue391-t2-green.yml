name: "QA #391 T2 GREEN pure Settings transitions"

on:
  push:
    branches:
      - "refactor/issue391-phase4-t2-settings-transitions-20260920"
    paths:
      - "phase6_settings_transitions.py"
      - "phase6_settings_transaction_controller.py"
      - "tests/test_issue391_settings_transitions.py"
      - "tools/issue391_t2_semantic_probe.py"
      - ".github/workflows/qa-issue391-t2-green.yml"

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=391"
          echo "PREDECESSOR=a1b20315d9c7efcac07ceaa994cb7b21b314292f"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor a1b20315d9c7efcac07ceaa994cb7b21b314292f HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest -r requirements.txt

      - name: Compile transition/controller
        run: |
          python -m py_compile             phase6_settings_transitions.py             phase6_settings_transaction_controller.py             tools/issue391_t2_semantic_probe.py

      - name: T2 pure-kernel contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue391_settings_transitions.py --tb=short
          echo "ISSUE391_T2_KERNEL_GREEN=1"

      - name: Existing Settings transition regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue366_t2a_settings_stage_controller.py             tests/test_issue366_t2b_structure_endcap_controller.py             tests/test_issue366_t2c_corner_external_controller.py             tests/test_issue366_t2d_family_width_controller.py             tests/test_phase6_t5_nested_settings_normalization.py             --tb=short
          echo "ISSUE391_T2_EXISTING_SETTINGS_GREEN=1"

      - name: Task-scoped semantic A-B
        shell: bash
        run: |
          set -euo pipefail
          base=a1b20315d9c7efcac07ceaa994cb7b21b314292f
          candidate_root="$PWD"
          rm -rf /tmp/issue391-base
          git worktree add --detach /tmp/issue391-base "$base"
          (
            cd /tmp/issue391-base
            PYTHONPATH=/tmp/issue391-base               python "$candidate_root/tools/issue391_t2_semantic_probe.py"               > /tmp/issue391-baseline.json
          )
          python tools/issue391_t2_semantic_probe.py > /tmp/issue391-candidate.json
          python -m json.tool /tmp/issue391-baseline.json > /tmp/issue391-baseline.pretty
          python -m json.tool /tmp/issue391-candidate.json > /tmp/issue391-candidate.pretty
          diff -u /tmp/issue391-baseline.pretty /tmp/issue391-candidate.pretty
          echo "ISSUE391_T2_SEMANTIC_AB_DELTA=0"

      - name: Pure dependency gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("phase6_settings_transitions.py")
          source=p.read_text(encoding="utf-8")
          tree=ast.parse(source, filename=str(p))
          imports=set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  imports.update(a.name for a in n.names)
              elif isinstance(n, ast.ImportFrom) and n.module:
                  imports.add(n.module)
          bad=sorted(x for x in imports if x=="tkinter" or x.startswith("tkinter.") or x=="fold_designer_bridge" or x.startswith("gui"))
          assert not bad, bad
          assert "self." not in source
          assert "callback" not in source.lower()
          print("SETTINGS_TRANSITION_SELF_REFS=0")
          print("SETTINGS_TRANSITION_TK_REFS=0")
          print("SETTINGS_TRANSITION_REVERSE_IMPORTS=0")
          PY

      - name: Scope and protected drift
        shell: bash
        run: |
          set -euo pipefail
          base=a1b20315d9c7efcac07ceaa994cb7b21b314292f
          git diff --name-only "$base"...HEAD | sort | tee /tmp/issue391-changed
          python - <<'PY'
          from pathlib import Path
          changed=set(Path("/tmp/issue391-changed").read_text().splitlines())
          allowed={
            "phase6_settings_transitions.py",
            "phase6_settings_transaction_controller.py",
            "tests/test_issue391_settings_transitions.py",
            "tools/issue391_t2_semantic_probe.py",
            ".github/workflows/qa-issue391-t2-red.yml",
            ".github/workflows/qa-issue391-t2-green.yml",
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected, unexpected
          print("ISSUE391_T2_SCOPE_GREEN=1")
          PY
          protected=(
            fold_designer_bridge.py
            phase6_settings_panel.py
            phase6_workspace_navigation_controller.py
            phase6_project_controller.py
            phase6_registry_diagnostics_controller.py
            phase6_corner_data_view_adapter.py
            phase6_manufacturing_cache.py
            phase6_manufacturing_contracts.py
            phase6_manufacturing_geometry.py
            phase6_manufacturing_service.py
            phase6_manufacturing_adapter.py
            config.ini
            ae_engine/cabinet_types/policy.py
            ae_engine/cabinet_types/receiving.py
            ae_engine/cabinet_types/vault.py
          )
          git diff --exit-code "$base"...HEAD -- "${protected[@]}"
          echo "ISSUE391_T2_PROTECTED_DRIFT=0"
