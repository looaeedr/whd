name: QA Issue 648 Governance GREEN

on:
  push:
    branches:
      - governance/issue648-takeover-timestamp-precision-20260925

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused governance regressions
        run: |
          python -m pytest -q --confcutdir=tests/process tests/process/test_issue540_stale_claim_takeover.py
          echo "ISSUE648_GOVERNANCE_GREEN=PASS"
