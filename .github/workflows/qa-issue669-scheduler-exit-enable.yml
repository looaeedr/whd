name: WHD #669 排程結束前啟用 focused 驗收
run-name: "WHD｜#669｜排程結束前啟用 RED/GREEN"

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: "#669｜排程結束前啟用 focused contract"
    runs-on: ubuntu-latest
    steps:
      - name: 取出 exact branch
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 驗證 Actions 顯示名稱
        run: python tools/actions_visible_naming_guard.py .github/workflows/qa-issue669-scheduler-exit-enable.yml

      - name: 安裝 focused pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: 執行 #669 排程結束前啟用 focused test
        run: >-
          python -m pytest -q
          tests/process/test_issue667_force_takeover_liveness.py
