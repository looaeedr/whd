name: WHD｜#532｜C0 Dead Wrapper GREEN
run-name: "WHD｜#532｜C0 Dead Wrapper GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue532-c0-normalization-green.yml
      - .github/workflows/qa-issue532-c0-residual-def-audit.yml
      - gui_modules/application/fold_designer_adapter.py
      - fold_designer_bridge.py
      - tests/test_issue368_t4_registry_diagnostics_owner.py
      - tests/test_issue447_workspace_shell_owner.py

permissions:
  contents: read

jobs:
  green:
    name: C0 零 caller wrapper 跨 owner 驗收
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf shapely

      - name: 編譯與 Bridge import smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fold_designer_bridge.py
          python - <<'PY'
          import fold_designer_bridge as bridge
          assert bridge.Phase6FoldDesignerApp
          print("C0_BRIDGE_IMPORT_SMOKE=GREEN")
          PY

      - name: Headless ownership／compatibility matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue524_a3_facade_ratchet.py \
            tests/test_issue546_b6_6_facade_batch.py \
            tests/test_phase6_bridge_domain_ownership.py \
            tests/test_phase6_diagnostics_ownership.py \
            tests/test_issue368_t4_registry_diagnostics_owner.py \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            tests/test_issue393_final_scene_contracts.py \
            tests/test_issue394_final_scene_projection.py \
            tests/test_issue395_final_scene_renderer.py \
            tests/test_issue370_t6_final_scene_view_owner.py \
            tests/test_issue479_final_scene_composition_owner.py \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_issue445_settings_presentation_owner.py \
            tests/test_issue447_workspace_shell_owner.py \
            tests/test_issue433_assembly_shared_host.py \
            tests/test_issue376_assembly_collapsible_data.py \
            tests/test_issue384_assembly_only_function_presentation.py \
            tests/test_issue385_assembly_parent_child_groups.py \
            tests/test_issue386_default_assembly_collapsed.py \
            | tee /tmp/issue532-c0-dead-wrapper-headless.log

      - name: Xvfb presentation smoke
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue376_assembly_collapsible_data.py \
            tests/test_issue378_assembly_mousewheel.py \
            tests/test_issue384_assembly_only_function_presentation.py \
            tests/test_issue385_assembly_parent_child_groups.py \
            tests/test_issue386_default_assembly_collapsed.py \
            tests/test_issue433_assembly_shared_host.py \
            tests/test_issue440_assembly_content_height.py \
            tests/test_issue447_workspace_shell_owner.py \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            | tee /tmp/issue532-c0-dead-wrapper-xvfb.log

      - name: Residual definition architecture gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue532-c0-dead-wrapper-architecture.log
          import ast
          from pathlib import Path

          path=Path("fold_designer_bridge.py")
          source=path.read_text(encoding="utf-8")
          tree=ast.parse(source)
          defs={
              n.name for n in tree.body
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))
          }
          removed={
              "_phase6_save_diagnostic_file",
              "_phase6_final_scene_operator_dimensions",
              "_phase6_update_unfolded_size_label",
              "_phase6_format_formed_size_text",
              "_phase6_final_scene_render_committed",
              "_phase6_selected_joint_diagnostic",
              "_phase6_refresh_box_body_piece_info_rows",
              "_phase6_assembly_unfolded_blank_text",
              "_phase6_final_scene_refresh_preview",
              "_phase6_final_scene_corner_text_sink",
              "_phase6_final_scene_visibility",
              "_phase6_bind_assembly_scroll",
              "_phase6_show_global_settings",
              "_phase6_final_scene_scene_query",
              "_phase6_is_base_plate_part_key",
              "_profile_value",
              "_phase6_build_global_persistent_controls",
              "_phase6_build_output_controls",
              "_phase6_build_transaction_buttons",
              "_phase6_build_visual_controls",
              "_phase6_final_scene_part_text_sink",
              "_phase6_toggle_box_structure_lock",
              "_phase6_is_door_part_key",
              "_phase6_registry_require_current_candidate",
              "_phase6_set_assembly_presentation_group_open",
              "_phase6_set_box_body_piece_details_open",
              "_phase6_settings_panel_toggle_advanced",
              "_phase6_toggle_assembly_part_details",
              "_phase6_toggle_assembly_presentation_group",
              "_phase6_toggle_box_body_piece_details",
          }
          assert removed.isdisjoint(defs), sorted(removed & defs)
          loc=len(source.splitlines())
          assert loc <= 7134, loc
          call=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          )
          mapping=next(a for a in call.args if isinstance(a,ast.Dict))
          facade_count=sum(
              isinstance(k,ast.Constant) and isinstance(k.value,str)
              for k in mapping.keys
          )
          assert facade_count==45, facade_count
          print(f"C0_BRIDGE_LOC={loc}")
          print("C0_ZERO_CONSUMER_WRAPPERS_REMOVED=30")
          print("C0_FACADE_COUNT=45")
          print("ISSUE532_C0_DEAD_WRAPPER_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue532-c0-dead-wrapper-green
          path: |
            /tmp/issue532-c0-dead-wrapper-headless.log
            /tmp/issue532-c0-dead-wrapper-xvfb.log
            /tmp/issue532-c0-dead-wrapper-architecture.log
          if-no-files-found: warn
          retention-days: 14
