name: Issue227 T1 Knowledge Preflight

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue227-t1-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover T1 Knowledge Preflight requirements
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T1 Authority Classification Conflict Matrix CURRENT REFERENCE MIRROR HISTORICAL dual-current orphan-current unknown-active stale-route misleading historical snapshot AI Library canonical authority" || true
