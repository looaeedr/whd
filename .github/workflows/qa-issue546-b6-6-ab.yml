name: 工單546 B6-6 Immutable Xvfb A-B
run-name: "工單 #546 B6-6｜Xvfb Immutable A-B｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue546-b6-6-ab.yml

permissions:
  contents: read

jobs:
  ab:
    name: Parent vs candidate identical Xvfb suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 建立 immutable baseline / candidate worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue546-baseline c06f5fb976b96e0db58452438ed8977b9d86e800
          git worktree add --detach /tmp/issue546-candidate fb2d5c5cdc10f3a32f0e466fa78377a9a606829c
          test "$(git -C /tmp/issue546-baseline rev-parse HEAD)" = "c06f5fb976b96e0db58452438ed8977b9d86e800"
          test "$(git -C /tmp/issue546-candidate rev-parse HEAD)" = "fb2d5c5cdc10f3a32f0e466fa78377a9a606829c"

      - name: Baseline Xvfb
        shell: bash
        run: |
          set +e
          cd /tmp/issue546-baseline
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_receiving_edge_controls_gui.py \
            tests/test_phase6_receiving_multipart_integration.py \
            tests/test_phase6_head_tail_close_perf.py \
            tests/test_phase6_outside_advanced_perf.py \
            tests/test_phase6_part_switch_external_callback.py \
            tests/test_phase6_part_switch_performance.py \
            > /tmp/issue546-baseline.log 2>&1
          echo $? > /tmp/issue546-baseline.rc
          cat /tmp/issue546-baseline.log
          exit 0

      - name: Candidate Xvfb
        shell: bash
        run: |
          set +e
          cd /tmp/issue546-candidate
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_receiving_edge_controls_gui.py \
            tests/test_phase6_receiving_multipart_integration.py \
            tests/test_phase6_head_tail_close_perf.py \
            tests/test_phase6_outside_advanced_perf.py \
            tests/test_phase6_part_switch_external_callback.py \
            tests/test_phase6_part_switch_performance.py \
            > /tmp/issue546-candidate.log 2>&1
          echo $? > /tmp/issue546-candidate.rc
          cat /tmp/issue546-candidate.log
          exit 0

      - name: Candidate-only failure classifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue546-ab-classifier.log
          import re
          from pathlib import Path

          def failures(path):
              out=set()
              for line in Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  m=re.match(r"FAILED\s+([^\s]+)", line)
                  if m:
                      out.add(m.group(1))
              return out

          baseline=failures("/tmp/issue546-baseline.log")
          candidate=failures("/tmp/issue546-candidate.log")
          candidate_only=sorted(candidate-baseline)
          baseline_only=sorted(baseline-candidate)
          print("BASELINE_FAILURES="+repr(sorted(baseline)))
          print("CANDIDATE_FAILURES="+repr(sorted(candidate)))
          print("CANDIDATE_ONLY_FAILURES="+repr(candidate_only))
          print("BASELINE_ONLY_FAILURES="+repr(baseline_only))
          print("BASELINE_RC="+Path("/tmp/issue546-baseline.rc").read_text().strip())
          print("CANDIDATE_RC="+Path("/tmp/issue546-candidate.rc").read_text().strip())
          assert not candidate_only, candidate_only
          print("ISSUE546_B6_6_AB=GREEN")
          PY

      - name: Candidate architecture gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/issue546-candidate
          python - <<'PY' | tee /tmp/issue546-architecture.log
          import ast
          from pathlib import Path
          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          call=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          )
          mapping=next(arg for arg in call.args if isinstance(arg,ast.Dict))
          bindings={
              k.value:ast.unparse(v)
              for k,v in zip(mapping.keys,mapping.values)
              if isinstance(k,ast.Constant) and isinstance(k.value,str)
          }
          removed={
              "_phase6_render_endcap_edge_controls",
              "_phase6_commit_base_plate_edge_shrink",
              "apply_settings_delta",
              "switch_active_part",
              "publish_if_changed",
              "_phase6_flush_update_intents",
              "refresh_3d_preview",
          }
          assert removed.isdisjoint(bindings)
          assert bindings["submit_update_intent"]=="_phase6_submit_update_intent"
          assert bindings["set_3d_preview_enabled"]=="_phase6_set_3d_preview_enabled"
          assert len(bindings)==45, len(bindings)
          print("B6_6_ACCOUNTED=9")
          print("B6_6_UNCLASSIFIED=0")
          print("B6_6_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_6_REMOVED=7")
          print("FACADE_COUNT=45")
          print("ISSUE546_B6_6_ARCHITECTURE=GREEN")
          PY

      - name: 上傳 A-B 證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue546-b6-6-immutable-ab
          path: |
            /tmp/issue546-baseline.log
            /tmp/issue546-candidate.log
            /tmp/issue546-ab-classifier.log
            /tmp/issue546-architecture.log
          if-no-files-found: warn
          retention-days: 14
