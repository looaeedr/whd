name: Issue 190 Combined Acceptance

on:
  push:
    branches:
      - fix/issue190-combined-acceptance-20260913
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and real-GUI runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ripgrep xvfb

      - name: Snapshot config and protected-baseline invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/issue190-config-before.sha256
          if [ -d '基準檔' ]; then
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/issue190-baseline-before.sha256
          else
            : > /tmp/issue190-baseline-before.sha256
          fi

      - name: Compile production modules
        shell: bash
        run: |
          python -m compileall -q \
            gui.py fold_designer_bridge.py fold_designer_original.py \
            phase6_*.py whd_theme.py ae_engine

      - name: T1-T4 permanent real-GUI acceptance
        run: |
          xvfb-run -a python -m pytest -q -s \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_issue187_3d_output_migration.py \
            tests/test_issue188_dark_theme_readability.py \
            tests/test_issue189_direct_3d_startup.py

      - name: Navigation layout and readability inheritance
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue119_corner_data_transition_ui.py \
            tests/test_issue123_ui_foundation.py \
            tests/test_issue124_structure_tree.py \
            tests/test_issue127_surfaces_scale_scroll.py \
            tests/test_issue162_unfold_viewport.py \
            tests/test_issue163_unfold_workspace_layout.py \
            tests/test_phase6_latest_layout_contract.py \
            tests/test_phase6_ui_state_regressions.py \
            tests/test_phase6_3d_view_regressions.py \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_phase6_settings_panel_ownership.py

      - name: DXF manufacturing export and multipart inheritance
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_dxf_acceptance.py \
            tests/test_multipart_dxf_acceptance.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_gui_manufacturing_adapter.py \
            tests/test_phase6_settings_center.py \
            tests/test_phase6_settings_center_bridge.py \
            tests/test_phase6_settings_service.py \
            tests/test_issue98_existing_2d_capability_migration.py \
            tests/test_issue100_remove_legacy_2d_entry.py \
            tests/test_multi_door_gui.py \
            tests/test_phase6_receiving_multipart_integration.py

      - name: Save-Reload project persistence inheritance
        run: xvfb-run -a python -m pytest -q tests/test_phase6_project_file.py

      - name: Full-suite combined acceptance under Xvfb
        run: xvfb-run -a python -m pytest -q

      - name: Caller-proof audit evidence
        shell: bash
        run: |
          set -uo pipefail
          pattern='attr1|entity1|selected_1|part1_bins|part2_bins|_part1_bins|_part2_bins|sum\(self\.part|set_three_segment_preset|set_three_segment_partition|_bboxes|_legacy_storage|part2|刨除|反向刨除|not supported yet'
          set +e
          rg -n "$pattern" . --glob '!tests/**' --glob '!docs/**' | tee /tmp/issue190-caller-audit.txt
          rg_status=${PIPESTATUS[0]}
          set -e
          if [ "$rg_status" -gt 1 ]; then
            exit "$rg_status"
          fi
          echo "CALLER_AUDIT_MATCH_COUNT=$(wc -l < /tmp/issue190-caller-audit.txt)"

      - name: Post-run exact invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/issue190-config-before.sha256
          if [ -d '基準檔' ]; then
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/issue190-baseline-after.sha256
          else
            : > /tmp/issue190-baseline-after.sha256
          fi
          diff -u /tmp/issue190-baseline-before.sha256 /tmp/issue190-baseline-after.sha256
          git diff --exit-code
          status_output="$(git status --porcelain)"
          if [ -n "$status_output" ]; then
            printf '%s\n' "$status_output"
            exit 1
          fi
