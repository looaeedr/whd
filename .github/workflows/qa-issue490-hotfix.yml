name: "QA #490 final cancel-path review remediation"

on:
  push:
    branches:
      - hotfix/issue490-marking-divider-holeeditor-20260922

permissions:
  contents: read

jobs:
  cancel-path-xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor c48f650fd68f6f5cb96bcb6d04a3627c8ce7a2a8 HEAD
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy
      - name: Exact HoleEditor cancel path + sink guards
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue294_t6_task6a_box_body_interaction_characterization.py \
            tests/test_dm4_divider_resolved_sinks.py
