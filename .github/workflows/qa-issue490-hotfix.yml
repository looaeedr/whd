name: "QA #490 regression hotfix"

on:
  push:
    branches:
      - hotfix/issue490-marking-divider-holeeditor-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=490"
          echo "BASE=c48f650fd68f6f5cb96bcb6d04a3627c8ce7a2a8"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor c48f650fd68f6f5cb96bcb6d04a3627c8ce7a2a8 HEAD

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy

      - name: Compile changed production
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            fold_designer_bridge.py \
            gui_modules/rendering/interaction.py \
            ae_engine/receiving_joint_marking.py \
            phase6_manufacturing_service.py

      - name: Divider resolved sink + MARKING + CROSS
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dm4_divider_resolved_sinks.py \
            tests/test_issue471_t6_receiving_marking_activation.py \
            tests/test_issue83_divider_cross_registry.py \
            tests/test_issue39_divider_relief.py::test_t3_family_solver_commits_verified_relief_and_preserves_mating_contact

  focused-xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy

      - name: HoleEditor primary lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue294_t6_task6a_box_body_interaction_characterization.py
