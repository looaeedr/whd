name: "QA #490 regression hotfix"

on:
  push:
    branches:
      - hotfix/issue490-marking-divider-holeeditor-20260922
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: c48f650fd68f6f5cb96bcb6d04a3627c8ce7a2a8

jobs:
  candidate-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy
      - name: Physical FinalScene DXF acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dm4_divider_resolved_sinks.py \
            tests/test_issue471_t6_receiving_marking_activation.py \
            tests/test_issue83_divider_cross_registry.py \
            tests/test_multipart_dxf_acceptance.py \
            tests/test_resolved_manufacturing_export.py

  candidate-common-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy
      - name: Relevant common regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dm1_divider_physical_contract.py \
            tests/test_dm3_divider_canonical_relief_contract.py \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue40_divider_6p4_shared_datum.py \
            tests/test_issue43_receiving_divider_t1.py \
            tests/test_issue71_divider_relief_components.py \
            tests/test_issue74_divider_side_front_penetration.py \
            tests/test_phase6_t05_box_body_dividers.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_issue370_t6_final_scene_view_owner.py \
            tests/test_issue393_final_scene_contracts.py \
            tests/test_issue394_final_scene_projection.py \
            tests/test_issue395_final_scene_renderer.py \
            tests/test_issue479_final_scene_composition_owner.py \
            tests/test_phase6_3d_single_source_renderer.py \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_issue293_t5_hole_editor_routing.py \
            tests/test_phase6_hole_editor_canvas_view.py

  baseline-common-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c48f650fd68f6f5cb96bcb6d04a3627c8ce7a2a8
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy
      - name: Same relevant common regressions on current X
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dm1_divider_physical_contract.py \
            tests/test_dm3_divider_canonical_relief_contract.py \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue40_divider_6p4_shared_datum.py \
            tests/test_issue43_receiving_divider_t1.py \
            tests/test_issue71_divider_relief_components.py \
            tests/test_issue74_divider_side_front_penetration.py \
            tests/test_phase6_t05_box_body_dividers.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_issue370_t6_final_scene_view_owner.py \
            tests/test_issue393_final_scene_contracts.py \
            tests/test_issue394_final_scene_projection.py \
            tests/test_issue395_final_scene_renderer.py \
            tests/test_issue479_final_scene_composition_owner.py \
            tests/test_phase6_3d_single_source_renderer.py \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_issue293_t5_hole_editor_routing.py \
            tests/test_phase6_hole_editor_canvas_view.py

  candidate-xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy
      - name: Candidate GUI regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue294_t6_task6a_box_body_interaction_characterization.py \
            tests/test_phase6_3d_single_source_renderer.py \
            tests/test_phase6_hole_editor_canvas_view.py

  baseline-xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c48f650fd68f6f5cb96bcb6d04a3627c8ce7a2a8
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib numpy
      - name: Baseline GUI regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue294_t6_task6a_box_body_interaction_characterization.py \
            tests/test_phase6_3d_single_source_renderer.py \
            tests/test_phase6_hole_editor_canvas_view.py
