name: Remote QA Skill Contract

on:
  push:
    branches:
      - docs/remote-qa-poll-until-terminal-20260912
    paths:
      - .agents/skills/engineering/monitoring-remote-qa/SKILL.md
      - tests/process/test_monitoring_remote_qa_turn_boundary_contract.py
      - .github/workflows/remote-qa-skill-contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Build preflight evidence
        shell: bash
        run: |
          cat > /tmp/remoteqa-skill-evidence.md <<'EOF'
          寫技能
          Python測試實務
          phase6-release-packaging
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
      - name: Canonical Skill preflight
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "修改 remote QA Skill，加入 non-terminal progress update 不得結束 assistant turn，並加入 pytest contract test" \
            --changed-file .agents/skills/engineering/monitoring-remote-qa/SKILL.md \
            --changed-file tests/process/test_monitoring_remote_qa_turn_boundary_contract.py \
            --changed-file .github/workflows/remote-qa-skill-contract.yml \
            --evidence /tmp/remoteqa-skill-evidence.md
      - name: Contract GREEN
        run: pytest -q tests/process/test_monitoring_remote_qa_turn_boundary_contract.py
