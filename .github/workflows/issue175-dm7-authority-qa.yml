name: Issue175 DM7 Authority QA
on:
  push:
    branches: [chore/issue175-dm7-navigation-authority-20260913]
    paths:
      - tests/test_issue175_dm7_navigation_authority_contract.py
      - tests/test_dm7_part_navigation.py
      - phase6_part_navigation.py
      - .agents/skills/engineering/截角資料入口收斂/SKILL.md
      - 個人AI檔案庫/第二層_專案與SOP/08_WHD截角資料與2D入口收斂規則.md
      - .github/workflows/issue175-dm7-authority-qa.yml
  pull_request:
    branches: [cleanup/2d-3d-sync]

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt

      - name: Capture invariants
        run: |
          sha256sum config.ini | tee /tmp/config.before
          git ls-files -s '基準檔/**' | sha256sum | tee /tmp/baseline.before

      - name: Phase6 Knowledge Preflight
        run: |
          cat > /tmp/issue175-evidence.txt <<'EOF'
          派工
          issue-closure-gate
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          寫技能
          Python測試實務
          phase6-release-packaging
          monitoring-remote-qa
          UI設計與去AI味
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task '派工執行 T2 #175：修正截角資料 Corner Data / DM7 navigation durable 規則，更新 Skill 與 AI Library，新增 regression，remote QA 驗證' \
            --changed-file 'tests/test_issue175_dm7_navigation_authority_contract.py' \
            --changed-file '.agents/skills/engineering/截角資料入口收斂/SKILL.md' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/08_WHD截角資料與2D入口收斂規則.md' \
            --changed-file '.github/workflows/issue175-dm7-authority-qa.yml' \
            --evidence /tmp/issue175-evidence.txt

      - name: DM7 focused contract
        run: |
          pytest -q -s \
            tests/test_issue175_dm7_navigation_authority_contract.py \
            tests/test_dm7_part_navigation.py

      - name: Canonical module RESTORE_CHILD_CONTEXT regression
        run: |
          python - <<'PY'
          from phase6_part_navigation import (
              NavigationIntent, NavigationMemory, NavigationRequest, resolve_navigation
          )
          parts=("box_body","box_body:back","box_body:right_side","head")
          p=resolve_navigation(parts, NavigationRequest(None, NavigationIntent.RESTORE_CHILD_CONTEXT), NavigationMemory("box_body:back"))
          assert p.resolved_key == "box_body:back"
          stale=resolve_navigation(parts, NavigationRequest(None, NavigationIntent.RESTORE_CHILD_CONTEXT), NavigationMemory("box_body:left_side"))
          assert stale.resolved_key is None
          assert stale.memory.remembered_box_body_child is None
          parent=resolve_navigation(parts, NavigationRequest("box_body"), NavigationMemory("box_body:back"))
          assert parent.resolved_key == "box_body"
          child=resolve_navigation(parts, NavigationRequest("box_body:left_side"), NavigationMemory("box_body:back"))
          assert child.resolved_key is None and child.reason == "STALE_PHYSICAL_CHILD"
          print("DM7_CANONICAL_MODULE=PASS")
          PY

      - name: Verify invariants
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git ls-files -s '基準檔/**' | sha256sum | tee /tmp/baseline.after
          diff -u /tmp/baseline.before /tmp/baseline.after
