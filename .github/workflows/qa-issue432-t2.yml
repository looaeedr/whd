name: "QA #432 T2 general-part shared host"

on:
  push:
    branches:
      - refactor/issue432-t2-general-part-shared-host-20260920
    paths:
      - 'tests/test_issue432_general_part_shared_host.py'
      - '.github/workflows/qa-issue432-t2.yml'
      - 'docs/superpowers/checkpoints/issue432-t2-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 7ac2c3a1f3743e74750ed148e132be4004e340e5

jobs:
  t2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Re-run T2 changed-file Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #432 T2 General part input/display content on the one shared Fold Designer host. Characterize normal-part host ownership, Assembly/Corner Data unmount behavior in part mode, input callback parity, display parity, and add/delete part parity. Preserve all input fields, data sources, validation, geometry, persistence, active-part identity, and callback semantics. GitHub Actions remote QA." \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue432_general_part_shared_host.py \
            --changed-file .github/workflows/qa-issue432-t2.yml \
            --changed-file docs/superpowers/checkpoints/issue432-t2-journal.md \
            --changed-file docs/superpowers/checkpoints/issue432-t2-checkpoint.json \
            --evidence docs/superpowers/checkpoints/issue432-t2-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require zero production runtime delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA:fold_designer_bridge.py")" = "$(git rev-parse HEAD:fold_designer_bridge.py)"
          python - <<'PY'
          import subprocess
          allowed = (
              "tests/test_issue432_general_part_shared_host.py",
              ".github/workflows/qa-issue432-t2",
              "docs/superpowers/checkpoints/issue432-t2-",
          )
          changed=subprocess.check_output(
              ["git","diff","--name-only","7ac2c3a1f3743e74750ed148e132be4004e340e5...HEAD"],
              text=True,
          ).splitlines()
          unexpected=[p for p in changed if not any(p == a or p.startswith(a) for a in allowed)]
          print("CHANGED", changed)
          assert not unexpected, f"unexpected T2 production/test drift: {unexpected}"
          print("PRODUCTION_RUNTIME_EDIT=0")
          PY

      - name: Run T2 characterization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue432-t2
          xvfb-run -a python -m pytest -q tests/test_issue432_general_part_shared_host.py \
            --tb=short \
            --json-report \
            --json-report-file=.scratch/issue432-t2/report.json \
            > .scratch/issue432-t2/pytest.log 2>&1
          cat .scratch/issue432-t2/pytest.log
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".scratch/issue432-t2/report.json").read_text(encoding="utf-8"))
          outcomes={row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          failed={n for n,o in outcomes.items() if o=="failed"}
          passed={n for n,o in outcomes.items() if o=="passed"}
          skipped={n for n,o in outcomes.items() if o=="skipped"}
          print("OUTCOMES", outcomes)
          assert not failed, f"T2 characterization failures: {failed}"
          assert len(passed)==4, f"expected 4 PASS, got {len(passed)}"
          assert not skipped, f"unexpected skips: {skipped}"
          print("PART_CONTENT_HOST_IS_SHARED_HOST=true")
          print("ASSEMBLY_WIDGET_TREE_MOUNTED_IN_PART_MODE=0")
          print("CORNER_DATA_WIDGET_TREE_MOUNTED_IN_PART_MODE=0")
          print("PART_INPUT_CALLBACK_PARITY=GREEN")
          print("PART_DISPLAY_PARITY=GREEN")
          print("ADD_DELETE_PART_PARITY=GREEN")
          print("T2_ALREADY_GREEN_AFTER_T1=1")
          print("T2_CHARACTERIZATION_RESULT=4_PASS_0_FAIL_0_SKIP")
          PY

      - name: Upload T2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue432-t2-characterization
          path: |
            .scratch/issue432-t2/report.json
            .scratch/issue432-t2/pytest.log
            docs/superpowers/checkpoints/issue432-t2-journal.md
            docs/superpowers/checkpoints/issue432-t2-checkpoint.json
