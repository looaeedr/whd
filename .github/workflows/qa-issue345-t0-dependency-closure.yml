name: "#345 T0 dependency closure"

on:
  push:
    branches:
      - refactor/issue345-manufacturing-preflight-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile inventory gate
        run: python -m py_compile tools/issue345_t0_dependency_inventory.py
      - name: Run AST dependency closure
        run: python tools/issue345_t0_dependency_inventory.py
