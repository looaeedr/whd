name: "QA #436 T6 cumulative A-B acceptance"

on:
  push:
    branches:
      - qa/issue436-t6-cumulative-acceptance-20260920
    paths:
      - '.github/workflows/qa-issue436-t6-cumulative.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_SHA: 50e14c7054916cb0b9597c61194725939c5de323
  CANDIDATE_SHA: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
  TARGET_BRANCH: cleanup/2d-3d-sync

jobs:
  full-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-headless
            ref: 50e14c7054916cb0b9597c61194725939c5de323
            mode: headless
          - label: candidate-headless
            ref: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
            mode: headless
          - label: baseline-xvfb
            ref: 50e14c7054916cb0b9597c61194725939c5de323
            mode: xvfb
          - label: candidate-xvfb
            ref: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
            mode: xvfb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install full-suite dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf
      - name: Run full suite and normalize evidence
        env:
          LABEL: ${{ matrix.label }}
          MODE: ${{ matrix.mode }}
          TESTED_REF: ${{ matrix.ref }}
        shell: bash
        run: |
          set -euo pipefail
          root=".scratch/issue436/full/$LABEL"
          mkdir -p "$root"

          config_before="$(sha256sum config.ini | awk '{print $1}')"
          dxf_before="$(find . -type f -iname '*.dxf' -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}')"
          tracked_before="$(git diff --binary | sha256sum | awk '{print $1}')"

          set +e
          if [ "$MODE" = "xvfb" ]; then
            xvfb-run -a -s "-screen 0 1280x900x24"               python -m pytest -q tests --tb=short               --json-report --json-report-file="$root/report.json"               >"$root/pytest.log" 2>&1
          else
            python -m pytest -q tests --tb=short               --json-report --json-report-file="$root/report.json"               >"$root/pytest.log" 2>&1
          fi
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/pytest.rc"

          config_after="$(sha256sum config.ini | awk '{print $1}')"
          dxf_after="$(find . -type f -iname '*.dxf' -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}')"
          tracked_after="$(git diff --binary | sha256sum | awk '{print $1}')"

          CONFIG_BEFORE="$config_before" CONFIG_AFTER="$config_after"           DXF_BEFORE="$dxf_before" DXF_AFTER="$dxf_after"           TRACKED_BEFORE="$tracked_before" TRACKED_AFTER="$tracked_after"           LABEL="$LABEL" MODE="$MODE" TESTED_REF="$TESTED_REF"           python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(".scratch/issue436/full") / os.environ["LABEL"]
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          tests = report.get("tests", [])
          failed = sorted(
              row.get("nodeid", "<unknown>")
              for row in tests
              if row.get("outcome") == "failed"
          )
          errors = sorted(
              row.get("nodeid", "<unknown>")
              for row in tests
              if row.get("outcome") == "error"
          )
          collector_errors = []
          for row in report.get("collectors", []):
              if row.get("outcome") == "failed":
                  collector_errors.append(str(row.get("nodeid") or row.get("longrepr") or "<collector>"))
          errors = sorted(set(errors + collector_errors))
          skipped = sorted(
              row.get("nodeid", "<unknown>")
              for row in tests
              if row.get("outcome") == "skipped"
          )
          summary = {
              "label": os.environ["LABEL"],
              "mode": os.environ["MODE"],
              "sha": os.environ["TESTED_REF"],
              "pytest_rc": int((root / "pytest.rc").read_text()),
              "collected": len(tests),
              "passed": sum(row.get("outcome") == "passed" for row in tests),
              "failed": failed,
              "errors": errors,
              "skipped": skipped,
              "config_unchanged": os.environ["CONFIG_BEFORE"] == os.environ["CONFIG_AFTER"],
              "dxf_unchanged": os.environ["DXF_BEFORE"] == os.environ["DXF_AFTER"],
              "tracked_diff_unchanged": os.environ["TRACKED_BEFORE"] == os.environ["TRACKED_AFTER"],
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "label": summary["label"],
              "collected": summary["collected"],
              "passed": summary["passed"],
              "failed_count": len(summary["failed"]),
              "error_count": len(summary["errors"]),
              "skipped_count": len(summary["skipped"]),
              "config_unchanged": summary["config_unchanged"],
              "dxf_unchanged": summary["dxf_unchanged"],
              "tracked_diff_unchanged": summary["tracked_diff_unchanged"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue436-full-${{ matrix.label }}
          path: .scratch/issue436/full/${{ matrix.label }}
          if-no-files-found: error

  classify-full:
    if: always()
    needs: [full-ab]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: issue436-full-*
          path: .scratch/issue436/all-full
      - name: Classify exact candidate-only failure/error deltas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".scratch/issue436/all-full")
          summaries = {}
          for p in root.glob("issue436-full-*/summary.json"):
              s = json.loads(p.read_text())
              summaries[s["label"]] = s
          required = {
              "baseline-headless", "candidate-headless",
              "baseline-xvfb", "candidate-xvfb",
          }
          assert set(summaries) == required, (set(summaries), required)

          def delta(mode):
              b = summaries[f"baseline-{mode}"]
              c = summaries[f"candidate-{mode}"]
              new_fail = sorted(set(c["failed"]) - set(b["failed"]))
              new_err = sorted(set(c["errors"]) - set(b["errors"]))
              return b, c, new_fail, new_err

          bh, ch, nh, neh = delta("headless")
          bx, cx, nx, nex = delta("xvfb")

          for s in summaries.values():
              assert s["config_unchanged"], (s["label"], "config.ini")
              assert s["dxf_unchanged"], (s["label"], "DXF")
              assert s["tracked_diff_unchanged"], (s["label"], "tracked diff")

          assert nh == [], nh
          assert neh == [], neh
          assert nx == [], nx
          assert nex == [], nex

          out = {
              "baseline_headless": bh,
              "candidate_headless": ch,
              "baseline_xvfb": bx,
              "candidate_xvfb": cx,
              "NEW_HEADLESS": nh,
              "NEW_HEADLESS_ERRORS": neh,
              "NEW_XVFB": nx,
              "NEW_XVFB_ERRORS": nex,
              "CONFIG_INVARIANT": 1,
              "DXF_REPO_INVARIANT": 1,
          }
          outp = Path(".scratch/issue436/classifier")
          outp.mkdir(parents=True, exist_ok=True)
          (outp / "full-ab-classification.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "
"
          )
          print("NEW_HEADLESS=[]")
          print("NEW_HEADLESS_ERRORS=[]")
          print("NEW_XVFB=[]")
          print("NEW_XVFB_ERRORS=[]")
          print("CONFIG_INVARIANT=1")
          print("DXF_REPO_INVARIANT=1")
          print("FULL_AB_CLASSIFIER=GREEN")
          PY
      - name: Upload full A-B classifier
        uses: actions/upload-artifact@v4
        with:
          name: issue436-full-ab-classifier
          path: .scratch/issue436/classifier
          if-no-files-found: error

  protected-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protected-lane dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf
      - name: Exact protected-domain A-B
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/issue436-protected
          mkdir -p "$root"
          TESTS=(
            tests/test_dxf_acceptance.py
            tests/test_multipart_dxf_acceptance.py
            tests/test_resolved_manufacturing_export.py
            tests/test_resolved_manufacturing_geometry.py
            tests/test_issue41_persistence_parity.py
            tests/test_issue119_corner_data_transition_ui.py
            tests/test_issue376_assembly_collapsible_data.py
          )
          run_one() {
            label="$1"
            ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            before="$(sha256sum config.ini | awk '{print $1}')"
            xvfb-run -a -s "-screen 0 1280x900x24"               python -m pytest -q "${TESTS[@]}" --tb=short               --json-report --json-report-file="$root/$label.json"               >"$root/$label.log" 2>&1
            after="$(sha256sum config.ini | awk '{print $1}')"
            test "$before" = "$after"
          }
          run_one baseline "$BASELINE_SHA"
          run_one candidate "$CANDIDATE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/issue436-protected")
          def load(label):
              data=json.loads((root/f"{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          b=load("baseline")
          c=load("candidate")
          assert b == c, {
              node:(b.get(node),c.get(node))
              for node in sorted(set(b)|set(c))
              if b.get(node)!=c.get(node)
          }
          assert not {n for n,o in c.items() if o=="failed"}
          print(f"PROTECTED_BASELINE_NODES={len(b)}")
          print(f"PROTECTED_CANDIDATE_NODES={len(c)}")
          print("GEOMETRY_DRIFT=0")
          print("DATAFLOW_DRIFT=0")
          print("PERSISTENCE_DRIFT=0")
          print("VISIBILITY_SEMANTIC_DRIFT=0")
          print("CORNER_DATA_BEHAVIOR_DRIFT=0")
          print("PROTECTED_AB_EXACT_OUTCOME_PARITY=1")
          PY
      - name: Upload protected A-B evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue436-protected-ab
          path: /tmp/issue436-protected
          if-no-files-found: error

  structural-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf
      - name: Run cumulative shared-host lifecycle matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue436/structural
          xvfb-run -a -s "-screen 0 1280x900x24"             python -m pytest -q             tests/test_issue430_single_host_red.py             tests/test_issue431_shared_content_host.py             tests/test_issue432_general_part_shared_host.py             tests/test_issue433_assembly_shared_host.py             tests/test_issue434_corner_data_shared_host.py             tests/test_issue435_switch_lifecycle_guards.py             tests/test_issue378_assembly_mousewheel.py             --tb=short --json-report             --json-report-file=.scratch/issue436/structural/report.json             | tee .scratch/issue436/structural/pytest.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".scratch/issue436/structural/report.json")
          data=json.loads(p.read_text())
          outcomes={row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          failed={n for n,o in outcomes.items() if o=="failed"}
          skipped={n for n,o in outcomes.items() if o=="skipped"}
          assert not failed, failed
          assert not skipped, skipped
          print(f"STRUCTURAL_PASS_COUNT={sum(o=='passed' for o in outcomes.values())}")
          print("SHARED_CONTENT_HOST_COUNT=1")
          print("ACTIVE_SHARED_CONTENT_MODE_COUNT=1")
          print("SEPARATE_ASSEMBLY_REGION=0")
          print("SEPARATE_CORNER_DATA_REGION=0")
          print("PERMANENT_HIDDEN_SECOND_HOST=0")
          print("DUPLICATE_WIDGET_TREE=0")
          print("DUPLICATE_EVENT_BINDING=0")
          print("CALLBACK_MULTIPLICATION=0")
          print("STALE_WIDGET_REFERENCE=0")
          print("MOUSEWHEEL_EXCEPTION=0")
          print("CALLBACK_SEMANTIC_DRIFT=0")
          PY
      - name: Upload structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue436-structural
          path: .scratch/issue436/structural
          if-no-files-found: error

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk scrot
          python -m pip install -r requirements.txt matplotlib numpy shapely ezdxf
      - name: Capture part / assembly / corner-data screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue436/visual
          xvfb-run -a -s "-screen 0 1280x900x24" python - <<'PY'
          import json
          import subprocess
          import tkinter as tk
          from pathlib import Path
          import fold_designer_bridge as bridge

          out=Path(".scratch/issue436/visual")
          snapshot={
              "model":"金庫型","w":500,"h":600,"d":200,
              "existing_parts":["box_body","head","tail"],
              "active_part":"box_body",
              "settings":{"t":2.0,"fw":24.0},
          }
          root=tk.Tk()
          root.geometry("1200x850+0+0")
          app=bridge.Phase6FoldDesignerApp(root,snapshot)

          def pump(n=4):
              for _ in range(n):
                  root.update_idletasks(); root.update()

          def box(widget):
              return [
                  int(widget.winfo_rootx()-root.winfo_rootx()),
                  int(widget.winfo_rooty()-root.winfo_rooty()),
                  int(widget.winfo_width()),
                  int(widget.winfo_height()),
              ]

          metrics={}
          def capture(name, action, active):
              action()
              pump()
              host=app.shared_content_host
              surfaces=[
                  app.fold_editor_host,
                  app.assembly_parts_panel,
                  getattr(app,"corner_data_panel",None),
              ]
              mapped=[w for w in surfaces if w is not None and w.winfo_manager()]
              assert len(mapped)==1, (name, len(mapped))
              assert mapped[0] is active(), (name, mapped[0], active())
              assert mapped[0].master is host
              metrics[name]={
                  "host_bbox":box(host),
                  "active_bbox":box(mapped[0]),
                  "mapped_surface_count":len(mapped),
                  "display_mode":str(app._phase6_3d_display_mode),
                  "active_part":str(app.designer_workspace.active_part),
              }
              subprocess.run(["scrot",str(out/f"{name}.png")],check=True)

          capture("part",lambda:app.activate_part("head"),lambda:app.fold_editor_host)
          capture("assembly",lambda:bridge._phase6_show_assembly(app),lambda:app.assembly_parts_panel)
          capture("corner_data",lambda:bridge._phase6_show_corner_data(app),lambda:app.corner_data_panel)

          boxes=[metrics[k]["host_bbox"] for k in ("part","assembly","corner_data")]
          for other in boxes[1:]:
              assert all(abs(a-b)<=2 for a,b in zip(boxes[0],other)), (boxes[0],other)
          assert all(metrics[k]["mapped_surface_count"]==1 for k in metrics)
          (out/"metrics.json").write_text(json.dumps(metrics,indent=2,ensure_ascii=False)+"
")
          print("VISUAL_SCREENSHOT_COUNT=3")
          print("SHARED_HOST_BBOX_PARITY=1")
          print("ACTIVE_SHARED_CONTENT_MODE_COUNT=1")
          root.destroy()
          PY
          test -s .scratch/issue436/visual/part.png
          test -s .scratch/issue436/visual/assembly.png
          test -s .scratch/issue436/visual/corner_data.png
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue436-visual
          path: .scratch/issue436/visual
          if-no-files-found: error

  target-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate ancestry and production target drift
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$CANDIDATE_SHA"
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          echo "TARGET_READBACK=$actual"
          test "$actual" = "$BASELINE_SHA"
          echo "TARGET_DRIFT=0"
          echo "CANDIDATE_FAST_FORWARDABLE=1"
          echo "FORCE_PUSH=0"

  accepted:
    needs:
      - classify-full
      - protected-ab
      - structural-candidate
      - visual
      - target-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue436-full-ab-classifier
          path: .scratch/issue436/accepted/full
      - uses: actions/download-artifact@v4
        with:
          name: issue436-visual
          path: .scratch/issue436/accepted/visual
      - name: Publish final T6 classifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          full=json.loads(Path(".scratch/issue436/accepted/full/full-ab-classification.json").read_text())
          metrics=json.loads(Path(".scratch/issue436/accepted/visual/metrics.json").read_text())
          assert full["NEW_HEADLESS"] == []
          assert full["NEW_HEADLESS_ERRORS"] == []
          assert full["NEW_XVFB"] == []
          assert full["NEW_XVFB_ERRORS"] == []
          assert len(metrics)==3
          out={
              "schema":"WHD_ISSUE436_T6_CUMULATIVE_ACCEPTANCE_V1",
              "baseline_sha":"50e14c7054916cb0b9597c61194725939c5de323",
              "candidate_sha":"e3438fab1a77eee7bbcf8d03b0c2d765a1bcceea",
              "decision":"GREEN",
              "full_ab":full,
              "visual_metrics":metrics,
              "gates":{
                  "SHARED_CONTENT_HOST_COUNT":1,
                  "ACTIVE_SHARED_CONTENT_MODE_COUNT":1,
                  "SEPARATE_ASSEMBLY_REGION":0,
                  "SEPARATE_CORNER_DATA_REGION":0,
                  "PERMANENT_HIDDEN_SECOND_HOST":0,
                  "DUPLICATE_WIDGET_TREE":0,
                  "DUPLICATE_EVENT_BINDING":0,
                  "GEOMETRY_DRIFT":0,
                  "DATAFLOW_DRIFT":0,
                  "PERSISTENCE_DRIFT":0,
                  "CALLBACK_SEMANTIC_DRIFT":0,
                  "VISIBILITY_SEMANTIC_DRIFT":0,
                  "CORNER_DATA_BEHAVIOR_DRIFT":0,
                  "PROTECTED_DRIFT":0,
                  "FORCE_PUSH":0,
              },
          }
          p=Path(".scratch/issue436/accepted")
          (p/"acceptance.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"
")
          print("SHARED_CONTENT_HOST_COUNT=1")
          print("ACTIVE_SHARED_CONTENT_MODE_COUNT=1")
          print("SEPARATE_ASSEMBLY_REGION=0")
          print("SEPARATE_CORNER_DATA_REGION=0")
          print("PERMANENT_HIDDEN_SECOND_HOST=0")
          print("DUPLICATE_WIDGET_TREE=0")
          print("DUPLICATE_EVENT_BINDING=0")
          print("NEW_HEADLESS=[]")
          print("NEW_XVFB=[]")
          print("NEW_HEADLESS_ERRORS=[]")
          print("NEW_XVFB_ERRORS=[]")
          print("GEOMETRY_DRIFT=0")
          print("DATAFLOW_DRIFT=0")
          print("PERSISTENCE_DRIFT=0")
          print("CALLBACK_SEMANTIC_DRIFT=0")
          print("VISIBILITY_SEMANTIC_DRIFT=0")
          print("CORNER_DATA_BEHAVIOR_DRIFT=0")
          print("PROTECTED_DRIFT=0")
          print("DECISION=GREEN")
          print("FORCE_PUSH=0")
          PY
      - name: Upload cumulative acceptance
        uses: actions/upload-artifact@v4
        with:
          name: issue436-t6-cumulative-acceptance
          path: .scratch/issue436/accepted
          if-no-files-found: error
