name: issue188-stale-wait-watchdog

on:
  push:
    branches:
      - fix/issue188-stale-wait-watchdog-20260913

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 766fd4834558113a866cb45bd7f9f7f9e95d5dc1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Prove stale-wait contract is RED before implementation
        run: |
          if python -m pytest -q tests/process/test_continuous_execution_durable_contract.py; then
            echo "ERROR: historical RED unexpectedly passed"
            exit 1
          fi
          echo "EXPECTED RED: stale-wait watchdog contract was absent before implementation"

  green-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Prove stale-wait contract is GREEN now
        run: python -m pytest -q tests/process/test_continuous_execution_durable_contract.py
