name: Issue 477 RED Contracts

on:
  push:
    branches:
      - process/issue477-skill-write-preflight-hard-gate-20260922

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - name: Run execution-claim Skill-preflight RED contracts
        run: |
          python -m pytest -q tests/process/test_issue256_execution_claim_guard.py
