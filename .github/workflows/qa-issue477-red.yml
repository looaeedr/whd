name: Issue 477 Final QA

on:
  push:
    branches:
      - process/issue477-skill-write-preflight-hard-gate-20260922

jobs:
  final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - name: Verify Skill line budgets
        run: |
          python - <<'PY'
          from pathlib import Path
          for rel in (
              ".agents/skills/engineering/寫技能/SKILL.md",
              ".agents/skills/engineering/派工/SKILL.md",
          ):
              lines = len(Path(rel).read_text(encoding="utf-8").splitlines())
              assert lines < 500, (rel, lines)
              print("SKILL_LINE_BUDGET_GREEN", rel, lines)
          PY
      - name: Run Issue 477 governance contracts
        run: |
          python -m pytest -q \
            tests/process/test_issue256_execution_claim_guard.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_writing_skill_contract.py \
            tests/test_writing_skill_preflight_route.py \
            tests/test_dispatching_skill_timeout_contract.py \
            tests/test_issue_closure_completion_skill_contract.py \
            tests/test_phase6_release_packaging_policy.py \
            tests/test_chinese_skill_identity_contract.py
