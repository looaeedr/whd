name: Apply Corner Registry Source Note Chinese Fix

on:
  push:
    branches:
      - fix/corner-db-source-note-chinese-20260917
    paths:
      - '.github/workflows/qa-corner-registry-chinese-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/corner-db-source-note-chinese-20260917
          fetch-depth: 0
      - name: Add presentation-only source-note translation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('fold_designer_bridge.py')
          text = p.read_text(encoding='utf-8')
          helper_marker = 'def _phase6_bind_translated_var(raw_var, display_var, to_display, to_raw):'
          if text.count(helper_marker) != 1:
              raise SystemExit(f'helper marker count={text.count(helper_marker)}')
          helper_lines = [
              '_PHASE6_SOURCE_DISPLAY_TOKENS = {',
              '    "linked-FW": "連動框寬",',
              '}',
              '',
              '',
              'def _phase6_source_display(value):',
              '    text = str(value or "")',
              '    for raw, label in sorted(_PHASE6_SOURCE_DISPLAY_TOKENS.items(), key=lambda item: len(item[0]), reverse=True):',
              '        text = text.replace(raw, label)',
              '    return text',
              '',
              '',
              'def _phase6_source_raw(value):',
              '    text = str(value or "")',
              '    for raw, label in sorted(_PHASE6_SOURCE_DISPLAY_TOKENS.items(), key=lambda item: len(item[1]), reverse=True):',
              '        text = text.replace(label, raw)',
              '    return text',
              '',
              '',
          ]
          text = text.replace(helper_marker, '\n'.join(helper_lines) + helper_marker, 1)
          entry_marker = '    entry("公式來源／備註", self.relief_registry_source_var)'
          if text.count(entry_marker) != 1:
              raise SystemExit(f'entry marker count={text.count(entry_marker)}')
          binding_lines = [
              '    self.relief_registry_source_display_var = original.tk.StringVar(master=form)',
              '    _phase6_bind_translated_var(',
              '        self.relief_registry_source_var, self.relief_registry_source_display_var,',
              '        _phase6_source_display, _phase6_source_raw,',
              '    )',
              '    entry("公式來源／備註", self.relief_registry_source_display_var)',
          ]
          text = text.replace(entry_marker, '\n'.join(binding_lines), 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify patch shape
        run: |
          set -euo pipefail
          git diff --check
          git diff -- fold_designer_bridge.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fold_designer_bridge.py
          git commit -m 'fix: localize corner registry source-note presentation'
          git push origin HEAD:fix/corner-db-source-note-chinese-20260917
