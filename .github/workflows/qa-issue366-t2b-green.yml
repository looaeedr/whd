name: "QA #366 T2B structure endcap GREEN"
# trigger after inherited-RED classifier correction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t2b-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        run: |
          set -euo pipefail
          echo "BASELINE=bb8c3d0272756629654127fbd86e9d7013d797e4"
          echo "CANDIDATE=$(git rev-parse HEAD)"
          git merge-base --is-ancestor bb8c3d0272756629654127fbd86e9d7013d797e4 HEAD

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: Compile T2B
        run: python -m py_compile phase6_settings_transaction_controller.py fold_designer_bridge.py

      - name: Run T2B controller contracts
        run: python -m pytest -q tests/test_issue366_t2b_structure_endcap_controller.py

      - name: Run pure structure and assembly semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase6_box_body_structure.py \
            tests/test_receiving_bottom_wrap_linkage.py \
            tests/test_receiving_bottom_wrap_registry.py \
            tests/test_assembly_joint_contract.py \
            tests/test_assembly_joint_semantics.py

      - name: Run real-Tk structure and EndCap regressions
        shell: bash
        run: |
          set -euo pipefail
          NODE="tests/test_phase6_t02_endcap_edge_controls.py::test_head_settings_publish_four_edge_controls_directly_from_registry"
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t02_endcap_edge_controls.py \
            tests/test_phase6_settings_center_bridge.py \
            tests/test_issue124_structure_tree.py \
            --deselect "$NODE"

      - name: Require exact inherited edge-control RED on baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="bb8c3d0272756629654127fbd86e9d7013d797e4"
          CANDIDATE="$GITHUB_SHA"
          NODE="tests/test_phase6_t02_endcap_edge_controls.py::test_head_settings_publish_four_edge_controls_directly_from_registry"

          run_one() {
            label="$1"
            ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            set +e
            xvfb-run -a python -m pytest -q "$NODE" --tb=short 2>&1 | tee "/tmp/$label-edge.log"
            rc=${PIPESTATUS[0]}
            set -e
            test "$rc" -ne 0
            grep -q "1 failed" "/tmp/$label-edge.log"
            grep -q "assert set() ==" "/tmp/$label-edge.log"
          }

          run_one baseline "$BASELINE"
          run_one candidate "$CANDIDATE"
          echo "PASS INHERITED_EDGE_CONTROL_RED=EXACT_BASELINE_PARITY"
