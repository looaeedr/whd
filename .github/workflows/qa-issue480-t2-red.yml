name: Issue 480 T2 Requirement RED

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue480-t2-red.yml'
      - 'tests/test_issue480_derived_part_projection_plan.py'
      - 'phase6_derived_part_projection.py'

permissions:
  contents: read

jobs:
  requirement-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run issue480 R2 requirement contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short tests/test_issue480_derived_part_projection_plan.py
