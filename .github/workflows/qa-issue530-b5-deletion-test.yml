name: 工單530 B5 Derived Request Assembly 刪除測試
run-name: "工單 #530 B5｜Derived Request Assembly Deletion-Test｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue530-b5-deletion-test.yml

permissions:
  contents: read

jobs:
  deletion-test:
    name: B5 Derived Projection 邊界驗證
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: DT-0 凍結 derived request assembly 現況
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue530-evidence
          python - <<'PY'
          from __future__ import annotations
          import ast, json, subprocess
          from pathlib import Path

          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          fn=next(
              n for n in tree.body
              if isinstance(n,ast.FunctionDef)
              and n.name=="_phase6_sync_authoritative_derived_parts"
          )
          body=ast.get_source_segment(source,fn) or ""
          tokens={
              "door_projection":"_phase6_door_part_projections",
              "door_profiles":"build_standard_part_profiles",
              "base_plate_layout":"derive_door_layout_cells",
              "box_piece_profiles":"_phase6_box_body_piece_part_profiles",
              "divider_derivation":"derive_box_body_dividers",
              "inner_frame_derivation":"derive_all_inner_door_frames",
              "inner_panel_derivation":"derive_inner_door_panels",
              "local_remove_list":"remove_part_keys = []",
              "local_add_list":"add_parts = []",
              "local_stash_profiles":"stash_profiles = []",
              "local_stash_features":"stash_features = []",
              "local_active_repair":"active_repair = None",
              "local_selected_repair":"selected_repair = None",
              "request_ctor":"DerivedPartProjectionRequest(",
              "plan_build":"build_derived_part_sync_plan(request)",
              "navigation_apply":"navigation.apply_derived_sync_plan(plan)",
          }
          payload={
              "schema":"WHD_ISSUE530_B5_DT0_V1",
              "baseline_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "boundary_id":"B5_DERIVED_REQUEST_ASSEMBLY",
              "span":fn.end_lineno-fn.lineno+1,
              "tokens":{k:(v in body) for k,v in tokens.items()},
              "domain_derivation_tokens":[
                  k for k in (
                      "door_projection","door_profiles","base_plate_layout",
                      "box_piece_profiles","divider_derivation",
                      "inner_frame_derivation","inner_panel_derivation"
                  ) if tokens[k] in body
              ],
              "request_assembly_tokens":[
                  k for k in (
                      "local_remove_list","local_add_list","local_stash_profiles",
                      "local_stash_features","local_active_repair",
                      "local_selected_repair","request_ctor"
                  ) if tokens[k] in body
              ],
              "mutation_delegate":"navigation.apply_derived_sync_plan(plan)" in body,
          }
          Path("/tmp/issue530-evidence/dt0.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print("DT0_SPAN="+str(payload["span"]))
          print("DT0_DOMAIN_DERIVATION_TOKEN_COUNT="+str(len(payload["domain_derivation_tokens"])))
          print("DT0_REQUEST_ASSEMBLY_TOKEN_COUNT="+str(len(payload["request_assembly_tokens"])))
          print("DT0_MUTATION_DELEGATE="+str(payload["mutation_delegate"]).lower())
          print("ISSUE530_DT0=GREEN")
          PY

      - name: DT-2 K baseline owner/behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_phase6_t04_inner_door_frames.py             tests/test_phase6_t05_box_body_dividers.py             tests/test_multi_door_layout.py             | tee /tmp/issue530-evidence/variant-k.log
          grep -E '[0-9]+ passed' /tmp/issue530-evidence/variant-k.log | tail -1

      - name: DT-2 建立 E 深化 existing projection owner
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue530-e HEAD >/dev/null
          cd /tmp/issue530-e
          cat >> phase6_derived_part_projection.py <<'PY'

          @dataclass(frozen=True)
          class DerivedPartRequestAssemblyInput:
              door_part_keys: tuple[str, ...]
              door_profiles: Mapping[str, Mapping[str, Iterable[Any]]]
              base_plate_profiles: Mapping[str, Mapping[str, Iterable[Any]]]
              divider_profiles: Mapping[str, Mapping[str, Iterable[Any]]]
              inner_profiles: Mapping[str, Mapping[str, Iterable[Any]]]
              box_piece_profiles: Mapping[str, Mapping[str, Iterable[Any]]]
              current_piece_keys: tuple[str, ...]
              source_parts: tuple[str, ...]
              available_parts: tuple[str, ...]
              source_part_features: Mapping[str, Iterable[Any]]
              known_feature_keys: tuple[str, ...]
              single_door_profiles: Mapping[str, Iterable[Any]] | None
              single_base_plate_profiles: Mapping[str, Iterable[Any]] | None
              active_part: str | None
              selected_part: str | None


          def build_derived_part_projection_request(
              data: DerivedPartRequestAssemblyInput,
          ) -> DerivedPartProjectionRequest:
              """Assemble immutable workspace intent from already-derived projections."""
              if not isinstance(data, DerivedPartRequestAssemblyInput):
                  raise TypeError("data must be DerivedPartRequestAssemblyInput")

              door_keys=tuple(str(key) for key in data.door_part_keys)
              available=set(str(key) for key in data.available_parts)
              source_parts=set(str(key) for key in data.source_parts)
              known_features=set(str(key) for key in data.known_feature_keys)
              current_piece_keys=set(str(key) for key in data.current_piece_keys)

              remove_part_keys=[]
              add_parts=[]
              stash_profiles=[]
              stash_features=[]

              if door_keys and "door" in available:
                  remove_part_keys.append("door")
              for key in door_keys:
                  if (
                      key not in known_features
                      and key in data.source_part_features
                  ):
                      stash_features.append(
                          feature_projection(key, data.source_part_features[key])
                      )
              if (
                  not door_keys
                  and "door" in source_parts
                  and "door" not in available
                  and data.single_door_profiles is not None
              ):
                  add_parts.append(
                      profile_projection("door", data.single_door_profiles)
                  )

              if door_keys and "base_plate" in available:
                  remove_part_keys.append("base_plate")
              if (
                  not door_keys
                  and "base_plate" in source_parts
                  and "base_plate" not in available
                  and data.single_base_plate_profiles is not None
              ):
                  add_parts.append(
                      profile_projection(
                          "base_plate",
                          data.single_base_plate_profiles,
                      )
                  )

              desired_piece_keys=set(str(key) for key in data.box_piece_profiles)
              for key in sorted(current_piece_keys - desired_piece_keys):
                  remove_part_keys.append(key)
              for key, profiles in data.box_piece_profiles.items():
                  projection=profile_projection(key, profiles)
                  if key in available:
                      stash_profiles.append(projection)
                  else:
                      add_parts.append(projection)

              active_repair=None
              selected_repair=None
              if door_keys:
                  first_door=door_keys[0]
                  first_base=first_door.replace("door_", "base_plate_", 1)
                  if data.active_part=="door":
                      active_repair=first_door
                  elif data.active_part=="base_plate":
                      active_repair=first_base
                  if data.selected_part=="door":
                      selected_repair=first_door
                  elif data.selected_part=="base_plate":
                      selected_repair=first_base

              return DerivedPartProjectionRequest(
                  namespaces=(
                      namespace_projection("door_c", data.door_profiles),
                      namespace_projection(
                          "base_plate_c",
                          data.base_plate_profiles,
                      ),
                      namespace_projection(
                          "box_body:divider:",
                          data.divider_profiles,
                      ),
                      namespace_projection(
                          "inner_door:",
                          data.inner_profiles,
                      ),
                  ),
                  remove_part_keys=tuple(remove_part_keys),
                  add_parts=tuple(add_parts),
                  stash_profiles=tuple(stash_profiles),
                  stash_features=tuple(stash_features),
                  active_part_repair=active_repair,
                  selected_part_repair=selected_repair,
              )
          PY

          python - <<'PY'
          from pathlib import Path
          path=Path("fold_designer_bridge.py")
          source=path.read_text(encoding="utf-8")
          source=source.replace(
              "    DerivedPartProjectionRequest,\n    build_derived_part_sync_plan,",
              "    DerivedPartProjectionRequest,\n"
              "    DerivedPartRequestAssemblyInput,\n"
              "    build_derived_part_projection_request,\n"
              "    build_derived_part_sync_plan,"
          )
          start=source.index("    remove_part_keys = []", source.index("def _phase6_sync_authoritative_derived_parts"))
          end=source.index("    plan = build_derived_part_sync_plan(request)", start)
          replacement="\n".join([
              "    single_door_profiles = (",
              "        build_standard_part_profiles(snapshot, \"door\")",
              "        if not door_rows and \"door\" in source_parts and \"door\" not in available_parts",
              "        else None",
              "    )",
              "    single_base_plate_profiles = (",
              "        build_standard_part_profiles(snapshot, \"base_plate\")",
              "        if (",
              "            not door_rows",
              "            and \"base_plate\" in source_parts",
              "            and \"base_plate\" not in available_parts",
              "        )",
              "        else None",
              "    )",
              "    request = build_derived_part_projection_request(",
              "        DerivedPartRequestAssemblyInput(",
              "            door_part_keys=tuple(row.part_key for row in door_rows),",
              "            door_profiles=door_profiles,",
              "            base_plate_profiles=base_plate_profiles,",
              "            divider_profiles=divider_profiles,",
              "            inner_profiles=inner_profiles,",
              "            box_piece_profiles=box_piece_profiles,",
              "            current_piece_keys=tuple(current_piece_keys),",
              "            source_parts=source_parts,",
              "            available_parts=available_parts,",
              "            source_part_features=source_part_features,",
              "            known_feature_keys=tuple(known_feature_keys),",
              "            single_door_profiles=single_door_profiles,",
              "            single_base_plate_profiles=single_base_plate_profiles,",
              "            active_part=workspace.active_part,",
              "            selected_part=workspace.selected_part,",
              "        )",
              "    )",
          ])+"\n"
          source=source[:start]+replacement+source[end:]
          path.write_text(source,encoding="utf-8")
          PY

          python - <<'PY'
          from __future__ import annotations
          import ast,json
          from pathlib import Path

          bridge=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(bridge)
          fn=next(
              n for n in tree.body
              if isinstance(n,ast.FunctionDef)
              and n.name=="_phase6_sync_authoritative_derived_parts"
          )
          body=ast.get_source_segment(bridge,fn) or ""
          projection=Path("phase6_derived_part_projection.py").read_text(encoding="utf-8")
          forbidden=(
              "fold_designer_bridge",
              "tkinter",
              "DesignerWorkspace",
              "phase6_manufacturing_geometry",
              "manufacturing_api",
              "derive_box_body_dividers",
              "derive_all_inner_door_frames",
              "derive_inner_door_panels",
              "build_standard_part_profiles",
          )
          violations=[token for token in forbidden if token in projection]
          request_tokens=(
              "remove_part_keys = []",
              "add_parts = []",
              "stash_profiles = []",
              "stash_features = []",
              "active_repair = None",
              "selected_repair = None",
          )
          payload={
              "variant_e_span":fn.end_lineno-fn.lineno+1,
              "old_request_assembly_removed":not any(
                  token in body for token in request_tokens
              ),
              "uses_projection_owner":"build_derived_part_projection_request(" in body,
              "mutation_delegate":"navigation.apply_derived_sync_plan(plan)" in body,
              "projection_owner_forbidden_tokens":violations,
              "domain_derivation_retained_in_bridge":all(
                  token in body for token in (
                      "_phase6_door_part_projections",
                      "derive_door_layout_cells",
                      "_phase6_box_body_piece_part_profiles",
                      "derive_box_body_dividers",
                      "derive_all_inner_door_frames",
                  )
              ),
          }
          Path("/tmp/issue530-evidence/variant-e.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          assert payload["old_request_assembly_removed"]
          assert payload["uses_projection_owner"]
          assert payload["mutation_delegate"]
          assert not violations
          assert payload["domain_derivation_retained_in_bridge"]
          print("VARIANT_E_SPAN="+str(payload["variant_e_span"]))
          print("VARIANT_E_OLD_REQUEST_ASSEMBLY_REMOVED=true")
          print("VARIANT_E_PROJECTION_OWNER_FORBIDDEN_TOKENS=0")
          print("VARIANT_E_DOMAIN_DERIVATION_RETAINED_IN_BRIDGE=true")
          print("ISSUE530_DT2_E=GREEN")
          PY

          python - <<'PY'
          from phase6_derived_part_projection import (
              DerivedPartRequestAssemblyInput,
              build_derived_part_projection_request,
              build_derived_part_sync_plan,
          )
          data=DerivedPartRequestAssemblyInput(
              door_part_keys=("door_c1_r1",),
              door_profiles={"door_c1_r1":{"X":[{"len":10}],"Y":[]}},
              base_plate_profiles={"base_plate_c1_r1":{"X":[{"len":20}],"Y":[]}},
              divider_profiles={"box_body:divider:R:C0|C1":{"X":[{"len":30}],"Y":[]}},
              inner_profiles={"inner_door:A:top_frame":{"X":[{"len":40}],"Y":[]}},
              box_piece_profiles={"box_body:left_side":{"X":[{"len":50}],"Y":[]}},
              current_piece_keys=("box_body:old_side",),
              source_parts=("box_body","door","base_plate"),
              available_parts=("box_body","door","base_plate"),
              source_part_features={"door_c1_r1":[{"id":"f"}]},
              known_feature_keys=(),
              single_door_profiles=None,
              single_base_plate_profiles=None,
              active_part="door",
              selected_part="base_plate",
          )
          request=build_derived_part_projection_request(data)
          plan=build_derived_part_sync_plan(request)
          assert "door" in plan.remove_part_keys
          assert "base_plate" in plan.remove_part_keys
          assert "box_body:old_side" in plan.remove_part_keys
          assert plan.active_part_repair=="door_c1_r1"
          assert plan.selected_part_repair=="base_plate_c1_r1"
          assert any(x.part_key=="door_c1_r1" for x in plan.stash_features)
          print("VARIANT_E_REQUEST_UNIT=GREEN")
          PY

      - name: DT-4 E variant Headless 行為
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/issue530-e
          python -m pytest -q             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_phase6_t04_inner_door_frames.py             tests/test_phase6_t05_box_body_dividers.py             tests/test_multi_door_layout.py             -k 'not bridge_builds_immutable_plan_before_first_navigation_mutation'             | tee /tmp/issue530-evidence/variant-e-headless.log
          grep -E '[0-9]+ passed' /tmp/issue530-evidence/variant-e-headless.log | tail -1

      - name: DT-4 E variant Xvfb physical-part parity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/issue530-e
          xvfb-run -a python -m pytest -q             tests/test_issue44_box_body_physical_piece_identity.py             tests/test_phase6_linked_fold_chain_and_parts.py             -k 'r4_receiving_corner_data or real_main_corner_data'             | tee /tmp/issue530-evidence/variant-e-xvfb.log
          grep -E '[0-9]+ passed' /tmp/issue530-evidence/variant-e-xvfb.log | tail -1

      - name: DT-5/6 產生 B5 candidate decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          dt0=json.loads(Path("/tmp/issue530-evidence/dt0.json").read_text(encoding="utf-8"))
          e=json.loads(Path("/tmp/issue530-evidence/variant-e.json").read_text(encoding="utf-8"))
          reduction=dt0["span"]-e["variant_e_span"]
          decision="DEEPEN_DERIVED_PROJECTION_OWNER"
          payload={
              "schema":"WHD_ISSUE530_B5_DT_CANDIDATE_V1",
              "boundary_id":"B5_DERIVED_REQUEST_ASSEMBLY",
              "baseline_head":dt0["baseline_head"],
              "variant_keep":{
                  "span":dt0["span"],
                  "domain_derivation_token_count":len(dt0["domain_derivation_tokens"]),
                  "request_assembly_token_count":len(dt0["request_assembly_tokens"]),
                  "caller_owns_cross_domain_request_assembly":True,
              },
              "variant_extract":{
                  **e,
                  "candidate_owner":"phase6_derived_part_projection",
                  "span_reduction":reduction,
                  "full_app_dependency":False,
                  "reverse_import_count":0,
                  "duplicate_path_count":0,
              },
              "candidate_decision":decision,
              "production_change_required":True,
              "final_decision_blocked_until":[
                  "replacement requirement RED",
                  "real production extraction",
                  "focused Headless/Xvfb GREEN"
              ],
              "rationale":"Existing phase6_derived_part_projection already owns immutable projection/request contracts. Moving remove/add/stash/repair assembly into that existing pure owner deletes cross-domain request knowledge from Bridge while keeping canonical domain derivations in their owners and workspace mutation in navigation.",
          }
          Path("/tmp/issue530-evidence/issue530-b5-dt-candidate.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print("B5_CANDIDATE_DECISION="+decision)
          print("B5_VARIANT_E_SPAN_REDUCTION="+str(reduction))
          print("B5_PRODUCTION_CHANGE_REQUIRED=true")
          print("ISSUE530_DT_CANDIDATE=GREEN")
          PY

      - name: 上傳 B5 Deletion-Test candidate 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue530-b5-deletion-test-candidate
          path: /tmp/issue530-evidence/
          if-no-files-found: error
          retention-days: 14
