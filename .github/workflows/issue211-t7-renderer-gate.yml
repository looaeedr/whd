name: Issue 211 T7 Xvfb Parent-Target A-B Classification

on:
  pull_request:
    branches:
      - qa/issue211-xvfb-ab-runner-20260914

permissions:
  contents: read

jobs:
  xvfb-ab-classification:
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: f486a61534f02890c9f497422bf99d7a2bec34c3
      TARGET_SHA: 254f82f589e684b59e48dabb93ce2a6767d440bc
      TEST_NODE: tests/test_phase6_gui_3d_integrity_20260830.py::test_real_box_body_2d_annotations_do_not_overlap_each_other_or_material
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python and Xvfb
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib

      - name: Run exact failing Xvfb test twice on parent and target
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/issue211-xvfb-ab"
          mkdir -p "$evidence"
          printf 'PARENT_SHA=%s\nTARGET_SHA=%s\nTEST_NODE=%s\n' "$PARENT_SHA" "$TARGET_SHA" "$TEST_NODE" > "$evidence/metadata.txt"

          run_side() {
            local label="$1"
            local sha="$2"
            local failures=0
            for attempt in 1 2; do
              git reset --hard
              git clean -fdx
              git checkout --force "$sha"
              printf '%s attempt %s sha=%s\n' "$label" "$attempt" "$(git rev-parse HEAD)" | tee "$evidence/${label}-${attempt}-head.txt"
              set +e
              xvfb-run -a python -m pytest -q "$TEST_NODE" --tb=short 2>&1 | tee "$evidence/${label}-${attempt}.txt"
              rc=${PIPESTATUS[0]}
              set -e
              printf '%s\n' "$rc" > "$evidence/${label}-${attempt}.rc"
              if [ "$rc" -ne 0 ]; then
                failures=$((failures + 1))
              fi
            done
            printf '%s\n' "$failures" > "$evidence/${label}-failures.txt"
          }

          run_side parent "$PARENT_SHA"
          run_side target "$TARGET_SHA"

          parent_failures=$(cat "$evidence/parent-failures.txt")
          target_failures=$(cat "$evidence/target-failures.txt")
          printf 'parent_failures=%s/2\ntarget_failures=%s/2\n' "$parent_failures" "$target_failures" | tee "$evidence/classification.txt"

          if [ "$parent_failures" -eq 0 ] && [ "$target_failures" -eq 0 ]; then
            echo 'CLASSIFICATION=NO_REPRO' | tee -a "$evidence/classification.txt"
            exit 0
          fi
          if [ "$parent_failures" -eq 2 ] && [ "$target_failures" -eq 2 ]; then
            echo 'CLASSIFICATION=INHERITED_BASELINE_RED' | tee -a "$evidence/classification.txt"
            exit 0
          fi
          if [ "$parent_failures" -eq 2 ] && [ "$target_failures" -eq 0 ]; then
            echo 'CLASSIFICATION=TARGET_IMPROVES_BASELINE' | tee -a "$evidence/classification.txt"
            exit 0
          fi
          if [ "$parent_failures" -eq 0 ] && [ "$target_failures" -eq 2 ]; then
            echo 'CLASSIFICATION=TARGET_REGRESSION' | tee -a "$evidence/classification.txt"
            exit 1
          fi
          echo 'CLASSIFICATION=FLAKY_OR_AMBIGUOUS' | tee -a "$evidence/classification.txt"
          exit 1

      - name: Upload A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue211-t7-xvfb-parent-target-ab
          path: ${{ runner.temp }}/issue211-xvfb-ab/
          if-no-files-found: error
