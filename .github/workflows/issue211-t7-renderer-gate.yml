name: Issue 211 T7 Post-Failure Closure Audit

on:
  pull_request:
    branches:
      - qa/issue211-postfailure-audit-runner-20260914

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 254f82f589e684b59e48dabb93ce2a6767d440bc
      PARENT_SHA: f486a61534f02890c9f497422bf99d7a2bec34c3
      INHERITED_TEST: tests/test_phase6_gui_3d_integrity_20260830.py::test_real_box_body_2d_annotations_do_not_overlap_each_other_or_material
    steps:
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Lock exact lineage and production diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue211/closure-audit

          status_before=$(git status --porcelain=v1)
          printf '%s\n' "$status_before" > .scratch/issue211/closure-audit/status-before.txt
          test -z "$status_before"

          actual=$(git rev-parse HEAD)
          parent=$(git rev-parse HEAD^)
          changed=$(git -c core.quotepath=false diff --name-only "$PARENT_SHA" "$TARGET_SHA")
          {
            printf 'TARGET_SHA=%s\n' "$TARGET_SHA"
            printf 'ACTUAL_SHA=%s\n' "$actual"
            printf 'EXPECTED_PARENT_SHA=%s\n' "$PARENT_SHA"
            printf 'ACTUAL_PARENT_SHA=%s\n' "$parent"
          } | tee .scratch/issue211/closure-audit/runner-metadata.txt
          printf '%s\n' "$changed" | tee .scratch/issue211/closure-audit/production-diff.txt

          test "$actual" = "$TARGET_SHA"
          test "$parent" = "$PARENT_SHA"
          test "$changed" = $'gui.py\ngui_modules/render_2d.py'
          test -f gui_modules/render_2d.py
          test ! -e gui_modules/render_3d.py
          grep -q 'class Phase6FinalSceneView' phase6_final_scene_view.py

      - name: Set up Python and Xvfb
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib

      - name: Phase6 knowledge preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #211 T7 post-failure closure audit for exact committed-head stateless 2D renderer Move-Only; preserve Phase6FinalSceneView as existing 3D owner; no production repair for inherited baseline red" \
            --changed-file gui.py \
            --changed-file gui_modules/render_2d.py \
            --changed-file tests/test_issue211_renderer_dependency_gate.py \
            --changed-file .scratch/issue211/preflight-evidence.md \
            --evidence .scratch/issue211/preflight-evidence.md \
            | tee .scratch/issue211/closure-audit/preflight.txt

      - name: Lock exact acceptance test paths
        shell: bash
        run: |
          set -euo pipefail
          headless=(
            tests/test_issue211_renderer_dependency_gate.py
            tests/test_phase6_2d_3d_round_trip.py
            tests/test_phase6_3d_single_source_renderer.py
            tests/test_phase6_final_scene_view_ownership.py
            tests/test_issue44_box_body_physical_piece_identity.py
            tests/test_issue45_dynamic_parts_2d_roundtrip.py
            tests/test_issue76_box_body_subtabs_2d_3d.py
            tests/test_dxf_acceptance.py
            tests/test_multipart_dxf_acceptance.py
            tests/test_receiving_door_dxf_roundtrip.py
            tests/test_phase6_receiving_projection_regression.py
          )
          xvfb=(
            tests/test_issue97_authoritative_unfold_view_adapter.py
            tests/test_issue98_existing_2d_capability_migration.py
            tests/test_issue99_dual_view_parity_persistence.py
            tests/test_phase6_gui_3d_integrity_20260830.py
            tests/test_phase6_assembly_3d_view.py
            tests/test_phase6_assembly_registry_gui_matrix.py
            tests/test_phase6_ui_state_regressions.py
          )
          for path in "${headless[@]}" "${xvfb[@]}"; do
            test -f "$path" || { echo "MISSING REQUIRED TEST: $path" >&2; exit 1; }
          done
          printf '%s\n' "${headless[@]}" > .scratch/issue211/closure-audit/headless-paths.txt
          printf '%s\n' "${xvfb[@]}" > .scratch/issue211/closure-audit/xvfb-paths.txt

      - name: Capture config and DXF invariant manifest before tests
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name 'config.ini' -o -iname '*.dxf' \) -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > .scratch/issue211/closure-audit/invariants-before.sha256

      - name: L1-L3 headless parity, identity, and DXF acceptance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t headless < .scratch/issue211/closure-audit/headless-paths.txt
          python -m pytest -q "${headless[@]}" \
            | tee .scratch/issue211/closure-audit/headless.txt

      - name: L4 Xvfb with inherited-baseline fail-closed classification
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t xvfb_tests < .scratch/issue211/closure-audit/xvfb-paths.txt
          set +e
          xvfb-run -a python -m pytest -q "${xvfb_tests[@]}" 2>&1 \
            | tee .scratch/issue211/closure-audit/xvfb.txt
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > .scratch/issue211/closure-audit/xvfb.rc

          if [ "$rc" -eq 0 ]; then
            echo 'L4_CLASSIFICATION=GREEN' | tee .scratch/issue211/closure-audit/l4-classification.txt
            exit 0
          fi

          test "$rc" -eq 1
          grep -Fq "FAILED $INHERITED_TEST - AssertionError: phase6_finished_dimensions" .scratch/issue211/closure-audit/xvfb.txt
          grep -Eq '1 failed, 90 passed,' .scratch/issue211/closure-audit/xvfb.txt
          failure_lines=$(grep -c '^FAILED ' .scratch/issue211/closure-audit/xvfb.txt)
          test "$failure_lines" -eq 1
          echo 'L4_CLASSIFICATION=INHERITED_BASELINE_RED' | tee .scratch/issue211/closure-audit/l4-classification.txt

      - name: Post-test drift and invariant audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name 'config.ini' -o -iname '*.dxf' \) -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > .scratch/issue211/closure-audit/invariants-after.sha256

          diff -u \
            .scratch/issue211/closure-audit/invariants-before.sha256 \
            .scratch/issue211/closure-audit/invariants-after.sha256 \
            | tee .scratch/issue211/closure-audit/invariant-diff.txt

          git diff --exit-code
          tracked_status=$(git status --porcelain=v1 --untracked-files=no)
          printf '%s\n' "$tracked_status" | tee .scratch/issue211/closure-audit/status-after.txt
          test -z "$tracked_status"
          echo 'DRIFT_INVARIANT_AUDIT=GREEN' | tee .scratch/issue211/closure-audit/drift-invariant-classification.txt

      - name: Upload closure audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue211-t7-postfailure-closure-audit
          path: .scratch/issue211/closure-audit/
          if-no-files-found: error
