name: Issue 211 T7 Renderer Dependency Gate

on:
  pull_request:
    branches:
      - qa/issue211-renderer-gate-20260914

permissions:
  contents: read

jobs:
  renderer-characterization-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase6 preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue211/run
          python tools/phase6_skill_preflight.py \
            --task "Issue #211 T7 staged 2D renderer helper Move-Only after dependency gate; preserve 3D Phase6FinalSceneView owner, physical identity, canonical geometry and 2D 3D parity" \
            --changed-file gui.py \
            --changed-file gui_modules/render_2d.py \
            --changed-file tests/test_issue211_renderer_dependency_gate.py \
            --changed-file .scratch/issue211/preflight-evidence.md \
            --evidence .scratch/issue211/preflight-evidence.md \
            | tee .scratch/issue211/run/preflight.txt

      - name: Install characterization dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib

      - name: Behavior characterization must stay GREEN before extraction
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue211_renderer_dependency_gate.py -k behavior \
            | tee .scratch/issue211/run/behavior.txt

      - name: Structural TDD RED for renderer ownership move
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue211_renderer_dependency_gate.py -k structure \
            | tee .scratch/issue211/run/structural-red.txt

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue211-t7-renderer-gate
          path: .scratch/issue211/run/
          if-no-files-found: warn
