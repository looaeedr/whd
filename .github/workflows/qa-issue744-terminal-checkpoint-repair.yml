name: QA Issue744 Terminal Checkpoint Repair

on:
  push:
    branches:
      - governance/issue744-terminal-checkpoint-repair-20260927
    paths:
      - 'tests/process/test_issue744_terminal_checkpoint_repair_transport.py'
      - 'tools/continuity_controller.py'
      - '.github/workflows/whd-remote-claim-activation.yml'
      - '.github/workflows/qa-issue744-terminal-checkpoint-repair.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tests/process/test_issue744_terminal_checkpoint_repair_transport.py'
      - 'tools/continuity_controller.py'
      - '.github/workflows/whd-remote-claim-activation.yml'
      - '.github/workflows/qa-issue744-terminal-checkpoint-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Run #744 focused repair transport
        run: python -m pytest tests/process/test_issue744_terminal_checkpoint_repair_transport.py -q
      - name: Protected activation and continuity regressions
        if: always()
        run: |
          python -m pytest             tests/process/test_issue671_legacy_checkpoint_repair.py             tests/process/test_continuity_controller.py             -q
