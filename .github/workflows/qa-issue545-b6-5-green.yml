name: 工單545 B6-5 GREEN 驗收
run-name: "工單 #545 B6-5｜Eight Facade Migration GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue545-b6-5-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B6-5 Facade migration 驗收
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Headless facade contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue545_b6_5_facade_batch.py             tests/test_issue524_a3_facade_ratchet.py             | tee /tmp/issue545-b6-5-headless.log
          grep -E '[0-9]+ passed' /tmp/issue545-b6-5-headless.log | tail -1

      - name: Xvfb affected caller parity
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_corner_lock_visual_contract.py             tests/test_corner_parameter_lock.py             tests/test_corner_type_phase6_integration.py             tests/test_phase6_corner_transaction.py             tests/test_phase6_factory_reset.py             tests/test_phase6_live_canonical_sync.py             tests/test_phase6_outside_advanced_perf.py             tests/test_phase6_settings_service.py             tests/test_phase6_t08_ui_text_and_edge_selectors.py             tests/test_phase6_t24_edge_selector_width.py             | tee /tmp/issue545-b6-5-xvfb.log
          grep -E '[0-9]+ passed' /tmp/issue545-b6-5-xvfb.log | tail -1

      - name: Architecture / count gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue545-b6-5-architecture.log
          import ast
          from pathlib import Path

          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          call=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          )
          mapping=next(arg for arg in call.args if isinstance(arg,ast.Dict))
          bindings={
              k.value:ast.unparse(v)
              for k,v in zip(mapping.keys,mapping.values)
              if isinstance(k,ast.Constant) and isinstance(k.value,str)
          }
          removed={
              "toggle_corner_parameter_lock",
              "_render_settings_context",
              "on_baseline_model_changed",
              "confirm_corner_transaction",
              "cancel_corner_transaction",
              "export_workspace_state_if_dirty",
              "save_diagnostic_file",
              "_phase6_on_endcap_edge_relation_selected",
          }
          retained={
              "reset_initial_values",
              "save_project_file",
              "save_project_file_as",
              "load_project_file",
          }
          assert removed.isdisjoint(bindings), sorted(removed & set(bindings))
          assert retained <= set(bindings), sorted(retained-set(bindings))
          assert len(bindings)==52, len(bindings)

          test_source="\n".join(
              p.read_text(encoding="utf-8")
              for p in sorted(Path("tests").rglob("test_*.py"))
              if p.name!="test_issue545_b6_5_facade_batch.py"
          )
          for stale in (
              ".toggle_corner_parameter_lock(",
              "._render_settings_context(",
              ".on_baseline_model_changed(",
              ".confirm_corner_transaction(",
              ".cancel_corner_transaction(",
              ".export_workspace_state_if_dirty(",
          ):
              assert stale not in test_source, stale
          for direct in (
              "bridge._phase6_toggle_corner_parameter_lock(",
              "bridge._phase6_render_settings_context(",
              "bridge._phase6_on_baseline_model_changed(",
              "bridge._phase6_confirm_corner_transaction(",
              "bridge._phase6_cancel_corner_transaction(",
              "bridge._phase6_export_workspace_state_if_dirty(",
              "bridge._phase6_on_endcap_edge_relation_selected(",
          ):
              assert direct in test_source, direct

          print("B6_5_ACCOUNTED=12")
          print("B6_5_UNCLASSIFIED=0")
          print("B6_5_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_5_REMOVED=8")
          print("B6_5_DIRECT_OWNER_MIGRATED=7")
          print("FACADE_COUNT=52")
          print("ISSUE545_B6_5_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue545-b6-5-green
          path: |
            /tmp/issue545-b6-5-headless.log
            /tmp/issue545-b6-5-xvfb.log
            /tmp/issue545-b6-5-architecture.log
          if-no-files-found: error
          retention-days: 14
