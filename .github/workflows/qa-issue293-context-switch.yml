name: QA issue293 context switch GREEN

on:
  push:
    branches:
      - refactor/issue293-context-switch-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply context switch extraction
        run: python tools/qa_issue293_context_switch_green.py && python tools/qa_issue293_context_switch_fix.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Verify focused GREEN
        run: python -m py_compile gui.py gui_modules/editors/hole_editor.py && python -m pytest -q tests/test_issue293_t5_context_switch_slice.py tests/test_issue293_t5_canvas_renderer_slice.py tests/test_issue293_t5_feature_factory_slice.py tests/test_issue293_t5_indicator_fit_validation_slice.py
      - name: Commit GREEN after verification
        shell: bash
        run: |
          git config user.name "looaeedr"
          git config user.email "76246585+looaeedr@users.noreply.github.com"
          git add gui.py gui_modules/editors/hole_editor.py tests/test_issue293_t5_feature_factory_slice.py
          git diff --cached --check
          git commit -m "refactor(#293): extract live context switching"
          git push origin HEAD:${GITHUB_REF_NAME}
