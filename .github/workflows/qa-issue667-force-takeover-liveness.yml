name: WHD #667 強制接手與心跳 focused 驗收
run-name: "WHD｜#667｜強制接手與心跳 RED/GREEN"

on:
  push:
    branches:
      - governance/issue667-force-takeover-liveness-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: "#667｜強制接手與心跳 focused contract"
    runs-on: ubuntu-latest
    steps:
      - name: 取出 exact branch
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 驗證 Actions 顯示名稱
        run: python tools/actions_visible_naming_guard.py .github/workflows/qa-issue667-force-takeover-liveness.yml

      - name: 安裝 focused pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: 執行 #667 強制接手與心跳 focused tests
        run: python -m pytest -q tests/process/test_issue667_force_takeover_liveness.py
