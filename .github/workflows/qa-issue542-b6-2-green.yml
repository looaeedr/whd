name: 工單542 B6-2 GREEN 驗收
run-name: "工單 #542 B6-2｜Facade 12-key GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue542-b6-2-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B6-2 Facade 收斂驗收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 跑 B6-2 與 Part Editor / Navigation compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue542_b6_2_facade_batch.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue365_t1_workspace_navigation_controller.py             tests/test_phase6_designer_workspace.py             tests/test_issue524_a3_facade_ratchet.py             | tee /tmp/issue542-b6-2-green.log
          grep -E '[0-9]+ passed' /tmp/issue542-b6-2-green.log | tail -1

      - name: 驗證 12-key final classification 與 facade count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue542-b6-2-architecture.log
          import ast
          from pathlib import Path

          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          call=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          )
          mapping=next(arg for arg in call.args if isinstance(arg,ast.Dict))
          bindings={
              k.value:ast.unparse(v)
              for k,v in zip(mapping.keys,mapping.values)
              if isinstance(k,ast.Constant) and isinstance(k.value,str)
          }

          retained={
              "_save_current_part",
              "_load_part_holes",
              "activate_part",
              "show_home",
              "on_3d_scroll",
              "add_part",
              "select_part",
              "remove_selected_part",
              "remove_part",
              "available_parts",
              "active_part_key",
          }
          assert "activate_selected_part" not in bindings
          assert retained <= set(bindings)
          assert len(bindings)==64, len(bindings)

          definitions={
              n.name for n in tree.body if isinstance(n,ast.FunctionDef)
          }
          assert "_fix11_activate_selected_part" in definitions, (
              "B6-2 removes only facade exposure, not the implementation body"
          )
          print("B6_2_ACCOUNTED=12")
          print("B6_2_UNCLASSIFIED=0")
          print("B6_2_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_2_REMOVED=1")
          print("FACADE_COUNT=64")
          print("ISSUE542_B6_2_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue542-b6-2-green
          path: |
            /tmp/issue542-b6-2-green.log
            /tmp/issue542-b6-2-architecture.log
          if-no-files-found: error
          retention-days: 14
