name: Issue 291 T3 Apply V4

on:
  push:
    branches:
      - refactor/issue291-gui-phase2-t3-selector-20260916

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue291-gui-phase2-t3-selector-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Reuse fail-closed extraction body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/issue291-t3-apply-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          script = textwrap.dedent(raw[start:end])
          exec(compile(script, 'issue291-t3-apply-v2-extraction', 'exec'), {})
          PY

      - name: Verify structural GREEN
        shell: bash
        run: |
          python -m py_compile gui.py gui_modules/parts/selector.py gui_modules/parts/subtabs.py
          python -m pytest -q tests/test_issue291_gui_phase2_t3_selector.py

      - name: Commit GREEN extraction and remove temporary runners
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/issue291-t3-apply.yml \
            .github/workflows/issue291-t3-apply-v2.yml \
            .github/workflows/issue291-t3-apply-v3.yml \
            .github/workflows/issue291-t3-apply-v4.yml
          git add -A
          git commit -m "refactor(#291): extract selector and box body subtabs"
          git push origin HEAD:refactor/issue291-gui-phase2-t3-selector-20260916
