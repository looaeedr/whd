name: Issue183 Preflight Boundary QA
on:
  push:
    branches: [fix/issue183-preflight-keyword-boundary-20260913]
  pull_request:
    branches: [cleanup/2d-3d-sync]

jobs:
  preflight-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest

      - name: Capture invariants
        run: |
          sha256sum config.ini | tee /tmp/config.before
          git ls-files -s '基準檔/**' | sha256sum | tee /tmp/baseline.before

      - name: Phase6 Knowledge Preflight
        run: |
          cat > /tmp/issue183-evidence.txt <<'EOF'
          phase6-release-packaging
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task '修正 Phase6 Preflight keyword matcher short acronym token boundary regression，remote QA 驗證' \
            --changed-file tools/phase6_skill_preflight.py \
            --changed-file tests/test_issue183_preflight_keyword_boundaries.py \
            --changed-file .github/workflows/issue183-preflight-boundary-qa.yml \
            --evidence /tmp/issue183-evidence.txt

      - name: Issue183 RED/GREEN regression
        run: pytest -q tests/test_issue183_preflight_keyword_boundaries.py

      - name: Verify invariants
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git ls-files -s '基準檔/**' | sha256sum | tee /tmp/baseline.after
          diff -u /tmp/baseline.before /tmp/baseline.after
