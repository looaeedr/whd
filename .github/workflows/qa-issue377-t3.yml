name: "QA #377 T3 remove wrapper labels"
on:
  push:
    branches: [ui/issue377-remove-wrapper-labels-20260919]
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue377_remove_wrapper_labels.py'
      - '.github/workflows/qa-issue377-t3.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  T3_BASELINE: 600e837bcdcc55bbf9f55b694b2daf5abcdd5028
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$T3_BASELINE" HEAD)" = "$T3_BASELINE"
      - name: Install GUI harness
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt
      - name: T3 wrapper contract
        run: xvfb-run -a python -m pytest -q tests/test_issue377_remove_wrapper_labels.py --tb=short
      - name: Navigation and assembly regressions
        run: xvfb-run -a python -m pytest -q tests/test_issue375_main_selector_navigation.py tests/test_issue376_assembly_collapsible_data.py tests/test_issue186_sheetmetal_selector_visibility.py --tb=short
