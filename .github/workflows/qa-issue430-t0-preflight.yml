name: "QA #430 T0 Knowledge Preflight"

on:
  push:
    branches:
      - qa/issue430-t0-single-host-census-20260920
    paths:
      - '.github/workflows/qa-issue430-t0-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue430-t0
          python tools/phase6_skill_preflight.py \
            --task "Issue #430 T0 single shared-content host baseline census and duplicate-region characterization for Fold Designer left UI. Inventory normal-part, assembly, and corner-data host identity, mode authority, mount/unmount call sites, repeated-switch widget trees, project load/refresh/part add-delete behavior. Evidence/tests only; no production runtime edit. GitHub Actions remote QA and dispatch workflow." \
            --evidence .scratch/issue430-t0/preflight-evidence.txt \
            > .scratch/issue430-t0/preflight-output.txt
          cat .scratch/issue430-t0/preflight-output.txt
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue430-t0-preflight
          path: |
            .scratch/issue430-t0/preflight-output.txt
            .scratch/issue430-t0/preflight-evidence.txt
