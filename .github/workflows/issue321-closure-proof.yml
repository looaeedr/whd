name: Issue321 Closure Proof

on:
  push:
    branches:
      - fix/issue321-rebase-current-production-20260916

permissions:
  contents: write

jobs:
  closure-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact production owner before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          expected='8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9'
          actual="$(git ls-remote origin refs/heads/cleanup/2d-3d-sync | cut -f1)"
          test "$actual" = "$expected"
          echo "PRODUCTION_OWNER_EXACT $actual"
      - name: Persist terminal owning checkpoint and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.continuity_controller import Checkpoint, ContinuityState, save_checkpoint

          path = Path('.scratch/issue321/closure-checkpoint.json')
          save_checkpoint(
              path,
              Checkpoint(
                  issue='#321',
                  branch='cleanup/2d-3d-sync',
                  head_sha='8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9',
                  state=ContinuityState.TERMINAL_SUCCESS,
                  next_action=None,
                  evidence=(
                      'RED 35105053212: 11 failed / 28 passed on current-production lineage',
                      'working GREEN 35105292980: 39 passed / 0 failed',
                      'exact-head acceptance 35105430724 @ 9d9b1fb0: 39 passed / 0 failed',
                      'tested-to-cleaned drift: only temporary QA workflow deletion',
                      'production non-force fast-forward readback: 8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9',
                      'issue #321 has zero sub-issues and zero dependencies',
                  ),
              ),
          )
          print(f'CLOSURE_CHECKPOINT_WRITTEN {path}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue321-closure-proof.yml
          git add -f .scratch/issue321/closure-checkpoint.json
          git commit -m 'chore(#321): persist closure checkpoint and remove one-shot workflow'
          git push origin HEAD:fix/issue321-rebase-current-production-20260916
      - name: Authorize owning finalization
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller authorize-finalization \
            .scratch/issue321/closure-checkpoint.json \
            --issue '#321' \
            --branch cleanup/2d-3d-sync \
            --head-sha 8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9 \
            --proof-out .scratch/issue321/finalization-proof.json
      - name: Persist finalization proof
        shell: bash
        run: |
          set -euo pipefail
          git add -f .scratch/issue321/finalization-proof.json
          git commit -m 'chore(#321): persist current finalization proof'
          git push origin HEAD:fix/issue321-rebase-current-production-20260916
      - name: Fresh production owner readback
        shell: bash
        run: |
          set -euo pipefail
          expected='8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9'
          actual="$(git ls-remote origin refs/heads/cleanup/2d-3d-sync | cut -f1)"
          test "$actual" = "$expected"
          echo "PRODUCTION_OWNER_STILL_EXACT $actual"
      - name: Verify finalization proof immediately before close
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller verify-finalization-proof \
            .scratch/issue321/closure-checkpoint.json \
            .scratch/issue321/finalization-proof.json \
            --issue '#321' \
            --branch cleanup/2d-3d-sync \
            --head-sha 8ccf1a9404a641ed892ab63e6f2c0e01ee80d6d9
