name: Issue281 Governance Metadata Recovery

on:
  push:
    branches:
      - fix/issue281-governance-metadata-recovery-20260916
    paths:
      - '.github/workflows/issue281-governance-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Repair only governed documentation metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frontmatter = (
              '---\n'
              'whd_doc_role: HISTORICAL\n'
              'whd_contract: verification-provenance\n'
              'whd_canonical: null\n'
              'whd_schema: WHD_DOC_META_V1\n'
              '---\n'
          )
          missing = [
              Path('docs/plans/2026-09-15-test-cleanup-t4-acceptance.md'),
              Path('docs/plans/2026-09-15-test-cleanup-t4-gui-characterization-retirement.md'),
              Path('docs/superpowers/verification/2026-09-16-issue280-permanent-test-move-acceptance.md'),
          ]
          for path in missing:
              text = path.read_text(encoding='utf-8')
              assert not text.startswith('---\n'), path
              path.write_text(frontmatter + text, encoding='utf-8')

          for path in [
              Path('docs/superpowers/verification/2026-09-15-issue280-reconciliation-audit.md'),
              Path('docs/superpowers/verification/2026-09-15-issue280-test-move-manifest.md'),
          ]:
              text = path.read_text(encoding='utf-8')
              needle = 'whd_doc_role: CURRENT\n'
              assert text.count(needle) == 1, path
              path.write_text(text.replace(needle, 'whd_doc_role: HISTORICAL\n', 1), encoding='utf-8')
          PY

      - name: Prove governance RED is repaired without production or test drift
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short -m governance tests
          git -c core.quotepath=false diff --name-only | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {line.strip() for line in Path('/tmp/changed.txt').read_text(encoding='utf-8').splitlines() if line.strip()}
          expected = {
              'docs/plans/2026-09-15-test-cleanup-t4-acceptance.md',
              'docs/plans/2026-09-15-test-cleanup-t4-gui-characterization-retirement.md',
              'docs/superpowers/verification/2026-09-15-issue280-reconciliation-audit.md',
              'docs/superpowers/verification/2026-09-15-issue280-test-move-manifest.md',
              'docs/superpowers/verification/2026-09-16-issue280-permanent-test-move-acceptance.md',
          }
          assert changed == expected, (changed, expected)
          print('ISSUE281_GOVERNANCE_RECOVERY_SCOPE=GREEN')
          PY
          test -z "$(git diff --name-only -- '*.py' 'tests/**' '*.dxf' 'config.ini')"
          echo 'PRODUCTION_TEST_DXF_CONFIG_DRIFT=0'

      - name: Commit recovered metadata to fresh branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'looaeedr'
          git config user.email '76246585+looaeedr@users.noreply.github.com'
          git add \
            docs/plans/2026-09-15-test-cleanup-t4-acceptance.md \
            docs/plans/2026-09-15-test-cleanup-t4-gui-characterization-retirement.md \
            docs/superpowers/verification/2026-09-15-issue280-reconciliation-audit.md \
            docs/superpowers/verification/2026-09-15-issue280-test-move-manifest.md \
            docs/superpowers/verification/2026-09-16-issue280-permanent-test-move-acceptance.md
          git commit -m 'docs(#281): repair inherited governance metadata'
          git push origin HEAD:fix/issue281-governance-metadata-recovery-20260916
