name: issue137-preflight
on:
  push:
    branches:
      - work/issue-137-no-fake-completion
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#137 no fake completion progress update terminal semantics"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_no_fake_completion_contract.py"
          --evidence ".phase6_issue137_no_fake_completion_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run #137 contract when present
        shell: bash
        run: |
          if [ -f tests/process/test_no_fake_completion_contract.py ]; then
            python -m pytest tests/process/test_no_fake_completion_contract.py -q
          else
            echo "no-fake-completion contract not yet created; preflight-only pass"
          fi
