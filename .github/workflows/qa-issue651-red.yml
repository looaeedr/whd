name: Issue 651 equivalent duplicate GREEN focused QA

on:
  push:
    branches:
      - governance/issue651-equivalent-duplicate-green-20260925

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run focused guard transaction tests
        run: python -m pytest -q tests/process/test_issue643_guard_transaction_gate.py
