name: DM4 Divider Resolved Sinks RED
on:
  push:
    branches: [work/dm4-divider-resolved-sinks]
    paths:
      - gui.py
      - tests/test_dm4_divider_resolved_sinks.py
      - .github/workflows/dm4-red.yml
  workflow_dispatch:
jobs:
  dm4-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Run DM4 resolved-sink RED
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          python -m pytest -q tests/test_dm4_divider_resolved_sinks.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "CONFIG_BEFORE=$before"
          echo "CONFIG_AFTER=$after"
          test "$before" = "$after"
