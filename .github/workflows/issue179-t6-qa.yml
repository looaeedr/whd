# CLOSING trigger: broaden T6 governance regressions
name: Issue179 T6 Active Skill Runtime QA

on:
  push:
    branches:
      - governance/issue179-active-skill-runtime-20260913
    paths:
      - '.agents/skills/engineering/research/SKILL.md'
      - '.agents/skills/engineering/code-review/SKILL.md'
      - '.agents/skills/engineering/wayfinder/SKILL.md'
      - '.agents/skills/engineering/triage/SKILL.md'
      - '.agents/skills/engineering/wizard/SKILL.md'
      - '.agents/skills/engineering/tdd/SKILL.md'
      - '.agents/skills/engineering/diagnosing-bugs/SKILL.md'
      - '.agents/skills/productivity/handoff/SKILL.md'
      - '.agents/skills/engineering/ask-matt/SKILL.md'
      - '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'
      - 'tests/knowledge/test_active_skill_runtime_contract.py'
      - '.github/workflows/issue179-t6-qa.yml'
  workflow_dispatch:

jobs:
  active-skill-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Record protected invariants before
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run final changed-file Knowledge Preflight
        shell: bash
        run: |
          cat > /tmp/issue179-evidence.txt <<'EOF'
          寫技能
          Python測試實務
          diagnosing-bugs
          tdd
          phase6-release-packaging
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/07_WHD技能發現與掃描深模組規則.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task 'T6 repair active canonical Skill runtime contracts; capability-aware fallback; canonical identities; broken local references; remote QA' \
            --changed-file '.agents/skills/engineering/research/SKILL.md' \
            --changed-file '.agents/skills/engineering/code-review/SKILL.md' \
            --changed-file '.agents/skills/engineering/wayfinder/SKILL.md' \
            --changed-file '.agents/skills/engineering/triage/SKILL.md' \
            --changed-file '.agents/skills/engineering/wizard/SKILL.md' \
            --changed-file '.agents/skills/engineering/tdd/SKILL.md' \
            --changed-file '.agents/skills/engineering/diagnosing-bugs/SKILL.md' \
            --changed-file '.agents/skills/productivity/handoff/SKILL.md' \
            --changed-file '.agents/skills/engineering/ask-matt/SKILL.md' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' \
            --changed-file 'tests/knowledge/test_active_skill_runtime_contract.py' \
            --changed-file '.github/workflows/issue179-t6-qa.yml' \
            --evidence /tmp/issue179-evidence.txt
      - name: Run T6 runtime contract
        run: python -m pytest -q tests/knowledge/test_active_skill_runtime_contract.py
      - name: Run Skill catalog scanner and classification regression
        shell: bash
        run: |
          python tools/skill_catalog.py > /tmp/skill-catalog.json
          python -m pytest -q tests/knowledge/test_skill_catalog_classification_contract.py
      - name: Run identity and existing Preflight regressions
        run: python -m pytest -q tests/test_chinese_skill_identity_contract.py tests/test_phase6_skill_preflight_gate.py
      - name: Verify protected invariants
        if: always()
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baseline.before /tmp/baseline.after
