name: "QA #392 T3 GREEN Settings service"

on:
  push:
    branches:
      - "refactor/issue392-phase4-t3-settings-service-20260920"
    paths:
      - "phase6_settings_service.py"
      - "phase6_settings_transaction_controller.py"
      - "fold_designer_bridge.py"
      - "gui_modules/application/command_router.py"
      - "tests/test_issue392_settings_service.py"
      - ".github/workflows/qa-issue392-t3-green.yml"

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=392"
          echo "PREDECESSOR=080385b15e82e0efb8ac13430e3fb999d5589de9"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor 080385b15e82e0efb8ac13430e3fb999d5589de9 HEAD

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest -r requirements.txt

      - name: Compile T3 sources
        run: |
          python -m py_compile             phase6_settings_service.py             phase6_settings_transaction_controller.py             fold_designer_bridge.py             gui_modules/application/command_router.py

      - name: T3 ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue392_settings_service.py --tb=short
          echo "ISSUE392_T3_CONTRACT_GREEN=1"

      - name: Settings focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue391_settings_transitions.py             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue366_t2a_settings_stage_controller.py             tests/test_issue366_t2b_structure_endcap_controller.py             tests/test_issue366_t2c_corner_external_controller.py             tests/test_issue366_t2d_family_width_controller.py             tests/test_phase6_t5_nested_settings_normalization.py             --tb=short
          echo "ISSUE392_T3_SETTINGS_REGRESSION_GREEN=1"

      - name: Task-scoped semantic A-B
        shell: bash
        run: |
          set -euo pipefail
          base=080385b15e82e0efb8ac13430e3fb999d5589de9
          candidate_root="$PWD"
          rm -rf /tmp/issue392-base
          git worktree add --detach /tmp/issue392-base "$base"
          (
            cd /tmp/issue392-base
            export PYTHONPATH="$PWD"
            cp "$candidate_root/tools/issue391_t2_semantic_probe.py" ./issue392_t3_semantic_probe.py
            python ./issue392_t3_semantic_probe.py > /tmp/issue392-baseline.json
          )
          PYTHONPATH="$candidate_root"             python tools/issue391_t2_semantic_probe.py             > /tmp/issue392-candidate.json
          python -m json.tool /tmp/issue392-baseline.json > /tmp/issue392-baseline.pretty
          python -m json.tool /tmp/issue392-candidate.json > /tmp/issue392-candidate.pretty
          diff -u /tmp/issue392-baseline.pretty /tmp/issue392-candidate.pretty
          echo "ISSUE392_T3_SEMANTIC_AB_DELTA=0"

      - name: Mirror/rebind and dependency gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          bridge = Path("fold_designer_bridge.py")
          source = bridge.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(bridge))
          assert "controller.bind_state(" not in source
          assert "_phase6_sync_settings_transaction_compatibility_mirrors" not in source
          mirrors = {
              "_phase6_assembly_type",
              "_phase6_last_external_revision",
              "_phase6_last_external_transaction_id",
              "_phase6_active_transaction_id",
          }
          writes=[]
          for n in ast.walk(tree):
              if (
                  isinstance(n, ast.Attribute)
                  and isinstance(n.ctx, (ast.Store, ast.Del))
                  and isinstance(n.value, ast.Name)
                  and n.value.id == "self"
                  and n.attr in mirrors
              ):
                  writes.append((n.attr, n.lineno))
          assert not writes, writes

          service = Path("phase6_settings_service.py")
          stree = ast.parse(service.read_text(encoding="utf-8"), filename=str(service))
          imports=set()
          for n in ast.walk(stree):
              if isinstance(n, ast.Import):
                  imports.update(a.name for a in n.names)
              elif isinstance(n, ast.ImportFrom) and n.module:
                  imports.add(n.module)
          bad=sorted(x for x in imports if x=="tkinter" or x.startswith("tkinter.") or x=="fold_designer_bridge" or x.startswith("gui"))
          assert not bad, bad
          print("ISSUE392_T3_BIND_STATE_CALLS=0")
          print("ISSUE392_T3_SCALAR_MIRROR_WRITES=0")
          print("ISSUE392_T3_REVERSE_IMPORTS=0")
          PY

      - name: Scope and protected drift
        shell: bash
        run: |
          set -euo pipefail
          base=080385b15e82e0efb8ac13430e3fb999d5589de9
          git diff --name-only "$base"...HEAD | sort | tee /tmp/issue392-changed
          python - <<'PY'
          from pathlib import Path
          changed=set(Path("/tmp/issue392-changed").read_text().splitlines())
          allowed={
            "phase6_settings_service.py",
            "phase6_settings_transaction_controller.py",
            "fold_designer_bridge.py",
            "gui_modules/application/command_router.py",
            "tests/test_issue392_settings_service.py",
            ".github/workflows/qa-issue392-t3-red.yml",
            ".github/workflows/qa-issue392-t3-green.yml",
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected, unexpected
          print("ISSUE392_T3_SCOPE_GREEN=1")
          PY
          protected=(
            phase6_settings_panel.py
            phase6_workspace_navigation_controller.py
            phase6_project_controller.py
            phase6_registry_diagnostics_controller.py
            phase6_corner_data_view_adapter.py
            phase6_manufacturing_cache.py
            phase6_manufacturing_contracts.py
            phase6_manufacturing_geometry.py
            phase6_manufacturing_service.py
            phase6_manufacturing_adapter.py
            config.ini
            ae_engine/cabinet_types/policy.py
            ae_engine/cabinet_types/receiving.py
            ae_engine/cabinet_types/vault.py
          )
          git diff --exit-code "$base"...HEAD -- "${protected[@]}"
          echo "ISSUE392_T3_PROTECTED_DRIFT=0"

  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest -r requirements.txt

      - name: Settings UI/runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_settings_panel_ownership.py             tests/test_phase6_settings_service.py             --tb=short
          echo "ISSUE392_T3_XVFB_GREEN=1"
