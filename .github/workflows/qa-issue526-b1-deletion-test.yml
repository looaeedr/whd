name: Issue 526 B1 Deletion Test

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue526-b1-deletion-test.yml

permissions:
  contents: read

jobs:
  deletion-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install characterization dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: DT-0 freeze Part Editor characterization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue526-evidence
          python - <<'PY'
          from __future__ import annotations
          import ast, json, re, subprocess
          from pathlib import Path

          root = Path('.')
          bridge_path = root / 'fold_designer_bridge.py'
          source = bridge_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = [
              '_fix11_activate_part',
              '_fix11_save_current_part',
              '_phase6_install_part_editor_compatibility',
          ]
          funcs = {
              n.name: n for n in tree.body
              if isinstance(n, ast.FunctionDef) and n.name in names
          }
          if set(funcs) != set(names):
              raise SystemExit(f'missing candidate symbol: {set(names)-set(funcs)}')

          tracked = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          files = [Path(x.decode('utf-8','surrogateescape')) for x in tracked if x]
          refs = {}
          for name in names:
              pat = re.compile(rf'\b{re.escape(name)}\b')
              rows = []
              for path in files:
                  if path.as_posix().startswith('docs/superpowers/checkpoints/issue526-'):
                      continue
                  try:
                      data = path.read_bytes()
                  except OSError:
                      continue
                  if b'\0' in data[:4096]:
                      continue
                  text = data.decode('utf-8','surrogateescape')
                  for lineno,line in enumerate(text.splitlines(),1):
                      if pat.search(line):
                          rows.append({'path':path.as_posix(),'line':lineno,'text':line.strip()[:240]})
              refs[name] = rows

          def self_inventory(fn):
              reads=set(); writes=set(); calls=set()
              for node in ast.walk(fn):
                  if isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name) and node.value.id=='self':
                      if isinstance(node.ctx, ast.Store):
                          writes.add(node.attr)
                      else:
                          reads.add(node.attr)
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if isinstance(node.func.value, ast.Name) and node.func.value.id=='self':
                          calls.add(node.func.attr)
              return sorted(reads), sorted(writes), sorted(calls)

          symbols={}
          for name,fn in funcs.items():
              reads,writes,calls=self_inventory(fn)
              body=ast.get_source_segment(source,fn) or ''
              symbols[name]={
                  'start_line':fn.lineno,
                  'end_line':fn.end_lineno,
                  'span':fn.end_lineno-fn.lineno+1,
                  'self_reads':reads,
                  'self_writes':writes,
                  'self_calls':calls,
                  'direct_reference_rows':refs[name],
                  'has_navigation_plan':'plan_activation' in body,
                  'has_navigation_begin':'begin_activation' in body,
                  'has_navigation_finish':'finish_activation' in body,
                  'has_settings_render':'_phase6_render_settings_context' in body,
                  'has_update_intent':'submit_update_intent' in body,
              }

          payload={
              'schema':'WHD_ISSUE526_B1_DT0_V1',
              'baseline_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'boundary_id':'B1_PART_EDITOR',
              'prior_decision':'C_KEEP_BRIDGE_COMPATIBILITY',
              'candidate_symbols':names,
              'symbols':symbols,
              'current_owner_dependencies':[
                  'Phase6WorkspaceNavigationController',
                  'Phase6DesignerWorkspace',
                  'Phase6FoldDesignerSettingsCoordinator',
                  'Phase6SettingsPanel',
                  'command_router update scheduler',
                  'Phase6BendingUI',
                  'FinalScene/render sink',
              ],
          }
          Path('/tmp/issue526-evidence/dt0.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print('DT0_BASELINE_HEAD='+payload['baseline_head'])
          for name in names:
              x=symbols[name]
              print(f"DT0_SYMBOL={name} SPAN={x['span']} SELF_READS={len(x['self_reads'])} SELF_WRITES={len(x['self_writes'])} SELF_CALLS={len(x['self_calls'])} REFS={len(x['direct_reference_rows'])}")
          print('ISSUE526_DT0=GREEN')
          PY

      - name: DT-2 build disposable K and E worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue526-k HEAD >/dev/null
          git worktree add --detach /tmp/issue526-e HEAD >/dev/null

          cat > /tmp/issue526-k/issue526_variant_k.py <<'PY'
          """Disposable K variant: expand hidden navigation responsibility back into caller."""
          from types import SimpleNamespace

          def activate_part_inline(app, key, *, initial=False, leaving_non_single_view=False):
              available = tuple(app.designer_workspace.available_parts)
              previous = app.designer_workspace.active_part
              requested = str(key or "")
              if requested not in available:
                  return False
              noop = requested == previous and not initial and not bool(leaving_non_single_view)
              save_outgoing = (not initial and previous is not None and not noop)
              plan = SimpleNamespace(
                  requested_key=requested,
                  resolved_key=requested,
                  previous_active=previous,
                  accepted=True,
                  save_outgoing=save_outgoing,
                  noop=noop,
              )
              if plan.noop:
                  return False
              if plan.save_outgoing:
                  app._save_current_part()
              app.designer_workspace.begin_switch(plan.resolved_key)
              try:
                  app.apply_part_editor_presentation(plan.resolved_key)
              finally:
                  app.designer_workspace.finish_switch()
              return True
          PY

          cat > /tmp/issue526-e/phase6_part_editor_coordinator_candidate.py <<'PY'
          """Disposable E candidate. Intentionally bounded; no Tk/manufacturing/bridge imports."""
          from __future__ import annotations
          from dataclasses import dataclass
          from typing import Callable, Any

          @dataclass(frozen=True)
          class ActivationRequest:
              key: str
              initial: bool
              leaving_non_single_view: bool

          @dataclass(frozen=True)
          class ActivationPorts:
              plan_activation: Callable[[str, bool, bool], Any]
              save_outgoing: Callable[[], None]
              begin_activation: Callable[[Any], None]
              apply_presentation: Callable[[Any], None]
              finish_activation: Callable[[], None]

          class Phase6PartEditorCoordinator:
              def execute(self, request: ActivationRequest, ports: ActivationPorts):
                  plan = ports.plan_activation(
                      request.key,
                      request.initial,
                      request.leaving_non_single_view,
                  )
                  if getattr(plan, 'noop', False) or not getattr(plan, 'accepted', False):
                      return plan
                  if getattr(plan, 'save_outgoing', False):
                      ports.save_outgoing()
                  ports.begin_activation(plan)
                  try:
                      ports.apply_presentation(plan)
                  finally:
                      ports.finish_activation()
                  return plan
          PY

          python - <<'PY'
          from pathlib import Path
          import ast, json
          k=Path('/tmp/issue526-k/issue526_variant_k.py').read_text(encoding='utf-8')
          e=Path('/tmp/issue526-e/phase6_part_editor_coordinator_candidate.py').read_text(encoding='utf-8')
          ast.parse(k); ast.parse(e)
          k_direct_mutators=[
              token for token in (
                  'designer_workspace.active_part',
                  'designer_workspace.begin_switch',
                  'designer_workspace.finish_switch',
              ) if token in k
          ]
          forbidden=[
              token for token in ('tkinter','fold_designer_bridge','phase6_manufacturing_geometry','phase6_manufacturing_service')
              if token in e
          ]
          payload={
              'variant_k':{
                  'artifact':'issue526_variant_k.py',
                  'full_app_dependency':True,
                  'direct_workspace_mutators':k_direct_mutators,
                  'owner_dependencies':['DesignerWorkspace','outgoing save','presentation effect'],
                  'observed_structural_regressions':[
                      'caller regains direct workspace begin/finish mutation',
                      'caller must know save-before-identity-switch ordering',
                      'caller owns presentation effect ordering',
                  ],
              },
              'variant_e':{
                  'artifact':'phase6_part_editor_coordinator_candidate.py',
                  'forbidden_imports':forbidden,
                  'full_app_dependency':False,
                  'port_count':5,
                  'opaque_presentation_callback':True,
                  'bridge_symbols_removed':[],
                  'duplicate_path_count':1,
                  'observed_structural_regressions':[
                      'old bridge implementation still required behind opaque presentation callback',
                      'candidate is a sequencing middle-man unless old body can be deleted',
                  ],
              },
          }
          Path('/tmp/issue526-evidence/dt2-structural.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          assert k_direct_mutators
          assert not forbidden
          print('VARIANT_K_DIRECT_WORKSPACE_MUTATION=1')
          print('VARIANT_E_FORBIDDEN_IMPORTS=0')
          print('VARIANT_E_OPAQUE_PRESENTATION_CALLBACK=1')
          print('VARIANT_E_OLD_BODY_REMOVED=0')
          print('ISSUE526_DT2=GREEN')
          PY

      - name: DT-4 baseline owner and behavior invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue365_t1_workspace_navigation_controller.py \
            tests/test_issue448_part_editor_owner_decision.py \
            tests/test_issue502_editor_settings_commit_seam.py \
            tests/test_phase6_designer_workspace.py \
            | tee /tmp/issue526-evidence/baseline-headless.log
          grep -E '[0-9]+ passed' /tmp/issue526-evidence/baseline-headless.log | tail -1

      - name: DT-4 exact Xvfb activation path
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_designer_workspace.py::test_real_designer_switch_saves_outgoing_before_workspace_changes_active_part \
            | tee /tmp/issue526-evidence/baseline-xvfb.log
          grep -E '[0-9]+ passed' /tmp/issue526-evidence/baseline-xvfb.log | tail -1

      - name: DT-4 disposable E coordinator behavior
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/issue526-e python - <<'PY' | tee /tmp/issue526-evidence/variant-e-unit.log
          from types import SimpleNamespace
          from phase6_part_editor_coordinator_candidate import (
              ActivationPorts, ActivationRequest, Phase6PartEditorCoordinator,
          )
          events=[]
          plan=SimpleNamespace(accepted=True,noop=False,save_outgoing=True,resolved_key='door')
          ports=ActivationPorts(
              plan_activation=lambda key,initial,leaving:(events.append(('plan',key,initial,leaving)) or plan),
              save_outgoing=lambda:events.append(('save',)),
              begin_activation=lambda p:events.append(('begin',p.resolved_key)),
              apply_presentation=lambda p:events.append(('presentation',p.resolved_key)),
              finish_activation=lambda:events.append(('finish',)),
          )
          Phase6PartEditorCoordinator().execute(
              ActivationRequest('door',False,False),ports
          )
          assert [x[0] for x in events] == ['plan','save','begin','presentation','finish']
          print('VARIANT_E_ORDERING_UNIT=GREEN')
          print('VARIANT_E_OLD_BODY_REMOVED=false')
          print('VARIANT_E_DUPLICATE_PATH_COUNT=1')
          PY

      - name: DT-3/5/6 decide B1 boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, subprocess
          from pathlib import Path

          dt0=json.loads(Path('/tmp/issue526-evidence/dt0.json').read_text(encoding='utf-8'))
          dt2=json.loads(Path('/tmp/issue526-evidence/dt2-structural.json').read_text(encoding='utf-8'))
          activate=dt0['symbols']['_fix11_activate_part']
          save=dt0['symbols']['_fix11_save_current_part']
          install=dt0['symbols']['_phase6_install_part_editor_compatibility']

          keep_signals=[
              'Variant K returns direct DesignerWorkspace mutation and save/presentation ordering to caller.',
              'Variant K requires full app dependency.',
              'Variant E with bounded ports can own ordering but cannot delete the old bridge body without an opaque presentation callback.',
              'Variant E therefore remains a sequencing middle-man: bridge_symbols_removed=0 and duplicate_path_count=1.',
              'Existing deep owners already own navigation state, Settings commit sequencing, scheduler, BendUI and workspace snapshots.',
          ]
          extract_signals=[]
          decision='B1_KEEP_COMPATIBILITY'

          payload={
              'schema':'WHD_ISSUE526_B1_DELETION_TEST_V1',
              'boundary_id':'B1_PART_EDITOR',
              'baseline_head':dt0['baseline_head'],
              'prior_decision':'C_KEEP_BRIDGE_COMPATIBILITY',
              'candidate_symbols':dt0['candidate_symbols'],
              'dt0':{
                  'direct_callers':{
                      k:v['direct_reference_rows'] for k,v in dt0['symbols'].items()
                  },
                  'state_reads':{
                      k:v['self_reads'] for k,v in dt0['symbols'].items()
                  },
                  'state_writes':{
                      k:v['self_writes'] for k,v in dt0['symbols'].items()
                  },
                  'current_owner_dependencies':dt0['current_owner_dependencies'],
                  'spans':{
                      '_fix11_activate_part':activate['span'],
                      '_fix11_save_current_part':save['span'],
                      '_phase6_install_part_editor_compatibility':install['span'],
                  },
              },
              'variant_keep':dt2['variant_k'],
              'variant_extract':{
                  **dt2['variant_e'],
                  'candidate_owner':'bounded Phase6PartEditorCoordinator candidate',
                  'reverse_import_count':0,
              },
              'dt3':{
                  'support_keep':keep_signals,
                  'support_extract':extract_signals,
              },
              'tests':{
                  'focused':'baseline headless suite GREEN; see baseline-headless.log',
                  'xvfb':'exact save-before-identity-switch operator path GREEN; see baseline-xvfb.log',
                  'variant_e_unit':'ordering unit GREEN; old body deletion criterion RED',
                  'combined_required':True,
              },
              'decision':decision,
              'supersedes':[],
              'rationale':'A bounded coordinator can reproduce only high-level ordering while the actual Tk/presentation/state-projection body remains in bridge. Deleting the coordinator returns complexity to the caller, but deleting the old bridge body requires either a full-app interface or an opaque callback that preserves the old path. That is middle-man extraction, not a deep owner. Existing deep owners remain the correct responsibility owners.',
              'production_change_required':False,
              'bridge_symbols_removed':[],
          }
          Path('/tmp/issue526-evidence/issue526-b1-deletion-test.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          md=[
              '# Issue 526 B1 Part Editor Deletion-Test',
              '',
              f"- baseline: \`{payload['baseline_head']}\`",
              f"- prior: \`{payload['prior_decision']}\`",
              f"- decision: **{decision}**",
              '',
              '## DT-3 KEEP signals',
              *[f"- {x}" for x in keep_signals],
              '',
              '## DT-4',
              '- baseline focused owner/invariant suite: GREEN',
              '- exact Xvfb save-before-identity-switch path: GREEN',
              '- disposable E ordering unit: GREEN',
              '- E old-body deletion criterion: RED (old body retained / duplicate path=1)',
              '',
              '## Decision',
              'Do not create phase6_part_editor_session.py and do not move the body into a full-app wrapper. Keep bridge compatibility for this boundary; continue Stage B to other boundaries where Deletion-Test may prove real extraction.',
          ]
          Path('/tmp/issue526-evidence/issue526-b1-deletion-test.md').write_text(
              '\n'.join(md)+'\n',encoding='utf-8'
          )
          print('B1_DECISION='+decision)
          print('B1_PRODUCTION_CHANGE_REQUIRED=false')
          print('B1_BRIDGE_SYMBOLS_REMOVED=0')
          print('ISSUE526_DT6=GREEN')
          PY

      - name: Upload B1 Deletion-Test evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue526-b1-deletion-test
          path: /tmp/issue526-evidence/
          if-no-files-found: error
          retention-days: 14
