name: Issue 472 T7 Combined Acceptance

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue472-t7.yml'
      - 'logs/preflight/issue472-t7-authority-read.txt'
      - 'ae_engine/receiving_joint_marking.py'
      - 'tests/test_issue471_t6_receiving_marking_activation.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  REMEDIATION_HEAD: 1c3e86ceb2953a638b96e3010c4fe4b5951697a9
  ACCEPTED_T6_HEAD: d5d66cf31f63911c1fe374d366b4275c5bdb3968

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact lineage and install collection dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ACCEPTED_T6_HEAD" "$GITHUB_SHA"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Re-enforce Phase6 knowledge preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue472
          python tools/phase6_skill_preflight.py             --task "T7 Combined Acceptance for Joint Placement MARKING with physical DXF, Save-Reload, broader Headless/Xvfb, protected invariants, durable AI Library writeback and X integration-readiness."             --changed-file .github/workflows/qa-issue472-t7.yml             --changed-file logs/preflight/issue472-t7-authority-read.txt             --changed-file ae_engine/receiving_joint_marking.py             --changed-file tests/test_issue471_t6_receiving_marking_activation.py             --evidence logs/preflight/issue472-t7-authority-read.txt
      - name: Prove Headless plus Xvfb covers full collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          def collect(expr=None):
              cmd=[sys.executable,'-m','pytest','--collect-only','-q','tests']
              if expr:
                  cmd += ['-m',expr]
              p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              if p.returncode:
                  raise SystemExit(p.stdout)
              return {x.strip() for x in p.stdout.splitlines() if x.startswith('tests/') and '::' in x}
          full=collect()
          headless=collect('not xvfb')
          xvfb=collect('xvfb')
          assert not (headless & xvfb), f'LANE_OVERLAP={len(headless & xvfb)}'
          assert headless | xvfb == full, {
              'missing': sorted(full-(headless|xvfb))[:20],
              'extra': sorted((headless|xvfb)-full)[:20],
          }
          print(f'FULL_COLLECTION={len(full)}')
          print(f'HEADLESS_COLLECTION={len(headless)}')
          print(f'XVFB_COLLECTION={len(xvfb)}')
          print('ISSUE472_COLLECTION_RECONCILIATION=GREEN')
          PY

  focused:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot protected files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue472/focused
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue472/focused/before.digest
      - name: Run focused physical-part DXF and Save-Reload acceptance
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_issue465_t0_physical_mating_region.py             tests/test_issue467_t1_legal_contact.py             tests/test_issue468_t2_contact_local_frame.py             tests/test_issue469_t3_joint_marking_policy.py             tests/test_issue470_t4_dormant_gate_a.py             tests/test_issue471_t6_receiving_marking_activation.py             tests/test_phase6_t16_receiving_placement.py             tests/test_dxf_acceptance.py             tests/test_receiving_door_dxf_roundtrip.py             tests/test_multipart_dxf_acceptance.py             tests/test_resolved_manufacturing_export.py             tests/test_resolved_manufacturing_geometry.py             tests/test_manufacturing_api_finished_face_contract.py             tests/test_issue41_persistence_parity.py             tests/test_issue45_dynamic_parts_2d_roundtrip.py             tests/test_phase6_project_controller.py             tests/test_phase6_project_file.py             tests/test_phase6_project_ownership.py             tests/test_phase6_project_session.py             2>&1 | tee .scratch/issue472/focused/pytest.log
      - name: Verify focused protected invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue472/focused/after.digest
          cmp .scratch/issue472/focused/before.digest .scratch/issue472/focused/after.digest
          git diff --exit-code

  headless:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Headless dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot Headless protected files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue472/headless
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue472/headless/before.digest
      - name: Run broader Headless
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short -m 'not xvfb' tests             2>&1 | tee .scratch/issue472/headless/pytest.log
      - name: Verify Headless protected invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue472/headless/after.digest
          cmp .scratch/issue472/headless/before.digest .scratch/issue472/headless/after.digest
          git diff --exit-code

  xvfb:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot Xvfb protected files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue472/xvfb
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue472/xvfb/before.digest
      - name: Run broader Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short -m 'xvfb' tests             2>&1 | tee .scratch/issue472/xvfb/pytest.log
      - name: Verify Xvfb protected invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'             > .scratch/issue472/xvfb/after.digest
          cmp .scratch/issue472/xvfb/before.digest .scratch/issue472/xvfb/after.digest
          git diff --exit-code
