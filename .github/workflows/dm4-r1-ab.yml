name: DM4 R1 Parent Current Classification
on:
  push:
    branches: [work/dm4-divider-resolved-sinks]
    paths:
      - .github/workflows/dm4-r1-ab.yml
  workflow_dispatch:
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Compare exact R1 on trusted parent and current head
        run: |
          set +e
          nodeid='tests/test_issue48_receiving_fw_flush_red.py::test_r1_exact_3d_user_path_auto_builds_three_receiving_box_body_input_sections'

          cur_before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q "$nodeid"
          cur_rc=$?
          cur_after="$(sha256sum config.ini | awk '{print $1}')"
          git checkout -- config.ini

          git worktree add --detach /tmp/dm4-parent 6da176c316523042a73e41883e532b7fb52a3123
          cd /tmp/dm4-parent
          parent_before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q "$nodeid"
          parent_rc=$?
          parent_after="$(sha256sum config.ini | awk '{print $1}')"

          echo "CURRENT_RC=$cur_rc"
          echo "PARENT_RC=$parent_rc"
          echo "CURRENT_CONFIG=$cur_before/$cur_after"
          echo "PARENT_CONFIG=$parent_before/$parent_after"

          if [ "$parent_rc" -ne 0 ] && [ "$cur_rc" -ne 0 ]; then
            echo "CLASSIFICATION=PREEXISTING_OR_HARNESS"
            exit 0
          fi
          if [ "$parent_rc" -eq 0 ] && [ "$cur_rc" -ne 0 ]; then
            echo "CLASSIFICATION=DM4_REGRESSION"
            exit 1
          fi
          if [ "$parent_rc" -ne 0 ] && [ "$cur_rc" -eq 0 ]; then
            echo "CLASSIFICATION=DM4_IMPROVEMENT"
            exit 0
          fi
          echo "CLASSIFICATION=BOTH_GREEN"
