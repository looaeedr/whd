name: Issue 485 T7 Post Integration Smoke

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue485-t7-post-integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_SHA: 81dff9d9f33b489d2f9acaca01645a9b7b4babec

jobs:
  exact-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detach to exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCTION_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SHA"
          echo "ISSUE485_EXACT_PRODUCTION_SHA=$PRODUCTION_SHA"
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Snapshot protected config and DXF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue485/protected
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > .scratch/issue485/protected/before.sha256
      - name: Run focused Phase4 post-integration smoke
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_issue483_t5_bridge_dead_glue_cleanup.py             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py             tests/test_issue396_phase4_composition_root.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_phase6_settings_center_bridge.py             tests/test_phase6_designer_workspace.py             tests/test_fold_designer_joint_state.py             tests/test_issue41_persistence_parity.py             tests/test_resolved_manufacturing_bridge.py             tests/test_dxf_acceptance.py             tests/test_multipart_dxf_acceptance.py
      - name: Verify Phase4 architecture gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SHA"
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('.')
          bridge = root / 'fold_designer_bridge.py'
          tree = ast.parse(bridge.read_text(encoding='utf-8'))
          funcs = {n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          deleted = {
              '_phase6_on_setting_var_changed',
              '_phase6_corner_targets',
              '_phase6_on_endcap_fw_follow_selected',
              '_phase6_bind_translated_var',
              '_phase6_scene_from_structural_result',
              '_phase6_profile_material_total',
          }
          assert funcs.isdisjoint(deleted), sorted(funcs & deleted)
          for keep in (
              '_phase6_rebuild_linked_endcaps',
              '_phase6_settings_box_structure_projection',
              '_phase6_settings_endcap_fw_projection',
              '_phase6_settings_bottom_wrap_projection',
              '_phase6_settings_corner_projection',
              '_phase6_settings_context_extension_projection',
              '_phase6_sync_settings_panel_extension',
              '_fix11_init',
          ):
              assert keep in funcs, keep
          assert not Path('phase6_workspace_shell.py').exists()
          assert not Path('phase6_part_editor_session.py').exists()
          print('ISSUE485_POST_INTEGRATION_ARCHITECTURE_GREEN')
          PY
      - name: Verify protected invariants unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SHA"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > .scratch/issue485/protected/after.sha256
          cmp .scratch/issue485/protected/before.sha256 .scratch/issue485/protected/after.sha256
          git diff --exit-code
          echo "ISSUE485_POST_INTEGRATION_PROTECTED_GREEN"
