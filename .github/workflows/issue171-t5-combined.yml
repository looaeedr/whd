name: Issue 171 DM7 Final Combined

on:
  push:
    branches:
      - refactor/dm7-t5-combined-integration-20260913

permissions:
  contents: read

jobs:
  dm7-final-combined:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Capture protected invariants
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          def file_sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def tree_sha(root):
              root=Path(root); h=hashlib.sha256()
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix().encode(); data=p.read_bytes()
                  h.update(len(rel).to_bytes(4,'big')); h.update(rel)
                  h.update(len(data).to_bytes(8,'big')); h.update(data)
              return h.hexdigest()
          text=f"config.ini {file_sha('config.ini')}\n基準檔 {tree_sha('基準檔')}\n"
          Path('/tmp/dm7-before').write_text(text,encoding='utf-8'); print(text)
      - name: Durable writeback and governance guards
        run: >-
          python -m pytest -q
          tests/test_dm7_durable_writeback.py
          tests/test_dispatching_skill_timeout_contract.py
          tests/test_issue164_durable_contract.py
      - name: Headless DM7 navigation persistence manufacturing DXF
        run: >-
          python -m pytest -q
          tests/test_dm7_part_navigation.py
          tests/test_dm7_navigation_callers.py
          tests/test_dm7_topology_persistence.py
          tests/test_issue41_persistence_parity.py
          tests/test_issue45_dynamic_parts_2d_roundtrip.py
          tests/test_phase6_project_controller.py
          tests/test_phase6_project_file.py
          tests/test_phase6_project_ownership.py
          tests/test_phase6_project_session.py
          tests/test_dxf_acceptance.py
          tests/test_multipart_dxf_acceptance.py
          tests/test_resolved_manufacturing_export.py
          tests/test_resolved_manufacturing_geometry.py
          tests/test_manufacturing_api_finished_face_contract.py
      - name: Xvfb navigation and historical regressions
        run: >-
          xvfb-run -a python -m pytest -q
          tests/test_issue119_corner_data_transition_ui.py
          tests/test_issue96_corner_data_selection_lifecycle.py
          tests/test_issue97_authoritative_unfold_view_adapter.py
          tests/test_issue163_unfold_workspace_layout.py
      - name: Source ownership and forbidden fallback scan
        shell: python
        run: |
          import inspect, os, sys
          sys.path.insert(0, os.getcwd())
          import phase6_part_navigation as nav
          import fold_designer_bridge as bridge
          n=inspect.getsource(nav)
          assert 'children[0]' not in n
          assert 'PART_LABELS' not in n and 'KNOWN_PARTS' not in n
          assert '_dm7_project_hierarchy' in inspect.getsource(bridge._phase6_structure_tree_rows)
          c=inspect.getsource(bridge._phase6_select_corner_data_part)
          assert '_phase6_resolve_operator_part_key' in c and '.activate_part(' not in c
          t=inspect.getsource(bridge._phase6_on_box_body_piece_tab_changed)
          assert '_phase6_activate_operator_part' in t and 'self.activate_part(' not in t
          print('DM7_SOURCE_OWNERSHIP=PASS')
      - name: Verify protected invariants and no scratch in durable tree
        shell: python
        run: |
          import hashlib, subprocess
          from pathlib import Path
          def file_sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def tree_sha(root):
              root=Path(root); h=hashlib.sha256()
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix().encode(); data=p.read_bytes()
                  h.update(len(rel).to_bytes(4,'big')); h.update(rel)
                  h.update(len(data).to_bytes(8,'big')); h.update(data)
              return h.hexdigest()
          after=f"config.ini {file_sha('config.ini')}\n基準檔 {tree_sha('基準檔')}\n"
          before=Path('/tmp/dm7-before').read_text(encoding='utf-8')
          print('BEFORE\n'+before+'AFTER\n'+after)
          assert before == after
          subprocess.run(['git','diff','--exit-code','--','config.ini','基準檔'],check=True)
          tracked=subprocess.check_output(['git','ls-files','.scratch'],text=True).strip()
          assert tracked == '', tracked
          print('DM7_FINAL_INVARIANTS=PASS')
