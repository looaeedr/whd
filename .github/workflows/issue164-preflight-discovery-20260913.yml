name: Issue164 preflight discovery
on:
  push:
    branches:
      - qa/issue164-combined-acceptance-20260913
    paths:
      - .github/workflows/issue164-preflight-discovery-20260913.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover required skills and references
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#164 Combined Acceptance and durable writeback for Receiving aggregate/physical-child routing, unfold presentation, workspace layout, Corner Data lifecycle, 2D/3D/DXF persistence parity, exact config/baseline invariants, temporary QA cleanup, latest-target drift audit, and human integration gate; validation must never feed manufacturing geometry"
