name: "QA #386 T3 default collapsed GREEN"

on:
  push:
    branches:
      - ui/issue386-default-assembly-collapsed-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue386_default_assembly_collapsed.py'
      - 'tests/test_issue376_assembly_collapsible_data.py'
      - 'tests/test_issue385_assembly_parent_child_groups.py'
      - '.github/workflows/qa-issue386-t3-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD bc8462c918faed80f38b4e62b78f7e2c4f42bdbf)" = "bc8462c918faed80f38b4e62b78f7e2c4f42bdbf"
      - name: Install GUI harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Capture invariants
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/base.before
      - name: T3 focused
        run: xvfb-run -a python -m pytest -q tests/test_issue386_default_assembly_collapsed.py --tb=short
      - name: Updated collapsible and parent-group regressions
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue376_assembly_collapsible_data.py             tests/test_issue385_assembly_parent_child_groups.py             --tb=short
      - name: Navigation and visibility regressions
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue375_main_selector_navigation.py             tests/test_issue378_assembly_mousewheel.py             tests/test_issue124_structure_tree.py::test_structure_tree_visibility_delegates_existing_view_state_without_deleting_part             --tb=short
      - name: Protected invariants and scope
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/base.after
          cmp /tmp/config.before /tmp/config.after
          cmp /tmp/base.before /tmp/base.after
          git diff --check bc8462c918faed80f38b4e62b78f7e2c4f42bdbf...HEAD
          git diff --name-only bc8462c918faed80f38b4e62b78f7e2c4f42bdbf...HEAD | tee /tmp/issue386-files.txt
          test "$(grep -Ec '^(config.ini$|基準檔/|ae_engine/|phase6_part_navigation.py$|gui_modules/application/)' /tmp/issue386-files.txt || true)" -eq 0
          echo "PASS PROTECTED_DRIFT=0"
