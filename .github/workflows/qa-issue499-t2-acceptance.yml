name: "QA #499 T2 acceptance"

on:
  push:
    branches:
      - work/issue506-phase5-settings-dataflow-20260922
    paths:
      - '.github/workflows/qa-issue499-t2-acceptance.yml'

permissions:
  contents: read

jobs:
  t2-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout accepted T1 baseline
        uses: actions/checkout@v4
        with:
          ref: 87e5c47e3fcb68729d1d266e85cec85bd45ae4ff
          path: baseline

      - name: Install focused harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest

      - name: Candidate T2 contract GREEN
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue499_settings_apply_coordinator.py --tb=short

      - name: Legacy focused A/B classifier
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import sys

          tests = [
              "tests/test_issue498_settings_application_coordinator.py",
              "tests/test_issue366_t2_settings_transaction_owner.py",
              "tests/test_issue366_t2a_settings_stage_controller.py",
              "tests/test_issue390_settings_contracts.py",
              "tests/test_issue391_settings_transitions.py",
              "tests/test_issue392_settings_service.py",
              "tests/test_phase6_settings_service.py",
              "tests/test_phase6_left_global_transaction.py",
              "tests/test_gui_fold_designer_transaction_contract.py",
              "tests/test_issue445_settings_presentation_owner.py",
              "tests/test_phase6_settings_panel_ownership.py",
          ]
          candidate_only = []
          rows = []
          for test in tests:
              b = subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", test, "--tb=short"],
                  cwd="baseline",
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.STDOUT,
              ).returncode
              c = subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", test, "--tb=short"],
                  cwd="candidate",
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.STDOUT,
              ).returncode
              rows.append((test, b, c))
              if c != 0 and b == 0:
                  candidate_only.append(test)

          for test, b, c in rows:
              print(f"{test}: baseline_rc={b} candidate_rc={c}")
          print(f"CANDIDATE_ONLY_FAILURE_FILES={candidate_only}")
          assert candidate_only == [], candidate_only
          PY

      - name: Architecture ratchet
        working-directory: candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          bridge_path = Path("fold_designer_bridge.py")
          bridge = bridge_path.read_text(encoding="utf-8")
          tree = ast.parse(bridge)

          fn = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "_phase6_apply_setting_updates"
          )
          source = ast.get_source_segment(bridge, fn) or ""
          forbidden = (
              "normalize_updates",
              "commit_reconciled_width_structure",
              "restore_setting",
              "commit_settings",
              "_save_current_part",
              "_phase6_refresh_profiles_from_settings",
              "after_cancel",
              "do_update",
              "_settings_change_callback",
              "_phase6_settings_guard",
          )
          remaining = [token for token in forbidden if token in source]
          assert remaining == [], remaining
          assert "_phase6_settings_coordinator" in source
          assert ".apply_updates(" in source

          facade_calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "install_fold_designer_bridge_facade"
          ]
          assert len(facade_calls) == 1, len(facade_calls)
          mapping = facade_calls[0].args[1]
          assert isinstance(mapping, ast.Dict)
          facade_count = len(mapping.keys)
          assert facade_count <= 69, facade_count

          coordinator = Path(
              "gui_modules/application/fold_designer_settings_coordinator.py"
          ).read_text(encoding="utf-8")
          ctree = ast.parse(coordinator)
          imports = set()
          for node in ast.walk(ctree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          forbidden_imports = {
              name for name in imports
              if name == "fold_designer_bridge"
              or name == "tkinter"
              or name.startswith("tkinter.")
              or "manufacturing" in name
          }
          assert forbidden_imports == set(), forbidden_imports
          print(f"FACADE_BINDING_COUNT={facade_count}")
          print("ISSUE499_T2_ARCH_GREEN=1")
          PY
