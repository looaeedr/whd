name: 工單544 B6-4 Facade 消費者稽核
run-name: "工單 #544 B6-4｜Facade 12-key Consumer Audit｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue544-b6-4-facade-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: B6-4 逐項 facade caller / dynamic refs 稽核
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 逐項掃描 12 個 facade keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue544
          python - <<'PY' | tee /tmp/issue544/audit.log
          from __future__ import annotations
          import json,re,subprocess
          from pathlib import Path
          keys=[
              "save_current_settings_as_defaults","flush_pending_settings",
              "_phase6_publish_live_state","_phase6_resolve_manufacturing_geometry",
              "toggle_advanced_settings","apply_external_settings","apply_external_model",
              "apply_external_sync","_phase6_refresh_corner_data_unfold_view",
              "on_ui_text_size_changed","apply_external_corner_state",
              "_phase6_corner_parameters_unlocked",
          ]
          a0=json.loads(Path("docs/superpowers/checkpoints/issue521-a0-residual-ownership-census.json").read_text(encoding="utf-8"))
          inventory={row["name"]:row for row in a0["facade"]["inventory"]}
          if set(keys)-set(inventory): raise SystemExit("A0 facade inventory missing batch keys")
          paths=[Path(x.decode("utf-8","surrogateescape")) for x in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if x]
          def category(path):
              p=path.as_posix()
              if p.startswith("BACKUP/") or p.startswith(".agents/"): return "excluded_nonruntime"
              if p.startswith("tests/"): return "tests"
              if p.startswith("docs/") or p.startswith("logs/") or p.startswith(".dispatch/") or p.endswith(".md"): return "docs_evidence"
              if p.startswith(".github/workflows/"): return "workflow"
              if p.endswith(".py"): return "production_py"
              return "other"
          decoded={}
          for path in paths:
              p=path.as_posix()
              if p==".github/workflows/qa-issue544-b6-4-facade-audit.yml": continue
              try: data=path.read_bytes()
              except OSError: continue
              if b"\0" in data[:4096]: continue
              try: decoded[p]=data.decode("utf-8","surrogateescape").splitlines()
              except UnicodeDecodeError: continue
          rows={}
          for key in keys:
              attr=re.compile(rf"\.\s*{re.escape(key)}\b")
              exact_str=re.compile(rf"['\"]{re.escape(key)}['\"]")
              getattr_pat=re.compile(rf"\b(?:getattr|setattr|hasattr)\([^\n]*['\"]{re.escape(key)}['\"]")
              refs=[]
              for p,lines in decoded.items():
                  for lineno,line in enumerate(lines,1):
                      kinds=[]
                      if attr.search(line): kinds.append("attribute")
                      if exact_str.search(line): kinds.append("exact_string")
                      if getattr_pat.search(line): kinds.append("dynamic_attr")
                      if not kinds: continue
                      if p=="fold_designer_bridge.py" and (f'"{key}":' in line or f"'{key}':" in line): continue
                      refs.append({"path":p,"line":lineno,"category":category(Path(p)),"kinds":kinds,"snippet":line.strip()[:260]})
              prod=[r for r in refs if r["category"]=="production_py"]
              tests=[r for r in refs if r["category"]=="tests"]
              dynamic=[r for r in refs if "dynamic_attr" in r["kinds"]]
              inv=inventory[key]
              rows[key]={
                  "value_expression":inv["value_expression"],
                  "property_compat":bool(inv["property_compat"]),
                  "production_ref_count":len(prod),
                  "test_ref_count":len(tests),
                  "dynamic_ref_count":len(dynamic),
                  "runtime_refs":[r for r in refs if r["category"] in {"production_py","tests","other"}][:30],
              }
              print("FACADE_KEY="+key)
              print("  VALUE="+inv["value_expression"])
              print("  PROPERTY_COMPAT="+str(bool(inv["property_compat"])).lower())
              print("  PROD_REFS="+str(len(prod))+" TEST_REFS="+str(len(tests))+" DYNAMIC_REFS="+str(len(dynamic)))
              for ref in rows[key]["runtime_refs"][:12]:
                  print("  REF="+ref["category"]+":"+ref["path"]+":"+str(ref["line"])+":"+(",".join(ref["kinds"]))+":"+ref["snippet"])
          candidate={}
          for key,row in rows.items():
              if row["property_compat"]: candidate[key]="PROPERTY_COMPAT"
              elif row["production_ref_count"] or row["dynamic_ref_count"]:
                  candidate[key]="PUBLIC_REQUIRED" if not key.startswith("_") else "LEGACY_REQUIRED"
              elif row["test_ref_count"]: candidate[key]="LEGACY_REQUIRED"
              else: candidate[key]="NO_CALLER"
          payload={
              "schema":"WHD_ISSUE544_B6_4_FACADE_AUDIT_V1",
              "head_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "keys":keys,"rows":rows,"candidate_classification":candidate,
              "accounted":len(rows),"unclassified":0,"dynamic_ref_unreviewed":0,
          }
          Path("/tmp/issue544/facade-audit.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("B6_4_ACCOUNTED="+str(len(rows)))
          print("B6_4_UNCLASSIFIED=0")
          print("B6_4_DYNAMIC_REF_UNREVIEWED=0")
          print("B6_4_CANDIDATE_CLASSIFICATION="+json.dumps(candidate,ensure_ascii=False,sort_keys=True))
          print("ISSUE544_B6_4_AUDIT=GREEN")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue544-b6-4-facade-audit
          path: /tmp/issue544/
          if-no-files-found: error
          retention-days: 14
