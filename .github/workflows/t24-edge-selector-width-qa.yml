name: T24 Edge Selector Width QA

on:
  push:
    branches:
      - work/20260906-t6-edge-selector-width
    paths:
      - fold_designer_bridge.py
      - tests/test_phase6_t24_edge_selector_width.py

permissions:
  contents: read

jobs:
  t24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Run T24 focused QA
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t24_edge_selector_width.py \
            tests/test_phase6_t08_ui_text_and_edge_selectors.py \
            tests/test_phase6_t23_bottom_edge_visibility.py \
            2>&1 | tee t24.log
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t24-edge-selector-width-log
          path: t24.log
