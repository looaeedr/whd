name: Issue227 T1 Completion Audit

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue227-t1-completion-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify T0 plus T1 behavior
        run: |
          python -m py_compile tools/knowledge_governance.py
          python -m pytest \
            tests/knowledge/test_knowledge_governance_bootstrap.py \
            tests/knowledge/test_knowledge_authority_classification.py -q
      - name: Verify matrix acceptance invariants
        shell: bash
        run: |
          python tools/knowledge_governance.py classify \
            --root . \
            --inventory docs/superpowers/verification/knowledge_governance_inventory_v1.json \
            --output /tmp/rebuilt-matrix.json
          cmp docs/superpowers/verification/knowledge_authority_classification_v1.json /tmp/rebuilt-matrix.json
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          p = Path('docs/superpowers/verification/knowledge_authority_classification_v1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema'] == 'WHD_KNOWLEDGE_CLASSIFICATION_V1'
          valid = {'CURRENT','REFERENCE','MIRROR','HISTORICAL','UNRESOLVED'}
          assert all(row['target_role'] in valid for row in data['rows'])
          assert all(row.get('blocker') for row in data['rows'] if row['target_role'] == 'UNRESOLVED')
          active = [row for row in data['contracts'] if row.get('current_candidates')]
          missing = [row['contract'] for row in active if not row.get('proposed_current_owner')]
          assert not missing, f'active contracts without proposed CURRENT owner: {missing}'
          assert all(conflict.get('paths') for conflict in data['conflicts'])
          print('T1_ROWS', len(data['rows']))
          print('T1_ACTIVE_CONTRACTS', len(active))
          print('T1_CONFLICT_COUNTS', dict(sorted(collections.Counter(c['code'] for c in data['conflicts']).items())))
          print('T1_UNRESOLVED', sum(row['target_role'] == 'UNRESOLVED' for row in data['rows']))
          PY
      - name: Inspect structured authority comment locations
        shell: bash
        run: |
          echo 'AUTHORITY_ROW_FILES_BEGIN'
          grep -RIl --include='*.md' 'WHD_AUTHORITY_ROW' . --exclude-dir=.git | sort || true
          echo 'AUTHORITY_ROW_FILES_END'
