name: DM6 T3 RED

on:
  push:
    branches:
      - work/dm6-t3-sink-semantic-parity
    paths:
      - .github/workflows/dm6-t3-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_dm6_sink_semantic_parity.py
