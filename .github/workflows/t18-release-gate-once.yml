name: T18 integrated release gate once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t18_release_gate_trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release-gate dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt

      - name: T18 knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py             --task "T18 release gate remote QA GitHub Actions"             --changed-file .github/workflows/t18-release-gate-once.yml             --evidence logs/preflight/20260906_t18_release_gate_evidence.md

      - name: Record accepted execution tree and config
        run: |
          mkdir -p t18_artifacts
          git rev-parse HEAD | tee t18_artifacts/head_sha.txt
          sha256sum config.ini | tee t18_artifacts/config_before.txt
          test "$(sha256sum config.ini | awk '{print $1}')" = "980eab68d4a1732a5313b22329852dfc9691c83e4e2a64cccd18022afae4ee67"
          python - <<'PY' | tee t18_artifacts/tree_before.txt
          import hashlib, subprocess
          from pathlib import Path
          paths = [p.decode("utf-8") for p in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if p]
          h = hashlib.sha256()
          for rel in paths:
              p = Path(rel)
              h.update(rel.encode("utf-8") + b"\0")
              if p.is_file():
                  h.update(hashlib.sha256(p.read_bytes()).digest())
              else:
                  h.update(b"MISSING")
          print(h.hexdigest())
          PY
          git status --porcelain --untracked-files=no | tee t18_artifacts/tracked_status_before.txt
          test ! -s t18_artifacts/tracked_status_before.txt

      - name: Full durable Headless gate
        shell: bash
        run: |
          set -u
          mkdir -p t18_artifacts
          first=1
          iter=0
          while true; do
            iter=$((iter+1))
            if [ "$iter" -gt 120 ]; then
              echo "Headless durable loop exceeded 120 iterations"
              exit 70
            fi
            args=(
              tools/phase6_release_test_runner.py
              --mode headless
              --journal t18_artifacts/headless.jsonl
              --state t18_artifacts/headless.state.json
              --batch-size 12
              --batch-timeout 25
              --budget-seconds 70
            )
            if [ "$first" -eq 1 ]; then
              args+=(--reset)
              first=0
            fi
            args+=(tests)
            set +e
            python "${args[@]}"
            rc=$?
            set -e
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("t18_artifacts/headless.state.json")
          print("T18_HEADLESS_STATE", p.read_text(encoding="utf-8") if p.exists() else "MISSING")
          PY
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$rc" -eq 75 ]; then
              echo "T18_HEADLESS_CHECKPOINT continue"
              continue
            fi
            echo "T18_HEADLESS_BLOCKED rc=$rc"
            exit "$rc"
          done

      - name: Full durable Xvfb gate
        shell: bash
        run: |
          set -u
          mkdir -p t18_artifacts
          first=1
          iter=0
          while true; do
            iter=$((iter+1))
            if [ "$iter" -gt 120 ]; then
              echo "Xvfb durable loop exceeded 120 iterations"
              exit 70
            fi
            args=(
              tools/phase6_release_test_runner.py
              --mode xvfb
              --journal t18_artifacts/xvfb.jsonl
              --state t18_artifacts/xvfb.state.json
              --batch-size 12
              --batch-timeout 25
              --budget-seconds 70
            )
            if [ "$first" -eq 1 ]; then
              args+=(--reset)
              first=0
            fi
            args+=(tests)
            set +e
            python "${args[@]}"
            rc=$?
            set -e
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("t18_artifacts/xvfb.state.json")
          print("T18_XVFB_STATE", p.read_text(encoding="utf-8") if p.exists() else "MISSING")
          PY
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$rc" -eq 75 ]; then
              echo "T18_XVFB_CHECKPOINT continue"
              continue
            fi
            echo "T18_XVFB_BLOCKED rc=$rc"
            exit "$rc"
          done

      - name: Verify durable closure and collection fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def records(path):
              return [json.loads(line) for line in Path(path).read_text(encoding="utf-8").splitlines() if line.strip()]

          def inspect(mode):
              rs = records(f"t18_artifacts/{mode}.jsonl")
              coll = next(r for r in rs if r.get("kind") == "collection")
              completed = set()
              failed_or_timeout = set()
              complete_teardown = 0
              passed = skipped = xfailed = xpassed = 0
              for r in rs:
                  st = r.get("status")
                  ids = {str(x) for x in r.get("nodeids", [])}
                  summary = r.get("summary") or {}
                  if st in {"complete", "complete_teardown_timeout"}:
                      completed |= ids
                      passed += int(summary.get("passed", 0) or 0)
                      skipped += int(summary.get("skipped", 0) or 0)
                      xfailed += int(summary.get("xfailed", 0) or 0)
                      xpassed += int(summary.get("xpassed", 0) or 0)
                  if st == "complete_teardown_timeout":
                      complete_teardown += 1
                  if st in {"failed", "timeout"}:
                      failed_or_timeout |= ids
              unresolved = sorted(failed_or_timeout - completed)
              state = json.loads(Path(f"t18_artifacts/{mode}.state.json").read_text(encoding="utf-8"))
              assert int(state["pending_nodeids"]) == 0, (mode, state)
              assert not unresolved, (mode, unresolved[:20])
              assert int(state["completed_nodeids"]) == int(state["total_nodeids"]), (mode, state)
              print(
                  f"T18_{mode.upper()}_SUMMARY "
                  f"collection={coll['count']} sha={coll['sha256']} "
                  f"completed={state['completed_nodeids']} pending={state['pending_nodeids']} "
                  f"passed={passed} skipped={skipped} xfailed={xfailed} xpassed={xpassed} "
                  f"unresolved_failed_timeout={len(unresolved)} "
                  f"complete_teardown_timeout_batches={complete_teardown}"
              )
              return coll

          h = inspect("headless")
          x = inspect("xvfb")
          assert h["count"] == x["count"], (h, x)
          assert h["sha256"] == x["sha256"], (h, x)
          print("T18_COLLECTION_FINGERPRINT_MATCH", h["count"], h["sha256"])
          PY

      - name: Verify execution tree and config unchanged
        run: |
          sha256sum config.ini | tee t18_artifacts/config_after.txt
          diff -u t18_artifacts/config_before.txt t18_artifacts/config_after.txt
          test "$(sha256sum config.ini | awk '{print $1}')" = "980eab68d4a1732a5313b22329852dfc9691c83e4e2a64cccd18022afae4ee67"
          python - <<'PY' | tee t18_artifacts/tree_after.txt
          import hashlib, subprocess
          from pathlib import Path
          paths = [p.decode("utf-8") for p in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if p]
          h = hashlib.sha256()
          for rel in paths:
              p = Path(rel)
              h.update(rel.encode("utf-8") + b"\0")
              if p.is_file():
                  h.update(hashlib.sha256(p.read_bytes()).digest())
              else:
                  h.update(b"MISSING")
          print(h.hexdigest())
          PY
          diff -u t18_artifacts/tree_before.txt t18_artifacts/tree_after.txt
          git status --porcelain --untracked-files=no | tee t18_artifacts/tracked_status_after.txt
          test ! -s t18_artifacts/tracked_status_after.txt

      - name: Publish resumable status to T18 issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > t18_issue_summary.md
          import json
          from pathlib import Path
          import os

          def state(name):
              p = Path(f"t18_artifacts/{name}.state.json")
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return {"error": "unreadable"}

          h = state("headless")
          x = state("xvfb")
          print("[Remote QA durable status]")
          print()
          print(f"- run_id: {os.environ.get('GITHUB_RUN_ID')}")
          print(f"- head_sha: {os.environ.get('GITHUB_SHA')}")
          for name, value in (("headless", h), ("xvfb", x)):
              if value is None:
                  print(f"- {name}: state missing")
              else:
                  print(
                      f"- {name}: completed={value.get('completed_nodeids')} "
                      f"pending={value.get('pending_nodeids')} "
                      f"failed_batches={value.get('failed_batches')} "
                      f"last_status={value.get('last_status')}"
                  )
          print()
          print("Durable artifact: t18-durable-release-gate")
          print("若聊天 Runtime 被切斷，下一個 Runtime 從此 run_id/head_sha + artifact 接續，不重 trigger。")
          PY
          gh issue comment 18 --repo "${GITHUB_REPOSITORY}" --body-file t18_issue_summary.md || true

      - name: Upload T18 durable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t18-durable-release-gate
          path: t18_artifacts
          if-no-files-found: error
