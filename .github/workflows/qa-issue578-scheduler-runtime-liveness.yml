name: WHD｜#578｜排程 runtime liveness 驗收
run-name: WHD｜#578｜排程 runtime liveness｜${{ github.sha }}

on:
  push:
    branches:
      - governance/issue578-scheduler-runtime-liveness-20260924
    paths:
      - "tools/stale_claim_takeover.py"
      - "tools/execution_claim_guard.py"
      - "tests/process/test_issue578_scheduler_runtime_liveness.py"
      - "tests/process/test_issue573_sibling_scheduler_takeover.py"
      - "tests/process/test_issue581_interactive_stale_takeover.py"
      - ".agents/skills/engineering/派工/SKILL.md"
      - ".agents/skills/engineering/remote-execution-guard/SKILL.md"
      - ".agents/skills/engineering/executable-continuity-controller/SKILL.md"
      - "個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md"
      - ".github/workflows/qa-issue578-scheduler-runtime-liveness.yml"

permissions:
  contents: read

jobs:
  focused:
    name: "#578 heartbeat／orphan 接管 focused pytest"
    runs-on: ubuntu-latest
    steps:
      - name: "取出 #578 work branch"
        uses: actions/checkout@v4
      - name: "設定 Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "安裝 pytest"
        run: python -m pip install pytest
      - name: "檢查 Actions 繁中顯示名稱"
        run: python tools/actions_visible_naming_guard.py .github/workflows/qa-issue578-scheduler-runtime-liveness.yml
      - name: "執行 #578 runtime liveness 與既有 takeover 回歸"
        run: >-
          python -m pytest -q
          tests/process/test_issue578_scheduler_runtime_liveness.py
          tests/process/test_issue573_sibling_scheduler_takeover.py
          tests/process/test_issue581_interactive_stale_takeover.py
