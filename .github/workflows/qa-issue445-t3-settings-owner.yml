name: "QA #445 T3 Settings Presentation Owner"

on:
  push:
    branches:
      - refactor/issue445-t3-settings-owner-20260921
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_settings_panel.py'
      - 'tests/test_issue445_settings_presentation_owner.py'
      - 'docs/superpowers/checkpoints/issue445-t3-*.txt'
      - 'docs/superpowers/checkpoints/issue445-t3-*.md'
      - '.github/workflows/qa-issue445-t3-settings-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 29b47853e21582a8533cda79a1a381a04a5571f3

jobs:
  t3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py             --task "派工 #445 T3：把 fold_designer_bridge.py 既有 Settings context-extension Tk presentation 深化到 canonical phase6_settings_panel.py owner；保留 Settings transaction/domain mutation、BendingUI symmetry、geometry、DXF、persistence ownership 不變；執行 focused ownership GREEN、Tk regression 與 protected Git-object gate。"             --changed-file fold_designer_bridge.py             --changed-file phase6_settings_panel.py             --changed-file tests/test_issue445_settings_presentation_owner.py             --changed-file docs/superpowers/checkpoints/issue445-t3-preflight-evidence.txt             --changed-file docs/superpowers/checkpoints/issue445-t3-settings-cluster-census.md             --changed-file .github/workflows/qa-issue445-t3-settings-owner.yml             --evidence docs/superpowers/checkpoints/issue445-t3-preflight-evidence.txt

      - name: Exact lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/issue445-scope.txt
          python - <<'PY'
          from pathlib import Path
          paths=[x for x in Path('/tmp/issue445-scope.txt').read_text().splitlines() if x]
          allowed={
              'fold_designer_bridge.py',
              'phase6_settings_panel.py',
              'tests/test_issue445_settings_presentation_owner.py',
              'docs/superpowers/checkpoints/issue445-t3-preflight-evidence.txt',
              'docs/superpowers/checkpoints/issue445-t3-settings-cluster-census.md',
              '.github/workflows/qa-issue445-t3-settings-owner.yml',
          }
          unexpected=sorted(set(paths)-allowed)
          assert not unexpected, f'ISSUE445_SCOPE_DRIFT={unexpected}'
          print('ISSUE445_SCOPE_DRIFT=0')
          print(f'ISSUE445_CHANGED_FILES={len(paths)}')
          PY

      - name: Compile changed Python owners
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             phase6_settings_panel.py             fold_designer_bridge.py             tests/test_issue445_settings_presentation_owner.py

      - name: T3 ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue445_settings_presentation_owner.py --tb=short | tee /tmp/issue445-owner.log
          grep -Eq '5 passed' /tmp/issue445-owner.log
          echo 'T3_OWNERSHIP_CONTRACT=GREEN'

      - name: Settings transaction and pure regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_phase6_settings_panel_ownership.py             tests/test_phase6_settings_center_bridge.py             tests/test_phase6_box_body_structure.py             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue366_t2b_structure_endcap_controller.py             tests/test_issue366_t2c_corner_external_controller.py             --tb=short

      - name: Real Tk Settings and bridge regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_settings_center_gui_contract.py             tests/test_phase6_corner_transaction.py             tests/test_phase6_t02_endcap_edge_controls.py             tests/test_phase6_t14_box_body_child_sections.py             tests/test_phase6_left_global_transaction.py             --tb=short

      - name: Manufacturing and DXF focused guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_dxf_acceptance.py             tests/test_resolved_manufacturing_geometry.py             tests/test_resolved_manufacturing_export.py             --tb=short

      - name: Protected Git-object invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA"...HEAD --             'ae_engine/**'             'phase6_project_*.py'             config.ini             '*.dxf'
          python - <<'PY'
          import subprocess
          base='29b47853e21582a8533cda79a1a381a04a5571f3'
          def blob(ref,path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'])
          assert blob(base,'config.ini') == blob('HEAD','config.ini')
          print('CONFIG_GIT_OBJECT_INVARIANT=1')
          print('GEOMETRY_OWNER_DRIFT=0')
          print('DXF_DRIFT=0')
          print('PROJECT_SCHEMA_DRIFT=0')
          print('MUTATION_OWNER_MOVE=0')
          PY

      - name: Bounded acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo "ISSUE=445"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "BASE_SHA=$BASE_SHA"
            echo "WORK_BRANCH=$GITHUB_REF_NAME"
            echo "VALIDATION_PR=456"
          } >> "$GITHUB_STEP_SUMMARY"
