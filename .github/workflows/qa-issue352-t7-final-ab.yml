name: "#352 T7 final A-B acceptance"

on:
  push:
    branches:
      - refactor/issue352-final-acceptance-20260918
    paths:
      - '.github/workflows/qa-issue352-t7-final-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: 3db24241c8ff5b76b164690e03427aa2e20b8f88
  PRODUCTION_SHA: cfa1e0540ef3414913d4c5f402f4cf0fa5d727b1
  PYTHONPATH: .
  MPLBACKEND: Agg

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.ids.outputs.candidate_sha }}
      production_sha: ${{ steps.ids.outputs.production_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ids
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git cat-file -e "$PRODUCTION_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCTION_SHA" "$CANDIDATE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "production_sha=$PRODUCTION_SHA" >> "$GITHUB_OUTPUT"
      - name: Protected drift gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$PRODUCTION_SHA" "$CANDIDATE_SHA" | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          forbidden = [
              p for p in changed
              if p == 'config.ini'
              or p.lower().endswith('.dxf')
              or p.startswith('基本檔/')
              or p.startswith('basic/')
          ]
          assert not forbidden, f'PROTECTED_DRIFT={forbidden}'
          allowed_roots = (
              'fold_designer_bridge.py',
              'phase6_manufacturing_geometry.py',
              'tests/',
              'tools/',
              'docs/superpowers/checkpoints/',
              'config/issue346_t1_xvfb_failure_contract.json',
          )
          unexpected = [
              p for p in changed
              if not any(p == root or p.startswith(root) for root in allowed_roots)
          ]
          assert not unexpected, f'UNEXPECTED_SCOPE={unexpected}'
          print(f'CHANGED_FILES={len(changed)}')
          print('PROTECTED_DRIFT=0')
          PY

  candidate-headless:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run full candidate Headless
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > pytest.rc
          exit 0
      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          log=Path('pytest.log').read_text(errors='replace')
          failures=sorted(set(re.findall(r'^FAILED\s+([^\s]+)', log, re.M)))
          m=re.search(r'(\d+) passed(?:, (\d+) failed)?(?:, (\d+) skipped)?(?:, (\d+) deselected)?', log)
          Path('summary.json').write_text(json.dumps({
            'lane':'candidate-headless','rc':int(Path('pytest.rc').read_text()),
            'failures':failures,'summary':m.group(0) if m else 'UNPARSED'
          },indent=2)+'\n')
          print(Path('summary.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-headless
          path: |
            summary.json
            pytest.log

  production-headless:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run full production Headless
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > pytest.rc
          exit 0
      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          log=Path('pytest.log').read_text(errors='replace')
          failures=sorted(set(re.findall(r'^FAILED\s+([^\s]+)', log, re.M)))
          m=re.search(r'(\d+) passed(?:, (\d+) failed)?(?:, (\d+) skipped)?(?:, (\d+) deselected)?', log)
          Path('summary.json').write_text(json.dumps({
            'lane':'production-headless','rc':int(Path('pytest.rc').read_text()),
            'failures':failures,'summary':m.group(0) if m else 'UNPARSED'
          },indent=2)+'\n')
          print(Path('summary.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-headless
          path: |
            summary.json
            pytest.log

  candidate-xvfb:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run full candidate Xvfb
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > pytest.rc
          exit 0
      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          log=Path('pytest.log').read_text(errors='replace')
          failures=sorted(set(re.findall(r'^FAILED\s+([^\s]+)', log, re.M)))
          m=re.search(r'(\d+) passed(?:, (\d+) failed)?(?:, (\d+) skipped)?(?:, (\d+) deselected)?', log)
          Path('summary.json').write_text(json.dumps({
            'lane':'candidate-xvfb','rc':int(Path('pytest.rc').read_text()),
            'failures':failures,'summary':m.group(0) if m else 'UNPARSED'
          },indent=2)+'\n')
          print(Path('summary.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-xvfb
          path: |
            summary.json
            pytest.log

  production-xvfb:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run full production Xvfb
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > pytest.rc
          exit 0
      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          log=Path('pytest.log').read_text(errors='replace')
          failures=sorted(set(re.findall(r'^FAILED\s+([^\s]+)', log, re.M)))
          m=re.search(r'(\d+) passed(?:, (\d+) failed)?(?:, (\d+) skipped)?(?:, (\d+) deselected)?', log)
          Path('summary.json').write_text(json.dumps({
            'lane':'production-xvfb','rc':int(Path('pytest.rc').read_text()),
            'failures':failures,'summary':m.group(0) if m else 'UNPARSED'
          },indent=2)+'\n')
          print(Path('summary.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-xvfb
          path: |
            summary.json
            pytest.log

  classify:
    needs: [scope, candidate-headless, production-headless, candidate-xvfb, production-xvfb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Classify A-B
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path('artifacts',name,'summary.json').read_text())

          ch=load('candidate-headless')
          ph=load('production-headless')
          cx=load('candidate-xvfb')
          px=load('production-xvfb')

          inherited={
            'tests/test_phase6_assembly_3d_view.py::test_real_tk_part_selector_starts_in_assembly_and_switches_to_single_part',
            'tests/test_phase6_assembly_3d_view.py::test_real_tk_menu_can_switch_from_assembly_to_boxbody_after_radiobutton_sets_label_first',
          }
          chf=set(ch['failures']); phf=set(ph['failures'])
          cxf=set(cx['failures']); pxf=set(px['failures'])
          new_headless=sorted(chf-phf)
          new_xvfb=sorted(cxf-pxf-inherited)

          print('CANDIDATE_HEADLESS',ch['summary'],chf)
          print('PRODUCTION_HEADLESS',ph['summary'],phf)
          print('CANDIDATE_XVFB',cx['summary'],cxf)
          print('PRODUCTION_XVFB',px['summary'],pxf)
          print('NEW_HEADLESS',new_headless)
          print('NEW_XVFB',new_xvfb)

          assert not new_headless, f'NEW_HEADLESS_FAILURES={new_headless}'
          assert not new_xvfb, f'NEW_XVFB_FAILURES={new_xvfb}'
          print('FINAL_CLASSIFICATION=NO_NEW_FAILURES')
          PY
