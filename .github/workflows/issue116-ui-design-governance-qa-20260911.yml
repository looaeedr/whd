name: issue116-ui-design-governance-qa-20260911

on:
  push:
    branches:
      - feat/issue116-ui-design-governance-20260911
    paths:
      - 'docs/superpowers/verification/.issue116-ui-design-trigger'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Knowledge Preflight
        run: |
          python3 tools/phase6_skill_preflight.py \
            --task "Issue #116: 接上 UI設計與去AI味 Registry / README / AI08 / release governance；T2 只做 R4-R6 machine routing、durable writeback 與 release mandatory artifacts" \
            --changed-file '.agents/skills/skill_registry.json' \
            --changed-file '.agents/skills/engineering/README.md' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' \
            --changed-file 'release_required_artifacts.json' \
            --changed-file 'tests/test_ui_design_de_ai_skill_contract.py' \
            --changed-file 'docs/superpowers/verification/2026-09-11-issue116-ui-design-governance.md' \
            --changed-file '.github/workflows/issue116-ui-design-governance-qa-20260911.yml' \
            --evidence 'docs/superpowers/verification/2026-09-11-issue116-ui-design-governance.md'
      - name: UI task-intent route proof
        run: |
          python3 tools/phase6_skill_preflight.py \
            --task "把設定頁做介面重整，改善視覺層級、layout 與 typography，不改 callback、資料或工程功能" \
            --evidence 'docs/superpowers/verification/2026-09-11-issue116-ui-design-governance.md'
      - name: T1 + T2 contract R1-R6
        run: python3 tests/test_ui_design_de_ai_skill_contract.py
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git diff --exit-code
