name: Issue 207 T3 Apply Move Only

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - '.github/workflows/issue207-t3-apply-move.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-move-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/issue207-pure-drawing-move-20260914
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest matplotlib
      - name: Guard pre-move branch scope
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync
          unexpected=$(git diff --name-only origin/cleanup/2d-3d-sync...HEAD -- . \
            ':!.scratch/**' \
            ':!docs/superpowers/plans/2026-09-14-gui-pure-drawing-move.md' \
            ':!.github/workflows/issue207-t3-preflight.yml' \
            ':!.github/workflows/issue207-t3-apply-move.yml' \
            ':!tests/test_issue206_gui_modularization_characterization.py')
          if [ -n "$unexpected" ]; then
            echo "Unexpected pre-move diff:"
            echo "$unexpected"
            exit 1
          fi
          test ! -e gui_modules
      - name: Reconfirm baseline characterization
        run: pytest -q tests/test_issue206_gui_modularization_characterization.py
      - name: Apply exact Move-Only extraction
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          gui_path = Path('gui.py')
          source = gui_path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          protected_names = {
              '_project_toolbar_presentation',
              'layout_reference_overlay_rects',
              '_YMirroredPreviewTransform',
              'render_structural_result',
          }

          def protected_segments(text):
              parsed = ast.parse(text)
              result = {}
              for node in parsed.body:
                  if isinstance(node, (ast.FunctionDef, ast.ClassDef)) and node.name in protected_names:
                      result[node.name] = ast.get_source_segment(text, node)
              missing = protected_names - result.keys()
              if missing:
                  raise SystemExit(f'missing protected symbols before move: {sorted(missing)}')
              return result

          before_protected = protected_segments(source)

          corner_block = '''def _corner_preview_canvas_point(point, *, ox, oy, scale, span, flip_y=True):\n    """Map semantic preview coordinates to the operator-facing canvas."""\n    canvas_y = oy - (span - point.y) * scale if flip_y else oy - point.y * scale\n    return (\n        ox + point.x * scale,\n        canvas_y,\n    )\n\n\ndef _corner_preview_flip_y_for_target(target_key):\n    """Top thumbnails stay flipped; bottom thumbnails use their original orientation."""\n    return str(target_key or "").strip() not in {"bottom", "bottom_left", "bottom_right"}\n'''
          import_block = '''from gui_modules.drawing import (\n    _corner_preview_canvas_point,\n    _corner_preview_flip_y_for_target,\n    render_drawing_scene,\n)\n'''
          if source.count(corner_block) != 1:
              raise SystemExit(f'corner helper block count != 1: {source.count(corner_block)}')
          source = source.replace(corner_block, import_block, 1)

          start_marker = 'def render_drawing_scene(canvas, scene, transform, *, skip_layers=()):\n'
          end_marker = 'def render_secondary_scene(canvas, scene, transform):\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('render function markers are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          source = source[:start] + source[end:]

          after_tree = ast.parse(source)
          top_functions = [n.name for n in after_tree.body if isinstance(n, ast.FunctionDef)]
          if '_corner_preview_canvas_point' in top_functions:
              raise SystemExit('corner point helper body still defined in gui.py')
          if '_corner_preview_flip_y_for_target' in top_functions:
              raise SystemExit('flip helper body still defined in gui.py')
          if 'render_drawing_scene' in top_functions:
              raise SystemExit('render_drawing_scene body still defined in gui.py')

          after_protected = protected_segments(source)
          if before_protected != after_protected:
              changed = [k for k in sorted(protected_names) if before_protected[k] != after_protected[k]]
              raise SystemExit(f'protected/HOLD symbol source changed: {changed}')

          pkg = Path('gui_modules')
          pkg.mkdir()
          (pkg / '__init__.py').write_text(
              '"""Presentation-only GUI helper modules; authoritative application state stays in gui.py/controllers."""\n',
              encoding='utf-8',
          )
          drawing = '''"""Stateless Canvas presentation helpers extracted from the legacy GUI host."""\n\nfrom ae_engine.sheetmetal_drawing import CirclePrimitive, LinePrimitive, PolylinePrimitive\n\n\ndef _corner_preview_canvas_point(point, *, ox, oy, scale, span, flip_y=True):\n    """Map semantic preview coordinates to the operator-facing canvas."""\n    canvas_y = oy - (span - point.y) * scale if flip_y else oy - point.y * scale\n    return (\n        ox + point.x * scale,\n        canvas_y,\n    )\n\n\ndef _corner_preview_flip_y_for_target(target_key):\n    """Top thumbnails stay flipped; bottom thumbnails use their original orientation."""\n    return str(target_key or "").strip() not in {"bottom", "bottom_left", "bottom_right"}\n\n\ndef render_drawing_scene(canvas, scene, transform, *, skip_layers=()):\n    skip = set(skip_layers)\n    for primitive in scene.primitives:\n        if primitive.layer in skip:\n            continue\n        if isinstance(primitive, PolylinePrimitive):\n            coords = []\n            for point in primitive.points:\n                coords.extend(transform.world_to_canvas(point))\n            if len(coords) < 4:\n                continue\n            color = {"MARKING":"#8e8e93", "BLIND_HOLE":"#ff453a", "DATUM":"#bf5af2"}.get(primitive.layer, "#30d158")\n            if primitive.layer == "BEND":\n                color = "#0a84ff"\n            if primitive.closed and len(coords) >= 6:\n                canvas.create_polygon(*coords, outline=color, fill="", width=2 if primitive.layer == "CUTTING" else 1.5)\n            else:\n                kwargs = {"fill": color, "width": 1.5}\n                if primitive.layer == "BEND":\n                    kwargs["dash"] = (6, 4)\n                canvas.create_line(*coords, **kwargs)\n        elif isinstance(primitive, LinePrimitive):\n            p1 = transform.world_to_canvas(primitive.p1)\n            p2 = transform.world_to_canvas(primitive.p2)\n            color = "#0a84ff" if primitive.layer == "BEND" else {"MARKING":"#8e8e93", "BLIND_HOLE":"#ff453a", "DATUM":"#bf5af2"}.get(primitive.layer, "#30d158")\n            kwargs = {"fill": color, "width": 1.5}\n            if primitive.layer == "BEND":\n                kwargs["dash"] = (6, 4)\n            canvas.create_line(*p1, *p2, **kwargs)\n        elif isinstance(primitive, CirclePrimitive):\n            cx, cy = transform.world_to_canvas(primitive.center)\n            r_px = primitive.radius * transform.scale\n            color = {"CUTTING":"#30d158", "BLIND_HOLE":"#ff453a", "MARKING":"#8e8e93", "DATUM":"#bf5af2"}.get(primitive.layer, "#8e8e93")\n            canvas.create_oval(cx-r_px, cy-r_px, cx+r_px, cy+r_px, outline=color, width=1.5)\n'''
          (pkg / 'drawing.py').write_text(drawing, encoding='utf-8')
          gui_path.write_text(source, encoding='utf-8')
          PY
      - name: Verify moved behavior and import direction
        shell: bash
        run: |
          pytest -q tests/test_issue206_gui_modularization_characterization.py
          python -c "import gui; assert callable(gui._corner_preview_canvas_point); assert callable(gui._corner_preview_flip_y_for_target); assert callable(gui.render_drawing_scene)"
          python -c "import sys, gui_modules.drawing; assert 'gui' not in sys.modules"
          ! grep -R -n -E '(^|[[:space:]])(from[[:space:]]+gui[[:space:]]+import|import[[:space:]]+gui([[:space:]]|$))' gui_modules
      - name: Commit exact production move
        shell: bash
        run: |
          git config user.name 'looaeedr'
          git config user.email '76246585+looaeedr@users.noreply.github.com'
          git add gui.py gui_modules/__init__.py gui_modules/drawing.py
          git diff --cached --check
          git commit -m 'refactor(issue207): extract pure drawing helpers'
          git push origin HEAD:refactor/issue207-pure-drawing-move-20260914
