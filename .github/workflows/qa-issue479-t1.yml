name: Issue 479 T1 FinalScene Composition Ports

on:
  push:
    branches:
      - work/issue486-phase4-ownership-20260922
    paths:
      - '.github/workflows/qa-issue479-t1.yml'
      - 'tests/test_issue479_final_scene_composition_owner.py'
      - 'fold_designer_bridge.py'
      - 'gui_modules/application/fold_designer_adapter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T1 architecture contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short             tests/test_issue479_final_scene_composition_owner.py             tests/test_issue396_phase4_composition_root.py             tests/test_issue370_t6_final_scene_view_owner.py             tests/test_issue447_workspace_shell_owner.py             tests/test_issue448_part_editor_owner_decision.py             tests/test_issue449_fix11_init_bootstrap_owner.py
