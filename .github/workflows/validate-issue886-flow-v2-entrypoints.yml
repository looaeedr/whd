name: WHD｜#886｜Flow v2 入口切換驗證
run-name: WHD｜#886｜Flow v2 入口切換｜${{ github.run_number }}

on:
  push:
    branches:
      - governance/issue886-flow-v2-entrypoints
    paths:
      - .flow-v2/issue886.ready

permissions:
  contents: read

jobs:
  contract:
    name: 驗證 Skills、AI Library 與 Registry 已切到 Flow v2
    runs-on: ubuntu-latest
    steps:
      - name: 讀取 #886 分支
        uses: actions/checkout@v4
      - name: 安裝測試工具
        run: python -m pip install -q pytest
      - name: 執行 Flow v2 入口契約測試
        run: python -m pytest -q --confcutdir=tests/process tests/process/test_issue886_flow_v2_entrypoint_cutover.py