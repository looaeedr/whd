name: T48-4 Combined Acceptance

on:
  push:
    branches:
      - work/48-receiving-fw-divider-flush-relief-gate
    paths:
      - ".github/workflows/t48-4-combined.yml"

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Knowledge preflight
        shell: bash
        run: |
          mkdir -p logs
          cat > t48_4_preflight_evidence.txt <<'EOF'
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/07_Phase6尺寸語意與標準截角母規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          EOF
          python tools/phase6_skill_preflight.py             --task "combined acceptance Receiving Divider FW placement collision relief 2D 3D DXF save reload multipart remote QA"             --changed-file ae_engine/assembly_geometry.py             --changed-file ae_engine/assembly_placement.py             --changed-file ae_engine/cabinet_types/receiving.py             --changed-file ae_engine/cabinet_types/policy.py             --changed-file ae_engine/door_dividers.py             --changed-file ae_engine/manufacturing_api.py             --changed-file fold_designer_bridge.py             --changed-file tests/test_issue48_receiving_fw_flush_red.py             --changed-file tests/test_issue48_final_geometry_sync.py             --evidence t48_4_preflight_evidence.txt             > logs/t48_4.preflight.txt
          cat logs/t48_4.preflight.txt
      - name: Compile changed production
        run: |
          python -m py_compile             ae_engine/assembly_geometry.py             ae_engine/assembly_placement.py             ae_engine/cabinet_types/receiving.py             ae_engine/cabinet_types/policy.py             ae_engine/door_dividers.py             ae_engine/manufacturing_api.py             fold_designer_bridge.py
      - name: Combined acceptance
        shell: bash
        run: |
          set +e
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_issue38_receiving_divider_baseline.py             tests/test_issue39_divider_relief.py             tests/test_issue40_divider_6p4_shared_datum.py             tests/test_issue43_receiving_divider_t1.py             tests/test_issue45_dynamic_parts_2d_roundtrip.py             tests/test_issue48_receiving_fw_flush_red.py             tests/test_issue48_final_geometry_sync.py             tests/test_assembly_collision.py             tests/test_assembly_collision_integration.py             tests/test_assembly_placement_divider.py             tests/test_phase6_t05_box_body_dividers.py             tests/test_phase6_t06_receiving_fresh_family.py             tests/test_phase6_t12_receiving_asymmetric_policy.py             tests/test_phase6_t16_receiving_placement.py             tests/test_phase6_receiving_multipart_integration.py             tests/test_phase6_receiving_projection_regression.py             tests/test_receiving_door_frame_width_semantics.py             tests/test_receiving_door_dimension_projection_semantics.py             tests/test_phase6_t25_combined_receiving_acceptance.py             tests/test_phase6_t10_project_authority.py             tests/test_phase6_project_file.py             tests/test_resolved_manufacturing_bridge.py             tests/test_resolved_manufacturing_export.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_canonical_unfolded_blank_info.py             > t48_4.log 2>&1
          rc=$?
          after="$(sha256sum config.ini | awk '{print $1}')"
          cat t48_4.log
          printf '{"pytest_rc":%s,"config_before":"%s","config_after":"%s"}\n' "$rc" "$before" "$after" > t48_4_state.json
          cat t48_4_state.json
          if [ "$before" != "$after" ]; then
            echo "config.ini mutated" >&2
            exit 97
          fi
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t48-4-combined-${{ github.run_id }}
          path: |
            t48_4.log
            t48_4_state.json
            logs/t48_4.preflight.txt
