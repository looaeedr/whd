name: Flow v2 Issue 874 Combined Acceptance

on:
  push:
    branches:
      - qa/issue874-flow-v2-combined-20260928
    paths:
      - .github/workflows/qa-issue874-flow-v2-combined.yml

permissions:
  contents: read
  issues: read

jobs:
  combined:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/issue874-flow-v2-combined-20260928
          fetch-depth: 0

      - name: Run cumulative Flow v2 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q --confcutdir=tests/process             tests/process/test_flow_v2_*.py             tests/process/test_issue870_execution_record_store.py             tests/process/test_issue870_execution_record_v2.py             tests/process/test_issue684_real_ha_combined_acceptance.py             tests/process/test_issue865_scheduler_stop_hardening.py             tests/process/test_issue692_governance_parity_gate.py

      - name: Validate live native state and legacy freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin             coord/execution-v2:refs/remotes/origin/coord/execution-v2             coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims

          git show refs/remotes/origin/coord/execution-v2:.dispatch/execution/issue-684.json > /tmp/issue-684.json
          git show refs/remotes/origin/coord/execution-v2:.dispatch/execution/ready-index.json > /tmp/ready-index.json
          gh api "repos/$GITHUB_REPOSITORY/issues/684" > /tmp/github-issue-684.json
          gh api "repos/$GITHUB_REPOSITORY/commits/bd2fb2fa7c4569f07ca710452d2a0bfc1ee0527d" > /tmp/legacy-head.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from tools.execution_ready_index import build_ready_index, ready_index_to_payload
          from tools.execution_record import execution_record_fingerprint, execution_record_from_payload

          payload = json.loads(Path("/tmp/issue-684.json").read_text(encoding="utf-8"))
          record = execution_record_from_payload(payload)
          assert record.issue == 684
          assert record.generation == 2
          assert record.state == "DONE"
          assert record.semantic_state == "TERMINAL_SUCCESS"
          assert record.next_action is None
          assert record.transaction is not None
          assert record.transaction.kind == "FINALIZE"
          assert record.transaction.status == "RECONCILED"
          assert execution_record_fingerprint(record) == "d388a5be496957d816429465c508a97b408f4fb52fddc144900661521134b65e"

          stored = json.loads(Path("/tmp/ready-index.json").read_text(encoding="utf-8"))
          rebuilt = ready_index_to_payload(build_ready_index((record,)))
          assert stored == rebuilt
          assert stored["authority"] == "DERIVED_CACHE_ONLY"
          assert stored["entries"] == []

          issue = json.loads(Path("/tmp/github-issue-684.json").read_text(encoding="utf-8"))
          assert issue["state"] == "closed"
          assert issue["state_reason"] == "completed"

          legacy = json.loads(Path("/tmp/legacy-head.json").read_text(encoding="utf-8"))
          legacy_time = datetime.fromisoformat(
              legacy["commit"]["committer"]["date"].replace("Z", "+00:00")
          )
          cutover_hard_gate_time = datetime.fromisoformat("2026-09-28T05:08:00+00:00")
          assert legacy_time < cutover_hard_gate_time
          assert legacy["sha"] == "bd2fb2fa7c4569f07ca710452d2a0bfc1ee0527d"

          print("FLOW_V2_COMBINED_LIVE_READBACK_GREEN")
          print("native_coord=115cb8be4679e0fc2e7fe1db968eadf623e1e2c0")
          print("legacy_coord=bd2fb2fa7c4569f07ca710452d2a0bfc1ee0527d")
          print("issue684=DONE")
          PY
