name: Receiving BoxBody restore preflight

on:
  push:
    branches:
      - fix/receiving-boxbody-unfold-restore-20260912

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase6 knowledge preflight
        shell: bash
        run: |
          cat > /tmp/phase6-evidence.txt <<'EOF'
          UI設計與去AI味
          diagnosing-bugs
          tdd
          Python測試實務
          phase6-corner-3d-model-integrity
          驗證板件與DXF
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          EOF
          TASK='修正受電箱箱身展開圖，恢復已驗證 BoxBody aggregate parent projection，並調整展開 UI 黑底、放大、滾輪縮放、左側捲軸與上方版面'
          python tools/phase6_skill_preflight.py --task "$TASK" --evidence /tmp/phase6-evidence.txt
          python tools/phase6_skill_preflight.py --task "$TASK" \
            --changed-file fold_designer_bridge.py \
            --changed-file gui.py \
            --changed-file tests/test_issue96_corner_data_selection_lifecycle.py \
            --changed-file tests/test_issue97_authoritative_unfold_view_adapter.py \
            --changed-file .github/workflows/qa-receiving-boxbody-restore-preflight-20260912.yml \
            --evidence /tmp/phase6-evidence.txt
