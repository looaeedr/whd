name: "QA #372 T8 remediation task A-B"

on:
  push:
    branches:
      - fix/issue372-t8-t7-runtime-remediation-20260919
    paths:
      - '.github/workflows/qa-issue372-t8-remediation-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c
  TESTED_SHA: d535627cd5e809a154c324a16f76c8cef0ced6ec

jobs:
  headless-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Headless dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Run baseline and candidate Headless
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$TESTED_SHA"
          ROOT="$GITHUB_WORKSPACE/.scratch/issue372-remediation/headless"
          mkdir -p "$ROOT"

          protected_digest() {
            find . -type f \( -name config.ini -o -iname '*.dxf' \)               -not -path './.git/*' -not -path './.scratch/*'               -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }

          run_one() {
            label="$1"; ref="$2"; out="$ROOT/$label"
            mkdir -p "$out"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            protected_digest > "$out/protected-before.digest"
            set +e
            python -m pytest -q -ra --tb=short               --json-report --json-report-file="$out/report.json"               tests/test_phase6_bridge_domain_ownership.py               tests/test_phase6_update_executor_conformance.py               tests/test_issue358_remove_manufacturing_callbacks.py               tests/test_issue361_one_line_manufacturing_facade.py               tests/test_issue371_t7_lifecycle_facade_owner.py               tests/test_issue371_t7_update_runtime_behavior.py               tests/test_phase6_2d_3d_round_trip.py               tests/test_phase6_gui_performance_contract.py               tests/test_issue350_manufacturing_orchestration_extraction.py               tests/test_issue351_t6_compatibility_gate.py               tests/test_issue366_t2c_corner_external_controller.py               tests/test_issue335_top_toolbar.py               tests/test_issue336_left_content_switch.py               tests/test_issue340_keyboard_focus.py               tests/test_phase6_ui_state_regressions.py               2>&1 | tee "$out/pytest.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/pytest.rc"
            protected_digest > "$out/protected-after.digest"
            test -s "$out/report.json"
            cmp -s "$out/protected-before.digest" "$out/protected-after.digest"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$TESTED_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue372-remediation-headless-ab
          path: .scratch/issue372-remediation/headless
          if-no-files-found: error

  xvfb-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xvfb dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Run baseline and candidate Xvfb
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$TESTED_SHA"
          ROOT="$GITHUB_WORKSPACE/.scratch/issue372-remediation/xvfb"
          mkdir -p "$ROOT"

          protected_digest() {
            find . -type f \( -name config.ini -o -iname '*.dxf' \)               -not -path './.git/*' -not -path './.scratch/*'               -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }

          run_one() {
            label="$1"; ref="$2"; out="$ROOT/$label"
            mkdir -p "$out"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            protected_digest > "$out/protected-before.digest"
            set +e
            xvfb-run -a python -m pytest -q -ra --tb=short               --json-report --json-report-file="$out/report.json"               tests/test_original_fold_designer_bridge.py               tests/test_gui_fold_designer_transaction_contract.py               tests/test_phase6_3d_view_regressions.py               tests/test_phase6_assembly_3d_view.py               tests/test_phase6_designer_workspace.py               tests/test_issue335_top_toolbar.py               tests/test_issue336_left_content_switch.py               tests/test_issue337_control_hierarchy.py               tests/test_issue340_keyboard_focus.py               tests/test_phase6_latest_layout_contract.py               tests/test_phase6_receiving_multipart_integration.py               tests/test_phase6_ui_state_regressions.py               2>&1 | tee "$out/pytest.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/pytest.rc"
            protected_digest > "$out/protected-after.digest"
            test -s "$out/report.json"
            cmp -s "$out/protected-before.digest" "$out/protected-after.digest"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$TESTED_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue372-remediation-xvfb-ab
          path: .scratch/issue372-remediation/xvfb
          if-no-files-found: error

  event-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install matplotlib numpy shapely -r requirements.txt

      - name: Compare public update-event ordering
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.scratch/issue372-remediation/event-order"
          mkdir -p "$ROOT"
          cat > /tmp/issue372_event_probe.py <<'PY'
          import json
          import sys
          from types import SimpleNamespace
          import fold_designer_bridge as bridge

          output = sys.argv[1]

          class Canvas:
              def __init__(self):
                  self.draw = lambda: None
                  self.draw_idle = lambda: None

          def run(reasons):
              events = []
              owner = SimpleNamespace(
                  _phase6_sync_ready=True,
                  _phase6_initializing=False,
                  _phase6_external_apply_guard=False,
                  _live_sync_callback=lambda payload=None: None,
                  _phase6_force_sync_preview=False,
                  preview_3d_enabled=True,
                  renderer=SimpleNamespace(
                      canvas=Canvas(),
                      render=lambda: events.append("renderer.render"),
                  ),
              )
              owner.publish_if_changed = lambda: events.append("publish")
              bridge._phase6_publish_live_state = lambda self, *args, **kwargs: events.append("publish")
              bridge._PHASE6_RENDERING_DO_UPDATE = lambda self: events.append("full")
              bridge._phase6_render_committed_view = lambda self: events.append("committed")
              bridge._phase6_execute_update_intents(owner, set(reasons))
              return events

          payload = {
              "geometry": run({"geometry"}),
              "display_camera": run({"display", "camera"}),
          }
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, sort_keys=True)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

          run_one() {
            label="$1"; ref="$2"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/issue372_event_probe.py "$ROOT/$label.json"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$TESTED_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: issue372-remediation-event-order
          path: .scratch/issue372-remediation/event-order
          if-no-files-found: error

  classify:
    if: always() && needs.headless-ab.result == 'success' && needs.xvfb-ab.result == 'success' && needs.event-order.result == 'success'
    needs: [headless-ab, xvfb-ab, event-order]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: issue372-remediation-headless-ab
          path: .scratch/issue372-remediation/headless

      - uses: actions/download-artifact@v4
        with:
          name: issue372-remediation-xvfb-ab
          path: .scratch/issue372-remediation/xvfb

      - uses: actions/download-artifact@v4
        with:
          name: issue372-remediation-event-order
          path: .scratch/issue372-remediation/event-order

      - name: Classify remediation A-B
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue372_t8_remediation_ab_compare.py             --baseline-headless .scratch/issue372-remediation/headless/baseline/report.json             --candidate-headless .scratch/issue372-remediation/headless/candidate/report.json             --baseline-xvfb .scratch/issue372-remediation/xvfb/baseline/report.json             --candidate-xvfb .scratch/issue372-remediation/xvfb/candidate/report.json             --baseline-headless-protected-before .scratch/issue372-remediation/headless/baseline/protected-before.digest             --baseline-headless-protected-after .scratch/issue372-remediation/headless/baseline/protected-after.digest             --candidate-headless-protected-before .scratch/issue372-remediation/headless/candidate/protected-before.digest             --candidate-headless-protected-after .scratch/issue372-remediation/headless/candidate/protected-after.digest             --baseline-xvfb-protected-before .scratch/issue372-remediation/xvfb/baseline/protected-before.digest             --baseline-xvfb-protected-after .scratch/issue372-remediation/xvfb/baseline/protected-after.digest             --candidate-xvfb-protected-before .scratch/issue372-remediation/xvfb/candidate/protected-before.digest             --candidate-xvfb-protected-after .scratch/issue372-remediation/xvfb/candidate/protected-after.digest             --baseline-event-order .scratch/issue372-remediation/event-order/baseline.json             --candidate-event-order .scratch/issue372-remediation/event-order/candidate.json             --output .scratch/issue372-remediation/qualification.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue372-remediation-ab-qualification
          path: .scratch/issue372-remediation/qualification.json
          if-no-files-found: error
