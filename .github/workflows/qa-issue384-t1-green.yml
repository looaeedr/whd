name: "QA #384 T1 conditional 板件功能 GREEN"

on:
  push:
    branches:
      - ui/issue384-assembly-only-function-presentation-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue384_assembly_only_function_presentation.py'
      - '.github/workflows/qa-issue384-t1-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD dda04112bd5166ef3c8b84106e4caef0a941e4b6)" = "dda04112bd5166ef3c8b84106e4caef0a941e4b6"
      - name: Install GUI harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Capture invariants
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/base.before
      - name: T1 focused
        run: xvfb-run -a python -m pytest -q tests/test_issue384_assembly_only_function_presentation.py --tb=short
      - name: Inherited selector and assembly regressions
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue375_main_selector_navigation.py             tests/test_issue377_remove_wrapper_labels.py             tests/test_issue378_assembly_mousewheel.py             --tb=short
      - name: Structure state projection remains callable
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue124_structure_tree.py::test_receiving_box_body_projects_one_parent_with_authoritative_children             tests/test_issue124_structure_tree.py::test_single_piece_box_body_never_invents_children             tests/test_issue124_structure_tree.py::test_orphan_physical_children_remain_exact_top_level_authority             tests/test_issue124_structure_tree.py::test_structure_tree_refresh_guard_stays_active_until_tk_idle             tests/test_issue124_structure_tree.py::test_structure_tree_visibility_delegates_existing_view_state_without_deleting_part             --tb=short
      - name: Protected invariants and scope
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/base.after
          cmp /tmp/config.before /tmp/config.after
          cmp /tmp/base.before /tmp/base.after
          git diff --check dda04112bd5166ef3c8b84106e4caef0a941e4b6...HEAD
          test "$(git diff --name-only dda04112bd5166ef3c8b84106e4caef0a941e4b6...HEAD | grep -Ec '^(config.ini$|基準檔/|ae_engine/|phase6_part_navigation.py$)' || true)" -eq 0
          echo "PASS PROTECTED_DRIFT=0"
