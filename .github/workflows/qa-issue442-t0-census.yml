name: "QA #442 T0 Bridge Ownership Census"

on:
  push:
    branches:
      - refactor/issue441-bridge-ownership-v3-20260920
    paths:
      - 'tools/phase6_bridge_refactor_t0_census.py'
      - 'docs/superpowers/checkpoints/issue442-t0-preflight-evidence.txt'
      - 'docs/superpowers/checkpoints/issue442-t0-review.md'
      - '.github/workflows/qa-issue442-t0-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "派工 #442 T0：為 fold_designer_bridge.py ownership boundary 執行掃描深模組的 reproducible census、caller/source-test inventory、Git-object DXF/config baseline，並以 GitHub Actions remote QA 驗證；只建立 evidence，不修改 production runtime behavior。" \
            --changed-file tools/phase6_bridge_refactor_t0_census.py \
            --changed-file docs/superpowers/checkpoints/issue442-t0-preflight-evidence.txt \
            --changed-file docs/superpowers/checkpoints/issue442-t0-review.md \
            --changed-file .github/workflows/qa-issue442-t0-census.yml \
            --evidence docs/superpowers/checkpoints/issue442-t0-preflight-evidence.txt

      - name: Protected diff gate
        shell: bash
        env:
          BASE_SHA: 2b9aeccee2c91446ca02cbfe9fdcefee587ba29e
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
          printf 'CHANGED=%s\n' "${changed[*]}"
          for p in "${changed[@]}"; do
            case "$p" in
              tools/phase6_bridge_refactor_t0_census.py|docs/superpowers/checkpoints/issue442-t0-preflight-evidence.txt|docs/superpowers/checkpoints/issue442-t0-review.md|.github/workflows/qa-issue442-t0-census.yml) ;;
              *) echo "UNEXPECTED_RUNTIME_DIFF=$p"; exit 1 ;;
            esac
          done
          git diff --exit-code "$BASE_SHA"...HEAD -- fold_designer_bridge.py 'phase6_*.py' 'ae_engine/**' config.ini '*.dxf'

      - name: Run reproducible census
        shell: bash
        env:
          BASE_SHA: 2b9aeccee2c91446ca02cbfe9fdcefee587ba29e
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          test -z "$before"
          python tools/phase6_bridge_refactor_t0_census.py \
            --baseline-ref "$BASE_SHA" \
            --expected-base-sha "$BASE_SHA" \
            --json /tmp/issue442-t0-census.json \
            --markdown /tmp/issue442-t0-census.md
          after="$(git status --porcelain)"
          test -z "$after"

      - name: Machine acceptance
        shell: bash
        env:
          BASE_SHA: 2b9aeccee2c91446ca02cbfe9fdcefee587ba29e
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/issue442-t0-census.json').read_text(encoding='utf-8'))
          assert p['baseline_ref'] == os.environ['BASE_SHA']
          assert p['BASE_SHA_EXACT'] == 1
          assert p['worktree']['clean'] == 1
          assert p['source_tests']['complete'] is True
          assert p['source_tests']['test_py_path_count'] > 0
          assert p['dxf_git_object_manifest']['path_count'] > 0
          assert p['config_git_object']['exists'] is True
          assert len(p['reverse_imports']['bridge_reverse_import_violations']) == 0
          assert p['bridge']['facade_binding_count'] <= 70
          assert set(p['symbols']) == {
              '_phase6_resolve_profile_key',
              '_phase6_box_symmetry_allowed',
              '_phase6_apply_box_symmetry_policy',
              '_phase6_on_box_symmetry_changed',
              '_phase6_build_box_symmetry_settings',
              '_phase6_build_assembly_settings',
              'Phase6BendingUI',
          }
          print('BASE_SHA_EXACT=1')
          print('SOURCE_TEST_INVENTORY_COMPLETE=1')
          print('CALLER_INVENTORY_COMPLETE=1')
          print('DXF_GIT_OBJECT_BASELINE_RECORDED=1')
          print('CONFIG_GIT_OBJECT_BASELINE_RECORDED=1')
          print('PHASE6_REVERSE_IMPORT_BRIDGE_COUNT=0')
          print('PRODUCTION_RUNTIME_EDIT=0')
          PY

      - name: Show bounded summary
        shell: bash
        run: cat /tmp/issue442-t0-census.md

      - name: Canonical finalization guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
          git show origin/coord/dispatch-claims:.dispatch/checkpoints/issue-442.json > /tmp/issue442-terminal-checkpoint.json
          python -m tools.continuity_controller authorize-finalization \
            /tmp/issue442-terminal-checkpoint.json \
            --issue 442 \
            --branch "$GITHUB_REF_NAME" \
            --head-sha "$GITHUB_SHA" \
            --proof-out /tmp/issue442-finalization-proof.json
          python -m tools.continuity_controller verify-finalization-proof \
            /tmp/issue442-terminal-checkpoint.json \
            /tmp/issue442-finalization-proof.json \
            --issue 442 \
            --branch "$GITHUB_REF_NAME" \
            --head-sha "$GITHUB_SHA"

      - name: Upload T0 closing evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue442-t0-closing
          path: |
            /tmp/issue442-t0-census.json
            /tmp/issue442-t0-census.md
            /tmp/issue442-terminal-checkpoint.json
            /tmp/issue442-finalization-proof.json
            docs/superpowers/checkpoints/issue442-t0-review.md
