name: WHD #1819 Real Tk 2D Preview Lifetime

on:
  pull_request:
    branches: [localX]
    paths:
      - 'tests/test_issue1819_real_tk_preview_lifetime.py'
      - 'gui_modules/application/receiving_settings_preview_2d.py'
      - '.github/workflows/whd-issue1819-preview-lifetime.yml'

permissions:
  contents: read

jobs:
  preview-objects-are-collectable:
    name: Real Xvfb popup close releases Python Figure and canvas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      MPLBACKEND: TkAgg
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk/GUI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run actual Tk/Matplotlib preview teardown regression
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            python -m pytest -vv tests/test_issue1819_real_tk_preview_lifetime.py
