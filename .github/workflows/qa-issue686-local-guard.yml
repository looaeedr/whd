name: WHD｜#686｜本機守門持久化對帳驗收
run-name: WHD｜#686｜本機守門持久化對帳驗收｜${{ github.ref_name }}

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: "#686 治理回歸"
    runs-on: ubuntu-latest
    steps:
      - name: 取出工單分支
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: 執行 Local Guard 與相鄰治理回歸
        run: |
          python -m pytest \
            tests/process/test_issue256_execution_claim_guard.py \
            tests/process/test_issue558_post_commit_claim_head_reconcile.py \
            tests/process/test_issue570_merge_head_claim_reconciliation.py \
            tests/process/test_issue586_remote_guard_liveness_transport.py \
            tests/process/test_issue589_user_directed_interactive_owner_takeover.py \
            tests/process/test_issue671_legacy_checkpoint_repair.py \
            tests/process/test_issue686_local_guard_reconciliation.py \
            -q
