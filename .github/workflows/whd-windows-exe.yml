name: Build WHD Windows EXE

# PRs test the actual Windows build; official /推推 calls this reusable
# workflow only after exact X/localX and owner authorization are verified.
on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact authorized X merge commit
        type: string
        required: true
      release_tag:
        description: Exact authorized release tag
        type: string
        required: true
  pull_request:
    branches: [localX]
    paths:
      - '.github/workflows/whd-official-release.yml'
      - '.github/workflows/whd-windows-exe.yml'
      - 'tools/release_notes_zh_tw.py'
      - 'tests/process/test_release_delivery_contract.py'

permissions:
  contents: read

jobs:
  windows-package:
    if: github.event_name == 'pull_request' || inputs.release_sha != ''
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRODUCT_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha }}
      RELEASE_TAG: ${{ inputs.release_tag || format('vPR-{0}', github.run_id) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact candidate and its history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
          path: product
          persist-credentials: false
      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify source identity, dependencies and Windows release inputs
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA) {
            throw 'EXE_SOURCE_SHA_MISMATCH'
          }
          if (!(Test-Path '基準檔') -or !(Test-Path 'config.ini') -or !(Test-Path 'config')) {
            throw 'EXE_REQUIRED_EDITABLE_DATA_MISSING'
          }
          python -m pip install --disable-pip-version-check -r requirements.txt 'pyinstaller==6.16.0' matplotlib pillow
          python -c "import tkinter,ezdxf,shapely,matplotlib,gui; print('WHD_IMPORT_OK')"
      - name: Build portable Windows WHD.exe from exact product source
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --contents-directory . --name WHD --collect-submodules ae_engine --collect-submodules gui_modules --add-data '基準檔;基準檔' --add-data 'config.ini;.' --add-data 'config;config' gui.py
          if ($LASTEXITCODE -ne 0) { throw 'PYINSTALLER_BUILD_FAILED' }
          if (!(Test-Path 'dist/WHD/WHD.exe')) { throw 'EXE_MISSING' }
          if (!(Test-Path 'dist/WHD/config.ini') -or !(Test-Path 'dist/WHD/基準檔')) {
            throw 'EXE_REQUIRED_DATA_MISSING'
          }
          if (!(Get-ChildItem 'dist/WHD/基準檔' -Recurse -Filter '*.dxf' | Select-Object -First 1)) {
            throw 'EXE_DXF_BASELINES_MISSING'
          }
      - name: Smoke-test actual WHD.exe process
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/WHD').Path
          $exe = Join-Path $folder 'WHD.exe'
          $app = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
          try {
            Start-Sleep -Seconds 12
            $app.Refresh()
            if ($app.HasExited) { throw "EXE_STARTUP_FAILED: $($app.ExitCode)" }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Generate current Traditional Chinese release notes and guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Previous release is the most recently PUBLISHED non-draft X version.
          # The new X merge is not yet published by the official caller.
          $all = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=50" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PREVIOUS_RELEASE_LOOKUP_FAILED' }
          $prior = $all | Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -ne $env:RELEASE_TAG } | Select-Object -First 1
          if ($null -eq $prior) { throw 'PREVIOUS_RELEASE_REQUIRED_FOR_ZH_TW_NOTES' }
          if ($prior.target_commitish -notmatch '^[0-9a-f]{40}$') {
            throw 'PREVIOUS_RELEASE_NOT_PINNED_TO_COMMIT'
          }
          python product/tools/release_notes_zh_tw.py --tag "$env:RELEASE_TAG" --sha "$env:PRODUCT_SHA" --previous-tag "$($prior.tag_name)" --previous-sha "$($prior.target_commitish)" --root product --out output
          if ($LASTEXITCODE -ne 0) { throw 'ZH_TW_RELEASE_NOTES_GENERATION_FAILED' }
          $notes = Get-Content -LiteralPath 'output/WHD_Release_Notes_zh-TW.md' -Raw -Encoding utf8
          if (!$notes.Contains('本次主要更新') -or !$notes.Contains($env:PRODUCT_SHA) -or !$notes.Contains($env:RELEASE_TAG) -or
              $notes.Length -gt 2000 -or $notes.Contains('## 逐項變更') -or
              $notes -match '(?m)^- (feat|fix|test|docs|chore|ci|build|refactor)[(:! ]') {
            throw 'ZH_TW_RELEASE_NOTES_MUST_BE_CONCISE_NOT_RAW_COMMITS'
          }
          Copy-Item 'output/WHD_Windows_Guide_zh-TW.md' 'product/dist/WHD/使用說明.md'
          Copy-Item 'output/WHD_Release_Notes_zh-TW.md' 'product/dist/WHD/本次更新.md'
          if (Test-Path 'product/使用說明書.md') {
            Copy-Item 'product/使用說明書.md' 'product/dist/WHD/功能操作參考.md'
          }
          "正式版本：$env:RELEASE_TAG`n正式產品來源：$env:PRODUCT_SHA`n先完整解壓，再執行 WHD.exe。" | Set-Content -Encoding utf8 'product/dist/WHD/BUILD_SOURCE.txt'
      - name: Pack verified EXE folder, validate contents and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "WHD_Windows_x64_$env:RELEASE_TAG.zip"
          Compress-Archive -LiteralPath 'product/dist/WHD' -DestinationPath "output/$name" -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "output/$name").Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
            foreach ($required in @('WHD/WHD.exe','WHD/config.ini','WHD/使用說明.md','WHD/本次更新.md')) {
              if ($required -notin $entries) { throw "PACKAGED_FILE_MISSING: $required" }
            }
            if (!(@($entries | Where-Object { $_ -like 'WHD/基準檔/*' }).Count -gt 0)) {
              throw 'PACKAGED_DXF_BASELINE_MISSING'
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash "output/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii 'output/SHA256.txt'
          Write-Host "WINDOWS_PORTABLE_EXE_READY sha=$env:PRODUCT_SHA tag=$env:RELEASE_TAG sha256=$hash"
      - name: Upload verified candidate for the official Release job
        uses: actions/upload-artifact@v4
        with:
          name: WHD-Windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 30
