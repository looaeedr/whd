name: issue187-durable-writeback-green-v2
on:
  push:
    branches:
      - feat/issue187-3d-output-migration-20260913
    paths:
      - .github/workflows/issue187-durable-writeback-green-v2.yml
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append durable contracts
        shell: bash
        env:
          UI_B64: 
          DXF_B64: 
          PIT_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          items = [
              (Path('.agents/skills/engineering/UI設計與去AI味/SKILL.md'), 'UI_B64', 'ISSUE187_3D_OUTPUT_REHOST_CONTRACT'),
              (Path('.agents/skills/engineering/驗證板件與DXF/SKILL.md'), 'DXF_B64', 'ISSUE187_OUTPUT_TRUTH_SEPARATION_CONTRACT'),
              (Path('個人AI檔案庫/踩坑庫/legacy_2d_entry_retirement_20260910.md'), 'PIT_B64', 'ISSUE187_OUTPUT_MIGRATION_PITFALL'),
          ]
          for path, env_name, marker in items:
              text = path.read_text(encoding='utf-8')
              assert marker not in text, f'{path}: marker already exists'
              addition = base64.b64decode(os.environ[env_name]).decode('utf-8')
              path.write_text(text.rstrip() + '\n\n' + addition.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Verify durable contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('.agents/skills/engineering/UI設計與去AI味/SKILL.md').read_text(encoding='utf-8')
          dx = Path('.agents/skills/engineering/驗證板件與DXF/SKILL.md').read_text(encoding='utf-8')
          pit = Path('個人AI檔案庫/踩坑庫/legacy_2d_entry_retirement_20260910.md').read_text(encoding='utf-8')
          assert 'ISSUE187_3D_OUTPUT_REHOST_CONTRACT' in ui and 'mapped、reachable、interactive' in ui
          assert 'ISSUE187_OUTPUT_TRUTH_SEPARATION_CONTRACT' in dx and 'export intention ∩ physical presence' in dx
          assert 'ISSUE187_OUTPUT_MIGRATION_PITFALL' in pit and '搬操作面，不搬 authority' in pit
          print('ISSUE187_DURABLE_WRITEBACK=GREEN')
          PY
      - name: Re-run changed-file preflight
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py --task '#187 T2 durable writeback after 3D DXF/STOCK migration; physical presence vs 3D visibility vs DXF export intention; project load; differential baseline QA; 派工' --changed-file '.agents/skills/engineering/UI設計與去AI味/SKILL.md' --changed-file '.agents/skills/engineering/驗證板件與DXF/SKILL.md' --changed-file '個人AI檔案庫/踩坑庫/legacy_2d_entry_retirement_20260910.md' --evidence .scratch/issue187/changed_file_preflight_evidence.md
      - name: Commit durable writeback
        shell: bash
        run: |
          git diff --check
          git config user.name looaeedr
          git config user.email 76246585+looaeedr@users.noreply.github.com
          git add '.agents/skills/engineering/UI設計與去AI味/SKILL.md' '.agents/skills/engineering/驗證板件與DXF/SKILL.md' '個人AI檔案庫/踩坑庫/legacy_2d_entry_retirement_20260910.md'
          git diff --cached --check
          git commit -m 'docs(issue187): preserve output state authorities during 3D migration'
          git push origin HEAD:feat/issue187-3d-output-migration-20260913
