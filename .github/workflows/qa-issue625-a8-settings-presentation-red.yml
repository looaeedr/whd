name: "WHD｜工單 #625｜A8 Settings presentation P7-R-G RED"
run-name: "WHD｜#625 A8｜P7-R-G Settings presentation RED 證明"

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - 'tests/test_issue625_phase7_a8_settings_presentation_decision.py'
      - 'docs/superpowers/checkpoints/issue613-a1-dt-p7-g.json'
      - '.github/workflows/qa-issue625-a8-settings-presentation-red.yml'

permissions:
  contents: read

jobs:
  focused-red:
    name: "A8｜P7-R-G 聚焦 RED"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "簽出 Phase 7 A8 工單主分支"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "確認 A8 lineage"
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6e3d1804f2d8bbd47e502a72fdac4bb4d01ccbf6 HEAD
          echo "A8_RED_PARENT=6e3d1804f2d8bbd47e502a72fdac4bb4d01ccbf6"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: "安裝聚焦測試相依"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest

      - name: "證明唯一未解 RED 是 DT-6"
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue625_phase7_a8_settings_presentation_decision.py --tb=short | tee /tmp/p7rg-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "1 failed, 3 passed" /tmp/p7rg-red.log
          grep -q "test_p7_r_g_requires_terminal_deletion_test_decision" /tmp/p7rg-red.log
          echo "P7_R_G_EXPECTED_RED=1_FAILED_3_PASSED"
