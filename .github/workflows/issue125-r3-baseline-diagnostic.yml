name: Issue 125 R3 Baseline Diagnostic
on:
  push:
    branches: [work/issue-125-inspector-property-panel-20260912-r3]
    paths: [.github/workflows/issue125-r3-baseline-diagnostic.yml]
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Lock and checkout production baseline
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "c0a26880756861311cccce6fced0d8828c2aff29"
          git checkout --detach c0a26880756861311cccce6fced0d8828c2aff29
      - name: Install GUI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Reproduce three R3 final failures on untouched production
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1600x1000x24' python -m pytest -q \
            tests/test_phase6_t08_ui_text_and_edge_selectors.py::test_endcap_four_direction_edge_selectors_are_narrowed_and_preserve_semantics \
            tests/test_phase6_t08_ui_text_and_edge_selectors.py::test_fold_designer_controls_and_edge_selectors_update_on_text_size_changed \
            tests/test_phase6_t22_settings_vertical_scroll.py::test_medium_unlocked_settings_uses_real_vertical_scroll_owner_and_scrollable_viewport
