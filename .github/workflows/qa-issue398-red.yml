name: "QA #398 default baseline vault RED"

on:
  push:
    branches:
      - fix/issue398-default-baseline-vault-20260919
    paths:
      - 'tests/test_issue398_default_baseline_vault.py'
      - '.github/workflows/qa-issue398-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4)" = "fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4"
      - name: Install harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Confirm intended startup RED
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue398_default_baseline_vault.py --tb=short | tee /tmp/issue398-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "assert '' == '金庫型'" /tmp/issue398-red.log
          echo "PASS EXPECTED_DEFAULT_BASELINE_RED=1"
