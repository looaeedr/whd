name: WHD｜#532｜C0 Zero Import RED
run-name: "WHD｜#532｜C0 Zero Import RED｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue532-c0-zero-import-red.yml

permissions:
  contents: read

jobs:
  red:
    name: C0 16 個零 consumer import requirement RED
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 pytest
        run: python -m pip install pytest
      - name: 新 requirement 必須先 RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue532_c0_import_alias_cleanup.py > /tmp/issue532-zero-import-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue532-zero-import-red.log
          test "$rc" -ne 0
          grep -E "C0 RED: zero-external-consumer bridge import re-exports remain" /tmp/issue532-zero-import-red.log
          echo "ISSUE532_C0_ZERO_IMPORT_RED=GREEN"
      - name: 上傳 RED 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue532-c0-zero-import-red
          path: /tmp/issue532-zero-import-red.log
          if-no-files-found: error
          retention-days: 14
