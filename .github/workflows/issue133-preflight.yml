name: issue133-preflight
on:
  push:
    branches:
      - work/issue-133-execution-state-machine
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#133 execution state machine legal terminal states durable execution"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_continuous_execution_state_contract.py"
          --evidence ".phase6_issue133_execution_state_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run #133 contract when present
        shell: bash
        run: |
          if [ -f tests/process/test_continuous_execution_state_contract.py ]; then
            python -m pytest tests/process/test_continuous_execution_state_contract.py -q
          else
            echo "contract not yet created; preflight-only pass"
          fi
