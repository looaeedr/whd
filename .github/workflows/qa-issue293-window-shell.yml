name: QA issue293 window shell slice

on:
  push:
    branches:
      - refactor/issue293-window-shell-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run window shell RED
        run: python -m pytest -q tests/test_issue293_t5_window_shell_slice.py

# trigger after workflow registration
