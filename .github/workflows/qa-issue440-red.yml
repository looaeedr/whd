name: "QA #440 wrapper-shell RED"

on:
  push:
    branches:
      - fix/issue440-dark-canvas-background-20260920
    paths:
      - 'tests/test_issue440_no_wrapper_shell.py'
      - '.github/workflows/qa-issue440-red.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 3be16a4d6e9bde6ad4ad74365f718f2b0385db36

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove runtime unchanged from production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA:fold_designer_bridge.py")" = "$(git rev-parse HEAD:fold_designer_bridge.py)"
          test "$(git rev-parse "$BASE_SHA:phase6_assembly_panel.py")" = "$(git rev-parse HEAD:phase6_assembly_panel.py)"
          echo "PRODUCTION_RUNTIME_EDIT=0"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest matplotlib numpy shapely ezdxf
      - name: Exact RED classifier
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xvfb-run -a -s "-screen 0 1280x900x24"             python -m pytest -q tests/test_issue440_no_wrapper_shell.py --tb=short             > issue440-red.log 2>&1
          rc=$?
          set -e
          cat issue440-red.log
          test "$rc" -ne 0
          python - <<'PY'
          from pathlib import Path
          s=Path("issue440-red.log").read_text()
          required=(
              "INTENDED_RED_FIXED_OUTER_WRAPPER_EXISTS",
              "INTENDED_RED_INPUT_NESTED_IN_WRAPPER",
              "INTENDED_RED_LEFT_SCROLL_CANVAS_DEFAULT_BG",
          )
          for marker in required:
              assert marker in s, (marker, s)
          print("ISSUE440_RED_EXACT=1")
          print("EXTRA_CONTENT_WRAPPER_FRAME_COUNT=1")
          print("FIXED_OUTER_CONTENT_EXTENT=1")
          print("MODE_SURFACES_DIRECT_PARENT_IS_LEFT=0")
          print("DEFAULT_TK_CANVAS_BG_LEAK=1")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue440-red
          path: issue440-red.log
          if-no-files-found: error
