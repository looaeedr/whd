name: Issue74 Actual Manufacturing Values
on:
  push:
    branches: [fix/issue74-divider-side-front-penetration]
    paths: [.github/workflows/issue74-actual-values.yml]
jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib -r requirements.txt
      - shell: bash
        run: |
          python - <<'PY'
          import json
          import fold_designer_bridge as bridge
          from tests.test_issue39_divider_relief import _snapshot,_body_part,_divider_part,_divider_insert_joint
          from ae_engine.assembly_collision import build_divider_front_fold_relief_candidate
          from ae_engine.divider_manufacturing import _source_fold_bands_by_geometry_key
          snap=_snapshot(); body=_body_part(snap); divider,dp=_divider_part(snap)
          dims=(snap["w"],snap["h"],snap["d"])
          world=bridge._phase6_build_joint_world_geometry((body,dp),dims,snap["t"])
          contract=dict(dp.render_data.metadata["physical_geometry_contract"])
          core_start=float(contract["core_physical_segment"]["flat_band"][0])
          source_bands=_source_fold_bands_by_geometry_key(body)
          candidate=build_divider_front_fold_relief_candidate(
              _divider_insert_joint(divider.stable_id),
              world_triangles_by_part=world["world_triangles_by_part"],
              mapped_skin_triangles_by_part=world["mapped_skin_triangles_by_part"],
              flat_material_by_part=world["flat_material_by_part"],
              core_start=core_start,
              source_geometry_keys=("box_body:left_side","box_body:right_side"),
              source_fold_bands_by_key=source_bands,
              clearance=0.0,
              sheet_thickness=snap["t"],
          )
          pieces={p.role:p for p in body.render_data.pieces}
          def vals(piece):
              return {str(r.phase6_key):float(r.length) for r in piece.fold_profile}
          left=vals(pieces["left_side"]); right=vals(pieces["right_side"])
          t=float(snap["t"]); half=t/2.0
          fw=float(left["fw_left"])
          authority={
            "left_primary_u":core_start+left["zl2"],
            "left_primary_v":fw+t,
            "left_secondary_center_u":core_start+left["zl2"],
            "left_secondary_u0":core_start+left["zl2"]-half,
            "left_secondary_u1":core_start+left["zl2"]+half,
            "left_secondary_total_v":fw+left["zl1"]+half,
            "left_secondary_extra_v":fw+left["zl1"]+half-(fw+t),
            "right_primary_u":core_start+right["zr2"],
            "right_primary_v":float(right["fw_right"])+t,
          }
          geoms=[candidate.cut_polygon_2d] if candidate.cut_polygon_2d.geom_type=="Polygon" else list(candidate.cut_polygon_2d.geoms)
          coords=[]
          for g in geoms:
              coords.append([(round(float(x),6),round(float(y),6)) for x,y in g.exterior.coords])
          print("ISSUE74_ACTUAL_VALUES="+json.dumps({
            "authority":authority,
            "candidate_bounds":tuple(map(float,candidate.cut_polygon_2d.bounds)),
            "candidate_coords":coords,
            "evidence":candidate.evidence,
          },ensure_ascii=False,default=str))
          PY
