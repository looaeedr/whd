name: issue136-preflight
on:
  push:
    branches:
      - work/issue-136-checkpoint-resume
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#136 checkpoint resume hard blocker durable execution"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_checkpoint_resume_contract.py"
          --evidence ".phase6_issue136_checkpoint_resume_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run execution governance regression
        run: >-
          python -m pytest -q
          tests/process/test_checkpoint_resume_contract.py
          tests/process/test_fail_recovery_contract.py
          tests/process/test_remote_qa_state_bridge_contract.py
          tests/process/test_continuous_execution_state_contract.py
          tests/process/test_continuous_execution_durable_contract.py
          tests/process/test_monitoring_remote_qa_turn_boundary_contract.py
          tests/test_dispatching_skill_timeout_contract.py
          tests/test_issue_closure_completion_skill_contract.py
