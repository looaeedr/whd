name: "QA #450 T8 Combined Acceptance"

on:
  push:
    branches:
      - qa/issue450-t8-combined-acceptance-20260921
    paths:
      - 'docs/superpowers/checkpoints/issue450-t8-preflight-evidence.txt'
      - '.github/workflows/qa-issue450-t8-combined-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  T0_BASELINE_SHA: 2b9aeccee2c91446ca02cbfe9fdcefee587ba29e
  ACCEPTED_T7_SHA: 1faebaa991aaaed7b968c5432bfc7e04ab32b432

jobs:
  focused-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "派工 #450 T8 Combined Acceptance：固定 T0 baseline vs candidate 的 Headless A/B、Xvfb A/B、source ownership scan、root phase6 reverse-import bridge guard、composition-root/facade ratchet、shared-content exact tests、geometry/manufacturing/persistence regression、tracked DXF Git-object manifest/digest、config.ini invariant、stale structural-test classifier、protected drift audit、R1-R9 final classifier。" \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/process/test_issue426_phase5_t5_bridge_compression.py \
            --changed-file tests/test_issue125_inspector_property_panel.py \
            --changed-file tests/test_issue338_contrast_readability.py \
            --changed-file tests/test_issue339_corner_presentation_fail_closed.py \
            --changed-file tests/test_issue369_t5_corner_data_view_owner.py \
            --changed-file docs/superpowers/checkpoints/issue450-t8-preflight-evidence.txt \
            --changed-file .github/workflows/qa-issue450-t8-combined-acceptance.yml \
            --evidence docs/superpowers/checkpoints/issue450-t8-preflight-evidence.txt

      - name: Bind exact candidate lineage and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ACCEPTED_T7_SHA" "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_T7_SHA"...HEAD)
          printf '%s\n' "${changed[@]}" | sort | tee /tmp/issue450-scope.txt
          python - <<'PY'
          from pathlib import Path
          actual={x for x in Path('/tmp/issue450-scope.txt').read_text().splitlines() if x}
          allowed={
              'fold_designer_bridge.py',
              'tests/process/test_issue426_phase5_t5_bridge_compression.py',
              'tests/test_issue125_inspector_property_panel.py',
              'tests/test_issue338_contrast_readability.py',
              'tests/test_issue339_corner_presentation_fail_closed.py',
              'tests/test_issue369_t5_corner_data_view_owner.py',
              'docs/superpowers/checkpoints/issue450-t8-preflight-evidence.txt',
              '.github/workflows/qa-issue450-t8-combined-acceptance.yml',
          }
          unexpected=sorted(actual-allowed)
          assert not unexpected, f'ISSUE450_SCOPE_DRIFT={unexpected}'
          print('ISSUE450_SCOPE_DRIFT=0')
          print(f'ISSUE450_CHANGED_FILES={len(actual)}')
          PY

      - name: Source ownership, composition-root and facade ratchet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root=Path('.')
          bridge=root/'fold_designer_bridge.py'
          text=bridge.read_text(encoding='utf-8')
          tree=ast.parse(text, filename=str(bridge))

          reverse=[]
          phase6_files=sorted(root.glob('phase6_*.py'))
          for path in phase6_files:
              t=ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              imports=[]
              for node in ast.walk(t):
                  if isinstance(node, ast.Import):
                      imports.extend(a.name for a in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.append(node.module)
              bad=[x for x in imports if x=='fold_designer_bridge' or x.startswith('fold_designer_bridge.')]
              if bad:
                  reverse.append((str(path),bad))
          assert not reverse, f'PHASE6_REVERSE_IMPORT_BRIDGE={reverse}'

          facade_calls=[]
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              name=node.func.id if isinstance(node.func, ast.Name) else (
                  node.func.attr if isinstance(node.func, ast.Attribute) else ''
              )
              if name=='install_fold_designer_bridge_facade':
                  facade_calls.append(node)
          assert len(facade_calls)==1
          dict_args=[a for a in facade_calls[0].args if isinstance(a, ast.Dict)]
          assert len(dict_args)==1
          facade_count=len(dict_args[0].keys)
          assert facade_count <= 69, f'FACADE_RATCHET={facade_count}>69'
          assert facade_count <= 70

          fix10_callers=[]
          for node in tree.body:
              if not isinstance(node, ast.FunctionDef):
                  continue
              count=sum(
                  1 for c in ast.walk(node)
                  if isinstance(c, ast.Call)
                  and isinstance(c.func, ast.Name)
                  and c.func.id=='_FIX10_INIT'
              )
              if count:
                  fix10_callers.append((node.name,count))
          assert fix10_callers == [('_fix11_init',1)], fix10_callers
          assert not (root/'phase6_workspace_shell.py').exists()
          assert not (root/'phase6_part_editor_session.py').exists()

          defs={
              n.name for n in tree.body
              if isinstance(n,(ast.FunctionDef,ast.ClassDef))
          }
          assert '_phase6_build_box_symmetry_settings' not in defs
          assert '_phase6_build_assembly_settings' not in defs
          assert 'Phase6BendingUI' not in defs

          root_fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='_fix11_init')
          root_body=ast.get_source_segment(text,root_fn) or ''
          forbidden=(
              'Phase6DesignerWorkspace.from_snapshot',
              'Phase6BendingUI(',
              'Phase6AssemblyPanel(',
              'Phase6SettingsPanel(',
              'Phase6FinalSceneRenderer(',
              'Phase6FinalSceneView(',
              'Phase6RegistryDiagnosticsPanel(',
              'original.ttk.Frame(',
              'original.tk.StringVar(',
              'original.ttk.Treeview(',
              'original.ttk.Notebook(',
          )
          found=[x for x in forbidden if x in root_body]
          assert not found, found

          print(f'PHASE6_ROOT_MODULE_COUNT={len(phase6_files)}')
          print('PHASE6_REVERSE_IMPORT_BRIDGE_COUNT=0')
          print('SECOND_COMPOSITION_ROOT=0')
          print(f'FACADE_BINDING_COUNT={facade_count}')
          print('FACADE_RATCHET=GREEN')
          print('R1_DEAD_GLUE_ABSENT=1')
          print('R2_R3_BENDING_OWNER_SOURCE_STATE=1')
          print('R8_FIX11_BOOTSTRAP_SOURCE_STATE=1')
          PY

      - name: Fixed-T0 DXF and config Git-object identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, subprocess

          BASE='2b9aeccee2c91446ca02cbfe9fdcefee587ba29e'
          CAND=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()

          def git_bytes(*args):
              return subprocess.check_output(['git',*args])
          def git_text(*args):
              return subprocess.check_output(['git',*args],text=True,encoding='utf-8',errors='surrogateescape')
          def paths(ref):
              raw=git_bytes('ls-tree','-r','--name-only','-z',ref)
              return sorted(x.decode('utf-8','surrogateescape') for x in raw.split(b'\0') if x)
          def oid(ref,path):
              return git_text('rev-parse',f'{ref}:{path}').strip()
          def data(ref,path):
              return git_bytes('show',f'{ref}:{path}')
          def sha(b):
              return hashlib.sha256(b).hexdigest()
          def dxf_manifest(ref):
              rows=[]
              lines=[]
              for p in [p for p in paths(ref) if p.lower().endswith('.dxf')]:
                  b=data(ref,p); o=oid(ref,p); h=sha(b)
                  rows.append((p,len(b),h,o))
                  lines.append(f'{p}\t{len(b)}\t{h}\t{o}')
              agg=sha(('\n'.join(lines)+'\n').encode()) if lines else sha(b'')
              return rows,agg

          b_rows,b_agg=dxf_manifest(BASE)
          c_rows,c_agg=dxf_manifest(CAND)
          assert b_rows==c_rows, {
              'baseline_only': sorted(set(b_rows)-set(c_rows)),
              'candidate_only': sorted(set(c_rows)-set(b_rows)),
          }
          assert b_agg=='a96920189cd8ca149829ebc12d694981d1e97a6e925f87efc2f094c6c7483970'
          assert c_agg==b_agg, (b_agg,c_agg)

          b_cfg=data(BASE,'config.ini')
          c_cfg=data(CAND,'config.ini')
          assert b_cfg==c_cfg
          assert sha(b_cfg)=='980eab68d4a1732a5313b22329852dfc9691c83e4e2a64cccd18022afae4ee67'

          print(f'TRACKED_DXF_PATHS={len(b_rows)}')
          print(f'DXF_GIT_OBJECT_AGGREGATE_SHA256={c_agg}')
          print('DXF_GIT_OBJECT_PATH_BLOB_HASH_DELTA=0')
          print('CONFIG_GIT_OBJECT_DELTA=0')
          PY

      - name: Accepted R1-R8 owner contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_issue443_t1_dead_glue.py \
            tests/test_issue444_bending_ui_owner.py \
            tests/test_issue445_settings_presentation_owner.py \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            tests/test_issue447_workspace_shell_owner.py \
            tests/test_issue448_part_editor_owner_decision.py \
            tests/test_issue449_fix11_init_bootstrap_owner.py \
            | tee /tmp/issue450-owner-contracts.log
          echo 'R1_R8_OWNER_CONTRACTS=GREEN'

      - name: Shared-content exact Xvfb contracts
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q --tb=short \
            tests/test_issue431_shared_content_host.py \
            tests/test_issue432_general_part_shared_host.py \
            tests/test_issue433_assembly_shared_host.py \
            tests/test_issue434_corner_data_shared_host.py \
            tests/test_issue439_single_physical_content_host.py \
            tests/test_issue440_no_wrapper_shell.py \
            tests/test_issue447_workspace_shell_owner.py \
            | tee /tmp/issue450-shared-content.log
          echo 'ACTIVE_MODE_SURFACE_COUNT=1'
          echo 'SHARED_CONTENT_DUPLICATE_REGION_TREE_BINDING=0'

      - name: Geometry manufacturing persistence focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_dxf_acceptance.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_manufacturing_api_finished_face_contract.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_phase6_project_controller.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_project_ownership.py \
            tests/test_phase6_project_session.py \
            | tee /tmp/issue450-geometry-persistence.log
          echo 'GEOMETRY_DATAFLOW_PERSISTENCE_FOCUSED=GREEN'

      - name: Protected tree remains clean after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'VALIDATION_MUTATION_DRIFT=0'

  headless-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Create fixed T0 worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue450-t0 "$T0_BASELINE_SHA"
      - name: Run fixed T0 headless
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/issue450-headless
          set +e
          (
            cd /tmp/issue450-t0
            python -m pytest -q -ra --tb=short --junitxml=/tmp/issue450-headless/base.xml tests
          ) 2>&1 | tee /tmp/issue450-headless/base.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > /tmp/issue450-headless/base.rc
          echo "HEADLESS_BASE_RC=$rc"
      - name: Run candidate headless
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m pytest -q -ra --tb=short --junitxml=/tmp/issue450-headless/candidate.xml tests \
            2>&1 | tee /tmp/issue450-headless/candidate.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > /tmp/issue450-headless/candidate.rc
          echo "HEADLESS_CANDIDATE_RC=$rc"
      - name: Compare headless failure and error identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def parse(path):
              root=ET.parse(path).getroot()
              failed=set(); errors=set(); skipped=set(); total=0
              records={}
              for tc in root.iter('testcase'):
                  total += 1
                  key=f"{tc.attrib.get('classname','')}::{tc.attrib.get('name','')}"
                  if tc.find('failure') is not None:
                      failed.add(key); records[key]='failure'
                  elif tc.find('error') is not None:
                      errors.add(key); records[key]='error'
                  elif tc.find('skipped') is not None:
                      skipped.add(key); records[key]='skipped'
              return {'total':total,'failed':sorted(failed),'errors':sorted(errors),'skipped':sorted(skipped)}

          base=parse('/tmp/issue450-headless/base.xml')
          cand=parse('/tmp/issue450-headless/candidate.xml')
          candidate_only_fail=sorted(set(cand['failed'])-set(base['failed']))
          candidate_only_error=sorted(set(cand['errors'])-set(base['errors']))

          def structural(key):
              classname=key.split('::',1)[0]
              parts=classname.split('.')
              candidates=[]
              for n in range(len(parts),0,-1):
                  p=Path(*parts[:n]).with_suffix('.py')
                  if p.exists():
                      candidates.append(p)
              if not candidates:
                  return {'node':key,'class':'CANDIDATE_REGRESSION','path':None}
              p=candidates[0]
              text=p.read_text(encoding='utf-8',errors='replace')
              structural_markers=('fold_designer_bridge.py','bridge.__file__','ast.parse(','read_text(')
              cls='STALE_STRUCTURAL_CANDIDATE_ONLY' if any(m in text for m in structural_markers) else 'CANDIDATE_REGRESSION'
              return {'node':key,'class':cls,'path':str(p)}

          payload={
              'base':base,
              'candidate':cand,
              'candidate_only_failures':candidate_only_fail,
              'candidate_only_errors':candidate_only_error,
              'stale_structural_classifier':[structural(x) for x in candidate_only_fail+candidate_only_error],
          }
          Path('/tmp/issue450-headless/ab.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'base_total':base['total'],
              'candidate_total':cand['total'],
              'base_failed':len(base['failed']),
              'candidate_failed':len(cand['failed']),
              'base_errors':len(base['errors']),
              'candidate_errors':len(cand['errors']),
              'candidate_only_failures':candidate_only_fail,
              'candidate_only_errors':candidate_only_error,
          },indent=2))
          assert not candidate_only_fail, f'CANDIDATE_ONLY_HEADLESS_FAILURES={candidate_only_fail}'
          assert not candidate_only_error, f'CANDIDATE_ONLY_HEADLESS_ERRORS={candidate_only_error}'
          print('CANDIDATE_ONLY_HEADLESS_FAILURES=[]')
          print('CANDIDATE_ONLY_HEADLESS_ERRORS=[]')
          PY
      - name: Verify A/B worktrees clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/issue450-t0 diff --exit-code
          test -z "$(git -C /tmp/issue450-t0 status --porcelain)"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Upload headless A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue450-headless-ab
          path: /tmp/issue450-headless
          if-no-files-found: error

  xvfb-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Create fixed T0 worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue450-t0 "$T0_BASELINE_SHA"
      - name: Run fixed T0 Xvfb
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/issue450-xvfb
          set +e
          (
            cd /tmp/issue450-t0
            xvfb-run -a python -m pytest -q -ra --tb=short --junitxml=/tmp/issue450-xvfb/base.xml tests
          ) 2>&1 | tee /tmp/issue450-xvfb/base.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > /tmp/issue450-xvfb/base.rc
          echo "XVFB_BASE_RC=$rc"
      - name: Run candidate Xvfb
        shell: bash
        run: |
          set -uo pipefail
          set +e
          xvfb-run -a python -m pytest -q -ra --tb=short --junitxml=/tmp/issue450-xvfb/candidate.xml tests \
            2>&1 | tee /tmp/issue450-xvfb/candidate.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > /tmp/issue450-xvfb/candidate.rc
          echo "XVFB_CANDIDATE_RC=$rc"
      - name: Compare Xvfb failure and error identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def parse(path):
              root=ET.parse(path).getroot()
              failed=set(); errors=set(); skipped=set(); total=0
              for tc in root.iter('testcase'):
                  total += 1
                  key=f"{tc.attrib.get('classname','')}::{tc.attrib.get('name','')}"
                  if tc.find('failure') is not None: failed.add(key)
                  elif tc.find('error') is not None: errors.add(key)
                  elif tc.find('skipped') is not None: skipped.add(key)
              return {'total':total,'failed':sorted(failed),'errors':sorted(errors),'skipped':sorted(skipped)}

          base=parse('/tmp/issue450-xvfb/base.xml')
          cand=parse('/tmp/issue450-xvfb/candidate.xml')
          candidate_only_fail=sorted(set(cand['failed'])-set(base['failed']))
          candidate_only_error=sorted(set(cand['errors'])-set(base['errors']))

          def structural(key):
              classname=key.split('::',1)[0]
              parts=classname.split('.')
              path=None
              for n in range(len(parts),0,-1):
                  p=Path(*parts[:n]).with_suffix('.py')
                  if p.exists():
                      path=p; break
              if path is None:
                  return {'node':key,'class':'CANDIDATE_REGRESSION','path':None}
              text=path.read_text(encoding='utf-8',errors='replace')
              markers=('fold_designer_bridge.py','bridge.__file__','ast.parse(','read_text(')
              cls='STALE_STRUCTURAL_CANDIDATE_ONLY' if any(m in text for m in markers) else 'CANDIDATE_REGRESSION'
              return {'node':key,'class':cls,'path':str(path)}

          payload={
              'base':base,
              'candidate':cand,
              'candidate_only_failures':candidate_only_fail,
              'candidate_only_errors':candidate_only_error,
              'stale_structural_classifier':[structural(x) for x in candidate_only_fail+candidate_only_error],
          }
          Path('/tmp/issue450-xvfb/ab.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'base_total':base['total'],
              'candidate_total':cand['total'],
              'base_failed':len(base['failed']),
              'candidate_failed':len(cand['failed']),
              'base_errors':len(base['errors']),
              'candidate_errors':len(cand['errors']),
              'candidate_only_failures':candidate_only_fail,
              'candidate_only_errors':candidate_only_error,
          },indent=2))
          assert not candidate_only_fail, f'CANDIDATE_ONLY_XVFB_FAILURES={candidate_only_fail}'
          assert not candidate_only_error, f'CANDIDATE_ONLY_XVFB_ERRORS={candidate_only_error}'
          print('CANDIDATE_ONLY_XVFB_FAILURES=[]')
          print('CANDIDATE_ONLY_XVFB_ERRORS=[]')
          PY
      - name: Verify A/B worktrees clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/issue450-t0 diff --exit-code
          test -z "$(git -C /tmp/issue450-t0 status --porcelain)"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Upload Xvfb A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue450-xvfb-ab
          path: /tmp/issue450-xvfb
          if-no-files-found: error

  final-classifier:
    if: always()
    needs: [focused-invariants, headless-ab, xvfb-ab]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOCUSED_RESULT: ${{ needs.focused-invariants.result }}
      HEADLESS_RESULT: ${{ needs.headless-ab.result }}
      XVFB_RESULT: ${{ needs.xvfb-ab.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit R1-R9 final classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue450-final
          python - <<'PY'
          import json, os
          from pathlib import Path

          prereq={
              'focused_invariants':os.environ['FOCUSED_RESULT'],
              'headless_ab':os.environ['HEADLESS_RESULT'],
              'xvfb_ab':os.environ['XVFB_RESULT'],
          }
          all_green=all(v=='success' for v in prereq.values())
          result={
              'schema':'WHD_ISSUE450_T8_FINAL_CLASSIFIER_V1',
              'candidate_head':os.environ.get('GITHUB_SHA'),
              'fixed_t0_baseline':'2b9aeccee2c91446ca02cbfe9fdcefee587ba29e',
              'prerequisites':prereq,
              'R1':all_green,
              'R2':all_green,
              'R3':all_green,
              'R4':all_green,
              'R5':all_green,
              'R6':all_green,
              'R7':all_green,
              'R8':all_green,
              'R9':all_green,
              'decision':'GREEN' if all_green else 'RED',
          }
          Path('/tmp/issue450-final/classifier.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not all_green:
              raise SystemExit(f'ISSUE450_FINAL_CLASSIFIER_RED={prereq}')
          for n in range(1,10):
              print(f'R{n}_SATISFIED=1')
          print('ISSUE450_T8_COMBINED_ACCEPTANCE=GREEN')
          PY
      - name: Upload final classifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue450-t8-final-classifier
          path: /tmp/issue450-final
          if-no-files-found: error
