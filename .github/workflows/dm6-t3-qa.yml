name: DM6 T3 Acceptance QA

on:
  push:
    branches:
      - work/dm6-t3-sink-semantic-parity
    paths:
      - .github/workflows/dm6-t3-qa.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib
          python -m pip install -r requirements.txt
      - name: T3 focused acceptance
        run: |
          python -m pytest -q             tests/test_dm6_sink_semantic_parity.py             tests/test_engineering_drawing_integration.py             tests/test_dm6_layout_semantic_identity.py             tests/test_phase6_2d_3d_round_trip.py
      - name: Compile sink modules
        run: |
          python -m py_compile gui.py ae_engine/engineering_drawing.py ae_engine/drawing_annotation_layout.py ae_engine/drawing_annotations.py
      - name: Sink authority source guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('gui.py').read_text(encoding='utf-8')
          start=text.index('def _draw_phase6_annotation_projection')
          end=text.index('def _draw_phase6_corner_dimension_overlay', start)
          src=text[start:end]
          forbidden=['dimensions_by_label', 'get(str(primitive.text)', 'item.label']
          hits=[x for x in forbidden if x in src]
          if hits:
              raise SystemExit(f'2D sink still reconstructs semantic ownership from display text: {hits}')
          if 'semantic_id' not in src:
              raise SystemExit('2D sink does not consume semantic_id')
          PY
