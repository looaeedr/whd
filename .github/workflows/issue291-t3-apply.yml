name: Issue 291 T3 Apply

on:
  push:
    branches:
      - refactor/issue291-gui-phase2-t3-selector-20260916

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue291-gui-phase2-t3-selector-20260916
          fetch-depth: 0

      - name: Apply focused T3 extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          gui_path = root / 'gui.py'
          text = gui_path.read_text(encoding='utf-8')

          import_anchor = '''from gui_modules.part_panels import (
              _phase6_logical_part_present as _phase6_logical_part_present_impl,
          )

          from gui_modules.render_2d import (
          '''
          import_replacement = '''from gui_modules.part_panels import (
              _phase6_logical_part_present as _phase6_logical_part_present_impl,
          )

          from gui_modules.parts.selector import (
              refresh_presence_ui as _refresh_presence_ui_impl,
          )
          from gui_modules.parts.subtabs import (
              build_box_body_piece_selector,
              box_body_piece_label as _box_body_piece_label_impl,
              box_body_piece_face_key as _box_body_piece_face_key_impl,
              refresh_box_body_piece_tabs_2d as _refresh_box_body_piece_tabs_2d_impl,
              on_box_body_piece_2d_tab_changed as _on_box_body_piece_2d_tab_changed_impl,
              on_box_body_piece_double_click as _on_box_body_piece_double_click_impl,
          )

          from gui_modules.render_2d import (
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)

          presence_start = text.index('    def _phase6_refresh_presence_ui(self, existing_parts=None):')
          presence_end = text.index('    def create_separator(self, parent):', presence_start)
          text = (
              text[:presence_start]
              + '''    def _phase6_refresh_presence_ui(self, existing_parts=None):
              return _refresh_presence_ui_impl(self, existing_parts)

          '''
              + text[presence_end:]
          )

          inline_tabs = '''        # 多件式箱身只占一個頂層「箱身」，物理子板件用第二層標籤切換。
              self.box_body_piece_tabs = ttk.Notebook(self.tab_z, height=1)
              self.box_body_piece_tabs.bind(
                  "<<NotebookTabChanged>>", self._on_box_body_piece_2d_tab_changed
              )
          '''
          inline_tabs_replacement = '''        # 多件式箱身只占一個頂層「箱身」，物理子板件用第二層標籤切換。
              self.box_body_piece_tabs = build_box_body_piece_selector(self, self.tab_z)
          '''
          if text.count(inline_tabs) != 1:
              raise SystemExit(f'inline tabs anchor count={text.count(inline_tabs)}')
          text = text.replace(inline_tabs, inline_tabs_replacement, 1)

          subtabs_start = text.index('    @staticmethod\n    def _box_body_piece_label(part_key):')
          subtabs_end = text.index('    def _draw_box_body_piece_preview', subtabs_start)
          text = (
              text[:subtabs_start]
              + '''    @staticmethod
              def _box_body_piece_label(part_key):
                  return _box_body_piece_label_impl(part_key)

              @staticmethod
              def _box_body_piece_face_key(part_key):
                  return _box_body_piece_face_key_impl(part_key)

              def _refresh_box_body_piece_tabs_2d(self, render_data):
                  return _refresh_box_body_piece_tabs_2d_impl(self, render_data)

              def _on_box_body_piece_2d_tab_changed(self, event=None):
                  return _on_box_body_piece_2d_tab_changed_impl(self, event)

              def on_box_body_piece_double_click(self, event=None):
                  return _on_box_body_piece_double_click_impl(self, event)

          '''
              + text[subtabs_end:]
          )
          gui_path.write_text(text, encoding='utf-8')

          parts = root / 'gui_modules' / 'parts'
          parts.mkdir(parents=True, exist_ok=True)
          (parts / '__init__.py').write_text(
              '"""Focused part selector/navigation presentation helpers."""\n',
              encoding='utf-8',
          )

          (parts / 'selector.py').write_text('''"""Part-presence presentation with no authoritative state ownership."""

          import tkinter as tk


          def refresh_presence_ui(host, supplied_parts=None):
              """Project authoritative physical presence into legacy result/output controls."""
              present = set(supplied_parts) if supplied_parts is not None else host._phase6_current_existing_parts()
              present.add("box_body")

              result_groups = getattr(host, "_phase6_result_part_rows", {}) or {}
              visibility = {
                  "box_body": host._phase6_logical_part_present(present, "box_body"),
                  "endcap": bool({"head", "tail"} & present),
                  "door": host._phase6_logical_part_present(present, "door"),
                  "base_plate": host._phase6_logical_part_present(present, "base_plate"),
                  "indicator_box": "indicator_box" in present,
                  "indicator_door": "indicator_door" in present,
              }
              for group in ("box_body", "endcap", "door", "base_plate", "indicator_box", "indicator_door"):
                  for row in result_groups.get(group, ()):
                      row.pack_forget()
                      if visibility[group]:
                          row.pack(fill=tk.X, pady=6, padx=10)

              output_widgets = getattr(host, "_phase6_output_part_widgets", {}) or {}
              output_order = (
                  "box_body", "head", "tail", "door", "base_plate", "indicator_box", "indicator_door"
              )
              for widget in output_widgets.values():
                  widget.pack_forget()
              visible_keys = [
                  key for key in output_order
                  if host._phase6_logical_part_present(present, key) and key in output_widgets
              ]
              for index, key in enumerate(visible_keys):
                  pady = (6, 1) if index == 0 else (
                      (1, 6) if index == len(visible_keys) - 1 else (1, 1)
                  )
                  output_widgets[key].pack(anchor=tk.W, padx=10, pady=pady)

              if not visibility["endcap"]:
                  host.result_y_w_var.set("-"); host.result_y_d_var.set("-")
              if not visibility["door"]:
                  host.result_door_w_var.set("-"); host.result_door_h_var.set("-")
              if not visibility["base_plate"]:
                  host.result_base_plate_w_var.set("-"); host.result_base_plate_h_var.set("-")
              if not visibility["indicator_box"]:
                  host.result_ib_w_var.set("-"); host.result_ib_h_var.set("-")
              if not visibility["indicator_door"]:
                  host.result_ib_door_w_var.set("-"); host.result_ib_door_h_var.set("-")
              return present
          ''', encoding='utf-8')

          (parts / 'subtabs.py').write_text('''"""Box-body physical-subtab presentation and event routing."""

          import tkinter as tk
          from tkinter import ttk


          def build_box_body_piece_selector(host, parent):
              """Build the transient physical-piece selector; host remains routing owner."""
              notebook = ttk.Notebook(parent, height=1)
              notebook.bind("<<NotebookTabChanged>>", host._on_box_body_piece_2d_tab_changed)
              return notebook


          def box_body_piece_label(part_key):
              return {
                  "box_body:left_side": "左側板",
                  "box_body:back": "後面板",
                  "box_body:right_side": "右側板",
                  "box_body:left": "左箱身",
                  "box_body:middle": "中箱身",
                  "box_body:right": "右箱身",
              }.get(str(part_key or ""), str(part_key or ""))


          def box_body_piece_face_key(part_key):
              return {
                  "box_body:left_side": "left",
                  "box_body:back": "back",
                  "box_body:right_side": "right",
              }.get(str(part_key or ""))


          def refresh_box_body_piece_tabs_2d(host, render_data):
              pieces = tuple(getattr(render_data, "pieces", ()) or ())
              keys = tuple(
                  f"box_body:{str(getattr(piece, 'role', '') or '').strip()}"
                  for piece in pieces
                  if str(getattr(piece, "role", "") or "").strip()
              )
              notebook = getattr(host, "box_body_piece_tabs", None)
              if notebook is None:
                  return ""
              if len(keys) <= 1:
                  if notebook.winfo_manager():
                      notebook.pack_forget()
                  host._box_body_piece_2d_tab_keys = keys
                  return ""

              current = tuple(getattr(host, "_box_body_piece_2d_tab_keys", ()) or ())
              if current != keys:
                  host._box_body_piece_2d_tab_guard = True
                  try:
                      for tab_id in tuple(notebook.tabs()):
                          try:
                              widget = host.root.nametowidget(tab_id)
                          except Exception:
                              widget = None
                          notebook.forget(tab_id)
                          if widget is not None:
                              try:
                                  widget.destroy()
                              except Exception:
                                  pass
                      tab_map = {}
                      for key in keys:
                          frame = ttk.Frame(notebook)
                          notebook.add(frame, text=box_body_piece_label(key))
                          tab_map[str(frame)] = key
                      host._box_body_piece_2d_tab_map = tab_map
                      host._box_body_piece_2d_tab_keys = keys
                  finally:
                      host._box_body_piece_2d_tab_guard = False

              selected = str(host.box_body_piece_2d_selected_var.get() or "")
              desired = selected if selected in keys else (
                  "box_body:back" if "box_body:back" in keys else keys[0]
              )
              if selected != desired:
                  host.box_body_piece_2d_selected_var.set(desired)
              tab_map = dict(getattr(host, "_box_body_piece_2d_tab_map", {}) or {})
              target = next(
                  (tab_id for tab_id in notebook.tabs() if tab_map.get(str(tab_id)) == desired),
                  None,
              )
              if target is not None and str(notebook.select()) != str(target):
                  host._box_body_piece_2d_tab_guard = True
                  try:
                      notebook.select(target)
                  finally:
                      host._box_body_piece_2d_tab_guard = False
              if not notebook.winfo_manager():
                  notebook.pack(
                      fill=tk.X, padx=10, pady=(0, 2),
                      before=host.box_body_canvas_frame,
                  )
              face_key = box_body_piece_face_key(desired)
              if face_key is not None:
                  host.box_body_face_selected_var.set(face_key)
              return desired


          def on_box_body_piece_2d_tab_changed(host, _event=None):
              if bool(getattr(host, "_box_body_piece_2d_tab_guard", False)):
                  return None
              notebook = getattr(host, "box_body_piece_tabs", None)
              if notebook is None:
                  return None
              key = dict(getattr(host, "_box_body_piece_2d_tab_map", {}) or {}).get(
                  str(notebook.select())
              )
              if not key:
                  return None
              host.box_body_piece_2d_selected_var.set(key)
              face_key = box_body_piece_face_key(key)
              if face_key is not None:
                  host.box_body_face_selected_var.set(face_key)
              return host.draw_preview()


          def on_box_body_piece_double_click(host, _event=None):
              piece_var = getattr(host, "box_body_piece_2d_selected_var", None)
              key = str(piece_var.get() if piece_var is not None else "")
              face_key = box_body_piece_face_key(key)
              if face_key is None:
                  return None
              host.open_box_body_face_editor(face_key)
              return "break"
          ''', encoding='utf-8')
          PY

      - name: Verify structural GREEN
        shell: bash
        run: |
          python -m py_compile gui.py gui_modules/parts/selector.py gui_modules/parts/subtabs.py
          pytest -q tests/test_issue291_gui_phase2_t3_selector.py

      - name: Commit GREEN extraction and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue291-t3-apply.yml
          git add gui.py gui_modules/parts docs/superpowers/plans/2026-09-16-issue291-t3-selector.md
          git commit -m "refactor(#291): extract selector and box body subtabs"
          git push origin HEAD:refactor/issue291-gui-phase2-t3-selector-20260916
