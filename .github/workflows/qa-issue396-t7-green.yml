name: "QA #396 T7 GREEN composition root"

on:
  push:
    branches:
      - "refactor/issue396-phase4-t7-composition-root-20260920"
    paths:
      - "gui_modules/application/fold_designer_adapter.py"
      - "fold_designer_bridge.py"
      - "tests/test_issue396_phase4_composition_root.py"
      - ".github/workflows/qa-issue396-t7-green.yml"

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=396"
          echo "PREDECESSOR=f5b3bd7ad64d9c4d18e676296a95de67de34b94e"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor f5b3bd7ad64d9c4d18e676296a95de67de34b94e HEAD

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Compile T7 composition sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             gui_modules/application/fold_designer_adapter.py             fold_designer_bridge.py             phase6_settings_service.py             phase6_settings_transaction_controller.py             phase6_final_scene_renderer.py             phase6_final_scene_view.py
          echo "ISSUE396_T7_COMPILE_GREEN=1"

      - name: T7 composition ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue396_phase4_composition_root.py             --tb=short
          echo "ISSUE396_T7_COMPOSITION_GREEN=1"

      - name: Settings ownership and semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue392_settings_service.py             tests/test_issue391_settings_transitions.py             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue366_t2a_settings_stage_controller.py             tests/test_issue366_t2b_structure_endcap_controller.py             tests/test_issue366_t2c_corner_external_controller.py             tests/test_issue366_t2d_family_width_controller.py             --tb=short
          echo "ISSUE396_T7_SETTINGS_GREEN=1"

      - name: Final Scene ownership and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue393_final_scene_contracts.py             tests/test_issue394_final_scene_projection.py             tests/test_issue395_final_scene_renderer.py             tests/test_phase6_final_scene_view_ownership.py             tests/test_phase6_3d_cutting_mesh.py             tests/test_phase6_assembly_3d_view.py             tests/test_joint_diagnostics_contract.py             --tb=short
          echo "ISSUE396_T7_FINAL_SCENE_GREEN=1"

      - name: Settings predecessor semantic A-B
        shell: bash
        run: |
          set -euo pipefail
          base=f5b3bd7ad64d9c4d18e676296a95de67de34b94e
          candidate_root="$PWD"
          rm -rf /tmp/issue396-base
          git worktree add --detach /tmp/issue396-base "$base"
          (
            cd /tmp/issue396-base
            export PYTHONPATH="$PWD"
            cp "$candidate_root/tools/issue391_t2_semantic_probe.py" ./issue396_settings_probe.py
            python ./issue396_settings_probe.py > /tmp/issue396-settings-base.json
          )
          PYTHONPATH="$candidate_root"             python tools/issue391_t2_semantic_probe.py             > /tmp/issue396-settings-candidate.json
          python -m json.tool /tmp/issue396-settings-base.json > /tmp/issue396-settings-base.pretty
          python -m json.tool /tmp/issue396-settings-candidate.json > /tmp/issue396-settings-candidate.pretty
          diff -u /tmp/issue396-settings-base.pretty /tmp/issue396-settings-candidate.pretty
          echo "UNEXPLAINED_SETTINGS_DELTA=0"

      - name: Structural composition gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          bridge_path=Path("fold_designer_bridge.py")
          bridge=bridge_path.read_text(encoding="utf-8")
          tree=ast.parse(bridge,filename=str(bridge_path))

          constructors=(
              "Phase6SettingsTransactionService(",
              "Phase6SettingsTransactionController(",
              "Phase6FinalSceneRenderer(",
              "Phase6FinalSceneViewAdapter(",
              "FinalSceneDependencies(",
          )
          remaining=[x for x in constructors if x in bridge]
          assert not remaining,remaining

          direct=[]
          for node in ast.walk(tree):
              if not isinstance(node,(ast.Assign,ast.AnnAssign,ast.AugAssign)):
                  continue
              targets=node.targets if isinstance(node,ast.Assign) else [node.target]
              for target in targets:
                  if (
                      isinstance(target,ast.Attribute)
                      and isinstance(target.value,ast.Name)
                      and target.value.id=="Phase6FoldDesignerApp"
                  ):
                      direct.append((target.attr,getattr(node,"lineno",0)))
          assert not direct,direct

          facade_calls=[
              n for n in ast.walk(tree)
              if isinstance(n,ast.Call)
              and isinstance(n.func,ast.Name)
              and n.func.id=="install_fold_designer_bridge_facade"
          ]
          assert len(facade_calls)==1,len(facade_calls)
          dicts=[a for a in facade_calls[0].args if isinstance(a,ast.Dict)]
          assert len(dicts)==1
          binding_count=len(dicts[0].keys)
          assert binding_count <= 70,binding_count

          assert "controller.bind_state(" not in bridge
          assert "_phase6_sync_settings_transaction_compatibility_mirrors" not in bridge
          assert "_phase6_sync_final_scene_view_compatibility_mirrors" not in bridge

          print("SETTINGS_BRIDGE_REBIND=0")
          print("SETTINGS_SCALAR_MIRROR_WRITES=0")
          print("FINAL_SCENE_OWNER_DEREF=0")
          print("FINAL_SCENE_DYNAMIC_SERVICE_LOOKUP=0")
          print("FINAL_SCENE_BRIDGE_MIRROR=0")
          print("DIRECT_CLASS_WIRING=0")
          print("FACADE_BINDING_COUNT="+str(binding_count))
          print("FACADE_BINDINGS_GROWTH=0")
          PY

      - name: Scope and protected drift
        shell: bash
        run: |
          set -euo pipefail
          base=f5b3bd7ad64d9c4d18e676296a95de67de34b94e
          git diff --name-only "$base"...HEAD | sort | tee /tmp/issue396-changed
          python - <<'PY'
          from pathlib import Path
          changed=set(Path("/tmp/issue396-changed").read_text().splitlines())
          allowed={
            "gui_modules/application/fold_designer_adapter.py",
            "fold_designer_bridge.py",
            "tests/test_issue396_phase4_composition_root.py",
            ".github/workflows/qa-issue396-t7-red.yml",
            ".github/workflows/qa-issue396-t7-green.yml",
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected,unexpected
          print("ISSUE396_T7_SCOPE_GREEN=1")
          PY
          protected=(
            phase6_settings_contracts.py
            phase6_settings_transitions.py
            phase6_settings_service.py
            phase6_settings_transaction_controller.py
            phase6_settings_panel.py
            phase6_final_scene_contracts.py
            phase6_final_scene_projection.py
            phase6_final_scene_renderer.py
            phase6_final_scene_view.py
            phase6_workspace_navigation_controller.py
            phase6_project_controller.py
            phase6_registry_diagnostics_controller.py
            phase6_corner_data_view_adapter.py
            phase6_manufacturing_cache.py
            phase6_manufacturing_contracts.py
            phase6_manufacturing_geometry.py
            phase6_manufacturing_service.py
            phase6_manufacturing_adapter.py
            config.ini
            ae_engine/cabinet_types/policy.py
            ae_engine/cabinet_types/receiving.py
            ae_engine/cabinet_types/vault.py
          )
          git diff --exit-code "$base"...HEAD -- "${protected[@]}"
          echo "ISSUE396_T7_PROTECTED_DRIFT=0"

  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Composition real UI/renderer regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_settings_panel_ownership.py             tests/test_phase6_settings_service.py             tests/test_phase6_3d_view_regressions.py             tests/test_phase6_3d_operator_view.py             tests/test_phase6_assembly_3d_view.py             tests/test_separate_3d_entry_contract.py             --tb=short
          echo "ISSUE396_T7_XVFB_GREEN=1"
