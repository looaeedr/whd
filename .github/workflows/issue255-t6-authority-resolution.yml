name: Issue255 T6 Authority Resolution

on:
  push:
    branches:
      - work/issue255-t6-authority-resolution-20260914
    paths:
      - '.github/workflows/issue255-t6-authority-resolution.yml'
      - 'tests/knowledge/test_issue255_t6_authority_resolution.py'
      - 'tools/knowledge_authority_resolution.py'
      - 'docs/superpowers/verification/knowledge_authority_t6_overlay_v1.json'
      - 'docs/superpowers/verification/knowledge_authority_classification_v1.json'
      - '.agents/skills/skill_registry.json'

jobs:
  authority-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Issue255 RED-GREEN contract
        run: python -m pytest tests/knowledge/test_issue255_t6_authority_resolution.py -q -s
      - name: Verify frozen T1 artifact unchanged from accepted T6 base
        shell: bash
        run: |
          git diff --exit-code d1d1796e3ba2db30d629194ac053fa46e56aec8e -- docs/superpowers/verification/knowledge_authority_classification_v1.json
      - name: Reject governed-document mutation in authority-only ticket
        shell: bash
        run: |
          changed="$(git diff --name-only d1d1796e3ba2db30d629194ac053fa46e56aec8e...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -E '^(個人AI檔案庫/|\.agents/skills/|docs/|handoff/|[^/]+\.md$)' | grep -vE '^(docs/superpowers/verification/knowledge_authority_t6_overlay_v1\.json|tests/|\.github/)' || true)"
          if [ -n "$bad" ]; then
            printf 'authority-only scope drift:\n%s\n' "$bad"
            exit 1
          fi
