name: WHD App Token Smoke Test
# Credential recheck after JSON App ID discovery
# Recheck Actions Secrets availability after repository secret configuration
on:
  push:
    branches:
      - test/flow-v2-app-token-smoke
    paths:
      - .github/workflows/whd-app-token-smoke.yml
permissions:
  contents: read
jobs:
  app-token-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check credential scopes (presence only)
        env:
          ID_SECRET_SET: ${{ secrets.WHD_APP_ID != '' }}
          ID_VARIABLE_SET: ${{ vars.WHD_APP_ID != '' }}
          KEY_SECRET_SET: ${{ secrets.WHD_APP_PRIVATE_KEY != '' }}
          KEY_VARIABLE_SET: ${{ vars.WHD_APP_PRIVATE_KEY != '' }}
        run: |
          echo "WHD_APP_ID in repository/accessible Secrets: $ID_SECRET_SET"
          echo "WHD_APP_ID in Variables: $ID_VARIABLE_SET"
          echo "WHD_APP_PRIVATE_KEY in accessible Secrets: $KEY_SECRET_SET"
          echo "WHD_APP_PRIVATE_KEY in Variables: $KEY_VARIABLE_SET"
      - name: Validate private key is valid PEM (no key output)
        env:
          CHECK_PRIVATE_KEY: ${{ secrets.WHD_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if printf '%s' "$CHECK_PRIVATE_KEY" | openssl pkey -check -noout >/dev/null 2>&1; then
            echo "WHD_APP_PRIVATE_KEY PEM: valid"
          else
            echo "WHD_APP_PRIVATE_KEY PEM: INVALID"
            exit 1
          fi
      - name: Validate App ID is numeric (no secret output)
        env:
          CHECK_APP_ID: ${{ secrets.WHD_APP_ID }}
        shell: bash
        run: |
          if [[ "$CHECK_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "WHD_APP_ID numeric format: valid"
          else
            echo "WHD_APP_ID numeric format: INVALID"
            exit 1
          fi
      - name: Acquire WHD App installation token (no writes)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WHD_APP_ID }}
          private-key: ${{ secrets.WHD_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-issues: write
      - name: Verify installation identity and repository read only
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api /repos/"$GH_REPO" --jq '.full_name' >/dev/null
          echo "APP_TOKEN_SMOKE_GREEN"
      - name: Verify App Git ref PATCH permission on isolated smoke branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ref="heads/test/flow-v2-app-token-smoke"
          sha="$(gh api "repos/$GH_REPO/git/ref/$ref" --jq '.object.sha')"
          # Exact same SHA: tests permission without advancing the test branch.
          gh api -X PATCH "repos/$GH_REPO/git/refs/$ref" -f sha="$sha" -F force=false >/dev/null
          echo "APP_REF_PATCH_PERMISSION_GREEN"
      - name: Verify App advances isolated test ref using actual commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ref="heads/test/flow-v2-app-token-smoke"
          parent="$(gh api "repos/$GH_REPO/git/ref/$ref" --jq '.object.sha')"
          base_tree="$(gh api "repos/$GH_REPO/git/commits/$parent" --jq '.tree.sha')"
          blob="$(gh api -X POST "repos/$GH_REPO/git/blobs" -f content='GITHUB_APP_WRITE_CAPABILITY_TEST' -f encoding=utf-8 --jq '.sha')"
          tree_payload="$(python -c 'import json,sys;print(json.dumps({"base_tree":sys.argv[1],"tree":[{"path":".dispatch/app-token-write-probe.txt","mode":"100644","type":"blob","sha":sys.argv[2]}]}))' "$base_tree" "$blob")"
          tree="$(printf '%s' "$tree_payload" | gh api -X POST "repos/$GH_REPO/git/trees" --input - --jq '.sha')"
          commit_payload="$(python -c 'import json,sys;print(json.dumps({"message":"test: isolated app write capability probe","tree":sys.argv[1],"parents":[sys.argv[2]]}))' "$tree" "$parent")"
          commit="$(printf '%s' "$commit_payload" | gh api -X POST "repos/$GH_REPO/git/commits" --input - --jq '.sha')"
          gh api -X PATCH "repos/$GH_REPO/git/refs/$ref" -f sha="$commit" -F force=false >/dev/null
          observed="$(gh api "repos/$GH_REPO/git/ref/$ref" --jq '.object.sha')"
          test "$observed" = "$commit"
          echo "APP_REF_FORWARD_WRITE_GREEN"

      - name: Checkout canonical source for work-root attestation
        uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          path: attested-source
          fetch-depth: 1
      - name: Attest actual GitHub runner workspace root via canonical tool
        shell: bash
        working-directory: attested-source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from subprocess import check_output
          from tools.work_root_gate import build_work_root_gate_evidence, READ_MODE_WORKSPACE
          expected = "859bb8295ef1ba814a70bb6d0359be6b87fa2873"
          observed = check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if observed != expected:
              raise SystemExit("ATTESATION_SOURCE_SHA_MISMATCH")
          root = Path.cwd().resolve()
          contract = json.loads((root / ".agents/contracts/WHD_WORK_ROOT_HARD_GATE_V2.json").read_text(encoding="utf-8"))
          evidence = build_work_root_gate_evidence(
              gate_payload=contract, read_mode=READ_MODE_WORKSPACE,
              execution_mode="INTERACTIVE",
              root_entries=[p.name for p in root.iterdir()],
              workspace_root=str(root), production_head_sha=observed,
          )
          print("WHD_WORK_ROOT_ATTESTATION_V1 " + json.dumps(evidence, sort_keys=True))
          PY
