name: T2 Issue44 BoxBody Physical Piece Identity QA

on:
  push:
    branches:
      - work/44-box-body-physical-piece-identity
    paths:
      - "gui.py"
      - "tests/test_issue44_box_body_physical_piece_identity.py"
      - ".github/workflows/qa_issue44_t2_box_body_piece_identity.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest matplotlib
      - name: Skill preflight
        run: |
          cat >/tmp/preflight.md <<'EOF'
          READ_SKILL: diagnosing-bugs
          READ_SKILL: tdd
          READ_SKILL: monitoring-remote-qa
          READ_SKILL: phase6-corner-3d-model-integrity
          READ_SKILL: phase6-release-packaging
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "T2 多件式 BoxBody Physical Part Identity 2D GUI 修正與回歸" \
            --changed-file gui.py \
            --changed-file tests/test_issue44_box_body_physical_piece_identity.py \
            --evidence /tmp/preflight.md
      - name: Config invariant before
        run: sha256sum config.ini | tee /tmp/config-before.sha
      - name: Headless multipart guards
        run: |
          python -m pytest -q \
            tests/test_box_body_single_source_t4.py::test_t4_receiving_canonical_profile_and_multipart_blanks_are_single_source
      - name: Xvfb R4
        run: xvfb-run -a python -m pytest -q tests/test_issue44_box_body_physical_piece_identity.py
      - name: Source scan
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("gui.py").read_text(encoding="utf-8")
          block=s[s.index("def draw_box_body(self, val):"):s.index("def draw_end_cap", s.index("def draw_box_body(self, val):"))]
          assert 'getattr(render_data, "pieces", ())' in block
          assert '"piece_keys": physical_piece_keys' in block
          assert '("box_body:left_side", "box_body:back", "box_body:right_side")' not in block
          print("authoritative piece projection scan: PASS")
          PY
      - name: Config invariant after
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config-after.sha
          diff -u /tmp/config-before.sha /tmp/config-after.sha
