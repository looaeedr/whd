name: WHD localX Governance Tests

on:
  pull_request:
    branches: [localX]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .agents/contracts/**
      - tools/localx_publish_gate.py
      - tools/change_lane_gate.py
      - tests/process/test_localx_publish_gate.py
      - tests/process/**
      - phase6_assembly_panel.py
      - phase6_final_scene_view.py
      - phase6_navigation_view_adapter.py
      - fold_designer_bridge.py
      - gui_modules/application/fold_designer_composition_assembly_corner.py
      - gui_modules/application/fold_designer_capability_owners.py
      - tests/process/test_change_lane_gate.py
      - tests/knowledge/test_current_history_authority_contract.py
      - tests/governance/test_default_branch_explicit_x_contract.py
      - tests/governance/test_dispatch_remote_only_contract.py
      - tests/governance/test_dispatch_executor_handoff_contract.py
      - tests/governance/test_issue1464_dispatch_takeover_remote_contract.py
      - tests/governance/test_issue_dispatch_ci_continuity_contract.py
      - tests/governance/test_dispatch_turn_exit_gate_contract.py
      - tests/governance/test_interactive_command_no_stop_hard_gate.py
      - tools/interactive_command_no_stop_gate.py
      - tools/phase6_skill_preflight.py
      - .agents/skills/skill_registry.json
      - tests/governance/test_no_external_storage_residue.py
      - tests/knowledge/test_debug_source_read_gate_contract.py
      - .github/workflows/whd-localx-governance-tests.yml

permissions:
  contents: read

jobs:
  governance-contracts:
    name: Governance Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/process/test_localx_publish_gate.py tests/process/test_change_lane_gate.py tests/knowledge/test_current_history_authority_contract.py tests/governance/test_default_branch_explicit_x_contract.py tests/governance/test_dispatch_remote_only_contract.py tests/governance/test_dispatch_executor_handoff_contract.py tests/governance/test_issue1464_dispatch_takeover_remote_contract.py tests/governance/test_issue_dispatch_ci_continuity_contract.py tests/governance/test_dispatch_turn_exit_gate_contract.py tests/governance/test_interactive_command_no_stop_hard_gate.py tests/governance/test_no_external_storage_residue.py tests/knowledge/test_debug_source_read_gate_contract.py

  process-contracts:
    name: Complete Process Contracts (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install process suite dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Verify all process contracts with virtual display
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q tests/process --tb=short
