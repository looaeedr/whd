name: "QA #376 T2 assembly collapsible data"

on:
  push:
    branches:
      - ui/issue376-assembly-collapsible-data-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue376_assembly_collapsible_data.py'
      - '.github/workflows/qa-issue376-t2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  T2_BASELINE: ba0a9e7f5be04c75046a6bca119648037badee1d

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$T2_BASELINE" HEAD)" = "$T2_BASELINE"
          echo "BASELINE=$T2_BASELINE"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install GUI harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: T2 collapsible assembly contract
        shell: bash
        run: xvfb-run -a python -m pytest -q tests/test_issue376_assembly_collapsible_data.py --tb=short

      - name: Existing assembly and selector regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_assembly_3d_view.py             tests/test_issue186_sheetmetal_selector_visibility.py             --tb=short
