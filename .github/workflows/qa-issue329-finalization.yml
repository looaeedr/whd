name: QA Issue 329 Finalization Guard

on:
  push:
    branches:
      - qa/issue329-finalization-20260918
    paths:
      - '.github/workflows/qa-issue329-finalization.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  finalize-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalization runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact owner and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          OWNER_BRANCH='skill/issue329-ui-ux-pro-max-20260918'
          OWNER_HEAD='9bb235918801a5917959d7e4237076573bac3f8f'
          PROD_MERGE='84fee5f25b55c4bdd648aa3947a68357124ed685'

          git fetch origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
          git fetch origin "$OWNER_BRANCH:refs/remotes/origin/$OWNER_BRANCH"
          git fetch origin cleanup/2d-3d-sync:refs/remotes/origin/cleanup/2d-3d-sync

          ACTUAL_OWNER="$(git rev-parse "refs/remotes/origin/$OWNER_BRANCH")"
          test "$ACTUAL_OWNER" = "$OWNER_HEAD"
          git merge-base --is-ancestor "$PROD_MERGE" refs/remotes/origin/cleanup/2d-3d-sync

          git show origin/coord/dispatch-claims:.dispatch/checkpoints/issue-329.json > /tmp/issue-329-checkpoint.json
          python -m tools.continuity_controller show /tmp/issue-329-checkpoint.json

      - name: Authorize, verify, and close issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKPOINT='/tmp/issue-329-checkpoint.json'
          PROOF='/tmp/issue-329-finalization-proof.json'
          OWNER_BRANCH='skill/issue329-ui-ux-pro-max-20260918'
          OWNER_HEAD='9bb235918801a5917959d7e4237076573bac3f8f'

          python -m tools.continuity_controller authorize-finalization "$CHECKPOINT"             --issue '#329'             --branch "$OWNER_BRANCH"             --head-sha "$OWNER_HEAD"             --proof-out "$PROOF"

          # Closure boundary: verify the current bound proof immediately before mutation.
          python -m tools.continuity_controller verify-finalization-proof             "$CHECKPOINT" "$PROOF"             --issue '#329'             --branch "$OWNER_BRANCH"             --head-sha "$OWNER_HEAD"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/329"             -f state='closed'             -f state_reason='completed' > /tmp/issue-329-close.json

          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/329" --jq '.state')" = 'closed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/329" --jq '.state_reason')" = 'completed'

      - name: Upload finalization proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue329-finalization-proof
          path: |
            /tmp/issue-329-checkpoint.json
            /tmp/issue-329-finalization-proof.json
            /tmp/issue-329-close.json
          if-no-files-found: warn
