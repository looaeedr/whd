name: WHD｜#660｜#657 closure prewrite guard
run-name: "WHD｜#660｜#657 closure guard｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue660-live-issue657-takeover-proof-20260925

permissions:
  contents: read
  issues: write

jobs:
  closure_guard:
    name: "#657｜canonical closure prewrite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout #660 execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh-read exact #657 claim/checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin coord/dispatch-claims
          COORD_SHA="$(git rev-parse FETCH_HEAD)"
          CLAIM_PATH=".dispatch/claims/issue-657.json"
          CHECKPOINT_PATH=".dispatch/checkpoints/issue-657.json"
          CLAIM_BLOB="$(git rev-parse "${COORD_SHA}:${CLAIM_PATH}")"
          CHECKPOINT_BLOB="$(git rev-parse "${COORD_SHA}:${CHECKPOINT_PATH}")"
          test "$CLAIM_BLOB" = "94869fb0d5916393477a91d318d70af5923f50c5"
          test "$CHECKPOINT_BLOB" = "f8215aaac5a23c032fa826803b95d606c478cb47"
          git show "${COORD_SHA}:${CLAIM_PATH}" > /tmp/claim657.json
          git show "${COORD_SHA}:${CHECKPOINT_PATH}" > /tmp/checkpoint657.json

          python - <<'PY'
          import json
          claim=json.load(open('/tmp/claim657.json', encoding='utf-8'))
          cp=json.load(open('/tmp/checkpoint657.json', encoding='utf-8'))
          assert claim['worker']=='chatgpt.sol260925.issue657.force2'
          assert claim['phase']=='CLOSING'
          assert claim['head_sha']=='53184c28ed1041558cd735817f4aae54f6c3af74'
          assert cp['state']=='TERMINAL_SUCCESS'
          assert cp['closure_state']=='FINALIZATION_PENDING'
          assert cp['head_sha']=='53184c28ed1041558cd735817f4aae54f6c3af74'
          PY

      - name: Run canonical execution claim guard for closure coordination write
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py             --claim /tmp/claim657.json             --issue 657             --worker chatgpt.sol260925.issue657.force2             --branch integration/issue657-main-remote-guard-20260925             --action write             --base-sha bdb3da203c898d43898b092ff37b7fa9e0c93061             --head-sha 53184c28ed1041558cd735817f4aae54f6c3af74             --checkpoint /tmp/checkpoint657.json             --changed-file .dispatch/claims/issue-657.json             --changed-file .dispatch/checkpoints/issue-657.json

      - name: Emit closure prewrite manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          PROOF_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          manifest={
              'schema':'WHD_ISSUE657_CLOSURE_PREWRITE_GUARD_V1',
              'issue':657,
              'worker':'chatgpt.sol260925.issue657.force2',
              'claim_blob_sha':'94869fb0d5916393477a91d318d70af5923f50c5',
              'checkpoint_blob_sha':'f8215aaac5a23c032fa826803b95d606c478cb47',
              'head_sha':'53184c28ed1041558cd735817f4aae54f6c3af74',
              'from_closure_state':'FINALIZATION_PENDING',
              'to_closure_state':'ISSUE_CLOSE_PENDING',
              'run_id':int(os.environ['RUN_ID']),
              'proof_head_sha':os.environ['PROOF_HEAD'],
              'claim_guard_result':'EXECUTION_CLAIM_GUARD_GREEN',
          }
          json.dump(manifest,open('/tmp/closure-guard-manifest.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          print('WHD_ISSUE657_CLOSURE_PREWRITE_GUARD_GREEN')
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Post machine result to #660
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'WHD_ISSUE657_CLOSURE_PREWRITE_GUARD_RESULT_V1'
            echo 'target_issue=657'
            echo "run_id=${RUN_ID}"
            echo '~~~json'
            cat /tmp/closure-guard-manifest.json
            echo '~~~'
          } > /tmp/result.md
          gh issue comment 660 --repo ${{ github.repository }} --body-file /tmp/result.md
