name: WHD｜#660｜#657 closure pair guard
run-name: "WHD｜#660｜#657 closure pair｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue660-live-issue657-takeover-proof-20260925

permissions:
  contents: read
  issues: read

jobs:
  guard:
    name: "#657｜canonical closure pair prewrite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh-read #657 closed Issue and durable pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin coord/dispatch-claims
          COORD_SHA="$(git rev-parse FETCH_HEAD)"
          CLAIM_PATH=".dispatch/claims/issue-657.json"
          CHECKPOINT_PATH=".dispatch/checkpoints/issue-657.json"
          CLAIM_BLOB="$(git rev-parse "${COORD_SHA}:${CLAIM_PATH}")"
          CHECKPOINT_BLOB="$(git rev-parse "${COORD_SHA}:${CHECKPOINT_PATH}")"
          git show "${COORD_SHA}:${CLAIM_PATH}" > /tmp/claim657.json
          git show "${COORD_SHA}:${CHECKPOINT_PATH}" > /tmp/checkpoint657.json
          gh api "/repos/${REPO}/issues/657" > /tmp/issue657.json
          printf '%s' "$CLAIM_BLOB" > /tmp/claim-blob.txt
          printf '%s' "$CHECKPOINT_BLOB" > /tmp/checkpoint-blob.txt

          python - <<'PY'
          import json
          claim=json.load(open('/tmp/claim657.json', encoding='utf-8'))
          cp=json.load(open('/tmp/checkpoint657.json', encoding='utf-8'))
          issue=json.load(open('/tmp/issue657.json', encoding='utf-8'))
          assert issue['state']=='closed'
          assert issue.get('state_reason')=='completed'
          assert claim['worker']=='chatgpt.sol260925.issue657.force2'
          assert claim['phase']=='CLOSING'
          assert claim['head_sha']=='53184c28ed1041558cd735817f4aae54f6c3af74'
          assert cp['state']=='TERMINAL_SUCCESS'
          assert cp['head_sha']=='53184c28ed1041558cd735817f4aae54f6c3af74'
          assert cp['closure_state'] in {'ISSUE_CLOSE_PENDING','RELEASE_HANDOFF_PENDING'}
          PY

      - name: Run canonical execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py             --claim /tmp/claim657.json             --issue 657             --worker chatgpt.sol260925.issue657.force2             --branch integration/issue657-main-remote-guard-20260925             --action write             --base-sha bdb3da203c898d43898b092ff37b7fa9e0c93061             --head-sha 53184c28ed1041558cd735817f4aae54f6c3af74             --checkpoint /tmp/checkpoint657.json             --changed-file .dispatch/claims/issue-657.json             --changed-file .dispatch/checkpoints/issue-657.json

      - name: Emit closure pair manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          PROOF_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          cp=json.load(open('/tmp/checkpoint657.json', encoding='utf-8'))
          from_state=cp['closure_state']
          to_state={
              'ISSUE_CLOSE_PENDING':'RELEASE_HANDOFF_PENDING',
              'RELEASE_HANDOFF_PENDING':'CLOSED',
          }[from_state]
          manifest={
              'schema':'WHD_ISSUE657_CLOSURE_PAIR_GUARD_V1',
              'issue':657,
              'worker':'chatgpt.sol260925.issue657.force2',
              'claim_blob_sha':open('/tmp/claim-blob.txt').read().strip(),
              'checkpoint_blob_sha':open('/tmp/checkpoint-blob.txt').read().strip(),
              'head_sha':'53184c28ed1041558cd735817f4aae54f6c3af74',
              'from_closure_state':from_state,
              'to_closure_state':to_state,
              'run_id':int(os.environ['RUN_ID']),
              'proof_head_sha':os.environ['PROOF_HEAD'],
              'claim_guard_result':'EXECUTION_CLAIM_GUARD_GREEN',
          }
          json.dump(manifest,open('/tmp/closure-pair-manifest.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          print('WHD_ISSUE657_CLOSURE_PAIR_GUARD_GREEN')
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Post result to #660
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'WHD_ISSUE657_CLOSURE_PAIR_GUARD_RESULT_V1'
            echo 'target_issue=657'
            echo "run_id=${RUN_ID}"
            echo '~~~json'
            cat /tmp/closure-pair-manifest.json
            echo '~~~'
          } > /tmp/result.md
          gh issue comment 660 --repo "${REPO}" --body-file /tmp/result.md
