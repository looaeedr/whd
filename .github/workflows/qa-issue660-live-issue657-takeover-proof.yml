name: WHD｜#660｜#657 聊天室強制接手實證
run-name: "WHD｜#660｜#657 takeover proof｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue660-live-issue657-takeover-proof-20260925

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  proof:
    name: "#657｜user-directed chat→chat machine proof"
    runs-on: ubuntu-latest
    steps:
      - name: 取出 #660 proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh-read #657 durable authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin coord/dispatch-claims
          COORD_SHA="$(git rev-parse FETCH_HEAD)"
          CLAIM_PATH=".dispatch/claims/issue-657.json"
          CHECKPOINT_PATH=".dispatch/checkpoints/issue-657.json"
          CLAIM_BLOB="$(git rev-parse "${COORD_SHA}:${CLAIM_PATH}")"
          CHECKPOINT_BLOB="$(git rev-parse "${COORD_SHA}:${CHECKPOINT_PATH}")"
          git show "${COORD_SHA}:${CLAIM_PATH}" > /tmp/claim657.json
          git show "${COORD_SHA}:${CHECKPOINT_PATH}" > /tmp/checkpoint657.json

          git fetch --no-tags origin integration/issue657-main-remote-guard-20260925
          LIVE_HEAD="$(git rev-parse FETCH_HEAD)"
          test "$LIVE_HEAD" = "53184c28ed1041558cd735817f4aae54f6c3af74"
          LIVE_COMMIT_AT="$(git show -s --format=%cI FETCH_HEAD)"

          gh api "/repos/${REPO}/issues/comments/5831428688" > /tmp/user-authority.json

          printf '%s' "$CLAIM_BLOB" > /tmp/claim-blob.txt
          printf '%s' "$CHECKPOINT_BLOB" > /tmp/checkpoint-blob.txt
          printf '%s' "$LIVE_HEAD" > /tmp/live-head.txt
          printf '%s' "$LIVE_COMMIT_AT" > /tmp/live-commit-at.txt

      - name: Run canonical stale evaluator
        shell: bash
        run: |
          set -euo pipefail
          python tools/stale_claim_takeover.py             --claim /tmp/claim657.json             --live-head-sha "$(cat /tmp/live-head.txt)"             --live-head-committed-at "$(cat /tmp/live-commit-at.txt)"             --claim-blob-sha "$(cat /tmp/claim-blob.txt)"             --requesting-worker chatgpt.sol260925.issue657.force2             --requesting-executor-source chat             --user-authority-json /tmp/user-authority.json             --stale-after-seconds 600             --require-actionable             --decision-out /tmp/takeover-decision.json

      - name: Run canonical execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py             --claim /tmp/claim657.json             --issue 657             --worker chatgpt.sol260925.issue657.a1             --branch integration/issue657-main-remote-guard-20260925             --action claim-takeover             --base-sha bdb3da203c898d43898b092ff37b7fa9e0c93061             --head-sha 53184c28ed1041558cd735817f4aae54f6c3af74             --checkpoint /tmp/checkpoint657.json             --takeover-evidence /tmp/takeover-decision.json             --user-authority-evidence /tmp/user-authority.json

      - name: Emit proof manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          PROOF_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          decision=json.load(open('/tmp/takeover-decision.json', encoding='utf-8'))
          authority=json.load(open('/tmp/user-authority.json', encoding='utf-8'))
          manifest={
              'schema':'WHD_USER_DIRECTED_LIVE_TAKEOVER_PROOF_V1',
              'issue':657,
              'previous_worker':'chatgpt.sol260925.issue657.a1',
              'requesting_worker':'chatgpt.sol260925.issue657.force2',
              'claim_blob_sha':open('/tmp/claim-blob.txt').read().strip(),
              'checkpoint_blob_sha':open('/tmp/checkpoint-blob.txt').read().strip(),
              'observed_live_head_sha':open('/tmp/live-head.txt').read().strip(),
              'authority_comment_id':authority['id'],
              'classification':decision['classification'],
              'actionable':decision['actionable'],
              'stale_seconds':decision['stale_seconds'],
              'proof_run_id':int(os.environ['RUN_ID']),
              'proof_head_sha':os.environ['PROOF_HEAD'],
              'claim_guard_result':'EXECUTION_CLAIM_GUARD_GREEN',
          }
          json.dump(manifest,open('/tmp/proof-manifest.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          print('WHD_USER_DIRECTED_LIVE_TAKEOVER_PROOF_GREEN')
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Post machine proof to #660
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'WHD_USER_DIRECTED_LIVE_TAKEOVER_PROOF_RESULT_V1'
            echo 'target_issue=657'
            echo "run_id=${RUN_ID}"
            echo '~~~json'
            cat /tmp/proof-manifest.json
            echo '~~~'
          } > /tmp/proof-comment.md
          gh issue comment 660 --repo ${{ github.repository }} --body-file /tmp/proof-comment.md

      - name: Upload exact proof
        uses: actions/upload-artifact@v4
        with:
          name: issue660-live-issue657-takeover-proof-${{ github.run_id }}
          path: |
            /tmp/claim657.json
            /tmp/checkpoint657.json
            /tmp/claim-blob.txt
            /tmp/checkpoint-blob.txt
            /tmp/live-head.txt
            /tmp/live-commit-at.txt
            /tmp/user-authority.json
            /tmp/takeover-decision.json
            /tmp/proof-manifest.json
          if-no-files-found: error
          retention-days: 30
