name: Issue108 BoxBody Parent Aggregate Apply
on:
  push:
    branches: [fix/issue108-boxbody-parent-aggregate-20260911]
    paths:
      - .github/workflows/issue108-boxbody-parent-aggregate-apply.yml

permissions:
  contents: write

jobs:
  red-green-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue108-boxbody-parent-aggregate-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Phase6 changed-file preflight
        run: |
          cat > /tmp/issue108-preflight-evidence.txt <<'EOF'
          派工
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          驗證板件與DXF
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task '#108 bugfix regression TDD：BoxBody multipart parent identity remains box_body and aggregate unfold projection exists；remote QA' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue96_corner_data_selection_lifecycle.py \
            --changed-file tests/test_issue97_authoritative_unfold_view_adapter.py \
            --evidence /tmp/issue108-preflight-evidence.txt
      - name: Write approved RED tests only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_issue96_corner_data_selection_lifecycle.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_multipart_box_body_uses_valid_remembered_physical_child_not_parent():
              app = _app(
                  (
                      "box_body",
                      "box_body:left_side",
                      "box_body:back",
                      "box_body:right_side",
                      "head",
                  ),
                  selected="box_body",
                  remembered_box_child="box_body:back",
              )

              _refresh(app)

              assert app._phase6_corner_data_selected_part_key == "box_body:back"
              assert app._phase6_corner_data_selected_part_key != "box_body"
          '''
          old = '\n'.join(line[14:] if line.startswith('              ') else line for line in old.splitlines()) + '\n'
          new = '''def test_multipart_box_body_parent_identity_is_not_hijacked_by_remembered_child():
              app = _app(
                  (
                      "box_body",
                      "box_body:left_side",
                      "box_body:back",
                      "box_body:right_side",
                      "head",
                  ),
                  selected="box_body",
                  remembered_box_child="box_body:back",
              )

              _refresh(app)

              assert app._phase6_corner_data_selected_part_key == "box_body"
              assert app._phase6_box_body_active_piece_key == "box_body:back"
          '''
          new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines()) + '\n'
          if old not in s:
              raise SystemExit('issue96 legacy parent-refresh contract block not found')
          s = s.replace(old, new, 1)
          old2 = '''    resolved = select(app, "box_body")

              assert resolved == "box_body:back"
              assert app._phase6_corner_data_selected_part_key == "box_body:back"
          '''
          old2 = '\n'.join(line[14:] if line.startswith('              ') else line for line in old2.splitlines()) + '\n'
          new2 = '''    resolved = select(app, "box_body")

              assert resolved == "box_body"
              assert app._phase6_corner_data_selected_part_key == "box_body"
          '''
          new2 = '\n'.join(line[14:] if line.startswith('              ') else line for line in new2.splitlines()) + '\n'
          if old2 not in s:
              raise SystemExit('issue96 legacy parent-selection assertion block not found')
          p.write_text(s.replace(old2, new2, 1), encoding='utf-8')

          p = Path('tests/test_issue97_authoritative_unfold_view_adapter.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_multipart_aggregate_parent_fails_closed_instead_of_faking_single_unfold(monkeypatch):
              app = _app(
                  ("box_body", "box_body:left_side", "box_body:back", "box_body:right_side", "head"),
                  "box_body",
              )

              monkeypatch.setattr(
                  bridge,
                  "_phase6_render_data_for_blank",
                  lambda *_args: (_ for _ in ()).throw(AssertionError("aggregate parent queried")),
              )
              monkeypatch.setattr(
                  bridge,
                  "_phase6_box_body_piece_render_data",
                  lambda *_args: (_ for _ in ()).throw(AssertionError("unresolved parent queried")),
              )

              assert _projection(app) is None
          '''
          old = '\n'.join(line[14:] if line.startswith('              ') else line for line in old.splitlines()) + '\n'
          new = '''def test_multipart_aggregate_parent_reuses_authoritative_aggregate_render_data_sink(monkeypatch):
              app = _app(
                  ("box_body", "box_body:left_side", "box_body:back", "box_body:right_side", "head"),
                  "box_body",
              )
              sentinel = object()
              calls = []
              before = (app.designer_workspace.active_part, app.designer_workspace.selected_part)

              monkeypatch.setattr(
                  bridge,
                  "_phase6_render_data_for_blank",
                  lambda owner, key: calls.append(("blank", owner, key)) or sentinel,
              )
              monkeypatch.setattr(
                  bridge,
                  "_phase6_box_body_piece_render_data",
                  lambda *_args: (_ for _ in ()).throw(AssertionError("aggregate parent used child sink")),
              )

              result = _projection(app)

              assert result is not None
              assert result.part_key == "box_body"
              assert result.render_data is sentinel
              assert calls == [("blank", app, "box_body")]
              assert (app.designer_workspace.active_part, app.designer_workspace.selected_part) == before
          '''
          new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines()) + '\n'
          if old not in s:
              raise SystemExit('issue97 legacy aggregate-parent contract block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: RED — prove baseline violates approved parent contract
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py \
            > /tmp/issue108-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue108-red.log
          if [ "$rc" -eq 0 ]; then
            echo 'RED gate failed: tests unexpectedly passed on old production'
            exit 1
          fi
          grep -q '3 failed' /tmp/issue108-red.log
          grep -q 'test_multipart_box_body_parent_identity_is_not_hijacked_by_remembered_child' /tmp/issue108-red.log
          grep -q 'test_corner_data_selection_callback_resolves_identity_without_activating_workspace' /tmp/issue108-red.log
          grep -q 'test_multipart_aggregate_parent_reuses_authoritative_aggregate_render_data_sink' /tmp/issue108-red.log
          echo 'RED_108=PASS_EXPECTED_FAILURES_3'
      - name: GREEN — minimal production fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fold_designer_bridge.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _phase6_resolve_operator_part_key(self, key):
              """Resolve operator identity to a current physical part without activating the workspace."""
              key = str(key or "")
              if key == "box_body" or _phase6_is_box_body_physical_piece_key(key):
                  children = _phase6_box_body_piece_keys(
                      getattr(_designer_workspace(self), "available_parts", ()) or ()
                  )
                  if children:
                      remembered = str(getattr(self, "_phase6_box_body_active_piece_key", "") or "")
                      target = key if key in children else remembered if remembered in children else children[0]
                      self._phase6_box_body_active_piece_key = target
                      return target
              return key
          '''
          old = '\n'.join(line[14:] if line.startswith('              ') else line for line in old.splitlines()) + '\n'
          new = '''def _phase6_resolve_operator_part_key(self, key):
              """Resolve operator identity without letting child-memory replace the aggregate parent."""
              key = str(key or "")
              if key == "box_body":
                  return key
              if _phase6_is_box_body_physical_piece_key(key):
                  children = _phase6_box_body_piece_keys(
                      getattr(_designer_workspace(self), "available_parts", ()) or ()
                  )
                  if children:
                      remembered = str(getattr(self, "_phase6_box_body_active_piece_key", "") or "")
                      target = key if key in children else remembered if remembered in children else children[0]
                      self._phase6_box_body_active_piece_key = target
                      return target
              return key
          '''
          new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines()) + '\n'
          if old not in s:
              raise SystemExit('operator-part resolver production block not found')
          s = s.replace(old, new, 1)
          old2 = '''    box_children = _phase6_box_body_piece_keys(keys)
              if selected == "box_body" and box_children:
                  return None

          '''
          old2 = '\n'.join(line[14:] if line.startswith('              ') else line for line in old2.splitlines())
          if old2 not in s:
              raise SystemExit('aggregate-parent fail-closed production block not found')
          p.write_text(s.replace(old2, '', 1), encoding='utf-8')
          PY
      - name: GREEN — focused tests
        run: |
          pytest -q \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py \
            | tee /tmp/issue108-green.log
      - name: Create durable T1 checkpoint and journal
        run: |
          mkdir -p .scratch/issue107/checkpoints .scratch/issue107/state
          cat > .scratch/issue107/checkpoints/T1.md <<'EOF'
          # #107 / #108 T1 checkpoint
          - role: T1 Implementer
          - owning issue: #108
          - target baseline: a37de3ad697ef225b711f6ea0eee86bf2b7712d4
          - branch: fix/issue108-boxbody-parent-aggregate-20260911
          - RED: 3 expected failures proving parent identity hijack + aggregate projection None
          - GREEN focused: tests/test_issue96_corner_data_selection_lifecycle.py + tests/test_issue97_authoritative_unfold_view_adapter.py
          - production changed: fold_designer_bridge.py only
          - tests changed: issue96/issue97 legacy assertions replaced by approved Contract
          - pending: exact-head remote QA; PM/QA acceptance; then #109
          - blocked: none at checkpoint creation
          - resume: read #108 + this checkpoint, then inspect exact-head QA for this branch
          EOF
          python - <<'PY'
          import json
          from pathlib import Path
          state = {
              'task_id': 107,
              'work_order': 108,
              'role': 'T1 Implementer',
              'branch': 'fix/issue108-boxbody-parent-aggregate-20260911',
              'baseline': 'a37de3ad697ef225b711f6ea0eee86bf2b7712d4',
              'red': {'expected_failures': 3, 'status': 'confirmed'},
              'focused_green': {'status': 'confirmed'},
              'pending': ['exact-head remote QA', 'QA review'],
              'next': '#109 after #108 acceptance',
          }
          Path('.scratch/issue107/state/T1.json').write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify config invariant
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
      - name: Commit tested T1 source and checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py
          git add -f .scratch/issue107/checkpoints/T1.md .scratch/issue107/state/T1.json
          git commit -m 'fix(#108): restore BoxBody aggregate parent projection'
          git push origin HEAD:fix/issue108-boxbody-parent-aggregate-20260911
          echo "T1_COMMIT=$(git rev-parse HEAD)"
