name: WHD｜#753｜Batch trusted-main governance parity
run-name: WHD｜#753｜Batch trusted-main governance parity

on:
  push:
    branches:
      - governance/issue753-batch-main-x-parity-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: '#753 batch parity focused QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Run #737 #739 #744 plus protected guard regressions
        run: >-
          python -m pytest -q
          tests/process/test_issue737_remote_guard_user_authority_handoff.py
          tests/process/test_issue739_pr_write_auto_consume.py
          tests/process/test_issue744_terminal_checkpoint_repair_transport.py
          tests/process/test_issue643_guard_transaction_gate.py
          tests/process/test_issue731_branch_create_auto_consume.py
