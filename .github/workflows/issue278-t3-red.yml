name: Issue 278 T3 Box Body QA

on:
  push:
    branches:
      - qa/issue278-t3-red-20260915

permissions:
  contents: read

env:
  ISSUE: 278
  WORKER: chatgpt
  TASK_BRANCH: test-cleanup/issue278-box-body-identity-20260915
  CLAIM_REF: coord/claim-issue278-20260915
  BASE_SHA: a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6
  ISSUE76_RED: tests/test_issue76_box_body_subtabs_2d_3d.py::test_designer_box_body_stays_one_top_level_part_but_has_switchable_physical_subtabs
  IDENTITY_RED: tests/test_box_body_single_source_t3.py::test_receiving_corner_data_box_body_uses_same_authoritative_context_projection

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact task candidate and claim
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TASK_BRANCH" "$CLAIM_REF"
          git checkout --detach "origin/$TASK_BRANCH"
          mkdir -p .scratch/issue278/acceptance
          TASK_HEAD="$(git rev-parse HEAD)"
          export TASK_HEAD
          echo "TASK_HEAD=$TASK_HEAD" >> "$GITHUB_ENV"
          git show "origin/$CLAIM_REF:.coord/claims/issue278.json" > /tmp/issue278-claim.json
          python - <<'PY'
          import json, os
          claim=json.load(open('/tmp/issue278-claim.json', encoding='utf-8'))
          assert claim['issue'] == 278
          assert claim['worker'] == 'chatgpt'
          assert claim['work_branch'] == os.environ['TASK_BRANCH']
          assert claim['base_sha'] == os.environ['BASE_SHA']
          assert claim['head_sha'] == os.environ['TASK_HEAD'], (claim['head_sha'], os.environ['TASK_HEAD'])
          assert claim['phase'] == 'GREEN_QA', claim['phase']
          print('T3_ACCEPTANCE_CLAIM_LOCK=GREEN')
          PY
      - name: Lock parallel lineage and candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" "$TASK_HEAD"
          test "$(git merge-base "$BASE_SHA" "$TASK_HEAD")" = "$BASE_SHA"
          git -c core.quotepath=false diff --name-only "$BASE_SHA" "$TASK_HEAD" | tee .scratch/issue278/acceptance/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/issue278-t3-red.yml',
            'docs/superpowers/plans/2026-09-15-issue278-box-body-identity-test-cleanup.md',
            'tests/test_issue76_box_body_subtabs_2d_3d.py',
            'tests/test_box_body_single_source_t3.py',
          }
          changed={line.strip() for line in Path('.scratch/issue278/acceptance/changed.txt').read_text().splitlines() if line.strip()}
          assert changed <= allowed, sorted(changed-allowed)
          assert {'tests/test_issue76_box_body_subtabs_2d_3d.py','tests/test_box_body_single_source_t3.py'} <= changed, changed
          print('T3_ACCEPTANCE_SCOPE_LOCK=GREEN')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
          command -v xvfb-run
      - name: Execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim /tmp/issue278-claim.json \
            --issue "$ISSUE" --worker "$WORKER" --branch "$TASK_BRANCH" \
            --action qa-dispatch --base-sha "$BASE_SHA" --head-sha "$TASK_HEAD"
      - name: Fail-closed skill preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > .scratch/issue278/acceptance/preflight-evidence.md <<'EOF'
          # Issue #278 / T3 acceptance preflight evidence

          MASTER_ID: #274
          TASK_ID: #278 / T3
          TARGET_X: cleanup/2d-3d-sync
          FROZEN_X_BASE_SHA: 269a2972f0f88ffc7085ee3f1483a57145d8b2e8
          EXPECTED_PARENT_SHA: a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6
          WORK_ORDER_BRANCH: work/test-cleanup-274-20260915
          TASK_BRANCH: test-cleanup/issue278-box-body-identity-20260915
          ROLE: T3 implementer / acceptance verifier

          READ_SKILL: Python測試實務
          READ_SKILL: 派工
          READ_SKILL: UI設計與去AI味
          READ_SKILL: diagnosing-bugs
          READ_SKILL: tdd
          READ_SKILL: monitoring-remote-qa
          READ_SKILL: long-log-context-safe-execution
          READ_SKILL: executable-continuity-controller
          READ_SKILL: issue-closure-gate

          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/09_X第二主分支與獨立工單鏈治理規格.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md

          AUTHORITY_EVIDENCE:
          - box_body is the single logical top-level identity.
          - Receiving multipart physical identities are box_body:left_side, box_body:back, box_body:right_side.
          - Structure Tree / common hierarchy projection owns visible child navigation; the legacy Notebook is compatibility state, not a visibility contract.
          - Logical box_body aggregate projection must not be silently rewritten to the first physical child.
          - Explicit physical-child selection must resolve the same authoritative material consumed by 3D.
          - Caller-side structural rebuild remains forbidden.

          RED_EVIDENCE:
          - run 34985361465 proved issue76 stale winfo_manager contract RED on the exact parent.
          - run 34985361465 proved logical-vs-physical identity stale contract RED on the exact parent.
          - durable sibling contracts were GREEN in the same run.

          BOUNDARY:
          - T3 changes tests/docs/temporary QA only.
          - No production geometry, DXF, dimensions, UI behavior or runtime identity mutation is allowed.
          EOF
          python tools/phase6_skill_preflight.py \
            --task '派工 pytest UI regression box body identity single source acceptance' \
            --changed-file tests/test_issue76_box_body_subtabs_2d_3d.py \
            --changed-file tests/test_box_body_single_source_t3.py \
            --changed-file docs/superpowers/plans/2026-09-15-issue278-box-body-identity-test-cleanup.md \
            --changed-file .github/workflows/issue278-t3-red.yml \
            --evidence .scratch/issue278/acceptance/preflight-evidence.md
      - name: Capture protected manifest before tests
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue278/acceptance
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/before.sha256"
      - name: Reconfirm exact-parent RED provenance
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.scratch/issue278/acceptance"
          git worktree add --detach /tmp/issue278-parent "$BASE_SHA"
          set +e
          (cd /tmp/issue278-parent && xvfb-run -a python -m pytest -q --tb=short "$ISSUE76_RED") > "$root/issue76-parent-red.txt" 2>&1
          rc1=$?
          (cd /tmp/issue278-parent && xvfb-run -a python -m pytest -q --tb=short "$IDENTITY_RED") > "$root/identity-parent-red.txt" 2>&1
          rc2=$?
          set -e
          test "$rc1" -ne 0
          test "$rc2" -ne 0
          grep -F 'winfo_manager' "$root/issue76-parent-red.txt" >/dev/null
          grep -F 'box_body:left_side' "$root/identity-parent-red.txt" >/dev/null
          git worktree remove --force /tmp/issue278-parent
          echo 'T3_PARENT_RED_PROVEN=1' | tee "$root/red-proof.txt"
      - name: GREEN T3 box-body contracts under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q --tb=short \
            tests/test_issue76_box_body_subtabs_2d_3d.py \
            tests/test_box_body_single_source_t3.py \
            tests/test_issue209_part_panel_projection.py | tee .scratch/issue278/acceptance/t3-green.txt
      - name: Verify no outcome-control weakening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          paths=[
            'tests/test_issue76_box_body_subtabs_2d_3d.py',
            'tests/test_box_body_single_source_t3.py',
            'tests/test_issue209_part_panel_projection.py',
          ]
          tokens=('pytest.skip(', 'pytest.xfail(', '@pytest.mark.skip', '@pytest.mark.xfail', 'pytestmark = pytest.mark.skipif')
          base='a6f0eaae87c4a4aa7dea8c55feaaee1dafbf21f6'
          for path in paths:
              old=subprocess.check_output(['git','show',f'{base}:{path}'], text=True)
              new=open(path, encoding='utf-8').read()
              for token in tokens:
                  assert new.count(token) <= old.count(token), (path, token, old.count(token), new.count(token))
          print('OUTCOME_CONTROL_DRIFT=0')
          PY
      - name: Verify protected invariants and production drift
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue278/acceptance
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/after.sha256"
          diff -u "$root/before.sha256" "$root/after.sha256" | tee "$root/invariant.diff"
          test ! -s "$root/invariant.diff"
          python - <<'PY'
          from pathlib import Path
          changed={line.strip() for line in Path('.scratch/issue278/acceptance/changed.txt').read_text().splitlines() if line.strip()}
          production=[p for p in changed if not (p.startswith('tests/') or p.startswith('docs/') or p.startswith('.github/workflows/'))]
          assert production == [], production
          print('PRODUCTION_SOURCE_DRIFT=0')
          PY
      - name: Seal GREEN result
        shell: bash
        run: |
          set -euo pipefail
          cat > .scratch/issue278/acceptance/result.txt <<EOF
          ISSUE278_T3_QA=GREEN
          TASK_HEAD=$TASK_HEAD
          BASE_SHA=$BASE_SHA
          RED_RUN=34985361465
          OUTCOME_CONTROL_DRIFT=0
          PRODUCTION_SOURCE_DRIFT=0
          PROTECTED_INVARIANTS=GREEN
          EOF
          cat .scratch/issue278/acceptance/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue278-t3-acceptance
          path: .scratch/issue278/acceptance/
          if-no-files-found: error
