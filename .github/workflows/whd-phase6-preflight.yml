name: WHD Remote Phase6 Preflight
run-name: "WHD｜Phase6 Preflight｜Issue #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'WHD_REMOTE_PHASE6_PREFLIGHT_REQUEST_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse fixed preflight request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import PurePosixPath

          body = os.environ["COMMENT_BODY"].replace("\r\n", "\n")
          lines = body.split("\n")
          if not lines or lines[0].strip() != "WHD_REMOTE_PHASE6_PREFLIGHT_REQUEST_V1":
              raise SystemExit("invalid remote preflight marker")

          required_single = {
              "issue", "worker", "executor_source", "branch", "head_sha", "task"
          }
          optional_single = {"invocation_identity"}
          allowed_multi = {"changed_file"}
          singles = {}
          changed_files = []
          for raw in lines[1:]:
              if not raw.strip():
                  continue
              if "=" not in raw:
                  raise SystemExit(f"malformed request line: {raw!r}")
              key, value = raw.split("=", 1)
              key, value = key.strip(), value.strip()
              if key in required_single or key in optional_single:
                  if key in singles:
                      raise SystemExit(f"duplicate request key: {key}")
                  singles[key] = value
              elif key in allowed_multi:
                  changed_files.append(value)
              else:
                  raise SystemExit(f"unsupported request key: {key}")

          missing = sorted(required_single - set(singles))
          if missing:
              raise SystemExit(f"missing request keys: {missing}")
          if os.environ["COMMENT_AUTHOR"] != os.environ["REPOSITORY_OWNER"]:
              raise SystemExit("remote preflight request must be authored by repository owner")
          if int(singles["issue"]) != int(os.environ["EVENT_ISSUE"]):
              raise SystemExit("remote preflight issue mismatch")
          if singles["executor_source"] not in {"scheduler", "chat"}:
              raise SystemExit("invalid executor_source")
          if not re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", singles["worker"]):
              raise SystemExit("invalid worker")
          branch = singles["branch"]
          if (
              not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", branch)
              or branch.startswith("/")
              or branch.endswith("/")
              or ".." in branch
              or "//" in branch
              or "@{" in branch
          ):
              raise SystemExit("invalid branch")
          if not re.fullmatch(r"[0-9a-f]{40}", singles["head_sha"]):
              raise SystemExit("invalid head_sha")
          task = singles["task"]
          if not task or len(task) > 4000:
              raise SystemExit("task must be nonblank and <=4000 chars")

          normalized_files = []
          for raw in changed_files:
              path = PurePosixPath(raw)
              if (
                  not raw
                  or path.is_absolute()
                  or ".." in path.parts
                  or raw.startswith("./")
                  or "\\" in raw
              ):
                  raise SystemExit(f"invalid changed_file: {raw!r}")
              normalized_files.append(path.as_posix())
          if len(normalized_files) > 100:
              raise SystemExit("too many changed_file entries")

          payload = {
              "schema": "WHD_REMOTE_PHASE6_PREFLIGHT_REQUEST_V1",
              "request_comment_id": int(os.environ["COMMENT_ID"]),
              **singles,
              "issue": int(singles["issue"]),
              "changed_files": normalized_files,
          }
          with open("/tmp/phase6-preflight-request.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2, sort_keys=True)
          PY

      - name: Checkout exact requested branch HEAD
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess

          request = json.load(open("/tmp/phase6-preflight-request.json", encoding="utf-8"))
          branch = request["branch"]
          head = request["head_sha"]
          raw = subprocess.check_output(
              ["git", "ls-remote", "origin", f"refs/heads/{branch}"],
              text=True,
          ).strip()
          if not raw:
              raise SystemExit("requested branch does not exist")
          live_head = raw.split()[0]
          if live_head != head:
              raise SystemExit(
                  f"requested branch HEAD drift expected={head} actual={live_head}"
              )
          subprocess.run(["git", "fetch", "--no-tags", "origin", head], check=True)
          subprocess.run(["git", "checkout", "--detach", head], check=True)
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != head:
              raise SystemExit("exact requested HEAD checkout failed")
          PY

      - name: Checkout trusted production Phase6 runner
        uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          path: trusted-prod
          fetch-depth: 1

      - name: Run canonical Phase6 Knowledge Preflight
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=trusted-prod python -m tools.phase6_remote_preflight \
            --request-file /tmp/phase6-preflight-request.json \
            --run-id "$GITHUB_RUN_ID_VALUE" \
            --output /tmp/phase6-preflight-result.json

      - name: Publish machine-readable preflight receipt
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const receipt = fs.readFileSync('/tmp/phase6-preflight-result.json', 'utf8').trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ['WHD_REMOTE_PHASE6_PREFLIGHT_RESULT_V1', '~~~json', receipt, '~~~'].join('\n'),
            });
