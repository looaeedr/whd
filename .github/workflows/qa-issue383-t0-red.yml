name: "QA #383 T0 content ownership RED"

on:
  push:
    branches:
      - ui/issue383-content-ownership-characterization-v2-20260919
    paths:
      - 'tests/test_issue383_content_ownership_red.py'
      - 'docs/superpowers/checkpoints/issue383-content-ownership-characterization.md'
      - '.github/workflows/qa-issue383-t0-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t0-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 0947e546063c4c2118cb778d2798da5dbff682b3)" = "0947e546063c4c2118cb778d2798da5dbff682b3"
      - name: Install GUI harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Confirm exact target REDs
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue383_content_ownership_red.py --tb=short | tee /tmp/t0-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q "4 failed" /tmp/t0-red.log
          grep -q "separately reserved sticky region" /tmp/t0-red.log
          grep -q "second Structure Tree" /tmp/t0-red.log
          grep -q "detail body still defaults expanded" /tmp/t0-red.log
          grep -q "no assembly-only presentation grouping exists" /tmp/t0-red.log
          echo "PASS EXPECTED_T0_RED=4"
      - name: T0 production-source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 0947e546063c4c2118cb778d2798da5dbff682b3...HEAD | tee /tmp/files.txt
          test "$(grep -Ec '^(fold_designer_bridge.py|phase6_part_navigation.py|gui.py|gui_modules/|ae_engine/)' /tmp/files.txt || true)" -eq 0
          echo "PASS PRODUCTION_SOURCE_DRIFT=0"
