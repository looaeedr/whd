name: "#360 T6 pure manufacturing orchestration"

on:
  push:
    branches:
      - refactor/issue360-pure-manufacturing-service-20260919
    paths:
      - 'tests/test_issue360_pure_manufacturing_service.py'
      - 'phase6_manufacturing_service.py'
      - 'phase6_manufacturing_geometry.py'
      - 'phase6_manufacturing_adapter.py'
      - 'phase6_manufacturing_contracts.py'
      - 'fold_designer_bridge.py'
      - 'gui_modules/application/fold_designer_adapter.py'
      - 'gui_modules/application/lifecycle.py'
      - 'tools/issue359_cache_performance_gate.py'
      - '.github/workflows/qa-issue360-t6-pure-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T6 pure-service contracts
        run: |
          python -m pytest -q             tests/test_issue360_pure_manufacturing_service.py             tests/test_issue359_manufacturing_cache_service.py             tests/test_issue358_remove_manufacturing_callbacks.py             tests/test_resolved_manufacturing_bridge.py
      - name: Preserve cache-hit performance gate
        run: python tools/issue359_cache_performance_gate.py
