name: Issue 204 T0 Preflight

on:
  push:
    branches:
      - refactor/gui-modularization-20260914
    paths:
      - '.github/workflows/issue204-t0-preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 knowledge preflight
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .scratch/issue204
          python tools/phase6_skill_preflight.py \
            --task "Issue #204 T0 GUI modularization baseline lock, preflight, AST inventory and dependency mapping for gui.py; no production behavior changes" \
            | tee .scratch/issue204/preflight.txt
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue204-t0-preflight
          path: .scratch/issue204/preflight.txt
