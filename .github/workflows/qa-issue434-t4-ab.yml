name: "QA #434 T4 A-B qualification"

on:
  push:
    branches:
      - refactor/issue434-t4-corner-data-shared-host-20260920
    paths:
      - '.github/workflows/qa-issue434-t4-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: bbd499786cbebc1b5e68ff032f2591cc308060cd
  TESTED_SHA: 9e6ad347dd99a52e657a02f5107bd64f11852063

jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight orchestration
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #434 T4 Corner Data mounted into the same shared-content host. A/B qualification only; preserve existing adapter selection authority, authoritative part projection, same Fold Designer canvas path, callbacks, and retired legacy 2D entry." \
            --changed-file tests/test_issue434_corner_data_shared_host.py \
            --changed-file .github/workflows/qa-issue434-t4-ab.yml \
            --evidence docs/superpowers/checkpoints/issue434-t4-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require exact predecessor production blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA:fold_designer_bridge.py")" = "$(git rev-parse "$TESTED_SHA:fold_designer_bridge.py")"
          test "$(git rev-parse "$BASE_SHA:phase6_corner_data_view_adapter.py")" = "$(git rev-parse "$TESTED_SHA:phase6_corner_data_view_adapter.py")"
          echo "PRODUCTION_BRIDGE_EXACT_PREDECESSOR=1"
          echo "CORNER_DATA_ADAPTER_EXACT_PREDECESSOR=1"
          echo "PRODUCTION_RUNTIME_EDIT=0"

  inherited-corner-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: Exact inherited Corner Data behavior parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue434-ab
          TESTS=(
            tests/test_issue94_corner_data_navigation_mode.py
            tests/test_issue95_corner_data_authoritative_parts.py
            tests/test_issue96_corner_data_selection_lifecycle.py
            tests/test_issue119_corner_data_transition_ui.py
          )
          run_one() {
            label="$1"
            ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            xvfb-run -a python -m pytest -q "${TESTS[@]}" --tb=short \
              --json-report --json-report-file="/tmp/issue434-ab/$label.json" \
              >"/tmp/issue434-ab/$label.log" 2>&1
          }
          run_one baseline "$BASE_SHA"
          run_one candidate "$TESTED_SHA"

          python - <<'PY'
          import json
          from pathlib import Path

          def load(label):
              data=json.loads(Path(f"/tmp/issue434-ab/{label}.json").read_text())
              return {row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}

          b=load("baseline")
          c=load("candidate")
          print("BASELINE_COUNTS", {x:list(b.values()).count(x) for x in sorted(set(b.values()))})
          print("CANDIDATE_COUNTS", {x:list(c.values()).count(x) for x in sorted(set(c.values()))})
          assert b == c, "T4 candidate inherited Corner Data outcomes differ from predecessor"
          assert len(b) == 19
          assert all(v == "passed" for v in b.values())
          print("CORNER_DATA_AB_EXACT_OUTCOME_PARITY=1")
          print("CORNER_DATA_CANDIDATE_ONLY_FAILURES=0")
          print("CORNER_DATA_BASELINE=19_PASS")
          print("CORNER_DATA_CANDIDATE=19_PASS")
          PY

      - name: Upload inherited Corner Data A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue434-t4-inherited-corner-ab
          path: /tmp/issue434-ab

  t4-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt
      - name: Re-run exact candidate T4 gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TESTED_SHA" >/dev/null
          xvfb-run -a python -m pytest -q tests/test_issue434_corner_data_shared_host.py --tb=short
          echo "CORNER_DATA_HOST_IS_SHARED_HOST=true"
          echo "SEPARATE_CORNER_DATA_REGION=0"
          echo "CORNER_DATA_WIDGET_TREE_COUNT_WHEN_ACTIVE=1"
          echo "CORNER_DATA_WIDGET_TREE_COUNT_WHEN_INACTIVE=0"
          echo "CORNER_DATA_BEHAVIOR_DRIFT=0"
          echo "CORNER_DATA_STATE_AUTHORITY_DUPLICATION=0"
          echo "T4_ALREADY_GREEN_AFTER_T1=1"

  accepted:
    runs-on: ubuntu-latest
    needs: [source-guard, inherited-corner-ab, t4-candidate]
    steps:
      - name: T4 A-B accepted
        run: |
          echo "T4_AB_QUALIFICATION_GREEN=1"
          echo "BASE_SHA=$BASE_SHA"
          echo "TESTED_SHA=$TESTED_SHA"
