name: WHD R2 Targeted GUI Diagnosis
on:
  pull_request:
    branches: [localX]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: quantity-receiving
            selector: tests/test_issue1465_quantity_ui.py
            keyword: test_real_gui_quantity_controls_holes_and_manual_save
          - case: custom-editor
            selector: tests/test_issue1464_custom_manufacturing.py::test_real_gui_custom_manufacturing_editor_reload
          - case: quantity-bom
            selector: tests/test_issue1466_quantity_bom.py
            keyword: test_real_quantity_bom_30_plus_20_custom_100_and_read_only and FULL
          - case: receiving-pad
            selector: tests/test_receiving_pad_native_tk_operator_selector.py::test_real_tk_normal_confirm_populates_clickable_pad_2d_unfolded_sheet
          - case: receiving-real-tier
            selector: tests/test_issue1503_single_gui_real_tier_2d3d.py::test_single_confirm_makes_real_tier_parts_and_side_marks_not_only_hole_draft
    name: R2 diagnosis / ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GUI dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Capture full failure and bounded hang traceback
        env:
          SELECTOR: ${{ matrix.selector }}
          KEYWORD: ${{ matrix.keyword || '' }}
        run: |
          export PYTHONUNBUFFERED=1
          timeout --signal=TERM --kill-after=5s 160s xvfb-run -a python - "$SELECTOR" "$KEYWORD" <<'PY'
          import sys
          import tkinter.messagebox as messagebox
          def unexpected_warning(*args, **kwargs):
              print("WHD_R2_UNEXPECTED_MODAL_WARNING=" + repr((args, kwargs)), flush=True)
              raise AssertionError("Blocking warning from live mode transition: " + repr(args))
          messagebox.showwarning = unexpected_warning
          import pytest
          selected = ["-vv", "-s", "--tb=short", "-o", "faulthandler_timeout=25", sys.argv[1]]
          if sys.argv[2]:
              selected += ["-k", sys.argv[2]]
          raise SystemExit(pytest.main(selected))
          PY
