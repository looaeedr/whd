name: WHD Issue 835 Scheduler Same-Lane No-Work QA

on:
  push:
    branches:
      - governance/issue835-scheduler-same-lane-no-work-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Focused scheduler no-work contract
        run: >-
          python -m pytest -q
          tests/process/test_scheduler_no_work_census_contract.py
