name: "QA #431 T1 shared-content host"

on:
  push:
    branches:
      - refactor/issue431-t1-shared-content-host-20260920
    paths:
      - '.github/workflows/qa-issue431-t1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  T1_BASE_SHA: 95ab91c900e9a531ce0fec25a698123116392cc2
  TESTED_SHA: 20e10d7cbcf7d6066bb357701f2f156789fc9277

jobs:
  t1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout exact TESTED_SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse 9b9c4b489f5181883dd8f47bd98aa5c5bd66bf6a:fold_designer_bridge.py)" = "$(git rev-parse "$TESTED_SHA:fold_designer_bridge.py")"
          echo "PRODUCTION_BLOB_UNCHANGED_SINCE_FOCUSED_GREEN=1"

      - name: Install focused GUI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Re-run T1 changed-file Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #431 T1 Shared-content host and mutually-exclusive mode controller UI change. Create exactly one dedicated Fold Designer left shared-content host for normal part, assembly, and corner-data presentations. Preserve existing active-part, display-mode, visibility, corner-data, geometry, persistence, and callback authorities. Use inherited characterization RED, minimal GREEN, focused regression, GitHub Actions remote QA." \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue431_shared_content_host.py \
            --changed-file tests/test_issue384_assembly_only_function_presentation.py \
            --evidence docs/superpowers/checkpoints/issue431-t1-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Run exact T1 focused behavior matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue431-t1
          xvfb-run -a python -m pytest -q \
            tests/test_issue430_single_host_red.py \
            tests/test_issue431_shared_content_host.py \
            tests/test_issue384_assembly_only_function_presentation.py \
            --tb=short \
            --json-report \
            --json-report-file=.scratch/issue431-t1/report.json \
            > .scratch/issue431-t1/pytest.log 2>&1
          cat .scratch/issue431-t1/pytest.log

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(".scratch/issue431-t1/report.json").read_text(encoding="utf-8"))
          outcomes = {row["nodeid"]: row.get("outcome") for row in data.get("tests", [])}
          failed = {node for node, outcome in outcomes.items() if outcome == "failed"}
          passed = {node for node, outcome in outcomes.items() if outcome == "passed"}
          skipped = {node for node, outcome in outcomes.items() if outcome == "skipped"}
          print("OUTCOMES", outcomes)
          assert not failed, f"focused GREEN failures: {failed}"
          assert len(passed) == 11, f"expected 11 PASS, got {len(passed)}"
          assert not skipped, f"unexpected Xvfb skips: {skipped}"
          print("SHARED_CONTENT_HOST_COUNT=1")
          print("ACTIVE_SHARED_CONTENT_MODE_COUNT=1")
          print("SEPARATE_ASSEMBLY_REGION=0")
          print("SEPARATE_CORNER_DATA_REGION=0")
          print("MODE_SWITCH_CREATES_STATE_AUTHORITY=0")
          print("ISSUE384_SHARED_OWNER_CONTRACT_UPDATED=1")
          print("T1_FOCUSED_GREEN_RESULT=11_PASS_0_FAIL_0_SKIP")
          PY

      - name: Upload T1 focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue431-t1-focused
          path: |
            .scratch/issue431-t1/report.json
            .scratch/issue431-t1/pytest.log
