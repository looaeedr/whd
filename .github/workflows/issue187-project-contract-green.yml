name: issue187-project-contract-green
on:
  push:
    branches:
      - feat/issue187-3d-output-migration-20260913
    paths:
      - .github/workflows/issue187-project-contract-green.yml
permissions:
  contents: write
jobs:
  update-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture invariants
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baselines.before
      - name: Update project load oracle for independent export intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_phase6_project_file.py')
          text = path.read_text(encoding='utf-8')
          old = '''        monkeypatch.setattr(filedialog, "askopenfilename", lambda **kwargs: str(path))\n\n        old_designer.load_project_file()\n'''
          new = '''        monkeypatch.setattr(filedialog, "askopenfilename", lambda **kwargs: str(path))\n\n        # #187: DXF export intention is runtime operator state, independent from\n        # physical presence restored by .p6fold. Use opposite sentinels so both\n        # presence directions are proven: present head stays unchecked, absent\n        # tail stays checked. Project load must not rewrite either checkbox.\n        app.export_head_var.set(False)\n        app.export_tail_var.set(True)\n        app.export_door_var.set(False)\n        export_intention_before = (\n            bool(app.export_head_var.get()),\n            bool(app.export_tail_var.get()),\n            bool(app.export_door_var.get()),\n        )\n\n        old_designer.load_project_file()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one insertion seam, got {text.count(old)}')
          text = text.replace(old, new, 1)
          old_assert = '''        assert set(app._phase6_existing_parts) == {"box_body", "head"}\n        assert app.export_head_var.get() is True\n        assert app.export_tail_var.get() is False\n        assert app.export_door_var.get() is False\n'''
          new_assert = '''        assert set(app._phase6_existing_parts) == {"box_body", "head"}\n        assert (\n            bool(app.export_head_var.get()),\n            bool(app.export_tail_var.get()),\n            bool(app.export_door_var.get()),\n        ) == export_intention_before\n'''
          if text.count(old_assert) != 1:
              raise SystemExit(f'expected one stale assertion block, got {text.count(old_assert)}')
          path.write_text(text.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY
      - name: Static diff check
        run: git diff --check -- tests/test_phase6_project_file.py
      - name: Focused contract GREEN
        shell: bash
        run: |
          xvfb-run -a pytest -q -s \
            tests/test_issue187_3d_output_migration.py \
            tests/test_phase6_project_file.py::test_real_designer_load_button_replaces_workspace_from_p6fold \
            tests/test_multi_door_gui.py::test_box_distance_checkbox_draws_enclosure_reference_frame_in_door_editor \
            tests/test_multi_door_gui.py::test_multi_door_editor_shows_explicit_baseline_source_status
      - name: Verify invariants
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baselines.after
          diff -u /tmp/baselines.before /tmp/baselines.after
      - name: Commit exact test contract update
        shell: bash
        run: |
          git config user.name 'looaeedr'
          git config user.email '76246585+looaeedr@users.noreply.github.com'
          git add tests/test_phase6_project_file.py
          git diff --cached --check
          git commit -m 'test(issue187): keep export intent independent across project load'
          git push origin HEAD:feat/issue187-3d-output-migration-20260913
