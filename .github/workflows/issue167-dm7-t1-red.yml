name: Issue167 DM7 T1 Requirement RED
on:
  push:
    branches:
      - test/dm7-t1-navigation-red-guards-20260913
    paths:
      - tests/test_dm7_part_navigation.py
      - tests/test_issue96_corner_data_selection_lifecycle.py
      - .github/workflows/issue167-dm7-t1-red.yml

jobs:
  requirement-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture invariants
        run: |
          sha256sum config.ini | tee /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: T1 scope guard
        run: |
          python - <<'PY'
          import subprocess
          base = 'e85b10b3bf7957e626abb7c1e1e1f909b1f0ee62'
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          allowed_prefixes = ('tests/', 'docs/superpowers/plans/', '.scratch/', '.github/workflows/issue167-dm7-t1-red.yml')
          bad = [p for p in changed if not p.startswith(allowed_prefixes)]
          assert not bad, f'T1 production scope violation: {bad}'
          print('T1_SCOPE_GUARD=PASS')
          print('CHANGED=' + ','.join(changed))
          PY
      - name: DM7 navigation requirement RED
        run: |
          pytest -q -s \
            tests/test_dm7_part_navigation.py \
            tests/test_issue96_corner_data_selection_lifecycle.py
      - name: Verify invariants
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/baseline.before /tmp/baseline.after
