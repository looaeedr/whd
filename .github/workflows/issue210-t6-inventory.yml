name: Issue 210 T6 Project Actions Move-Only

on:
  pull_request:
    branches:
      - qa/issue210-project-actions-runner-20260914

permissions:
  contents: write

jobs:
  move-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase6 preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue210/run
          python tools/phase6_skill_preflight.py \
            --task "Issue #210 T6 Project Actions extraction: behavior-preserving Move-Only of global Open Save Save As Load wrappers; preserve ProjectController ProjectSession project schema and persistence ordering" \
            --changed-file gui.py \
            --changed-file gui_modules/project_actions.py \
            --changed-file tests/test_issue210_project_actions_move_contract.py \
            --changed-file .scratch/issue210/apply_project_actions_move.py \
            --changed-file .scratch/issue210/preflight-evidence.md \
            --evidence .scratch/issue210/preflight-evidence.md \
            | tee .scratch/issue210/run/preflight.txt

      - name: Apply exact Move-Only transform
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python .scratch/issue210/apply_project_actions_move.py | tee .scratch/issue210/run/apply.txt
          git diff --check
          if git diff --quiet -- gui.py gui_modules/project_actions.py; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff -- gui.py gui_modules/project_actions.py | tee .scratch/issue210/run/move.diff
          fi

      - name: Commit and push Move-Only slice
        if: steps.apply.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui.py gui_modules/project_actions.py
          git commit -m 'refactor(issue210): extract project action wrappers'
          git rev-parse HEAD | tee .scratch/issue210/run/applied-head.txt
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install validation dependencies
        if: steps.apply.outputs.changed == '0'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest matplotlib

      - name: Structural GREEN and immutable Move-Only body contract
        if: steps.apply.outputs.changed == '0'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue210_project_actions_move_contract.py \
            | tee .scratch/issue210/run/structural.txt
          python - <<'PY' | tee .scratch/issue210/run/move-only-ast.txt
          import ast, subprocess
          from pathlib import Path
          names = ('save_phase6_project_as','save_phase6_project','open_phase6_project','load_phase6_project')
          baseline = subprocess.check_output(['git','show','e5c5d6cea1aae155b7110060e794fa865f7ac2ea:gui.py'], text=True, encoding='utf-8')
          current_module = Path('gui_modules/project_actions.py').read_text(encoding='utf-8')
          btree = ast.parse(baseline)
          mtree = ast.parse(current_module)
          host = next(n for n in btree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          old = {n.name:n for n in host.body if isinstance(n, ast.FunctionDef) and n.name in names}
          new = {n.name:n for n in mtree.body if isinstance(n, ast.FunctionDef) and n.name in names}
          assert set(old) == set(names) == set(new)
          for name in names:
              assert ast.dump(old[name].args, include_attributes=False) == ast.dump(new[name].args, include_attributes=False), name
              assert ast.dump(ast.Module(body=old[name].body, type_ignores=[]), include_attributes=False) == ast.dump(ast.Module(body=new[name].body, type_ignores=[]), include_attributes=False), name
              print('MOVE_ONLY_BODY_GREEN', name)
          src = current_module
          assert 'import gui' not in src and 'from gui import' not in src
          PY

      - name: Invariants before focused characterization
        if: steps.apply.outputs.changed == '0'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > .scratch/issue210/run/config.before.sha256
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue210/run/baseline.before.sha256
          git rev-parse HEAD | tee .scratch/issue210/run/tested-head.txt

      - name: Headless project persistence characterization
        if: steps.apply.outputs.changed == '0'
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_phase6_project_controller.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_project_session.py \
            tests/test_phase6_project_ownership.py \
            tests/test_issue41_persistence_parity.py \
            | tee .scratch/issue210/run/headless.txt

      - name: Xvfb project persistence characterization
        if: steps.apply.outputs.changed == '0'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a pytest -q \
            tests/test_phase6_project_controller.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_project_session.py \
            tests/test_phase6_project_ownership.py \
            tests/test_issue41_persistence_parity.py \
            | tee .scratch/issue210/run/xvfb.txt

      - name: Invariants after focused characterization
        if: always() && steps.apply.outputs.changed == '0'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > .scratch/issue210/run/config.after.sha256
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue210/run/baseline.after.sha256
          diff -u .scratch/issue210/run/config.before.sha256 .scratch/issue210/run/config.after.sha256
          diff -u .scratch/issue210/run/baseline.before.sha256 .scratch/issue210/run/baseline.after.sha256
          git diff --exit-code -- config.ini '基準檔'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue210-t6-move-only
          path: .scratch/issue210/run/
          if-no-files-found: warn
