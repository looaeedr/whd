name: Issue 210 T6 Final Project Acceptance

on:
  pull_request:
    branches:
      - qa/issue210-project-actions-runner-20260914

permissions:
  contents: read

jobs:
  final-acceptance:
    if: github.event.pull_request.head.ref == 'refactor/issue210-project-actions-20260914'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact T6 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest matplotlib

      - name: Fail-closed knowledge preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue210/final
          python tools/phase6_skill_preflight.py \
            --task "Issue #210 T6 final acceptance for behavior-preserving Project Actions extraction: Open Save Save As Load Save Reload persistence project schema DXF reopen manufacturing parity" \
            --changed-file gui.py \
            --changed-file gui_modules/project_actions.py \
            --changed-file tests/test_issue210_project_actions_move_contract.py \
            --changed-file tests/test_phase6_project_file.py \
            --changed-file tests/test_dxf_acceptance.py \
            --changed-file .scratch/issue210/preflight-evidence.md \
            --evidence .scratch/issue210/preflight-evidence.md \
            | tee .scratch/issue210/final/preflight.txt

      - name: Exact scope and immutable owner guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=e5c5d6cea1aae155b7110060e794fa865f7ac2ea
          git diff --exit-code "$BASE"...HEAD -- \
            phase6_project_controller.py \
            phase6_project_session.py \
            phase6_project_file.py
          git diff --name-only "$BASE"...HEAD | tee .scratch/issue210/final/changed-files.txt
          python - <<'PY' | tee .scratch/issue210/final/scope-guard.txt
          import subprocess
          allowed_exact = {
              'gui.py',
              'gui_modules/project_actions.py',
              'tests/test_issue210_project_actions_move_contract.py',
          }
          allowed_prefixes = ('.scratch/issue210/',)
          changed = [line for line in subprocess.check_output(
              ['git','diff','--name-only','e5c5d6cea1aae155b7110060e794fa865f7ac2ea...HEAD'],
              text=True, encoding='utf-8').splitlines() if line]
          unexpected = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if unexpected:
              raise SystemExit('UNEXPECTED_T6_DIFF=' + repr(unexpected))
          print('T6_SCOPE_GREEN')
          for path in changed:
              print(path)
          PY

      - name: Structural and immutable Move-Only contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue210_project_actions_move_contract.py \
            | tee .scratch/issue210/final/structural.txt
          python - <<'PY' | tee .scratch/issue210/final/move-only-ast.txt
          import ast, subprocess
          from pathlib import Path
          names = ('save_phase6_project_as','save_phase6_project','open_phase6_project','load_phase6_project')
          baseline = subprocess.check_output(
              ['git','show','e5c5d6cea1aae155b7110060e794fa865f7ac2ea:gui.py'],
              text=True, encoding='utf-8')
          current_module = Path('gui_modules/project_actions.py').read_text(encoding='utf-8')
          btree = ast.parse(baseline)
          mtree = ast.parse(current_module)
          host = next(n for n in btree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          old = {n.name:n for n in host.body if isinstance(n, ast.FunctionDef) and n.name in names}
          new = {n.name:n for n in mtree.body if isinstance(n, ast.FunctionDef) and n.name in names}
          assert set(old) == set(names) == set(new)
          for name in names:
              assert ast.dump(old[name].args, include_attributes=False) == ast.dump(new[name].args, include_attributes=False), name
              assert ast.dump(ast.Module(body=old[name].body, type_ignores=[]), include_attributes=False) == ast.dump(ast.Module(body=new[name].body, type_ignores=[]), include_attributes=False), name
              print('MOVE_ONLY_BODY_GREEN', name)
          assert 'import gui' not in current_module and 'from gui import' not in current_module
          PY

      - name: Capture invariants before acceptance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > .scratch/issue210/final/config.before.sha256
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue210/final/baseline.before.sha256
          git rev-parse HEAD | tee .scratch/issue210/final/tested-head.txt

      - name: Headless project Save Reload acceptance
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_phase6_project_controller.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_project_session.py \
            tests/test_phase6_project_ownership.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            | tee .scratch/issue210/final/project-headless.txt

      - name: DXF reopen and manufacturing parity acceptance
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_dxf_acceptance.py \
            tests/test_receiving_door_dxf_roundtrip.py \
            tests/test_multipart_dxf_acceptance.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_manufacturing_api_finished_face_contract.py \
            | tee .scratch/issue210/final/dxf-manufacturing.txt

      - name: Xvfb real GUI Save Open Reload acceptance
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a pytest -q \
            tests/test_phase6_project_controller.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_project_session.py \
            tests/test_phase6_project_ownership.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            | tee .scratch/issue210/final/project-xvfb.txt

      - name: Final invariants and source drift guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > .scratch/issue210/final/config.after.sha256
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue210/final/baseline.after.sha256
          diff -u .scratch/issue210/final/config.before.sha256 .scratch/issue210/final/config.after.sha256
          diff -u .scratch/issue210/final/baseline.before.sha256 .scratch/issue210/final/baseline.after.sha256
          git diff --exit-code -- config.ini '基準檔' gui.py gui_modules/project_actions.py \
            phase6_project_controller.py phase6_project_session.py phase6_project_file.py

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue210-t6-final-acceptance
          path: .scratch/issue210/final/
          if-no-files-found: error
