name: WHD｜工單 #851｜Recurring lifecycle turn-exit
run-name: "WHD｜工單 #851｜Recurring lifecycle turn-exit｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue851-recurring-lifecycle-turn-exit-20260927

permissions:
  contents: read

jobs:
  focused:
    name: 工單851 recurring lifecycle contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出受測版本
        uses: actions/checkout@v4
      - name: 設定測試環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試工具
        run: python -m pip install pytest
      - name: 驗證工作流程顯示名稱
        run: >-
          python tools/actions_visible_naming_guard.py
          .github/workflows/qa-issue851-recurring-lifecycle-turn-exit.yml
      - name: 執行 recurring lifecycle focused contract
        run: >-
          python -m pytest -q
          tests/process/test_issue851_recurring_lifecycle_turn_exit.py
          tests/process/test_issue691_turn_exit_scheduler_end_parity.py
          tests/process/test_issue787_turn_exit_blocker_authority.py
          tests/process/test_scheduler_simulation_skill_contract.py
