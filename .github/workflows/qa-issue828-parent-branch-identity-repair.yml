name: "WHD｜#828｜Parent branch identity repair QA"
run-name: "WHD｜#828｜RED/GREEN sealed parent-branch identity repair"

on:
  push:
    branches:
      - governance/issue828-parent-branch-sealed-identity-repair-main-20260927

permissions:
  contents: read

jobs:
  focused:
    name: "Focused parent-branch identity repair regression"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout #828 branch"
        uses: actions/checkout@v4
      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pytest"
        run: python -m pip install pytest
      - name: "Run focused #828 regression"
        run: >-
          python -m pytest -q
          --confcutdir=tests/process
          tests/process/test_issue828_parent_branch_identity_repair.py
