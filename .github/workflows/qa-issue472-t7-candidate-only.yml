name: Issue 472 T7 Candidate-only Remediation

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue472-t7-candidate-only.yml'
      - 'logs/preflight/issue472-t7-remediation.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce changed-file authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py             --task "Issue472 Receiving transient topology candidate-only remediation regression verification"             --changed-file ae_engine/cabinet_types/receiving.py             --changed-file tests/test_phase6_t06_receiving_fresh_family.py             --changed-file tests/test_receiving_door_frame_width_semantics.py             --evidence logs/preflight/issue472-t7-remediation.txt

  headless:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run candidate-only Headless regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --tb=short             tests/test_phase6_t06_receiving_fresh_family.py::test_receiving_family_defaults_publish_fresh_intent_layout_and_upper_inner_door_role             tests/test_phase6_t06_receiving_fresh_family.py::test_receiving_inner_door_frame_derivation_omits_unresolvable_terminal_items             tests/test_receiving_door_frame_width_semantics.py::test_receiving_inner_door_derivation_uses_the_same_corrected_outer_door_finished_face

  xvfb:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run candidate-only Xvfb regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -ra --tb=short             tests/test_phase6_t15_inner_door_panels.py::test_3d_workspace_generates_panels_only_for_checked_outer_doors_and_keeps_guards_green             'tests/test_phase6_t19_receiving_baseplate_topology.py::test_receiving_base_plate_count_tracks_one_and_three_door_topology[heights0-1]'             tests/test_phase6_t19_receiving_baseplate_topology.py::test_receiving_live_door_topology_add_remove_keeps_base_plate_ids_in_lockstep
