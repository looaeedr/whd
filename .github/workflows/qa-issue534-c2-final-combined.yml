name: WHD｜#534｜C2 最終整合驗收
run-name: WHD｜#534｜固定 T0 對最終候選 Headless／Xvfb A/B

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923

permissions:
  contents: read
  actions: read

concurrency:
  group: issue534-c2-final-combined
  cancel-in-progress: false

env:
  T0_SHA: adbfa95092a35183b3b64d0d38ea8cb68be64b65
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  ab:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 基準｜Headless
            ref: adbfa95092a35183b3b64d0d38ea8cb68be64b65
            mode: headless
            report: baseline-headless.xml
          - label: 候選｜Headless
            ref: ${{ github.sha }}
            mode: headless
            report: candidate-headless.xml
          - label: 基準｜Xvfb
            ref: adbfa95092a35183b3b64d0d38ea8cb68be64b65
            mode: xvfb
            report: baseline-xvfb.xml
          - label: 候選｜Xvfb
            ref: ${{ github.sha }}
            mode: xvfb
            report: candidate-xvfb.xml
    steps:
      - name: 反讀 exact 驗收版本
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝驗收相依套件
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 驗證 exact SHA 與技能前置
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          python tools/phase6_skill_preflight.py \
            --task 'Phase 6 C2 fixed T0 final combined acceptance Headless Xvfb GUI operator geometry FinalScene export DXF persistence' \
            --changed-file fold_designer_bridge.py \
            --evidence /dev/null || true
          echo "EXACT_TESTED_SHA=$(git rev-parse HEAD)"

      - name: 執行 Headless 全套 pytest
        if: matrix.mode == 'headless'
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          pytest -q --junitxml="${{ matrix.report }}"
          rc=$?
          echo "$rc" > "${{ matrix.report }}.rc"
          exit 0

      - name: 執行 Xvfb 全套 pytest
        if: matrix.mode == 'xvfb'
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          xvfb-run -a pytest -q --junitxml="${{ matrix.report }}"
          rc=$?
          echo "$rc" > "${{ matrix.report }}.rc"
          exit 0

      - name: 上傳 A/B 原始驗收證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue534-${{ matrix.mode }}-${{ matrix.ref }}
          path: |
            ${{ matrix.report }}
            ${{ matrix.report }}.rc
          if-no-files-found: error
          retention-days: 14

  compare:
    name: 比對｜候選新增失敗必須為零
    needs: ab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下載四組 A/B 證據
        uses: actions/download-artifact@v4
        with:
          pattern: issue534-*
          merge-multiple: true

      - name: 分類 candidate-only failure／error
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pairs = [
              ('headless', Path('baseline-headless.xml'), Path('candidate-headless.xml')),
              ('xvfb', Path('baseline-xvfb.xml'), Path('candidate-xvfb.xml')),
          ]

          def reds(path):
              root = ET.parse(path).getroot()
              out = set()
              for case in root.iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      out.add(f"{case.get('classname','')}::{case.get('name','')}")
              return out

          summary = {}
          candidate_only_all = []
          for mode, base, cand in pairs:
              b = reds(base)
              c = reds(cand)
              only = sorted(c - b)
              summary[mode] = {
                  'baseline_red': len(b),
                  'candidate_red': len(c),
                  'candidate_only': only,
              }
              candidate_only_all.extend(f'{mode}:{x}' for x in only)

          Path('issue534-ab-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if candidate_only_all:
              raise SystemExit('ISSUE534_CANDIDATE_ONLY_RED=' + repr(candidate_only_all))
          print('ISSUE534_CANDIDATE_ONLY_RED=0')
          PY

      - name: 上傳 C2 比對摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue534-c2-ab-summary
          path: issue534-ab-summary.json
          if-no-files-found: error
          retention-days: 14
