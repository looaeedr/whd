name: Issue 288 T0 Emit Evidence

on:
  push:
    branches:
      - refactor/issue288-gui-phase2-t0-inventory-20260915

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  emit:
    if: ${{ !contains(github.event.head_commit.message, 'issue288-generated') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Emit evidence docs
        run: python tools/issue288_emit_t0_docs.py

      - name: Verify expected files
        run: |
          test -s docs/superpowers/plans/2026-09-15-gui-phase2-t0/gui_responsibility_inventory.md
          test -s docs/superpowers/plans/2026-09-15-gui-phase2-t0/gui_dependency_map.md
          test -s docs/superpowers/plans/2026-09-15-gui-phase2-t0/gui_state_owner_map.md
          grep -q 'Responsibility inventory gate: GREEN' docs/superpowers/plans/2026-09-15-gui-phase2-t0/gui_responsibility_inventory.md
          grep -q 'Dependency-map gate: GREEN' docs/superpowers/plans/2026-09-15-gui-phase2-t0/gui_dependency_map.md
          grep -q 'State-owner map gate: GREEN' docs/superpowers/plans/2026-09-15-gui-phase2-t0/gui_state_owner_map.md

      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-09-15-gui-phase2-t0/
          git commit -m 'docs(#288): issue288-generated T0 inventory evidence'
          git push origin HEAD:refactor/issue288-gui-phase2-t0-inventory-20260915
