name: Issue 209 T5 Gate

on:
  pull_request:
    branches:
      - refactor/issue208-layout-presentation-20260914
  workflow_dispatch:

jobs:
  characterization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest matplotlib
      - name: Phase6 preflight
        run: |
          mkdir -p .scratch/issue209/run
          python tools/phase6_skill_preflight.py --task "Issue #209 T5 characterize logical part presence projection before part-panel extraction; preserve identity/navigation/visibility authority" --changed-file tests/test_issue209_part_panel_projection.py --changed-file .scratch/issue209/preflight-evidence.md --changed-file .scratch/issue209-t5-checkpoint.md --evidence .scratch/issue209/preflight-evidence.md | tee .scratch/issue209/run/preflight.txt
      - name: Focused characterization and linked regression
        run: |
          pytest -q tests/test_issue209_part_panel_projection.py tests/test_phase6_linked_fold_chain_and_parts.py | tee .scratch/issue209/run/pytest.txt
      - name: Assert production source drift zero
        run: |
          git fetch origin refactor/issue208-layout-presentation-20260914 --depth=1
          changed=$(git diff --name-only origin/refactor/issue208-layout-presentation-20260914...HEAD -- . ':!.scratch/**' ':!.github/workflows/issue209-t5-inventory.yml' ':!tests/test_issue209_part_panel_projection.py')
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi
          echo production_source_drift=0 | tee .scratch/issue209/run/drift.txt
      - name: Upload characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue209-t5-characterization
          path: .scratch/issue209/run/
