name: QA Issue 952 RED

on:
  push:
    branches:
      - governance/issue952-mirror-ancestry-reconciliation

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Prove Issue 952 regression is RED
        run: python -m pytest -q tests/process/test_issue952_governance_ancestry_reconcile.py
