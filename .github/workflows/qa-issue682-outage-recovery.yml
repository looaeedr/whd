name: "WHD｜#682｜Outage Recovery R9"

on:
  push:
    branches:
      - work/issue682-unexpected-local-outage-recovery-20260927
    paths:
      - tests/process/test_issue682_outage_recovery.py
      - tools/stale_claim_takeover.py
      - tools/local_durability_gate.py
      - 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md
      - 個人AI檔案庫/第二層_專案與SOP/11_WHD_Scheduled_Resume_ChatGPT自動續跑規則.md
      - 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
      - docs/governance/whd_scheduler_takeover_usage.md
      - .github/workflows/qa-issue682-outage-recovery.yml

permissions:
  contents: read

concurrency:
  group: issue682-outage-recovery
  cancel-in-progress: false

jobs:
  r9:
    name: "R9 outage recovery + replay safety"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact #682 head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install pytest

      - name: Run #682 R9 behavioral acceptance
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q --tb=short
          tests/process/test_issue682_outage_recovery.py
          tests/process/test_issue540_stale_claim_takeover.py
          tests/process/test_issue581_interactive_stale_takeover.py
