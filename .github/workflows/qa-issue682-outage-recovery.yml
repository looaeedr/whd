name: "WHD｜#682｜Outage Recovery R9"

on:
  push:
    branches:
      - work/issue682-unexpected-local-outage-recovery-20260927
    paths:
      - tests/process/test_issue682_outage_recovery.py
      - tools/stale_claim_takeover.py
      - tools/local_durability_gate.py
      - .github/workflows/qa-issue682-outage-recovery.yml

permissions:
  contents: read

concurrency:
  group: issue682-outage-recovery
  cancel-in-progress: false

jobs:
  r9:
    name: "R9 outage recovery + replay safety"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact #682 head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install pytest

      - name: Run #682 R9 behavioral acceptance
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/process/test_issue682_outage_recovery.py
