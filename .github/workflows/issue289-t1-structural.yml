name: Issue 289 T1 Structural Contract

on:
  push:
    branches:
      - refactor/issue289-gui-phase2-t1-lifecycle-20260915

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Record identity
        run: |
          echo "RUN_SHA=${GITHUB_SHA}"
          echo "T1_BASELINE=89630f54767207f26252b81505b783e01d938be2"
      - name: Apply fail-closed T1 extraction
        run: python tools/issue289_extract_t1_v2.py
      - name: Compile extracted modules and gui
        run: |
          python -m py_compile gui.py gui_modules/application/__init__.py gui_modules/application/lifecycle.py gui_modules/application/command_router.py
      - name: Run T1 structural contract
        run: python -m pytest -q tests/test_issue289_gui_phase2_t1_lifecycle.py
      - name: Commit generated production extraction
        run: |
          if git diff --quiet -- gui.py gui_modules/application/; then
            echo "No generated production diff to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui.py gui_modules/application/
          git commit -m 'refactor(#289): extract application lifecycle routing'
          git push origin HEAD:refactor/issue289-gui-phase2-t1-lifecycle-20260915
