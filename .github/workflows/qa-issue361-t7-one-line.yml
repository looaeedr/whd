name: "#361 T7 one-line manufacturing facade"

on:
  push:
    branches:
      - refactor/issue361-one-line-manufacturing-facade-20260919
    paths:
      - 'tests/test_issue361_one_line_manufacturing_facade.py'
      - 'phase6_manufacturing_adapter.py'
      - 'fold_designer_bridge.py'
      - '.github/workflows/qa-issue361-t7-one-line.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run T7 one-line facade expanded parity
        run: |
          python -m pytest -q \
            tests/test_gui_manufacturing_adapter.py \
            tests/test_issue295_t7_manufacturing_adapter_slice.py \
            tests/test_issue347_manufacturing_helper_extraction.py \
            tests/test_issue349_explicit_joint_relief_extraction.py \
            tests/test_issue350_manufacturing_orchestration_extraction.py \
            tests/test_issue351_t6_compatibility_gate.py \
            tests/test_issue355_manufacturing_dto_contracts.py \
            tests/test_issue356_manufacturing_adapter.py \
            tests/test_issue357_manufacturing_result_contracts.py \
            tests/test_issue358_remove_manufacturing_callbacks.py \
            tests/test_issue359_manufacturing_cache_service.py \
            tests/test_issue360_pure_manufacturing_service.py \
            tests/test_issue361_one_line_manufacturing_facade.py \
            tests/test_manufacturing_api.py \
            tests/test_manufacturing_api_finished_face_contract.py \
            tests/test_manufacturing_collision_dependency.py \
            tests/test_manufacturing_policy_boundary.py \
            tests/test_resolved_manufacturing_bridge.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_resolved_manufacturing_geometry.py
      - name: Preserve cache-hit performance gate
        run: python tools/issue359_cache_performance_gate.py

