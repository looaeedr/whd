name: QA Issue739 Write Auto Consume

on:
  push:
    branches:
      - governance/issue739-pr-write-auto-consume-20260926
    paths:
      - 'tests/process/test_issue739_write_auto_consume.py'
      - 'tools/execution_claim_guard.py'
      - '.github/workflows/whd-remote-execution-guard.yml'
      - '.github/workflows/qa-issue739-write-auto-consume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Focused write durable-readback
        run: python -m pytest tests/process/test_issue739_write_auto_consume.py -q
      - name: Protected guard regressions
        if: always()
        run: |
          python -m pytest \
            tests/process/test_issue739_pr_write_auto_consume.py \
            tests/process/test_issue643_guard_transaction_gate.py \
            tests/process/test_issue731_branch_create_auto_consume.py \
            -q
