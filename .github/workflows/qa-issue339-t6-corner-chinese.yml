name: "QA #339 T6 Corner Chinese Fail Closed"

on:
  push:
    branches:
      - ui/issue339-corner-chinese-presentation-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#339)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact fail-closed RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue339_corner_presentation_fail_closed.py::test_t6_source_contract_has_strict_registry_presentation_adapter > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#339 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-source:
    if: ${{ contains(github.event.head_commit.message, 'green(#339)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime imports
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - run: python -m pytest -q tests/test_issue339_corner_presentation_fail_closed.py -k "not unknown_choice"

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#339)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: T6 visible-text / raw-roundtrip acceptance
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue339_corner_presentation_fail_closed.py \
            tests/test_corner_registry_chinese_presentation.py \
            tests/test_issue338_contrast_readability.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#339)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid schema/manufacturing/persistence drift
        shell: bash
        run: |
          git diff --name-only 109e5873ca2ceedcf595aff8372f1340d853a48d...HEAD | tee files.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("files.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          exact = {
              "config.ini",
              "phase6_designer_workspace.py",
              "phase6_workspace_controller.py",
              "phase6_project_file.py",
          }
          bad = sorted(
              p for p in changed
              if p in exact or p.startswith("基準檔/") or p.startswith("ae_engine/")
          )
          if bad:
              raise SystemExit(f"#339 protected authority drift: {bad}")
          print("#339 protected drift PASS", sorted(changed))
          PY
