name: issue135-preflight
on:
  push:
    branches:
      - work/issue-135-fail-recovery-chain
  workflow_dispatch:

jobs:
  preflight-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase6 skill preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#135 FAIL recovery preflight test remote QA invariant durable execution"
          --changed-file ".agents/skills/engineering/執行開發任務/SKILL.md"
          --changed-file "tests/process/test_fail_recovery_contract.py"
          --evidence ".phase6_issue135_fail_recovery_evidence.txt"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run #135 contract when present
        shell: bash
        run: |
          if [ -f tests/process/test_fail_recovery_contract.py ]; then
            python -m pytest tests/process/test_fail_recovery_contract.py -q
          else
            echo "recovery contract not yet created; preflight-only pass"
          fi
