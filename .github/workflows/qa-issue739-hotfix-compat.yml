name: QA Issue739 Hotfix Compatibility

on:
  push:
    branches:
      - governance/issue739-pr-write-auto-consume-20260926
    paths:
      - '.github/workflows/whd-remote-execution-guard.yml'
      - 'tools/execution_claim_guard.py'
      - 'tests/process/test_issue739_write_auto_consume.py'
      - 'tests/process/test_issue739_pr_write_auto_consume.py'
      - 'tests/process/test_issue643_guard_transaction_gate.py'
      - 'tests/process/test_issue731_branch_create_auto_consume.py'
      - '.github/workflows/qa-issue739-hotfix-compat.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Run durable-transaction regressions
        run: |
          python -m pytest -q             tests/process/test_issue739_write_auto_consume.py             tests/process/test_issue739_pr_write_auto_consume.py             tests/process/test_issue643_guard_transaction_gate.py             tests/process/test_issue731_branch_create_auto_consume.py
      - name: Verify embedded coord-readback imports
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/whd-remote-execution-guard.yml').read_text(encoding='utf-8')
          marker = 'RG_EFFECTIVE_LIVE_HEAD="$effective_live_head" python - <<\'PY\''
          block = text[text.index(marker):]
          assert 'import subprocess' in block
          assert 'import urllib.parse' in block
          print('coord-readback imports OK')
          PY
