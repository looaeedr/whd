name: T48-4 Failed Nodes Regression

on:
  push:
    branches:
      - work/48-receiving-fw-divider-flush-relief-gate
    paths:
      - ".github/workflows/t48-4-failed-nodes.yml"

permissions:
  contents: read

jobs:
  failed-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Compile changed tests
        run: |
          python -m py_compile             tests/test_issue40_divider_6p4_shared_datum.py             tests/test_assembly_collision_integration.py             tests/test_canonical_unfolded_blank_info.py
      - name: Re-run only failed Combined nodes
        shell: bash
        run: |
          set +e
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_issue40_divider_6p4_shared_datum.py::test_t4_uses_no_third_common_dxf_and_records_semantic_datum             tests/test_assembly_collision_integration.py::test_endcap_part_spec_assembly_relief_is_opt_in_and_removes_boxbody_collision             tests/test_assembly_collision_integration.py::test_standard_vault_head_world_backprojection_replaces_fixed_relief_and_verifies_3d             tests/test_assembly_collision_integration.py::test_standard_vault_tail_world_backprojection_verifies_and_preserves_holes             tests/test_assembly_collision_integration.py::test_standard_vault_tail_mirrored_corners_are_numerically_harmonized             tests/test_assembly_collision_integration.py::test_standard_vault_clearance_a_changes_real_cut_dimensions_and_keeps_3d_verified             tests/test_assembly_collision_integration.py::test_verified_world_relief_reclips_authoritative_bends_to_new_material             tests/test_assembly_collision_integration.py::test_verified_relief_replay_matches_world_solver_material_and_keeps_unrelated_legacy_corners_cut             tests/test_assembly_collision_integration.py::test_world_backprojected_relief_restores_only_the_two_solved_mating_corners             tests/test_canonical_unfolded_blank_info.py::test_multi_piece_box_body_returns_one_blank_per_physical_sheet_not_preview_envelope             > t48_4_failed_nodes.log 2>&1
          rc=$?
          after="$(sha256sum config.ini | awk '{print $1}')"
          cat t48_4_failed_nodes.log
          printf '{"pytest_rc":%s,"config_before":"%s","config_after":"%s"}\n' "$rc" "$before" "$after" > t48_4_failed_nodes_state.json
          cat t48_4_failed_nodes_state.json
          if [ "$before" != "$after" ]; then exit 97; fi
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t48-4-failed-nodes-${{ github.run_id }}
          path: |
            t48_4_failed_nodes.log
            t48_4_failed_nodes_state.json
