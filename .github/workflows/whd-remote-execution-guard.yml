name: WHD Remote Execution Guard
run-name: "WHD｜工單 #${{ github.event.issue.number }}｜${{ !startsWith(github.event.comment.body, 'WHD_REMOTE_GUARD_REQUEST_V1') && '非守門請求' || contains(github.event.comment.body, 'executor_source=scheduler') && '排程接手' || contains(github.event.comment.body, 'executor_source=chat') && '聊天室接手' || '來源未標記' }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  guard:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'WHD_REMOTE_GUARD_REQUEST_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse fixed-schema request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import PurePosixPath

          body = os.environ["COMMENT_BODY"].replace("\r\n", "\n")
          lines = body.split("\n")
          if not lines or lines[0].strip() != "WHD_REMOTE_GUARD_REQUEST_V1":
              raise SystemExit("invalid request marker")

          required_single = {
              "issue",
              "worker",
              "action",
              "branch",
              "base_sha",
              "head_sha",
              "claim_blob_sha",
              "guard_authority_sha",
              "tested_target_sha",
          }
          allowed_single = required_single | {
              "executor_source",
              "takeover_worker",
              "legacy_reconcile_recovery_comment_id",
              "target_lane",
              "to_worker",
              "handoff_generation",
              "checkpoint_fingerprint",
              "next_action",
          }
          allowed_multi = {"changed_file"}
          singles = {}
          changed_files = []
          for raw in lines[1:]:
              if not raw.strip():
                  continue
              if "=" not in raw:
                  raise SystemExit(f"malformed request line: {raw!r}")
              key, value = raw.split("=", 1)
              key = key.strip()
              value = value.strip()
              if key in allowed_single:
                  if key in singles:
                      raise SystemExit(f"duplicate request key: {key}")
                  singles[key] = value
              elif key in allowed_multi:
                  changed_files.append(value)
              else:
                  raise SystemExit(f"unsupported request key: {key}")

          missing = sorted(required_single - set(singles))
          if missing:
              raise SystemExit(f"missing request keys: {missing}")

          if os.environ["COMMENT_AUTHOR"] != os.environ["REPOSITORY_OWNER"]:
              raise SystemExit("remote guard requests are restricted to the repository owner")

          issue = int(singles["issue"])
          if issue != int(os.environ["EVENT_ISSUE"]):
              raise SystemExit("request issue does not match event issue")

          executor_source = singles.get("executor_source")
          if executor_source is None:
              executor_source = "unknown"
          elif executor_source not in {"chat", "scheduler"}:
              raise SystemExit("invalid executor_source")
          takeover_worker = singles.get("takeover_worker")
          if singles["action"] == "claim-takeover":
              if takeover_worker is None:
                  raise SystemExit("claim-takeover requires takeover_worker")
              if not re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", takeover_worker):
                  raise SystemExit("invalid takeover_worker")
              if executor_source == "scheduler":
                  if not takeover_worker.startswith("scheduler."):
                      raise SystemExit("scheduler takeover_worker must start with scheduler.")
              elif executor_source == "chat":
                  if not takeover_worker.startswith("chatgpt."):
                      raise SystemExit("interactive takeover_worker must start with chatgpt.")
              else:
                  raise SystemExit("claim-takeover requires scheduler or chat executor_source")
          elif takeover_worker is not None:
              raise SystemExit("takeover_worker is only valid for claim-takeover")

          handoff_keys = {
              "target_lane",
              "to_worker",
              "handoff_generation",
              "checkpoint_fingerprint",
              "next_action",
          }
          if singles["action"] == "claim-handoff":
              missing_handoff = sorted(handoff_keys - set(singles))
              if missing_handoff:
                  raise SystemExit(f"claim-handoff missing keys: {missing_handoff}")
              lane_workers = {
                  "A": "scheduler.6ab13fa557fc8191935c671214b865e2",
                  "B": "scheduler.e58ea936e7d0b12bd0d475314709d6f1",
              }
              target_lane = singles["target_lane"]
              if target_lane not in lane_workers:
                  raise SystemExit("claim-handoff target_lane must be A or B")
              if singles["to_worker"] != lane_workers[target_lane]:
                  raise SystemExit("claim-handoff to_worker does not match target_lane")
              if not re.fullmatch(r"[1-9][0-9]*", singles["handoff_generation"]):
                  raise SystemExit("claim-handoff handoff_generation must be a positive integer")
              if not re.fullmatch(r"[0-9a-f]{64}", singles["checkpoint_fingerprint"]):
                  raise SystemExit("claim-handoff checkpoint_fingerprint must be 64 lowercase hex")
              if not singles["next_action"].strip():
                  raise SystemExit("claim-handoff next_action must be nonblank")
          else:
              unexpected_handoff = sorted(handoff_keys & set(singles))
              if unexpected_handoff:
                  raise SystemExit(
                      f"planned handoff keys are only valid for claim-handoff: {unexpected_handoff}"
                  )

          if not re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", singles["worker"]):
              raise SystemExit("invalid worker")
          if singles["action"] not in {
              "branch-create",
              "claim-takeover",
              "claim-handoff",
              "write",
              "commit",
              "qa-dispatch",
              "workflow-dispatch",
              "pr-write",
          }:
              raise SystemExit("unsupported action")

          branch = singles["branch"]
          if (
              not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", branch)
              or branch.startswith("/")
              or branch.endswith("/")
              or ".." in branch
              or "//" in branch
              or "@{" in branch
          ):
              raise SystemExit("invalid branch")

          sha_keys = {
              "base_sha",
              "head_sha",
              "claim_blob_sha",
              "guard_authority_sha",
              "tested_target_sha",
          }
          for key in sha_keys:
              if not re.fullmatch(r"[0-9a-f]{40}", singles[key]):
                  raise SystemExit(f"invalid SHA: {key}")

          if singles["action"] != "claim-takeover" and singles["tested_target_sha"] != singles["head_sha"]:
              raise SystemExit("tested_target_sha must equal guarded head_sha for non-takeover actions")

          normalized = []
          for value in changed_files:
              value = value.replace("\\", "/")
              while value.startswith("./"):
                  value = value[2:]
              if not value or value.startswith("/") or ".." in PurePosixPath(value).parts:
                  raise SystemExit(f"invalid changed_file: {value!r}")
              if value not in normalized:
                  normalized.append(value)
          if singles["action"] in {"write", "commit"} and not normalized:
              raise SystemExit("write/commit requires at least one changed_file")
          if singles["action"] in {"claim-takeover", "claim-handoff"} and normalized:
              raise SystemExit(f"{singles['action']} must not carry changed_file")

          legacy_recovery_id = singles.get("legacy_reconcile_recovery_comment_id")
          if legacy_recovery_id is not None:
              try:
                  parsed_recovery_id = int(legacy_recovery_id)
              except ValueError as exc:
                  raise SystemExit("invalid legacy_reconcile_recovery_comment_id") from exc
              if parsed_recovery_id <= 0:
                  raise SystemExit("invalid legacy_reconcile_recovery_comment_id")
              expected_pair = {
                  f".dispatch/claims/issue-{issue}.json",
                  f".dispatch/checkpoints/issue-{issue}.json",
              }
              if (
                  singles["action"] != "write"
                  or len(normalized) != 2
                  or set(normalized) != expected_pair
              ):
                  raise SystemExit(
                      "legacy reconciliation recovery requires exact claim+checkpoint write scope"
                  )

          request = {
              **singles,
              "issue": issue,
              "executor_source": executor_source,
              "changed_files": normalized,
              "request_comment_id": int(os.environ["COMMENT_ID"]),
          }
          with open("/tmp/remote-guard-request.json", "w", encoding="utf-8") as fh:
              json.dump(request, fh, indent=2, ensure_ascii=False)
              fh.write("\n")

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as fh:
              for key, value in singles.items():
                  fh.write(f"RG_{key.upper()}={value}\n")
              fh.write(f"RG_ISSUE={issue}\n")
              fh.write(f"RG_COMMENT_ID={os.environ['COMMENT_ID']}\n")

          with open("/tmp/remote-guard-changed-files.txt", "w", encoding="utf-8") as fh:
              for value in normalized:
                  fh.write(value + "\n")
          PY

      - name: Execute canonical remote guard
        id: remote_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u -o pipefail
          result="FAIL"
          reason="unknown"
          : > /tmp/remote-guard.log
          : > /tmp/preflight-evidence.txt

          set +e
          (
            set -euo pipefail
            git fetch --no-tags origin "$RG_GUARD_AUTHORITY_SHA"
            git checkout --detach "$RG_GUARD_AUTHORITY_SHA"
            test "$(git rev-parse HEAD)" = "$RG_GUARD_AUTHORITY_SHA"

            git fetch --no-tags origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
            claim_path=".dispatch/claims/issue-${RG_ISSUE}.json"
            actual_blob="$(git rev-parse "refs/remotes/origin/coord/dispatch-claims:${claim_path}")"
            test "$actual_blob" = "$RG_CLAIM_BLOB_SHA"
            git show "refs/remotes/origin/coord/dispatch-claims:${claim_path}" > /tmp/execution-claim.json
            checkpoint_path=".dispatch/checkpoints/issue-${RG_ISSUE}.json"
            checkpoint_blob="$(git rev-parse "refs/remotes/origin/coord/dispatch-claims:${checkpoint_path}")"
            test -n "$checkpoint_blob"
            git show "refs/remotes/origin/coord/dispatch-claims:${checkpoint_path}" > /tmp/execution-checkpoint.json

            git check-ref-format --branch "$RG_BRANCH" >/dev/null
            current_branch_sha="$(git ls-remote origin "refs/heads/${RG_BRANCH}" | awk '{print $1}')"
            claim_head_sha="$(python -c 'import json; print(json.load(open("/tmp/execution-claim.json", encoding="utf-8"))["head_sha"])')"
            effective_live_head="$current_branch_sha"
            if [ "$RG_ACTION" = "branch-create" ] && [ -z "$effective_live_head" ]; then
              effective_live_head="$claim_head_sha"
            fi

            if [ "$RG_ACTION" = "claim-handoff" ]; then
              test -n "$current_branch_sha"
              test "$current_branch_sha" = "$RG_HEAD_SHA"
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.continuity_controller import checkpoint_fingerprint, checkpoint_from_payload

          payload = json.loads(
              Path("/tmp/execution-checkpoint.json").read_text(encoding="utf-8")
          )
          checkpoint = checkpoint_from_payload(payload)
          if checkpoint.issue != str(os.environ["RG_ISSUE"]):
              raise SystemExit("claim-handoff checkpoint issue mismatch")
          if checkpoint.branch != os.environ["RG_BRANCH"]:
              raise SystemExit("claim-handoff checkpoint branch mismatch")
          if checkpoint.head_sha != os.environ["RG_HEAD_SHA"]:
              raise SystemExit("claim-handoff checkpoint head mismatch")
          if checkpoint.next_action != os.environ["RG_NEXT_ACTION"]:
              raise SystemExit("claim-handoff next_action mismatch")
          if checkpoint_fingerprint(checkpoint) != os.environ["RG_CHECKPOINT_FINGERPRINT"]:
              raise SystemExit("claim-handoff checkpoint_fingerprint mismatch")
          PY
            fi

            if [ "$effective_live_head" = "$claim_head_sha" ]; then
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${RG_ISSUE}/comments?per_page=100" > /tmp/remote-guard-comments.json
              RG_EFFECTIVE_LIVE_HEAD="$effective_live_head" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          from tools.execution_claim_guard import (
              assert_remote_guard_request_permitted,
              classify_guard_transaction,
              exact_remote_guard_receipts_from_comments,
          )

          raw = json.loads(
              Path("/tmp/remote-guard-comments.json").read_text(encoding="utf-8")
          )
          comments = []
          for item in raw:
              if isinstance(item, list):
                  comments.extend(entry for entry in item if isinstance(entry, dict))
              elif isinstance(item, dict):
                  comments.append(item)

          claim = json.loads(
              Path("/tmp/execution-claim.json").read_text(encoding="utf-8")
          )
          receipts = exact_remote_guard_receipts_from_comments(
              comments,
              issue=int(os.environ["RG_ISSUE"]),
              worker=os.environ["RG_WORKER"],
              executor_source=os.environ["RG_EXECUTOR_SOURCE"],
              branch=os.environ["RG_BRANCH"],
              base_sha=os.environ["RG_BASE_SHA"],
              head_sha=claim["head_sha"],
              claim_blob_sha=os.environ["RG_CLAIM_BLOB_SHA"],
          )
          decision = classify_guard_transaction(
              receipts=receipts,
              current_issue=int(os.environ["RG_ISSUE"]),
              current_worker=os.environ["RG_WORKER"],
              current_executor_source=os.environ["RG_EXECUTOR_SOURCE"],
              current_branch=os.environ["RG_BRANCH"],
              current_claim_head_sha=claim["head_sha"],
              live_branch_head_sha=os.environ["RG_EFFECTIVE_LIVE_HEAD"],
              current_claim_blob_sha=os.environ["RG_CLAIM_BLOB_SHA"],
              now=dt.datetime.now(dt.timezone.utc),
          )
          assert_remote_guard_request_permitted(decision)
          if decision.state.value == "EXPIRED_UNCONSUMED":
              print(
                  "REMOTE_GUARD_RECOVERY: expired receipt is unconsumable; "
                  "fresh exact identity verified, minting one replacement Guard"
              )
          PY
            else
              mapfile -t requested_changed_files < /tmp/remote-guard-changed-files.txt
              expected_claim=".dispatch/claims/issue-${RG_ISSUE}.json"
              expected_checkpoint=".dispatch/checkpoints/issue-${RG_ISSUE}.json"
              if [ "$RG_ACTION" != "write" ] || [ "${#requested_changed_files[@]}" -ne 2 ]; then
                echo "REMOTE_GUARD_REJECTED: LIVE_CLAIM_HEAD_DRIFT_NOT_RECONCILIATION" >&2
                exit 42
              fi
              printf '%s\n' "${requested_changed_files[@]}" | sort -u > /tmp/requested-reconcile-files.txt
              printf '%s\n' "$expected_claim" "$expected_checkpoint" | sort -u > /tmp/expected-reconcile-files.txt
              cmp -s /tmp/requested-reconcile-files.txt /tmp/expected-reconcile-files.txt || {
                echo "REMOTE_GUARD_REJECTED: LIVE_CLAIM_HEAD_DRIFT_NOT_RECONCILIATION" >&2
                exit 42
              }
              echo "REMOTE_GUARD_RECONCILE_ONLY: live HEAD differs from claim HEAD; canonical pair reconciliation required"
            fi

            legacy_reconcile_arg=()
            if [ -n "${RG_LEGACY_RECONCILE_RECOVERY_COMMENT_ID:-}" ]; then
              test "$effective_live_head" != "$claim_head_sha"
              rm -f /tmp/legacy-reconcile-recovery.json
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${RG_LEGACY_RECONCILE_RECOVERY_COMMENT_ID}" > /tmp/legacy-reconcile-recovery.json
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/legacy-reconcile-recovery.json").read_text(encoding="utf-8")
          )
          user = payload.get("user")
          body = payload.get("body")
          if (
              not isinstance(user, dict)
              or user.get("login") != os.environ["GITHUB_REPOSITORY_OWNER"]
          ):
              raise SystemExit(
                  "legacy reconciliation recovery comment must be repository-owner authored"
              )
          if not isinstance(body, str):
              raise SystemExit("legacy reconciliation recovery comment body missing")
          lines = body.replace("\r\n", "\n").split("\n")
          if not lines or lines[0].strip() != "WHD_LEGACY_POSTCOMMIT_RECONCILE_V1":
              raise SystemExit("legacy reconciliation recovery marker mismatch")
          PY
              legacy_reconcile_arg=(
                --legacy-reconcile-recovery /tmp/legacy-reconcile-recovery.json
              )
            fi

            takeover_live_commit_at=""
            rm -f /tmp/remote-run.json /tmp/remote-run-api.json /tmp/remote-run.err /tmp/stale-takeover-decision.json /tmp/stale-takeover.log
            remote_arg=()

            if [ "$RG_ACTION" = "branch-create" ]; then
              test -z "$current_branch_sha"
            elif [ "$RG_ACTION" = "claim-takeover" ]; then
              test -n "$current_branch_sha"
              test "$current_branch_sha" = "$RG_TESTED_TARGET_SHA"
              git fetch --no-tags origin "$current_branch_sha"
              takeover_live_commit_at="$(git show -s --format=%cI "$current_branch_sha")"

              run_id="$(python -c 'import json; p=json.load(open("/tmp/execution-claim.json", encoding="utf-8")); r=p.get("remote_qa"); print(r.get("run_id", "") if isinstance(r, dict) else "")')"
              if [ -n "$run_id" ]; then
                set +e
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/remote-run-api.json 2> /tmp/remote-run.err
                gh_rc=$?
                set -e
                if [ "$gh_rc" -eq 0 ]; then
                  python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("/tmp/remote-run-api.json").read_text(encoding="utf-8"))
          payload = {
              "found": True,
              "run_id": int(raw["id"]),
              "head_sha": raw["head_sha"],
              "status": raw.get("status"),
              "conclusion": raw.get("conclusion"),
              "updated_at": raw.get("updated_at"),
          }
          Path("/tmp/remote-run.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
                elif grep -Eqi '404|Not Found' /tmp/remote-run.err; then
                  printf '{"found":false,"run_id":%s}\n' "$run_id" > /tmp/remote-run.json
                else
                  cat /tmp/remote-run.err >&2
                  exit "$gh_rc"
                fi
                remote_arg=(--remote-run-json /tmp/remote-run.json)
              fi

              liveness_arg=(--claim-blob-sha "$RG_CLAIM_BLOB_SHA")
              user_authority_arg=()
              if [[ "$RG_WORKER" == scheduler.* || "$RG_EXECUTOR_SOURCE" == "chat" ]]; then
                rm -f /tmp/issue-comments.json
                gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${RG_ISSUE}/comments?per_page=100" > /tmp/issue-comments.json
              fi

              if [[ "$RG_WORKER" == scheduler.* ]]; then
                rm -f /tmp/runtime-liveness.json /tmp/runtime-liveness.log
                set +e
                python tools/scheduler_runtime_liveness.py \
                  --comments-json /tmp/issue-comments.json \
                  --issue "$RG_ISSUE" \
                  --scheduler-lane "$RG_WORKER" \
                  --out /tmp/runtime-liveness.json > /tmp/runtime-liveness.log 2>&1
                liveness_rc=$?
                set -e
                if [ "$liveness_rc" -eq 0 ]; then
                  liveness_arg+=(--runtime-liveness-json /tmp/runtime-liveness.json)
                elif [ "$liveness_rc" -eq 3 ]; then
                  cat /tmp/runtime-liveness.log
                else
                  cat /tmp/runtime-liveness.log >&2
                  exit "$liveness_rc"
                fi
              fi

              if [ "$RG_EXECUTOR_SOURCE" = "chat" ]; then
                rm -f /tmp/user-authority.json
                python - <<'PY'
          import json
          import os
          from pathlib import Path
          raw = json.loads(Path("/tmp/issue-comments.json").read_text(encoding="utf-8"))
          comments = []
          for item in raw:
              if isinstance(item, list):
                  comments.extend(entry for entry in item if isinstance(entry, dict))
              elif isinstance(item, dict):
                  comments.append(item)
          def parse_fields(body):
              lines = body.replace("\\r\\n", "\\n").split("\\n")
              if not lines or lines[0].strip() != "WHD_USER_DIRECTED_TAKEOVER_V1":
                  return None
              fields = {}
              for raw_line in lines[1:]:
                  if not raw_line.strip() or "=" not in raw_line:
                      continue
                  key, value = raw_line.split("=", 1)
                  fields[key.strip()] = value.strip()
              return fields
          candidates = []
          for comment in comments:
              user = comment.get("user")
              body = comment.get("body")
              if not isinstance(user, dict) or user.get("login") != os.environ["GITHUB_REPOSITORY_OWNER"] or not isinstance(body, str):
                  continue
              fields = parse_fields(body)
              if fields is not None and fields.get("issue") == os.environ["RG_ISSUE"] and fields.get("requesting_worker") == os.environ["RG_TAKEOVER_WORKER"] and fields.get("previous_worker") == os.environ["RG_WORKER"] and fields.get("executor_source") == "chat":
                  candidates.append(comment)
          if not candidates:
              raise SystemExit("missing matching WHD_USER_DIRECTED_TAKEOVER_V1")
          selected = max(candidates, key=lambda item: (str(item.get("created_at") or ""), int(item.get("id") or 0)))
          Path("/tmp/user-authority.json").write_text(json.dumps(selected, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
                user_authority_arg=(--user-authority-json /tmp/user-authority.json)
              fi

              python tools/stale_claim_takeover.py \
                --claim /tmp/execution-claim.json \
                --live-head-sha "$current_branch_sha" \
                --live-head-committed-at "$takeover_live_commit_at" \
                --requesting-worker "$RG_TAKEOVER_WORKER" \
                --requesting-executor-source "$RG_EXECUTOR_SOURCE" \
                "${remote_arg[@]}" \
                "${liveness_arg[@]}" \
                "${user_authority_arg[@]}" \
                --require-actionable \
                --decision-out /tmp/stale-takeover-decision.json 2>&1 | tee /tmp/stale-takeover.log
            else
              test -n "$current_branch_sha"
              test "$current_branch_sha" = "$RG_HEAD_SHA"
            fi

          python - <<'PY'
          from pathlib import Path
          from tools.phase6_skill_preflight import required_references_for, required_skills_for
          import json

          request = json.loads(Path("/tmp/remote-guard-request.json").read_text(encoding="utf-8"))
          task = "GitHub Actions remote QA scheduler execution claim guard workflow run_id"
          changed = request["changed_files"]
          skills = required_skills_for(task=task, changed_files=changed)
          refs = required_references_for(task=task, changed_files=changed)

          def declared_skill_name(path):
              text = path.read_text(encoding="utf-8")
              raw_lines = text.splitlines()
              if not raw_lines or raw_lines[0].strip() != "---":
                  return None
              for raw in raw_lines[1:]:
                  if raw.strip() == "---":
                      break
                  if raw.startswith("name:"):
                      return raw.split(":", 1)[1].strip().strip("'\"")
              return None

          skill_paths = list(Path(".agents/skills").glob("**/SKILL.md"))
          lines = []
          for skill in skills:
              matches = [
                  path
                  for path in skill_paths
                  if declared_skill_name(path) == skill
              ]
              if len(matches) != 1:
                  raise SystemExit(f"required skill unavailable or ambiguous: {skill}: {matches}")
              matches[0].read_text(encoding="utf-8")
              lines.append(f"READ_SKILL: {skill} path={matches[0].as_posix()}")
          for ref in refs:
              path = Path(ref)
              if not path.is_file():
                  raise SystemExit(f"required reference missing: {ref}")
              path.read_text(encoding="utf-8")
              lines.append(f"READ_REFERENCE: {ref}")
          Path("/tmp/preflight-evidence.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

            preflight_args=(
              python tools/phase6_skill_preflight.py
              --task "GitHub Actions remote QA scheduler execution claim guard workflow run_id"
              --evidence /tmp/preflight-evidence.txt
            )
            while IFS= read -r changed_file; do
              [ -z "$changed_file" ] || preflight_args+=(--changed-file "$changed_file")
            done < /tmp/remote-guard-changed-files.txt
            "${preflight_args[@]}"

            guard_args=(
              python tools/execution_claim_guard.py
              --claim /tmp/execution-claim.json
              --issue "$RG_ISSUE"
              --worker "$RG_WORKER"
              --branch "$RG_BRANCH"
              --action "$RG_ACTION"
              --base-sha "$RG_BASE_SHA"
              --checkpoint /tmp/execution-checkpoint.json
            )
            if [ "$RG_ACTION" = "claim-takeover" ]; then
              guard_args+=(
                --head-sha "$RG_TESTED_TARGET_SHA"
                --takeover-evidence /tmp/stale-takeover-decision.json
              )
            else
              guard_args+=(--head-sha "$RG_HEAD_SHA")
            fi
            guard_args+=(--preflight-evidence /tmp/preflight-evidence.txt)
            guard_args+=("${legacy_reconcile_arg[@]}")
            while IFS= read -r changed_file; do
              [ -z "$changed_file" ] || guard_args+=(--changed-file "$changed_file")
            done < /tmp/remote-guard-changed-files.txt
            "${guard_args[@]}"
          ) > /tmp/remote-guard.log 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ] && grep -q '^EXECUTION_CLAIM_GUARD_GREEN ' /tmp/remote-guard.log; then
            result="GREEN"
            reason="EXECUTION_CLAIM_GUARD_GREEN"
          else
            reason="REMOTE_GUARD_FAILED"
          fi

          RG_RESULT="$result" RG_REASON="$reason" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          request = json.loads(Path("/tmp/remote-guard-request.json").read_text(encoding="utf-8"))
          now = dt.datetime.now(dt.timezone.utc)
          takeover_evidence = None
          decision_path = Path("/tmp/stale-takeover-decision.json")
          if decision_path.is_file():
              takeover_evidence = json.loads(decision_path.read_text(encoding="utf-8"))
          receipt = {
              "schema": "WHD_REMOTE_GUARD_RECEIPT_V1",
              "request_comment_id": request["request_comment_id"],
              "issue": request["issue"],
              "worker": request["worker"],
              "takeover_worker": request.get("takeover_worker"),
              "target_lane": request.get("target_lane"),
              "to_worker": request.get("to_worker"),
              "handoff_generation": request.get("handoff_generation"),
              "checkpoint_fingerprint": request.get("checkpoint_fingerprint"),
              "next_action": request.get("next_action"),
              "executor_source": request["executor_source"],
              "action": request["action"],
              "branch": request["branch"],
              "base_sha": request["base_sha"],
              "head_sha": request["head_sha"],
              "claim_blob_sha": request["claim_blob_sha"],
              "guard_authority_sha": request["guard_authority_sha"],
              "tested_target_sha": request["tested_target_sha"],
              "changed_files": request["changed_files"],
              "legacy_reconcile_recovery_comment_id": request.get(
                  "legacy_reconcile_recovery_comment_id"
              ),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "orchestrator_head_sha": os.environ["GITHUB_SHA"],
              "issued_at": now.isoformat().replace("+00:00", "Z"),
              "expires_at": (now + dt.timedelta(minutes=40)).isoformat().replace("+00:00", "Z"),
              "result": os.environ["RG_RESULT"],
              "reason": os.environ["RG_REASON"],
              "takeover_evidence": takeover_evidence,
          }
          Path("/tmp/remote-guard-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          mkdir -p "$GITHUB_WORKSPACE/remote-guard-artifact"
          cp /tmp/remote-guard-request.json "$GITHUB_WORKSPACE/remote-guard-artifact/remote-guard-request.json"
          cp /tmp/remote-guard-receipt.json "$GITHUB_WORKSPACE/remote-guard-artifact/remote-guard-receipt.json"
          cp /tmp/preflight-evidence.txt "$GITHUB_WORKSPACE/remote-guard-artifact/preflight-evidence.txt"
          cp /tmp/remote-guard.log "$GITHUB_WORKSPACE/remote-guard-artifact/remote-guard.log"
          if [ -f /tmp/stale-takeover-decision.json ]; then
            cp /tmp/stale-takeover-decision.json "$GITHUB_WORKSPACE/remote-guard-artifact/stale-takeover-decision.json"
          fi
          if [ -f /tmp/stale-takeover.log ]; then
            cp /tmp/stale-takeover.log "$GITHUB_WORKSPACE/remote-guard-artifact/stale-takeover.log"
          fi
          if [ -f /tmp/legacy-reconcile-recovery.json ]; then
            cp /tmp/legacy-reconcile-recovery.json "$GITHUB_WORKSPACE/remote-guard-artifact/legacy-reconcile-recovery.json"
          fi

          {
            echo "result=$result"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Publish machine-readable receipt
        if: always() && hashFiles('remote-guard-artifact/remote-guard-receipt.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const receipt = fs.readFileSync('remote-guard-artifact/remote-guard-receipt.json', 'utf8').trim();
            const log = fs.existsSync('remote-guard-artifact/remote-guard.log')
              ? fs.readFileSync('remote-guard-artifact/remote-guard.log', 'utf8').trim().split('\n').slice(-30).join('\n')
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'WHD_REMOTE_GUARD_RESULT_V1',
                '~~~json',
                receipt,
                '~~~',
                '',
                '<details><summary>bounded guard log</summary>',
                '',
                '~~~text',
                log,
                '~~~',
                '</details>',
              ].join('\n'),
            });

      - name: Upload guard receipt
        if: always() && hashFiles('remote-guard-artifact/remote-guard-receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: remote-guard-receipt-${{ github.event.comment.id }}
          path: remote-guard-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce terminal guard result
        if: steps.remote_guard.outputs.result != 'GREEN'
        run: exit 1
