name: 工單530 B5 Replacement RED
run-name: "工單 #530 B5｜Derived Request Assembly Replacement RED｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue530-b5-red.yml

permissions:
  contents: read

jobs:
  red:
    name: 驗證新 request assembly requirement 先紅
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 新 requirement 必須先 RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_issue480_derived_part_projection_plan.py > /tmp/issue530-b5-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue530-b5-red.log
          test "$rc" -ne 0
          grep -E "B5 RED|DerivedPartRequestAssemblyInput|request-assembly owner|bridge still owns request assembly" /tmp/issue530-b5-red.log
          echo "ISSUE530_B5_REPLACEMENT_RED=GREEN"

      - name: 上傳 RED 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue530-b5-replacement-red
          path: /tmp/issue530-b5-red.log
          if-no-files-found: error
          retention-days: 14
