name: T20 Receiving Base Plate Placement QA

on:
  push:
    branches:
      - work/20260906-t2-receiving-baseplate-placement
    paths:
      - ae_engine/assembly_placement.py
      - ae_engine/assembly_geometry.py
      - fold_designer_bridge.py
      - gui.py
      - tests/test_phase6_t20_receiving_baseplate_placement.py

permissions:
  contents: read

jobs:
  t20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest matplotlib
      - name: Run T20 focused QA
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_t20_receiving_baseplate_placement.py \
            tests/test_phase6_t13_receiving_base_plate_55.py \
            tests/test_phase6_t16_receiving_placement.py \
            tests/test_phase6_2d_3d_round_trip.py::test_2d_to_3d_confirm_to_2d_round_trip_preserves_state \
            2>&1 | tee t20.log
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t20-receiving-baseplate-placement-log
          path: t20.log
