name: Sheet-metal Actual Visibility Probe

on:
  push:
    branches:
      - fix/sheetmetal-selector-actually-visible-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-actual-visibility.yml'
      - 'tests/test_issue186_sheetmetal_selector_visibility.py'
      - 'fold_designer_bridge.py'

jobs:
  actual-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run actual visibility probe
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -s \
            tests/test_issue186_sheetmetal_selector_visibility.py::test_issue186_sheetmetal_compact_menu_has_real_unobscured_pixels
