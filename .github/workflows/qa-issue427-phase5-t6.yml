name: QA Issue427 Phase5 T6

on:
  push:
    branches:
      - refactor/issue413-phase5-assembly-presentation-20260920
    paths:
      - tools/phase5_t6_classifier.py
      - .github/workflows/qa-issue427-phase5-t6.yml
      - docs/superpowers/checkpoints/issue427-phase5-t6-journal.md
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - tools/phase5_t6_classifier.py
      - .github/workflows/qa-issue427-phase5-t6.yml
      - docs/superpowers/checkpoints/issue427-phase5-t6-journal.md
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE: 396bfd96524a44a178c29bbefaf1b7c0437c119f
  CANDIDATE: 06f23d44ad29d5e2fe9a0a82d71ec48ce1416980
  WORK_BRANCH: refactor/issue413-phase5-assembly-presentation-20260920
  EVIDENCE: docs/superpowers/checkpoints/issue427-phase5-t6-journal.md

jobs:
  cumulative:
    name: cumulative-static-focused
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout T6 harness head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OWNER_HEAD }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cumulative dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -r requirements.txt matplotlib
          command -v xvfb-run

      - name: Verify fixed identities and production target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OWNER_HEAD"
          git cat-file -e "$BASELINE^{commit}"
          git cat-file -e "$CANDIDATE^{commit}"
          git merge-base --is-ancestor "$BASELINE" "$CANDIDATE"
          git fetch origin cleanup/2d-3d-sync
          target="$(git rev-parse FETCH_HEAD)"
          echo "PRODUCTION_TARGET_SHA=$target"
          test "$target" = "$BASELINE"
          echo "PRODUCTION_TARGET_DRIFT=0"
          echo "BASELINE_SUBSTITUTION=0"

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工執行 Phase 5 accepted specification T6 #427: cumulative fixed-root A/B classifier, architecture/presentation/source/timing/FinalScene/StructureTree/refresh/mount/legacy/protected-owner/project/DXF/config/right-diagnostics parity, full Headless and Xvfb baseline/candidate, candidate-only failures/errors zero, cleanup, non-force integration only after GREEN, exact production readback and post-merge smoke' \
            --changed-file tools/phase5_t6_classifier.py \
            --changed-file .github/workflows/qa-issue427-phase5-t6.yml \
            --changed-file docs/superpowers/checkpoints/issue427-phase5-t6-journal.md \
            --evidence "$EVIDENCE"
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Re-run exact T0 census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase5-t6
          python tools/phase5_t0_assembly_presentation_census.py \
            --baseline-sha "$BASELINE" \
            --output-json /tmp/phase5-t6/t0-census.json \
            --output-md /tmp/phase5-t6/t0-census.md
          echo "T0_CENSUS_REPRODUCED=1"

      - name: Run T6 static classifier
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase5_t6_classifier.py static \
            --baseline "$BASELINE" \
            --candidate "$CANDIDATE" \
            --t0-json /tmp/phase5-t6/t0-census.json \
            --output-json /tmp/phase5-t6/static.json \
            --output-md /tmp/phase5-t6/static.md

      - name: Create exact candidate worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase5-t6-candidate
          git worktree add --detach /tmp/phase5-t6-candidate "$CANDIDATE"
          test "$(git -C /tmp/phase5-t6-candidate rev-parse HEAD)" = "$CANDIDATE"
          sha256sum /tmp/phase5-t6-candidate/config.ini | awk '{print $1}' > /tmp/phase5-t6/config.before.sha256

      - name: Run cumulative T1-T5 focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/phase5-t6-candidate
          xvfb-run -a python -m pytest -q \
            tests/process/test_issue422_phase5_t1_assembly_presentation.py \
            tests/process/test_issue423_phase5_t2_assembly_panel.py \
            tests/process/test_issue424_phase5_t3_box_piece_panel.py \
            tests/process/test_issue425_phase5_t4_final_scene_visibility.py \
            tests/process/test_issue426_phase5_t5_bridge_compression.py \
            tests/test_phase6_corner_dimension_controls.py
          echo "CUMULATIVE_FOCUSED_CONTRACTS=GREEN"

      - name: Verify candidate config invariant
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/phase5-t6-candidate/config.ini | awk '{print $1}' > /tmp/phase5-t6/config.after.sha256
          cmp /tmp/phase5-t6/config.before.sha256 /tmp/phase5-t6/config.after.sha256
          echo "CONFIG_INVARIANT=GREEN"

      - name: Upload cumulative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue427-phase5-t6-cumulative
          path: |
            /tmp/phase5-t6/t0-census.json
            /tmp/phase5-t6/t0-census.md
            /tmp/phase5-t6/static.json
            /tmp/phase5-t6/static.md
            /tmp/phase5-t6/config.before.sha256
            /tmp/phase5-t6/config.after.sha256
          if-no-files-found: warn
          retention-days: 14

  full-ab:
    name: full-${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: headless-baseline
            mode: headless
            sha: 396bfd96524a44a178c29bbefaf1b7c0437c119f
          - lane: headless-candidate
            mode: headless
            sha: 06f23d44ad29d5e2fe9a0a82d71ec48ce1416980
          - lane: xvfb-baseline
            mode: xvfb
            sha: 396bfd96524a44a178c29bbefaf1b7c0437c119f
          - lane: xvfb-candidate
            mode: xvfb
            sha: 06f23d44ad29d5e2fe9a0a82d71ec48ce1416980

    steps:
      - name: Checkout exact A/B SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install full-suite dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -r requirements.txt matplotlib
          if [ "${{ matrix.mode }}" = "xvfb" ]; then
            command -v xvfb-run
          fi

      - name: Run full pytest and persist JUnit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/phase5-t6-ab
          set +e
          if [ "${{ matrix.mode }}" = "xvfb" ]; then
            xvfb-run -a python -m pytest -q \
              --junitxml=/tmp/phase5-t6-ab/result.xml \
              > /tmp/phase5-t6-ab/pytest.log 2>&1
          else
            python -m pytest -q \
              --junitxml=/tmp/phase5-t6-ab/result.xml \
              > /tmp/phase5-t6-ab/pytest.log 2>&1
          fi
          rc=$?
          set -e
          echo "$rc" > /tmp/phase5-t6-ab/pytest.rc
          echo "PYTEST_RC=$rc"
          tail -n 100 /tmp/phase5-t6-ab/pytest.log || true
          test -s /tmp/phase5-t6-ab/result.xml
          echo "JUNIT_EVIDENCE_PRESENT=1"

      - name: Upload A/B lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue427-phase5-t6-ab-${{ matrix.lane }}
          path: |
            /tmp/phase5-t6-ab/result.xml
            /tmp/phase5-t6-ab/pytest.rc
            /tmp/phase5-t6-ab/pytest.log
          if-no-files-found: warn
          retention-days: 14

  classify:
    name: final-classifier
    needs:
      - cumulative
      - full-ab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout T6 classifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OWNER_HEAD }}

      - name: Download Headless baseline
        uses: actions/download-artifact@v4
        with:
          name: issue427-phase5-t6-ab-headless-baseline
          path: /tmp/phase5-t6-final/headless-baseline

      - name: Download Headless candidate
        uses: actions/download-artifact@v4
        with:
          name: issue427-phase5-t6-ab-headless-candidate
          path: /tmp/phase5-t6-final/headless-candidate

      - name: Download Xvfb baseline
        uses: actions/download-artifact@v4
        with:
          name: issue427-phase5-t6-ab-xvfb-baseline
          path: /tmp/phase5-t6-final/xvfb-baseline

      - name: Download Xvfb candidate
        uses: actions/download-artifact@v4
        with:
          name: issue427-phase5-t6-ab-xvfb-candidate
          path: /tmp/phase5-t6-final/xvfb-candidate

      - name: Classify candidate-only failures and errors
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase5_t6_classifier.py classify \
            --headless-baseline /tmp/phase5-t6-final/headless-baseline/result.xml \
            --headless-candidate /tmp/phase5-t6-final/headless-candidate/result.xml \
            --xvfb-baseline /tmp/phase5-t6-final/xvfb-baseline/result.xml \
            --xvfb-candidate /tmp/phase5-t6-final/xvfb-candidate/result.xml \
            --output-json /tmp/phase5-t6-final/classifier.json \
            --output-md /tmp/phase5-t6-final/classifier.md
          echo "CANDIDATE_ONLY_FAILURES=0"
          echo "CANDIDATE_ONLY_ERRORS=0"
          echo "PHASE5_DECISION=GREEN"

      - name: Upload final classifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue427-phase5-t6-final-classifier
          path: |
            /tmp/phase5-t6-final/classifier.json
            /tmp/phase5-t6-final/classifier.md
          if-no-files-found: warn
          retention-days: 14
