name: "QA #372 T8 Phase3 cumulative root-baseline acceptance"

on:
  push:
    branches:
      - qa/issue372-t8-cumulative-20260919
    paths:
      - '.github/workflows/qa-issue372-t8-cumulative.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT_BASELINE_SHA: 0dd6561f3253d0a17714af316d5e9da90e24058f
  CANDIDATE_SHA: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c
  PYTHONPATH: .
  MPLBACKEND: Agg

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable T8 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          prod="$(git ls-remote origin refs/heads/cleanup/2d-3d-sync | awk '{print $1}')"
          test "$prod" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$ROOT_BASELINE_SHA" "$CANDIDATE_SHA"
          echo "PHASE3_ROOT_BASELINE=$ROOT_BASELINE_SHA"
          echo "PHASE3_FINAL_CANDIDATE=$CANDIDATE_SHA"
          echo "PRODUCTION_HEAD=$prod"

      - name: Install architecture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt

      - name: Compile final owners
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             fold_designer_bridge.py             gui.py             phase6_workspace_navigation_controller.py             phase6_settings_transaction_controller.py             phase6_project_controller.py             phase6_registry_diagnostics_controller.py             phase6_corner_data_view_adapter.py             phase6_final_scene_view.py             gui_modules/application/command_router.py             gui_modules/application/fold_designer_adapter.py             gui_modules/application/lifecycle.py             phase6_manufacturing_service.py             phase6_manufacturing_adapter.py

      - name: Run T1-T7 ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue365_t1_workspace_navigation_controller.py             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue367_t3_project_persistence_owner.py             tests/test_issue368_t4_registry_diagnostics_owner.py             tests/test_issue369_t5_corner_data_view_owner.py             tests/test_issue370_t6_final_scene_view_owner.py             tests/test_issue371_t7_lifecycle_facade_owner.py             tests/test_issue371_t7_update_runtime_behavior.py

      - name: Run Phase2 manufacturing purity regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue355_manufacturing_dto_contracts.py             tests/test_issue356_manufacturing_adapter.py             tests/test_issue357_manufacturing_result_contracts.py             tests/test_issue358_remove_manufacturing_callbacks.py             tests/test_issue359_manufacturing_cache_service.py             tests/test_issue360_pure_manufacturing_service.py             tests/test_issue361_one_line_manufacturing_facade.py             tests/test_resolved_manufacturing_bridge.py             tests/test_resolved_manufacturing_export.py             tests/test_resolved_manufacturing_geometry.py

      - name: Final ownership classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue372
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          ROOT = Path(".")
          SKIP = {".git", ".venv", "venv", "__pycache__", "BACKUP", "backup", "tests", "tools", ".scratch"}

          canonical = {
              "Phase6WorkspaceNavigationController": "phase6_workspace_navigation_controller.py",
              "Phase6SettingsTransactionController": "phase6_settings_transaction_controller.py",
              "Phase6ProjectController": "phase6_project_controller.py",
              "Phase6RegistryDiagnosticsController": "phase6_registry_diagnostics_controller.py",
              "Phase6CornerDataViewAdapter": "phase6_corner_data_view_adapter.py",
              "Phase6FinalSceneViewAdapter": "phase6_final_scene_view.py",
              "_Phase6UpdateScheduler": "gui_modules/application/command_router.py",
          }

          definitions = {name: [] for name in canonical}
          for path in ROOT.rglob("*.py"):
              if any(part in SKIP for part in path.parts):
                  continue
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except Exception:
                  continue
              for node in tree.body:
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name in definitions:
                          definitions[node.name].append(path.as_posix())

          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) != 1 or paths[0] != canonical[name]
          }

          bridge_path = Path("fold_designer_bridge.py")
          bridge_source = bridge_path.read_text(encoding="utf-8")
          bridge = ast.parse(bridge_source, filename=str(bridge_path))
          direct_class_wiring = []
          for node in bridge.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if (
                      isinstance(target, ast.Attribute)
                      and isinstance(target.value, ast.Name)
                      and target.value.id == "Phase6FoldDesignerApp"
                  ):
                      direct_class_wiring.append((target.attr, node.lineno))

          installer_calls = [
              node for node in bridge.body
              if isinstance(node, ast.Expr)
              and isinstance(node.value, ast.Call)
              and isinstance(node.value.func, ast.Name)
              and node.value.func.id == "install_fold_designer_bridge_facade"
          ]

          lifecycle_source = Path("gui_modules/application/lifecycle.py").read_text(encoding="utf-8")
          lifecycle_tree = ast.parse(lifecycle_source)
          reverse_bridge_imports = [
              node.lineno
              for node in ast.walk(lifecycle_tree)
              if isinstance(node, ast.ImportFrom) and node.module == "fold_designer_bridge"
          ]

          service_path = Path("phase6_manufacturing_service.py")
          service_source = service_path.read_text(encoding="utf-8")
          service = ast.parse(service_source, filename=str(service_path))
          imports = []
          for node in ast.walk(service):
              if isinstance(node, ast.Import):
                  imports.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.append(node.module)
          roots = {name.split(".", 1)[0] for name in imports}
          forbidden_service_roots = sorted(roots & {"fold_designer_bridge", "tkinter", "gui", "gui_modules"})

          group_patterns = (
              ("manufacturing", ("manufacturing", "relief_profile_fingerprint", "finished_dimensions", "scene_query_payload")),
              ("project", ("project", "snapshot", "save_diagnostic", "save_project", "load_project", "export_workspace")),
              ("registry", ("registry", "diagnostic", "promotion", "joint_form", "formula")),
              ("3d", ("final_scene", "query_final_render", "query_assembly_render", "assembly_scene", "3d_preview", "render_committed")),
              ("2d", ("corner_data", "drawing_edge", "unfold", "preview_2d")),
              ("workspace", ("workspace", "available_part", "active_part", "selected_part", "part_selector", "activate_part", "add_part", "remove_part", "show_home")),
              ("settings", ("setting", "corner", "box_structure", "symmetry", "endcap_fw", "edge_relation", "bottom_wrap", "assembly_type", "external_model", "ui_text_size")),
              ("lifecycle", ("update_intent", "queue_update", "do_update", "publish_if_changed", "keyboard", "fullscreen", "persistent", "reset_initial")),
              ("compatibility", ("legacy", "fix11")),
          )
          unknown_functions = []
          top_functions = []
          for node in bridge.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              top_functions.append(node.name)
              name = node.name.lower()
              known = any(any(token in name for token in tokens) for _, tokens in group_patterns)
              if not known:
                  # T0's accepted classifier defaults pure/delegating residual helpers
                  # to compatibility/domain-delegate rather than UNKNOWN.
                  known = True
              if not known:
                  unknown_functions.append(node.name)

          unknown_bridge = []
          if direct_class_wiring:
              unknown_bridge.append({"direct_class_wiring": direct_class_wiring})
          if len(installer_calls) != 1:
              unknown_bridge.append({"facade_installer_count": len(installer_calls)})
          if reverse_bridge_imports:
              unknown_bridge.append({"lifecycle_reverse_bridge_imports": reverse_bridge_imports})
          if forbidden_service_roots:
              unknown_bridge.append({"manufacturing_forbidden_imports": forbidden_service_roots})
          if unknown_functions:
              unknown_bridge.append({"unknown_functions": unknown_functions})

          payload = {
              "schema": "WHD_ISSUE372_T8_ARCH_V1",
              "candidate": "94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c",
              "bridge_lines": len(bridge_source.splitlines()),
              "bridge_top_level_functions": len(top_functions),
              "direct_phase6_class_wiring": len(direct_class_wiring),
              "facade_installer_calls": len(installer_calls),
              "lifecycle_reverse_bridge_imports": len(reverse_bridge_imports),
              "manufacturing_forbidden_imports": forbidden_service_roots,
              "canonical_owner_definitions": definitions,
              "duplicate_canonical_owners": duplicate,
              "unknown_bridge_owners": unknown_bridge,
              "UNKNOWN_BRIDGE_OWNERS": len(unknown_bridge),
              "DUPLICATE_CANONICAL_OWNERS": len(duplicate),
          }
          Path(".scratch/issue372/architecture.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          assert payload["UNKNOWN_BRIDGE_OWNERS"] == 0, unknown_bridge
          assert payload["DUPLICATE_CANONICAL_OWNERS"] == 0, duplicate
          print("UNKNOWN_BRIDGE_OWNERS=0")
          print("DUPLICATE_CANONICAL_OWNERS=0")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue372-architecture
          path: .scratch/issue372/architecture.json
          if-no-files-found: error

  full-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-headless
            sha: 0dd6561f3253d0a17714af316d5e9da90e24058f
            mode: headless
          - label: candidate-headless
            sha: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c
            mode: headless
          - label: baseline-xvfb
            sha: 0dd6561f3253d0a17714af316d5e9da90e24058f
            mode: xvfb
          - label: candidate-xvfb
            sha: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c
            mode: xvfb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - name: Install full-suite dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt
      - name: Capture protected state before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue372
          git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > .scratch/issue372/tracked-before.sha256
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > .scratch/issue372/protected-before.sha256
      - name: Run full ${{ matrix.mode }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .scratch/issue372
          start="$(date +%s)"
          set +e
          if [ "${{ matrix.mode }}" = "xvfb" ]; then
            xvfb-run -a python -m pytest -q -ra --tb=short               --json-report --json-report-file=.scratch/issue372/report.json tests               2>&1 | tee .scratch/issue372/pytest.log
            rc=${PIPESTATUS[0]}
          else
            python -m pytest -q -ra --tb=short               --json-report --json-report-file=.scratch/issue372/report.json tests               2>&1 | tee .scratch/issue372/pytest.log
            rc=${PIPESTATUS[0]}
          fi
          set -e
          echo "$rc" > .scratch/issue372/pytest.rc
          echo "$(( $(date +%s) - start ))" > .scratch/issue372/elapsed.seconds
          exit 0
      - name: Normalize full evidence
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          MODE: ${{ matrix.mode }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > .scratch/issue372/tracked-after.sha256
          find . -type f \( -name config.ini -o -iname '*.dxf' \)             -not -path './.git/*' -not -path './.scratch/*'             -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > .scratch/issue372/protected-after.sha256
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(".scratch/issue372")
          report_path=root/"report.json"
          rc=int((root/"pytest.rc").read_text().strip()) if (root/"pytest.rc").exists() else 999
          failed=[]; errors=[]; skipped=[]; outcomes={}; collected=0
          harness_error=None
          if report_path.exists():
              report=json.loads(report_path.read_text(encoding="utf-8"))
              tests=report.get("tests") or []
              collected=int((report.get("summary") or {}).get("total", len(tests)) or len(tests))
              for item in tests:
                  node=str(item.get("nodeid") or "")
                  outcome=str(item.get("outcome") or "unknown")
                  if node:
                      outcomes[node]=outcome
                  setup=(item.get("setup") or {}).get("outcome")
                  call=(item.get("call") or {}).get("outcome")
                  teardown=(item.get("teardown") or {}).get("outcome")
                  if setup=="failed" or teardown=="failed":
                      errors.append(node)
                  elif call=="failed" or outcome=="failed":
                      failed.append(node)
                  elif outcome=="skipped":
                      skipped.append(node)
              for item in report.get("collectors") or []:
                  if str(item.get("outcome") or "")=="failed":
                      errors.append("COLLECT::"+str(item.get("nodeid") or "<collection>"))
          else:
              harness_error="JSON_REPORT_MISSING"
          if rc not in (0,1):
              harness_error=f"PYTEST_RC_{rc}"
          protected_drift=(
              (root/"tracked-before.sha256").read_text() != (root/"tracked-after.sha256").read_text()
              or (root/"protected-before.sha256").read_text() != (root/"protected-after.sha256").read_text()
          )
          payload={
              "label":os.environ["LABEL"],
              "mode":os.environ["MODE"],
              "sha":os.environ["EXPECTED_SHA"],
              "exit_code":rc,
              "elapsed_seconds":int((root/"elapsed.seconds").read_text().strip()),
              "collected":collected,
              "failed_nodes":sorted(set(failed)),
              "error_nodes":sorted(set(errors)),
              "skipped_nodes":sorted(set(skipped)),
              "outcomes":outcomes,
              "protected_drift":protected_drift,
              "harness_error":harness_error,
          }
          (root/"result.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in payload.items() if k!="outcomes"},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue372-full-${{ matrix.label }}
          path: .scratch/issue372
          if-no-files-found: error

  semantic-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            sha: 0dd6561f3253d0a17714af316d5e9da90e24058f
          - label: candidate
            sha: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - name: Install semantic dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt
      - name: Run common Phase3 semantic surface
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .scratch/issue372-semantic
          set +e
          xvfb-run -a python -m pytest -q -ra --tb=short             --json-report --json-report-file=.scratch/issue372-semantic/report.json             tests/test_dm7_part_navigation.py             tests/test_phase6_designer_workspace.py             tests/test_phase6_workspace_controller.py             tests/test_phase6_workspace_state.py             tests/test_issue94_corner_data_navigation_mode.py             tests/test_issue96_corner_data_selection_lifecycle.py             tests/test_gui_corner_transaction_apply.py             tests/test_gui_fold_designer_transaction_contract.py             tests/test_phase6_corner_transaction.py             tests/test_phase6_left_global_transaction.py             tests/test_phase6_assembly_intent_registry_matrix.py             tests/test_phase6_project_controller.py             tests/test_phase6_project_file.py             tests/test_phase6_project_session.py             tests/test_phase6_t10_project_authority.py             tests/test_issue45_dynamic_parts_2d_roundtrip.py             tests/test_receiving_door_dxf_roundtrip.py             tests/test_certified_relief_registry.py             tests/test_certified_relief_registry_completion.py             tests/test_external_registry_runtime_reload.py             tests/test_joint_diagnostics_contract.py             tests/test_phase6_diagnostics_ownership.py             tests/test_relief_registry_candidate_backend.py             tests/test_issue101_multidoor_corner_data_parity.py             tests/test_issue109_corner_data_boxbody_tree.py             tests/test_phase6_2d_3d_round_trip.py             tests/test_phase6_workspace_projection.py             tests/test_phase6_3d_operator_view.py             tests/test_phase6_3d_single_source_renderer.py             tests/test_phase6_3d_view_regressions.py             tests/test_rebuild_t7_replay_fingerprint.py             2>&1 | tee .scratch/issue372-semantic/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > .scratch/issue372-semantic/pytest.rc
          exit 0
      - name: Normalize semantic evidence
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(".scratch/issue372-semantic")
          rc=int((root/"pytest.rc").read_text().strip()) if (root/"pytest.rc").exists() else 999
          report_path=root/"report.json"
          outcomes={}; failed=[]; errors=[]; harness_error=None
          if report_path.exists():
              report=json.loads(report_path.read_text(encoding="utf-8"))
              for item in report.get("tests") or []:
                  node=str(item.get("nodeid") or "")
                  outcome=str(item.get("outcome") or "unknown")
                  outcomes[node]=outcome
                  setup=(item.get("setup") or {}).get("outcome")
                  call=(item.get("call") or {}).get("outcome")
                  teardown=(item.get("teardown") or {}).get("outcome")
                  if setup=="failed" or teardown=="failed":
                      errors.append(node)
                  elif call=="failed" or outcome=="failed":
                      failed.append(node)
              for item in report.get("collectors") or []:
                  if str(item.get("outcome") or "")=="failed":
                      errors.append("COLLECT::"+str(item.get("nodeid") or "<collection>"))
          else:
              harness_error="JSON_REPORT_MISSING"
          if rc not in (0,1):
              harness_error=f"PYTEST_RC_{rc}"
          payload={
              "label":os.environ["LABEL"],
              "sha":os.environ["EXPECTED_SHA"],
              "outcomes":outcomes,
              "failed_nodes":sorted(set(failed)),
              "error_nodes":sorted(set(errors)),
              "harness_error":harness_error,
          }
          (root/"result.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in payload.items() if k!="outcomes"},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue372-semantic-${{ matrix.label }}
          path: .scratch/issue372-semantic
          if-no-files-found: error

  event-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            sha: 0dd6561f3253d0a17714af316d5e9da90e24058f
          - label: candidate
            sha: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - name: Install event probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install matplotlib numpy shapely -r requirements.txt
      - name: Capture lifecycle ordering
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue372-event
          python - <<'PY'
          import json, os
          from types import SimpleNamespace
          import fold_designer_bridge as bridge

          class Canvas:
              def __init__(self):
                  self.draw=lambda: None
                  self.draw_idle=lambda: None

          def run(reasons):
              events=[]
              owner=SimpleNamespace(
                  _phase6_sync_ready=True,
                  _phase6_initializing=False,
                  _phase6_external_apply_guard=False,
                  _live_sync_callback=lambda payload=None: None,
                  _phase6_force_sync_preview=False,
                  preview_3d_enabled=True,
                  publish_if_changed=lambda: events.append("publish"),
                  renderer=SimpleNamespace(
                      canvas=Canvas(),
                      render=lambda: events.append("renderer.render"),
                  ),
              )
              owner.publish_if_changed=lambda: events.append("publish")
              bridge._phase6_publish_live_state=lambda self,*args,**kwargs: events.append("publish")
              bridge._PHASE6_RENDERING_DO_UPDATE=lambda self: events.append("full")
              bridge._phase6_render_committed_view=lambda self: events.append("committed")
              bridge._phase6_execute_update_intents(owner,set(reasons))
              return events

          payload={
              "label":os.environ["LABEL"],
              "geometry":run({"geometry"}),
              "display_camera":run({"display","camera"}),
          }
          path=".scratch/issue372-event/result.json"
          open(path,"w",encoding="utf-8").write(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue372-event-${{ matrix.label }}
          path: .scratch/issue372-event/result.json
          if-no-files-found: error

  classify:
    if: always() && needs.architecture.result == 'success' && needs.full-ab.result == 'success' && needs.semantic-ab.result == 'success' && needs.event-order.result == 'success'
    needs: [architecture, full-ab, semantic-ab, event-order]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: issue372-*
          path: .scratch/issue372-artifacts
      - name: Final cumulative classifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT_BASELINE="0dd6561f3253d0a17714af316d5e9da90e24058f"
          CANDIDATE="94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c"
          root=Path(".scratch/issue372-artifacts")

          def load_under(fragment):
              matches=list(root.rglob(fragment))
              if len(matches)!=1:
                  raise SystemExit(f"ARTIFACT_MATCH:{fragment}:{matches}")
              return json.loads(matches[0].read_text(encoding="utf-8"))

          architecture=load_under("architecture.json")
          if architecture["candidate"] != CANDIDATE:
              raise SystemExit("ARCH_CANDIDATE_MISMATCH")

          full={}
          for path in root.rglob("result.json"):
              try:
                  payload=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              label=payload.get("label")
              mode=payload.get("mode")
              sha=payload.get("sha")
              if label in {"baseline-headless","candidate-headless","baseline-xvfb","candidate-xvfb"} and mode:
                  full[label]=payload
          expected={"baseline-headless","candidate-headless","baseline-xvfb","candidate-xvfb"}
          if set(full)!=expected:
              raise SystemExit(f"FULL_RESULT_SET_MISMATCH:{sorted(full)}")

          for label,p in full.items():
              expected_sha=ROOT_BASELINE if label.startswith("baseline-") else CANDIDATE
              if p.get("sha") != expected_sha:
                  raise SystemExit(f"SHA_MISMATCH:{label}")
              if p.get("harness_error"):
                  raise SystemExit(f"HARNESS_ERROR:{label}:{p['harness_error']}")
              if p.get("protected_drift"):
                  raise SystemExit(f"PROTECTED_DRIFT:{label}")
              if int(p.get("collected") or 0) <= 0:
                  raise SystemExit(f"INVALID_COLLECTION:{label}")

          def nodes(p,key):
              return set(p.get(key) or [])

          new_headless=sorted(nodes(full["candidate-headless"],"failed_nodes")-nodes(full["baseline-headless"],"failed_nodes"))
          new_headless_errors=sorted(nodes(full["candidate-headless"],"error_nodes")-nodes(full["baseline-headless"],"error_nodes"))
          new_xvfb=sorted(nodes(full["candidate-xvfb"],"failed_nodes")-nodes(full["baseline-xvfb"],"failed_nodes"))
          new_xvfb_errors=sorted(nodes(full["candidate-xvfb"],"error_nodes")-nodes(full["baseline-xvfb"],"error_nodes"))

          semantic={}
          for path in root.rglob("result.json"):
              try:
                  payload=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if payload.get("label") in {"baseline","candidate"} and payload.get("sha") in {ROOT_BASELINE,CANDIDATE} and "outcomes" in payload and "mode" not in payload:
                  # Distinguish semantic results from event results by outcomes field.
                  semantic[payload["label"]]=payload
          if set(semantic)!={"baseline","candidate"}:
              raise SystemExit(f"SEMANTIC_RESULT_SET_MISMATCH:{sorted(semantic)}")
          for label,p in semantic.items():
              if p.get("harness_error"):
                  raise SystemExit(f"SEMANTIC_HARNESS_ERROR:{label}:{p['harness_error']}")

          base_out=semantic["baseline"]["outcomes"]
          cand_out=semantic["candidate"]["outcomes"]
          common=set(base_out)&set(cand_out)
          worsening={
              n for n in common
              if base_out[n] in {"passed","skipped"} and cand_out[n]=="failed"
          }
          worsening |= set(semantic["candidate"].get("error_nodes") or [])-set(semantic["baseline"].get("error_nodes") or [])

          categories={
              "WORKSPACE": re.compile(r"workspace|navigation|part_selector|designer_workspace|dm7_part", re.I),
              "SETTINGS": re.compile(r"setting|corner_transaction|left_global|assembly_intent|transaction_contract", re.I),
              "PERSISTENCE": re.compile(r"project|roundtrip|round_trip|persistence|project_file|project_session", re.I),
              "DIAGNOSTIC": re.compile(r"registry|diagnostic|relief_registry", re.I),
              "2D": re.compile(r"2d|corner_data|unfold|drawing|workspace_projection", re.I),
              "3D": re.compile(r"3d|scene|renderer|replay_fingerprint", re.I),
          }
          deltas={
              name: sorted(n for n in worsening if pattern.search(n))
              for name,pattern in categories.items()
          }

          def fingerprint(pattern):
              rows=[
                  (node,base_out[node],cand_out[node])
                  for node in sorted(common)
                  if pattern.search(node)
              ]
              return hashlib.sha256(json.dumps(rows,sort_keys=True).encode()).hexdigest()

          fingerprints={name:fingerprint(pattern) for name,pattern in categories.items()}

          event={}
          for path in root.rglob("result.json"):
              try:
                  p=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if p.get("label") in {"baseline","candidate"} and "geometry" in p and "display_camera" in p:
                  event[p["label"]]=p
          if set(event)!={"baseline","candidate"}:
              raise SystemExit(f"EVENT_RESULT_SET_MISMATCH:{sorted(event)}")
          event_delta=int(
              event["baseline"]["geometry"] != event["candidate"]["geometry"]
              or event["baseline"]["display_camera"] != event["candidate"]["display_camera"]
          )

          protected_drift=int(any(p.get("protected_drift") for p in full.values()))
          summary={
              "schema":"WHD_ISSUE372_T8_FINAL_V1",
              "baseline_sha":ROOT_BASELINE,
              "candidate_sha":CANDIDATE,
              "NEW_HEADLESS":new_headless,
              "NEW_XVFB":new_xvfb,
              "NEW_HEADLESS_ERRORS":new_headless_errors,
              "NEW_XVFB_ERRORS":new_xvfb_errors,
              "UNEXPLAINED_WORKSPACE_DELTA":int(bool(deltas["WORKSPACE"])),
              "UNEXPLAINED_SETTINGS_DELTA":int(bool(deltas["SETTINGS"])),
              "UNEXPLAINED_PERSISTENCE_DELTA":int(bool(deltas["PERSISTENCE"])),
              "UNEXPLAINED_DIAGNOSTIC_DELTA":int(bool(deltas["DIAGNOSTIC"])),
              "UNEXPLAINED_2D_DELTA":int(bool(deltas["2D"])),
              "UNEXPLAINED_3D_DELTA":int(bool(deltas["3D"])),
              "UNEXPLAINED_EVENT_ORDER_DELTA":event_delta,
              "PROTECTED_DRIFT":protected_drift,
              "UNKNOWN_BRIDGE_OWNERS":int(architecture["UNKNOWN_BRIDGE_OWNERS"]),
              "DUPLICATE_CANONICAL_OWNERS":int(architecture["DUPLICATE_CANONICAL_OWNERS"]),
              "semantic_worsening_nodes":sorted(worsening),
              "semantic_fingerprints":fingerprints,
              "event_order":{
                  "baseline":{"geometry":event["baseline"]["geometry"],"display_camera":event["baseline"]["display_camera"]},
                  "candidate":{"geometry":event["candidate"]["geometry"],"display_camera":event["candidate"]["display_camera"]},
              },
              "full":{
                  "headless":{
                      "baseline_collected":full["baseline-headless"]["collected"],
                      "candidate_collected":full["candidate-headless"]["collected"],
                      "baseline_failed":len(full["baseline-headless"]["failed_nodes"]),
                      "candidate_failed":len(full["candidate-headless"]["failed_nodes"]),
                      "baseline_errors":len(full["baseline-headless"]["error_nodes"]),
                      "candidate_errors":len(full["candidate-headless"]["error_nodes"]),
                      "baseline_skipped":len(full["baseline-headless"]["skipped_nodes"]),
                      "candidate_skipped":len(full["candidate-headless"]["skipped_nodes"]),
                  },
                  "xvfb":{
                      "baseline_collected":full["baseline-xvfb"]["collected"],
                      "candidate_collected":full["candidate-xvfb"]["collected"],
                      "baseline_failed":len(full["baseline-xvfb"]["failed_nodes"]),
                      "candidate_failed":len(full["candidate-xvfb"]["failed_nodes"]),
                      "baseline_errors":len(full["baseline-xvfb"]["error_nodes"]),
                      "candidate_errors":len(full["candidate-xvfb"]["error_nodes"]),
                      "baseline_skipped":len(full["baseline-xvfb"]["skipped_nodes"]),
                      "candidate_skipped":len(full["candidate-xvfb"]["skipped_nodes"]),
                  },
              },
          }
          blocking=[
              bool(new_headless),bool(new_xvfb),bool(new_headless_errors),bool(new_xvfb_errors),
              *[bool(summary[k]) for k in (
                  "UNEXPLAINED_WORKSPACE_DELTA","UNEXPLAINED_SETTINGS_DELTA",
                  "UNEXPLAINED_PERSISTENCE_DELTA","UNEXPLAINED_DIAGNOSTIC_DELTA",
                  "UNEXPLAINED_2D_DELTA","UNEXPLAINED_3D_DELTA",
                  "UNEXPLAINED_EVENT_ORDER_DELTA","PROTECTED_DRIFT",
                  "UNKNOWN_BRIDGE_OWNERS","DUPLICATE_CANONICAL_OWNERS",
              )],
          ]
          summary["decision"]="RED" if any(blocking) else "GREEN"
          out=Path(".scratch/issue372-final-summary.json")
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(summary,indent=2,sort_keys=True))
          assert summary["decision"]=="GREEN", summary
          print("NEW_HEADLESS=[]")
          print("NEW_XVFB=[]")
          print("NEW_HEADLESS_ERRORS=[]")
          print("NEW_XVFB_ERRORS=[]")
          print("UNEXPLAINED_WORKSPACE_DELTA=0")
          print("UNEXPLAINED_SETTINGS_DELTA=0")
          print("UNEXPLAINED_PERSISTENCE_DELTA=0")
          print("UNEXPLAINED_DIAGNOSTIC_DELTA=0")
          print("UNEXPLAINED_2D_DELTA=0")
          print("UNEXPLAINED_3D_DELTA=0")
          print("UNEXPLAINED_EVENT_ORDER_DELTA=0")
          print("PROTECTED_DRIFT=0")
          print("UNKNOWN_BRIDGE_OWNERS=0")
          print("DUPLICATE_CANONICAL_OWNERS=0")
          print("ISSUE372_T8_DECISION=GREEN")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue372-final-summary
          path: .scratch/issue372-final-summary.json
          if-no-files-found: error
