name: Issue 190 Post-migration Full-suite Evidence

on:
  push:
    branches:
      - fix/issue190-fullsuite-contract-migration-20260914

permissions:
  contents: read

jobs:
  full-suite-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout persisted migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and Xvfb
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Snapshot protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/issue190-postmigration-config-before.sha256
          if [ -d '基準檔' ]; then
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/issue190-postmigration-baseline-before.sha256
          else
            : > /tmp/issue190-postmigration-baseline-before.sha256
          fi

      - name: Full-suite Xvfb evidence only
        shell: bash
        run: |
          set +e
          set -o pipefail
          xvfb-run -a python -m pytest -q 2>&1 | tee /tmp/issue190-postmigration-pytest.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/issue190-postmigration-pytest.rc
          echo "pytest_exit_code=$rc"
          exit 0

      - name: Verify protected invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/issue190-postmigration-config-before.sha256
          if [ -d '基準檔' ]; then
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/issue190-postmigration-baseline-after.sha256
          else
            : > /tmp/issue190-postmigration-baseline-after.sha256
          fi
          diff -u /tmp/issue190-postmigration-baseline-before.sha256 /tmp/issue190-postmigration-baseline-after.sha256

      - name: Report full-suite evidence status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc=$(cat /tmp/issue190-postmigration-pytest.rc)
          echo "Full-suite pytest exit code: $rc"
          grep -E '^[0-9]+ failed,|^[0-9]+ passed|=+ short test summary info =+' /tmp/issue190-postmigration-pytest.log || true
          exit 0
