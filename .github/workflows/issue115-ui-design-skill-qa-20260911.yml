name: issue115-ui-design-skill-qa-20260911

on:
  push:
    branches:
      - feat/issue115-ui-design-de-ai-skill-20260911
    paths:
      - 'docs/superpowers/verification/.issue115-ui-design-trigger'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Knowledge Preflight
        run: |
          python3 tools/phase6_skill_preflight.py \
            --task "Issue #115: 建立 canonical UI設計與去AI味 Skill 與正式 contract；T1 只做 R1-R3，採中文 identity、Audit/Rewrite/New Design、逐元件安全重構與視覺 safeguard，之後跑 remote QA" \
            --changed-file '.agents/skills/engineering/UI設計與去AI味/SKILL.md' \
            --changed-file 'tests/test_ui_design_de_ai_skill_contract.py' \
            --changed-file 'docs/superpowers/verification/2026-09-11-issue115-ui-design-skill.md' \
            --changed-file '.github/workflows/issue115-ui-design-skill-qa-20260911.yml' \
            --evidence 'docs/superpowers/verification/2026-09-11-issue115-ui-design-skill.md'
      - name: T1 contract R1-R3
        run: python3 tests/test_ui_design_de_ai_skill_contract.py
      - name: Verify config invariant
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git diff --exit-code
