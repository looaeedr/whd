name: "QA | Issue #801 | Scheduler state integration"

on:
  push:
    branches:
      - integration/issue801-issue701-scheduler-reconcile-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run #701 integration and scheduler compatibility contracts
        run: |
          python -m pytest -q --confcutdir=tests/process \
            tests/process/test_issue701_scheduler_state_reconciliation.py \
            tests/process/test_scheduler_simulation_skill_contract.py \
            tests/process/test_write_scheduler_skill_contract.py \
            tests/process/test_issue696_startup_authorization_purpose.py \
            tests/process/test_issue697_operation_transaction_core.py
