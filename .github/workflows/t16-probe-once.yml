name: T16 placement probe once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t16_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib -r requirements.txt
      - name: Confirm T16 RED
        continue-on-error: true
        run: python -m pytest -q tests/test_phase6_t16_receiving_placement.py
      - name: Probe current Receiving world geometry
        run: xvfb-run -a python .github/t16_probe.py
