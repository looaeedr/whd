name: issue187-seam-inspect
on:
  push:
    branches:
      - feat/issue187-3d-output-migration-20260913
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact T2 seams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
              'gui.py': [
                  '    def _make_original_fold_designer_snapshot(self):',
                  '    def _apply_fold_designer_live_snapshot(self, payload):',
                  '    def open_original_fold_designer(self):',
                  '    def _setting_var_map(self):',
              ],
              'fold_designer_bridge.py': [
                  'def _phase6_build_persistent_top_area(self):',
                  'def _fix11_init(self, root, snapshot:',
                  'Phase6FoldDesignerApp.__init__ =',
              ],
          }
          for fn, needles in targets.items():
              lines = Path(fn).read_text(encoding='utf-8').splitlines()
              print(f'===== {fn} =====')
              for needle in needles:
                  matches = [i for i, line in enumerate(lines) if needle in line]
                  print(f'--- needle={needle!r} matches={matches} ---')
                  for i in matches:
                      lo=max(0,i-12); hi=min(len(lines),i+150)
                      for n in range(lo,hi):
                          print(f'{n+1:06d}: {lines[n]}')
          PY
