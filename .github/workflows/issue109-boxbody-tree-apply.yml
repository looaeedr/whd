name: Issue109 BoxBody Navigation Tree Apply
on:
  push:
    branches: [fix/issue109-boxbody-parent-child-tree-20260911]
    paths:
      - .github/workflows/issue109-boxbody-tree-apply.yml

permissions:
  contents: write

jobs:
  red-green-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue109-boxbody-parent-child-tree-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Phase6 changed-file preflight
        run: |
          cat > /tmp/issue109-preflight-evidence.txt <<'EOF'
          派工
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          驗證板件與DXF
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task '#109 TDD bugfix：Corner Data BoxBody parent/child View hierarchy；single-piece topology guard；stable physical identities；remote QA' \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue109_corner_data_boxbody_tree.py \
            --evidence /tmp/issue109-preflight-evidence.txt
      - name: Write approved RED tests only
        run: |
          cat > tests/test_issue109_corner_data_boxbody_tree.py <<'PY'
          import inspect
          from types import SimpleNamespace

          import fold_designer_bridge as bridge


          class _Workspace:
              def __init__(self, parts):
                  self.available_parts = tuple(parts)


          def _app(parts):
              return SimpleNamespace(designer_workspace=_Workspace(parts))


          def _rows(parts):
              fn = getattr(bridge, '_phase6_corner_data_navigation_rows', None)
              assert callable(fn), 'T2 requires a pure corner-data hierarchy projection'
              return fn(_app(parts))


          def test_three_piece_box_body_is_one_parent_with_three_physical_children():
              parts = (
                  'box_body',
                  'box_body:left_side',
                  'box_body:back',
                  'box_body:right_side',
                  'box_body:divider:1',
                  'head',
              )
              assert _rows(parts) == (
                  ('box_body', 0),
                  ('box_body:left_side', 1),
                  ('box_body:back', 1),
                  ('box_body:right_side', 1),
                  ('box_body:divider:1', 0),
                  ('head', 0),
              )


          def test_single_piece_box_body_has_parent_only_and_never_invents_fake_child():
              result = _rows(('box_body', 'head'))
              assert result == (('box_body', 0), ('head', 0))
              assert all(key != 'box_body:box_body' for key, _depth in result)


          def test_view_projection_never_invents_parent_when_authority_does_not_have_one():
              parts = ('box_body:left_side', 'box_body:back', 'head')
              assert _rows(parts) == (
                  ('box_body:left_side', 0),
                  ('box_body:back', 0),
                  ('head', 0),
              )


          def test_child_identity_and_back_label_stay_exact():
              parts = ('box_body', 'box_body:left_side', 'box_body:back', 'box_body:right_side')
              rows = _rows(parts)
              assert [key for key, depth in rows if depth == 1] == [
                  'box_body:left_side', 'box_body:back', 'box_body:right_side'
              ]
              assert bridge._phase6_part_label('box_body:back') == '後面板'
              assert bridge._phase6_part_label('box_body:left_side') == '左側板'
              assert bridge._phase6_part_label('box_body:right_side') == '右側板'


          def test_corner_data_panel_consumes_hierarchy_projection_and_indents_children():
              src = inspect.getsource(bridge._phase6_refresh_corner_data_parts_panel)
              assert '_phase6_corner_data_navigation_rows(self)' in src
              assert 'for key, depth in navigation_rows' in src
              assert 'padx=(18, 0) if depth else 0' in src


          def test_raw_authoritative_flat_projection_remains_unchanged():
              parts = (
                  'box_body', 'box_body:left_side', 'box_body:back', 'box_body:right_side',
                  'box_body:divider:7', 'door_c2_r1', 'base_plate_c1_r1'
              )
              app = _app(parts)
              assert bridge._phase6_corner_data_part_keys(app) == parts
          PY
      - name: RED — prove hierarchy contract is missing
        shell: bash
        run: |
          set +e
          pytest -q tests/test_issue109_corner_data_boxbody_tree.py > /tmp/issue109-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue109-red.log
          if [ "$rc" -eq 0 ]; then
            echo 'RED gate failed: T2 tests unexpectedly passed before production change'
            exit 1
          fi
          grep -q '5 failed, 1 passed' /tmp/issue109-red.log
          echo 'RED_109=PASS_EXPECTED_FAILURES_5'
      - name: GREEN — minimal View hierarchy implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fold_designer_bridge.py')
          s = p.read_text(encoding='utf-8')

          anchor = '''def _phase6_select_corner_data_part(self, key, *, refresh_view=True):\n'''
          helper = '''def _phase6_corner_data_navigation_rows(self) -> tuple[tuple[str, int], ...]:
              """Group current BoxBody physical pieces under the real aggregate parent for this View only."""
              keys = _phase6_corner_data_part_keys(self)
              children = _phase6_box_body_piece_keys(keys)
              child_keys = set(children)
              parent_present = "box_body" in keys
              rows = []
              for key in keys:
                  if parent_present and key in child_keys:
                      continue
                  rows.append((key, 0))
                  if parent_present and key == "box_body":
                      rows.extend((child, 1) for child in children)
              return tuple(rows)


          '''
          helper = '\n'.join(line[14:] if line.startswith('              ') else line for line in helper.splitlines()) + '\n'
          if anchor not in s:
              raise SystemExit('corner-data selection anchor not found')
          s = s.replace(anchor, helper + anchor, 1)

          old = '''    self.corner_data_part_rows = {}
              self.corner_data_part_buttons = {}
              for key in keys:
                  row = original.ttk.Frame(panel)
                  row.pack(fill=original.tk.X, pady=(0, 4))
                  button = original.ttk.Button(
                      row,
                      text=_phase6_part_label(key),
                      command=lambda k=key: _phase6_select_corner_data_part(self, k),
                  )
                  button.pack(side=original.tk.LEFT, fill=original.tk.X, expand=True)
                  self.corner_data_part_rows[key] = row
                  self.corner_data_part_buttons[key] = button
              return keys
          '''
          old = '\n'.join(line[14:] if line.startswith('              ') else line for line in old.splitlines()) + '\n'
          new = '''    self.corner_data_part_rows = {}
              self.corner_data_part_buttons = {}
              self.corner_data_part_depths = {}
              navigation_rows = _phase6_corner_data_navigation_rows(self)
              for key, depth in navigation_rows:
                  row = original.ttk.Frame(panel)
                  row.pack(fill=original.tk.X, pady=(0, 4), padx=(18, 0) if depth else 0)
                  button = original.ttk.Button(
                      row,
                      text=_phase6_part_label(key),
                      command=lambda k=key: _phase6_select_corner_data_part(self, k),
                  )
                  button.pack(side=original.tk.LEFT, fill=original.tk.X, expand=True)
                  self.corner_data_part_rows[key] = row
                  self.corner_data_part_buttons[key] = button
                  self.corner_data_part_depths[key] = depth
              return keys
          '''
          new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines()) + '\n'
          if old not in s:
              raise SystemExit('flat corner-data panel block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: GREEN — focused and inherited identity tests
        run: |
          pytest -q \
            tests/test_issue109_corner_data_boxbody_tree.py \
            tests/test_issue95_corner_data_authoritative_parts.py \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py \
            | tee /tmp/issue109-green.log
      - name: Create durable T2 checkpoint and journal
        run: |
          mkdir -p .scratch/issue107/checkpoints .scratch/issue107/state
          cat > .scratch/issue107/checkpoints/T2.md <<'EOF'
          # #107 / #109 T2 checkpoint
          - role: T2 Implementer
          - owning issue: #109
          - accepted base: 185fd413097701a77395da3746427ae7ab897584
          - branch: fix/issue109-boxbody-parent-child-tree-20260911
          - RED: 5 expected failures proving hierarchy projection/panel grouping missing
          - GREEN: dedicated T2 + issue95/96/97 identity contracts
          - production changed: fold_designer_bridge.py View hierarchy only
          - manufacturing flat key authority unchanged
          - pending: exact-head QA; QA review; then #110
          - resume: read #109 + this checkpoint, inspect exact-head QA
          EOF
          python - <<'PY'
          import json
          from pathlib import Path
          state = {
              'task_id': 107,
              'work_order': 109,
              'role': 'T2 Implementer',
              'branch': 'fix/issue109-boxbody-parent-child-tree-20260911',
              'accepted_base': '185fd413097701a77395da3746427ae7ab897584',
              'red': {'expected_failures': 5, 'status': 'confirmed'},
              'focused_green': {'status': 'confirmed'},
              'pending': ['exact-head remote QA', 'QA review'],
              'next': '#110 after #109 acceptance',
          }
          Path('.scratch/issue107/state/T2.json').write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify config invariant
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
      - name: Commit tested T2 source and checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py tests/test_issue109_corner_data_boxbody_tree.py
          git add -f .scratch/issue107/checkpoints/T2.md .scratch/issue107/state/T2.json
          git commit -m 'feat(#109): group BoxBody physical children under aggregate parent'
          git push origin HEAD:fix/issue109-boxbody-parent-child-tree-20260911
          echo "T2_COMMIT=$(git rev-parse HEAD)"
