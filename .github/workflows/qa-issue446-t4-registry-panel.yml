name: "QA #446 T4 Registry Diagnostics Panel"

on:
  push:
    branches:
      - refactor/issue446-t4-registry-diagnostics-owner-20260921
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_registry_diagnostics_panel.py'
      - 'tests/test_issue446_registry_diagnostics_presentation_owner.py'
      - 'tests/test_issue368_t4_registry_diagnostics_owner.py'
      - 'docs/superpowers/checkpoints/issue446-t4-*.txt'
      - 'docs/superpowers/checkpoints/issue446-t4-*.md'
      - '.github/workflows/qa-issue446-t4-registry-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: cc2af5a40769d8897ecd81679bfcb81fa36e5599

jobs:
  t4:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "派工 #446 T4 Registry diagnostics presentation ownership remote QA：驗證 phase6_registry_diagnostics_panel.py 抽離、fold_designer_bridge.py callback adapter、ownership contracts、Xvfb Registry presentation、成品板件與 DXF focused guard、workflow cleanup 與 drift audit。" \
            --changed-file fold_designer_bridge.py \
            --changed-file phase6_registry_diagnostics_panel.py \
            --changed-file tests/test_issue446_registry_diagnostics_presentation_owner.py \
            --changed-file tests/test_issue368_t4_registry_diagnostics_owner.py \
            --changed-file docs/superpowers/checkpoints/issue446-t4-preflight-evidence.txt \
            --changed-file docs/superpowers/checkpoints/issue446-t4-registry-census.md \
            --changed-file .github/workflows/qa-issue446-t4-registry-panel.yml \
            --evidence docs/superpowers/checkpoints/issue446-t4-preflight-evidence.txt

      - name: Exact lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/issue446-scope.txt
          python - <<'PY'
          from pathlib import Path
          paths=[x for x in Path('/tmp/issue446-scope.txt').read_text().splitlines() if x]
          allowed={
              'fold_designer_bridge.py',
              'phase6_registry_diagnostics_panel.py',
              'tests/test_issue446_registry_diagnostics_presentation_owner.py',
              'tests/test_issue368_t4_registry_diagnostics_owner.py',
              'docs/superpowers/checkpoints/issue446-t4-preflight-evidence.txt',
              'docs/superpowers/checkpoints/issue446-t4-registry-census.md',
              '.github/workflows/qa-issue446-t4-registry-panel.yml',
          }
          unexpected=sorted(set(paths)-allowed)
          assert not unexpected, f'ISSUE446_SCOPE_DRIFT={unexpected}'
          print('ISSUE446_SCOPE_DRIFT=0')
          print(f'ISSUE446_CHANGED_FILES={len(paths)}')
          PY

      - name: Compile changed Python owners
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            phase6_registry_diagnostics_panel.py \
            fold_designer_bridge.py \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            tests/test_issue368_t4_registry_diagnostics_owner.py

      - name: T4 ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            tests/test_issue368_t4_registry_diagnostics_owner.py \
            --tb=short | tee /tmp/issue446-owner.log
          grep -Eq '[0-9]+ passed' /tmp/issue446-owner.log
          echo 'T4_OWNERSHIP_CONTRACT=GREEN'

      - name: Registry controller and backend regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_relief_registry_candidate_backend.py \
            tests/test_certified_relief_registry.py \
            tests/test_external_registry_runtime_reload.py \
            --tb=short

      - name: Accepted predecessor A/B Registry presentation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue446-base
          git worktree add --detach /tmp/issue446-base "$BASE_SHA"
          files=(
            "tests/test_relief_registry_form.py"
            "tests/test_corner_registry_chinese_presentation.py"
            "tests/test_relief_registry_candidate_shadow_gui.py"
            "tests/test_phase6_assembly_registry_gui_matrix.py"
          )
          set +e
          (
            cd /tmp/issue446-base
            xvfb-run -a python -m pytest -q "${files[@]}" --tb=short
          ) | tee /tmp/issue446-base-xvfb.log
          base_rc=${PIPESTATUS[0]}
          xvfb-run -a python -m pytest -q "${files[@]}" --tb=short | tee /tmp/issue446-candidate-xvfb.log
          candidate_rc=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          def failed(path):
              text=Path(path).read_text(encoding='utf-8', errors='replace')
              return sorted(set(re.findall(r'^(?:FAILED|ERROR)\s+([^\s]+)', text, re.M)))

          base=failed('/tmp/issue446-base-xvfb.log')
          candidate=failed('/tmp/issue446-candidate-xvfb.log')
          candidate_only=sorted(set(candidate)-set(base))
          base_only=sorted(set(base)-set(candidate))
          print(f'BASE_FAILED={base}')
          print(f'CANDIDATE_FAILED={candidate}')
          print(f'CANDIDATE_ONLY={candidate_only}')
          print(f'BASE_ONLY={base_only}')
          if candidate_only:
              raise SystemExit(f'CANDIDATE_ONLY_REGISTRY_XVFB_FAILURE={candidate_only}')
          if candidate:
              if candidate != base:
                  raise SystemExit(f'REGISTRY_XVFB_AB_MISMATCH base={base} candidate={candidate}')
              print('REGISTRY_XVFB_CLASSIFICATION=INHERITED_BASELINE_DEBT')
          else:
              print('REGISTRY_XVFB_CLASSIFICATION=BOTH_GREEN')
          PY
          git worktree remove --force /tmp/issue446-base

      - name: Manufacturing and DXF focused guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dxf_acceptance.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_resolved_manufacturing_export.py \
            --tb=short

      - name: Protected Git-object invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            'ae_engine/**' \
            'phase6_project_*.py' \
            phase6_registry_diagnostics_controller.py \
            config.ini \
            '*.dxf'
          python - <<'PY'
          import subprocess
          base='cc2af5a40769d8897ecd81679bfcb81fa36e5599'
          def blob(ref,path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'])
          assert blob(base,'config.ini') == blob('HEAD','config.ini')
          assert blob(base,'phase6_registry_diagnostics_controller.py') == blob('HEAD','phase6_registry_diagnostics_controller.py')
          print('CONFIG_GIT_OBJECT_INVARIANT=1')
          print('REGISTRY_CONTROLLER_DRIFT=0')
          print('CERTIFIED_REGISTRY_DRIFT=0')
          print('GEOMETRY_OWNER_DRIFT=0')
          print('DXF_DRIFT=0')
          print('PROJECT_SCHEMA_DRIFT=0')
          print('ASSEMBLY_JOINT_MUTATION_DRIFT=0')
          PY

      - name: Bounded acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo "ISSUE=446"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "BASE_SHA=$BASE_SHA"
            echo "WORK_BRANCH=$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
