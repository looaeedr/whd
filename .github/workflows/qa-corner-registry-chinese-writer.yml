name: Corner Registry Chinese UI Writer

on:
  push:
    branches:
      - fix/corner-db-chinese-only-20260917
    paths:
      - 'tools/_qa_patch_corner_registry_chinese.py'
      - '.github/workflows/qa-corner-registry-chinese-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Capture protected hashes
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Apply presentation-only patch
        run: |
          set -euo pipefail
          python tools/_qa_patch_corner_registry_chinese.py
          git diff --check
          git diff -- fold_designer_bridge.py
      - name: Run Chinese-only presentation contract
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q -s tests/test_corner_registry_chinese_presentation.py
      - name: Verify protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
      - name: Commit production presentation fix
        run: |
          set -euo pipefail
          git config user.name 'WHD QA'
          git config user.email 'actions@users.noreply.github.com'
          git add fold_designer_bridge.py
          git diff --cached --check
          git commit -m 'fix: localize corner registry presentation'
          git push origin HEAD:fix/corner-db-chinese-only-20260917
