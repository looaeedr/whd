name: "QA #387 durable UI writeback"

on:
  push:
    branches:
      - integration/issue387-assembly-layout-final-20260919
    paths:
      - '.agents/skills/engineering/UI設計與去AI味/SKILL.md'
      - '個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md'
      - '個人AI檔案庫/第二層_專案與SOP/11_WHD組合體SharedContent呈現規則.md'
      - 'docs/superpowers/checkpoints/issue387-assembly-layout-final-acceptance.md'
      - '.github/workflows/qa-issue387-durable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 0947e546063c4c2118cb778d2798da5dbff682b3)" = "0947e546063c4c2118cb778d2798da5dbff682b3"
          test "$(git merge-base HEAD 04dc9513bf227fb4090beabea21c65730d25d5d1)" = "04dc9513bf227fb4090beabea21c65730d25d5d1"

      - name: Install knowledge harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest

      - name: Focused authority guards
        run: |
          python -m pytest -q             tests/knowledge/test_issue231_authority_map_normalization.py             tests/knowledge/test_knowledge_authority_contract.py             tests/knowledge/test_issue233_strict_metadata_migration.py             -k "not all_governed_markdown_has_valid_whd_doc_meta_v1 and not strict_validator_accepts_the_repository_after_migration"             --tb=short

      - name: Strict metadata A-B classifier
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue387-base 0947e546063c4c2118cb778d2798da5dbff682b3
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          def errors(root):
              tool = root / "tools/knowledge_governance.py"
              spec = importlib.util.spec_from_file_location("kg_" + root.name, tool)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return sorted(module.validate_strict(root))

          base = errors(Path("/tmp/issue387-base"))
          candidate = errors(Path(".").resolve())
          print("BASE_STRICT_DEBT", len(base))
          print("CANDIDATE_STRICT_DEBT", len(candidate))
          added = sorted(set(candidate) - set(base))
          removed = sorted(set(base) - set(candidate))
          if added or removed:
              print("ADDED", json.dumps(added, ensure_ascii=False, indent=2))
              print("REMOVED", json.dumps(removed, ensure_ascii=False, indent=2))
              raise SystemExit(1)
          assert not any("issue387" in item or "SharedContent" in item for item in candidate)
          print("PASS STRICT_METADATA_NEW_DEBT=0")
          PY

      - name: Durable routing and marker guards
        shell: bash
        run: |
          set -euo pipefail
          AI='個人AI檔案庫/第二層_專案與SOP/11_WHD組合體SharedContent呈現規則.md'
          MAP='個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md'
          SKILL='.agents/skills/engineering/UI設計與去AI味/SKILL.md'
          CHECK='docs/superpowers/checkpoints/issue387-assembly-layout-final-acceptance.md'
          test -f "$AI"
          test -f "$CHECK"
          grep -q 'whd_contract: phase6-assembly-shared-content-presentation' "$AI"
          test "$(grep -c 'contract=phase6-assembly-shared-content-presentation role=CURRENT' "$MAP")" -eq 1
          grep -q 'ISSUE382_SHARED_CONTENT_PRESENTATION_CONTRACT' "$SKILL"
          grep -q 'RUN `35455382053`' "$CHECK"
          git diff --check 0947e546063c4c2118cb778d2798da5dbff682b3...HEAD
          echo "PASS DURABLE_WRITEBACK=1"
