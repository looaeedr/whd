name: Issue292 T4 Task7 Extract
on:
  push:
    branches: [refactor/issue292-task7-adapters-green-20260917]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify Task7 harness contract
        run: python -m pytest -q tests/test_issue292_task7_harness_contract.py
      - name: Extract unambiguous T4 presentation methods
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path('gui.py')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines(True)
          tree = ast.parse(s)
          cls = next(
              n for n in tree.body
              if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost'
          )
          names = {
              'create_input_row',
              'create_result_row',
              'create_separator',
              'create_advanced_inputs',
              'create_sub_input',
              'toggle_advanced_panel',
          }
          nodes = {
              n.name: n
              for n in cls.body
              if isinstance(n, ast.FunctionDef) and n.name in names
          }
          assert names == nodes.keys(), f'missing root adapters: {sorted(names - nodes.keys())}'

          module = Path('gui_modules/parts/panels/common.py')
          old = module.read_text(encoding='utf-8')
          existing_tree = ast.parse(old)
          existing = {
              n.name for n in existing_tree.body
              if isinstance(n, ast.FunctionDef)
          }

          delegated = set()
          for name, node in nodes.items():
              source = ''.join(lines[node.lineno - 1:node.end_lineno])
              if f'_{name}_impl(' in source:
                  delegated.add(name)
          missing_existing = delegated - existing
          assert not missing_existing, (
              'root delegates without extracted implementation: '
              f'{sorted(missing_existing)}'
          )
          todo = names - delegated

          moved = []
          for name in sorted(todo, key=lambda x: nodes[x].lineno):
              n = nodes[name]
              block = ''.join(lines[n.lineno - 1:n.end_lineno])
              block = block[4:] if block.startswith('    ') else block
              block = block.replace(
                  'def ' + name + '(self,',
                  'def ' + name + '(host,',
                  1,
              ).replace(
                  'def ' + name + '(self):',
                  'def ' + name + '(host):',
                  1,
              )
              block = block.replace('self.', 'host.')
              # Normalize only the newly moved block so git diff --check cannot
              # be tripped by legacy trailing whitespace copied from gui.py.
              block = '\n'.join(line.rstrip() for line in block.splitlines()) + '\n'
              moved.append(block)

          if moved:
              module.write_text(
                  old.rstrip() + '\n\n' + '\n'.join(moved),
                  encoding='utf-8',
              )

          for n in sorted(
              (nodes[name] for name in todo),
              key=lambda item: item.lineno,
              reverse=True,
          ):
              src = ''.join(lines[n.lineno - 1:n.end_lineno])
              header = src.splitlines()[0].rstrip()
              args = n.args
              call = [a.arg for a in args.args[1:]]
              if args.vararg:
                  call.append('*' + args.vararg.arg)
              for a in args.kwonlyargs:
                  call.append(a.arg + '=' + a.arg)
              if args.kwarg:
                  call.append('**' + args.kwarg.arg)
              repl = (
                  header
                  + '\n        return _'
                  + n.name
                  + '_impl(self'
                  + ((', ' + ', '.join(call)) if call else '')
                  + ')\n'
              )
              lines[n.lineno - 1:n.end_lineno] = [repl]

          if todo:
              p.write_text(''.join(lines), encoding='utf-8')
          else:
              print('Task7 common adapters already extracted; transform is idempotent.')
          PY
      - name: Wire common imports
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('gui.py')
          s = p.read_text(encoding='utf-8')
          marker = 'from gui_modules.parts.panels.box_body import setup_tab_z_ui as _setup_tab_z_ui_impl\n'
          names = [
              'create_input_row',
              'create_result_row',
              'create_separator',
              'create_advanced_inputs',
              'create_sub_input',
              'toggle_advanced_panel',
          ]
          imp = (
              'from gui_modules.parts.panels.common import (\n'
              + ''.join(f'    {n} as _{n}_impl,\n' for n in names)
              + ')\n\n'
          )
          if imp not in s:
              assert marker in s, 'common adapter import anchor missing'
              s = s.replace(marker, imp + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Task7 common adapter imports already wired.')
          PY
      - name: Verify focused non-completion gates fail closed
        run: |
          python -m pytest -q tests/test_issue292_gui_phase2_t4_part_panels.py \
            -k 'not test_moved_root_methods_are_absent_or_thin_delegates and not test_gui_meets_reconciled_t4_root_gate'
      - name: Classify only the two known Task7 completion gates
        run: |
          set +e
          python -m pytest -q tests/test_issue292_gui_phase2_t4_part_panels.py::test_moved_root_methods_are_absent_or_thin_delegates
          ROOT_RC=$?
          python -m pytest -q tests/test_issue292_gui_phase2_t4_part_panels.py::test_gui_meets_reconciled_t4_root_gate
          LOC_RC=$?
          set -e
          if [ "$ROOT_RC" -gt 1 ]; then
            echo "root completion gate errored with rc=$ROOT_RC"
            exit "$ROOT_RC"
          fi
          if [ "$LOC_RC" -gt 1 ]; then
            echo "LOC completion gate errored with rc=$LOC_RC"
            exit "$LOC_RC"
          fi
          echo "Task7 completion gate status: root_rc=$ROOT_RC loc_rc=$LOC_RC"
      - name: Commit extraction for next RED measurement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gui.py gui_modules/parts/panels/common.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No extraction delta; current head is already normalized.'
            exit 0
          fi
          git commit -m 'refactor(#292): extract common T4 presentation adapters'
          git push origin HEAD:${GITHUB_REF_NAME}
