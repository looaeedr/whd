name: Issue292 T4 Task7 Extract
on:
  push:
    branches: [refactor/issue292-task7-adapters-green-20260917]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract unambiguous T4 presentation methods
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('gui.py'); s=p.read_text(encoding='utf-8'); lines=s.splitlines(True)
          tree=ast.parse(s); cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='Phase6ApplicationHost')
          names={'create_input_row','create_result_row','create_separator','create_advanced_inputs','create_sub_input','toggle_advanced_panel'}
          nodes={n.name:n for n in cls.body if isinstance(n,ast.FunctionDef) and n.name in names}
          missing=names-nodes.keys(); assert not missing, missing
          # These generic widget builders are presentation-only; preserve exact behavior by moving bodies unchanged.
          module=Path('gui_modules/parts/panels/common.py')
          old=module.read_text(encoding='utf-8')
          moved=[]
          for name in sorted(names, key=lambda x:nodes[x].lineno):
              n=nodes[name]; block=''.join(lines[n.lineno-1:n.end_lineno])
              # class method -> module function(host, ...), mechanically rewrite self references/signature only.
              block=block[4:] if block.startswith('    ') else block
              block=block.replace('def '+name+'(self,', 'def '+name+'(host,', 1).replace('def '+name+'(self):','def '+name+'(host):',1)
              block=block.replace('self.', 'host.')
              moved.append(block.rstrip()+'\n')
          module.write_text(old.rstrip()+'\n\n'+'\n'.join(moved),encoding='utf-8')
          # replace root implementations with <=4-line delegates
          for n in sorted(nodes.values(), key=lambda n:n.lineno, reverse=True):
              sig=''.join(lines[n.lineno-1:n.body[0].lineno-1]) if n.body else lines[n.lineno-1]
              # Preserve original signature, replace body with generic forwarding wrapper generated explicitly below.
              src=''.join(lines[n.lineno-1:n.end_lineno])
              header=src.splitlines()[0]
              import re
              params=header[header.find('(')+1:header.rfind(')')]
              # simple parameter forwarding from AST is safer than textual parsing
              args=n.args
              call=[]
              for a in args.args[1:]: call.append(a.arg)
              if args.vararg: call.append('*'+args.vararg.arg)
              for a in args.kwonlyargs: call.append(a.arg+'='+a.arg)
              if args.kwarg: call.append('**'+args.kwarg.arg)
              repl=header+'\n        return _'+n.name+'_impl(self'+((','+' '.join([])) if False else '')+((', '+', '.join(call)) if call else '')+')\n'
              lines[n.lineno-1:n.end_lineno]=[repl]
          p.write_text(''.join(lines),encoding='utf-8')
          PY
      - name: Wire common imports and verify focused gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gui.py'); s=p.read_text(encoding='utf-8')
          marker='from gui_modules.parts.panels.box_body import setup_tab_z_ui as _setup_tab_z_ui_impl\n'
          names=['create_input_row','create_result_row','create_separator','create_advanced_inputs','create_sub_input','toggle_advanced_panel']
          imp='from gui_modules.parts.panels.common import (\n'+''.join(f'    {n} as _{n}_impl,\n' for n in names)+')\n\n'
          assert marker in s
          s=s.replace(marker,imp+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_issue292_gui_phase2_t4_part_panels.py || true
      - name: Commit extraction for next RED measurement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gui.py gui_modules/parts/panels/common.py
          git diff --cached --check
          git commit -m 'refactor(#292): extract common T4 presentation adapters'
          git push origin HEAD:${GITHUB_REF_NAME}
