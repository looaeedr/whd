name: Issue176 T3 Current Spec QA

on:
  push:
    branches:
      - docs/issue176-ae-engine-registry-authority-20260913
    paths:
      - 'tests/knowledge/test_ae_engine_current_spec_contract.py'
      - '個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md'
      - '.github/workflows/issue176-t3-qa.yml'
  workflow_dispatch:

jobs:
  current-spec-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Record protected invariants before
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run final changed-file Knowledge Preflight
        shell: bash
        run: |
          cat > /tmp/issue176-evidence.txt <<'EOF'
          Python測試實務
          phase6-corner-3d-model-integrity
          phase6-release-packaging
          monitoring-remote-qa
          tdd
          diagnosing-bugs
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: release_required_artifacts.json
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/07_Phase6尺寸語意與標準截角母規則.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task 'T3 update ae_engine Certified Relief Registry current manufacturing documentation authority and remote QA' \
            --changed-file 'tests/knowledge/test_ae_engine_current_spec_contract.py' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md' \
            --changed-file '.github/workflows/issue176-t3-qa.yml' \
            --evidence /tmp/issue176-evidence.txt
      - name: Run T3 current-spec contract
        run: python -m pytest -q tests/knowledge/test_ae_engine_current_spec_contract.py
      - name: Verify protected invariants
        if: always()
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baseline.before /tmp/baseline.after
