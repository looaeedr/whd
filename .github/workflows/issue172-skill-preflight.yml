name: Issue 172 Skill Preflight

on:
  push:
    branches:
      - docs/issue172-multi-ai-claim-progress-20260913

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run changed-file knowledge preflight
        run: |
          cat > /tmp/issue172-evidence.txt <<'EOF'
          READ_SKILL: 寫技能
          READ_SKILL: 派工
          READ_SKILL: issue-closure-gate
          READ_SKILL: diagnosing-bugs
          READ_SKILL: tdd
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "寫技能：修改派工 Skill，加入多 AI owning Issue 唯一 claim 鎖、claim 失敗禁止重覆施工、工單進度可見性與 stale claim recovery；建立永久 contract test。" \
            --changed-file ".agents/skills/engineering/派工/SKILL.md" \
            --changed-file "tests/test_dispatching_skill_timeout_contract.py" \
            --changed-file "個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md" \
            --evidence /tmp/issue172-evidence.txt
