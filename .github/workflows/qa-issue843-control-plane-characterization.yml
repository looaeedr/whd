name: WHD｜工單 #843｜控制面行為矩陣驗證
run-name: "WHD｜工單 #843｜控制面行為矩陣｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue843-control-plane-characterization-20260927

permissions:
  contents: read

jobs:
  matrix:
    name: 工單843控制面矩陣契約
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出受測版本
        uses: actions/checkout@v4
      - name: 設定測試環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試工具
        run: python -m pip install pytest
      - name: 驗證工作流程顯示名稱
        run: >-
          python tools/actions_visible_naming_guard.py
          .github/workflows/qa-issue843-control-plane-characterization.yml
      - name: 執行控制面矩陣契約
        run: >-
          python -m pytest -q
          tests/process/test_issue843_control_plane_behavior_matrix.py
