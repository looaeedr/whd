name: "QA #336 T3 Left Content Switch"

on:
  push:
    branches:
      - ui/issue336-left-content-switch-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#336)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact T3 RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue336_left_content_switch.py::test_t3_source_contract_separates_part_selector_from_content_modes > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#336 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-source:
    if: ${{ contains(github.event.head_commit.message, 'green(#336)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_issue336_left_content_switch.py -k "not reachable and not residue"

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#336)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: T3 real Tk acceptance and focused regressions
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue336_left_content_switch.py \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_phase6_latest_layout_contract.py \
            tests/test_issue175_dm7_navigation_authority_contract.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#336)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid protected authority drift
        shell: bash
        run: |
          git diff --name-only 6f3dc763ac22a1f56a1fa80f817ae574ba0706a5...HEAD | tee files.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("files.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          exact = {
              "config.ini",
              "phase6_designer_workspace.py",
              "phase6_workspace_controller.py",
              "phase6_project_file.py",
              "phase6_final_scene_view.py",
          }
          bad = sorted(p for p in changed if p in exact or p.startswith("基準檔/") or p.startswith("ae_engine/"))
          if bad:
              raise SystemExit(f"#336 protected authority drift: {bad}")
          print("#336 protected drift PASS", sorted(changed))
          PY
