name: "QA #510 Receiving back-panel modes"

on:
  push:
    branches:
      - feature/issue510-receiving-back-panel-modes-20260922
    paths:
      - phase6_box_body_structure.py
      - ae_engine/cabinet_types/receiving.py
      - ae_engine/box_body_structure.py
      - ae_engine/contracts.py
      - ae_engine/manufacturing_api.py
      - phase6_settings_panel.py
      - fold_designer_bridge.py
      - tests/test_issue510_receiving_back_panel_modes.py
      - .github/workflows/qa-issue510-back-panel-modes.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest matplotlib ezdxf shapely -r requirements.txt

      - name: Fresh execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
          git show origin/coord/dispatch-claims:.dispatch/claims/issue-510.json > /tmp/issue510-claim.json
          python tools/execution_claim_guard.py             --claim /tmp/issue510-claim.json             --issue 510             --worker chatgpt             --branch feature/issue510-receiving-back-panel-modes-20260922             --action qa-dispatch             --base-sha faf93f13804cb15f8f590c3296869980dadae46b             --head-sha "$GITHUB_SHA"

      - name: Focused #510
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue510_receiving_back_panel_modes.py --tb=short

      - name: Broader Receiving and multipart regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue509_receiving_horizontal_marking.py \
            tests/test_phase6_box_body_structure.py \
            tests/test_phase6_t06_receiving_fresh_family.py \
            tests/test_phase6_project_file.py \
            tests/test_multipart_dxf_acceptance.py \
            --tb=short

      - name: Xvfb rear-panel selector and Receiving child sections
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue510_receiving_back_panel_modes.py::test_receiving_back_panel_selector_lives_inside_existing_back_section_and_updates_canonical_state \
            tests/test_phase6_t14_box_body_child_sections.py::test_r11_receiving_three_piece_side_back_sections_bind_real_piece_stable_ids \
            tests/test_phase6_t14_box_body_child_sections.py::test_r11_save_reload_rebuilds_sections_from_authoritative_physical_piece_state \
            --tb=short

      - name: Config invariant
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- config.ini
