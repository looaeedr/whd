name: "Finalize #500 via canonical continuity guard"

on:
  push:
    branches:
      - coord/dispatch-claims
    paths:
      - '.github/workflows/qa-issue500-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source owner
        uses: actions/checkout@v4
        with:
          ref: work/issue506-phase5-settings-dataflow-20260922
          path: source

      - name: Checkout coordination branch
        uses: actions/checkout@v4
        with:
          ref: coord/dispatch-claims
          path: coord

      - name: Authorize and verify finalization
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/continuity_controller.py authorize-finalization \
            coord/.dispatch/checkpoints/issue-500.json \
            --issue '#500' \
            --branch work/issue506-phase5-settings-dataflow-20260922 \
            --head-sha 6d6cb7ef7c0147fe33413ffbbbf4c2c877abac49 \
            --proof-out coord/.dispatch/checkpoints/issue-500.finalization-proof.json

          python source/tools/continuity_controller.py verify-finalization-proof \
            coord/.dispatch/checkpoints/issue-500.json \
            coord/.dispatch/checkpoints/issue-500.finalization-proof.json \
            --issue '#500' \
            --branch work/issue506-phase5-settings-dataflow-20260922 \
            --head-sha 6d6cb7ef7c0147fe33413ffbbbf4c2c877abac49

      - name: Commit finalization proof
        working-directory: coord
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .dispatch/checkpoints/issue-500.finalization-proof.json
          git diff --cached --quiet && exit 0
          git commit -m "continuity: finalize issue 500 proof"
          git push origin HEAD:coord/dispatch-claims
