name: "QA #390 T1 RED immutable Settings contracts"

on:
  push:
    branches:
      - "refactor/issue390-phase4-t1-settings-contracts-20260920"
    paths:
      - "tests/test_issue390_settings_contracts.py"
      - ".github/workflows/qa-issue390-t1-red.yml"

permissions:
  contents: read

jobs:
  intended-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=390"
          echo "PREDECESSOR=d3f37e251816af974d940e7f2c1738dbb38edb3e"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor d3f37e251816af974d940e7f2c1738dbb38edb3e HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest

      - name: Require intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue390_settings_contracts.py --tb=short | tee /tmp/issue390-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "PYTEST_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED_GREEN"
            exit 1
          fi
          grep -Eq "ModuleNotFoundError.*phase6_settings_contracts|No module named 'phase6_settings_contracts'" /tmp/issue390-red.log
          echo "ISSUE390_T1_EXPECTED_RED=1"
