name: "QA #397 post-merge smoke"

on:
  push:
    branches:
      - qa/issue397-postmerge-smoke-20260920
  pull_request:
    branches:
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Settings runtime smoke
        run: python -m pytest -q tests/test_issue397_phase4_runtime_remediation.py::test_restore_setting_clears_service_owned_pending_entry --tb=short
      - name: 3D composition smoke
        run: xvfb-run -a python -m pytest -q tests/test_issue397_phase4_runtime_remediation.py::test_real_designer_composition_keeps_settings_maps_and_family_transition_live --tb=short
      - name: Phase 4 focused regressions
        run: python -m pytest -q tests/test_issue397_phase4_runtime_remediation.py --tb=short
      - name: Protected drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin cleanup/2d-3d-sync --depth=1
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "c56f670dc7e60b54c6a47f797a379ff4f2b1e3ad"
          echo "PASS PRODUCTION_READBACK=c56f670dc7e60b54c6a47f797a379ff4f2b1e3ad"
