name: Apply Receiving BoxBody parent restore

on:
  push:
    branches:
      - fix/receiving-boxbody-unfold-restore-20260912
    paths:
      - .github/workflows/apply-receiving-boxbody-parent-restore-20260912.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/receiving-boxbody-unfold-restore-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Restore accepted #108 parent identity contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fold_designer_bridge.py')
          text = path.read_text(encoding='utf-8')
          old_doc = '    """Resolve operator identity to a current physical part without activating the workspace."""'
          new_doc = '    """Resolve operator identity without letting child-memory replace the aggregate parent."""'
          old_if = '    if key == "box_body" or _phase6_is_box_body_physical_piece_key(key):'
          new_if = '    if key == "box_body":\n        return key\n    if _phase6_is_box_body_physical_piece_key(key):'
          assert text.count(old_doc) == 1, f'legacy resolver doc count={text.count(old_doc)}'
          assert text.count(old_if) == 1, f'legacy resolver condition count={text.count(old_if)}'
          text = text.replace(old_doc, new_doc, 1)
          text = text.replace(old_if, new_if, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused GREEN
        run: |
          sha256sum config.ini > /tmp/config.before
          pytest -q -s \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py
          sha256sum config.ini > /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
      - name: Commit minimal production restore
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py
          git diff --cached --check
          git commit -m 'fix: restore receiving boxbody aggregate parent identity'
          git push origin HEAD:fix/receiving-boxbody-unfold-restore-20260912
