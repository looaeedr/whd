name: T48-1 Receiving Divider FW Face Flush v2

on:
  push:
    branches:
      - work/48-receiving-fw-divider-flush-relief-gate
    paths:
      - ".github/workflows/t48-1-fw-flush.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Knowledge preflight
        shell: bash
        run: |
          mkdir -p logs
          cat > t48_1_preflight_evidence.txt <<'EOF'
          phase6-corner-3d-model-integrity
          diagnosing-bugs
          tdd
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/07_Phase6尺寸語意與標準截角母規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          EOF
          python tools/phase6_skill_preflight.py             --task "bug fix Receiving Divider FW formed face placement 3D assembly TDD remote QA"             --changed-file ae_engine/assembly_placement.py             --changed-file ae_engine/assembly_geometry.py             --changed-file ae_engine/cabinet_types/receiving.py             --changed-file ae_engine/cabinet_types/policy.py             --changed-file tests/test_issue48_receiving_fw_flush_red.py             --changed-file tests/test_phase6_t16_receiving_placement.py             --evidence t48_1_preflight_evidence.txt             > logs/t48_1.preflight.txt
          cat logs/t48_1.preflight.txt
      - name: Compile
        run: |
          python -m py_compile             ae_engine/assembly_placement.py             ae_engine/assembly_geometry.py             ae_engine/cabinet_types/receiving.py             ae_engine/cabinet_types/policy.py             tests/test_issue48_receiving_fw_flush_red.py             tests/test_phase6_t16_receiving_placement.py
      - name: Targeted acceptance
        shell: bash
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q             tests/test_issue48_receiving_fw_flush_red.py::test_r2_divider_fw_physical_skins_are_flush_with_both_box_body_fw_skins             tests/test_issue48_receiving_fw_flush_red.py::test_r2b_fw_face_flush_survives_dimension_changes             tests/test_phase6_t16_receiving_placement.py             tests/test_assembly_placement_divider.py             | tee t48_1.log
          after="$(sha256sum config.ini | awk '{print $1}')"
          printf '{"config_before":"%s","config_after":"%s"}\n' "$before" "$after" > t48_1_state.json
          cat t48_1_state.json
          test "$before" = "$after"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t48-1-fw-flush-${{ github.run_id }}
          path: |
            t48_1.log
            t48_1_state.json
            logs/t48_1.preflight.txt
