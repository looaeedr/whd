name: "QA #372 T8 exact new-failure remediation sweep"

on:
  push:
    branches:
      - fix/issue372-t8-t7-runtime-remediation-20260919
    paths:
      - '.github/workflows/qa-issue372-t8-new-failures-sweep.yml'
      - 'tests/test_phase6_latest_layout_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-new:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt
      - name: Require original NEW_HEADLESS set green
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue335_top_toolbar.py::test_output_authority_routes_are_unchanged \
            tests/test_issue336_left_content_switch.py::test_t3_source_contract_separates_part_selector_from_content_modes \
            tests/test_issue340_keyboard_focus.py::test_t7_source_contract_installs_authoritative_shortcuts_and_focus_guards \
            tests/test_issue350_manufacturing_orchestration_extraction.py::test_issue350_phase1_only_service_wiring_is_retired_after_t4 \
            tests/test_issue351_t6_compatibility_gate.py::test_issue351_compatibility_gate \
            tests/test_issue366_t2c_corner_external_controller.py::test_issue366_t2c_bridge_delegates_transaction_semantics_and_keeps_only_effects \
            tests/test_phase6_2d_3d_round_trip.py::test_save_reload_to_3d_to_2d_round_trip \
            tests/test_phase6_gui_performance_contract.py::test_external_designer_apply_has_explicit_anti_echo_guard_contract \
            tests/test_phase6_ui_state_regressions.py::test_box_assembly_combobox_selection_updates_joint_graph_without_rewriting_corner_state

  xvfb-new:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt
      - name: Require original NEW_XVFB set green
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue335_top_toolbar.py::test_output_authority_routes_are_unchanged \
            tests/test_issue336_left_content_switch.py::test_t3_controls_are_reachable_and_modes_are_exclusive[large] \
            tests/test_issue336_left_content_switch.py::test_t3_controls_are_reachable_and_modes_are_exclusive[medium] \
            tests/test_issue336_left_content_switch.py::test_t3_controls_are_reachable_and_modes_are_exclusive[small] \
            tests/test_issue336_left_content_switch.py::test_t3_source_contract_separates_part_selector_from_content_modes \
            tests/test_issue336_left_content_switch.py::test_t3_switch_clears_posted_navigation_menu_residue \
            tests/test_issue337_control_hierarchy.py::test_t4_designer_assigns_semantic_roles_without_callback_changes \
            tests/test_issue340_keyboard_focus.py::test_t7_focus_traversal_reaches_main_controls_and_skips_compat_canvas[large] \
            tests/test_issue340_keyboard_focus.py::test_t7_focus_traversal_reaches_main_controls_and_skips_compat_canvas[medium] \
            tests/test_issue340_keyboard_focus.py::test_t7_focus_traversal_reaches_main_controls_and_skips_compat_canvas[small] \
            tests/test_issue340_keyboard_focus.py::test_t7_source_contract_installs_authoritative_shortcuts_and_focus_guards \
            tests/test_issue350_manufacturing_orchestration_extraction.py::test_issue350_phase1_only_service_wiring_is_retired_after_t4 \
            tests/test_issue351_t6_compatibility_gate.py::test_issue351_compatibility_gate \
            tests/test_issue366_t2c_corner_external_controller.py::test_issue366_t2c_bridge_delegates_transaction_semantics_and_keeps_only_effects \
            tests/test_phase6_2d_3d_round_trip.py::test_save_reload_to_3d_to_2d_round_trip \
            tests/test_phase6_designer_workspace.py::test_destroying_designer_cancels_owned_tk_after_callbacks \
            tests/test_phase6_gui_performance_contract.py::test_external_designer_apply_has_explicit_anti_echo_guard_contract \
            tests/test_phase6_latest_layout_contract.py::test_first_3d_view_is_assembly_while_sheetmetal_selector_stays_on_real_part \
            tests/test_phase6_latest_layout_contract.py::test_latest_top_and_global_layout_contract \
            tests/test_phase6_latest_layout_contract.py::test_parameter_lock_button_invoke_makes_assembly_panel_actually_visible \
            tests/test_phase6_latest_layout_contract.py::test_parameter_unlock_routes_to_assembly_diagnostics_then_part_settings \
            tests/test_phase6_latest_layout_contract.py::test_parameter_unlock_shows_assembly_diagnostics_while_assembly_is_selected \
            tests/test_phase6_receiving_multipart_integration.py::test_receiving_box_body_children_are_nested_under_box_body_but_independently_hideable \
            tests/test_phase6_ui_state_regressions.py::test_box_assembly_combobox_selection_updates_joint_graph_without_rewriting_corner_state
