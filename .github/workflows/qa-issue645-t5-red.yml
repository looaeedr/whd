name: QA Issue 645 T5 RED

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - tests/process/test_issue645_helper_reservation_race.py
      - .github/workflows/qa-issue645-t5-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Prove exact D-R9 through D-R13 Requirement RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q --confcutdir=tests/process \
            tests/process/test_issue645_helper_reservation_race.py \
            > /tmp/t5-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/t5-red.log
          test "$rc" -ne 0
          grep -Eq '5 failed' /tmp/t5-red.log
          if grep -Eq '(^|[[:space:]])ERROR(S)?([[:space:]]|$)' /tmp/t5-red.log; then
            echo "unexpected collection/runtime error in T5 RED harness" >&2
            exit 1
          fi
          echo 'ISSUE645_T5_REQUIREMENT_RED=GREEN'
      - name: Upload exact RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue645-t5-red
          path: /tmp/t5-red.log
          if-no-files-found: error
          retention-days: 7
