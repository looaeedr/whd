name: Sheet-metal Xvfb A-B Diagnostic

# QA alias exact RED probe; production candidate remains 40ae7f9b...
on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-xvfb-ab-diagnostic.yml'

permissions:
  contents: read

jobs:
  exact-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Reproduce exact dual-projection failure
        run: |
          set -euo pipefail
          git checkout -q 40ae7f9b3d28e1f5d911b505fe1698f40fc91c9d
          xvfb-run -a python -m pytest -vv -x --tb=long \
            tests/test_issue124_structure_tree.py::test_structure_tree_and_compact_menu_share_authoritative_part_selection
