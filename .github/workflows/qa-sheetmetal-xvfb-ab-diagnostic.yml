name: Sheet-metal Xvfb A-B Diagnostic

# Parallel same-run A/B. Production and candidate execute the identical full Xvfb
# suite in separate jobs, then an aggregate job requires exact failure-set parity.
on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-xvfb-ab-diagnostic.yml'

permissions:
  contents: read

jobs:
  base-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run production full Xvfb and extract failures
        run: |
          set -euo pipefail
          git checkout -q ec0724c892dd0d44f1bb4e0b80e90a85820df209
          mkdir -p ab-artifacts
          set +e
          xvfb-run -a python -m pytest -q > ab-artifacts/full.log 2>&1
          RC=$?
          set -e
          echo "$RC" > ab-artifacts/rc.txt
          python - <<'PY'
          from pathlib import Path
          src = Path('ab-artifacts/full.log').read_text(encoding='utf-8', errors='replace').splitlines()
          nodes = []
          for line in src:
              if line.startswith('FAILED '):
                  nodes.append(line[len('FAILED '):].split(' - ', 1)[0].strip())
          Path('ab-artifacts/failures.txt').write_text('\n'.join(sorted(set(nodes))) + ('\n' if nodes else ''), encoding='utf-8')
          PY
          tail -n 25 ab-artifacts/full.log > ab-artifacts/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sheetmetal-ab-base
          path: ab-artifacts
          if-no-files-found: error

  candidate-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run candidate full Xvfb and extract failures
        run: |
          set -euo pipefail
          git checkout -q e96068280a238a6918ed1f166feac2ab9135ea6d
          mkdir -p ab-artifacts
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
          set +e
          xvfb-run -a python -m pytest -q > ab-artifacts/full.log 2>&1
          RC=$?
          set -e
          echo "$RC" > ab-artifacts/rc.txt
          python - <<'PY'
          from pathlib import Path
          src = Path('ab-artifacts/full.log').read_text(encoding='utf-8', errors='replace').splitlines()
          nodes = []
          for line in src:
              if line.startswith('FAILED '):
                  nodes.append(line[len('FAILED '):].split(' - ', 1)[0].strip())
          Path('ab-artifacts/failures.txt').write_text('\n'.join(sorted(set(nodes))) + ('\n' if nodes else ''), encoding='utf-8')
          PY
          tail -n 25 ab-artifacts/full.log > ab-artifacts/summary.txt
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: sheetmetal-ab-candidate
          path: ab-artifacts
          if-no-files-found: error

  aggregate:
    needs: [base-full, candidate-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sheetmetal-ab-base
          path: ab/base
      - uses: actions/download-artifact@v4
        with:
          name: sheetmetal-ab-candidate
          path: ab/candidate
      - name: Require exact failure-set parity
        run: |
          set -euo pipefail
          echo "BASE_RC=$(cat ab/base/rc.txt)"
          echo "CANDIDATE_RC=$(cat ab/candidate/rc.txt)"
          echo '=== FAILURE SET DIFF ==='
          diff -u ab/base/failures.txt ab/candidate/failures.txt
          echo '=== BASE SUMMARY ==='
          cat ab/base/summary.txt
          echo '=== CANDIDATE SUMMARY ==='
          cat ab/candidate/summary.txt
