name: Sheet-metal Xvfb A-B Diagnostic

on:
  push:
    branches:
      - fix/sheetmetal-dual-projection-contract-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-xvfb-ab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xvfb-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Compare production and candidate full Xvfb failure sets
        run: |
          set -euo pipefail
          BASE_SHA='ec0724c892dd0d44f1bb4e0b80e90a85820df209'
          CANDIDATE_SHA="$GITHUB_SHA"

          extract_failures() {
            python - "$1" "$2" <<'PY'
          import pathlib, sys
          src = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          nodes = []
          for line in src:
              if line.startswith('FAILED '):
                  node = line[len('FAILED '):].split(' - ', 1)[0].strip()
                  nodes.append(node)
          pathlib.Path(sys.argv[2]).write_text('\n'.join(sorted(set(nodes))) + ('\n' if nodes else ''), encoding='utf-8')
          PY
          }

          git checkout -q "$BASE_SHA"
          set +e
          xvfb-run -a python -m pytest -q > /tmp/base-xvfb.log 2>&1
          BASE_RC=$?
          set -e
          extract_failures /tmp/base-xvfb.log /tmp/base.failures

          git checkout -q "$CANDIDATE_SHA"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
          set +e
          xvfb-run -a python -m pytest -q > /tmp/candidate-xvfb.log 2>&1
          CANDIDATE_RC=$?
          set -e
          extract_failures /tmp/candidate-xvfb.log /tmp/candidate.failures

          echo "BASE_RC=$BASE_RC"
          echo "CANDIDATE_RC=$CANDIDATE_RC"
          echo '=== BASE FAILURES ==='
          cat /tmp/base.failures
          echo '=== CANDIDATE FAILURES ==='
          cat /tmp/candidate.failures
          echo '=== FAILURE SET DIFF ==='
          diff -u /tmp/base.failures /tmp/candidate.failures

          echo '=== BASE SUMMARY ==='
          tail -n 20 /tmp/base-xvfb.log
          echo '=== CANDIDATE SUMMARY ==='
          tail -n 20 /tmp/candidate-xvfb.log

          xvfb-run -a python -m pytest -q \
            tests/test_issue124_structure_tree.py \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_phase6_t21_live_switch_selector.py

          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          git diff --exit-code
