name: Sheet-metal Xvfb A-B Diagnostic

# One-shot atomic patch + focused GREEN. The production candidate branch is
# updated only after exact-base, focused-Xvfb, and protected-file gates pass.
on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-xvfb-ab-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch-and-focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Checkout exact fix branch base
        run: |
          set -euo pipefail
          git fetch origin fix/sheetmetal-tree-sync-from-menu-20260917
          git checkout -B fix/sheetmetal-tree-sync-from-menu-20260917 origin/fix/sheetmetal-tree-sync-from-menu-20260917
          test "$(git rev-parse HEAD)" = "c5337eb535b0917b906dc74eaf94abefa61a7a14"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Apply minimal menu-to-tree projection refresh
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('fold_designer_bridge.py')
          text = p.read_text(encoding='utf-8')
          old = '''def _phase6_activate_operator_part(self, key):
              """Activate only a successfully resolved explicit operator identity."""
              resolved = _phase6_resolve_operator_part_key(self, key)
              if not resolved:
                  return None
              return self.activate_part(resolved)
          '''
          new = '''def _phase6_activate_operator_part(self, key):
              """Activate only a successfully resolved explicit operator identity."""
              resolved = _phase6_resolve_operator_part_key(self, key)
              if not resolved:
                  return None
              result = self.activate_part(resolved)
              _phase6_refresh_structure_tree(self)
              return result
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'exact callback occurrence count={count}, expected 1')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "fold_designer_bridge.py"
          git diff -- fold_designer_bridge.py
      - name: Run focused Xvfb contract suite
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue124_structure_tree.py \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_phase6_t21_live_switch_selector.py
      - name: Verify protected invariants
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          test "$(git diff --name-only)" = "fold_designer_bridge.py"
      - name: Commit and push accepted minimal fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold_designer_bridge.py
          git commit -m 'fix: refresh structure tree after compact part selection'
          git push origin HEAD:fix/sheetmetal-tree-sync-from-menu-20260917
          echo "ACCEPTED_SHA=$(git rev-parse HEAD)"
