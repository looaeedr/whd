name: Sheet-metal Xvfb A-B Diagnostic

# QA alias focused gate; production candidate remains 40ae7f9b...
on:
  push:
    branches:
      - fix/restore-sheetmetal-structure-tree-20260917
    paths:
      - '.github/workflows/qa-sheetmetal-xvfb-ab-diagnostic.yml'

permissions:
  contents: read

jobs:
  focused-dual-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Checkout exact candidate and capture invariants
        run: |
          set -euo pipefail
          git checkout -q 40ae7f9b3d28e1f5d911b505fe1698f40fc91c9d
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-before.sha256
      - name: Run focused Xvfb contract suite
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue124_structure_tree.py \
            tests/test_issue186_sheetmetal_selector_visibility.py \
            tests/test_phase6_t21_live_switch_selector.py
      - name: Verify protected invariants and clean tree
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > /tmp/protected-after.sha256
          cmp /tmp/protected-before.sha256 /tmp/protected-after.sha256
          git diff --exit-code
