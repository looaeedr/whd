name: Issue 276 T1 Taxonomy QA

on:
  push:
    branches:
      - test-cleanup/issue276-taxonomy-20260915

permissions:
  contents: read

env:
  ISSUE: 276
  WORKER: chatgpt
  TASK_BRANCH: test-cleanup/issue276-taxonomy-20260915
  CLAIM_REF: coord/claim-issue276-20260915
  BASE_SHA: b5ae852e4aaa236413b0a1acaf097ffb5dbb2776
  CLI_RED_SHA: fd682c61e8b346b242eff99aa8e379a32a169fd2

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock exact T1 lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TASK_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git merge-base --is-ancestor "$CLI_RED_SHA" "$GITHUB_SHA"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'pytest.ini',
            'tests/conftest.py',
            'tests/test_issue276_test_taxonomy_contract.py',
            'tools/test_lane_policy.py',
            'tools/test_lane_audit.py',
            '.github/workflows/issue276-taxonomy-qa.yml',
            '.scratch/issue276/preflight-evidence.md',
          }
          changed={line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          extra=sorted(changed-allowed)
          assert not extra, f'out-of-scope T1 drift: {extra}'
          print('T1_SCOPE_LOCK=GREEN')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Read shared claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue276/runtime
          git fetch origin "$CLAIM_REF" --depth=1
          git show FETCH_HEAD:.coord/claims/issue276.json > .scratch/issue276/runtime/claim.json
      - name: Execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim .scratch/issue276/runtime/claim.json \
            --issue "$ISSUE" --worker "$WORKER" --branch "$TASK_BRANCH" \
            --action qa-dispatch --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"
      - name: Fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工 pytest TEST taxonomy markers remote QA' \
            --changed-file pytest.ini \
            --changed-file tests/conftest.py \
            --changed-file tests/test_issue276_test_taxonomy_contract.py \
            --changed-file tools/test_lane_policy.py \
            --changed-file tools/test_lane_audit.py \
            --changed-file .github/workflows/issue276-taxonomy-qa.yml \
            --evidence .scratch/issue276/preflight-evidence.md
      - name: Capture protected manifests
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue276/runtime
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/before.sha256"
      - name: Prove CLI bootstrap regression RED on pre-fix commit
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue276/runtime
          git worktree add --detach /tmp/issue276-cli-red "$CLI_RED_SHA"
          set +e
          (cd /tmp/issue276-cli-red && python -m pytest -q --tb=short tests/test_issue276_test_taxonomy_contract.py::test_lane_audit_cli_bootstraps_repo_import_path) > "$root/cli-red.txt" 2>&1
          rc=$?
          set -e
          git worktree remove --force /tmp/issue276-cli-red
          test "$rc" -ne 0
          grep -F "ModuleNotFoundError: No module named 'tools'" "$root/cli-red.txt" >/dev/null
          echo 'CLI_BOOTSTRAP_RED_PROVEN=1' | tee "$root/red-proof.txt"
      - name: GREEN taxonomy contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue276_test_taxonomy_contract.py | tee .scratch/issue276/runtime/contract.txt
      - name: Audit lane collection union
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_lane_audit.py --json-out .scratch/issue276/runtime/lane-audit.json | tee .scratch/issue276/runtime/lane-audit.txt
      - name: Prove collection parity against T0 accepted parent
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue276/runtime
          python -m pytest --collect-only -q tests | grep '^tests/.*::' | sort -u > "$root/candidate-nodeids.txt"
          git worktree add --detach /tmp/issue276-parent "$BASE_SHA"
          (cd /tmp/issue276-parent && python -m pytest --collect-only -q tests | grep '^tests/.*::' | sort -u) > "$root/parent-nodeids.txt"
          git worktree remove --force /tmp/issue276-parent
          comm -23 "$root/parent-nodeids.txt" "$root/candidate-nodeids.txt" > "$root/missing-from-parent.txt"
          test ! -s "$root/missing-from-parent.txt"
          echo "PARENT_COUNT=$(wc -l < "$root/parent-nodeids.txt")" | tee "$root/parity.txt"
          echo "CANDIDATE_COUNT=$(wc -l < "$root/candidate-nodeids.txt")" | tee -a "$root/parity.txt"
      - name: Verify marker policy does not introduce skip/xfail outcome controls
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'add_marker\((pytest\.mark\.)?(skip|skipif|xfail)|pytest\.(skip|xfail)\(' tools/test_lane_policy.py tests/conftest.py
          echo 'OUTCOME_CONTROL_DRIFT=0' | tee .scratch/issue276/runtime/outcome-control.txt
      - name: Verify protected invariants and clean runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue276/runtime
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/after.sha256"
          diff -u "$root/before.sha256" "$root/after.sha256" | tee "$root/invariant-diff.txt"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Seal GREEN result
        shell: bash
        run: |
          set -euo pipefail
          echo 'ISSUE276_T1_TAXONOMY_QA=GREEN' | tee .scratch/issue276/runtime/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue276-t1-taxonomy
          path: .scratch/issue276/runtime/
          if-no-files-found: error
