name: Issue 276 T1 Taxonomy QA

on:
  push:
    branches:
      - test-cleanup/issue276-taxonomy-20260915

permissions:
  contents: read

concurrency:
  group: issue276-t1-taxonomy
  cancel-in-progress: false

env:
  ISSUE: '276'
  WORKER: chatgpt
  TASK_BRANCH: test-cleanup/issue276-taxonomy-20260915
  CLAIM_REF: coord/claim-issue276-20260915
  BASE_SHA: b5ae852e4aaa236413b0a1acaf097ffb5dbb2776

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock exact T1 lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TASK_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'pytest.ini',
            'tests/conftest.py',
            'tests/test_issue276_test_taxonomy_contract.py',
            'tools/test_lane_policy.py',
            'tools/test_lane_audit.py',
            '.github/workflows/issue276-taxonomy-qa.yml',
            '.scratch/issue276/preflight-evidence.md',
          }
          changed={line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          extra=sorted(changed-allowed)
          assert not extra, f'out-of-scope T1 drift: {extra}'
          print('T1_SCOPE_LOCK=GREEN')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Read shared claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue276/runtime
          git fetch origin "$CLAIM_REF" --depth=1
          git show FETCH_HEAD:.coord/claims/issue276.json > .scratch/issue276/runtime/claim.json

      - name: Execution claim guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim .scratch/issue276/runtime/claim.json \
            --issue "$ISSUE" --worker "$WORKER" --branch "$TASK_BRANCH" \
            --action qa-dispatch --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"

      - name: Fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工 pytest TEST taxonomy markers remote QA' \
            --changed-file pytest.ini \
            --changed-file tests/conftest.py \
            --changed-file tests/test_issue276_test_taxonomy_contract.py \
            --changed-file tools/test_lane_policy.py \
            --changed-file tools/test_lane_audit.py \
            --changed-file .github/workflows/issue276-taxonomy-qa.yml \
            --evidence .scratch/issue276/preflight-evidence.md

      - name: Capture protected manifests
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue276/runtime
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/before.sha256"

      - name: GREEN taxonomy contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue276_test_taxonomy_contract.py | tee .scratch/issue276/runtime/contract.txt

      - name: Audit lane collection union
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_lane_audit.py --json-out .scratch/issue276/runtime/lane-audit.json | tee .scratch/issue276/runtime/lane-audit.txt

      - name: Prove collection parity against T0 accepted parent
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue276-base "$BASE_SHA"
          (cd /tmp/issue276-base && env -u DISPLAY python -m pytest --collect-only -q tests) > .scratch/issue276/runtime/base-collection.txt
          env -u DISPLAY python -m pytest --collect-only -q tests > .scratch/issue276/runtime/candidate-collection.txt
          python - <<'PY'
          from pathlib import Path
          def nodes(path):
              return {x.strip() for x in Path(path).read_text(encoding='utf-8').splitlines() if x.startswith('tests/') and '::' in x}
          base=nodes('.scratch/issue276/runtime/base-collection.txt')
          cand=nodes('.scratch/issue276/runtime/candidate-collection.txt')
          removed=sorted(base-cand)
          added=sorted(cand-base)
          expected={
            'tests/test_issue276_test_taxonomy_contract.py::test_pytest_ini_registers_required_taxonomy_markers',
            'tests/test_issue276_test_taxonomy_contract.py::test_lane_policy_declares_required_primary_lanes_and_selection_expressions',
            'tests/test_issue276_test_taxonomy_contract.py::test_lane_policy_classifies_representative_tests_without_excluding_them',
            'tests/test_issue276_test_taxonomy_contract.py::test_pytest_collection_hook_adds_taxonomy_without_replacing_display_skip_policy',
          }
          assert not removed, removed
          assert set(added) == expected, added
          print(f'BASE_COLLECTION={len(base)} CANDIDATE_COLLECTION={len(cand)} ADDED={len(added)} REMOVED={len(removed)}')
          print('COLLECTION_PARITY=GREEN')
          PY
          git worktree remove /tmp/issue276-base --force

      - name: Verify marker policy does not introduce skip/xfail outcome controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          policy=Path('tools/test_lane_policy.py').read_text(encoding='utf-8')
          assert 'pytest.skip' not in policy
          assert 'pytest.xfail' not in policy
          assert 'skipif' not in policy
          hook=Path('tests/conftest.py').read_text(encoding='utf-8')
          assert 'pytest_collection_modifyitems' in hook
          print('CLASSIFICATION_ONLY_POLICY=GREEN')
          PY

      - name: Verify protected invariants and clean runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=.scratch/issue276/runtime
          find . -type f \( -name config.ini -o -iname '*.dxf' \) -not -path './.git/*' -not -path './.scratch/*' -print0 | sort -z | xargs -0 sha256sum > "$root/after.sha256"
          diff -u "$root/before.sha256" "$root/after.sha256" | tee "$root/invariant-diff.txt"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          echo 'ISSUE276_T1_TAXONOMY_QA=GREEN' | tee "$root/result.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue276-t1-taxonomy
          path: .scratch/issue276/runtime/
          if-no-files-found: error
