name: WHD Issue 1431 Runner Root Attestation

on:
  push:
    branches:
      - test/issue1431-root-attest
    paths:
      - .github/workflows/whd-issue1431-root-attest.yml
      - tools/flow_v2_delivery_entry_gate.py
      - tests/process/test_issue1431_native_delivery_entry_gate.py
      - .github/workflows/whd-governance-single-authority-gate.yml
      - .agents/skills/engineering/flow-v2-execution/SKILL.md

permissions:
  contents: read

jobs:
  attest:
    name: Verify real production checkout root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production in isolated Runner workspace
        uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          path: prod
          fetch-depth: 1

      - name: Verify git identity and emit observed work-root evidence
        shell: bash
        env:
          EXPECTED_REPO: looaeedr/whd
          EXPECTED_BRANCH: cleanup/2d-3d-sync
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path('prod').resolve(strict=True)
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args], text=True).strip()

          repo = os.environ['GITHUB_REPOSITORY']
          if repo != os.environ['EXPECTED_REPO']:
              raise SystemExit('repository identity mismatch')
          remote = git('remote', 'get-url', 'origin')
          if not remote.endswith('/looaeedr/whd') and not remote.endswith('/looaeedr/whd.git'):
              raise SystemExit('Git remote origin identity mismatch')
          head = git('rev-parse', 'HEAD')
          upstream = subprocess.check_output(
              ['git', 'ls-remote', 'origin', 'refs/heads/' + os.environ['EXPECTED_BRANCH']],
              cwd=root, text=True,
          ).split()[0]
          if head != upstream:
              raise SystemExit('Production head changed during checkout: retry on new baseline')
          sys.path.insert(0, str(root))
          from tools.work_root_gate import build_work_root_gate_evidence, READ_MODE_WORKSPACE

          gate = json.loads((root / '.agents/contracts/WHD_WORK_ROOT_HARD_GATE_V2.json').read_text('utf-8'))
          observed_entries = sorted(x.name for x in root.iterdir())
          evidence = build_work_root_gate_evidence(
              gate_payload=gate,
              read_mode=READ_MODE_WORKSPACE,
              execution_mode='INTERACTIVE',
              root_entries=observed_entries,
              workspace_root=str(root),
              production_head_sha=head,
          )
          record = {
              'schema': 'WHD_ISSUE1431_RUNNER_ROOT_OBSERVATION_V1',
              'issue': 1431,
              'repository': repo,
              'runtime': 'GITHUB_ACTIONS_RUNNER',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_sha': head,
              'git_origin': remote,
              'work_root_gate_evidence': evidence,
              'notice': 'Observation only. Not a native trusted ingress admission or content-write unlock.',
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'issue1431-root-observation.json'
          output.write_text(json.dumps(record, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'run_id': record['run_id'], 'production_sha': head, 'workspace_root': str(root), 'status': evidence['status']}))
          PY

      - name: Checkout isolated Issue 1431 candidate
        uses: actions/checkout@v4
        with:
          ref: test/issue1431-root-attest
          path: candidate
          fetch-depth: 1

      - name: Run isolated native delivery entry regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python -m unittest discover -s tests/process -p 'test_issue1431_native_delivery_entry_gate.py' -v

      - name: Check governance workflow actually invokes the candidate gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Verify issue-bound PR has native acquired execution' candidate/.github/workflows/whd-governance-single-authority-gate.yml
          grep -q 'coord/execution-v2' candidate/.github/workflows/whd-governance-single-authority-gate.yml
          grep -q 'tools/flow_v2_delivery_entry_gate.py' candidate/.github/workflows/whd-governance-single-authority-gate.yml
          grep -q 'ISSUE1431_NATIVE_WORK_AND_PR_ENTRY_GATE_V1' candidate/.agents/skills/engineering/flow-v2-execution/SKILL.md

      - name: Upload read-only root observation
        uses: actions/upload-artifact@v4
        with:
          name: issue1431-runner-root-observation
          path: ${{ runner.temp }}/issue1431-root-observation.json
          if-no-files-found: error
          retention-days: 7
