name: Issue 467 T1 RED

on:
  push:
    branches:
      - workorder/issue464-joint-placement-marking-v1.3-20260921
    paths:
      - '.github/workflows/qa-issue467-t1-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest -r requirements.txt
      - name: Run T1 requirement RED
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_issue467_t1_legal_contact.py
