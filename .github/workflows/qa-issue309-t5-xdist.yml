name: Issue 309 T5 xdist Isolation QA

on:
  push:
    branches:
      - ci-sharding/issue309-t5-xdist-isolation-20260917
    paths:
      - 'tests/test_issue309_t5_xdist_state_isolation.py'
      - 'tools/xdist_state_isolation.py'
      - 'tools/test_shard_execution.py'
      - 'config/ci_test_execution.json'
      - '.github/workflows/qa-issue309-t5-xdist.yml'
      - 'docs/superpowers/checkpoints/issue309-t5.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-enforce T5 Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Audit pytest-xdist state isolation for non-GUI deterministic shards, classify scopes as xdist-safe or serial-only, enable conservative worker counts only where repeat evidence proves stable node/result semantics, preserve protected invariants, and keep Xvfb/Tk serial inside each isolated display." \
            --changed-file tools/xdist_state_isolation.py \
            --changed-file tests/test_issue309_t5_xdist_state_isolation.py \
            --changed-file config/ci_test_execution.json \
            --changed-file .github/workflows/qa-issue309-t5-xdist.yml \
            --changed-file docs/superpowers/checkpoints/issue309-t5.json \
            --evidence docs/superpowers/checkpoints/issue309-t5-preflight-evidence.txt
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Run T5 xdist isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue309_t5_xdist_state_isolation.py tests/test_issue308_t4_aggregation.py

  plan:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      non_gui_matrix: ${{ steps.non-gui-matrix.outputs.matrix }}
      non_gui_max_parallel: ${{ steps.non-gui-matrix.outputs.max_parallel }}
      xvfb_matrix: ${{ steps.xvfb-matrix.outputs.matrix }}
      xvfb_max_parallel: ${{ steps.xvfb-matrix.outputs.max_parallel }}
      source_sha: ${{ steps.owner.outputs.source_sha }}
      manifest_sha256: ${{ steps.manifest-meta.outputs.manifest_sha256 }}
      plan_artifact_digest: ${{ steps.upload-plan.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind T5 acceptance to this exact SHA
        id: owner
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "ISSUE309_ACCEPTANCE_SOURCE_SHA=$actual"
      - name: Reject production or unrelated drift from accepted T4
        env:
          T4_ACCEPTED_HEAD: a415f10fca808a19debba62e27cf90a7a864d46b
        run: |
          set -euo pipefail
          git diff --name-only "$T4_ACCEPTED_HEAD" "$GITHUB_SHA" | sort | tee /tmp/issue309-scope.txt
          python - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/issue309-scope.txt').read_text().splitlines())
          expected = {
              '.github/workflows/qa-issue309-t5-census.yml',
              '.github/workflows/qa-issue309-t5-preflight.yml',
              '.github/workflows/qa-issue309-t5-xdist-proof.yml',
              '.github/workflows/qa-issue309-t5-xdist.yml',
              'config/ci_test_execution.json',
              'docs/superpowers/checkpoints/issue309-t5-preflight-evidence.txt',
              'docs/superpowers/checkpoints/issue309-t5.json',
              'tests/test_issue309_t5_xdist_state_isolation.py',
              'tools/test_shard_execution.py',
              'tools/xdist_state_isolation.py',
          }
          assert actual == expected, f'ISSUE309_SCOPE_DRIFT={sorted(actual)}'
          print('ISSUE309_SCOPE=CI_XDIST_ONLY')
          PY
      - name: Verify exact proof-bound xdist policy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.test_shard_execution import load_xdist_policy, resolve_xdist_workers
          policy = load_xdist_policy(Path('config/ci_test_execution.json'))
          assert set(policy['safe_shards']) == {'dxf:s00'}, policy
          assert resolve_xdist_workers(policy, lane='dxf', shard_id='s00') == 2
          assert resolve_xdist_workers(policy, lane='geometry', shard_id='s00') == 1
          entry = policy['safe_shards']['dxf:s00']
          assert entry['proof_run_id'] == 35124104891, entry
          assert entry['proof_head_sha'] == '45811716bb03b95927a33451bf7f1c8d0769c407', entry
          assert entry['proof_artifact_id'] == 10458605621, entry
          assert entry['proof_artifact_sha256'] == '21340f1f0d39a97ab3c40cf756c624a7f5f3b00c22430f90a35d4f9a514d3ada', entry
          print('ISSUE309_XDIST_POLICY=EXACT_DXF_S00_ONLY')
          PY
      - name: Install collection dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Generate one authoritative live manifest
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue309/acceptance/plan
          python tools/test_shard_manifest.py \
            --out-dir .scratch/issue309/acceptance/plan/manifest \
            --source-sha "$GITHUB_SHA" \
            | tee .scratch/issue309/acceptance/plan/manifest-generation.log
      - name: Bind manifest digest to exact acceptance SHA
        id: manifest-meta
        run: |
          set -euo pipefail
          manifest=.scratch/issue309/acceptance/plan/manifest/shard-manifest.json
          digest="$(sha256sum "$manifest" | awk '{print $1}')"
          GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('.scratch/issue309/acceptance/plan/manifest/shard-manifest.json').read_text())
          assert p['source_sha'] == os.environ['GITHUB_SHA'], p
          r = p['reconciliation']
          assert r['full_count'] == r['lane_union_count'] == r['unique_shard_union_count'], r
          assert not r['lane_missing'] and not r['lane_extra'] and not r['lane_duplicate'], r
          assert not r['shard_missing'] and not r['shard_extra'] and not r['shard_duplicate'], r
          print(f"FULL_COLLECTION={r['full_count']}")
          PY
          echo "manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > .scratch/issue309/acceptance/plan/manifest.sha256
          printf '%s\n' "$GITHUB_SHA" > .scratch/issue309/acceptance/plan/source.sha
      - name: Lock authoritative T0 Xvfb inherited failure contract
        run: |
          set -euo pipefail
          cp config/issue307_t0_xvfb_failure_contract.json .scratch/issue309/acceptance/plan/t0-failure-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.scratch/issue309/acceptance/plan')
          contract = json.loads((root / 't0-failure-contract.json').read_text())
          assert len(contract['failures']) == 13, len(contract['failures'])
          manifest = json.loads((root / 'manifest/shard-manifest.json').read_text())
          union = {node for item in manifest['shards']['xvfb_ui'].values() for node in item['nodes']}
          missing = sorted(set(contract['failures']) - union)
          assert not missing, f'T0_EXPECTED_XVFB_NOT_IN_CURRENT_MANIFEST={missing}'
          (root / 'expected-xvfb-global.json').write_text(
              json.dumps(sorted(contract['failures']), indent=2) + '\n'
          )
          print(f'XVFB_LIVE_UNION={len(union)}')
          print('XVFB_T0_FAILURE_CONTRACT=13')
          PY
      - name: Emit non-GUI matrix from the live manifest
        id: non-gui-matrix
        run: |
          set -euo pipefail
          python tools/test_shard_execution.py matrix \
            --manifest .scratch/issue309/acceptance/plan/manifest/shard-manifest.json \
            --execution-config config/ci_test_execution.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Emit exact four-way Xvfb matrix from the same manifest
        id: xvfb-matrix
        run: |
          set -euo pipefail
          python tools/xvfb_shard_execution.py matrix \
            --manifest .scratch/issue309/acceptance/plan/manifest/shard-manifest.json \
            --execution-config config/ci_test_execution.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload one shared T5 plan artifact
        id: upload-plan
        uses: actions/upload-artifact@v4
        with:
          name: issue309-t5-plan
          path: .scratch/issue309/acceptance/plan
          if-no-files-found: error

  non-gui-shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.non_gui_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.non_gui_matrix) }}
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shard dependencies including proof-authorized xdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-xdist matplotlib ezdxf
      - name: Download authoritative T5 plan
        uses: actions/download-artifact@v4
        with:
          name: issue309-t5-plan
          path: .scratch/issue309/acceptance/plan
      - name: Verify exact checkout and manifest identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue309/acceptance/plan/source.sha)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue309/acceptance/plan/manifest.sha256)" = "$PLAN_MANIFEST_SHA256"
          test "$(sha256sum .scratch/issue309/acceptance/plan/manifest/shard-manifest.json | awk '{print $1}')" = "$PLAN_MANIFEST_SHA256"
      - name: Capture protected hashes before shard
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/non-gui/$LANE/$SHARD_ID"
          mkdir -p "$root"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-before.sha256"
      - name: Run exact non-GUI manifest shard with fail-closed worker policy
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/non-gui/$LANE/$SHARD_ID"
          set +e
          python tools/test_shard_execution.py run \
            --manifest .scratch/issue309/acceptance/plan/manifest/shard-manifest.json \
            --execution-config config/ci_test_execution.json \
            --lane "$LANE" \
            --shard "$SHARD_ID" \
            --result-json "$root/shard-result.json" \
            --junit-xml "$root/result.xml" \
            --log "$root/pytest.log" \
            --basetemp "$root/pytest-tmp"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/runner-rc.txt"
          test -f "$root/shard-result.json"
          LANE="$LANE" SHARD_ID="$SHARD_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.scratch/issue309/acceptance/non-gui') / os.environ['LANE'] / os.environ['SHARD_ID']
          p = json.loads((root / 'shard-result.json').read_text())
          expected_workers = 2 if (os.environ['LANE'], os.environ['SHARD_ID']) == ('dxf', 's00') else 1
          assert p['xdist_workers'] == expected_workers, p
          assert p['xdist_distribution'] == 'load', p
          assert p['child_rc'] == 0, p
          print(f"NON_GUI_XDIST_WORKERS={p['xdist_workers']}")
          PY
          test "$rc" -eq 0
      - name: Verify protected invariants after shard
        if: always()
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/non-gui/$LANE/$SHARD_ID"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-after.sha256"
          cmp "$root/protected-before.sha256" "$root/protected-after.sha256"
          git diff --exit-code
      - name: Upload complete non-GUI shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue309-nongui-${{ matrix.lane }}-${{ matrix.shard_id }}
          path: .scratch/issue309/acceptance/non-gui/${{ matrix.lane }}/${{ matrix.shard_id }}
          if-no-files-found: error

  xvfb-shard:
    if: always() && needs.plan.result == 'success'
    needs: [plan, non-gui-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.xvfb_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.xvfb_matrix) }}
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Xvfb and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Download authoritative T5 plan
        uses: actions/download-artifact@v4
        with:
          name: issue309-t5-plan
          path: .scratch/issue309/acceptance/plan
      - name: Verify exact checkout and manifest identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue309/acceptance/plan/source.sha)" = "$PLAN_SOURCE_SHA"
          test "$(cat .scratch/issue309/acceptance/plan/manifest.sha256)" = "$PLAN_MANIFEST_SHA256"
      - name: Slice T0 inherited RED by manifest ownership
        env:
          SHARD_ID: ${{ matrix.shard_id }}
          EXPECTED_NODE_COUNT: ${{ matrix.node_count }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/xvfb/$SHARD_ID"
          mkdir -p "$root"
          python - <<'PY'
          import json, os
          from pathlib import Path
          shard_id = os.environ['SHARD_ID']
          expected_count = int(os.environ['EXPECTED_NODE_COUNT'])
          plan = Path('.scratch/issue309/acceptance/plan')
          manifest = json.loads((plan / 'manifest/shard-manifest.json').read_text())
          assigned = manifest['shards']['xvfb_ui'][shard_id]['nodes']
          assert len(assigned) == expected_count, (len(assigned), expected_count)
          inherited = set(json.loads((plan / 'expected-xvfb-global.json').read_text()))
          expected = sorted(inherited.intersection(assigned))
          out = Path('.scratch/issue309/acceptance/xvfb') / shard_id / 'expected.json'
          out.write_text(json.dumps(expected, indent=2) + '\n')
          print(f'SHARD={shard_id} NODES={len(assigned)} EXPECTED_T0_RED={len(expected)}')
          PY
      - name: Capture protected hashes before shard
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/xvfb/$SHARD_ID"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-before.sha256"
      - name: Run exact isolated Xvfb shard serially
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/xvfb/$SHARD_ID"
          set +e
          python tools/xvfb_shard_execution.py run \
            --manifest .scratch/issue309/acceptance/plan/manifest/shard-manifest.json \
            --shard "$SHARD_ID" \
            --expected-failures "$root/expected.json" \
            --result-json "$root/result.json" \
            --log "$root/pytest.log" \
            --basetemp "$root/pytest-tmp" \
            --timeout-seconds 1200 \
            --expected-source-sha "$PLAN_SOURCE_SHA" \
            --expected-manifest-sha256 "$PLAN_MANIFEST_SHA256"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/runner-rc.txt"
          test -f "$root/result.json"
          echo "XVFB_RUNNER_RC=$rc"
      - name: Verify protected invariants after shard
        if: always()
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          set -euo pipefail
          root=".scratch/issue309/acceptance/xvfb/$SHARD_ID"
          git ls-files | grep -E '(^|/)config\.ini$|\.dxf$' | sort | while read -r f; do sha256sum "$f"; done > "$root/protected-after.sha256"
          cmp "$root/protected-before.sha256" "$root/protected-after.sha256"
          git diff --exit-code
      - name: Upload complete Xvfb shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue309-xvfb-${{ matrix.shard_id }}
          path: .scratch/issue309/acceptance/xvfb/${{ matrix.shard_id }}
          if-no-files-found: error

  aggregate:
    if: always() && needs.plan.result == 'success'
    needs: [plan, non-gui-shard, xvfb-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAN_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PLAN_MANIFEST_SHA256: ${{ needs.plan.outputs.manifest_sha256 }}
      PLAN_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify aggregate checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          test -n "$PLAN_MANIFEST_SHA256"
          test -n "$PLAN_ARTIFACT_DIGEST"
      - name: Download authoritative T5 plan
        uses: actions/download-artifact@v4
        with:
          name: issue309-t5-plan
          path: .scratch/issue309/acceptance/plan
      - name: Download all non-GUI evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue309-nongui-*
          path: .scratch/issue309/acceptance/all-nongui
      - name: Download all Xvfb evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue309-xvfb-*
          path: .scratch/issue309/acceptance/all-xvfb
      - name: Normalize actual artifacts and aggregate fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from tools.test_shard_aggregation import (
              aggregate_shard_results,
              normalize_shard_artifact,
              render_unified_summary,
          )
          from tools.test_shard_execution import load_xdist_policy, resolve_xdist_workers

          plan = Path('.scratch/issue309/acceptance/plan')
          manifest_path = plan / 'manifest/shard-manifest.json'
          manifest_bytes = manifest_path.read_bytes()
          digest = hashlib.sha256(manifest_bytes).hexdigest()
          assert digest == os.environ['PLAN_MANIFEST_SHA256'], (digest, os.environ['PLAN_MANIFEST_SHA256'])
          assert (plan / 'manifest.sha256').read_text().strip() == digest
          assert (plan / 'source.sha').read_text().strip() == os.environ['PLAN_SOURCE_SHA']
          manifest = json.loads(manifest_bytes)
          policy = load_xdist_policy(Path('config/ci_test_execution.json'))

          results = []
          invariants = {}
          xdist_execution = {}

          expected_non_gui = sum(
              len(shards)
              for lane, shards in manifest['shards'].items()
              if lane != 'xvfb_ui'
          )
          non_gui_roots = sorted(Path('.scratch/issue309/acceptance/all-nongui').glob('issue309-nongui-*'))
          assert len(non_gui_roots) == expected_non_gui, (len(non_gui_roots), expected_non_gui)
          for root in non_gui_roots:
              result_path = root / 'shard-result.json'
              junit_path = root / 'result.xml'
              assert result_path.is_file(), f'NON_GUI_RESULT_MISSING={root}'
              assert junit_path.is_file(), f'NON_GUI_JUNIT_MISSING={root}'
              payload = json.loads(result_path.read_text())
              expected_workers = resolve_xdist_workers(
                  policy,
                  lane=payload['lane'],
                  shard_id=payload['shard_id'],
              )
              assert payload['xdist_workers'] == expected_workers, payload
              assert payload['xdist_distribution'] == 'load', payload
              key = f"{payload['lane']}:{payload['shard_id']}"
              xdist_execution[key] = expected_workers
              artifact_name = root.name
              normalized = normalize_shard_artifact(
                  result_payload=payload,
                  junit_xml=junit_path,
                  expected_source_sha=os.environ['PLAN_SOURCE_SHA'],
                  artifact_refs=[f'artifact://{artifact_name}'],
              )
              results.append(normalized)
              before = root / 'protected-before.sha256'
              after = root / 'protected-after.sha256'
              assert before.is_file() and after.is_file(), f'NON_GUI_INVARIANT_MISSING={root}'
              invariants[artifact_name] = {
                  'before': hashlib.sha256(before.read_bytes()).hexdigest(),
                  'after': hashlib.sha256(after.read_bytes()).hexdigest(),
              }

          assert {k for k, v in xdist_execution.items() if v == 2} == {'dxf:s00'}, xdist_execution
          assert all(v in {1, 2} for v in xdist_execution.values()), xdist_execution

          xvfb_roots = sorted(Path('.scratch/issue309/acceptance/all-xvfb').glob('issue309-xvfb-*'))
          assert len(xvfb_roots) == len(manifest['shards']['xvfb_ui']) == 4, len(xvfb_roots)
          for root in xvfb_roots:
              result_path = root / 'result.json'
              junit_path = root / 'result.xml'
              assert result_path.is_file(), f'XVFB_RESULT_MISSING={root}'
              assert junit_path.is_file(), f'XVFB_JUNIT_MISSING={root}'
              payload = json.loads(result_path.read_text())
              artifact_name = root.name
              normalized = normalize_shard_artifact(
                  result_payload=payload,
                  junit_xml=junit_path,
                  expected_source_sha=os.environ['PLAN_SOURCE_SHA'],
                  artifact_refs=[f'artifact://{artifact_name}'],
              )
              results.append(normalized)
              before = root / 'protected-before.sha256'
              after = root / 'protected-after.sha256'
              assert before.is_file() and after.is_file(), f'XVFB_INVARIANT_MISSING={root}'
              invariants[artifact_name] = {
                  'before': hashlib.sha256(before.read_bytes()).hexdigest(),
                  'after': hashlib.sha256(after.read_bytes()).hexdigest(),
              }

          summary = aggregate_shard_results(
              manifest=manifest,
              shard_results=results,
              expected_source_sha=os.environ['PLAN_SOURCE_SHA'],
              protected_invariants=invariants,
          )
          assert summary['decision'] == 'GREEN', summary
          assert summary['executed_unique_count'] == summary['full_collection_count'], summary
          summary['manifest_sha256'] = digest
          summary['plan_artifact_digest'] = os.environ['PLAN_ARTIFACT_DIGEST']
          summary['t0_provenance'] = json.loads((plan / 't0-failure-contract.json').read_text())['provenance']
          summary['t5_xdist'] = {
              'safe_shards': policy['safe_shards'],
              'executed_workers': xdist_execution,
              'parallel_shards': sorted(k for k, v in xdist_execution.items() if v == 2),
          }
          out = Path('.scratch/issue309/acceptance/aggregate')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'aggregation.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          markdown = render_unified_summary(summary)
          markdown += '\n## T5 xdist policy\n\n- Exact parallel shard: `dxf:s00` with **2 workers**\n- All other non-GUI shards: **1 worker**\n- Xvfb/Tk shards: **serial inside each isolated display**\n'
          (out / 'unified-summary.md').write_text(markdown)
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('ISSUE309_T5_AGGREGATION=GREEN')
          PY
      - name: Publish unified Markdown summary
        run: |
          set -euo pipefail
          cat .scratch/issue309/acceptance/aggregate/unified-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload T5 aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue309-t5-aggregate
          path: .scratch/issue309/acceptance/aggregate
          if-no-files-found: error
