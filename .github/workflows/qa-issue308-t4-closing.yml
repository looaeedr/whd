name: Issue 308 T4 Closing Gate

on:
  push:
    branches:
      - ci-sharding/issue308-t4-aggregation-20260917
    paths:
      - 'docs/superpowers/checkpoints/issue308-t4.json'
      - '.github/workflows/qa-issue308-t4-closing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evidence-only closing drift from accepted T4 head
        env:
          ACCEPTED_T4_HEAD: 4f43ca1296c410eb9cdd59441e8f6a3475db9f5b
        run: |
          set -euo pipefail
          git diff --name-only "$ACCEPTED_T4_HEAD" "$GITHUB_SHA" | sort | tee /tmp/issue308-closing-delta.txt
          python - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/issue308-closing-delta.txt').read_text().splitlines())
          expected = {
              '.github/workflows/qa-issue308-t4-closing.yml',
              'docs/superpowers/checkpoints/issue308-t4.json',
          }
          assert actual == expected, f'ISSUE308_CLOSING_SCOPE_DRIFT={sorted(actual)}'
          print('ISSUE308_CLOSING_SCOPE=EVIDENCE_ONLY')
          PY
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Execute continuity finalization guard
        run: |
          set -euo pipefail
          python -m tools.continuity_controller assert-finalizable docs/superpowers/checkpoints/issue308-t4.json
      - name: Run T4 aggregation contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue308_t4_aggregation.py
