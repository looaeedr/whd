name: "QA #435 T5 Knowledge Preflight"

on:
  push:
    branches:
      - refactor/issue435-t5-switch-lifecycle-guards-20260920
    paths:
      - '.github/workflows/qa-issue435-t5-preflight.yml'
      - 'docs/superpowers/checkpoints/issue435-t5-preflight-evidence.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run T5 planned-change Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #435 T5 Switch lifecycle, state preservation and duplicate-tree guards. Validate part assembly corner_data repeated switching, project load save reload, refresh, dynamic part add delete, BoxBody late piece row refresh, duplicate widget tree, duplicate event binding, callback multiplication, stale widget references, state preservation, and mousewheel safety. Preserve accepted #431-#434 ownership and semantics. GitHub Actions remote QA." \
            --changed-file fold_designer_bridge.py \
            --changed-file phase6_assembly_panel.py \
            --changed-file phase6_corner_data_view_adapter.py \
            --changed-file phase6_project_controller.py \
            --changed-file tests/test_issue435_switch_lifecycle_guards.py \
            --changed-file .github/workflows/qa-issue435-t5.yml \
            --changed-file docs/superpowers/checkpoints/issue435-t5-journal.md \
            --changed-file docs/superpowers/checkpoints/issue435-t5-checkpoint.json \
            --evidence docs/superpowers/checkpoints/issue435-t5-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"
