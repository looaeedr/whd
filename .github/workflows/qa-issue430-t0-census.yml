name: "QA #430 T0 single-host census"

on:
  push:
    branches:
      - qa/issue430-t0-single-host-census-20260920
    paths:
      - 'tests/test_issue430_single_host_red.py'
      - 'docs/superpowers/checkpoints/issue430-t0-census.md'
      - '.github/workflows/qa-issue430-t0-census.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 50e14c7054916cb0b9597c61194725939c5de323
  RED_NODE: tests/test_issue430_single_host_red.py::test_t0_intended_red_all_three_modes_require_one_direct_shared_content_host

jobs:
  t0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused GUI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Re-run changed-file Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py             --task "Issue #430 T0 single shared-content host baseline census and duplicate-region characterization for Fold Designer left UI. Inventory normal-part, assembly, and corner-data host identity, mode authority, mount/unmount call sites, repeated-switch widget trees, project load/refresh/part add-delete behavior. Evidence/tests only; no production runtime edit. GitHub Actions remote QA and dispatch workflow."             --changed-file tests/test_issue430_single_host_red.py             --changed-file .github/workflows/qa-issue430-t0-census.yml             --changed-file docs/superpowers/checkpoints/issue430-t0-census.md             --evidence docs/superpowers/checkpoints/issue430-t0-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Verify exact baseline and no production runtime edits
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          python - <<'PY'
          import subprocess
          allowed = (
              "tests/test_issue430_single_host_red.py",
              ".github/workflows/qa-issue430-t0-",
              "docs/superpowers/checkpoints/issue430-t0-",
          )
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "50e14c7054916cb0b9597c61194725939c5de323...HEAD"],
              text=True,
          ).splitlines()
          unexpected = [path for path in changed if not any(path == a or path.startswith(a) for a in allowed)]
          print("CHANGED", changed)
          assert not unexpected, f"production/runtime drift in T0: {unexpected}"
          print("POST_PHASE5_ROOT_EXACT=1")
          print("PRODUCTION_RUNTIME_EDIT=0")
          PY

      - name: Verify census evidence markers
        shell: bash
        run: |
          set -euo pipefail
          CENSUS=docs/superpowers/checkpoints/issue430-t0-census.md
          grep -F "SHARED_CONTENT_HOST_CENSUS_COMPLETE=1" "$CENSUS"
          grep -F "MODE_AUTHORITY_CENSUS_COMPLETE=1" "$CENSUS"
          grep -F "MOUNT_UNMOUNT_CENSUS_COMPLETE=1" "$CENSUS"
          grep -F "DUPLICATE_REGION_RED_INTENDED=1" "$CENSUS"

      - name: Run T0 characterization and require the exact intended RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue430-t0
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue430_single_host_red.py             --tb=short             --json-report             --json-report-file=.scratch/issue430-t0/report.json             > .scratch/issue430-t0/pytest.log 2>&1
          rc=$?
          set -e
          cat .scratch/issue430-t0/pytest.log
          python - <<'PY'
          import json
          from pathlib import Path

          red = "tests/test_issue430_single_host_red.py::test_t0_intended_red_all_three_modes_require_one_direct_shared_content_host"
          data = json.loads(Path(".scratch/issue430-t0/report.json").read_text(encoding="utf-8"))
          outcomes = {row["nodeid"]: row.get("outcome") for row in data.get("tests", [])}
          failed = {node for node, outcome in outcomes.items() if outcome == "failed"}
          passed = {node for node, outcome in outcomes.items() if outcome == "passed"}
          skipped = {node for node, outcome in outcomes.items() if outcome == "skipped"}
          print("OUTCOMES", outcomes)
          assert failed == {red}, f"unexpected failure set: {failed}"
          assert len(passed) == 4, f"expected 4 characterization guards PASS, got {len(passed)}"
          assert not skipped, f"unexpected skips under Xvfb: {skipped}"
          print("SHARED_CONTENT_HOST_CENSUS_COMPLETE=1")
          print("MODE_AUTHORITY_CENSUS_COMPLETE=1")
          print("MOUNT_UNMOUNT_CENSUS_COMPLETE=1")
          print("DUPLICATE_REGION_RED_INTENDED=1")
          print("T0_EXPECTED_RESULT=4_PASS_1_INTENDED_FAIL")
          PY
          test "$rc" -ne 0

      - name: Upload T0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue430-t0-census
          path: |
            .scratch/issue430-t0/report.json
            .scratch/issue430-t0/pytest.log
            docs/superpowers/checkpoints/issue430-t0-census.md
