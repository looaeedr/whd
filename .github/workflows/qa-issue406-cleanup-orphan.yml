name: "QA #406 Cleanup orphan branch"

on:
  push:
    branches:
      - continuity/issue406-scheduled-heartbeat-writeback-20260920
    paths:
      - '.github/workflows/qa-issue406-cleanup-orphan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete connector-created orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref='heads/continuity/issueundefined-scheduled-heartbeat-writeback-20260920'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
            echo "PASS ORPHAN_BRANCH_REMOVED=1"
          else
            echo "PASS ORPHAN_BRANCH_ALREADY_ABSENT=1"
          fi
