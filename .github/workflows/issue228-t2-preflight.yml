name: Issue228 T2 Knowledge Preflight

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
    paths:
      - '.github/workflows/issue228-t2-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover T2 Knowledge Preflight requirements
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T2 continuous execution authority continuity controller executable state finalization operations authority legacy pitfall reference marker string enforcement" || true
