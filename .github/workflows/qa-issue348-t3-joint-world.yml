name: "#348 T3 joint-world geometry extraction"

on:
  push:
    branches:
      - refactor/issue348-joint-world-geometry-20260918
    paths:
      - 'tests/test_issue348_joint_world_geometry_extraction.py'
      - 'phase6_manufacturing_geometry.py'
      - 'fold_designer_bridge.py'
      - '.github/workflows/qa-issue348-t3-joint-world.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run extraction contract
        run: python -m pytest -q tests/test_issue348_joint_world_geometry_extraction.py
