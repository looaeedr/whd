name: issue123-t1-closing-full-suite

on:
  push:
    branches:
      - work/issue-123-ui-foundation
    paths:
      - .github/workflows/issue123-t1-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-123-ui-foundation
          fetch-depth: 0

      - name: Closure preflight and target drift gate
        shell: bash
        run: |
          cat > /tmp/issue123-closing-evidence.txt <<'EOF'
          UI設計與去AI味
          Python測試實務
          驗證板件與DXF
          monitoring-remote-qa
          issue-closure-gate
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "Issue #123 T1 UI foundation production integration close issue final acceptance" \
            --changed-file gui.py \
            --changed-file tests/test_issue123_ui_foundation.py \
            --changed-file .github/workflows/issue123-t1-qa.yml \
            --evidence /tmp/issue123-closing-evidence.txt
          target="$(git ls-remote origin refs/heads/cleanup/2d-3d-sync | awk '{print $1}')"
          echo ISSUE123_TARGET_HEAD="$target"
          test "$target" = "319dff24165a6bd1390afc4d3411850853f3982a"
          git diff --name-only origin/cleanup/2d-3d-sync...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/issue123-t1-qa.yml
          gui.py
          tests/test_issue123_ui_foundation.py
          EOF
          diff -u /tmp/allowed.txt /tmp/changed.txt
          ! grep -Eq '^(config\.ini|基準檔/)' /tmp/changed.txt
          echo ISSUE123_CLOSING_PREFLIGHT=PASS
          echo ISSUE123_TARGET_DRIFT=PASS
          echo ISSUE123_SCOPE_GUARD=PASS

  headless:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-123-ui-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture invariants
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run full repository headless suite
        run: |
          set +e
          env -u DISPLAY python -m pytest -q --tb=short 2>&1 | tee /tmp/headless.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/headless.exit
          grep -E '^FAILED |^[0-9]+ failed|^[0-9]+ passed|failed,|passed,' /tmp/headless.log | tail -120 > /tmp/headless.summary || true
          cat /tmp/headless.summary || true
          exit 0
      - name: Verify headless invariants and result
        if: always()
        run: |
          sha256sum config.ini > /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/baseline.before /tmp/baseline.after
          code="$(cat /tmp/headless.exit)"
          echo ISSUE123_HEADLESS_CONFIG_INVARIANT=PASS
          echo ISSUE123_HEADLESS_BASELINE_INVARIANT=PASS
          echo ISSUE123_HEADLESS_PYTEST_EXIT="$code"
          cat /tmp/headless.summary || true
          test "$code" = "0"

  xvfb:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-123-ui-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth
          python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Capture invariants
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run full repository Xvfb suite
        run: |
          set +e
          xvfb-run -a python -m pytest -q --tb=short 2>&1 | tee /tmp/xvfb.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/xvfb.exit
          grep -E '^FAILED |^[0-9]+ failed|^[0-9]+ passed|failed,|passed,' /tmp/xvfb.log | tail -120 > /tmp/xvfb.summary || true
          cat /tmp/xvfb.summary || true
          exit 0
      - name: Verify Xvfb invariants and result
        if: always()
        run: |
          sha256sum config.ini > /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/baseline.before /tmp/baseline.after
          code="$(cat /tmp/xvfb.exit)"
          echo ISSUE123_XVFB_CONFIG_INVARIANT=PASS
          echo ISSUE123_XVFB_BASELINE_INVARIANT=PASS
          echo ISSUE123_XVFB_PYTEST_EXIT="$code"
          cat /tmp/xvfb.summary || true
          test "$code" = "0"
