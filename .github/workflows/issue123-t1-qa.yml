name: issue123-t1-qa

on:
  push:
    branches:
      - work/issue-123-ui-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t1-final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-123-ui-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot tk
          python -m pip install pytest pillow matplotlib -r requirements.txt

      - name: Final changed-file preflight
        shell: bash
        run: |
          cat > /tmp/issue123-evidence.txt <<'EOF'
          UI設計與去AI味
          Python測試實務
          驗證板件與DXF
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "Issue #123 T1 UI foundation final QA and visual acceptance" \
            --changed-file gui.py \
            --changed-file tests/test_issue123_ui_foundation.py \
            --changed-file .github/workflows/issue123-t1-qa.yml \
            --evidence /tmp/issue123-evidence.txt

      - name: Focused contract and syntax regression
        run: |
          python -m py_compile gui.py
          python -m pytest -q tests/test_issue123_ui_foundation.py

      - name: Xvfb launch and toolbar runtime acceptance
        shell: bash
        run: |
          cat > /tmp/issue123_runtime.py <<'PY'
          import tkinter as tk
          from pathlib import Path
          import gui

          root = tk.Tk()
          root.geometry("1440x900+0+0")
          app = gui.BoxCalculatorGUI(root)
          root.update_idletasks()
          root.update()

          required = (
              "project_toolbar_shell",
              "project_toolbar",
              "project_open_button",
              "project_save_button",
              "project_save_as_button",
              "ui_text_size_combo",
          )
          for name in required:
              widget = getattr(app, name, None)
              assert widget is not None, name
              assert widget.winfo_exists(), name
              assert widget.winfo_viewable(), name

          assert app.project_open_button.cget("text") == "開啟專案"
          assert app.project_save_button.cget("text") == "儲存專案"
          assert app.project_save_as_button.cget("text") == "另存新檔"
          assert app.project_save_button.cget("background") == app.COLOR_ACCENT
          assert app.project_open_button.cget("background") != app.COLOR_ACCENT
          assert app.project_save_as_button.cget("background") != app.COLOR_ACCENT

          shell_h = app.project_toolbar_shell.winfo_height()
          assert 1 < shell_h < 90, shell_h
          assert app.project_toolbar_shell.winfo_width() > 600

          for label in ("小", "中", "大"):
              app.ui_text_size_var.set(label)
              app.on_ui_text_size_changed()
              root.update_idletasks()
              root.update()
              assert app.project_open_button.winfo_viewable()
              assert app.project_save_button.winfo_viewable()
              assert app.project_save_as_button.winfo_viewable()
              assert app.ui_text_size_combo.winfo_viewable()
              assert app.project_toolbar_shell.winfo_height() < 110

          root.geometry("1024x720+0+0")
          root.update_idletasks()
          root.update()
          assert app.project_toolbar_shell.winfo_width() > 700
          assert app.project_save_button.winfo_viewable()
          assert app.ui_text_size_combo.winfo_viewable()

          Path("/tmp/issue123-runtime-ok.txt").write_text(
              f"toolbar={app.project_toolbar_shell.winfo_width()}x{app.project_toolbar_shell.winfo_height()}\n",
              encoding="utf-8",
          )
          root.after(2500, root.destroy)
          root.mainloop()
          PY
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            PYTHONPATH="$PWD" python /tmp/issue123_runtime.py &
            pid=$!
            sleep 1.5
            scrot /tmp/issue123-toolbar.png
            wait $pid
          '
          test -s /tmp/issue123-toolbar.png
          cat /tmp/issue123-runtime-ok.txt

      - name: Scope and invariant guard
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync
          git diff --name-only origin/cleanup/2d-3d-sync...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/issue123-t1-qa.yml
          gui.py
          tests/test_issue123_ui_foundation.py
          EOF
          diff -u /tmp/allowed.txt /tmp/changed.txt
          ! grep -Eq '^(config\.ini|基準檔/)' /tmp/changed.txt

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue123-t1-visual-evidence
          path: |
            /tmp/issue123-toolbar.png
            /tmp/issue123-runtime-ok.txt
          if-no-files-found: error
