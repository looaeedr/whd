name: QA #293 T5 part routing GREEN

on:
  push:
    branches:
      - refactor/issue293-part-routing-green-20260917

permissions:
  contents: write

jobs:
  part-routing-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue293-part-routing-green-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolated GREEN branch state
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          module = Path('gui_modules/editors/hole_editor.py').read_text(encoding='utf-8')
          assert 'def open_part_hole_editor(host, part_key):' in module
          root = Path('gui.py').read_text(encoding='utf-8')
          tree = ast.parse(root)
          host = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          method = next(n for n in host.body if isinstance(n, ast.FunctionDef) and n.name == 'open_part_hole_editor')
          assert method.end_lineno - method.lineno + 1 == 214
          PY
      - name: Replace root part editor with thin delegate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('gui.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          host = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          method = next(n for n in host.body if isinstance(n, ast.FunctionDef) and n.name == 'open_part_hole_editor')
          assert method.end_lineno - method.lineno + 1 == 214
          lines = text.splitlines(keepends=True)
          lines[method.lineno - 1:method.end_lineno] = [
              '    def open_part_hole_editor(self, part_key):\n',
              '        return _open_part_hole_editor_impl(self, part_key)\n',
          ]
          updated = ''.join(lines)
          marker = 'from gui_modules.editors.hole_editor import open_hole_editor as _open_hole_editor_impl\n'
          replacement = (
              'from gui_modules.editors.hole_editor import (\n'
              '    open_hole_editor as _open_hole_editor_impl,\n'
              '    open_part_hole_editor as _open_part_hole_editor_impl,\n'
              ')\n'
          )
          assert marker in updated
          updated = updated.replace(marker, replacement, 1)
          ast.parse(updated)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Install canonical test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify focused GREEN and decomposition limits
        run: |
          python -m pytest -q \
            tests/test_issue293_t5_part_editor_routing.py \
            tests/test_issue293_t5_hole_editor_routing.py \
            tests/test_issue293_t5_dialogs.py
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('gui.py').read_text(encoding='utf-8')
          tree = ast.parse(root)
          host = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          method = next(n for n in host.body if isinstance(n, ast.FunctionDef) and n.name == 'open_part_hole_editor')
          assert method.end_lineno - method.lineno + 1 <= 12
          module_text = Path('gui_modules/editors/hole_editor.py').read_text(encoding='utf-8')
          module_tree = ast.parse(module_text)
          spans = {
              n.name: n.end_lineno - n.lineno + 1
              for n in module_tree.body
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          oversized = {name: span for name, span in spans.items() if span > 150}
          assert not oversized, oversized
          print(f'OPEN_PART_ROOT_SPAN={method.end_lineno-method.lineno+1}')
          print(f'HOLE_EDITOR_FUNCTION_SPANS={spans}')
          print(f'GUI_LOC={len(root.splitlines())}')
          PY
      - name: Commit verified GREEN to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui.py
          git diff --cached --check
          git commit -m "refactor(#293): delegate part editor routing [skip ci]"
          git push origin HEAD:refactor/issue293-part-routing-green-20260917
