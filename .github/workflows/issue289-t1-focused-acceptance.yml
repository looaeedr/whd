name: Issue 289 T1 Focused Acceptance

on:
  push:
    branches:
      - refactor/issue289-gui-phase2-t1-lifecycle-20260915

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  T1_ACCEPTED_PREDECESSOR: "89630f54767207f26252b81505b783e01d938be2"

jobs:
  focused-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Record identity and source drift
        run: |
          echo "RUN_SHA=${GITHUB_SHA}"
          echo "T1_ACCEPTED_PREDECESSOR=${T1_ACCEPTED_PREDECESSOR}"
          git diff --name-status "${T1_ACCEPTED_PREDECESSOR}"...HEAD
      - name: Discover lifecycle-related regression files
        shell: bash
        run: |
          set -euo pipefail
          grep -rlE \
            'open_original_fold_designer|_apply_phase6_project_snapshot|_compose_phase6_project_snapshot_from_main_gui|_capture_phase6_committed_snapshot|_apply_original_fold_designer_snapshot|_store_fold_designer_workspace|_apply_fold_designer_live_snapshot|_Phase6UpdateScheduler|_request_phase6_update|_flush_phase6_authoritative_state|bind_live_updates' \
            tests --include='test_*.py' | sort -u | tee /tmp/t1-test-files.txt
          test -s /tmp/t1-test-files.txt
          echo "T1_MATCHED_TEST_FILES=$(wc -l < /tmp/t1-test-files.txt)"
      - name: Import and architecture smoke
        run: |
          python - <<'PY'
          import ast
          import gui
          from pathlib import Path
          assert gui.Phase6ApplicationHost.__init__.__module__ == 'gui_modules.application.lifecycle'
          assert gui._Phase6UpdateScheduler.__module__ == 'gui_modules.application.command_router'
          for path in Path('gui_modules/application').glob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      assert all(alias.name != 'gui' for alias in node.names), path
                  elif isinstance(node, ast.ImportFrom):
                      assert node.module != 'gui', path
          print('T1_IMPORT_ARCHITECTURE_SMOKE=PASS')
          PY
      - name: Run focused headless regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/t1-test-files.txt
          python -m pytest -q "${files[@]}" tests/test_issue289_gui_phase2_t1_lifecycle.py
      - name: Protected source drift gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${T1_ACCEPTED_PREDECESSOR}"...HEAD -- \
            config.ini '基準檔/**' ae_engine fold_designer_bridge.py phase6_fold_profiles.py phase6_project_file.py release_required_artifacts.json)"
          if [ -n "$changed" ]; then
            echo "Unexpected protected production drift:"
            echo "$changed"
            exit 1
          fi
          echo "T1_PROTECTED_SOURCE_DRIFT=0"
      - name: Config invariant
        run: git diff --exit-code "${T1_ACCEPTED_PREDECESSOR}"...HEAD -- config.ini

  focused-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Install Xvfb when absent
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Discover lifecycle-related GUI regression files
        shell: bash
        run: |
          set -euo pipefail
          grep -rlE \
            'open_original_fold_designer|_apply_phase6_project_snapshot|_compose_phase6_project_snapshot_from_main_gui|_capture_phase6_committed_snapshot|_apply_original_fold_designer_snapshot|_store_fold_designer_workspace|_apply_fold_designer_live_snapshot|_Phase6UpdateScheduler|_request_phase6_update|_flush_phase6_authoritative_state|bind_live_updates' \
            tests --include='test_*.py' | sort -u | tee /tmp/t1-test-files.txt
          test -s /tmp/t1-test-files.txt
      - name: Run focused regressions under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/t1-test-files.txt
          xvfb-run -a python -m pytest -q "${files[@]}" tests/test_issue289_gui_phase2_t1_lifecycle.py
