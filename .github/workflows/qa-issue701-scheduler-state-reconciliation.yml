name: "QA | Issue #701 | Scheduler state reconciliation"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-stop-24:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run RED-STOP-24 characterization
        run: |
          python -m pytest -q tests/process/test_issue701_scheduler_state_reconciliation.py
