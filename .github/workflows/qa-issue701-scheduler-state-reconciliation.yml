name: "QA | Issue #701 | Scheduler state reconciliation"

on:
  push:
    branches:
      - work/issue701-scheduler-state-reconciliation-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-stop-24:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run RED-STOP-24 characterization
        run: |
          python -m pytest -q --confcutdir=tests/process tests/process/test_issue701_scheduler_state_reconciliation.py
