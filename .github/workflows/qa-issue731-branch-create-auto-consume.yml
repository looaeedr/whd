name: WHD Issue 731 Branch Create Auto Consume QA

on:
  push:
    branches:
      - governance/issue731-branch-create-auto-consume-20260926

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Focused guard transaction regression
        run: >-
          python -m pytest -q
          tests/process/test_issue731_branch_create_auto_consume.py
          tests/process/test_issue643_guard_transaction_gate.py
