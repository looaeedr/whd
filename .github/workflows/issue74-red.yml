name: Issue74 RED
on:
  push:
    branches: [fix/issue74-divider-side-front-penetration]
    paths:
      - tests/test_issue74_divider_side_front_penetration.py
      - .github/workflows/issue74-red.yml
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib -r requirements.txt
      - run: pytest -q -s tests/test_issue74_divider_side_front_penetration.py
