name: "QA #368 T4 registry diagnostics GREEN"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t4-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 05e7820e319421cbfbd83e5b243d05cdc7596410 HEAD
          echo "T4_BASELINE=05e7820e319421cbfbd83e5b243d05cdc7596410"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy -r requirements.txt

      - name: Compile T4 owners
        run: python -m py_compile phase6_registry_diagnostics_controller.py fold_designer_bridge.py

      - name: Run T4 ownership contract
        run: python -m pytest -q tests/test_issue368_t4_registry_diagnostics_owner.py

      - name: Run pure registry diagnostics regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_certified_relief_registry.py             tests/test_certified_relief_registry_completion.py             tests/test_certified_relief_registry_schema_v2.py             tests/test_relief_formula_evaluator.py             tests/test_relief_registry_candidate_backend.py             tests/test_joint_editor_backend.py             tests/test_joint_diagnostics_contract.py             tests/test_phase6_diagnostics_ownership.py

      - name: Run real-Tk registry diagnostic regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_relief_registry_form.py             tests/test_relief_registry_candidate_shadow_gui.py             tests/test_rebuild_t7_joint_local_diagnostics.py             tests/test_corner_registry_chinese_presentation.py
