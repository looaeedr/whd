name: DM6 T4 Acceptance QA

on:
  push:
    branches:
      - work/dm6-t4-save-reload-semantic-determinism
    paths:
      - .github/workflows/dm6-t4-qa.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib
          python -m pip install -r requirements.txt
      - name: T4 semantic roundtrip and source guards
        run: |
          python -m pytest -q             tests/test_dm6_save_reload_semantic_determinism.py             tests/test_dm6_sink_semantic_parity.py             tests/test_engineering_drawing_integration.py             tests/test_dm6_layout_semantic_identity.py             tests/test_dm6_annotation_semantic_contract.py
      - name: Persistence and annotation compile
        run: |
          python -m py_compile phase6_project_file.py phase6_project_controller.py             gui.py ae_engine/drawing_annotations.py ae_engine/drawing_annotation_layout.py             ae_engine/engineering_drawing.py ae_engine/sheetmetal_drawing.py
