name: Issue162 preflight
on:
  push:
    branches:
      - fix/issue162-unfold-viewport-20260912
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Task preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#162 unfold viewport presentation: black canvas, larger initial fit, mouse-wheel zoom; presentation only, no manufacturing geometry feedback"
          --evidence docs/superpowers/verification/2026-09-12-issue160-dispatch-issue162-preflight.md
      - name: Changed-file preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#162 unfold viewport presentation: black canvas, larger initial fit, mouse-wheel zoom; presentation only, no manufacturing geometry feedback"
          --changed-file fold_designer_bridge.py
          --changed-file tests/test_issue162_unfold_viewport.py
          --evidence docs/superpowers/verification/2026-09-12-issue160-dispatch-issue162-preflight.md
