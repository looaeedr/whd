name: qa-issue113-durable-writeback-preflight-20260911

on:
  push:
    branches:
      - docs/issue113-parent-identity-writeback-20260911
    paths:
      - '.github/workflows/qa-issue113-durable-writeback-preflight-20260911.yml'

permissions:
  contents: write

jobs:
  preflight-and-writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Issue113 durable writeback preflight
        run: |
          set -euo pipefail
          printf '%s\n' \
            'issue-closure-gate' \
            'READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' \
            'READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md' \
            > /tmp/evidence.md
          python tools/phase6_skill_preflight.py \
            --task 'Final Combined durable AI Library writeback for #108 aggregate parent identity' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' \
            --evidence /tmp/evidence.md
      - name: Append durable parent identity rule
        shell: bash
        env:
          WRITEBACK_B64: ''
        run: |
          set -euo pipefail
          file='個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          marker='### 119. 2026-09-11 — `box_body` aggregate parent identity 不得被 remembered child 劫持'
          if grep -Fq "$marker" "$file"; then
            echo 'marker already exists; refusing duplicate writeback'
            exit 1
          fi
          printf '%s' "$WRITEBACK_B64" | base64 -d >> "$file"
          git diff --check
          git config core.quotePath false
          changed="$(git diff --name-only)"
          test "$changed" = "$file"
          git diff --exit-code -- config.ini
          git diff --exit-code -- '基準檔'
          grep -Fq 'remembered child` 只屬 **View/navigation convenience**' "$file"
          grep -Fq 'requested aggregate parent identity' "$file"
          echo "AI_LIBRARY_LINES=$(wc -l < "$file")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'docs(ai): preserve box-body aggregate parent identity'
          git push origin HEAD:docs/issue113-parent-identity-writeback-20260911
