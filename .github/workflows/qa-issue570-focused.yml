name: WHD｜#570 merge-head reconcile focused
run-name: "WHD｜#570｜merge-head claim reconcile focused"

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - tools/execution_claim_guard.py
      - tests/process/test_issue570_merge_head_claim_reconciliation.py
      - .github/workflows/qa-issue570-focused.yml

permissions:
  contents: read

jobs:
  focused:
    name: "#570 merge-head reconciliation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout PR"
        uses: actions/checkout@v4
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pytest"
        run: python -m pip install --disable-pip-version-check pytest
      - name: "Run #570 focused tests"
        run: python -m pytest -q tests/process/test_issue570_merge_head_claim_reconciliation.py
