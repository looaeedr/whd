name: "QA #372 T8 focused compatibility remediation GREEN"

on:
  push:
    branches:
      - fix/issue372-t8-phase3-compat-remediation-20260919
    paths:
      - '.github/workflows/qa-issue372-t8-remediation-green.yml'
      - 'fold_designer_bridge.py'
      - 'gui_modules/application/command_router.py'
      - 'tests/test_issue335_top_toolbar.py'
      - 'tests/test_issue336_left_content_switch.py'
      - 'tests/test_issue340_keyboard_focus.py'
      - 'tests/test_issue350_manufacturing_orchestration_extraction.py'
      - 'tests/test_issue366_t2c_corner_external_controller.py'
      - 'tests/test_phase6_gui_performance_contract.py'
      - 'tests/test_phase6_ui_state_regressions.py'
      - 'tools/issue351_t6_compatibility_gate.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 94ef0fe00cc0d2d9b6fe6681d75843b282d5a62c

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify remediation ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          echo "REMEDIATION_BASELINE=$BASELINE_SHA"
          echo "REMEDIATION_CANDIDATE=$(git rev-parse HEAD)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt

      - name: Compile touched owners
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             fold_designer_bridge.py             gui_modules/application/command_router.py             gui_modules/application/lifecycle.py             phase6_settings_transaction_controller.py             phase6_project_controller.py

      - name: Run exact T8 Headless RED nodes
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue335_top_toolbar.py::test_output_authority_routes_are_unchanged             tests/test_issue336_left_content_switch.py::test_t3_source_contract_uses_one_main_selector_without_duplicate_content_strip             tests/test_issue340_keyboard_focus.py::test_t7_source_contract_installs_authoritative_shortcuts_and_focus_guards             tests/test_issue350_manufacturing_orchestration_extraction.py::test_issue350_phase1_only_service_wiring_is_retired_after_t4             tests/test_issue351_t6_compatibility_gate.py::test_issue351_compatibility_gate             tests/test_issue366_t2c_corner_external_controller.py::test_issue366_t2c_bridge_delegates_transaction_semantics_and_keeps_only_effects             tests/test_phase6_2d_3d_round_trip.py::test_save_reload_to_3d_to_2d_round_trip             tests/test_phase6_gui_performance_contract.py::test_external_designer_apply_has_explicit_anti_echo_guard_contract             tests/test_phase6_ui_state_regressions.py::test_box_assembly_combobox_selection_updates_joint_graph_without_rewriting_corner_state

      - name: Run real-Tk compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_phase6_designer_workspace.py::test_destroying_designer_cancels_owned_tk_after_callbacks             tests/test_phase6_2d_3d_round_trip.py::test_save_reload_to_3d_to_2d_round_trip             tests/test_phase6_ui_state_regressions.py::test_box_assembly_combobox_selection_updates_joint_graph_without_rewriting_corner_state             tests/test_issue340_keyboard_focus.py

      - name: Run owner and purity gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue366_t2_settings_transaction_owner.py             tests/test_issue367_t3_project_persistence_owner.py             tests/test_issue371_t7_lifecycle_facade_owner.py             tests/test_issue371_t7_update_runtime_behavior.py             tests/test_issue358_remove_manufacturing_callbacks.py             tests/test_issue361_one_line_manufacturing_facade.py             tests/test_phase6_update_executor_conformance.py

      - name: Protected source gate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$BASELINE_SHA"...HEAD | grep -Ei '\.(dxf)$|(^|/)config\.ini$'; then
            echo "PROTECTED_SOURCE_DRIFT"
            exit 1
          fi
          echo "PROTECTED_SOURCE_DRIFT=0"
