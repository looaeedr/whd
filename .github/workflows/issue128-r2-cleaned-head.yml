name: Issue 128 R2 Cleaned Head Audit

on:
  push:
    branches:
      - work/issue-128-combined-ui-acceptance-20260912-r2
    paths:
      - .github/workflows/issue128-r2-cleaned-head.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock production and enforce cleaned diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/2d-3d-sync
          BASE=711194caac8e8f94d464f8abc4d82316f87edc93
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "$BASE"
          test "$(git merge-base HEAD origin/cleanup/2d-3d-sync)" = "$BASE"
          git -c core.quotePath=false diff --name-only "$BASE"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .agents/skills/engineering/UI設計與去AI味/SKILL.md
          .github/workflows/issue128-r2-cleaned-head.yml
          docs/superpowers/verification/2026-09-12-issue128-r2-state.md
          tests/process/test_issue128_invariant_manifest_contract.py
          個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE"...HEAD -- config.ini 基準檔 phase6_settings_panel.py fold_designer_bridge.py phase6_settings_center.py gui.py)"
      - name: Provision process-test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install -q pytest
      - name: Verify permanent durable guards
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/process/test_issue128_invariant_manifest_contract.py \
            tests/test_ui_design_de_ai_skill_contract.py
      - name: Verify clean tracked worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --short --untracked-files=no)"
