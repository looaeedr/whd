name: "QA #387 T4 final combined"

on:
  push:
    branches:
      - integration/issue387-assembly-layout-final-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/**'
      - '.github/workflows/qa-issue387-final-combined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity and lineage
        shell: bash
        run: |
          set -euo pipefail
          PROD=0947e546063c4c2118cb778d2798da5dbff682b3
          T3=04dc9513bf227fb4090beabea21c65730d25d5d1
          test "$(git merge-base HEAD "$PROD")" = "$PROD"
          test "$(git merge-base HEAD "$T3")" = "$T3"
          echo "PRODUCTION_BASE=$PROD"
          echo "ACCEPTED_T3=$T3"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Capture protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before

      - name: Relevant headless ownership and persistence
        run: |
          python -m pytest -q             tests/test_dm7_topology_persistence.py             tests/test_phase6_t05_multi_door_identity.py             tests/test_phase6_project_ownership.py             tests/test_phase6_project_session.py             tests/test_issue367_t3_project_persistence_owner.py             tests/test_phase6_project_file.py             --tb=short

      - name: Final Xvfb layout and navigation matrix
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue375_main_selector_navigation.py             tests/test_issue376_assembly_collapsible_data.py             tests/test_issue377_remove_wrapper_labels.py             tests/test_issue378_assembly_mousewheel.py             tests/test_issue383_content_ownership_red.py             tests/test_issue384_assembly_only_function_presentation.py             tests/test_issue385_assembly_parent_child_groups.py             tests/test_issue386_default_assembly_collapsed.py             --tb=short

      - name: Final Xvfb physical identity and visibility matrix
        run: |
          xvfb-run -a python -m pytest -q             tests/test_issue124_structure_tree.py::test_structure_tree_visibility_delegates_existing_view_state_without_deleting_part             tests/test_issue124_structure_tree.py::test_family_switch_removes_stale_receiving_children_and_restores_current_authority             tests/test_phase6_receiving_multipart_integration.py::test_opening_receiving_designer_preserves_formal_door_features_and_authoritative_rows             tests/test_phase6_t19_receiving_baseplate_topology.py::test_receiving_materializes_exactly_one_base_plate_per_door_cell             tests/test_phase6_t19_receiving_baseplate_topology.py::test_receiving_dynamic_base_plates_are_real_topology_owned_workspace_parts             --tb=short

      - name: Layout-only source classifier
        shell: bash
        run: |
          set -euo pipefail
          PROD=0947e546063c4c2118cb778d2798da5dbff682b3
          git diff --name-only "$PROD"...HEAD | tee /tmp/issue387-files.txt

          # Production behavior change is constrained to the Fold Designer presentation facade.
          test "$(grep -Ec '^(ae_engine/|gui_modules/application/|phase6_project_|phase6_manufacturing|phase6_designer_workspace.py$|phase6_part_navigation.py$|config.ini$|基準檔/)' /tmp/issue387-files.txt || true)" -eq 0

          # No new editable assembly controls: the assembly presentation may use
          # Checkbutton/Button/Label/Frame only, never Entry/Combobox/Spinbox.
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path("fold_designer_bridge.py")
          tree = ast.parse(p.read_text(encoding="utf-8"))
          fn = next(
              n for n in tree.body
              if isinstance(n, ast.FunctionDef)
              and n.name == "_phase6_refresh_assembly_parts_panel"
          )
          src = ast.get_source_segment(p.read_text(encoding="utf-8"), fn) or ""
          forbidden = ("ttk.Entry(", "ttk.Combobox(", "ttk.Spinbox(", "tk.Entry(", "tk.Spinbox(")
          assert not any(token in src for token in forbidden), forbidden
          print("PASS NEW_EDIT_CAPABILITY=0")
          PY

          echo "PASS LAYOUT_ONLY=1"
          echo "PASS GEOMETRY_OWNER_DRIFT=0"
          echo "PASS DATAFLOW_OWNER_DRIFT=0"

      - name: Protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          cmp /tmp/config.before /tmp/config.after
          cmp /tmp/baseline.before /tmp/baseline.after
          git diff --check 0947e546063c4c2118cb778d2798da5dbff682b3...HEAD
          echo "PASS PROTECTED_DRIFT=0"
