name: Issue229 T3 Executable Continuity Routing QA

on:
  push:
    branches:
      - work/issue225-knowledge-documentation-consolidation-20260914
      - fix/issue229-t3-navigation-green-20260914
    paths:
      - 'tests/knowledge/test_executable_continuity_routing_alignment.py'
      - 'AGENTS.md'
      - '.agents/skills/skill_registry.json'
      - '.agents/skills/skill_catalog.json'
      - '.agents/skills/engineering/README.md'
      - 'docs/superpowers/checkpoints/issue229-t3-preflight-evidence.txt'
      - '.github/workflows/issue229-t3-routing-qa.yml'

jobs:
  t3-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover changed-file preflight requirements
        shell: bash
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T3 AGENTS executable continuity bridge assert-finalizable Skill registry catalog engineering README navigation active skill routing" \
            --changed-file tests/knowledge/test_executable_continuity_routing_alignment.py \
            --changed-file AGENTS.md \
            --changed-file .agents/skills/skill_registry.json \
            --changed-file .agents/skills/skill_catalog.json \
            --changed-file .agents/skills/engineering/README.md \
            --evidence docs/superpowers/checkpoints/issue229-t3-preflight-evidence.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused T3 routing RED
        run: python -m pytest tests/knowledge/test_executable_continuity_routing_alignment.py -q
