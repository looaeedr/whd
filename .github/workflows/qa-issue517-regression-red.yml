name: "QA #517 Receiving live-switch UI/DXF/MARKING regression"

on:
  push:
    branches:
      - hotfix/issue517-receiving-live-switch-ui-dxf-20260922
    paths:
      - tests/test_issue517_receiving_live_switch_ui_export_marking.py
      - tests/test_issue510_receiving_back_panel_modes.py
      - tests/test_issue187_3d_output_migration.py
      - tests/test_resolved_manufacturing_export.py
      - tests/test_issue295_t7_project_export_adapter_slice.py
      - fold_designer_bridge.py
      - phase6_settings_panel.py
      - phase6_final_scene_renderer.py
      - gui_modules/project/export_actions.py
      - gui_modules/application/lifecycle.py
      - gui_modules/application/command_router.py
      - .github/workflows/qa-issue517-regression-red.yml

permissions:
  contents: read

jobs:
  focused-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest matplotlib ezdxf shapely -r requirements.txt

      - name: Wait for exact shared claim then guard QA
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for _ in $(seq 1 30); do
            git fetch --force origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
            git show origin/coord/dispatch-claims:.dispatch/claims/issue-517.json > /tmp/issue517-claim.json
            claim_head="$(python -c 'import json; print(json.load(open("/tmp/issue517-claim.json", encoding="utf-8"))["head_sha"])')"
            if [ "$claim_head" = "$GITHUB_SHA" ]; then
              matched=1
              break
            fi
            sleep 2
          done
          test "$matched" = "1"
          python tools/execution_claim_guard.py \
            --claim /tmp/issue517-claim.json \
            --issue 517 \
            --worker chatgpt \
            --branch hotfix/issue517-receiving-live-switch-ui-dxf-20260922 \
            --action qa-dispatch \
            --base-sha fe6e7350bd1b8e207285c0faf30defd6839cbb2e \
            --head-sha "$GITHUB_SHA"

      - name: Combined #517 adjacent regression
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue517_receiving_live_switch_ui_export_marking.py \
            tests/test_issue510_receiving_back_panel_modes.py \
            tests/test_issue187_3d_output_migration.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_issue295_t7_project_export_adapter_slice.py \
            --tb=short

      - name: Final physical-part and DXF acceptance
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_dxf_acceptance.py \
            tests/test_receiving_door_dxf_roundtrip.py \
            tests/test_multipart_dxf_acceptance.py \
            tests/test_resolved_manufacturing_export.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_manufacturing_api_finished_face_contract.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_phase6_project_controller.py \
            tests/test_phase6_project_file.py \
            tests/test_phase6_project_ownership.py \
            tests/test_phase6_project_session.py \
            tests/test_issue509_receiving_horizontal_marking.py \
            tests/test_issue510_receiving_back_panel_modes.py \
            --tb=short

      - name: Fresh dynamic-parts Save-Reload acceptance
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            --tb=short

      - name: Frozen-base #45 A/B classifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/issue517-base fe6e7350bd1b8e207285c0faf30defd6839cbb2e
          cd /tmp/issue517-base
          xvfb-run -a python -m pytest -q \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            --tb=short

      - name: Config invariant
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- config.ini
