name: Issue119 R1 RED Latest Target

on:
  push:
    branches:
      - fix/issue119-replay-latest-20260912-r1
    paths:
      - .github/workflows/issue119-r1-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install -q pytest ezdxf shapely matplotlib
      - name: Compile regression tests
        run: python -m py_compile tests/test_issue119_corner_data_transition_ui.py tests/test_issue119_corner_data_knowledge_contract.py
      - name: Verify durable knowledge RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue119_corner_data_knowledge_contract.py 2>&1 | tee /tmp/knowledge-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q "failed" /tmp/knowledge-red.log
          echo "ISSUE119_KNOWLEDGE_RED_CONFIRMED exit=$code"
      - name: Verify real Tk/Xvfb UI RED
        shell: bash
        run: |
          set +e
          timeout 240s xvfb-run -a python -m pytest -q tests/test_issue119_corner_data_transition_ui.py -s 2>&1 | tee /tmp/ui-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q "failed" /tmp/ui-red.log
          echo "ISSUE119_UI_RED_CONFIRMED exit=$code"
      - name: Prove production unchanged from latest target
        shell: bash
        run: |
          git diff --exit-code eede532b9fe61052cf4411ecf5063e0374165fe8..HEAD -- fold_designer_bridge.py gui.py .agents/skills/engineering/截角資料入口收斂/SKILL.md 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
