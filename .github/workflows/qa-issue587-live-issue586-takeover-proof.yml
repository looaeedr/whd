name: WHD｜#587｜#586 聊天室接手 machine proof
run-name: "WHD｜#587｜#586 聊天室接手 machine proof｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue587-proof-takeover586-20260924

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  proof:
    name: "實證｜fresh #586 stale takeover evaluator + claim guard"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ISSUE: "586"
      REQUESTING_WORKER: "chatgpt.sol260924.issue586.takeover"
      AUTHORITY_COMMENT_ID: "5807534586"
    steps:
      - name: "Checkout #587 proof branch"
        uses: actions/checkout@v4

      - name: "Fresh-read #586 durable authority"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/takeover-proof
          gh api "repos/${GITHUB_REPOSITORY}/contents/.dispatch/claims/issue-${TARGET_ISSUE}.json?ref=coord/dispatch-claims" \
            --jq .content | tr -d '\n' | base64 -d > /tmp/takeover-proof/claim.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${AUTHORITY_COMMENT_ID}" \
            > /tmp/takeover-proof/authority.json

          WORK_BRANCH="$(jq -r '.work_branch' /tmp/takeover-proof/claim.json)"
          LIVE_HEAD="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test -n "${LIVE_HEAD}"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${LIVE_HEAD}" \
            --jq '.commit.committer.date' > /tmp/takeover-proof/commit_at.txt

          RUN_ID="$(jq -r '.remote_qa.run_id // empty' /tmp/takeover-proof/claim.json)"
          if [ -n "${RUN_ID}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              | jq '{run_id:.id, found:true, head_sha:.head_sha, status:.status, conclusion:.conclusion, updated_at:.updated_at}' \
              > /tmp/takeover-proof/remote.json
            echo "REMOTE_ARG=--remote-run-json /tmp/takeover-proof/remote.json" >> "${GITHUB_ENV}"
          else
            echo "REMOTE_ARG=" >> "${GITHUB_ENV}"
          fi

          echo "WORK_BRANCH=${WORK_BRANCH}" >> "${GITHUB_ENV}"
          echo "LIVE_HEAD=${LIVE_HEAD}" >> "${GITHUB_ENV}"
          echo "BASE_SHA=$(jq -r '.base_sha' /tmp/takeover-proof/claim.json)" >> "${GITHUB_ENV}"
          echo "OLD_WORKER=$(jq -r '.worker' /tmp/takeover-proof/claim.json)" >> "${GITHUB_ENV}"

      - name: "執行 canonical stale takeover evaluator"
        shell: bash
        run: |
          set -euo pipefail
          remote_args=()
          if [ -n "${REMOTE_ARG}" ]; then
            remote_args=(--remote-run-json /tmp/takeover-proof/remote.json)
          fi
          python tools/stale_claim_takeover.py \
            --claim /tmp/takeover-proof/claim.json \
            --live-head-sha "${LIVE_HEAD}" \
            --live-head-committed-at "$(cat /tmp/takeover-proof/commit_at.txt)" \
            "${remote_args[@]}" \
            --stale-after-seconds 600 \
            --requesting-worker "${REQUESTING_WORKER}" \
            --requesting-executor-source chat \
            --user-authority-json /tmp/takeover-proof/authority.json \
            --require-actionable \
            --decision-out /tmp/takeover-proof/decision.json
          cat /tmp/takeover-proof/decision.json

      - name: "執行 canonical execution claim guard"
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim /tmp/takeover-proof/claim.json \
            --issue "${TARGET_ISSUE}" \
            --worker "${OLD_WORKER}" \
            --branch "${WORK_BRANCH}" \
            --action claim-takeover \
            --base-sha "${BASE_SHA}" \
            --head-sha "${LIVE_HEAD}" \
            --takeover-evidence /tmp/takeover-proof/decision.json \
            --user-authority-evidence /tmp/takeover-proof/authority.json
          echo "INTERACTIVE_TAKEOVER_PROOF_GREEN issue=${TARGET_ISSUE} previous_worker=${OLD_WORKER} requesting_worker=${REQUESTING_WORKER} live_head=${LIVE_HEAD}"

      - name: "上傳 takeover proof evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue587-takeover-proof
          path: /tmp/takeover-proof
