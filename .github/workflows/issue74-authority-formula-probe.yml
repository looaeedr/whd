name: Issue74 Authority Formula Probe
on:
  push:
    branches: [fix/issue74-divider-side-front-penetration]
    paths: [.github/workflows/issue74-authority-formula-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib -r requirements.txt
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from dataclasses import replace
          from collections import defaultdict
          from shapely.geometry import box
          from shapely.ops import unary_union
          import fold_designer_bridge as bridge
          from tests.test_issue39_divider_relief import _snapshot,_body_part,_divider_part
          from ae_engine.assembly_collision import _triangle_pair_crossing_segment,_barycentric_world_to_flat,_scene_with_replaced_primary_cutting

          snap=_snapshot(); body=_body_part(snap); divider,dp=_divider_part(snap)
          pieces={p.role:p for p in body.render_data.pieces}
          def lengths(piece):
              return {str(r.phase6_key):float(r.length) for r in piece.fold_profile}
          L=lengths(pieces["left_side"]); R=lengths(pieces["right_side"])
          contract=dict(dp.render_data.metadata["physical_geometry_contract"])
          core_start=float(contract["core_physical_segment"]["flat_band"][0])
          fw_band=tuple(map(float,contract["fw_physical_face"]["flat_band"]))
          fw_material=fw_band[1]-fw_band[0]
          material=dp.render_data.material
          minx,miny,maxx,maxy=map(float,material.bounds)
          half_t=float(snap["t"])/2.0

          left_joint_u=core_start+float(L["zl2"])
          left_h=box(minx, miny+fw_material-half_t, left_joint_u, miny+fw_material+half_t)
          left_v=box(left_joint_u-half_t, miny+fw_material, left_joint_u+half_t, miny+fw_material+float(L["zl1"]))
          right_joint_u=core_start+float(R["zr2"])
          right_center_v=maxy-fw_material
          right_h=box(minx, right_center_v-half_t, right_joint_u, right_center_v+half_t)
          physical_cut=unary_union((left_h,left_v,right_h)).intersection(material)

          render=replace(dp.render_data,
              material=material.difference(physical_cut),
              scene=_scene_with_replaced_primary_cutting(dp.render_data.scene, material.difference(physical_cut)))
          solved=replace(dp,render_data=render)
          world=bridge._phase6_build_joint_world_geometry((body,solved),(snap["w"],snap["h"],snap["d"]),snap["t"])
          tgt=tuple(world["mapped_skin_triangles_by_part"][divider.stable_id])

          penetrations={}
          contacts={}
          for source_key, piece in (("box_body:left_side",pieces["left_side"]),("box_body:right_side",pieces["right_side"])):
              srcs=tuple(world["mapped_skin_triangles_by_part"][source_key])
              cursor=0.0; bands=[]
              for row in piece.fold_profile:
                  end=cursor+float(row.length); bands.append((str(row.phase6_key),cursor,end)); cursor=end
              through=[]; single=[]
              for name,u0,u1 in bands:
                  sides=defaultdict(int)
                  for src in srcs:
                      us=[float(p[0]) for p in src.flat]
                      if max(us)<u0-1e-7 or min(us)>u1+1e-7: continue
                      for tar in tgt:
                          seg=_triangle_pair_crossing_segment(src.world,tar.world,tolerance=1e-7)
                          if not seg: continue
                          try: suv=[_barycentric_world_to_flat(p,src.world,src.flat) for p in seg]
                          except Exception: continue
                          mu=sum(float(p[0]) for p in suv)/2
                          if u0-1e-5<=mu<=u1+1e-5: sides[int(src.side)]+=1
                  if sides.get(-1) and sides.get(1): through.append(name)
                  elif sides: single.append((name,dict(sides)))
              penetrations[source_key]=through; contacts[source_key]=single

          print("ISSUE74_AUTHORITY_FORMULA="+json.dumps({
            "authority":{"core_start":core_start,"fw_material":fw_material,"T":snap["t"],"half_t":half_t,
              "left_zl1":L["zl1"],"left_zl2":L["zl2"],"right_zr2":R["zr2"],"span":maxy-miny},
            "cut_components":{
              "left_horizontal":list(map(float,left_h.bounds)),
              "left_vertical":list(map(float,left_v.bounds)),
              "right_horizontal":list(map(float,right_h.bounds))},
            "cut_area":float(physical_cut.area),
            "penetrations":penetrations,"single_skin_contacts":contacts,
          },ensure_ascii=False))
          assert all(not rows for rows in penetrations.values()), penetrations
          PY
