name: DM1 Preflight
on:
  push:
    branches:
      - work/dm1-divider-physical-contract
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase6 Knowledge Preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "Issue #51 DM1 Divider Physical Geometry Contract 邊界與 RED 架構護欄；完整追 Cabinet Family → Fold Contract → Divider Part → Manufacturing Resolve → Assembly → 2D → 3D → DXF → Save/Reload，建立 RED 架構護欄，不先改 production"
          --evidence .scratch/dm1/phase6_preflight_evidence.md
