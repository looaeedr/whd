name: Issue 475 Skill Authoring QA

on:
  push:
    branches:
      - process/issue475-dispatch-skill-live-remote-authority-20260922

jobs:
  skill-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Verify Skill line budget and identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".agents/skills/engineering/派工/SKILL.md")
          text = p.read_text(encoding="utf-8")
          assert len(text.splitlines()) < 500, len(text.splitlines())
          front = text.split("---", 2)[1]
          assert "name: 派工" in front
          assert "whd_contract: dispatching-workflow" in front
          assert "LIVE_REMOTE_QA_AUTHORITY_BRIDGE" in text
          print("SKILL_STRUCTURE_GREEN", len(text.splitlines()))
          PY
      - name: Phase6 Knowledge Preflight
        run: |
          cat > /tmp/issue475-evidence.md <<'EOF'
          寫技能
          派工
          issue-closure-gate
          phase6-release-packaging
          monitoring-remote-qa
          long-log-context-safe-execution
          executable-continuity-controller
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: release_required_artifacts.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task "修改既有 Skill .agents/skills/engineering/派工/SKILL.md：加入 live remote QA authority bridge，防止 stale claim/checkpoint remote status 覆蓋 exact GitHub Actions run terminal 狀態。" \
            --changed-file ".agents/skills/engineering/派工/SKILL.md" \
            --evidence /tmp/issue475-evidence.md
      - name: Targeted Skill authoring and governance tests
        run: |
          python -m pytest -q \
            tests/test_dispatching_skill_timeout_contract.py \
            tests/test_writing_skill_contract.py \
            tests/test_writing_skill_preflight_route.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_phase6_release_packaging_policy.py
