name: "QA #340 T7 Keyboard Focus"

on:
  push:
    branches:
      - ui/issue340-keyboard-focus-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#340)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact keyboard/focus RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue340_keyboard_focus.py::test_t7_source_contract_installs_authoritative_shortcuts_and_focus_guards > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#340 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-source:
    if: ${{ contains(github.event.head_commit.message, 'green(#340)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime imports
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - run: python -m pytest -q tests/test_issue340_keyboard_focus.py -k "source_contract or shortcut_helpers"

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#340)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: T7 real Tk shortcuts/focus and focused regressions
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_issue340_keyboard_focus.py \
            tests/test_issue337_control_hierarchy.py \
            tests/test_issue336_left_content_switch.py \
            tests/test_issue339_corner_presentation_fail_closed.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#340)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid save/selector/renderer authority drift
        shell: bash
        run: |
          git diff --name-only 8a0d29247d2f4176b12b016754766a19d92de3b0...HEAD | tee files.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("files.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          exact = {
              "config.ini",
              "phase6_designer_workspace.py",
              "phase6_workspace_controller.py",
              "phase6_project_file.py",
          }
          bad = sorted(p for p in changed if p in exact or p.startswith("基準檔/") or p.startswith("ae_engine/"))
          if bad:
              raise SystemExit(f"#340 protected authority drift: {bad}")
          print("#340 protected drift PASS", sorted(changed))
          PY
