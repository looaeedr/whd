name: Issue163 final acceptance
on:
  push:
    branches:
      - fix/issue163-unfold-workspace-layout-20260912
    paths:
      - .github/workflows/issue163-final-acceptance-20260912.yml
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock accepted T2 base and T3 implementation
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 155fc17aba13bde5cd0b48578334a5529b0b0c4b)" = "155fc17aba13bde5cd0b48578334a5529b0b0c4b"
          git merge-base --is-ancestor fb443cba43b6b06fa706f96b4166abfe797f15c6 HEAD
      - name: Install acceptance dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk fonts-noto-cjk
          python -m pip install -q pytest matplotlib pillow ezdxf -r requirements.txt
      - name: Final changed-file preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#163 final acceptance: structural UI relayout; left pane only part selector and active inputs with vertical scroll reachability at text scales 1.0/1.2/1.4; top only File and Corner Data; other controls right; preserve lifecycle and stable physical-part identity; no manufacturing geometry rewrite"
          --changed-file fold_designer_bridge.py
          --changed-file tests/test_issue163_unfold_workspace_layout.py
          --evidence docs/superpowers/verification/2026-09-12-issue163-preflight.md
      - name: Syntax check
        run: >-
          python -m py_compile
          fold_designer_bridge.py gui.py phase6_settings_panel.py phase6_settings_center.py
          tests/test_issue163_unfold_workspace_layout.py
          tests/test_issue127_surfaces_scale_scroll.py
          tests/test_issue123_ui_foundation.py
          tests/test_issue124_structure_tree.py
          tests/test_issue125_inspector_property_panel.py
          tests/test_issue126_workspace_layout.py
          tests/test_issue162_unfold_viewport.py
          tests/test_issue119_corner_data_transition_ui.py
          tests/test_issue96_corner_data_selection_lifecycle.py
          tests/test_issue97_authoritative_unfold_view_adapter.py
          tests/test_issue99_dual_view_parity_persistence.py
          tests/test_issue41_persistence_parity.py
          tests/test_issue45_dynamic_parts_2d_roundtrip.py
      - name: Capture protected invariants
        run: |
          set -euo pipefail
          mkdir -p .qa-evidence
          sha256sum config.ini | tee .qa-evidence/config.before
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > .qa-evidence/baseline.before
      - name: Issue163 and direct regressions
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2000x1200x24' pytest -q \
            tests/test_issue163_unfold_workspace_layout.py \
            tests/test_issue162_unfold_viewport.py \
            tests/test_issue119_corner_data_transition_ui.py \
            tests/test_issue96_corner_data_selection_lifecycle.py \
            tests/test_issue97_authoritative_unfold_view_adapter.py \
            2>&1 | tee .qa-evidence/t3-direct.log
      - name: Issue127 scale scroll acceptance
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2000x1200x24' pytest -q \
            tests/test_issue127_surfaces_scale_scroll.py \
            2>&1 | tee .qa-evidence/issue127.log
      - name: UI chain 123 through 126
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2000x1200x24' pytest -q \
            tests/test_issue123_ui_foundation.py \
            tests/test_issue124_structure_tree.py \
            tests/test_issue125_inspector_property_panel.py \
            tests/test_issue126_workspace_layout.py \
            2>&1 | tee .qa-evidence/ui-chain-123-126.log
      - name: Persistence and 2D 3D parity
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2000x1200x24' pytest -q \
            tests/test_issue99_dual_view_parity_persistence.py \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue45_dynamic_parts_2d_roundtrip.py \
            2>&1 | tee .qa-evidence/persistence-parity.log
      - name: Verify protected invariants and clean runtime tree
        if: always()
        run: |
          set -euo pipefail
          sha256sum config.ini | tee .qa-evidence/config.after
          find 基準檔 -type f -print0 | sort -z | xargs -0 sha256sum > .qa-evidence/baseline.after
          diff -u .qa-evidence/config.before .qa-evidence/config.after
          diff -u .qa-evidence/baseline.before .qa-evidence/baseline.after
          git diff --check
          git status --short --untracked-files=no | tee .qa-evidence/git-status.txt
          test ! -s .qa-evidence/git-status.txt
      - name: Build acceptance summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
              't3-direct.log', 'issue127.log', 'ui-chain-123-126.log', 'persistence-parity.log'
          ]
          total = 0
          rows = []
          for name in files:
              text = (Path('.qa-evidence') / name).read_text(encoding='utf-8', errors='replace') if (Path('.qa-evidence') / name).exists() else ''
              m = re.findall(r'(\d+) passed', text)
              count = int(m[-1]) if m else 0
              total += count
              rows.append(f'{name}: {count} PASS')
          summary = [
              'Issue #163 final acceptance',
              f'HEAD={__import__("subprocess").check_output(["git","rev-parse","HEAD"], text=True).strip()}',
              *rows,
              f'TOTAL={total} PASS',
              'config/protected baseline invariant checked by workflow gate',
          ]
          Path('.qa-evidence/summary.txt').write_text('\n'.join(summary) + '\n', encoding='utf-8')
          print('\n'.join(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue163-final-acceptance-evidence
          path: .qa-evidence/
          include-hidden-files: true
          retention-days: 14
