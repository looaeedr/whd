name: Issue292 Task10 Candidate Hygiene

on:
  push:
    branches:
      - cleanup/issue292-task10-hygiene-20260917

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cleanup/issue292-task10-hygiene-20260917

      - name: Remove only #292 temporary QA helpers
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='cba401f8d58742c87d7f7c7df27307ca95703609'
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"

          git rm -f --ignore-unmatch \
            .github/workflows/issue292-t4-base-plate-slice.yml \
            .github/workflows/issue292-t4-box-body-slice.yml \
            .github/workflows/issue292-t4-divider-slice.yml \
            .github/workflows/issue292-t4-door-slice.yml \
            .github/workflows/issue292-t4-endcap-slice.yml \
            .github/workflows/issue292-t4-indicator-slice.yml \
            .github/workflows/issue292-t4-multipart-slice.yml \
            .github/workflows/issue292-t4-task7-extract.yml \
            .github/workflows/issue292-t4-task7-residual-census.yml \
            .github/workflows/issue292-t4-task7-residual-extract.yml \
            .github/workflows/issue292-t4-task7-root-gate.yml \
            .task7-trigger \
            docs/superpowers/checkpoints/issue292-task7-harness-retrigger.md \
            docs/superpowers/checkpoints/issue292-task7-post-extract-green.md \
            docs/superpowers/checkpoints/issue292-task7-residual-extract-trigger.md \
            .github/workflows/qa-issue292-task10-cleanup.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(#292): remove temporary QA helpers'

          python3 - <<'PY'
          import subprocess
          candidate='cba401f8d58742c87d7f7c7df27307ca95703609'
          expected={
          '.github/workflows/issue292-t4-base-plate-slice.yml',
          '.github/workflows/issue292-t4-box-body-slice.yml',
          '.github/workflows/issue292-t4-divider-slice.yml',
          '.github/workflows/issue292-t4-door-slice.yml',
          '.github/workflows/issue292-t4-endcap-slice.yml',
          '.github/workflows/issue292-t4-indicator-slice.yml',
          '.github/workflows/issue292-t4-multipart-slice.yml',
          '.github/workflows/issue292-t4-task7-extract.yml',
          '.github/workflows/issue292-t4-task7-residual-census.yml',
          '.github/workflows/issue292-t4-task7-residual-extract.yml',
          '.github/workflows/issue292-t4-task7-root-gate.yml',
          '.task7-trigger',
          'docs/superpowers/checkpoints/issue292-task7-harness-retrigger.md',
          'docs/superpowers/checkpoints/issue292-task7-post-extract-green.md',
          'docs/superpowers/checkpoints/issue292-task7-residual-extract-trigger.md',
          }
          out=subprocess.check_output(['git','diff','--name-status',candidate,'HEAD'], text=True)
          seen={}
          for line in out.splitlines():
              status,path=line.split('\t',1)
              seen[path]=status
          if set(seen)!=expected:
              raise SystemExit(f'cleanup drift mismatch: expected={sorted(expected)} seen={seen}')
          bad={p:s for p,s in seen.items() if s!='D'}
          if bad:
              raise SystemExit(f'cleanup status mismatch: {bad}')
          print(f'TASK10_TESTED_TO_CLEANED=PASS deletions={len(seen)}')
          PY

          git diff --exit-code "$CANDIDATE" HEAD -- config.ini '基準檔/**' ae_engine phase6_project_file.py
          echo "CLEANED_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:cleanup/issue292-task10-hygiene-20260917
