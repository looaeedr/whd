name: Issue 289 Xvfb Residual Shards

on:
  push:
    branches:
      - qa/issue289-step7-signature-20260916

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  CANDIDATE_SHA: "3ee91f61d313f0ff3931a80efebb9c798d1e9328"
  INHERITED_NODE: "tests/test_box_body_single_source_t3.py::test_receiving_corner_data_box_body_uses_same_authoritative_context_projection"

jobs:
  residual-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Install Xvfb when absent
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Discover and select shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          grep -rlE \
            'open_original_fold_designer|_apply_phase6_project_snapshot|_compose_phase6_project_snapshot_from_main_gui|_capture_phase6_committed_snapshot|_apply_original_fold_designer_snapshot|_store_fold_designer_workspace|_apply_fold_designer_live_snapshot|_Phase6UpdateScheduler|_request_phase6_update|_flush_phase6_authoritative_state|bind_live_updates' \
            tests --include='test_*.py' | sort -u > /tmp/all.txt
          grep -qxF 'tests/test_issue289_gui_phase2_t1_lifecycle.py' /tmp/all.txt || echo 'tests/test_issue289_gui_phase2_t1_lifecycle.py' >> /tmp/all.txt
          sort -u /tmp/all.txt -o /tmp/all.txt
          awk -v shard="$SHARD" '((NR-1)%4)==shard' /tmp/all.txt | tee /tmp/shard.txt
          test -s /tmp/shard.txt
      - name: Run Xvfb shard
        id: shardrun
        shell: bash
        run: |
          set +e
          mapfile -t files < /tmp/shard.txt
          timeout 900s xvfb-run -a python -m pytest -q "${files[@]}" \
            --deselect "$INHERITED_NODE" 2>&1 | tee /tmp/shard-output.txt
          rc=${PIPESTATUS[0]}
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          grep -E '^FAILED tests/.*::|^ERROR tests/.*::' /tmp/shard-output.txt > /tmp/shard-failures.txt || true
          tail -n 100 /tmp/shard-output.txt > /tmp/shard-tail.txt
          exit "$rc"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue289-xvfb-residual-shard-${{ matrix.shard }}
          path: |
            /tmp/shard.txt
            /tmp/shard-failures.txt
            /tmp/shard-tail.txt
            /tmp/shard-output.txt
          if-no-files-found: warn
          retention-days: 7
