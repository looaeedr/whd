name: Issue 289 Xvfb Residual Gate 22

on:
  push:
    branches:
      - qa/issue289-step7-signature-20260916

permissions:
  contents: read
  issues: write

env:
  PYTHONUTF8: "1"
  CANDIDATE_SHA: "3ee91f61d313f0ff3931a80efebb9c798d1e9328"

jobs:
  residual-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest matplotlib ezdxf -r requirements.txt
      - name: Install Xvfb when absent
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Discover lifecycle-related GUI regression files exactly as acceptance
        shell: bash
        run: |
          set -euo pipefail
          grep -rlE \
            'open_original_fold_designer|_apply_phase6_project_snapshot|_compose_phase6_project_snapshot_from_main_gui|_capture_phase6_committed_snapshot|_apply_original_fold_designer_snapshot|_store_fold_designer_workspace|_apply_fold_designer_live_snapshot|_Phase6UpdateScheduler|_request_phase6_update|_flush_phase6_authoritative_state|bind_live_updates' \
            tests --include='test_*.py' | sort -u | tee /tmp/t1-test-files.txt
          test -s /tmp/t1-test-files.txt
      - name: Record 22 exact A/B-proven inherited nodes
        shell: bash
        run: |
          cat > /tmp/inherited-nodes.txt <<'EOF'
          tests/test_box_body_single_source_t3.py::test_receiving_corner_data_box_body_uses_same_authoritative_context_projection
          tests/test_corner_lock_visual_contract.py::test_fold_designer_locked_corner_ui_shows_lock_and_collapses_detail_area
          tests/test_corner_lock_visual_contract.py::test_3d_locked_corner_ui_shows_lock_collapses_detail_and_has_global_project_toolbar
          tests/test_corner_parameter_lock.py::test_fold_designer_corner_parameters_default_locked_and_unlock_does_not_mutate_state
          tests/test_corner_parameter_lock.py::test_3d_corner_parameters_default_locked_for_known_model_and_unlock_without_mutation
          tests/test_corner_parameter_lock.py::test_fold_designer_locked_parameters_have_no_hidden_editor_and_unlocked_can_adjust_amount
          tests/test_corner_parameter_lock.py::test_3d_known_model_locked_guard_and_unlocked_parameter_edit_preserves_type
          tests/test_corner_type_phase6_integration.py::test_corner_panel_is_visible_for_known_and_custom_models_with_type_locking
          tests/test_issue76_box_body_subtabs_2d_3d.py::test_designer_box_body_stays_one_top_level_part_but_has_switchable_physical_subtabs
          tests/test_phase6_3d_cutting_mesh.py::test_real_tk_active_door_uses_features_and_corner_state_in_cutting_mesh
          tests/test_phase6_gui_3d_integrity_20260830.py::test_real_box_body_2d_annotations_do_not_overlap_each_other_or_material
          tests/test_phase6_t08_ui_text_and_edge_selectors.py::test_endcap_four_direction_edge_selectors_are_narrowed_and_preserve_semantics
          tests/test_phase6_t08_ui_text_and_edge_selectors.py::test_fold_designer_controls_and_edge_selectors_update_on_text_size_changed
          tests/test_phase6_t22_settings_vertical_scroll.py::test_medium_unlocked_settings_uses_real_vertical_scroll_owner_and_scrollable_viewport
          tests/test_phase6_t23_bottom_edge_visibility.py::test_medium_unlocked_endcap_edge_hosts_are_fully_inside_canvas[head]
          tests/test_phase6_t23_bottom_edge_visibility.py::test_medium_unlocked_endcap_edge_hosts_are_fully_inside_canvas[tail]
          tests/test_phase6_t24_edge_selector_width.py::test_endcap_four_direction_selectors_are_width_5_or_less_and_semantics_still_apply[head]
          tests/test_phase6_t24_edge_selector_width.py::test_endcap_four_direction_selectors_are_width_5_or_less_and_semantics_still_apply[tail]
          tests/test_phase6_t25_combined_receiving_acceptance.py::test_combined_receiving_operator_path_from_live_family_switch
          tests/test_receiving_cabinet_type.py::test_switching_3d_baseline_model_to_receiving_applies_receiving_family_policy
          tests/test_receiving_side_panel_outside_defaults.py::test_receiving_designer_controls_show_exact_outside_defaults_for_each_physical_side
          tests/test_relief_registry_candidate_shadow_gui.py::test_candidate_record_gets_its_own_shadow_validation_without_mutating_registry
          EOF
          sed -i 's/^          //' /tmp/inherited-nodes.txt
          test "$(wc -l < /tmp/inherited-nodes.txt)" -eq 22
      - name: Run full Xvfb residual excluding only 22 A/B-proven inherited nodes
        id: residual
        shell: bash
        run: |
          set +e
          mapfile -t files < /tmp/t1-test-files.txt
          mapfile -t inherited < /tmp/inherited-nodes.txt
          deselect_args=()
          for node in "${inherited[@]}"; do
            deselect_args+=(--deselect "$node")
          done
          xvfb-run -a python -m pytest -q "${files[@]}" tests/test_issue289_gui_phase2_t1_lifecycle.py \
            "${deselect_args[@]}" 2>&1 | tee /tmp/residual-xvfb.txt
          rc=${PIPESTATUS[0]}
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          grep -E '^FAILED tests/.*::|^ERROR tests/.*::' /tmp/residual-xvfb.txt > /tmp/residual-failures.txt || true
          tail -n 160 /tmp/residual-xvfb.txt > /tmp/residual-tail.txt
          exit 0
      - name: Upload residual evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue289-xvfb-residual-after-22-inherited
          path: |
            /tmp/t1-test-files.txt
            /tmp/inherited-nodes.txt
            /tmp/residual-failures.txt
            /tmp/residual-tail.txt
            /tmp/residual-xvfb.txt
          if-no-files-found: error
          retention-days: 7
      - name: Comment residual result on issue 289
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### QA residual — full focused Xvfb after 22 exact inherited-red deselections'
            echo
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo "Candidate: \`${CANDIDATE_SHA}\`"
            echo "Exact deselected inherited nodes: \`22\`"
            echo "Residual pytest rc: \`${{ steps.residual.outputs.rc }}\`"
            echo
            echo '**Residual failures**'
            echo '```text'
            cat /tmp/residual-failures.txt 2>/dev/null || true
            echo '```'
            echo
            echo '**Pytest tail**'
            echo '```text'
            cat /tmp/residual-tail.txt 2>/dev/null || true
            echo '```'
          } > /tmp/issue289-residual-comment.md
          gh issue comment 289 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue289-residual-comment.md
      - name: Preserve residual result
        if: always()
        shell: bash
        run: |
          rc='${{ steps.residual.outputs.rc }}'
          if [ -z "$rc" ]; then rc=1; fi
          exit "$rc"
