name: WHD #540 停滯接手機器判定 RED
run-name: "WHD｜#540｜停滯接手機器判定 RED"

on:
  push:
    branches:
      - feature/issue540-stale-takeover-20260923
    paths:
      - tests/process/test_issue540_stale_claim_takeover.py
      - .github/workflows/qa-issue540-stale-takeover-red.yml

permissions:
  contents: read

jobs:
  red:
    name: 證明 10 分鐘停滯接手契約目前尚未實作
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝 pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: 執行預期失敗的 RED 測試
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/process/test_issue540_stale_claim_takeover.py 2>&1 | tee issue540-red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Eq "stale_claim_takeover|claim-takeover|unsupported guarded action" issue540-red.log
          echo "ISSUE540_RED_PROVEN"
