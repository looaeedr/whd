name: Issue 73 Assembly Visibility QA

on:
  push:
    branches:
      - fix/assembly-visibility-placement-reference

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Run Issue 73 regression
        run: |
          pytest -q tests/test_phase6_assembly_3d_view.py tests/test_phase6_final_scene_view_ownership.py
