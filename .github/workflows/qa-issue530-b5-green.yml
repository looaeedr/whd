name: 工單530 B5 GREEN 驗收
run-name: "工單 #530 B5｜Derived Request Assembly GREEN｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue530-b5-green.yml

permissions:
  contents: read

jobs:
  green:
    name: B5 Derived Projection Owner 驗收
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦驗證依賴
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: Headless replacement owner 與 derived 行為
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_issue480_derived_part_projection_plan.py             tests/test_issue481_derived_apply_linked_endcap_owner.py             tests/test_phase6_t04_inner_door_frames.py             tests/test_phase6_t05_box_body_dividers.py             tests/test_multi_door_layout.py             tests/test_phase6_derived_cache_owner.py             | tee /tmp/issue530-b5-headless.log
          grep -E '[0-9]+ passed' /tmp/issue530-b5-headless.log | tail -1

      - name: Xvfb physical-part parity
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q             tests/test_issue44_box_body_physical_piece_identity.py             tests/test_phase6_linked_fold_chain_and_parts.py             -k 'r4_receiving_corner_data or real_main_corner_data'             | tee /tmp/issue530-b5-xvfb.log
          grep -E '[0-9]+ passed' /tmp/issue530-b5-xvfb.log | tail -1

      - name: Architecture 與 Bridge reduction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue530-b5-architecture.log
          import ast
          from pathlib import Path

          bridge=Path("fold_designer_bridge.py")
          projection=Path("phase6_derived_part_projection.py")
          bsrc=bridge.read_text(encoding="utf-8")
          psrc=projection.read_text(encoding="utf-8")
          btree=ast.parse(bsrc)
          ptree=ast.parse(psrc)

          fn=next(
              n for n in btree.body
              if isinstance(n,ast.FunctionDef)
              and n.name=="_phase6_sync_authoritative_derived_parts"
          )
          body=ast.get_source_segment(bsrc,fn) or ""

          assert "DerivedPartRequestAssemblyInput(" in body
          assert "build_derived_part_projection_request(" in body
          assert "build_derived_part_sync_plan(request)" in body
          assert "navigation.apply_derived_sync_plan(plan)" in body

          for stale in (
              "remove_part_keys = []",
              "add_parts = []",
              "stash_profiles = []",
              "stash_features = []",
              "active_repair = None",
              "selected_repair = None",
              "DerivedPartProjectionRequest(",
          ):
              assert stale not in body, stale

          for domain_token in (
              "_phase6_door_part_projections",
              "derive_door_layout_cells",
              "_phase6_box_body_piece_part_profiles",
              "derive_box_body_dividers",
              "derive_all_inner_door_frames",
          ):
              assert domain_token in body, domain_token

          imports=set()
          for node in ast.walk(ptree):
              if isinstance(node,ast.Import):
                  imports.update(a.name for a in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module:
                  imports.add(node.module)
          forbidden_imports={
              "fold_designer_bridge",
              "phase6_manufacturing_geometry",
              "phase6_manufacturing_service",
          }
          assert not (imports & forbidden_imports), imports & forbidden_imports
          for token in (
              "DesignerWorkspace",
              "tkinter",
              "derive_box_body_dividers",
              "derive_all_inner_door_frames",
              "derive_inner_door_panels",
              "build_standard_part_profiles",
          ):
              assert token not in psrc, token

          loc=bsrc.count("\n")
          span=fn.end_lineno-fn.lineno+1
          assert loc < 7540
          assert span < 245
          print("BRIDGE_LOC="+str(loc))
          print("B5_BRIDGE_REDUCTION_FROM_PRE_B5="+str(7540-loc))
          print("B5_SYNC_FUNCTION_SPAN="+str(span))
          print("B5_REQUEST_ASSEMBLY_OWNER=phase6_derived_part_projection")
          print("B5_NAVIGATION_MUTATION_OWNER=UNCHANGED")
          print("B5_REVERSE_IMPORT_BRIDGE=0")
          print("ISSUE530_B5_GREEN=GREEN")
          PY

      - name: 上傳 GREEN 證據
        uses: actions/upload-artifact@v4
        with:
          name: issue530-b5-green
          path: |
            /tmp/issue530-b5-headless.log
            /tmp/issue530-b5-xvfb.log
            /tmp/issue530-b5-architecture.log
          if-no-files-found: error
          retention-days: 14
