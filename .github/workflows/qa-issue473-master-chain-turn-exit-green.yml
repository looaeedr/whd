name: Issue 473 Master Chain Turn Exit GREEN

on:
  push:
    branches:
      - governance/issue473-master-chain-turn-exit-hard-gate-20260921
    paths:
      - '.github/workflows/qa-issue473-master-chain-turn-exit-green.yml'
      - 'tools/continuity_controller.py'
      - 'tests/process/test_issue473_master_chain_turn_exit_gate.py'
      - 'tests/process/test_continuity_controller.py'
      - 'tests/process/test_issue321_turn_exit_enforcement.py'
      - '.agents/skills/engineering/派工/SKILL.md'
      - '.agents/skills/engineering/executable-continuity-controller/SKILL.md'
      - '.agents/skills/engineering/issue-closure-gate/SKILL.md'
      - '個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md'
      - '個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md'
      - '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
      - name: Run continuity hard-gate and knowledge regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/process/test_issue473_master_chain_turn_exit_gate.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_issue321_turn_exit_enforcement.py \
            tests/process/test_issue286_turn_exit_bridge_contract.py \
            tests/knowledge/test_executable_continuity_routing_alignment.py \
            tests/test_dispatching_skill_timeout_contract.py \
            tests/test_issue_closure_completion_skill_contract.py
