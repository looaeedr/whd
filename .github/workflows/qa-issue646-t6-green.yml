name: WHD｜#646｜T6 Governance Writeback GREEN
run-name: "WHD｜#646｜T6 governance/Skill/spec validation｜${{ github.sha }}"

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - .github/workflows/qa-issue646-t6-green.yml
      - .agents/skills/engineering/executable-continuity-controller/SKILL.md
      - .agents/skills/engineering/remote-execution-guard/SKILL.md
      - .agents/skills/engineering/派工/SKILL.md
      - docs/governance/whd_scheduler_takeover_usage.md
      - docs/specs/WHD_排程_GuardTransaction_DelegatedHelper_StaleTakeover_硬閘門規格_2026-09-25.md
      - 個人AI檔案庫/第二層_專案與SOP/11_WHD_Scheduled_Resume_ChatGPT自動續跑規則.md
      - 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md
      - 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
      - 個人AI檔案庫/踩坑庫/scheduler_prompt_authoring_pitfall.md

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Focused process regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/process/test_issue643_guard_transaction_gate.py \
            tests/process/test_issue642_active_claim_checkpoint_gate.py \
            tests/process/test_continuity_controller.py \
            tests/process/test_remote_execution_guard_skill_contract.py \
            tests/process/test_write_scheduler_skill_contract.py \
            tests/process/test_issue578_scheduler_runtime_liveness.py \
            tests/process/test_issue573_sibling_scheduler_takeover.py \
            tests/process/test_finalization_owner_guard.py \
            tests/process/test_issue256_execution_claim_guard.py \
            | tee /tmp/issue646-focused.log
      - name: #646 static writeback contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          continuity = (root / ".agents/skills/engineering/executable-continuity-controller/SKILL.md").read_text(encoding="utf-8")
          dispatch = (root / ".agents/skills/engineering/派工/SKILL.md").read_text(encoding="utf-8")
          guard = (root / ".agents/skills/engineering/remote-execution-guard/SKILL.md").read_text(encoding="utf-8")
          usage = (root / "docs/governance/whd_scheduler_takeover_usage.md").read_text(encoding="utf-8")
          spec = (root / "docs/specs/WHD_排程_GuardTransaction_DelegatedHelper_StaleTakeover_硬閘門規格_2026-09-25.md").read_text(encoding="utf-8")
          pitfall = (root / "個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md").read_text(encoding="utf-8")

          assert "ISSUE646_MACHINE_ALIGNMENT_V1" in continuity
          assert "assert_turn_exitable(checkpoint)" not in continuity, "stale checkpoint-only turn-exit call remains"
          assert "transaction_state=fresh_guard_transaction" in continuity
          assert "36051135751" in continuity and "36051265277" in continuity
          assert "EXECUTOR_PROVENANCE_AND_INTERACTIVE_LIVENESS_FOLLOWUP_V1" in dispatch
          assert "ISSUE646_REMOTE_GUARD_ALIGNMENT_V1" in guard
          assert "ISSUE646_SCHEDULER_ORDERING_V1" in usage
          assert "Revision: v1.2" in spec
          assert "ISSUE646_ACCEPTED_IMPLEMENTATION_OVERLAY_2026_09_25" in spec
          assert "PR #652" in spec
          assert "specific conversation/chat identity" in spec
          assert "36051135751" in pitfall and "36051265277" in pitfall
          print("ISSUE646_STATIC_WRITEBACK=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue646-t6-validation-${{ github.run_id }}
          path: /tmp/issue646-focused.log
          if-no-files-found: warn
          retention-days: 30
