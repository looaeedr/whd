name: T14 focused QA once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t14_red_trigger.txt'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib -r requirements.txt
      - name: Record remote head
        run: git rev-parse HEAD
      - name: Compile T14 production
        run: python -m py_compile fold_designer_bridge.py
      - name: T14 R11 focused
        run: xvfb-run -a python -m pytest -q tests/test_phase6_t14_box_body_child_sections.py
      - name: R10 physical-piece guard
        run: xvfb-run -a python -m pytest -q tests/test_phase6_box_body_structure.py
