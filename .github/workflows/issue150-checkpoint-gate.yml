name: Issue 150 CHECKPOINT Durable Writeback
on:
  push:
    branches: [fix/issue150-user-visible-checkpoint-gate-20260912]
    paths: [.github/workflows/issue150-checkpoint-gate.yml]
permissions:
  contents: write
jobs:
  writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Evidence and changed-file preflight
        shell: bash
        run: |
          cat > /tmp/evidence.md <<'EOF'
          寫技能
          執行開發任務
          Python測試實務
          phase6-release-packaging
          diagnosing-bugs
          tdd
          issue-closure-gate
          monitoring-remote-qa
          派工
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
          python tools/phase6_skill_preflight.py \
            --task "#150 durable writeback：記錄 durable checkpoint 若未強制 user-visible 仍會造成長流程使用者看不到 CHECKPOINT 的事故；固定 CHECKPOINT 可見層不可被 progress update 取代，且 non-terminal checkpoint 不是停工點" \
            --changed-file 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md \
            --changed-file .github/workflows/issue150-checkpoint-gate.yml \
            --evidence /tmp/evidence.md
      - name: Exact branch and production authority
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "407595d62c6586c2ab11a117db8b85193294bbd3"
          git merge-base --is-ancestor 86874c3 HEAD
          grep -F 'USER_VISIBLE_CHECKPOINT_GATE' .agents/skills/engineering/執行開發任務/SKILL.md
      - name: Install test runtime
        run: python -m pip install -q pytest
      - name: Apply pitfall writeback only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md')
          s = p.read_text(encoding='utf-8')
          marker = '## CHECKPOINT 可見層事故'
          if marker in s:
              raise SystemExit('checkpoint visibility pitfall already exists unexpectedly')
          anchor = '\n## Remote QA 邊界\n'
          section = '''\n## CHECKPOINT 可見層事故\n\nWHD 曾出現 durable checkpoint / resume contract 已存在，但只有內部流程責任、沒有 user-visible gate；結果長流程中的一般進度回報逐漸取代 CHECKPOINT，使用者長時間看不到可恢復狀態。這不是「checkpoint 不需要了」，而是可見層漏規則。\n\n永久規則：\n\n- durable checkpoint 與 user-visible CHECKPOINT 是同一狀態的兩個責任層；只做內部 durable state 不算完成 checkpoint 呈現責任。\n- system hard-cut 前與重要 execution state transition 必須刷新固定標題 `CHECKPOINT`；一般 progress update 不得冒充或取代它。\n- 可見 CHECKPOINT 仍是 non-terminal observation / recovery surface；只要 next action 可自主執行，就必須在顯示 CHECKPOINT 後繼續，不得把 CHECKPOINT 變成停工點。\n- machine guard 由 `.agents/skills/engineering/執行開發任務/SKILL.md` 的 `USER_VISIBLE_CHECKPOINT_GATE` 與 `tests/process/test_checkpoint_resume_contract.py` 共同鎖定。\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'pitfall insertion anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor, section + anchor, 1), encoding='utf-8')
          PY
          git diff --check
          changed="$(git -c core.quotepath=false diff --name-only)"
          printf 'WRITEBACK_WORKTREE=%s\n' "$changed"
          test "$changed" = "個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md"
      - name: Process regression
        shell: bash
        run: |
          python -m pytest -q \
            tests/process/test_checkpoint_resume_contract.py \
            tests/process/test_continuous_execution_durable_contract.py \
            tests/process/test_continuous_execution_state_contract.py \
            tests/process/test_fail_recovery_contract.py \
            tests/process/test_monitoring_remote_qa_turn_boundary_contract.py \
            tests/process/test_no_fake_completion_contract.py \
            tests/process/test_remote_qa_state_bridge_contract.py
      - name: Commit pitfall only after GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
          staged="$(git -c core.quotepath=false diff --cached --name-only)"
          test "$staged" = "個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md"
          git commit -m 'docs: record user-visible checkpoint pitfall'
          git push origin HEAD:fix/issue150-user-visible-checkpoint-gate-20260912
