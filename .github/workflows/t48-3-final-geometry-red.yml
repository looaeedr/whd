name: T48-3 Divider Final Geometry RED

on:
  push:
    branches:
      - work/48-receiving-fw-divider-flush-relief-gate
    paths:
      - ".github/workflows/t48-3-final-geometry-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pytest matplotlib -r requirements.txt
      - name: Compile
        run: python -m py_compile tests/test_issue48_final_geometry_sync.py
      - name: Run T48-3 REDs
        shell: bash
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue48_final_geometry_sync.py | tee t48_3_red.log
          code=${PIPESTATUS[0]}
          after="$(sha256sum config.ini | awk '{print $1}')"
          printf '{"exit":%s,"config_before":"%s","config_after":"%s"}\n' "$code" "$before" "$after" > t48_3_red_state.json
          cat t48_3_red_state.json
          test "$before" = "$after" || exit 97
          exit "$code"
      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t48-3-red-${{ github.run_id }}
          path: |
            t48_3_red.log
            t48_3_red_state.json
