name: Issue 312 T8 Durable CI Rule Writeback

on:
  push:
    branches:
      - ci-sharding/issue312-t8-final-qualification-20260917
    paths:
      - '.github/workflows/qa-issue312-t8-durable-writeback.yml'

permissions:
  contents: write

jobs:
  durable-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append durable rules only to non-overlapping canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          updates = {
              Path('.agents/skills/engineering/Python測試實務/SKILL.md'): '''

## CI sharding / final qualification durable rules

`DETERMINISTIC_SHARD_OWNERSHIP`：pytest 全量 collection 只能由一份 authoritative live manifest 分配；`missing / extra / duplicate` 任一非空即 FAIL。禁止各 job 自己重算 ownership，禁止用 Python built-in `hash()` 或 collection-index modulo 當跨 run authority。

`CI_CONCURRENCY_BUDGET`：限制同時 runner 數，不等於 logical shard ownership 數。logical shards 可以多於 max-parallel；不得為了 runner budget 偷減 collection 或改 ownership contract。

`DURATION_REBALANCE`：duration-based rebalance 必須是 deliberate、versioned、可回溯的設定變更；HRW/Rendezvous ownership 在沒有新 evidence 前保持 authoritative，不因一次 timing 波動就改演算法。

`UNIFIED_SUMMARY`：人類可讀的一頁 summary 必須由完整 machine artifacts 支撐，至少保留 collection reconciliation、failure/skip identity、protected invariants、queue / execution / end-to-end timing；summary 不能取代 artifacts。

`TESTED_SHA and ORCHESTRATION_SHA` 是 final qualification 的兩個獨立 identity。新增 workflow/evidence 的 orchestration commit 不得冒充受測程式碼 SHA；full acceptance 必須明確 checkout 並記錄真正的 TESTED_SHA。
''',
              Path('.agents/skills/engineering/long-log-context-safe-execution/SKILL.md'): '''

## CI classifier / retry semantics bridge

`CLASSIFICATION_NOT_RUN != HANG/TIMEOUT`：classifier 尚未執行、沒有 terminal classifier record，不能推論成 hang 或 timeout。先確認 child process / job / step terminal state，再依 exact log evidence 分類。

`FLAKY_WARNING`：首次 unexpected RED、同一 exact scope retry GREEN，仍必須保留 `[FLAKY-WARNING]` 與 first-run evidence；retry GREEN 不得抹除第一次異常，也不得自動升格成 deterministic PASS 證據。
''',
              Path('個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'): '''

### CI_SHARDING_PITFALL_BRIDGE_V1
- shard ownership 必須來自一次 authoritative live manifest；missing / extra / duplicate 一律 fail closed。
- `CLASSIFICATION_NOT_RUN` 不等於 hang/timeout；第一次 RED 後 retry GREEN 仍記 `[FLAKY-WARNING]`。
- final qualification 必須區分 TESTED_SHA 與 ORCHESTRATION_SHA，避免把只新增 CI/evidence 的 commit 誤報成受測版本。
''',
              Path('個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'): '''

### CI_SHARDING_SKILL_OWNERSHIP_V1
CI sharding 的 pytest isolation / deterministic ownership / concurrency budget / timing / tested-vs-orchestration identity 規則由 `Python測試實務` 擁有；remote polling/no-RUN recovery 仍由 `monitoring-remote-qa` + `executable-continuity-controller` 擁有；長 log classifier 語意由 `long-log-context-safe-execution` 擁有。不得再建立第二套 competing Skill authority。
''',
              Path('個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md'): '''

## CI classification addendum
`CLASSIFICATION_NOT_RUN != HANG/TIMEOUT`：看到 step 長時間不換畫面，只能說 classifier 尚未完成或尚無新 observation；必須讀 terminal state / bounded log evidence 後才能判 hang/timeout。

`FLAKY_WARNING`：unexpected RED 若同 scope retry GREEN，保留首次 RED 的 node/reason/log evidence並標記 `[FLAKY-WARNING]`，不得用 retry GREEN 覆蓋第一次異常。
''',
          }

          for path, block in updates.items():
              text = path.read_text(encoding='utf-8')
              marker = block.strip().splitlines()[0].strip('# ').strip('`')
              if marker and marker in text:
                  continue
              path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

          git diff --check
          git status --short
          git diff --name-only > /tmp/changed.txt
          expected=$(cat <<'EOF'
          .agents/skills/engineering/Python測試實務/SKILL.md
          .agents/skills/engineering/long-log-context-safe-execution/SKILL.md
          個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md
          EOF
          )
          diff -u <(printf '%s\n' "$expected" | sort) <(sort /tmp/changed.txt)

      - name: Commit and push durable writeback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '.agents/skills/engineering/Python測試實務/SKILL.md' \
            '.agents/skills/engineering/long-log-context-safe-execution/SKILL.md' \
            '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' \
            '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' \
            '個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md'
          git commit -m '#312 T8 persist CI operating rules and ownership [skip ci]'
          git push origin HEAD:ci-sharding/issue312-t8-final-qualification-20260917
