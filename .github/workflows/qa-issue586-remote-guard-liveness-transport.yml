name: WHD｜#586｜Remote Guard runtime liveness transport 驗收
run-name: "WHD｜#586｜Remote Guard heartbeat transport｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue586-runtime-liveness-main-20260924
    paths:
      - ".github/workflows/whd-remote-execution-guard.yml"
      - "tests/process/test_issue586_remote_guard_liveness_transport.py"
      - ".github/workflows/qa-issue586-remote-guard-liveness-transport.yml"

permissions:
  contents: read

jobs:
  focused:
    name: "#586 trusted transport focused pytest"
    runs-on: ubuntu-latest
    steps:
      - name: "取出 #586 main backport branch"
        uses: actions/checkout@v4
      - name: "設定 Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "安裝 pytest"
        run: python -m pip install pytest
      - name: "驗證 Remote Guard runtime liveness transport"
        run: python -m pytest -q tests/process/test_issue586_remote_guard_liveness_transport.py
