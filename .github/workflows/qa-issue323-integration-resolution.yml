name: Issue 323 Integration Resolution Acceptance

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combined-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/issue323-t8-history-resolution-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore T8 durable rule ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          updates = {
            Path('.agents/skills/engineering/Python測試實務/SKILL.md'): '''\n\n## CI sharding / final qualification durable rules\n\n`DETERMINISTIC_SHARD_OWNERSHIP`：pytest 全量 collection 只能由一份 authoritative live manifest 分配；`missing / extra / duplicate` 任一非空即 FAIL。禁止各 job 自己重算 ownership，禁止用 Python built-in `hash()` 或 collection-index modulo 當跨 run authority。\n\n`CI_CONCURRENCY_BUDGET`：限制同時 runner 數，不等於 logical shard ownership 數。logical shards 可以多於 max-parallel；不得為了 runner budget 偷減 collection 或改 ownership contract。\n\n`DURATION_REBALANCE`：duration-based rebalance 必須是 deliberate、versioned、可回溯的設定變更；HRW/Rendezvous ownership 在沒有新 evidence 前保持 authoritative，不因一次 timing 波動就改演算法。\n\n`UNIFIED_SUMMARY`：人類可讀的一頁 summary 必須由完整 machine artifacts 支撐，至少保留 collection reconciliation、failure/skip identity、protected invariants、queue / execution / end-to-end timing；summary 不能取代 artifacts。\n\n`TESTED_SHA and ORCHESTRATION_SHA` 是 final qualification 的兩個獨立 identity。新增 workflow/evidence 的 orchestration commit 不得冒充受測程式碼 SHA；full acceptance 必須明確 checkout 並記錄真正的 TESTED_SHA。\n''',
            Path('.agents/skills/engineering/long-log-context-safe-execution/SKILL.md'): '''\n\n## CI classifier / retry semantics bridge\n\n`CLASSIFICATION_NOT_RUN != HANG/TIMEOUT`：classifier 尚未執行、沒有 terminal classifier record，不能推論成 hang 或 timeout。先確認 child process / job / step terminal state，再依 exact log evidence 分類。\n\n`FLAKY_WARNING`：首次 unexpected RED、同一 exact scope retry GREEN，仍必須保留 `[FLAKY-WARNING]` 與 first-run evidence；retry GREEN 不得抹除第一次異常，也不得自動升格成 deterministic PASS 證據。\n''',
            Path('個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'): '''\n\n### CI_SHARDING_PITFALL_BRIDGE_V1\n- shard ownership 必須來自一次 authoritative live manifest；missing / extra / duplicate 一律 fail closed。\n- `CLASSIFICATION_NOT_RUN` 不等於 hang/timeout；第一次 RED 後 retry GREEN 仍記 `[FLAKY-WARNING]`。\n- final qualification 必須區分 TESTED_SHA 與 ORCHESTRATION_SHA，避免把只新增 CI/evidence 的 commit 誤報成受測版本。\n''',
            Path('個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md'): '''\n\n### CI_SHARDING_SKILL_OWNERSHIP_V1\nCI sharding 的 pytest isolation / deterministic ownership / concurrency budget / timing / tested-vs-orchestration identity 規則由 `Python測試實務` 擁有；remote polling/no-RUN recovery 仍由 `monitoring-remote-qa` + `executable-continuity-controller` 擁有；長 log classifier 語意由 `long-log-context-safe-execution` 擁有。不得再建立第二套 competing Skill authority。\n''',
            Path('個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md'): '''\n\n## CI classification addendum\n`CLASSIFICATION_NOT_RUN != HANG/TIMEOUT`：看到 step 長時間不換畫面，只能說 classifier 尚未完成或尚無新 observation；必須讀 terminal state / bounded log evidence 後才能判 hang/timeout。\n\n`FLAKY_WARNING`：unexpected RED 若同 scope retry GREEN，保留首次 RED 的 node/reason/log evidence並標記 `[FLAKY-WARNING]`，不得用 retry GREEN 覆蓋第一次異常。\n''',
          }
          for path, block in updates.items():
            text = path.read_text(encoding='utf-8')
            marker = block.strip().splitlines()[0].strip('# ').strip('`')
            if marker and marker in text:
              continue
            path.write_text(text.rstrip() + block.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-xdist matplotlib ezdxf
      - name: Record protected invariant
        run: sha256sum config.ini > /tmp/config.before
      - name: Run CI optimization contracts
        run: python -m pytest -q tests/test_issue305_shard_manifest.py tests/test_issue306_aggregate_cli_import.py tests/test_issue306_non_gui_sharding.py tests/test_issue307_junit_location_fallback.py tests/test_issue307_t0_xvfb_contract_authority.py tests/test_issue307_xvfb_sharding.py tests/test_issue308_t4_aggregation.py tests/test_issue309_t5_xdist_state_isolation.py tests/test_issue310_t6_duration_tuning.py tests/test_issue311_t7_ab_acceptance.py tests/test_issue312_t8_final_qualification.py
      - name: Run current production governance/process contracts
        run: python -m pytest -q tests/process
      - name: Verify protected invariant
        run: |
          sha256sum -c /tmp/config.before
          echo 'ISSUE323_PROTECTED_DRIFT=0'
      - name: Commit durable writeback if needed
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git status --porcelain -- '.agents/skills/engineering/Python測試實務/SKILL.md' '.agents/skills/engineering/long-log-context-safe-execution/SKILL.md' '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' '個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md')"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '.agents/skills/engineering/Python測試實務/SKILL.md' '.agents/skills/engineering/long-log-context-safe-execution/SKILL.md' '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md' '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' '個人AI檔案庫/踩坑庫/long_log_context_safe_execution.md'
            git commit -m '#323 restore T8 durable CI rule ownership [skip ci]'
            git push origin HEAD:integration/issue323-t8-history-resolution-20260917
          fi
