name: Issue 153 CHECKPOINT Entry Bridges
on:
  push:
    branches: [fix/issue153-checkpoint-entry-bridges-r2-20260912]
    paths:
      - .github/workflows/issue153-checkpoint-entry-bridges.yml
permissions:
  contents: read
jobs:
  final-process-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact production target and durable markers
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync
          test "$(git rev-parse origin/cleanup/2d-3d-sync)" = "d05a94ae86777eda64ee81304c5b152ad34fa549"
          for f in \
            .agents/skills/engineering/派工/SKILL.md \
            .agents/skills/engineering/monitoring-remote-qa/SKILL.md \
            .agents/skills/engineering/issue-closure-gate/SKILL.md; do
            grep -F 'USER_VISIBLE_CHECKPOINT_GATE_BRIDGE' "$f"
            grep -F '唯一 canonical authority' "$f"
            grep -F '不得建立第二套 CHECKPOINT authority' "$f"
          done
          grep -F '所有可獨立進入長流程的入口目前至少包含' 個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Final process regression
        run: |
          python -m pytest -q \
            tests/process/test_checkpoint_resume_contract.py \
            tests/process/test_continuous_execution_durable_contract.py \
            tests/process/test_continuous_execution_state_contract.py \
            tests/process/test_fail_recovery_contract.py \
            tests/process/test_monitoring_remote_qa_turn_boundary_contract.py \
            tests/process/test_no_fake_completion_contract.py \
            tests/process/test_remote_qa_state_bridge_contract.py \
            tests/test_chinese_skill_identity_contract.py
      - name: Diff hygiene
        shell: bash
        run: |
          git diff --check d05a94ae86777eda64ee81304c5b152ad34fa549...HEAD
          git -c core.quotepath=false diff --name-only d05a94ae86777eda64ee81304c5b152ad34fa549...HEAD
