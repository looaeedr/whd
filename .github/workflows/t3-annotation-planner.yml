name: T3 Annotation Planner QA

on:
  push:
    branches:
      - feat/engineering-drawing-dxf-qa
    paths:
      - tests/test_drawing_annotations.py
      - ae_engine/drawing_annotations.py
      - ae_engine/sheetmetal_drawing.py
      - .scratch/engineering-drawing-dxf-qa/T3.preflight.evidence.md
      - .github/workflows/t3-annotation-planner.yml
  workflow_dispatch:

jobs:
  t3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "T3 Canonical Annotation Planner" \
            --changed-file tests/test_drawing_annotations.py \
            --changed-file ae_engine/drawing_annotations.py \
            --evidence .scratch/engineering-drawing-dxf-qa/T3.preflight.evidence.md
      - name: Targeted T3
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          python -m py_compile ae_engine/sheetmetal_drawing.py
          pytest -q tests/test_drawing_annotations.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- config.ini
