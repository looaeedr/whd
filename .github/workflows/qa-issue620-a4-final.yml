name: WHD｜#620 A4｜Manufacturing Facade 最終驗收
run-name: WHD｜#620 A4｜精確版本遠端驗收｜${{ github.sha }}

on:
  push:
    branches:
      - work/issue627-phase7-large-module-decomposition-20260924
    paths:
      - .github/workflows/qa-issue620-a4-final.yml

permissions:
  contents: read

concurrency:
  group: issue620-a4-final
  cancel-in-progress: false

jobs:
  acceptance:
    name: A4｜Facade、Manufacturing、DXF reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTED_SHA: 883c40401e37f4303cb01172ce78fc865e026310
    steps:
      - name: 反讀固定 TESTED_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝驗收相依套件
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: 鎖定 TESTED_SHA、ORCHESTRATION_SHA 與受保護輸入
        shell: bash
        run: |
          set -euo pipefail
          echo "ORCHESTRATION_SHA=${{ github.sha }}"
          echo "TESTED_SHA=${TESTED_SHA}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          sha256sum config.ini > /tmp/issue620-config-before.sha256
          find 基準檔 -type f -iname '*.dxf' -print0 | sort -z | xargs -0 -r sha256sum > /tmp/issue620-dxf-before.sha256
          test -s /tmp/issue620-dxf-before.sha256

      - name: 執行 P7-R-D 結構與 anti-regrowth 驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue620-structural.xml \
            tests/test_issue620_phase7_a4_manufacturing_facade.py \
            tests/test_ae_engine_package.py \
            tests/test_manufacturing_collision_dependency.py \
            tests/test_clean_break_layout.py \
            tests/process/test_issue533_c1_anti_regrowth.py

      - name: 執行 Manufacturing API／policy／collision 驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue620-manufacturing.xml \
            tests/test_manufacturing_api.py \
            tests/test_manufacturing_api_finished_face_contract.py \
            tests/test_manufacturing_policy_boundary.py \
            tests/test_endcap_resolved_geometry_ownership.py \
            tests/test_assembly_collision.py \
            tests/test_assembly_collision_integration.py \
            tests/test_box_body_single_source_t1.py \
            tests/test_box_body_single_source_t4.py \
            tests/test_certified_relief_registry.py

      - name: 執行 DXF export／reopen 驗收
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q --junitxml=issue620-dxf.xml \
            tests/test_resolved_manufacturing_export.py \
            tests/test_engineering_drawing_integration.py \
            tests/test_dxf_acceptance.py \
            tests/test_multipart_dxf_acceptance.py \
            tests/test_receiving_door_dxf_roundtrip.py \
            tests/test_issue41_persistence_parity.py

      - name: 驗證受保護輸入未被修改
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/issue620-config-after.sha256
          find 基準檔 -type f -iname '*.dxf' -print0 | sort -z | xargs -0 -r sha256sum > /tmp/issue620-dxf-after.sha256
          diff -u /tmp/issue620-config-before.sha256 /tmp/issue620-config-after.sha256
          diff -u /tmp/issue620-dxf-before.sha256 /tmp/issue620-dxf-after.sha256
          echo "ISSUE620_PROTECTED_INPUTS_GREEN=1"

      - name: 上傳 #620 A4 驗收證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue620-a4-final-${{ github.sha }}
          path: |
            issue620-structural.xml
            issue620-manufacturing.xml
            issue620-dxf.xml
          if-no-files-found: warn
          retention-days: 14
