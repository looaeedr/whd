          assert 'ISSUE187_OUTPUT_MIGRATION_PITFALL' in pitfall
          assert '搬操作面，不搬 authority' in pitfall
          assert 'fresh process' in pitfall
          print('ISSUE187_DURABLE_WRITEBACK=GREEN')
          PY
