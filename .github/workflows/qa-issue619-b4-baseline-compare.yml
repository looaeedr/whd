name: "WHD｜#619 B4｜回歸首壞點二分"
run-name: "WHD｜#619 B4｜Export／W-D 回歸首壞點二分"

on:
  push:
    branches:
      - work/issue628-receiving-rear-panel-overlay-live-switch-20260924
    paths:
      - '.github/workflows/qa-issue619-b4-baseline-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage_bisect:
    name: "B4 lineage｜${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "RED-1f88f33e"
            sha: "1f88f33ea21a8dfd532b8ccce747e1779150df0a"
          - label: "render-off-e308170a"
            sha: "e308170aa4c2fa5878eb56f250cb4919d53e0186"
          - label: "batch-372bf25f"
            sha: "372bf25f74e7006c9701f472d77596d39a9bce45"
          - label: "stack-392fcb6a"
            sha: "392fcb6a4ca2d8b8d6098a7715b1f13d40bdfa9b"
          - label: "rootfix-7a52d091"
            sha: "7a52d091a03e6c88f26e05d432daf1ce94ac0efa"
    steps:
      - name: "Checkout B4 lineage exact SHA"
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: "安裝 Xvfb 與 Python 相依套件"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -q pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: "執行 Export 與 W-D 兩項回歸"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/issue619-bisect/${{ matrix.label }}"
          before="$(sha256sum config.ini | awk '{print $1}')"
          set +e
          xvfb-run -a python -m pytest -q \
            tests/test_issue517_receiving_live_switch_ui_export_marking.py::test_actual_gui_batch_export_matches_canonical_resolved_physical_inventory \
            tests/test_phase6_t25_combined_receiving_acceptance.py::test_combined_receiving_operator_path_from_live_family_switch \
            --tb=short \
            --json-report --json-report-file="/tmp/issue619-bisect/${{ matrix.label }}/report.json"
          status=$?
          set -e
          after="$(sha256sum config.ini | awk '{print $1}')"
          printf 'label=%s\nsha=%s\npytest_exit=%s\nconfig_before=%s\nconfig_after=%s\n' \
            "${{ matrix.label }}" "${{ matrix.sha }}" "$status" "$before" "$after" \
            > "/tmp/issue619-bisect/${{ matrix.label }}/summary.txt"
          git diff -- config.ini > "/tmp/issue619-bisect/${{ matrix.label }}/config.diff" || true
          exit "$status"

      - name: "上傳 lineage 二分證據"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue619-bisect-${{ matrix.label }}
          path: /tmp/issue619-bisect/${{ matrix.label }}/
          if-no-files-found: error
