name: "#346 T1 inherited-Xvfb classifier"

on:
  push:
    branches:
      - refactor/issue346-manufacturing-characterization-20260918
    paths:
      - '.github/workflows/qa-issue346-t1-inherited-xvfb.yml'
      - 'docs/superpowers/checkpoints/issue346-t1-inherited-xvfb-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predecessor-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75e4f81f365c74ec0e255e847f3db5551c85f6da
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf
      - name: Run predecessor assembly-view Xvfb contract
        run: |
          xvfb-run -a python -m pytest -q tests/test_phase6_assembly_3d_view.py
