name: WHD｜#531｜B6 Facade 69/69 聚合驗收
run-name: "WHD｜#531｜B6 Facade 69/69 聚合驗收｜${{ github.sha }}"

on:
  push:
    branches:
      - work/issue520-phase6-bridge-residual-reduction-20260923
    paths:
      - .github/workflows/qa-issue531-b6-controller-aggregate.yml

permissions:
  contents: read

jobs:
  aggregate:
    name: 驗證 B6 六批分類完整性與架構硬閘門
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 取出精確工單分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝聚焦依賴
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib ezdxf

      - name: B6 69/69 聚合分類硬閘門
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue531-b6-aggregate.log
          import ast
          import json
          from pathlib import Path

          a0 = json.loads(Path("docs/superpowers/checkpoints/issue521-a0-residual-ownership-census.json").read_text(encoding="utf-8"))
          a0_inventory = tuple(
              row.get("key") or row.get("name") or row.get("facade_key")
              for row in a0["facade"]["inventory"]
          )
          assert len(a0_inventory) == 69
          assert len(set(a0_inventory)) == 69
          assert a0["source"]["facade_binding_count"] == 69

          aggregate = {}
          accounted_total = 0
          unclassified_total = 0
          dynamic_total = 0
          expected_before = 69
          batch_rows = []

          for issue in range(541, 547):
              batch = issue - 540
              path = Path(f"docs/superpowers/checkpoints/issue{issue}-b6-{batch}-final-classification.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              if "classification" in data:
                  classification = dict(data["classification"])
              else:
                  classification = {
                      row["key"]: row["classification"]
                      for row in data["final_classifications"]
                  }

              accounted = data.get("accounted", data.get("architecture", {}).get("accounted", len(classification)))
              unclassified = data.get("unclassified", data.get("architecture", {}).get("unclassified", 0))
              dynamic = data.get("dynamic_ref_unreviewed", data.get("architecture", {}).get("dynamic_ref_unreviewed", 0))
              before = data.get("facade_count_before", data.get("architecture", {}).get("facade_count_before"))
              after = data.get("facade_count_after", data.get("architecture", {}).get("facade_count_after"))

              assert accounted == len(classification), (issue, accounted, len(classification))
              assert unclassified == 0, (issue, unclassified)
              assert dynamic == 0, (issue, dynamic)
              assert before == expected_before, (issue, before, expected_before)
              assert after <= before, (issue, before, after)

              overlap = set(aggregate) & set(classification)
              assert not overlap, (issue, sorted(overlap))
              aggregate.update(classification)
              accounted_total += accounted
              unclassified_total += unclassified
              dynamic_total += dynamic
              batch_rows.append((issue, accounted, before, after))
              expected_before = after

          assert accounted_total == 69, accounted_total
          assert unclassified_total == 0
          assert dynamic_total == 0
          assert set(aggregate) == set(a0_inventory), (
              sorted(set(a0_inventory) - set(aggregate)),
              sorted(set(aggregate) - set(a0_inventory)),
          )
          assert expected_before == 45, expected_before

          bridge = Path("fold_designer_bridge.py")
          tree = ast.parse(bridge.read_text(encoding="utf-8"), filename=str(bridge))
          call = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and (
                  (isinstance(node.func, ast.Name) and node.func.id == "install_fold_designer_bridge_facade")
                  or (isinstance(node.func, ast.Attribute) and node.func.attr == "install_fold_designer_bridge_facade")
              )
          )
          mapping = next(arg for arg in call.args if isinstance(arg, ast.Dict))
          live_keys = tuple(
              key.value
              for key in mapping.keys
              if isinstance(key, ast.Constant) and isinstance(key.value, str)
          )
          assert len(live_keys) == 45, len(live_keys)
          assert set(live_keys) <= set(a0_inventory)
          removed = set(a0_inventory) - set(live_keys)
          for key in removed:
              assert aggregate[key] in {"NO_CALLER", "SUPERSEDED", "CAN_DIRECT_OWNER"}, (key, aggregate[key])

          allowed = {
              "PUBLIC_REQUIRED",
              "LEGACY_REQUIRED",
              "PROPERTY_COMPAT",
              "CAN_DIRECT_OWNER",
              "NO_CALLER",
              "SUPERSEDED",
          }
          assert set(aggregate.values()) <= allowed

          print("B6_BATCH_ROWS="+repr(batch_rows))
          print("FACADE_ACCOUNTED=69")
          print("UNCLASSIFIED_FACADE=0")
          print("DYNAMIC_REF_UNREVIEWED=0")
          print("FACADE_COUNT_BASELINE=69")
          print("FACADE_COUNT_FINAL=45")
          print("FACADE_REMOVED="+str(len(removed)))
          print("B6_AGGREGATE_KEYSET_EXACT=1")
          print("ISSUE531_B6_AGGREGATE=GREEN")
          PY

      - name: Focused facade / ownership regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue524_a3_facade_ratchet.py \
            tests/test_issue541_b6_1_facade_batch.py \
            tests/test_issue542_b6_2_facade_batch.py \
            tests/test_issue543_b6_3_facade_batch.py \
            tests/test_issue544_b6_4_facade_batch.py \
            tests/test_issue545_b6_5_facade_batch.py \
            tests/test_issue546_b6_6_facade_batch.py \
            tests/test_phase6_bridge_domain_ownership.py \
            tests/test_issue396_phase4_composition_root.py \
            tests/test_issue479_final_scene_composition_owner.py \
            | tee /tmp/issue531-b6-focused.log

      - name: Reverse-import 與單一 composition root 摘要
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/issue531-b6-architecture.log
          from pathlib import Path

          second_root = Path("gui_modules/application/fold_designer_composition.py")
          assert not second_root.exists()
          adapter = Path("gui_modules/application/fold_designer_adapter.py").read_text(encoding="utf-8")
          assert adapter.count("class Phase6FoldDesignerComposition") == 1

          protected_owners = [
              "phase6_settings_contracts.py",
              "phase6_settings_transitions.py",
              "phase6_settings_service.py",
              "phase6_settings_transaction_controller.py",
              "phase6_final_scene_contracts.py",
              "phase6_final_scene_projection.py",
              "phase6_final_scene_renderer.py",
              "phase6_final_scene_view.py",
              "gui_modules/application/fold_designer_adapter.py",
          ]
          reverse = []
          for name in protected_owners:
              source = Path(name).read_text(encoding="utf-8")
              if "from fold_designer_bridge import" in source or "import fold_designer_bridge" in source:
                  reverse.append(name)
          assert reverse == [], reverse
          print("REVERSE_BRIDGE_IMPORTS=0")
          print("SECOND_COMPOSITION_ROOT=0")
          print("FACADE_NON_GROWTH=1")
          print("ISSUE531_B6_ARCHITECTURE=GREEN")
          PY

      - name: 上傳 #531 聚合驗收證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue531-b6-controller-aggregate
          path: |
            /tmp/issue531-b6-aggregate.log
            /tmp/issue531-b6-focused.log
            /tmp/issue531-b6-architecture.log
          if-no-files-found: warn
          retention-days: 14
