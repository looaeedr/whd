name: T5 Persistence Parity QA

on:
  push:
    branches:
      - qa/41-persistence-parity
    paths:
      - 'tests/test_issue41_persistence_parity.py'
      - '.scratch/issue41_preflight_evidence.txt'
      - '.github/workflows/qa_issue41_persistence_parity.yml'

jobs:
  t5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib numpy
      - name: Knowledge preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "regression QA save reload 2D 3D DXF parity placement collision shared datum" \
            --changed-file tests/test_issue41_persistence_parity.py \
            --evidence .scratch/issue41_preflight_evidence.txt
      - name: Headless lifecycle and parity guards
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          pytest -q -vv -s \
            tests/test_issue41_persistence_parity.py \
            tests/test_issue40_divider_6p4_shared_datum.py \
            tests/test_issue39_divider_relief.py \
            tests/test_issue38_receiving_divider_baseline.py \
            tests/test_issue37_vault_baseplate_placement.py \
            tests/test_phase6_t20_receiving_baseplate_placement.py \
            tests/test_resolved_manufacturing_export.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "headless_config_before=$before"
          echo "headless_config_after=$after"
          test "$before" = "$after"
      - name: Xvfb Vault Receiving Vault GUI lifecycle
        run: |
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a pytest -q -vv \
            tests/test_phase6_t11_family_preset_switching.py \
            tests/test_phase6_t20_receiving_baseplate_placement.py
          after="$(sha256sum config.ini | awk '{print $1}')"
          echo "xvfb_config_before=$before"
          echo "xvfb_config_after=$after"
          test "$before" = "$after"
