name: WHD｜#661｜#657 final release + #647 handoff
run-name: "WHD｜#661｜dual final-release guard｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue661-final-release-executor-20260925

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: "#657 CLOSED+RELEASED / #647 helper TERMINAL"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh-read exact child + parent durable state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin coord/dispatch-claims
          COORD_SHA="$(git rev-parse FETCH_HEAD)"

          for ISSUE in 657 647; do
            CLAIM_PATH=".dispatch/claims/issue-${ISSUE}.json"
            CP_PATH=".dispatch/checkpoints/issue-${ISSUE}.json"
            git show "${COORD_SHA}:${CLAIM_PATH}" > "/tmp/claim${ISSUE}.json"
            git show "${COORD_SHA}:${CP_PATH}" > "/tmp/checkpoint${ISSUE}.json"
            git rev-parse "${COORD_SHA}:${CLAIM_PATH}" > "/tmp/claim${ISSUE}.blob"
            git rev-parse "${COORD_SHA}:${CP_PATH}" > "/tmp/checkpoint${ISSUE}.blob"
          done

          gh api "/repos/${REPO}/issues/657" > /tmp/issue657.json

          python - <<'PY'
          import json
          c657=json.load(open('/tmp/claim657.json',encoding='utf-8'))
          p657=json.load(open('/tmp/checkpoint657.json',encoding='utf-8'))
          c647=json.load(open('/tmp/claim647.json',encoding='utf-8'))
          p647=json.load(open('/tmp/checkpoint647.json',encoding='utf-8'))
          issue=json.load(open('/tmp/issue657.json',encoding='utf-8'))

          assert open('/tmp/claim657.blob').read().strip() == '6f3b2fa6702d80e7831363b7b3694a1c67714344'
          assert open('/tmp/checkpoint657.blob').read().strip() == '92bb63cf3bb39ff74fcd73a8a0d1e44071b42b4f'
          assert open('/tmp/claim647.blob').read().strip() == 'a95306b8eaa2626009085dc284588860755ea711'
          assert open('/tmp/checkpoint647.blob').read().strip() == 'c8b9d2096ed1a9b0784cdc29122da36d7da675fa'

          assert issue['state']=='closed' and issue.get('state_reason')=='completed'
          assert c657['worker']=='chatgpt.sol260925.issue657.force2'
          assert c657['phase']=='CLOSING'
          assert c657['head_sha']=='53184c28ed1041558cd735817f4aae54f6c3af74'
          assert p657['state']=='TERMINAL_SUCCESS'
          assert p657['closure_state']=='RELEASE_HANDOFF_PENDING'
          assert p657['head_sha']==c657['head_sha']

          assert c647['worker']=='chatgpt.sol260925.issue647.force1'
          assert c647['phase']=='RECOVERING'
          assert c647['head_sha']=='3967da33e35e26ba3973e5565af0defe65fa7e12'
          assert p647['head_sha']==c647['head_sha']
          matches=[x for x in c647.get('delegated_work',[]) if x.get('helper_key')=='default-branch-remote-guard-deploy']
          assert len(matches)==1
          item=matches[0]
          assert item['state']=='ACTIVE'
          assert item['child_issue']==657
          assert item['reserved_by']=='chatgpt.sol260925.issue647.force1'
          assert item['reservation_token']=='issue647-main-remote-guard-deploy-force1'
          PY

      - name: Canonical child final-release guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim /tmp/claim657.json \
            --issue 657 \
            --worker chatgpt.sol260925.issue657.force2 \
            --branch integration/issue657-main-remote-guard-20260925 \
            --action write \
            --base-sha bdb3da203c898d43898b092ff37b7fa9e0c93061 \
            --head-sha 53184c28ed1041558cd735817f4aae54f6c3af74 \
            --checkpoint /tmp/checkpoint657.json \
            --changed-file .dispatch/claims/issue-657.json \
            --changed-file .dispatch/checkpoints/issue-657.json

      - name: Canonical parent handoff guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/execution_claim_guard.py \
            --claim /tmp/claim647.json \
            --issue 647 \
            --worker chatgpt.sol260925.issue647.force1 \
            --branch workorder/issue640-guard-turn-exit-helper-hardening-20260925 \
            --action write \
            --base-sha 8909143569bf1e23d3fd6ef563e57c3a20992638 \
            --head-sha 3967da33e35e26ba3973e5565af0defe65fa7e12 \
            --checkpoint /tmp/checkpoint647.json \
            --changed-file .dispatch/claims/issue-647.json \
            --changed-file .dispatch/checkpoints/issue-647.json

      - name: Emit exact dual guard manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          PROOF_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          manifest={
            'schema':'WHD_ISSUE657_FINAL_RELEASE_PARENT_HANDOFF_GUARD_V1',
            'child_issue':657,
            'child_worker':'chatgpt.sol260925.issue657.force2',
            'child_claim_blob_sha':open('/tmp/claim657.blob').read().strip(),
            'child_checkpoint_blob_sha':open('/tmp/checkpoint657.blob').read().strip(),
            'child_from_closure_state':'RELEASE_HANDOFF_PENDING',
            'child_to_closure_state':'CLOSED',
            'child_to_claim_phase':'RELEASED',
            'parent_issue':647,
            'parent_worker':'chatgpt.sol260925.issue647.force1',
            'parent_claim_blob_sha':open('/tmp/claim647.blob').read().strip(),
            'parent_checkpoint_blob_sha':open('/tmp/checkpoint647.blob').read().strip(),
            'parent_helper_key':'default-branch-remote-guard-deploy',
            'parent_helper_from_state':'ACTIVE',
            'parent_helper_to_state':'TERMINAL',
            'child_guard_result':'EXECUTION_CLAIM_GUARD_GREEN',
            'parent_guard_result':'EXECUTION_CLAIM_GUARD_GREEN',
            'run_id':int(os.environ['RUN_ID']),
            'proof_head_sha':os.environ['PROOF_HEAD'],
          }
          json.dump(manifest,open('/tmp/dual-guard-manifest.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          print('WHD_ISSUE657_FINAL_RELEASE_PARENT_HANDOFF_GUARD_GREEN')
          print(json.dumps(manifest,sort_keys=True))
          PY

      - name: Post machine manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo 'WHD_ISSUE657_FINAL_RELEASE_PARENT_HANDOFF_GUARD_RESULT_V1'
            echo '~~~json'
            cat /tmp/dual-guard-manifest.json
            echo '~~~'
          } > /tmp/result.md
          gh issue comment 661 --repo "${REPO}" --body-file /tmp/result.md

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: issue661-final-release-handoff-${{ github.run_id }}
          path: |
            /tmp/claim657.json
            /tmp/checkpoint657.json
            /tmp/claim647.json
            /tmp/checkpoint647.json
            /tmp/issue657.json
            /tmp/dual-guard-manifest.json
          if-no-files-found: error
          retention-days: 30
