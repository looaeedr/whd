name: Issue164 durable RED
on:
  push:
    branches:
      - qa/issue164-combined-acceptance-20260913
    paths:
      - .github/workflows/issue164-red-20260913.yml
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Durable writeback contract must be RED before Skill/AI edits
        run: pytest -q tests/test_issue164_durable_contract.py
