name: "QA #371 T7 lifecycle facade GREEN"

on:
  push:
    branches:
      - refactor/issue371-phase3-lifecycle-facade-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'gui.py'
      - 'gui_modules/application/command_router.py'
      - 'gui_modules/application/fold_designer_adapter.py'
      - 'gui_modules/application/lifecycle.py'
      - 'tests/test_issue371_t7_lifecycle_facade_owner.py'
      - 'tests/test_issue371_t7_update_runtime_behavior.py'
      - 'tests/test_issue358_remove_manufacturing_callbacks.py'
      - 'tests/test_issue361_one_line_manufacturing_facade.py'
      - '.github/workflows/qa-issue371-t7-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t7-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 81dbd6f140b6bac8c9ba44f947919d341997ba56 HEAD
          echo "T7_BASELINE=81dbd6f140b6bac8c9ba44f947919d341997ba56"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib numpy shapely -r requirements.txt

      - name: Compile T7 owners
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            fold_designer_bridge.py \
            gui.py \
            gui_modules/application/command_router.py \
            gui_modules/application/fold_designer_adapter.py \
            gui_modules/application/lifecycle.py

      - name: Run T7 ownership and ordering contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue371_t7_lifecycle_facade_owner.py \
            tests/test_issue371_t7_update_runtime_behavior.py \
            tests/test_phase6_bridge_domain_ownership.py \
            tests/test_phase6_update_executor_conformance.py \
            tests/test_issue289_gui_phase2_t1_lifecycle.py

      - name: Run transaction and Phase 2 manufacturing purity gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue366_t2_settings_transaction_owner.py \
            tests/test_issue355_manufacturing_dto_contracts.py \
            tests/test_issue356_manufacturing_adapter.py \
            tests/test_issue357_manufacturing_result_contracts.py \
            tests/test_issue358_remove_manufacturing_callbacks.py \
            tests/test_issue359_manufacturing_cache_service.py \
            tests/test_issue360_pure_manufacturing_service.py \
            tests/test_issue361_one_line_manufacturing_facade.py

      - name: Run real-Tk bridge lifecycle and 3D regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_original_fold_designer_bridge.py \
            tests/test_gui_fold_designer_transaction_contract.py \
            tests/test_phase6_3d_view_regressions.py \
            tests/test_phase6_assembly_3d_view.py \
            tests/test_issue375_main_selector_navigation.py \
            tests/test_issue376_assembly_collapsible_data.py \
            tests/test_issue377_remove_wrapper_labels.py \
            tests/test_issue378_assembly_mousewheel.py
