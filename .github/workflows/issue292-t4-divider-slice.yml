name: Issue292 T4 Divider Slice

on:
  push:
    branches:
      - refactor/issue292-gui-phase2-t4-panels-20260916
    paths:
      - '.github/workflows/issue292-t4-divider-slice.yml'
      - 'tools/issue292_divider_green_patch.py'
      - 'tests/test_issue292_t4_divider_slice.py'
      - 'gui.py'
      - 'gui_modules/parts/panels/divider.py'

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply host routing
        run: python tools/issue292_divider_green_patch.py
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile boundary
        run: python -m py_compile gui.py gui_modules/parts/panels/divider.py
      - name: Focused regressions
        run: python -m pytest -q tests/test_issue292_t4_divider_slice.py tests/test_issue292_t4_box_body_slice.py tests/test_issue292_t4_endcap_slice.py tests/test_issue292_t4_base_plate_slice.py
      - name: Commit GREEN
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add gui.py && git diff --cached --quiet || (git commit -m 'refactor(#292): route divider payload through panel boundary' && git push origin HEAD:refactor/issue292-gui-phase2-t4-panels-20260916)
