name: 工單529 可執行收尾驗證
run-name: "工單 #529 B4｜可執行收尾證明｜${{ github.sha }}"

on:
  push:
    branches:
      - qa/issue529-finalization-20260923
    paths:
      - .github/workflows/qa-issue529-finalization.yml

permissions:
  contents: read

jobs:
  finalization:
    name: 驗證 #529 canonical checkpoint 與收尾證明
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出收尾分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取得 coordination checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coord/dispatch-claims:refs/remotes/origin/coord/dispatch-claims
          git show origin/coord/dispatch-claims:.dispatch/checkpoints/issue-529.json > /tmp/issue-529.json

      - name: 授權可執行收尾
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller authorize-finalization             /tmp/issue-529.json             --issue 529             --branch work/issue520-phase6-bridge-residual-reduction-20260923             --head-sha 8fa30cfc7800afba16b71c7580552893db5d1037             --proof-out /tmp/issue-529.finalization-proof.json

      - name: 驗證收尾證明
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.continuity_controller verify-finalization-proof             /tmp/issue-529.json             /tmp/issue-529.finalization-proof.json             --issue 529             --branch work/issue520-phase6-bridge-residual-reduction-20260923             --head-sha 8fa30cfc7800afba16b71c7580552893db5d1037
          sha256sum /tmp/issue-529.finalization-proof.json
          cp /tmp/issue-529.finalization-proof.json issue-529.finalization-proof.json

      - name: 上傳收尾證明
        uses: actions/upload-artifact@v4
        with:
          name: issue529-finalization-proof
          path: issue-529.finalization-proof.json
          if-no-files-found: error
          retention-days: 14
