name: issue269-t6-current-x-integration-readiness

on:
  push:
    branches:
      - governance/issue269-t6-current-x-integration-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run #269 regression
        run: python -m pytest -q tests/process/test_issue269_current_x_integration_readiness.py
      - name: Validate frozen current-X readiness evidence
        run: >-
          python tools/task_chain_integration_readiness_gate.py
          --manifest docs/governance/issue269-t6-current-x-readiness-evidence.json
          --contract docs/governance/issue269-t6-integration-readiness-contract.json
