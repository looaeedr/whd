name: WHD｜#579｜RECOVERING claim 回歸
run-name: "WHD｜#579｜RECOVERING claim 回歸｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue579-recovering-claim-phase-20260924

permissions:
  contents: read

jobs:
  red:
    name: "回歸｜execution claim phase 安全契約"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout exact branch"
        uses: actions/checkout@v4
      - name: "安裝 Tk 測試環境"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: "安裝 pytest"
        run: python -m pip install pytest
      - name: "執行 focused claim guard 回歸"
        run: >-
          python -m pytest -q
          tests/process/test_issue256_execution_claim_guard.py
          tests/process/test_issue567_reopened_released_claim_recovery.py
          tests/process/test_issue570_merge_head_claim_reconciliation.py
          tests/process/test_issue573_sibling_scheduler_takeover.py
