name: WHD Issue 733 Batch Governance Parity QA

on:
  push:
    branches:
      - governance/issue733-branch-create-auto-consume-cleanup-parity-20260926

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Combined governance parity regression
        run: >-
          python -m pytest -q
          tests/process/test_issue675_legacy_expired_postcommit_recovery.py
          tests/process/test_issue722_trusted_interactive_takeover_transport.py
          tests/process/test_issue731_branch_create_auto_consume.py
          tests/process/test_issue736_main_x_batch_first_parity.py
          tests/process/test_issue643_guard_transaction_gate.py
