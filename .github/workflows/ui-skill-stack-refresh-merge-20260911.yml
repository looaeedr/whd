name: ui-skill-stack-refresh-merge-20260911

on:
  push:
    branches:
      - integration/ui-design-skill-stack-refresh-20260911
    paths:
      - 'docs/superpowers/verification/.ui-skill-stack-refresh-trigger'

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Provision test runtime
        run: python -m pip install pytest
      - name: Snapshot config invariant
        run: sha256sum config.ini | tee /tmp/config.before
      - name: Refreshed merged-head Knowledge Preflight
        run: |
          python tools/phase6_skill_preflight.py \
            --task "Final Combined Acceptance for the refreshed production integration of Python testing, property-based testing, dimensional semantics, and UI design Skills; preserve the latest production AI06 knowledge and issue-closure governance before non-force production fast-forward under explicit user 合 authorization" \
            --changed-file '.agents/skills/engineering/Python測試實務/SKILL.md' \
            --changed-file '.agents/skills/engineering/性質導向測試/SKILL.md' \
            --changed-file '.agents/skills/engineering/尺寸語意分析/SKILL.md' \
            --changed-file '.agents/skills/engineering/UI設計與去AI味/SKILL.md' \
            --changed-file '.agents/skills/engineering/README.md' \
            --changed-file '.agents/skills/skill_registry.json' \
            --changed-file 'release_required_artifacts.json' \
            --changed-file '個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md' \
            --changed-file 'tests/test_python_testing_practices_skill_contract.py' \
            --changed-file 'tests/test_fourth_batch_skills_contract.py' \
            --changed-file 'tests/test_ui_design_de_ai_skill_contract.py' \
            --changed-file 'docs/superpowers/verification/2026-09-11-ui-skill-stack-production-refresh.md' \
            --changed-file '.github/workflows/ui-skill-stack-refresh-merge-20260911.yml' \
            --evidence 'docs/superpowers/verification/2026-09-11-ui-skill-stack-production-refresh.md'
      - name: Fifth-batch exact R1-R6 contract
        run: python tests/test_ui_design_de_ai_skill_contract.py
      - name: Refreshed Skill and production-governance guards
        run: |
          python -m pytest -q \
            tests/test_chinese_skill_identity_contract.py \
            tests/test_writing_skill_contract.py \
            tests/test_writing_skill_preflight_route.py \
            tests/test_find_skill_contract.py \
            tests/test_second_batch_skills_contract.py \
            tests/test_python_testing_practices_skill_contract.py \
            tests/test_fourth_batch_skills_contract.py \
            tests/test_dxf_skill_scope_contract.py \
            tests/test_phase6_skill_preflight_gate.py \
            tests/test_phase6_release_packaging_policy.py \
            tests/test_release_integrity_gate.py \
            tests/test_issue_closure_completion_skill_contract.py
      - name: Machine-readable governance parse
        run: |
          python -m json.tool .agents/skills/skill_registry.json >/dev/null
          python -m json.tool release_required_artifacts.json >/dev/null
      - name: Verify config and clean tree
        if: always()
        run: |
          sha256sum config.ini | tee /tmp/config.after
          diff -u /tmp/config.before /tmp/config.after
          git diff --exit-code
