name: WHD｜#589｜stale interactive owner takeover QA
run-name: "WHD｜#589｜interactive takeover｜${{ github.sha }}"

on:
  push:
    branches:
      - governance/issue589-user-directed-chat-takeover-20260924

permissions:
  contents: read

jobs:
  focused:
    name: "Focused｜interactive takeover"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run takeover regressions
        run: |
          python -m pytest -q \
            tests/process/test_issue589_user_directed_interactive_owner_takeover.py \
            tests/process/test_issue581_interactive_stale_takeover.py \
            tests/process/test_issue573_sibling_scheduler_takeover.py \
            tests/process/test_issue578_scheduler_runtime_liveness.py
