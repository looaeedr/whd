name: Issue164 durable changed-file preflight
on:
  push:
    branches:
      - qa/issue164-combined-acceptance-20260913
    paths:
      - .github/workflows/issue164-preflight-20260913.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build reread evidence
        run: |
          cat > /tmp/issue164-evidence.md <<'EOF'
          SKILLS READ
          UI設計與去AI味
          phase6-corner-3d-model-integrity
          寫技能
          Python測試實務
          驗證板件與DXF
          monitoring-remote-qa
          issue-closure-gate
          phase6-release-packaging
          REFERENCES READ
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 基準檔/截角資料庫/README_母規則說明.md
          READ_REFERENCE: 基準檔/截角資料庫/certified_relief_rules.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/phase6_assembly_relief_pitfalls.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/04_WHD鈑金展開幾何引擎規範.md
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/issue_closure_completion_pitfalls.md
          READ_REFERENCE: release_required_artifacts.json
          EOF
      - name: Actual durable changed-file preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "#164 Final Combined acceptance durable Skill and AI Library writeback; remote QA; production integration gate remains human-gated; preserve manufacturing authority and exact invariants"
          --changed-file '.agents/skills/engineering/UI設計與去AI味/SKILL.md'
          --changed-file '.agents/skills/engineering/驗證板件與DXF/SKILL.md'
          --changed-file '個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md'
          --changed-file 'tests/test_issue164_durable_contract.py'
          --evidence /tmp/issue164-evidence.md
