name: QA Issue 643 T3 RED

on:
  push:
    branches:
      - workorder/issue640-guard-turn-exit-helper-hardening-20260925
    paths:
      - tests/process/test_issue643_guard_transaction_gate.py

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Require all fourteen approved P-R gaps to stay RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/process/test_issue643_guard_transaction_gate.py > /tmp/issue643-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue643-red.log
          test "$rc" -ne 0
          grep -Eq '14 failed' /tmp/issue643-red.log
          echo "ISSUE643_T3_REQUIREMENT_RED=GREEN"
      - uses: actions/upload-artifact@v4
        with:
          name: issue643-t3-red-${{ github.run_id }}
          path: /tmp/issue643-red.log
          if-no-files-found: error
