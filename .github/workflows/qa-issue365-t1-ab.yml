name: "QA #365 T1 task-scoped A-B acceptance"

on:
  push:
    branches:
      - refactor/issue365-phase3-workspace-navigation-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_workspace_navigation_controller.py'
      - 'tests/test_issue365_t1_workspace_navigation_controller.py'
      - 'tools/issue365_t1_ab_compare.py'
      - '.github/workflows/qa-issue365-t1-*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 0dd6561f3253d0a17714af316d5e9da90e24058f

jobs:
  scope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify T1 scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASELINE_SHA...$GITHUB_SHA" | sort | tee /tmp/issue365-scope.txt
          python - <<'PY'
          from pathlib import Path
          paths = [x for x in Path('/tmp/issue365-scope.txt').read_text().splitlines() if x]
          allowed_exact = {
              'fold_designer_bridge.py',
              'phase6_workspace_navigation_controller.py',
              'tests/test_issue365_t1_workspace_navigation_controller.py',
              'tools/issue365_t1_ab_compare.py',
          }
          allowed_prefixes = (
              '.github/workflows/qa-issue365-',
              'docs/superpowers/checkpoints/issue365-',
          )
          unexpected = [
              p for p in paths
              if p not in allowed_exact and not p.startswith(allowed_prefixes)
          ]
          assert not unexpected, f'ISSUE365_SCOPE_DRIFT={unexpected}'
          print('PASS ISSUE365_SCOPE_DRIFT=0')
          PY

      - name: Compile T1 production owners
        run: python -m py_compile phase6_workspace_navigation_controller.py fold_designer_bridge.py tools/issue365_t1_ab_compare.py

      - name: Run source-owner contract
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
          python -m pytest -q tests/test_issue365_t1_workspace_navigation_controller.py

  headless-ab:
    needs: scope-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Headless dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-json-report matplotlib numpy -r requirements.txt

      - name: Run baseline and candidate Headless
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$GITHUB_SHA"
          ROOT="$GITHUB_WORKSPACE/.scratch/issue365/headless"
          mkdir -p "$ROOT"

          protected_digest() {
            find . -type f \( -name config.ini -o -iname '*.dxf' \) \
              -not -path './.git/*' -not -path './.scratch/*' \
              -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }

          run_one() {
            label="$1"
            ref="$2"
            out="$ROOT/$label"
            mkdir -p "$out"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            protected_digest > "$out/protected-before.digest"
            set +e
            python -m pytest -q -ra --tb=short \
              --json-report --json-report-file="$out/report.json" \
              tests/test_dm7_part_navigation.py \
              tests/test_dm7_navigation_callers.py \
              tests/test_phase6_designer_workspace.py \
              tests/test_phase6_workspace_projection.py \
              tests/test_phase6_workspace_controller.py \
              tests/test_phase6_workspace_state.py \
              tests/test_phase6_derived_cache_owner.py \
              tests/test_issue175_dm7_navigation_authority_contract.py \
              2>&1 | tee "$out/pytest.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/pytest.rc"
            protected_digest > "$out/protected-after.digest"
            test -s "$out/report.json"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$CANDIDATE_SHA"

      - name: Upload Headless A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue365-t1-headless-ab
          path: .scratch/issue365/headless
          if-no-files-found: error

  xvfb-ab:
    needs: scope-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xvfb dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-json-report matplotlib numpy -r requirements.txt

      - name: Run baseline and candidate Xvfb
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$GITHUB_SHA"
          ROOT="$GITHUB_WORKSPACE/.scratch/issue365/xvfb"
          mkdir -p "$ROOT"

          protected_digest() {
            find . -type f \( -name config.ini -o -iname '*.dxf' \) \
              -not -path './.git/*' -not -path './.scratch/*' \
              -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }

          run_one() {
            label="$1"
            ref="$2"
            out="$ROOT/$label"
            mkdir -p "$out"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            protected_digest > "$out/protected-before.digest"
            set +e
            xvfb-run -a python -m pytest -q -ra --tb=short \
              --json-report --json-report-file="$out/report.json" \
              tests/test_original_fold_designer_bridge.py \
              tests/test_phase6_assembly_3d_view.py \
              tests/test_phase6_home_baseline_ui.py \
              tests/test_phase6_ui_state_regressions.py \
              tests/test_phase6_return_2d_corner.py \
              tests/test_issue94_corner_data_navigation_mode.py \
              tests/ui/test_box_body_physical_child_navigation.py \
              tests/test_phase6_designer_workspace.py \
              2>&1 | tee "$out/pytest.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/pytest.rc"
            protected_digest > "$out/protected-after.digest"
            test -s "$out/report.json"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$CANDIDATE_SHA"

      - name: Upload Xvfb A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue365-t1-xvfb-ab
          path: .scratch/issue365/xvfb
          if-no-files-found: error

  classify:
    if: always() && needs.scope-contract.result == 'success' && needs.headless-ab.result == 'success' && needs.xvfb-ab.result == 'success'
    needs: [scope-contract, headless-ab, xvfb-ab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: issue365-t1-headless-ab
          path: .scratch/issue365/headless

      - uses: actions/download-artifact@v4
        with:
          name: issue365-t1-xvfb-ab
          path: .scratch/issue365/xvfb

      - name: Classify exact T1 A-B parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue365_t1_ab_compare.py \
            --baseline-headless .scratch/issue365/headless/baseline/report.json \
            --candidate-headless .scratch/issue365/headless/candidate/report.json \
            --baseline-xvfb .scratch/issue365/xvfb/baseline/report.json \
            --candidate-xvfb .scratch/issue365/xvfb/candidate/report.json \
            --baseline-protected-before .scratch/issue365/headless/baseline/protected-before.digest \
            --baseline-protected-after .scratch/issue365/headless/baseline/protected-after.digest \
            --candidate-protected-before .scratch/issue365/headless/candidate/protected-before.digest \
            --candidate-protected-after .scratch/issue365/headless/candidate/protected-after.digest \
            --output .scratch/issue365/qualification.json

      - name: Upload T1 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue365-t1-ab-qualification
          path: .scratch/issue365/qualification.json
          if-no-files-found: error
