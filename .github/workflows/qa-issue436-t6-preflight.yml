name: "QA #436 T6 Knowledge Preflight"

on:
  push:
    branches:
      - qa/issue436-t6-cumulative-acceptance-20260920
    paths:
      - '.github/workflows/qa-issue436-t6-preflight.yml'
      - 'docs/superpowers/checkpoints/issue436-t6-preflight-evidence.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run T6 planned-change Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #436 T6 cumulative A/B, visual screenshot acceptance, Headless baseline/candidate, Xvfb baseline/candidate, shared-content single-host classifier, three-mode switch matrix, geometry dataflow persistence callback visibility corner-data protected invariants, config.ini DXF project round-trip, target drift audit, non-force production integration, production readback, post-merge smoke, cleanup and issue-chain closure." \
            --changed-file tests/test_issue436_visual_shared_host.py \
            --changed-file .github/workflows/qa-issue436-t6-cumulative.yml \
            --changed-file .github/workflows/qa-issue436-t6-postmerge.yml \
            --changed-file docs/superpowers/checkpoints/issue436-t6-journal.md \
            --changed-file docs/superpowers/checkpoints/issue436-t6-checkpoint.json \
            --evidence docs/superpowers/checkpoints/issue436-t6-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"
