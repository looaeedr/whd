name: Issue321 Rebase Acceptance

on:
  push:
    branches:
      - fix/issue321-rebase-current-production-20260916

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write current-production knowledge evidence
        run: |
          cat > /tmp/issue321-rebase-evidence.txt <<'EOF'
          寫技能
          Python測試實務
          phase6-release-packaging
          executable-continuity-controller
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: release_required_artifacts.json
          READ_REFERENCE: 個人AI檔案庫/踩坑庫/executable_continuity_controller_pitfall.md
          EOF
      - name: Verify changed-file knowledge preflight
        run: >-
          python tools/phase6_skill_preflight.py
          --task "Issue #321 rebase tightened owning-checkpoint turn-exit guard proof onto current production without replacing finalization-owner guard"
          --changed-file "tools/continuity_controller.py"
          --changed-file "tools/assistant_turn_exit_gate.py"
          --changed-file "tests/process/test_issue321_turn_exit_enforcement.py"
          --changed-file ".agents/skills/engineering/executable-continuity-controller/SKILL.md"
          --changed-file "個人AI檔案庫/踩坑庫/turn_exit_guard_invocation_fail_closed.md"
          --evidence /tmp/issue321-rebase-evidence.txt
      - name: Apply additive turn-exit proof layer
        run: |
          python tools/issue321_rebase_apply.py
          if ! git diff --quiet -- tools/continuity_controller.py .agents/skills/engineering/executable-continuity-controller/SKILL.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/continuity_controller.py .agents/skills/engineering/executable-continuity-controller/SKILL.md
            git commit -m "fix(#321): rebase turn-exit proof onto current production guard"
            git push origin HEAD:fix/issue321-rebase-current-production-20260916
          fi
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run focused continuity regressions
        run: >-
          python -m pytest -q
          tests/process/test_issue321_turn_exit_enforcement.py
          tests/process/test_continuity_controller.py
          tests/process/test_finalization_owner_guard.py
          tests/process/test_issue286_turn_exit_bridge_contract.py
