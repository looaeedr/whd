name: Issue292 T4 Task7 Root Gate

on:
  push:
    branches:
      - refactor/issue292-task7-root-adapters-20260917
    paths:
      - '.github/workflows/issue292-t4-task7-root-gate.yml'
      - 'tests/test_issue292_gui_phase2_t4_part_panels.py'
      - 'gui.py'
      - 'gui_modules/parts/panels/**'

permissions:
  contents: read

jobs:
  task7-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Task 7 architecture and LOC gate
        run: python -m pytest -q tests/test_issue292_gui_phase2_t4_part_panels.py
