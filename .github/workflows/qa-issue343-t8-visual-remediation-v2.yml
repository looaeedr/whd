name: "QA #343 T8 Visual Remediation V2"

on:
  push:
    branches:
      - ui/issue343-t8-visual-remediation-v2-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#343)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib
      - name: Require exact screenshot-review width RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue343_t8_visual_remediation.py::test_v2_width_floor_after_manual_screenshot_review > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#343 V2 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#343)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real GUI / CJK runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib pillow
      - name: Focused real-Tk width acceptance
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest -q             tests/test_issue343_t8_visual_remediation.py             tests/test_issue340_keyboard_focus.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#343)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Presentation-only drift gate
        shell: bash
        run: |
          git diff --name-only d28cd145811f131fe2714267a7a33d74267c40dd...HEAD | tee changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("changed.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          allowed = {
              "fold_designer_bridge.py",
              "tests/test_issue343_t8_visual_remediation.py",
              ".github/workflows/qa-issue343-t8-visual-remediation-v2.yml",
          }
          bad = sorted(
              p for p in changed
              if p not in allowed and not p.startswith("docs/superpowers/checkpoints/issue343-")
          )
          if bad:
              raise SystemExit(f"#343 v2 presentation-only drift violation: {bad}")
          print("#343 v2 presentation-only drift PASS", sorted(changed))
          PY
