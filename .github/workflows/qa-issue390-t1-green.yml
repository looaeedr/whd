name: "QA #390 T1 GREEN immutable Settings contracts"

on:
  push:
    branches:
      - "refactor/issue390-phase4-t1-settings-contracts-20260920"
    paths:
      - "phase6_settings_contracts.py"
      - "tests/test_issue390_settings_contracts.py"
      - ".github/workflows/qa-issue390-t1-green.yml"

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE=390"
          echo "PREDECESSOR=d3f37e251816af974d940e7f2c1738dbb38edb3e"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor d3f37e251816af974d940e7f2c1738dbb38edb3e HEAD

      - name: Install focused dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest

      - name: T1 contract GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue390_settings_contracts.py --tb=short
          echo "ISSUE390_T1_CONTRACT_GREEN=1"

      - name: Existing Settings focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue366_t2_settings_transaction_owner.py \
            tests/test_issue366_t2a_settings_stage_controller.py \
            tests/test_phase6_settings_panel_ownership.py \
            --tb=short
          echo "ISSUE390_T1_EXISTING_SETTINGS_GREEN=1"

      - name: Runtime-source A/B must be byte-identical
        shell: bash
        run: |
          set -euo pipefail
          base=d3f37e251816af974d940e7f2c1738dbb38edb3e
          for path in \
            fold_designer_bridge.py \
            phase6_settings_transaction_controller.py \
            phase6_settings_panel.py \
            phase6_settings_center.py \
            phase6_box_body_structure.py \
            phase6_endcap_semantics.py \
            phase6_fold_profiles.py
          do
            test "$(git rev-parse "$base:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          echo "ISSUE390_T1_RUNTIME_SOURCE_DELTA=0"

      - name: Scope and protected drift
        shell: bash
        run: |
          set -euo pipefail
          base=d3f37e251816af974d940e7f2c1738dbb38edb3e
          git diff --name-only "$base"...HEAD | sort > /tmp/changed
          cat /tmp/changed
          python - <<'PY'
          from pathlib import Path
          changed=set(Path("/tmp/changed").read_text().splitlines())
          allowed={
            "phase6_settings_contracts.py",
            "tests/test_issue390_settings_contracts.py",
            ".github/workflows/qa-issue390-t1-red.yml",
            ".github/workflows/qa-issue390-t1-green.yml",
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected, unexpected
          print("ISSUE390_T1_PROTECTED_DRIFT=0")
          PY

      - name: Contract import direction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("phase6_settings_contracts.py")
          tree=ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
          imports=set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  imports.update(a.name for a in n.names)
              elif isinstance(n, ast.ImportFrom) and n.module:
                  imports.add(n.module)
          bad=sorted(x for x in imports if x=="tkinter" or x.startswith("tkinter.") or x=="fold_designer_bridge" or x.startswith("gui"))
          assert not bad, bad
          print("ISSUE390_T1_REVERSE_IMPORTS=0")
          PY
