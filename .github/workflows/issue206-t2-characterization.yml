name: Issue 206 T2 Characterization

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - '.github/workflows/issue206-t2-characterization.yml'
      - '.scratch/issue206/**'
      - '.scratch/issue206-t2-checkpoint.md'
      - 'tests/test_issue206_gui_modularization_characterization.py'
  workflow_dispatch:

jobs:
  t2-characterization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest matplotlib
      - name: Phase6 preflight with planned test path
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .scratch/issue206/run
          python tools/phase6_skill_preflight.py \
            --task "Issue #206 T2 Python characterization tests for approved gui.py modularization seams; tests only, no production changes" \
            --changed-file 'tests/test_issue206_gui_modularization_characterization.py' \
            --changed-file '.scratch/issue206/preflight-evidence.md' \
            --changed-file '.scratch/issue206-t2-checkpoint.md' \
            --evidence '.scratch/issue206/preflight-evidence.md' \
            | tee .scratch/issue206/run/preflight.txt
      - name: Assert no production-source branch drift
        shell: bash
        run: |
          git fetch origin cleanup/2d-3d-sync --depth=1
          changed=$(git diff --name-only origin/cleanup/2d-3d-sync...HEAD -- . \
            ':!.scratch/**' \
            ':!.github/workflows/issue206-t2-characterization.yml' \
            ':!tests/test_issue206_gui_modularization_characterization.py')
          if [ -n "$changed" ]; then
            echo "Unexpected non-test production changes:"
            echo "$changed"
            exit 1
          fi
          echo 'production_source_drift=0' | tee .scratch/issue206/run/drift.txt
      - name: Focused characterization tests
        shell: bash
        run: |
          if [ -f tests/test_issue206_gui_modularization_characterization.py ]; then
            sha256sum config.ini > .scratch/issue206/run/config.before.sha256
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue206/run/baseline.before.sha256
            pytest -q tests/test_issue206_gui_modularization_characterization.py | tee .scratch/issue206/run/pytest.txt
            sha256sum config.ini > .scratch/issue206/run/config.after.sha256
            find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue206/run/baseline.after.sha256
            diff -u .scratch/issue206/run/config.before.sha256 .scratch/issue206/run/config.after.sha256
            diff -u .scratch/issue206/run/baseline.before.sha256 .scratch/issue206/run/baseline.after.sha256
            git diff --exit-code -- config.ini '基準檔'
          else
            echo 'planned characterization test does not exist yet; preflight-only pass' | tee .scratch/issue206/run/pytest.txt
          fi
      - name: Upload T2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue206-t2-characterization
          path: .scratch/issue206/run/
