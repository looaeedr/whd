name: QA Issue 844 Unified Execution Record

on:
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - 'tests/process/test_issue844_unified_execution_record.py'
      - 'tools/execution_record.py'
      - '.github/workflows/qa-issue844-unified-execution-record.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused Issue 844 regression
        run: python -m pytest -q tests/process/test_issue844_unified_execution_record.py
