name: Governance Mirror Hard Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - cleanup/2d-3d-sync
  push:
    branches:
      - main
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-mirror:
    name: Governance Mirror Hard Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy required-check compatibility only
        run: |
          set -euo pipefail
          echo "GOVERNANCE_SINGLE_AUTHORITY_V1"
          echo "production_authority=cleanup/2d-3d-sync"
          echo "main_governance_authority=false"
          echo "main_cleanup_parity_required=false"
          echo "mirror_pair_required=false"
          echo "ancestry_reconciliation_required=false"
          echo "NO_GOVERNANCE_SYNC=1"
