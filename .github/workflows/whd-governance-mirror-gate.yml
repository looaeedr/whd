name: Governance Mirror Hard Gate

on:
  pull_request:
    branches:
      - main
      - cleanup/2d-3d-sync
  push:
    branches:
      - main
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-mirror:
    name: Governance Mirror Hard Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch both governance authorities
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin cleanup/2d-3d-sync:refs/remotes/origin/cleanup/2d-3d-sync

      - name: Validate changed-file scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : > /tmp/governance-changed.txt
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git -c core.quotePath=false diff --name-only "$PR_BASE_SHA...$HEAD_SHA" > /tmp/governance-changed.txt
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git -c core.quotePath=false diff --name-only "$BEFORE_SHA..$HEAD_SHA" > /tmp/governance-changed.txt
            elif git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
              git -c core.quotePath=false diff --name-only "$HEAD_SHA^..$HEAD_SHA" > /tmp/governance-changed.txt
            fi
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.governance_parity_gate import evaluate_change_scope

          manifest = json.loads(
              Path("docs/governance/governance_mirror_manifest.json").read_text(encoding="utf-8")
          )
          changed = [
              line.strip()
              for line in Path("/tmp/governance-changed.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          result = evaluate_change_scope(changed, manifest, target_ref=os.environ["TARGET_REF"])
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          if result.get("result") != "GREEN":
              if result.get("reason") == "NON_GOVERNANCE_PATH_TO_MAIN":
                  print("NON_GOVERNANCE_PATH_TO_MAIN")
              raise SystemExit(1)
          PY

      - name: Verify merge-time governance candidate parity
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.base_ref }}
          CANDIDATE_REF: ${{ github.sha }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$TARGET_REF" = "main" ]; then
            OTHER_REF="cleanup/2d-3d-sync"
          elif [ "$TARGET_REF" = "cleanup/2d-3d-sync" ]; then
            OTHER_REF="main"
          else
            echo "INVALID_MIRROR_TARGET: $TARGET_REF" >&2
            exit 1
          fi

          if python tools/governance_parity_gate.py \
            --manifest docs/governance/governance_mirror_manifest.json \
            --candidate-ref "$CANDIDATE_REF" \
            --target-ref "$TARGET_REF" \
            --opposite-ref "refs/remotes/origin/$OTHER_REF" \
            --verify-pr-candidate-parity
          then
            echo "PR_CANDIDATE_PARITY_SOURCE=opposite-production"
            exit 0
          fi

          PAIR="$(
            python - <<'PY'
          import os
          import re
          body = os.environ.get("PR_BODY") or ""
          matches = re.findall(
              r"(?m)^WHD-Governance-Mirror-Pair: #([0-9]+)[ 	]*$",
              body,
          )
          if len(matches) != 1:
              raise SystemExit(
                  "GOVERNANCE_MIRROR_PAIR_REQUIRED: expected exactly one "
                  "WHD-Governance-Mirror-Pair marker"
              )
          print(matches[0])
          PY
          )"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PAIR" > /tmp/governance-pair.json
          OTHER_REF="$OTHER_REF" CURRENT_PR="$CURRENT_PR" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pair = json.loads(
              Path("/tmp/governance-pair.json").read_text(encoding="utf-8")
          )
          if pair.get("state") != "open":
              raise SystemExit("GOVERNANCE_MIRROR_PAIR_NOT_OPEN")
          base = pair.get("base") or {}
          if base.get("ref") != os.environ["OTHER_REF"]:
              raise SystemExit("GOVERNANCE_MIRROR_PAIR_WRONG_TARGET")
          body = pair.get("body") or ""
          reciprocal = re.findall(
              r"(?m)^WHD-Governance-Mirror-Pair: #([0-9]+)[ 	]*$",
              body,
          )
          if reciprocal != [os.environ["CURRENT_PR"]]:
              raise SystemExit("GOVERNANCE_MIRROR_PAIR_NOT_RECIPROCAL")
          PY

          git fetch --no-tags origin \
            "pull/$PAIR/head:refs/remotes/origin/governance-pair-$PAIR"

          python tools/governance_parity_gate.py \
            --manifest docs/governance/governance_mirror_manifest.json \
            --candidate-ref "$CANDIDATE_REF" \
            --target-ref "$TARGET_REF" \
            --opposite-ref "refs/remotes/origin/governance-pair-$PAIR" \
            --verify-pr-candidate-parity

      - name: Verify live bidirectional governance parity after branch push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_REF" = "main" ]; then
            OTHER_REF="cleanup/2d-3d-sync"
          else
            OTHER_REF="main"
          fi
          python tools/governance_parity_gate.py \
            --manifest docs/governance/governance_mirror_manifest.json \
            --source-ref "refs/remotes/origin/$CURRENT_REF" \
            --target-ref "refs/remotes/origin/$OTHER_REF" \
            --verify-live-parity
