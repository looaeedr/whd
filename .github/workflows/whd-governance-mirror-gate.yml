name: Governance Mirror Hard Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-mirror-hard-gate:
    name: Governance Mirror Hard Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-sync compatibility context
        shell: bash
        run: |
          test -f AGENTS.md
          grep -q 'MAIN_DEFAULT_BRANCH_FAIL_CLOSED_V2' AGENTS.md
          grep -q 'whd_doc_role: HISTORICAL' AGENTS.md
          test "$(python - <<'PY'
          import json
          print(len(json.load(open(".agents/skills/skill_registry.json", encoding="utf-8"))["routes"]))
          PY
          )" = "0"
          echo "GOVERNANCE_SINGLE_AUTHORITY_V1"
          echo "production_authority=cleanup/2d-3d-sync"
          echo "main_governance_authority=false"
          echo "main_cleanup_parity_required=false"
          echo "mirror_pair_required=false"
          echo "ancestry_reconciliation_required=false"
          echo "NO_GOVERNANCE_SYNC=1"
