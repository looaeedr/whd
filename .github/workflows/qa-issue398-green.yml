name: "QA #398 default baseline vault GREEN"

on:
  push:
    branches:
      - fix/issue398-default-baseline-vault-20260919
    paths:
      - 'gui_modules/application/state_sync.py'
      - 'tests/test_issue398_default_baseline_vault.py'
      - '.github/workflows/qa-issue398-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4)" = "fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4"
          echo "BASE=fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install GUI harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Capture protected invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before

      - name: Fresh startup contract
        run: xvfb-run -a python -m pytest -q tests/test_issue398_default_baseline_vault.py --tb=short

      - name: Family switching regressions
        run: xvfb-run -a python -m pytest -q tests/test_phase6_t11_family_preset_switching.py --tb=short

      - name: Project and ownership regressions
        run: |
          python -m pytest -q             tests/test_phase6_project_ownership.py             tests/test_phase6_project_session.py             tests/test_issue367_t3_project_persistence_owner.py             --tb=short

      - name: Protected invariants and scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          cmp /tmp/config.before /tmp/config.after
          cmp /tmp/baseline.before /tmp/baseline.after
          git diff --check fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4...HEAD
          git diff --name-only fdcc9b0a08f7ed19f5c17984f2793c16d6f49be4...HEAD | tee /tmp/issue398-files.txt
          test "$(grep -Ec '^(config.ini$|基準檔/|ae_engine/)' /tmp/issue398-files.txt || true)" -eq 0
          echo "PASS PROTECTED_DRIFT=0"
