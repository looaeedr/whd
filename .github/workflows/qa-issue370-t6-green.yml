name: "QA #370 T6 final-scene view GREEN"

on:
  push:
    branches:
      - refactor/issue370-phase3-final-scene-20260919
    paths:
      - 'fold_designer_bridge.py'
      - 'phase6_final_scene_view.py'
      - 'tests/test_issue370_t6_final_scene_view_owner.py'
      - '.github/workflows/qa-issue370-t6-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t6-green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c79ff3e3e0f863a10869f8b1f40416e8686cc711 HEAD
          echo "T6_BASELINE=c79ff3e3e0f863a10869f8b1f40416e8686cc711"
          echo "CANDIDATE=$(git rev-parse HEAD)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install pytest pytest-json-report matplotlib numpy shapely -r requirements.txt

      - name: Compile T6 owners
        run: python -m py_compile phase6_final_scene_view.py fold_designer_bridge.py

      - name: Run T6 ownership contract
        run: python -m pytest -q tests/test_issue370_t6_final_scene_view_owner.py

      - name: Run headless final-scene/provider regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase6_final_scene_view_ownership.py \
            tests/test_phase6_3d_single_source_renderer.py \
            tests/test_phase6_3d_cutting_mesh.py \
            tests/test_phase6_shared_assembly_and_dimensions.py

      - name: Run real-Tk 3D and assembly regressions excluding exact inherited RED nodes
        shell: bash
        run: |
          set -euo pipefail
          N1="tests/test_phase6_assembly_3d_view.py::test_real_tk_part_selector_starts_in_assembly_and_switches_to_single_part"
          N2="tests/test_phase6_assembly_3d_view.py::test_real_tk_menu_can_switch_from_assembly_to_boxbody_after_radiobutton_sets_label_first"
          xvfb-run -a python -m pytest -q \
            tests/test_phase6_3d_view_regressions.py \
            tests/test_phase6_assembly_3d_view.py \
            --deselect "$N1" --deselect "$N2"

      - name: Require exact inherited Xvfb parity
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="c79ff3e3e0f863a10869f8b1f40416e8686cc711"
          TESTED="$(git rev-parse HEAD)"
          N1="tests/test_phase6_assembly_3d_view.py::test_real_tk_part_selector_starts_in_assembly_and_switches_to_single_part"
          N2="tests/test_phase6_assembly_3d_view.py::test_real_tk_menu_can_switch_from_assembly_to_boxbody_after_radiobutton_sets_label_first"
          ROOT=/tmp/t6-green-inherited
          mkdir -p "$ROOT"
          run_one() {
            label="$1"; ref="$2"
            git checkout --detach "$ref" >/dev/null
            git reset --hard "$ref" >/dev/null
            set +e
            xvfb-run -a python -m pytest -q "$N1" "$N2" --tb=short \
              --json-report --json-report-file="$ROOT/$label.json" \
              >"$ROOT/$label.log" 2>&1
            rc=$?
            set -e
            echo "$rc" >"$ROOT/$label.rc"
            test -s "$ROOT/$label.json"
          }
          run_one baseline "$BASELINE"
          run_one candidate "$TESTED"
          python - <<'PY'
          import json
          from pathlib import Path
          def outcomes(label):
              data=json.loads(Path(f"/tmp/t6-green-inherited/{label}.json").read_text())
              return {row["nodeid"]: row.get("outcome") for row in data.get("tests", [])}
          b=outcomes("baseline"); c=outcomes("candidate")
          print("BASELINE", b)
          print("CANDIDATE", c)
          assert b == c, (b, c)
          assert len(b) == 2, b
          assert set(b.values()) == {"failed"}, b
          print("PASS T6_INHERITED_XVFB_RED_EXACT_PARITY=2")
          PY
