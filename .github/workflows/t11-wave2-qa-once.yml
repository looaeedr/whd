name: T11 stale-oracle wave2 QA once

on:
  push:
    branches: [cleanup/2d-3d-sync]
    paths:
      - '.github/t11_wave2_qa_trigger.txt'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -q pytest matplotlib pillow -r requirements.txt
      - name: Canonical config before
        run: |
          sha256sum config.ini | tee /tmp/config_before
          test "$(sha256sum config.ini | awk '{print $1}')" = "980eab68d4a1732a5313b22329852dfc9691c83e4e2a64cccd18022afae4ee67"
      - name: Manufacturing adapter and prior stale-oracle scopes
        run: |
          xvfb-run -a python -m pytest -q             tests/test_gui_manufacturing_adapter.py             tests/test_box_body_gui.py
      - name: T11 contract guards
        run: |
          xvfb-run -a python -m pytest -q             tests/test_phase6_t11_family_preset_switching.py             tests/test_phase6_t11_integration_matrix.py             tests/test_phase6_t06_receiving_fresh_family.py
      - name: Canonical config after
        run: |
          sha256sum config.ini | tee /tmp/config_after
          diff -u /tmp/config_before /tmp/config_after
