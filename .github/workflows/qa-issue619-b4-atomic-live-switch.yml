name: "WHD｜#619｜B4 原子家庭切換"
run-name: "WHD｜#619｜B4 原子家庭切換"

on:
  push:
    branches:
      - work/issue628-receiving-rear-panel-overlay-live-switch-20260924
    paths:
      - 'tests/test_issue619_atomic_family_live_switch.py'
      - 'tests/test_issue501_baseline_reset_coordinator.py'
      - 'gui_modules/application/fold_designer_settings_coordinator.py'
      - 'fold_designer_bridge.py'
      - 'gui_modules/application/fold_designer_adapter.py'
      - 'phase6_final_scene_renderer.py'
      - '.github/workflows/qa-issue619-b4-atomic-live-switch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expanded:
    name: "UI-R3 原子切換＋既有 live-switch 回歸"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout exact candidate"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Xvfb and Python dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -q pytest pytest-json-report matplotlib numpy shapely ezdxf -r requirements.txt

      - name: "Run #619 expanded acceptance with protected config"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue619
          before="$(sha256sum config.ini | awk '{print $1}')"
          xvfb-run -a python -m pytest -q \
            tests/test_issue619_atomic_family_live_switch.py \
            tests/test_issue501_baseline_reset_coordinator.py \
            tests/test_issue517_receiving_live_switch_ui_export_marking.py \
            tests/test_phase6_t21_live_switch_selector.py \
            tests/test_phase6_3d_retain_and_baseline.py \
            tests/test_phase6_ui_state_regressions.py \
            tests/test_phase6_t25_combined_receiving_acceptance.py \
            --tb=short \
            --json-report --json-report-file=/tmp/issue619/report.json
          after="$(sha256sum config.ini | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- config.ini
          printf 'config_sha256=%s\n' "$after" > /tmp/issue619/protected-config.txt

      - name: "Upload #619 expanded acceptance evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue619-ui-r3-expanded
          path: |
            /tmp/issue619/report.json
            /tmp/issue619/protected-config.txt
          if-no-files-found: error
