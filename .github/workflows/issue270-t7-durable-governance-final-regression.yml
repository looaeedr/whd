name: issue270-t7-durable-governance-final-regression

on:
  push:
    branches:
      - governance/issue270-t7-durable-writeback-final-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run #270 durable governance regression
        run: python -m pytest -q tests/process/test_issue270_durable_governance_writeback.py
