name: WHD｜Flow v2｜Push Transaction Request
run-name: WHD｜Flow v2 Push Request｜${{ github.ref_name }}｜${{ github.sha }}

on:
  push:
    branches:
      - coord/transaction-requests-a
      - coord/transaction-requests-b
      - coord/transaction-requests-work0
      - coord/transaction-requests-work1
      - coord/transaction-requests-work2
      - coord/transaction-requests-work3
    paths:
      - .dispatch/transaction-request.json

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: whd-flow-v2-push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    name: 套用 Flow v2 push transaction request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 讀取 exact request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: request
          fetch-depth: 1

      - name: 讀取 production Flow v2 implementation
        uses: actions/checkout@v4
        with:
          ref: cleanup/2d-3d-sync
          path: prod
          fetch-depth: 1

      - name: 取得 WHD GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WHD_APP_ID }}
          private-key: ${{ secrets.WHD_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-issues: write

      - name: 驗 request identity 並原子回寫 ExecutionRecord
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          WHD_PR_BRANCH_WRITE_TOKEN: ${{ secrets.TOK }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH=prod python prod/tools/control_transaction_request_ingress.py \
            --request-file request/.dispatch/transaction-request.json \
            --output /tmp/flow-v2-production-result.json
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/flow-v2-production-result.json').read_text(encoding='utf-8'))
          if result.get('result') != 'CONFLICT' or result.get('retryable') is not True:
              raise SystemExit('exit 3 without retryable CONFLICT result')
          print(f"retryable Flow v2 conflict: {result.get('conflict_class')} — {result.get('reason')}")
          PY
            echo "::notice::retryable Flow v2 conflict preserved in artifact; caller must fresh-read and rebuild same semantic action"
            exit 0
          fi
          exit "$rc"

      - name: 保存 terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-v2-push-transaction-${{ github.run_id }}
          path: /tmp/flow-v2-production-result.json
          if-no-files-found: warn
          retention-days: 7

