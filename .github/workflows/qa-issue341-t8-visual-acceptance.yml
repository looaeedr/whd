name: "QA #341 T8 Visual Acceptance"

on:
  push:
    branches:
      - qa/issue341-visual-acceptance-v3-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#341)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact three-layer harness RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue341_visual_acceptance.py::test_t8_red_three_layer_visual_acceptance_harness_exists > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#341 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  acceptance-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#341)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real GUI / capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-apps imagemagick fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib pillow
      - name: Source harness contract
        run: python -m pytest -q tests/test_issue341_visual_acceptance.py
      - name: Re-verify T8 remediation under real Tk / CJK runtime
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest -q tests/test_issue343_t8_visual_remediation.py
      - name: Run A/B/C acceptance on real Tk
        run: |
          rm -rf artifacts/issue341
          mkdir -p artifacts/issue341
          xvfb-run -a -s "-screen 0 1600x1000x24" python tools/issue341_visual_acceptance.py --output artifacts/issue341 --geometry 1400x900
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue341-visual-evidence
          path: artifacts/issue341
          if-no-files-found: error
          retention-days: 30

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#341)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: T8 acceptance-only drift gate
        shell: bash
        run: |
          git diff --name-only 6b04fb2bb72d9c251c979167530dee04ab4a372e...HEAD | tee changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("changed.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          allowed_prefixes = (
              ".github/workflows/qa-issue341-",
              "tests/test_issue341_",
              "tools/issue341_",
              "docs/superpowers/checkpoints/issue341-",
          )
          bad = sorted(p for p in changed if not p.startswith(allowed_prefixes))
          if bad:
              raise SystemExit(f"#341 acceptance-only drift violation: {bad}")
          print("#341 acceptance-only drift PASS", sorted(changed))
          PY
