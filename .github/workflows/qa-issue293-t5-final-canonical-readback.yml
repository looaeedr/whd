name: QA issue293 T5 committed contracts readback

on:
  push:
    branches:
      - qa/issue293-t5-final-canonical-readback-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -q pytest -r requirements.txt
      - name: Verify committed test-only delta and production source unchanged
        shell: bash
        run: |
          git merge-base --is-ancestor 30050750cf15c04335130449265038424dc050d0 HEAD
          git diff --exit-code 30050750cf15c04335130449265038424dc050d0 HEAD -- gui.py gui_modules
          mapfile -t changed < <(git diff --name-only 30050750cf15c04335130449265038424dc050d0 HEAD -- tests | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            tests/test_issue293_t5_canvas_renderer_slice.py
            tests/test_issue293_t5_context_switch_slice.py
            tests/test_issue293_t5_feature_factory_slice.py
            tests/test_issue293_t5_indicator_fit_validation_slice.py
          )
          [[ "${changed[*]}" == "${expected[*]}" ]]
          echo "CANONICAL_SOURCE=30050750cf15c04335130449265038424dc050d0"
      - name: Compile committed editor modules
        run: python -m py_compile gui.py gui_modules/editors/hole_editor.py gui_modules/editors/hole_editor_view.py gui_modules/editors/hole_editor_composition.py
      - name: Verify dependency adapter namespace fail-closed
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from gui_modules.editors.hole_editor_composition import HoleEditorCompositionDependencies
          tree = ast.parse(Path('gui.py').read_text(encoding='utf-8'))
          names = {}
          def store_target(target):
              if isinstance(target, ast.Name): names[target.id] = None
              elif isinstance(target, (ast.Tuple, ast.List)):
                  for item in target.elts: store_target(item)
          for node in tree.body:
              if isinstance(node, ast.Import):
                  for alias in node.names: names[alias.asname or alias.name.split('.')[0]] = None
              elif isinstance(node, ast.ImportFrom):
                  for alias in node.names:
                      if alias.name != '*': names[alias.asname or alias.name] = None
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  names[node.name] = None
              elif isinstance(node, ast.Assign):
                  for target in node.targets: store_target(target)
              elif isinstance(node, ast.AnnAssign): store_target(node.target)
          HoleEditorCompositionDependencies.from_namespace(names)
          print('COMPOSITION_DEPENDENCY_NAMESPACE_OK')
          PY
      - name: Run committed full T5 architecture suite
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_issue293_gui_phase2_t5_editors.py \
            tests/test_issue293_t5_*.py \
            tests/process/test_issue293_t5_scope_reconciliation.py
      - name: Verify final architecture dimensions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('gui.py')
          text = p.read_text(encoding='utf-8')
          tree = ast.parse(text)
          host = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Phase6ApplicationHost')
          fn = next(n for n in host.body if isinstance(n, ast.FunctionDef) and n.name == '_open_unified_hole_editor')
          root_span = fn.end_lineno - fn.lineno + 1
          gui_loc = len(text.splitlines())
          assert root_span <= 12, root_span
          assert gui_loc <= 5884, gui_loc
          print(f'ROOT_SPAN={root_span}')
          print(f'GUI_LOC={gui_loc}')
          PY
      - name: Verify working tree clean
        run: |
          git diff --check
          git diff --exit-code
