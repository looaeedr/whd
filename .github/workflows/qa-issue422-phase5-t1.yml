name: QA Issue422 Phase5 T1

on:
  push:
    branches:
      - refactor/issue413-phase5-assembly-presentation-20260920
    paths:
      - tests/process/test_issue422_phase5_t1_assembly_presentation.py
      - .github/workflows/qa-issue422-phase5-t1.yml
      - docs/superpowers/checkpoints/issue422-phase5-t1-journal.md
      - phase6_assembly_presentation.py
  pull_request:
    branches:
      - cleanup/2d-3d-sync
    paths:
      - tests/process/test_issue422_phase5_t1_assembly_presentation.py
      - .github/workflows/qa-issue422-phase5-t1.yml
      - docs/superpowers/checkpoints/issue422-phase5-t1-journal.md
      - phase6_assembly_presentation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      WORK_BRANCH: refactor/issue413-phase5-assembly-presentation-20260920
      ACCEPTED_PREDECESSOR: b31409e7c1736df31bd554afe4ac779d49b30aaa
      EVIDENCE: docs/superpowers/checkpoints/issue422-phase5-t1-journal.md
      TEST_LOG: /tmp/issue422-t1-pytest.log
      CONFIG_BEFORE: /tmp/issue422-config-before.sha256
      CONFIG_AFTER: /tmp/issue422-config-after.sha256
    steps:
      - name: Checkout exact work-order head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OWNER_HEAD }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest --version

      - name: Verify T1 lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OWNER_HEAD"
          git cat-file -e "$ACCEPTED_PREDECESSOR^{commit}"
          git merge-base --is-ancestor "$ACCEPTED_PREDECESSOR" "$OWNER_HEAD"
          echo "T1_PARENT_ANCESTOR=1"
          echo "WORK_ORDER_HEAD=$OWNER_HEAD"

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task '派工執行 Phase 5 accepted specification T1 #422: pure Assembly presentation contracts and projections; RED-first tests; no Tk, bridge import, app owner, workspace/project mutation, manufacturing solve; preserve DM7 top-level projection, render-time BoxBody pieces, #382 hierarchy, remote QA and durable closure' \
            --changed-file phase6_assembly_presentation.py \
            --changed-file tests/process/test_issue422_phase5_t1_assembly_presentation.py \
            --changed-file .github/workflows/qa-issue422-phase5-t1.yml \
            --changed-file docs/superpowers/checkpoints/issue422-phase5-t1-journal.md \
            --evidence "$EVIDENCE"
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require T1 scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          predecessor = "b31409e7c1736df31bd554afe4ac779d49b30aaa"
          allowed = {
              "phase6_assembly_presentation.py",
              "tests/process/test_issue422_phase5_t1_assembly_presentation.py",
              ".github/workflows/qa-issue422-phase5-t1.yml",
              "docs/superpowers/checkpoints/issue422-phase5-t1-journal.md",
          }
          changed = {
              x.strip()
              for x in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{predecessor}...HEAD"],
                  text=True,
              ).splitlines()
              if x.strip()
          }
          extra = sorted(changed - allowed)
          print("T1_CHANGED_FILES=", sorted(changed))
          print("T1_SCOPE_EXTERNAL_FILES=", extra)
          if extra:
              raise SystemExit("T1 scope drift: " + repr(extra))
          print("T1_SCOPE_EXTERNAL_DRIFT=0")
          print("T1_PRODUCTION_MODULE_PRESENT=", int("phase6_assembly_presentation.py" in changed))
          PY

      - name: Capture protected config hash
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | awk '{print $1}' > "$CONFIG_BEFORE"

      - name: Run T1 RED or GREEN
        shell: bash
        run: |
          set -uo pipefail
          if [ -f phase6_assembly_presentation.py ]; then
            set -e
            python -m pytest -q \
              tests/process/test_issue422_phase5_t1_assembly_presentation.py \
              | tee "$TEST_LOG"
            echo "T1_GREEN=1"
            echo "TOP_LEVEL_PRESENTATION_ORDER_PARITY=GREEN"
            echo "SYNTHETIC_GROUP_PARITY=GREEN"
            echo "BOX_PIECE_SOURCE_PARITY=GREEN"
            echo "BOX_PIECE_ORDER_PARITY=GREEN"
            echo "BOX_PIECE_DIMENSION_SOURCE_PARITY=GREEN"
          else
            set +e
            python -m pytest -q \
              tests/process/test_issue422_phase5_t1_assembly_presentation.py \
              >"$TEST_LOG" 2>&1
            rc=$?
            set -e
            cat "$TEST_LOG"
            if [ "$rc" -eq 0 ]; then
              echo "T1_RED_INVALID=pytest unexpectedly passed"
              exit 1
            fi
            if grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError' "$TEST_LOG"; then
              echo "T1_RED_INVALID=harness_or_collection_error"
              exit 1
            fi
            grep -Fq 'T1 requirement RED: phase6_assembly_presentation.py does not exist yet' "$TEST_LOG"
            grep -Eq '[1-9][0-9]* failed' "$TEST_LOG"
            echo "T1_RED_INTENDED=1"
            echo "T1_RED_PYTEST_RC=$rc"
          fi

      - name: Verify pure-module architecture
        if: ${{ hashFiles('phase6_assembly_presentation.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("phase6_assembly_presentation.py")
          text = p.read_text(encoding="utf-8")
          lower = text.lower()
          checks = {
              "TK_REFS": int("tkinter" in lower),
              "BRIDGE_IMPORTS": int("fold_designer_bridge" in text),
              "APP_OWNER_REFS": int("designer_workspace" in text),
              "WORKSPACE_MUTATION": int("workspace." in text),
              "MANUFACTURING_SOLVE": int("resolve_geometry(" in text or "manufacturing_api" in text),
              "PROJECT_MUTATION": int("project_controller" in text),
          }
          for key, value in checks.items():
              print(f"{key}={value}")
          if any(checks.values()):
              raise SystemExit("T1 pure-module architecture violation")
          PY

      - name: Verify protected config invariant
        shell: bash
        run: |
          set -euo pipefail
          sha256sum config.ini | awk '{print $1}' > "$CONFIG_AFTER"
          cmp "$CONFIG_BEFORE" "$CONFIG_AFTER"
          echo "CONFIG_INVARIANT=GREEN"

      - name: Upload T1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue422-phase5-t1
          path: |
            /tmp/issue422-t1-pytest.log
            /tmp/issue422-config-before.sha256
            /tmp/issue422-config-after.sha256
          if-no-files-found: warn
          retention-days: 14
