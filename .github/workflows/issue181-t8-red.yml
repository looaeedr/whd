name: Issue181 T8 Combined Authority RED

on:
  push:
    branches:
      - qa/issue181-combined-authority-acceptance-20260913
    paths:
      - 'tests/knowledge/test_combined_authority_acceptance_contract.py'
      - '.github/workflows/issue181-t8-red.yml'
  workflow_dispatch:

jobs:
  combined-authority-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Record protected invariants before
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.before
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.before
      - name: Run changed-file Knowledge Preflight
        shell: bash
        run: |
          cat > /tmp/issue181-evidence.txt <<'EOF'
          派工
          issue-closure-gate
          Python測試實務
          diagnosing-bugs
          tdd
          phase6-release-packaging
          monitoring-remote-qa
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/06_踩坑記錄與防錯經驗庫.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/08_WHD技能建立與修改規則.md
          READ_REFERENCE: 個人AI檔案庫/第二層_專案與SOP/09_WHD_Canonical_Authority_Map.md
          EOF
          python tools/phase6_skill_preflight.py \
            --task 'T8 派工：Knowledge Skill Authority Combined Acceptance anti-drift remote QA' \
            --changed-file 'tests/knowledge/test_combined_authority_acceptance_contract.py' \
            --changed-file '.github/workflows/issue181-t8-red.yml' \
            --evidence /tmp/issue181-evidence.txt
      - name: Run T8 requirement RED
        run: python -m pytest -q tests/knowledge/test_combined_authority_acceptance_contract.py
      - name: Verify protected invariants
        if: always()
        shell: bash
        run: |
          sha256sum config.ini > /tmp/config.after
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/baseline.after
          diff -u /tmp/config.before /tmp/config.after
          diff -u /tmp/baseline.before /tmp/baseline.after
