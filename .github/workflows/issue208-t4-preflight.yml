name: Issue 208 T4 Gate

on:
  pull_request:
    branches:
      - refactor/issue207-pure-drawing-move-20260914
    paths:
      - '.scratch/issue208-t4-checkpoint.md'
      - '.scratch/issue208/validate_t4_move.py'
      - '.github/workflows/issue208-t4-preflight.yml'
      - 'gui.py'
      - 'gui_modules/layout.py'
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acceptance dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest matplotlib
      - name: Phase6 preflight
        run: |
          mkdir -p .scratch/issue208/run
          python tools/phase6_skill_preflight.py --task "Issue #208 T4 UI layout presentation strict move-only extraction acceptance; preserve operator behavior and state authority; Xvfb remote QA" --changed-file gui.py --changed-file gui_modules/layout.py --changed-file .scratch/issue208/preflight-evidence.md --changed-file .scratch/issue208-t4-checkpoint.md --evidence .scratch/issue208/preflight-evidence.md | tee .scratch/issue208/run/preflight.txt
      - name: Verify move-only contract
        run: |
          git fetch origin refactor/issue207-pure-drawing-move-20260914 --depth=1
          python .scratch/issue208/validate_t4_move.py | tee .scratch/issue208/run/source-contract.txt
          python -c "import sys, gui_modules.layout; assert 'gui' not in sys.modules"
          python -c "import gui; assert callable(gui._project_toolbar_presentation)"
      - name: Xvfb characterization and focused UI regression
        run: |
          sha256sum config.ini > .scratch/issue208/run/config.before.sha256
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue208/run/baseline.before.sha256
          xvfb-run -a pytest -q tests/test_issue206_gui_modularization_characterization.py tests/test_phase6_ui_state_regressions.py tests/test_phase6_3d_single_source_renderer.py | tee .scratch/issue208/run/pytest.txt
          sha256sum config.ini > .scratch/issue208/run/config.after.sha256
          find '基準檔' -type f -print0 | sort -z | xargs -0 sha256sum > .scratch/issue208/run/baseline.after.sha256
          diff -u .scratch/issue208/run/config.before.sha256 .scratch/issue208/run/config.after.sha256
          diff -u .scratch/issue208/run/baseline.before.sha256 .scratch/issue208/run/baseline.after.sha256
          git diff --exit-code -- config.ini '基準檔'
          git rev-parse HEAD | tee .scratch/issue208/run/tested_head.txt
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue208-t4-acceptance
          path: .scratch/issue208/run/
