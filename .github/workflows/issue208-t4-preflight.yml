name: Issue 208 T4 Gate

on:
  pull_request:
    branches:
      - refactor/issue207-pure-drawing-move-20260914
    paths:
      - '.github/workflows/issue208-t4-preflight.yml'
      - '.scratch/issue208/**'
      - '.scratch/issue208-t4-checkpoint.md'
      - 'gui_modules/layout.py'
      - 'gui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  t4-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase6 preflight
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .scratch/issue208/run
          python tools/phase6_skill_preflight.py \
            --task "Issue #208 T4 UI layout presentation strict move-only extraction of toolbar presentation; preserve operator behavior and state authority; remote QA" \
            --changed-file 'gui.py' \
            --changed-file 'gui_modules/layout.py' \
            --changed-file '.scratch/issue208/preflight-evidence.md' \
            --changed-file '.scratch/issue208-t4-checkpoint.md' \
            --evidence '.scratch/issue208/preflight-evidence.md' \
            | tee .scratch/issue208/run/preflight.txt
      - name: Apply exact move-only edit and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gui.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _project_toolbar_presentation():
    """Pure presentation contract for the compact engineering workbench header."""
    return {
        "actions": (
            ("open", "開啟專案", "secondary"),
            ("save", "儲存專案", "primary"),
            ("save_as", "另存新檔", "secondary"),
        ),
        "primary_action": "save",
        "toolbar_padx": 10,
        "toolbar_pady": 4,
        "button_padx": 8,
        "button_pady": 2,
        "title": "WHD｜箱體板金工程工作台",
        "subtitle": "專案・板件・圖面・製造輸出",
    }


'''
          anchor = '''from gui_modules.drawing import (
    _corner_preview_canvas_point,
    _corner_preview_flip_y_for_target,
    render_drawing_scene,
)


'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one toolbar body, got {text.count(old)}')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one drawing import anchor, got {text.count(anchor)}')
          replacement = anchor + 'from gui_modules.layout import _project_toolbar_presentation\n\n\n'
          path.write_text(text.replace(old, '', 1).replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- gui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui.py
          git commit -m 'refactor(issue208): move toolbar presentation to layout module'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          git rev-parse HEAD | tee .scratch/issue208/run/applied_head.txt
      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue208-t4-apply
          path: .scratch/issue208/run/
