name: "QA #368 T4 task-scoped A-B acceptance"

on:
  push:
    branches:
      - refactor/issue368-phase3-registry-diagnostics-20260919
    paths:
      - '.github/workflows/qa-issue368-t4-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 05e7820e319421cbfbd83e5b243d05cdc7596410
  TESTED_SHA: 7a1f405abb84ef0569e240dde2b86f89da1ad23d

jobs:
  headless-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Headless dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-json-report matplotlib numpy -r requirements.txt

      - name: Run baseline and tested Headless
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$TESTED_SHA"
          ROOT="$GITHUB_WORKSPACE/.scratch/issue368/headless"
          mkdir -p "$ROOT"

          protected_digest() {
            find . -type f \( -name config.ini -o -iname '*.dxf' \)               -not -path './.git/*' -not -path './.scratch/*'               -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }

          run_one() {
            label="$1"; ref="$2"; out="$ROOT/$label"
            mkdir -p "$out"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            protected_digest > "$out/protected-before.digest"
            set +e
            python -m pytest -q -ra --tb=short               --json-report --json-report-file="$out/report.json"               tests/test_certified_relief_registry.py               tests/test_certified_relief_registry_completion.py               tests/test_certified_relief_registry_schema_v2.py               tests/test_relief_formula_evaluator.py               tests/test_relief_registry_candidate_backend.py               tests/test_joint_editor_backend.py               tests/test_joint_diagnostics_contract.py               tests/test_phase6_diagnostics_ownership.py               2>&1 | tee "$out/pytest.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/pytest.rc"
            protected_digest > "$out/protected-after.digest"
            test -s "$out/report.json"
            cmp -s "$out/protected-before.digest" "$out/protected-after.digest"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$TESTED_SHA"

      - name: Upload Headless evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue368-t4-headless-ab
          path: .scratch/issue368/headless
          if-no-files-found: error

  xvfb-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xvfb dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-json-report matplotlib numpy -r requirements.txt

      - name: Run baseline and tested Xvfb
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$TESTED_SHA"
          ROOT="$GITHUB_WORKSPACE/.scratch/issue368/xvfb"
          mkdir -p "$ROOT"

          protected_digest() {
            find . -type f \( -name config.ini -o -iname '*.dxf' \)               -not -path './.git/*' -not -path './.scratch/*'               -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }

          run_one() {
            label="$1"; ref="$2"; out="$ROOT/$label"
            mkdir -p "$out"
            git checkout --detach "$ref"
            git reset --hard "$ref"
            protected_digest > "$out/protected-before.digest"
            set +e
            xvfb-run -a python -m pytest -q -ra --tb=short               --json-report --json-report-file="$out/report.json"               tests/test_relief_registry_form.py               tests/test_relief_registry_candidate_shadow_gui.py               tests/test_rebuild_t7_joint_local_diagnostics.py               tests/test_corner_registry_chinese_presentation.py               2>&1 | tee "$out/pytest.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/pytest.rc"
            protected_digest > "$out/protected-after.digest"
            test -s "$out/report.json"
            cmp -s "$out/protected-before.digest" "$out/protected-after.digest"
          }

          run_one baseline "$BASELINE_SHA"
          run_one candidate "$TESTED_SHA"

      - name: Upload Xvfb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue368-t4-xvfb-ab
          path: .scratch/issue368/xvfb
          if-no-files-found: error

  classify:
    if: always() && needs.headless-ab.result == 'success' && needs.xvfb-ab.result == 'success'
    needs: [headless-ab, xvfb-ab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: issue368-t4-headless-ab
          path: .scratch/issue368/headless

      - uses: actions/download-artifact@v4
        with:
          name: issue368-t4-xvfb-ab
          path: .scratch/issue368/xvfb

      - name: Classify exact T4 A-B parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue368_t4_ab_compare.py             --baseline-headless .scratch/issue368/headless/baseline/report.json             --candidate-headless .scratch/issue368/headless/candidate/report.json             --baseline-xvfb .scratch/issue368/xvfb/baseline/report.json             --candidate-xvfb .scratch/issue368/xvfb/candidate/report.json             --baseline-headless-protected-before .scratch/issue368/headless/baseline/protected-before.digest             --baseline-headless-protected-after .scratch/issue368/headless/baseline/protected-after.digest             --candidate-headless-protected-before .scratch/issue368/headless/candidate/protected-before.digest             --candidate-headless-protected-after .scratch/issue368/headless/candidate/protected-after.digest             --baseline-xvfb-protected-before .scratch/issue368/xvfb/baseline/protected-before.digest             --baseline-xvfb-protected-after .scratch/issue368/xvfb/baseline/protected-after.digest             --candidate-xvfb-protected-before .scratch/issue368/xvfb/candidate/protected-before.digest             --candidate-xvfb-protected-after .scratch/issue368/xvfb/candidate/protected-after.digest             --output .scratch/issue368/qualification.json

      - name: Upload T4 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue368-t4-ab-qualification
          path: .scratch/issue368/qualification.json
          if-no-files-found: error
