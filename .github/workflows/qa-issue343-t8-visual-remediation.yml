name: "QA #343 T8 Visual Remediation"

on:
  push:
    branches:
      - ui/issue343-t8-visual-remediation-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    if: ${{ !contains(github.event.head_commit.message, 'green(#343)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Require exact visual-remediation RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue343_t8_visual_remediation.py::test_red_adaptive_left_workspace_and_cjk_theme_contract_exist > red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -F "#343 EXPECTED RED" red.log
          grep -E "1 failed" red.log

  green-xvfb:
    if: ${{ contains(github.event.head_commit.message, 'green(#343)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real GUI / CJK font runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check -r requirements.txt pytest matplotlib pillow
      - name: Focused real-Tk remediation acceptance
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest -q             tests/test_issue343_t8_visual_remediation.py             tests/test_issue338_contrast_readability.py             tests/test_issue340_keyboard_focus.py

  protected-drift:
    if: ${{ contains(github.event.head_commit.message, 'green(#343)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Presentation-only drift gate
        shell: bash
        run: |
          git diff --name-only 97decd5f4a8e900d4ffd0cb64fbf5e371b3a5136...HEAD | tee changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path("changed.txt").read_text(encoding="utf-8").splitlines() if x.strip()}
          allowed = {
              "fold_designer_bridge.py",
              "whd_theme.py",
              "tests/test_issue343_t8_visual_remediation.py",
              ".github/workflows/qa-issue343-t8-visual-remediation.yml",
          }
          bad = sorted(changed - allowed)
          if bad:
              raise SystemExit(f"#343 presentation-only drift violation: {bad}")
          print("#343 presentation-only drift PASS", sorted(changed))
          PY
