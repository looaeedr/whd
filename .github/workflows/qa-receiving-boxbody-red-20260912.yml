name: Receiving BoxBody parent RED

on:
  push:
    branches:
      - fix/receiving-boxbody-unfold-restore-20260912

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: Receiving parent identity RED
        run: |
          pytest -q -s tests/test_issue96_corner_data_selection_lifecycle.py::test_receiving_multipart_box_body_parent_selection_stays_aggregate
