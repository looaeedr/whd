# retrigger actual Divider candidate replay diagnostic
name: Receiving FW Formed Occupation Acceptance
on:
  push:
    branches: [fix/receiving-fw-formed-solid-authority]
    paths:
      - ae_engine/contracts.py
      - ae_engine/box_body_structure.py
      - ae_engine/assembly_geometry.py
      - ae_engine/divider_manufacturing.py
      - ae_engine/assembly_collision.py
      - phase6_fold_profiles.py
      - tests/test_issue74_divider_side_front_penetration.py
      - .github/workflows/receiving-fw-formed-occupation-red.yml
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest matplotlib ezdxf -r requirements.txt
      - name: FW placement diagnostic
        run: |
          python - <<'PY'
          import json
          import fold_designer_bridge as bridge
          from ae_engine.divider_manufacturing import resolve_divider_placement_evidence, _profile_flat_band
          from tests.test_issue39_divider_relief import _snapshot, _body_part, _divider_part

          snap=_snapshot()
          body=_body_part(snap)
          divider, part=_divider_part(snap)
          world=bridge._phase6_build_joint_world_geometry(
              (body,part),(snap["w"],snap["h"],snap["d"]),snap["t"]
          )
          evidence=resolve_divider_placement_evidence(part,body,world)
          out={"placement":part.placement,"offset":part.offset,"evidence":evidence.as_dict(),"pieces":{}}
          for piece in body.render_data.pieces:
              role=str(piece.role)
              if role not in {"left_side","right_side"}:
                  continue
              key="fw_left" if role=="left_side" else "fw_right"
              band=_profile_flat_band(piece.fold_profile,phase6_key=key)
              skins=world["mapped_skin_triangles_by_part"][f"box_body:{role}"]
              pts=[]
              for skin in skins:
                  cu=sum(float(p[0]) for p in skin.flat)/3.0
                  if band[0]+1e-5 < cu < band[1]-1e-5:
                      pts.extend(tuple(map(float,p)) for p in skin.world)
              out["pieces"][role]={
                  "profile":[
                      {
                          "key":getattr(row,"phase6_key",None),
                          "material":float(row.length),
                          "formed":getattr(row,"formed_length",None),
                      }
                      for row in piece.fold_profile
                  ],
                  "fw_band":band,
                  "world_bounds":None if not pts else [
                      [min(p[i] for p in pts),max(p[i] for p in pts)] for i in range(3)
                  ],
              }
          # Stage-by-stage FW geometry evidence: flat UV -> folded local -> structure world.
          from ae_engine.assembly_geometry import folded_mesh_with_flat_uv_from_polygon, place_box_body_structure_points
          stage={}
          total_w=max(float(getattr(p,"formed_w_end",0.0)) for p in body.render_data.pieces)
          for piece in body.render_data.pieces:
              role=str(piece.role)
              if role not in {"left_side","right_side"}:
                  continue
              data=piece.render_data
              _minx,miny,_maxx,maxy=map(float,data.material.bounds)
              y_profile=({"len":maxy-miny,"core":True},)
              mapped=folded_mesh_with_flat_uv_from_polygon(
                  data.material,piece.fold_profile,y_profile,
                  fold_guides=tuple(getattr(data,"fold_guides",()) or ())
              )
              fw_name="fw_left" if role=="left_side" else "fw_right"
              band=_profile_flat_band(piece.fold_profile,phase6_key=fw_name)
              rows=[]
              for item in mapped:
                  cu=sum(float(p[0]) for p in item.flat)/3.0
                  if not (band[0]+1e-5 < cu < band[1]-1e-5):
                      continue
                  placed=place_box_body_structure_points(
                      item.local,piece,total_w=total_w,thickness=snap["t"],x_profile=piece.fold_profile
                  )
                  rows.append({
                      "flat":item.flat,
                      "local":item.local,
                      "structure":placed,
                  })
              stage[role]=rows
          print("RECEIVING_FW_STAGE_GEOMETRY="+json.dumps(stage,ensure_ascii=False))
          print("RECEIVING_FW_PLACEMENT_DIAGNOSTIC="+json.dumps(out,ensure_ascii=False))
          PY
      - name: Divider candidate replay diagnostic
        run: |
          python - <<'PY'
          import json
          import fold_designer_bridge as bridge
          from tests.test_issue39_divider_relief import _snapshot, _body_part, _divider_part

          snap=_snapshot()
          body=_body_part(snap)
          divider, divider_part=_divider_part(snap)
          solved_parts, diagnostics, joints = bridge._phase6_resolve_family_divider_reliefs(
              (body, divider_part),
              finished_dimensions=(snap["w"], snap["h"], snap["d"]),
              sheet_thickness=snap["t"],
              clearance=0.0,
          )
          solved=next(p for p in solved_parts if p.part_key==divider.stable_id)
          d=diagnostics[0]
          print("DIVIDER_REPLAY_DIAGNOSTIC="+json.dumps({
              "candidate_status":d.candidate_status,
              "illegal_penetration":d.illegal_penetration,
              "pre_pair_count":d.pre_pair_count,
              "post_pair_count":d.post_pair_count,
              "evidence":d.evidence,
              "solved_material_bounds":list(map(float,solved.render_data.material.bounds)),
              "solved_material_area":float(solved.render_data.material.area),
              "has_relief_metadata":"divider_assembly_relief" in dict(solved.render_data.metadata or {}),
          }, ensure_ascii=False, default=str))
          PY
      - name: FW formed occupation + Issue74 targeted
        run: |
          pytest -q -s \
            tests/test_issue74_divider_side_front_penetration.py
