name: Issue280 Taxonomy Relocation RED

on:
  push:
    branches:
      - test-cleanup/issue280-permanent-move-20260916
    paths:
      - '.github/workflows/issue280-taxonomy-relocation-red.yml'
      - 'tests/test_issue280_taxonomy_relocation_safety.py'
      - 'tools/test_lane_policy.py'

jobs:
  taxonomy-relocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run relocation safety contract
        run: python -m pytest -q tests/test_issue280_taxonomy_relocation_safety.py
