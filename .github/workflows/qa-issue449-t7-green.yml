name: "QA #449 T7 fix11 bootstrap GREEN"

on:
  push:
    branches:
      - refactor/issue449-t7-fix11-init-bootstrap-20260921
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue449_fix11_init_bootstrap_owner.py'
      - 'docs/superpowers/checkpoints/issue449-t7-preflight-evidence.txt'
      - 'docs/superpowers/checkpoints/issue449-t7-fix11-init-census.md'
      - '.github/workflows/qa-issue449-t7-green.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 41bf313b9389a7e98f9978c36b96380c237e57ec

jobs:
  t7:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install pytest matplotlib -r requirements.txt

      - name: Knowledge Preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "派工 #449 T7 Compress _fix11_init to bootstrap-only lifecycle seam GREEN QA：驗 FIX11_INIT_IS_BOOTSTRAP_ONLY、single composition root、Settings/FinalScene/BendingUI/Registry/Shell/PartEditor owner boundary、geometry/dataflow/persistence semantic drift = 0。" \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue449_fix11_init_bootstrap_owner.py \
            --changed-file docs/superpowers/checkpoints/issue449-t7-preflight-evidence.txt \
            --changed-file docs/superpowers/checkpoints/issue449-t7-fix11-init-census.md \
            --changed-file .github/workflows/qa-issue449-t7-green.yml \
            --evidence docs/superpowers/checkpoints/issue449-t7-preflight-evidence.txt

      - name: Exact lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/issue449-scope.txt
          python - <<'PY'
          from pathlib import Path
          paths=[x for x in Path('/tmp/issue449-scope.txt').read_text().splitlines() if x]
          allowed={
              'fold_designer_bridge.py',
              'tests/test_issue449_fix11_init_bootstrap_owner.py',
              'docs/superpowers/checkpoints/issue449-t7-preflight-evidence.txt',
              'docs/superpowers/checkpoints/issue449-t7-fix11-init-census.md',
              '.github/workflows/qa-issue449-t7-green.yml',
          }
          unexpected=sorted(set(paths)-allowed)
          assert not unexpected, f'ISSUE449_SCOPE_DRIFT={unexpected}'
          print('ISSUE449_SCOPE_DRIFT=0')
          print(f'ISSUE449_CHANGED_FILES={len(paths)}')
          PY

      - name: Compile changed Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fold_designer_bridge.py tests/test_issue449_fix11_init_bootstrap_owner.py

      - name: T7 bootstrap ownership contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue449_fix11_init_bootstrap_owner.py --tb=short | tee /tmp/issue449-owner.log
          grep -Eq '[0-9]+ passed' /tmp/issue449-owner.log
          echo 'FIX11_INIT_IS_BOOTSTRAP_ONLY=1'

      - name: Bootstrap call graph source guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path=Path('fold_designer_bridge.py')
          source=path.read_text(encoding='utf-8')
          tree=ast.parse(source)
          funcs={n.name:n for n in tree.body if isinstance(n, ast.FunctionDef)}
          root=funcs['_fix11_init']
          helpers=(
              '_phase6_bootstrap_authoritative_state',
              '_phase6_install_runtime_ports',
              '_phase6_prepare_predecessor_init',
              '_phase6_finish_legacy_host_compatibility',
              '_phase6_bootstrap_workspace_profiles',
              '_phase6_install_part_editor_compatibility',
              '_phase6_install_initial_owner_views',
              '_phase6_select_initial_mode',
              '_phase6_mark_ready',
          )
          for helper in helpers:
              assert helper in funcs
              callers=[]
              for fn in funcs.values():
                  count=sum(
                      1 for n in ast.walk(fn)
                      if isinstance(n, ast.Call)
                      and isinstance(n.func, ast.Name)
                      and n.func.id == helper
                  )
                  if count:
                      callers.append((fn.name,count))
              assert callers == [('_fix11_init',1)], (helper,callers)

          fix10_callers=[]
          for fn in funcs.values():
              count=sum(
                  1 for n in ast.walk(fn)
                  if isinstance(n, ast.Call)
                  and isinstance(n.func, ast.Name)
                  and n.func.id == '_FIX10_INIT'
              )
              if count:
                  fix10_callers.append((fn.name,count))
          assert fix10_callers == [('_fix11_init',1)], fix10_callers

          body=ast.get_source_segment(source, root) or ''
          forbidden=(
              'Phase6DesignerWorkspace.from_snapshot',
              'Phase6BendingUI(',
              'Phase6AssemblyPanel(',
              'Phase6SettingsPanel(',
              'Phase6FinalSceneView(',
              'Phase6RegistryDiagnosticsPanel(',
              'original.ttk.Frame(',
              'original.tk.StringVar(',
              'original.ttk.Treeview(',
              'original.ttk.Notebook(',
              'stable_fingerprint(',
              'clone_profile(',
          )
          found=[token for token in forbidden if token in body]
          assert not found, found
          print('BOOTSTRAP_HELPER_SINGLE_CALLER=1')
          print('FIX10_SINGLE_LIFECYCLE_CALLSITE=1')
          print('DEEP_OWNER_CONSTRUCTION_IN_ROOT=0')
          PY

      - name: Accepted T2-T6 headless owner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_issue444_bending_ui_owner.py \
            tests/test_issue445_settings_presentation_owner.py \
            tests/test_issue446_registry_diagnostics_presentation_owner.py \
            tests/test_issue447_workspace_shell_owner.py \
            tests/test_issue448_part_editor_owner_decision.py \
            tests/test_issue370_t6_final_scene_view_owner.py \
            tests/test_phase6_settings_panel_ownership.py \
            tests/test_issue365_t1_workspace_navigation_controller.py \
            tests/test_phase6_designer_workspace.py \
            tests/test_phase6_project_file.py \
            --tb=short | tee /tmp/issue449-headless.log
          grep -Eq '[0-9]+ passed' /tmp/issue449-headless.log
          echo 'ACCEPTED_OWNER_HEADLESS=GREEN'

      - name: Real Tk bootstrap and shared-slot regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest -q \
            tests/test_issue447_workspace_shell_owner.py \
            tests/test_issue448_part_editor_owner_decision.py \
            tests/test_issue431_shared_content_host.py \
            tests/test_issue439_single_physical_content_host.py \
            tests/test_issue440_no_wrapper_shell.py \
            tests/test_issue335_top_toolbar.py \
            tests/test_issue340_keyboard_focus.py \
            tests/test_phase6_designer_workspace.py \
            --tb=short | tee /tmp/issue449-xvfb.log
          grep -Eq '[0-9]+ passed' /tmp/issue449-xvfb.log
          echo 'INITIAL_MODE_SELECTION_DRIFT=0'
          echo 'SHARED_CONTENT_MOUNT_DRIFT=0'
          echo 'LEGACY_HOST_COMPATIBILITY_DRIFT=0'

      - name: Manufacturing and DXF focused guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dxf_acceptance.py \
            tests/test_resolved_manufacturing_geometry.py \
            tests/test_resolved_manufacturing_export.py \
            --tb=short | tee /tmp/issue449-manufacturing.log
          grep -Eq '[0-9]+ passed' /tmp/issue449-manufacturing.log
          echo 'MANUFACTURING_DXF=GREEN'

      - name: Protected owner and Git-object invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -e phase6_workspace_shell.py
          test ! -e phase6_part_editor_session.py
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            phase6_bending_ui.py \
            phase6_settings_panel.py \
            phase6_registry_diagnostics_panel.py \
            phase6_registry_diagnostics_controller.py \
            phase6_final_scene_view.py \
            phase6_designer_workspace.py \
            phase6_workspace_navigation_controller.py \
            phase6_workspace_state.py \
            phase6_project_controller.py \
            phase6_project_file.py \
            phase6_project_session.py \
            gui_modules/application/command_router.py \
            gui_modules/application/fold_designer_adapter.py \
            ae_engine \
            config.ini \
            '*.dxf'
          echo 'ACCEPTED_OWNER_DRIFT=0'
          echo 'PROJECT_PERSISTENCE_OWNERSHIP_DRIFT=0'
          echo 'GEOMETRY_OWNER_DRIFT=0'
          echo 'DXF_DRIFT=0'
          echo 'CONFIG_GIT_OBJECT_INVARIANT=1'
          echo 'WORKSPACE_SHELL_DECISION_PRESERVED=NO_EXTRACTION'
          echo 'PART_EDITOR_DECISION_PRESERVED=C_KEEP_BRIDGE_COMPATIBILITY'

      - name: Bounded acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo "ISSUE=449"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "BASE_SHA=$BASE_SHA"
            echo "FIX11_INIT_IS_BOOTSTRAP_ONLY=1"
          } >> "$GITHUB_STEP_SUMMARY"
