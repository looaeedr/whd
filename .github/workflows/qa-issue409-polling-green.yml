name: "QA #409 Polling observation GREEN"

on:
  push:
    branches:
      - continuity/issue409-polling-observation-only-20260920
    paths:
      - '.agents/skills/engineering/executable-continuity-controller/SKILL.md'
      - '.agents/skills/engineering/monitoring-remote-qa/SKILL.md'
      - '.agents/skills/engineering/執行開發任務/SKILL.md'
      - '個人AI檔案庫/第二層_專案與SOP/11_WHD_Scheduled_Resume_ChatGPT自動續跑規則.md'
      - '個人AI檔案庫/踩坑庫/continuous_execution_pitfalls.md'
      - 'tests/process/test_issue409_polling_observation_only_contract.py'
      - '.github/workflows/qa-issue409-polling-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install pytest
      - name: Polling observation-only contract
        run: python -m pytest -q tests/process/test_issue409_polling_observation_only_contract.py --tb=short
      - name: Heartbeat and terminal-report regressions
        run: |
          python -m pytest -q tests/process/test_issue406_scheduled_progress_heartbeat_contract.py tests/process/test_issue408_immediate_terminal_report_contract.py --tb=short
      - name: Continuity regressions
        run: python -m pytest -q tests/process/test_continuity_controller.py tests/process/test_continuous_execution_durable_contract.py --tb=short
      - name: Scope
        run: |
          set -euo pipefail
          git diff --check 1727f93bc069e2c40a97258016aa523487243ef8...HEAD
          git diff --name-only 1727f93bc069e2c40a97258016aa523487243ef8...HEAD | tee /tmp/files.txt
          test "$(grep -Ec '^(gui.py|fold_designer_bridge.py|gui_modules/|ae_engine/|config.ini|基準檔/)' /tmp/files.txt || true)" -eq 0
          echo "PASS POLLING_OBSERVATION_ONLY=1"
          echo "PASS REAL_PROGRESS_PRODUCER_GATE=1"
          echo "PASS PROTECTED_DRIFT=0"
