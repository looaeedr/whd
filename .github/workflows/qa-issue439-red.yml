name: "QA #439 single physical content host GREEN"

on:
  push:
    branches:
      - fix/issue439-single-physical-content-host-20260920
    paths:
      - 'fold_designer_bridge.py'
      - 'tests/test_issue430_single_host_red.py'
      - 'tests/test_issue431_shared_content_host.py'
      - 'tests/test_issue432_general_part_shared_host.py'
      - 'tests/test_issue433_assembly_shared_host.py'
      - 'tests/test_issue434_corner_data_shared_host.py'
      - 'tests/test_issue435_switch_lifecycle_guards.py'
      - 'tests/test_issue439_single_physical_content_host.py'
      - 'tests/test_phase6_latest_layout_contract.py'
      - '.github/workflows/qa-issue439-red.yml'
      - 'docs/superpowers/checkpoints/issue439-preflight-evidence.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf

      - name: Knowledge preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #439 correction remove extra physical shared_content_host Frame; reuse fold_editor_host as the sole physical content host; input content Assembly and Corner Data are mutually exclusive children; outer bbox x/y/width/height identical across modes; preserve geometry persistence callbacks visibility semantics." \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue439_single_physical_content_host.py \
            --changed-file .github/workflows/qa-issue439-red.yml \
            --evidence docs/superpowers/checkpoints/issue439-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Source ownership guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path("fold_designer_bridge.py").read_text(encoding="utf-8")
          assert "self.shared_content_host = original.ttk.Frame(self.left)" not in source
          assert "self.shared_content_host = self.fold_editor_host" in source
          assert "self.fold_editor_host = original.ttk.Frame(self.left)" in source
          assert "self.input_content_host = original.ttk.Frame(self.fold_editor_host)" in source
          assert "Phase6AssemblyPanel(\n        self.fold_editor_host," in source
          print("EXTRA_SHARED_CONTENT_FRAME_COUNT=0")
          print("SHARED_CONTENT_HOST_IS_FOLD_EDITOR_HOST=1")
          print("FOLD_EDITOR_HOST_DIRECT_PARENT_IS_LEFT=1")
          PY

      - name: Run focused shared-host regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue439
          xvfb-run -a python -m pytest -q \
            tests/test_issue430_single_host_red.py \
            tests/test_issue431_shared_content_host.py \
            tests/test_issue432_general_part_shared_host.py \
            tests/test_issue433_assembly_shared_host.py \
            tests/test_issue434_corner_data_shared_host.py \
            tests/test_issue435_switch_lifecycle_guards.py \
            tests/test_issue439_single_physical_content_host.py \
            tests/test_phase6_latest_layout_contract.py \
            --tb=short --json-report --json-report-file=.scratch/issue439/report.json \
            | tee .scratch/issue439/pytest.log
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".scratch/issue439/report.json").read_text())
          outcomes={row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          failed={n for n,o in outcomes.items() if o=="failed"}
          skipped={n for n,o in outcomes.items() if o=="skipped"}
          assert not failed, failed
          assert not skipped, skipped
          print(f"FOCUSED_PASS_COUNT={sum(o=='passed' for o in outcomes.values())}")
          print("EXTRA_SHARED_CONTENT_FRAME_COUNT=0")
          print("SHARED_CONTENT_HOST_IS_FOLD_EDITOR_HOST=1")
          print("FOLD_EDITOR_HOST_DIRECT_PARENT_IS_LEFT=1")
          print("INPUT_CONTENT_HOST_PARENT_IS_FOLD_EDITOR_HOST=1")
          print("ASSEMBLY_PANEL_PARENT_IS_FOLD_EDITOR_HOST=1")
          print("CORNER_DATA_PANEL_PARENT_IS_FOLD_EDITOR_HOST=1")
          print("OUTER_CONTENT_BBOX_IDENTICAL_ALL_MODES=1")
          print("ACTIVE_INNER_CONTENT_TREE_COUNT=1")
          print("SEPARATE_ASSEMBLY_REGION=0")
          print("SEPARATE_CORNER_DATA_REGION=0")
          print("DUPLICATE_WIDGET_TREE=0")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue439-green
          path: .scratch/issue439
