name: "QA #439 single physical content host RED"

on:
  push:
    branches:
      - fix/issue439-single-physical-content-host-20260920
    paths:
      - 'tests/test_issue439_single_physical_content_host.py'
      - '.github/workflows/qa-issue439-red.yml'
      - 'docs/superpowers/checkpoints/issue439-preflight-evidence.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -r requirements.txt pytest pytest-json-report matplotlib numpy shapely ezdxf

      - name: Knowledge preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase6_skill_preflight.py \
            --task "Issue #439 correction remove extra physical shared_content_host Frame; reuse fold_editor_host as the sole physical content host; verify outer bbox x/y/width/height identical across modes; preserve geometry persistence callbacks visibility Assembly and Corner Data semantics." \
            --changed-file fold_designer_bridge.py \
            --changed-file tests/test_issue439_single_physical_content_host.py \
            --changed-file .github/workflows/qa-issue439-red.yml \
            --evidence docs/superpowers/checkpoints/issue439-preflight-evidence.txt
          echo "KNOWLEDGE_PREFLIGHT_RC=0"

      - name: Require no production runtime edit before RED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 719f4509371376f9d01fca97553b5199963de4c6:fold_designer_bridge.py)" = "$(git rev-parse HEAD:fold_designer_bridge.py)"
          echo "PRODUCTION_RUNTIME_EDIT_BEFORE_RED=0"

      - name: Run exact intended RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/issue439
          set +e
          xvfb-run -a python -m pytest -q tests/test_issue439_single_physical_content_host.py \
            --tb=short --json-report --json-report-file=.scratch/issue439/report.json \
            > .scratch/issue439/pytest.log 2>&1
          rc=$?
          set -e
          cat .scratch/issue439/pytest.log
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".scratch/issue439/report.json").read_text())
          outcomes={row["nodeid"]:row.get("outcome") for row in data.get("tests",[])}
          failed={n for n,o in outcomes.items() if o=="failed"}
          expected={
              "tests/test_issue439_single_physical_content_host.py::test_issue439_original_input_host_is_the_only_physical_content_host",
              "tests/test_issue439_single_physical_content_host.py::test_issue439_outer_input_host_never_switches_and_keeps_one_physical_bbox",
          }
          assert failed == expected, (failed, expected)
          assert not {n for n,o in outcomes.items() if o=="skipped"}
          print("ISSUE439_INTENDED_RED=1")
          print("EXTRA_SHARED_CONTENT_FRAME_DETECTED=1")
          print("OUTER_CONTENT_BBOX_MODE_DRIFT_DETECTED=1")
          PY
          test "$rc" -ne 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue439-red
          path: .scratch/issue439
