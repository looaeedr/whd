name: "QA #416 Phase 5 T1 derived topology"

on:
  push:
    branches:
      - refactor/issue416-phase5-t1-derived-topology-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install focused dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Syntax
        run: python -m py_compile phase6_derived_topology.py fold_designer_bridge.py
      - name: T1 ownership contracts
        run: python -m pytest -q tests/test_issue416_phase5_derived_topology.py --tb=short
      - name: Focused derived-topology regressions
        run: |
          python -m pytest -q             tests/test_dm7_part_navigation.py             tests/test_issue44_box_body_physical_piece_identity.py             tests/test_phase6_linked_fold_chain_and_parts.py             tests/test_phase6_receiving_projection_regression.py             tests/test_door_layout_asymmetric_contract.py             tests/test_phase6_t03_piece_dimensions.py             --tb=short
      - name: Protected Phase 4 drift
        shell: bash
        run: |
          set -euo pipefail
          PRE=be0a360c099d146a7d09889d6155a5b9d5a91e19
          git diff --exit-code "$PRE" HEAD --             config.ini             phase6_settings_contracts.py             phase6_settings_transitions.py             phase6_settings_service.py             phase6_settings_transaction_controller.py             phase6_final_scene_contracts.py             phase6_final_scene_projection.py             phase6_final_scene_renderer.py             phase6_final_scene_view.py             phase6_manufacturing_cache.py             phase6_manufacturing_contracts.py             phase6_manufacturing_geometry.py             phase6_manufacturing_service.py             phase6_manufacturing_adapter.py
          echo "ISSUE416_T1_PROTECTED_DRIFT=0"
      - name: Bridge ownership metrics
        run: |
          python - <<'PY'
          import ast, re
          from pathlib import Path
          p=Path("fold_designer_bridge.py")
          s=p.read_text(encoding="utf-8")
          t=ast.parse(s)
          top=[n for n in t.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))]
          phase=[n for n in top if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name.startswith("_phase6_")]
          self_refs=re.findall(r"\bself\.([A-Za-z_][A-Za-z0-9_]*)",s)
          print(f"BRIDGE_LINES={len(s.splitlines())}")
          print(f"BRIDGE_TOP_LEVEL={len(top)}")
          print(f"BRIDGE_PHASE6_DEFS={len(phase)}")
          print(f"BRIDGE_SELF_REFS={len(self_refs)}")
          assert len(s.splitlines()) < 9459
          assert len(phase) < 286
          print("ISSUE416_T1_OWNERSHIP_GREEN=1")
          PY
