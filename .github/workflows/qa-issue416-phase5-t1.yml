name: "QA #416 Phase 5 T1 derived topology"

on:
  push:
    branches:
      - refactor/issue416-phase5-t1-derived-topology-20260920
  pull_request:
    branches:
      - cleanup/2d-3d-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install focused dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-tk
          python -m pip install pytest matplotlib -r requirements.txt
      - name: Prove intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_issue416_phase5_derived_topology.py --tb=short > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -F "No module named 'phase6_derived_topology'" /tmp/red.log
          echo "ISSUE416_T1_EXPECTED_RED=1"
